# Repository-backed TrueFit program contract (scheduler must not hardcode product logic).
program:
  program_id: truefit
  name: TrueFit
  owner: truefit-workstream
  repository: jerry200176-png/AllTrue_System
  goal: "Continue TrueFit v0.1 — Slice 1 AI Teacher Brief (structured data), flag-gated"
  canonical_status_source: docs/truefit/PROGRAM_STATUS.md
  allowed_scope:
    - frontend/src/pages/TrueFit*
    - frontend/src/lib/truefit*
    - backend/app/Http/Controllers/TrueFit*
    - backend/app/Services/TrueFit*
    - docs/truefit/**
    - scripts/tests/**TrueFit*
  protected_scope:
    - backend/app/Services/SessionDeduction*
    - backend/app/Http/Controllers/Billing*
    - backend/app/Http/Controllers/Auth*
    - backend/database/migrations/**
  current_milestone: "slice-1-teacher-brief"
  blockers: []
  dependencies:
    - platform-staging
  stop_conditions:
    - production_flag_enable_without_founder
    - real_student_pii_to_external_llm
    - billing_or_attendance_mutation
  acceptance_contract:
    - designed_vertical_slice
    - flag_default_off
    - tests_green
    - pr_ci_green
    - no_protected_scope_touch

candidate_tasks:
  - task_id: TF-S1-A
    outcome: "Teacher Brief structured contract + fixture provider (no production LLM)"
    scope:
      - docs/truefit/**
      - frontend/src/lib/truefit*
      - scripts/tests/**
    non_scope:
      - production LLM credentials
      - real student PII
      - billing
    dependencies: []
    risk_declaration: R1
    affected_contracts: []
    affected_paths:
      - docs/truefit/PROGRAM_STATUS.md
      - scripts/tests/test_harness_smoke_truefit_docs.py
    status: READY
    business_value: 90
    reversible: true
    designed_slice: true
    next_action: "plan_worker_goal"

  - task_id: TF-S0-STAGING-ACCEPT
    outcome: "Staging smoke acceptance for Slice 0 shell"
    scope:
      - docs/truefit/**
    non_scope:
      - production activation
    dependencies:
      - TF-S1-A
    risk_declaration: R1
    affected_contracts:
      - deployment
    affected_paths:
      - docs/truefit/PROGRAM_STATUS.md
    status: BLOCKED
    blocker: "platform-staging not real enough for acceptance"
    business_value: 80
    reversible: true
    designed_slice: true
    next_action: "wait_platform_staging"
