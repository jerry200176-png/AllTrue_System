    outcome: "Docs/status reconciliation for open in-app queue (low-risk dogfood)"
    scope:
      - docs/CHAT_BUG_SYSTEM.md
      - docs/harness/**
    non_scope:
      - production mutation
      - billing
    dependencies: []
    risk_declaration: R0
    affected_contracts: []
    affected_paths:
      - docs/harness/HARNESS_STATUS.md
    status: READY
    business_value: 70
    reversible: true
    designed_slice: true
    next_action: "dispatch_when_h7"
