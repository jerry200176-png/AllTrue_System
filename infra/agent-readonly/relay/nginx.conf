# Include in the http block on the approved managed relay host only.
map $ssl_client_fingerprint $alltrue_read_caller {
    default 0;
    include /etc/alltrue-read-relay/callers.conf;
}

map $request_uri $alltrue_read_path {
    default 0;
    "~^/api/v1/triage/db(/[A-Za-z][A-Za-z0-9_]{0,63})?(\?.*)?$" 1;
}

log_format alltrue_read_relay '$time_iso8601 $ssl_client_fingerprint $status $request_time';
limit_req_zone $ssl_client_fingerprint zone=alltrue_read_requests:1m rate=60r/m;

server {
    listen 127.0.0.1:8443 ssl;
    server_name _;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/alltrue-read-relay/server.crt;
    ssl_certificate_key /etc/alltrue-read-relay/server.key;
    ssl_client_certificate /etc/alltrue-read-relay/client-ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_session_tickets off;
    keepalive_timeout 0;

    access_log /var/log/nginx/alltrue-read-relay.log alltrue_read_relay;
    error_log /dev/null;
    ssl_session_cache off;
    add_header Cache-Control "no-store" always;

    location / {
        if ($alltrue_read_caller = 0) { return 403; }
        if ($request_method != GET) { return 405; }
        if ($alltrue_read_path = 0) { return 404; }

        limit_req zone=alltrue_read_requests burst=8 nodelay;
        limit_req_status 429;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host daan.lifenet.com.tw;
        proxy_set_header Accept application/json;
        proxy_set_header Content-Length "";
        include /etc/alltrue-read-relay/upstream-auth.conf;

        proxy_ssl_server_name on;
        proxy_ssl_name daan.lifenet.com.tw;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_buffering off;
        proxy_cache off;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_pass https://daan.lifenet.com.tw;
    }
}
