# This profile runs only in the approved private gateway service runtime.
[[sources]]
id = "daan_tuition"
dsn = "${ALLTRUE_DAAN_TUITION_DSN}"
connection_timeout = 10
query_timeout = 5

[[tools]]
name = "daan_tuition_scope"
description = "Verify the Daan campus and accounting cutoff."
source = "daan_tuition"
statement = "SELECT campus_id, campus_code, CAST(cutoff_exclusive AS CHAR) AS cutoff_exclusive, CAST(UTC_TIMESTAMP() AS CHAR) AS read_at_utc FROM daan_tuition_scope"
readonly = true
max_rows = 1

[[tools]]
name = "daan_tuition_contracts"
description = "Read Daan tuition contracts and verified package membership."
source = "daan_tuition"
statement = "SELECT id, campus_id, student_id, charge, paid, schedule_mode, package_id, package_paid, package_link_uncertain, CAST(start_date AS CHAR) AS start_date, CAST(end_date AS CHAR) AS end_date, CAST(updated_at AS CHAR) AS updated_at FROM daan_tuition_contracts WHERE id > ? ORDER BY id LIMIT 200"
readonly = true
max_rows = 200
[[tools.parameters]]
name = "after_id"
type = "integer"
description = "Last row ID from the preceding page; use 0 to start."

[[tools]]
name = "daan_tuition_invoices"
description = "Read Daan tuition bill headers."
source = "daan_tuition"
statement = "SELECT id, campus_id, student_id, contract_id, contract_link_uncertain, billing_period, amount, stored_paid_amount, status, CAST(issue_date AS CHAR) AS issue_date, CAST(created_at AS CHAR) AS created_at, CAST(updated_at AS CHAR) AS updated_at FROM daan_tuition_invoices WHERE id > ? ORDER BY id LIMIT 200"
readonly = true
max_rows = 200
[[tools.parameters]]
name = "after_id"
type = "integer"
description = "Last row ID from the preceding page; use 0 to start."

[[tools]]
name = "daan_tuition_invoice_items"
description = "Read Daan tuition bill lines."
source = "daan_tuition"
statement = "SELECT id, campus_id, invoice_id, contract_id, amount, contract_link_uncertain, standalone_count_line, CAST(period_start AS CHAR) AS period_start, CAST(period_end AS CHAR) AS period_end FROM daan_tuition_invoice_items WHERE id > ? ORDER BY id LIMIT 200"
readonly = true
max_rows = 200
[[tools.parameters]]
name = "after_id"
type = "integer"
description = "Last row ID from the preceding page; use 0 to start."

[[tools]]
name = "daan_tuition_payments"
description = "Read recorded Daan payments, including later activity on in-scope bills."
source = "daan_tuition"
statement = "SELECT id, campus_id, student_id, invoice_id, report_id, amount, report_link_uncertain, method, receipt_move_uncertain, CAST(receipt_moved_at AS CHAR) AS receipt_moved_at, CAST(paid_at AS CHAR) AS paid_at, CAST(created_at AS CHAR) AS created_at, CAST(updated_at AS CHAR) AS updated_at FROM daan_tuition_payments WHERE id > ? ORDER BY id LIMIT 200"
readonly = true
max_rows = 200
[[tools.parameters]]
name = "after_id"
type = "integer"
description = "Last row ID from the preceding page; use 0 to start."

[[tools]]
name = "daan_tuition_reports"
description = "Read Daan tuition payment report and receipt evidence."
source = "daan_tuition"
statement = "SELECT id, campus_id, student_id, contract_id, invoice_id, payment_id, contract_link_uncertain, invoice_link_uncertain, payment_link_uncertain, billing_period, amount, status, CAST(payment_date AS CHAR) AS payment_date, CAST(created_at AS CHAR) AS created_at, CAST(updated_at AS CHAR) AS updated_at, CAST(confirmed_at AS CHAR) AS confirmed_at, CAST(voided_at AS CHAR) AS voided_at FROM daan_tuition_reports WHERE id > ? ORDER BY id LIMIT 200"
readonly = true
max_rows = 200
[[tools.parameters]]
name = "after_id"
type = "integer"
description = "Last row ID from the preceding page; use 0 to start."
