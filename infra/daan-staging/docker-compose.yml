# AllTrue Daan staging — isolated from Pi production and from Dify/Hermes.
# Fixed project name so this stack never collides with root docker-compose.yml.
name: alltrue-stage

services:
  app:
    build:
      context: ../../backend
      dockerfile: ../infra/daan-staging/Dockerfile
    image: alltrue-stage-app:local
    container_name: alltrue-stage-app
    restart: "no"
    env_file:
      - .env
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${STAGING_DB_DATABASE:-alltrue_stage}
      DB_USERNAME: ${STAGING_DB_USERNAME:-alltrue_stage}
      DB_PASSWORD: ${STAGING_DB_PASSWORD:?set STAGING_DB_PASSWORD in infra/daan-staging/.env}
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
    volumes:
      - ../../backend:/var/www
      - stage-app-storage:/var/www/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - stage
    mem_limit: 512m
    memswap_limit: 768m
    cpus: 1.0

  nginx:
    image: nginx:1.25-alpine
    container_name: alltrue-stage-nginx
    restart: "no"
    # Localhost-only — access via SSH tunnel. Never publish 0.0.0.0.
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ../../backend:/var/www:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - stage
    mem_limit: 64m
    memswap_limit: 96m
    cpus: 0.25

  mysql:
    image: mysql:8.0
    container_name: alltrue-stage-mysql
    restart: "no"
    environment:
      MYSQL_DATABASE: ${STAGING_DB_DATABASE:-alltrue_stage}
      MYSQL_USER: ${STAGING_DB_USERNAME:-alltrue_stage}
      MYSQL_PASSWORD: ${STAGING_DB_PASSWORD:?set STAGING_DB_PASSWORD in infra/daan-staging/.env}
      MYSQL_ROOT_PASSWORD: ${STAGING_MYSQL_ROOT_PASSWORD:?set STAGING_MYSQL_ROOT_PASSWORD in infra/daan-staging/.env}
    volumes:
      - stage-mysql-data:/var/lib/mysql
    # No host port publish — avoids conflict with host MySQL on 127.0.0.1:3306.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s
    networks:
      - stage
    mem_limit: 512m
    memswap_limit: 768m
    cpus: 1.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=50

networks:
  stage:
    name: alltrue-stage-net
    driver: bridge

volumes:
  stage-mysql-data:
    name: alltrue-stage-mysql-data
  stage-app-storage:
    name: alltrue-stage-app-storage
