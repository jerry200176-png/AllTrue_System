# HTTP basic auth (users founder, preview-proxy; file generated on the host by lifecycle/gen-basic-auth.sh).
# The SPA sends its own `Authorization: Bearer` on API calls, so API paths that need a login token skip
# basic auth ONLY when a Bearer header is present; every unauthenticated API entry point stays gated.
map $http_authorization $bearer_present { default 0; "~^Bearer\s" 1; }
map $uri $public_api { default 0; "~^/api/v1/(auth/(login|login/choose|forgot-password)|parent/(login|login-line|telegram-bind-code|resolve-liff)|branches|subjects-public|admission-inquiries|line/|telegram/)" 1; }
map "$bearer_present$public_api" $auth_realm { "10" off; default "AllTrue staging"; }

server {
    listen 80;
    server_name _;

    # SPA (built into the web image) at /, Laravel API at /api via PHP-FPM.
    root /srv/web;
    index index.html;
    charset utf-8;

    auth_basic $auth_realm;
    auth_basic_user_file /etc/nginx/htpasswd;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Local health checks stay open.
    location = /api/v1/health {
        auth_basic off;
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    location /api/ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_buffering on;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 16k;
        fastcgi_read_timeout 300;
    }

    location = /index.html { add_header Cache-Control "no-cache"; }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    client_max_body_size 64M;

}
