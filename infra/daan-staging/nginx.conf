# Cookie gate. /__gate (basic auth, user `founder`) sets a cookie holding a host-generated secret; everything else needs
# that cookie, so the app's own `Authorization: Bearer` header is never touched. gate.conf (maps $gate_secret/$gate_ok)
# is generated on the host by lifecycle/gen-basic-auth.sh and is not in git.
include /etc/nginx/gate.conf;

server {
    listen 80;
    server_name _;

    # SPA (built into the web image) at /, Laravel API at /api via PHP-FPM.
    root /srv/web;
    index index.html;
    charset utf-8;

    # `return` runs before the access phase, so the basic-auth check must happen first: try_files falls through to @gate_done only if auth passed.
    absolute_redirect off;
    location = /__gate {
        auth_basic "AllTrue staging";
        auth_basic_user_file /etc/nginx/htpasswd;
        try_files /__gate_none @gate_done;
    }
    location @gate_done {
        add_header Set-Cookie "alltrue_staging_gate=$gate_secret; Path=/; Max-Age=2592000; Secure; HttpOnly; SameSite=Lax" always;
        return 302 /;
    }

    location / {
        if ($gate_ok = 0) { return 302 /__gate; }
        try_files $uri $uri/ /index.html;
    }

    # Local health checks stay open.
    location = /api/v1/health {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    location /api/ {
        if ($gate_ok = 0) { return 401; }
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_buffering on;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 16k;
        fastcgi_read_timeout 300;
    }

    location = /index.html { add_header Cache-Control "no-cache"; }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    client_max_body_size 64M;

}
