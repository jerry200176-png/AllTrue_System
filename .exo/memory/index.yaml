- id: FM-20260829-225008-SX58
  name: Vue template accessibility contract test failed before checking product behavior
  detection:
    signal: Vue template accessibility contract test failed before checking product
      behavior
    source: reflection:REF-20260829-225008-U1RJ
  mitigation:
    practice: When adding a static contract for multiline Vue button tags, verify
      the regex against the actual source before interpreting a zero-match failure;
      run the targeted Vitest from frontend so Vite Vue transforms are loaded.
- id: FM-20260829-230724-HW6W
  name: Static Vue accessibility contracts misread opening tags when attribute expressions
    contain greater-than operators
  detection:
    signal: Static Vue accessibility contracts misread opening tags when attribute
      expressions contain greater-than operators
    source: reflection:REF-20260829-230724-T7WR
  mitigation:
    practice: For Vue template button contracts, a regex that stops at the first greater-than
      character can truncate v-if expressions such as count > 0 and create false missing-type
      failures. Match complete button elements or use a Vue-aware parser, and verify
      the contract against the actual source before diagnosing product behavior.
- id: FM-20260829-210837-JIC3
  name: inline Markdown backticks in gh --body commands
  detection:
    signal: inline Markdown backticks in gh --body commands
    source: reflection:REF-20260829-210837-Q2BN
  mitigation:
    practice: Use a body file or a subprocess argument array for GitHub comments;
      shell command substitution can corrupt evidence text even when no production
      action is intended.
  severity: medium
  frequency: recurring
- id: FM-20260830-050305-3XW7
  name: UI simplification removed a disclosure but its E2E test still clicked the
    deleted selector
  detection:
    signal: UI simplification removed a disclosure but its E2E test still clicked
      the deleted selector
    source: reflection:REF-20260830-050305-ODRN
  mitigation:
    practice: When a workflow intentionally removes a progressive-disclosure block,
      update its E2E contract in the same change to assert the block is absent and
      no obsolete lazy-fetch occurs; do not restore removed UI just to satisfy stale
      tests.
  severity: medium
  frequency: recurring
- id: FM-20260830-061636-CA43
  name: 'calendar #247 report current payload healthy but historical picker failure
    not reproducible'
  detection:
    signal: 'calendar #247 report current payload healthy but historical picker failure
      not reproducible'
    source: reflection:REF-20260830-061636-JCWQ
  mitigation:
    practice: 'For scheduling UI bugs, preserve the triaged state when read-only availability
      and booking checks are healthy: pin the exact production tuple as a regression
      test, keep capacity semantics unchanged, and require a captured failing payload/caller
      context before a runtime fix.'
  severity: medium
  frequency: recurring
- id: FM-20260830-062448-KRGI
  name: backend feature tests blocked at RefreshDatabase by local MySQL credential
  detection:
    signal: backend feature tests blocked at RefreshDatabase by local MySQL credential
    source: reflection:REF-20260830-062448-II7Y
  mitigation:
    practice: Keep backend contract tests governed and let GitHub CI provide database-backed
      evidence when local MySQL admin@localhost credentials are unavailable; record
      the environment failure separately and never weaken RefreshDatabase or bypass
      the test.
  severity: medium
  frequency: recurring
- id: FM-20260831-004859-VQKH
  name: Disclosure header wraps a separate native button
  detection:
    signal: Disclosure header wraps a separate native button
    source: reflection:REF-20260831-004859-6RV5
  mitigation:
    practice: Use one native button as the disclosure control, keep the controlled
      panel mounted with v-show, and expose aria-expanded plus aria-controls; never
      leave the parent container clickable around the button.
  severity: low
  frequency: recurring
- id: FM-20260831-010449-G4BI
  name: Styled label hides the student import file input
  detection:
    signal: Styled label hides the student import file input
    source: reflection:REF-20260831-010449-IM1T
  mitigation:
    practice: Use a visible native button to trigger a visually clipped file input
      via ref; keep the existing change handler and API, and give the button an explicit
      accessible name so keyboard users do not depend on a non-focusable label.
  severity: low
  frequency: recurring
- id: FM-20260831-012442-A29G
  name: Attendance pending-session checkboxes lacked row context
  detection:
    signal: Attendance pending-session checkboxes lacked row context
    source: reflection:REF-20260831-012442-LQEB
  mitigation:
    practice: In high-frequency batch workflows, every repeated selection control
      needs a session-specific accessible name that combines the visible person, time,
      and optional subject. Keep desktop and mobile markup aligned, preserve the existing
      checked binding and change handler, and cover both rendered variants in one
      focused contract.
  severity: medium
  frequency: recurring
