id: REF-20260829-230724-T7WR
pattern: Static Vue accessibility contracts misread opening tags when attribute expressions
  contain greater-than operators
insight: For Vue template button contracts, a regex that stops at the first greater-than
  character can truncate v-if expressions such as count > 0 and create false missing-type
  failures. Match complete button elements or use a Vue-aware parser, and verify the
  contract against the actual source before diagnosing product behavior.
