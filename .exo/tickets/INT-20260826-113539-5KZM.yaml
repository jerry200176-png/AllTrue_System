id: INT-20260826-113539-5KZM
title: Improve in-app bug report image attachment UX
intent: Improve in-app bug report image attachment UX
kind: intent
brain_dump: AllTrue in-app bug reports currently require saving a screenshot before
  selecting it from a file. Support direct clipboard image paste, drag-and-drop, and
  normal file selection, with clear preview/remove/retry states and secure client/server
  limits. Reference mature enterprise products and maintained open source; ship through
  CI and deploy.yml.
boundary: Do not change bug lifecycle permissions, status transitions, storage authorization,
  or unrelated chat behavior; do not alter production data.
success_condition: A logged-in bug reporter can paste a clipboard image directly into
  the report composer, drag an image onto the attachment area, or choose a file; the
  image appears as a preview, can be removed before submit, invalid/oversize files
  are rejected clearly, multipart submission remains compatible, tests cover the interactions
  and limits, and the deployed production build is verified.
