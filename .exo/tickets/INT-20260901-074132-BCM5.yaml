title: Calendar progressive disclosure filters
intent: Calendar progressive disclosure filters
kind: intent
brain_dump: Reduce SmartCalendar cognitive load by keeping date and view controls
  primary and placing secondary filters/actions behind an explicit disclosure panel.
  Preserve calendar data, scheduling, capacity, leave, permissions, and API behavior.
