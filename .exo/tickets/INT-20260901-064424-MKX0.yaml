title: Make in-app bug submissions traceable
intent: Make in-app bug submissions traceable
kind: intent
brain_dump: 'Improve the in-app bug loop: after a reporter submits a bug, show a durable
  acknowledgement with the newly created report number and a direct action to view
  its progress. Preserve existing report fields, attachment behavior, permissions,
  and API contract; do not change lifecycle transitions or production data.'
boundary: Only change the staff bug-report launcher, its focused frontend regression
  tests, App navigation wiring, release notes, and governance artifacts. Do not change
  bug lifecycle permissions, backend status transitions, attachment storage, auth,
  billing, or production data.
success_condition: A successful submission visibly shows the persisted bug number
  and a View report progress action; the action opens the existing bugs page; cancel/submit
  error behavior and existing payload remain unchanged; focused and full frontend
  checks pass.
