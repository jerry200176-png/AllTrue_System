  production activation requires Founder GO. Use existing deploy/control-plane architecture,
  no new release platform. Verify current trigger, implement smallest safe change,
  add regression coverage, report tiers, state machine, Founder boundary, PR/head/checks,
  and any live workflow/ruleset approval requirement. Do not deploy or modify production
  data.
