id: TKT-20260901-011500-PRL
title: Deliver Backer parity payroll path with AllTrue-specific UI
intent: Complete the existing full-time payroll calculation path after the weekly 16-segment release, while keeping AllTrue's director UI focused on payroll decisions instead of copying Backer fields.
kind: task
brain_dump: Reuse existing AllTrue payroll sources and composer. Align deterministic Backer rounding and complete/partial classification. Remove fixed-salary presentation from the AllTrue page without deleting the salary source used for payout calculation. Add an auditable manual teacher multiplier control; do not guess unresolved Backer manual adjustment semantics or create a second payroll system.
boundary: Change the existing teacher eligibility/payroll controller, composer, tests, and director-facing TeacherEligibilityPage plus release notes. No duplicate payroll tables, no production data repair, and no activation until governed checks and required CI pass.
success_condition: A normal employee/month with sufficient source data produces a complete payout; weekly eligibility remains based on valid ClassSession attendance; fixed salary is not shown in the director UI; manual multiplier is explicit and auditable; genuinely missing inputs remain partial/blocked.
