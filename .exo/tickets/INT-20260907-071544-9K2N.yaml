title: Improve mobile More navigation search
intent: Improve mobile More navigation search
kind: intent
brain_dump: AllTrue mobile More sheet renders the role-scoped navigation registry
  but has no search, while the desktop More surface already supports search and Ctrl/Cmd+K.
  Add a mobile-only search/filter interaction and honest empty state without changing
  navigation authorization, page IDs, API contracts, or data.
boundary: Do not change backend, API contracts, permissions, page registry semantics,
  auth, data, billing, attendance, or deployment workflows. Keep desktop behavior
  and mobile primary tabs unchanged.
