# AllTrue Production Operations Catalog
# Authority: ADR-POP-005 | Phase 2: approved catalog operations execute via Pi-local POP
version: 1

operations:
  course-contract-repair:
    lifecycle: active
    domain: billing-entitlement
    business_owner: director-data
    technical_owner: platform-data
    owner: platform-ops
    approver_roles: [director, super_admin]
    approval_policy: critical-dual-approval
    runbook: docs/OPERATIONS_RUNBOOK.md
    alert_group: LINE:ops-data
    escalation_policy: billing-entitlement-critical-escalation
    capabilities: [repair, plan, dry_run, verify, rollback, snapshot, audit]
    risk: critical
    reversible: true
    snapshot_required: true
    transaction_required: true
    rollback_supported: true
    verification_required: true
    approval_required: true
    execution_authority: pop-pi-local
    blast_radius: single_student_contract
    estimated_duration: 5m
    invariant_packs: [billing-entitlement-pack@1.0.0]
    strategy_class: App\Operations\Strategies\CourseContractRepairStrategy
    parameter_keys: [student_id, campus_id, subject_id, source_student_class_id, target_student_class_id, preserve_session_ids, transfer_session_ids, session_expectations, expected_source_charge, expected_target_charge, source_charge, target_charge, source_invoice_id, target_invoice_id, expected_source_invoice_total, expected_target_invoice_total, reason, decision_reference]
    tags: [repair, contract, entitlement, billing]
    notes: Founder-approved operation; execution is fail-closed to this exact catalog and deployed commit.

  supersede-renewal:
    lifecycle: active
    domain: session
    business_owner: director-data
    technical_owner: platform-data
    owner: platform-data
    approver_roles: [director, super_admin]
    runbook: docs/runbooks/173-supersede-b-pcr.md
    alert_group: LINE:ops-data
    escalation_policy: session-critical-escalation
    capabilities: [repair, plan, verify, rollback, snapshot]
    risk: high
    reversible: true
    snapshot_required: true
    transaction_required: true
    rollback_supported: true
    verification_required: true
    approval_required: true
    blast_radius: single_student_slot
    estimated_duration: 2m
    invariant_packs: [session-pack@1.0.0]
    strategy_class: App\Operations\Strategies\SupersedeRenewalStrategy
    legacy_command: repair:supersede-renewal-session
    tags: [repair, session, renewal]

  duplicate-session:
    lifecycle: active
    domain: session
    business_owner: director-data
    technical_owner: platform-data
    owner: platform-data
    approver_roles: [director, super_admin]
    runbook: docs/runbooks/1130-p1-ghost-pcr.md
    alert_group: LINE:ops-data
    escalation_policy: session-critical-escalation
    capabilities: [repair, plan, verify, rollback, snapshot]
    risk: high
    reversible: true
    snapshot_required: true
    transaction_required: true
    rollback_supported: true
    verification_required: true
    approval_required: true
    blast_radius: multi_row
    estimated_duration: 5m
    invariant_packs: [session-pack@1.0.0]
    strategy_class: App\Operations\Strategies\DuplicateSessionStrategy
    legacy_command: repair:duplicate-sessions
    tags: [repair, session, duplicate]

  forward-generation:
    lifecycle: active
    domain: session
    business_owner: director-scheduling
    technical_owner: platform-scheduling
    owner: platform-scheduling
    approver_roles: [director, super_admin]
    runbook: docs/runbooks/1062-track-a-pcr.md
    alert_group: LINE:ops-scheduling
    escalation_policy: scheduling-critical-escalation
    capabilities: [repair, plan, verify, snapshot]
    risk: critical
    reversible: partial
    snapshot_required: true
    transaction_required: true
    rollback_supported: false
    verification_required: true
    approval_required: true
    blast_radius: branch_wide
    estimated_duration: 30m
    invariant_packs: [session-pack@1.0.0]
    strategy_class: App\Operations\Strategies\ForwardGenerationStrategy
    legacy_command: sessions:generate-forward
    tags: [repair, session, scheduling]

  leave-cascade-slot-times:
    lifecycle: active
    domain: session
    business_owner: director-data
    technical_owner: platform-data
    owner: platform-ops
    approver_roles: [director, super_admin]
    runbook: docs/sop/LEAVE_CASCADE_DIRECTOR_CSV_REVIEW.md
    alert_group: LINE:ops-data
    escalation_policy: session-critical-escalation
    capabilities: [repair, plan, verify, snapshot]
    risk: high
    reversible: true
    snapshot_required: true
    transaction_required: true
    rollback_supported: true
    verification_required: true
    approval_required: true
    blast_radius: allowlist_only
    estimated_duration: 10m
    invariant_packs: [session-pack@1.0.0]
    legacy_command: repair:leave-cascade-slot-times
    workflow: .github/workflows/ops-leave-cascade-repair.yml
    tags: [repair, session, leave, director-review]

  application-deploy:
    lifecycle: active
    domain: deploy
    business_owner: director-ops
    technical_owner: platform-ops
    owner: platform-ops
    approver_roles: []
    runbook: docs/GUIDE_RELEASE_EXECUTION_PACKAGE.md
    alert_group: LINE:ops-deploy
    escalation_policy: deploy-escalation
    capabilities: [deploy, verify]
    risk: high
    reversible: true
    snapshot_required: false
    transaction_required: false
    rollback_supported: true
    verification_required: true
    approval_required: false
    blast_radius: global
    estimated_duration: 15m
    invariant_packs: [deployment-pack@1.0.0]
    strategy_class: App\Operations\Strategies\ApplicationDeployStrategy
    legacy_command: null
    tags: [deploy]
    notes: Executed via deploy.yml today; converges to POP strategy in Phase 5.
