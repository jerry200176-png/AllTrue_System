updates:
  - id: parent-update-2026-09-10-parent-progress-hub-clarity
    published_at: "2026-09-10"
    expires_at: "2026-10-10"
    kind: improvement
    title: 進度中心更容易理解
    summary: 本週學習、下次課程與繳費狀態的下一步更容易看見與操作。
    details: 每個項目在手機、平板與桌面都有一致的觸控尺寸與鍵盤焦點；原有資料、導頁與操作方式不變。

  - id: parent-update-2026-09-10-parent-status-hierarchy
    published_at: "2026-09-10"
    expires_at: "2026-10-10"
    kind: improvement
    title: 需要留意事項更清楚
    summary: 家長入口會把需要查看或回覆的事情整理成更容易點選的下一步。
    details: 長說明在手機上會完整換行；沒有待辦時會清楚顯示目前沒有需要處理的事項，原有導頁與資料範圍不變。

  - id: parent-update-2026-09-10-parent-header-clarity
    published_at: "2026-09-10"
    expires_at: "2026-10-10"
    kind: improvement
    title: 家長入口更容易操作
    summary: 登出、切換學生與分校範圍在手機上更容易看見、點選與使用鍵盤操作。
    details: 長學生姓名會保持可讀並正常換行；學生切換、跨分校查看、請假、回饋與帳務的原有操作方式不變。

  - id: parent-update-2026-09-10-learning-tab-focus
    published_at: "2026-09-10"
    expires_at: "2026-10-10"
    kind: improvement
    title: 學習分頁更容易操作
    summary: 切換家長入口的學習內容時，現在更容易看出目前所在的分頁。
    details: 手機、平板與桌面都支援清楚的鍵盤與觸控焦點；學習內容、可查看範圍與原有操作方式不變。

  - id: parent-update-2026-09-09-learning-assessment
    published_at: "2026-09-09"
    expires_at: "2026-10-09"
    kind: improvement
    title: 學習評量重點更清楚
    summary: 登入後可以先看到最近學了什麼、本週重點、老師建議、回家要做什麼，以及目前的下一步。
    details: 已核准的學習評量仍可從「學習」分頁逐堂展開查看；尚未完成老師複核時，頁面會清楚說明目前沒有可查看的評量內容。

  - id: parent-update-2026-09-03-multi-guardian
    published_at: "2026-09-03"
    expires_at: "2026-10-03"
    kind: improvement
    title: 多位家長可各自登入
    summary: 同一位學生的爸爸、媽媽或其他監護人可各自用自己的 LINE 或手機進入家長入口，並切換查看其他子女。
    details: 若校方解除您的監護關係，您將無法再登入該學生資料。課表、請假與學習內容的操作方式不變。

  - id: parent-update-2026-08-20-attention-summary
    published_at: "2026-08-20"
    expires_at: "2026-09-19"
    kind: improvement
    title: 首頁先告訴您需要留意的事
    summary: 請假、老師回覆、帳務提醒與可留言的評量，登入後會集中顯示並可直接前往處理。
    details: 課表、學習與帳務的完整紀錄仍保留在下方分頁；沒有待處理事項時，首頁會直接告訴您目前沒有需要處理的事。

  - id: parent-update-2026-07-26-leave
    published_at: "2026-07-26"
    expires_at: "2026-08-25"
    kind: policy
    title: 請假後的課程安排調整
    summary: 請假後，已排定的未來課程日期不會移動；需要補上的課程會安排在課程尾端。
    details: 您不需要重新操作；實際補課日期仍由班主任協助確認。
