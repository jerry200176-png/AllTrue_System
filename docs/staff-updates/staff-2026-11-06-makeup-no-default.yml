    title: 待補點名不再預設到班
    summary: 待補點名要自己選狀態，才能按補登。
    items:
      - category: fixed
        text: 以前待補點名預設是到班，按一下就會扣一堂；現在要先選到班、遲到、請假或缺席。
      - category: fixed
        text: 修改開課日後不會多排一堂；作廢已扣堂的點名後，該堂會回到未點名。
