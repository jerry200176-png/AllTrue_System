updates:
  - id: staff-2026-11-27-exam-date-reference
    published_at: "2026-11-27"
    audiences:
      - director
    importance: digest
    title: 各校段考日期可帶入參考日期
    summary: 各校段考日期頁會列出參考日期，可以一次帶入，不用自己查。
    items:
      - category: added
        text: 學校有參考日期時，每一格下面會出現參考按鈕；按一下填入日期，再按儲存。
      - category: added
        text: 上方「帶入參考日期」會一次填好並儲存空白的格子；同一格有多個日期的要自己選。
      - category: action_required
        text: 參考日期不一定正確，請以學校公告為準；帶入後可以改或清除。
    source_refs:
      - "changelog:2026-11-27:exam-date-reference"
