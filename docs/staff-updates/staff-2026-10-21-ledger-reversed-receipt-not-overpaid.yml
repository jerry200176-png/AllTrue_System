    title: 已撤銷的收款不再顯示多收
    summary: 學生帳務裡撤銷過的收款，不會再出現在「需先處理：多收」。
    items:
      - category: fixed
        text: 收款按「撤銷這筆」之後，帳務頁會顯示為「已更正」，不再一直提示多收。帳單金額與收款紀錄不變。
    source_refs:
      - "changelog:2026-10-21:ledger-reversed-receipt-not-overpaid"
