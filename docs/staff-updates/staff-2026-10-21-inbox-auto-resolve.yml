updates:
  - id: staff-2026-10-21-inbox-auto-resolve
    published_at: "2026-10-21"
    audiences:
      - director
    importance: digest
    title: 已處理的通知會自動清掉
    summary: 扣堂失敗補扣後、家長回饋回覆後，通知會自動從待辦移除，不用再手動按已讀。
    items:
      - category: improved
        text: 「刷卡出席但扣堂失敗」在補扣、作廢或改為請假後，會自動從通知待辦移除。
      - category: improved
        text: 「家長學習回饋」在老師或主任回覆、或標記不需回覆後自動移除；家長再追問會重新出現。
    source_refs:
      - "changelog:2026-10-21:inbox-auto-resolve"
