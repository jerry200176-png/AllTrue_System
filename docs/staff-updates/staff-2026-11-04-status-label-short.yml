        text: 「舊資料標已收，查無收款」現在只顯示「查無收款」，完整說明在滑鼠移上去的提示裡。
      - category: improved
        text: 月結帳單與堂數不符，列上顯示「月結待核對」；收款紀錄裡「已收（多出部分未入帳）」顯示「已收超額」。
