    title: 撤銷收款不再重複扣
    summary: 收據的錢已被沖掉時，撤銷不會再多扣另一筆匯款。
    items:
      - category: fixed
        text: 撤銷收款時，若這張收據的錢早已被沖掉，不再多扣一次，避免有匯款卻顯示未繳、再收變多收。
