    title: 收款紀錄變簡單
    summary: 收款紀錄上方只留現金、匯款、合計；其他篩選收進「篩選」。已結清改在帳單的「已收」看。
    items:
      - category: improved
        text: 收款紀錄上方數字卡從七張減為三張：現金、匯款、合計。筆數與預收改成一行小字。
      - category: improved
        text: 學生、科目、收據狀態、付款方式收進「篩選」，日期留在外面。
      - category: improved
        text: 已結清課程不再另外一頁，改到帳單的狀態列「更多」→「已收」。
