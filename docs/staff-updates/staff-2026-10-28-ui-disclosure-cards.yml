        text: 學生卡收合時保留筆數、待處理與日期，多筆時卡片下緣有疊卡邊，點一下在原地展開明細。
      - category: improved
        text: 點學生姓名仍是只看此學生；展開鈕可用鍵盤操作，收合後游標回到展開鈕。
