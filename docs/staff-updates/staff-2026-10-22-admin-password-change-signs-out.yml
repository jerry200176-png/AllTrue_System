updates:
  - id: staff-2026-10-22-admin-password-change-signs-out
    published_at: "2026-10-22"
    audiences:
      - director
      - teacher
    importance: digest
    title: 密碼被重設後要重新登入
    summary: 主任或管理員幫你重設、修改密碼後，你在每台裝置都會登出，請用新密碼登入。
    items:
      - category: action_required
        text: 老師的密碼被主任重設或修改後，手機和電腦上的登入都會結束，請用新密碼重新登入。
      - category: improved
        text: 主任重設老師密碼時自己不會被登出，系統也會記下是誰在什麼時間重設。
    source_refs:
      - "changelog:2026-10-22:admin-password-change-revokes-sessions"
