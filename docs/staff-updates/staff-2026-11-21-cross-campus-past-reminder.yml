updates:
  - id: staff-2026-11-21-cross-campus-past-reminder
    published_at: "2026-11-21"
    audiences:
      - director
      - super_admin
    importance: digest
    title: 補登過去的課會提醒撞課
    summary: 已上完的課照樣能補登；如果老師同時在其他分校有課，會跳出提醒。
    items:
      - category: improved
        text: 補登出勤、代課或過去堂次時，若老師同時段在其他分校有課，會提醒分校與時間，但不擋。
      - category: improved
        text: 續課時，新一期的堂次如果撞到老師在其他分校的課，會擋下並寫出分校與時間。
    source_refs:
      - "changelog:2026-11-21:cross-campus-past-reminder"
