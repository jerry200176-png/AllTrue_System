      - category: fixed
        text: 繳費單與收據左上角的補習班名稱不再斷行壓到分校名稱，頁尾也不再被浮水印蓋住。
      - category: improved
        text: 月結項目會寫出科目，例如「數學月結費用 2026年10月」。
