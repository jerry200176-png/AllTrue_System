updates:
  - id: staff-2026-11-16-bill-receipt-lookup
    published_at: "2026-11-16"
    audiences:
      - director
      - super_admin
    importance: digest
    title: 帳單旁直接找收據
    summary: 從帳單查看各筆收款與收據，關閉後保留原來的查找位置。
    items:
      - category: improved
        text: 帳單上的「收款與收據」會直接展開對應資料，同一帳單的多筆收款也能分別開收據。
      - category: improved
        text: 用「查收款與收據」搜尋姓名，可查已結清或暫停學生的舊收據，不會把暫停學生加回待收清單。
    source_refs:
      - "changelog:2026-11-16:bill-receipt-lookup"
