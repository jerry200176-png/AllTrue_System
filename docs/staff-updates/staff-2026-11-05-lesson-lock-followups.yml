    title: 評量刪除前先留紀錄
    summary: 刪除評量前會先保留一份紀錄；行事曆用老師篩選時，以寫評量的老師為準。
    items:
      - category: fixed
        text: 刪除老師寫過的評量前，系統會先留一份內容紀錄。
      - category: fixed
        text: 行事曆用老師篩選時，已有評量的課會算在寫評量的老師名下。
      - category: fixed
        text: 已核准但沒內容的評量刪除後，老師的授課堂數會一併扣回。
