updates:
  - id: staff-2026-11-16-void-reason-message
    published_at: "2026-11-16"
    audiences:
      - director
      - super_admin
    importance: major
    title: 作廢帳單不再按了沒反應
    summary: 作廢帳單的原因寫兩個字就可以；太短或沒寫時，畫面會提示，不再沒有反應。
    items:
      - category: fixed
        text: 作廢帳單、撤銷收款時原因太短或留空，畫面會說明這次沒有執行，請再按一次。
      - category: improved
        text: 作廢原因最少兩個字即可，例如「重複」「開錯」。
    source_refs:
      - "changelog:2026-11-16:void-reason-too-short-message"
