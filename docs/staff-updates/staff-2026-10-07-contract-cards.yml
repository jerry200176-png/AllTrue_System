updates:
  - id: staff-2026-10-07-contract-cards
    published_at: "2026-10-07"
    audiences:
      - director
    importance: digest
    title: 學生帳務：每筆合約一張卡片，看得到每一堂課付了沒
    summary: 打開學生帳務，每筆合約會列出完整備註和每一堂上課日，還標出這堂的錢付了沒。
    items:
      - category: added
        text: 每筆合約一張卡片，標題寫科目和合約期間，不再顯示代號。
      - category: added
        text: 合約備註完整顯示，按「改備註」就能直接修改，不用跳頁。
      - category: added
        text: 上課日按月份列出，每一天標上課狀態和「已付／未付／還沒開帳單」；還沒排的堂數會寫「還有 N 堂還沒排日期」。
