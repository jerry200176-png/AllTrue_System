updates:
  - id: staff-2026-11-15-fulltime-one-campus
    published_at: "2026-11-15"
    audiences:
      - director
      - super_admin
    importance: major
    title: 跨分校老師只結算一次
    summary: 同時在兩個分校任教的正職老師，每個月只由課比較多的那個分校結算。
    items:
      - category: fixed
        text: 以前兩個分校都會列出同一筆全額獎金，各自鎖定就會重複發放。
      - category: improved
        text: 另一個分校的頁面不再列這位老師，只會在上方寫由哪個分校結算。
      - category: action_required
        text: 如果你的分校少了某位跨校老師，請到上方提示的那個分校看他的結算。
    source_refs:
      - "changelog:2026-11-15:fulltime-one-settlement-campus"
