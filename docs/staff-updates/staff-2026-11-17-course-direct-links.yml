updates:
  - id: staff-2026-11-17-course-direct-links
    published_at: "2026-11-17"
    audiences:
      - director
      - super_admin
    importance: digest
    title: 課程可以直接點連結找到
    summary: 在管理課程按「複製課程連結」，下次可直接打開該課程，不用再輸入編號搜尋。
    items:
      - category: improved
        text: 連結沿用原本分校與角色權限；課程不存在或無權限時，會提示無法定位。
      - category: fixed
        text: 沒有指定教室、或學生的課程超過一頁時，也能直接找到該課程。
    source_refs:
      - "changelog:2026-11-17:course-direct-links"
