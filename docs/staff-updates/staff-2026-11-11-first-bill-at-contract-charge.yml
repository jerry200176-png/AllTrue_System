updates:
  - id: staff-2026-11-11-first-bill-at-contract-charge
    published_at: "2026-11-11"
    audiences:
      - director
    importance: digest
    title: 堂數制第一張帳單照合約金額開立
    summary: 第一張帳單照合約金額，收款只記實收；撤銷唯一收款會一併作廢。
    items:
      - category: improved
        text: 堂數制課程第一次確認入帳時，帳單金額是合約金額；收到的錢少於合約金額，差額會繼續顯示未繳。
      - category: improved
        text: 如果把這唯一一筆收款撤銷，系統自動開的那張帳單也會作廢，繳費通知不會再顯示錯的金額。
      - category: improved
        text: 第一次收款少於合約金額時，差額會留成未繳並出現提醒；少收若是有意的（折扣或合約金額過時），請先修正合約金額或帳單。
    source_refs:
      - "changelog:2026-11-11:first-bill-at-contract-charge"
