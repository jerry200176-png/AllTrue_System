    title: 行事曆改已上會算薪資
    summary: 行事曆改成已上或遲到會記出席，兼職薪資算得到。
    items:
      - category: fixed
        text: 行事曆把堂次改成已上或遲到，現在會記出席並扣堂一次，兼職薪資算得到。
      - category: fixed
        text: 行事曆標缺席只改狀態、不記出席；之後若核准評量，該堂仍會轉為已上並扣堂。
    source_refs:
      - "changelog:2026-11-05:calendar-attended-signin"
