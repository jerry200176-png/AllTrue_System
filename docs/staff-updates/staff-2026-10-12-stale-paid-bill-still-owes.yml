    title: 堂數制收款不足的帳單照樣列出
    summary: 堂數制單一課程照收款紀錄判斷欠多少；月結課程與共用方案還沒涵蓋。
    items:
      - category: fixed
        text: 堂數制、非共用方案的課程，帳單狀態寫「已繳」但收款紀錄不足時，待收清單、應收帳齡和銀行對帳建議都會列出還欠的金額。
