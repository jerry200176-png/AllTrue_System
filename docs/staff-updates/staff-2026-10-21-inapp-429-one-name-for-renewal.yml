    importance: digest
    title: 加堂統一叫「續課」
    summary: 加購堂數、續報加購等名稱統一改叫「續課」；新增課程時先選新課、續課或換課。
    items:
      - category: improved
        text: 同一門課要再買堂數，全系統都叫「續課」，課程列、⋯ 選單和學生管理都一樣。
      - category: improved
        text: 按「新增課程／續課」會先選：全新課程、同一門課續課、換科目／老師／時段（轉課），再帶到原本的畫面。
    source_refs:
      - "changelog:2026-10-21:inapp-429-one-name-for-renewal"
