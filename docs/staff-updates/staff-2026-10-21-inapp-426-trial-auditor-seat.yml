    importance: digest
    title: 試聽旁聽不再占用一對三名額
    summary: 行事曆與加課檢查不再把試聽學生算進正式名額，一對三有試聽時仍可補滿正式學生。
    items:
      - category: fixed
        text: 一對三時段已有兩位正式學生和一位試聽時，仍可再加第三位一對三學生；正式學生滿三位仍會擋下。
      - category: improved
        text: 行事曆人數徽章有試聽時會標「+試」，只有試聽時顯示「試聽」；同一時段仍最多一位試聽。
    source_refs:
      - "changelog:2026-10-21:inapp-426-trial-auditor-seat"
