updates:
  - id: staff-2026-10-15-inapp-408-issued-bill-vs-current-rate
    published_at: "2026-10-15"
    audiences:
      - director
    importance: digest
    title: 課程金額改過時，帳單會並列開單時金額
    summary: 已開的帳單不會跟著課程金額自動改；開單後課程金額有改時，學生帳務會並列兩個金額供你確認。
    items:
      - category: improved
        text: 只比較開單時就是當時課程金額的未收款帳單；手動輸入其他金額、分期或議價的帳單不做比較。
      - category: improved
        text: 兩者不同可能是議價或約定調整，不代表帳單有誤；請先確認原約定與應收金額，確認開錯才更正。
    source_refs:
      - "changelog:2026-10-15:inapp-408-issued-bill-vs-current-rate"
