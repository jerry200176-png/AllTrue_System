    importance: digest
    title: 收款對應名單上的待收帳單
    summary: 登記收款與批次回報，會對應名單上顯示的待收帳單；欠款以實際收款紀錄判斷。
    items:
      - category: fixed
        text: 月結優先處理最早未繳清期別；名單上的帳單若已依收款紀錄繳清，會提示並擋下，不會改記到其他帳單。
      - category: fixed
        text: 要收費的課不能登記零元或小數金額；帳單金額是零元時，會提示先更正帳單。
    source_refs:
      - "changelog:2026-10-12:collect-gaps-3875"
