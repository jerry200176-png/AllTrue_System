    importance: digest
    title: 續約前要先登錄前一期費用
    summary: 前一期沒有費用紀錄時，續約和加購會先被擋下。
    items:
      - category: improved
        text: 前一期單堂費用、應收金額皆 0，且沒有任何未作廢的帳單或帳單明細時，續約或加購會先提示登錄費用；免費課程登錄 0 元帳單即可，作廢的帳單不算。
    source_refs:
      - "changelog:2026-10-13:renewal-requires-prior-fee"
