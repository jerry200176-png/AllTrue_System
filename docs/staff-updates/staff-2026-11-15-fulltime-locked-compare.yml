    importance: major
    title: 鎖定月份可看新舊差額
    summary: 打開已鎖定的月份，會顯示照現在算法重算的金額，以及和鎖定時差多少。
    items:
      - category: added
        text: 每位老師的獎金合計下面多一行「現在的算法」，寫出金額與差額。
      - category: improved
        text: 頁面上方會寫整個月有幾位老師金額不同、合計差多少。
      - category: action_required
        text: 鎖定的數字不會變；差額要不要補發或追回，請等總部通知。
