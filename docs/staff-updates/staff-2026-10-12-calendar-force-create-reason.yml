    title: 行事曆重複課程可以正常新增了
    summary: 行事曆提示學生已有課程時，現在可選擇建立試聽、續報或獨立課程。
    items:
      - category: fixed
        text: 行事曆快速排課遇到學生已有進行中課程時，原本「仍要新增課程」一定失敗；現在改用與課程管理相同的選項，建立獨立課程需填原因。
