    importance: digest
    title: 前後接續的課不再佔名額
    summary: 排課時，人數上限改算「同一時間最多幾人」，前後接續的課不會再被加在一起。
    items:
      - category: fixed
        text: 例如老師 18–20 有兩人、20–22 有一人，現在可以把第三位學生排在 19–21；同一時間真的滿了才會擋。
    source_refs:
      - "changelog:2026-11-17:inapp-565-capacity-peak"
