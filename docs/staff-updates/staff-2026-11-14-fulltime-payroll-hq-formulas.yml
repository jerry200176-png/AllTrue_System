    importance: major
    title: 正職獎金算法照總部公告校正
    summary: 科目數獎金、一對三獎金、二十科加成改照總部公告計算，金額會變。
    items:
      - category: fixed
        text: 科目數獎金改成科目數無條件捨去後查表；一對三獎金改成一對三總計乘以一百元。
      - category: fixed
        text: 二十科以上的加成只看正課，不含輔導與試聽；科目數與「科目數統計」頁一致，跨分校加總。
      - category: action_required
        text: 每週十六段、假日與平日倍率、新進保底尚未更新，鎖定本月前請先人工核對。
    source_refs:
      - "changelog:2026-11-14:fulltime-payroll-hq-formulas"
