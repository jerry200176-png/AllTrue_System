updates:
  - id: staff-2026-10-21-inapp-426-one-on-three-trials
    published_at: "2026-10-21"
    audiences:
      - director
    importance: digest
    title: 一對三時段可排多位試聽
    summary: 試聽課程可選「試聽班型」；選一對三的試聽可在同一時段排多位，正式與試聽合計最多三位。
    items:
      - category: added
        text: 建立或編輯試聽課程時，可選「試聽班型」（一對一、一對二、一對三）；不選則維持每時段最多一位試聽。
      - category: improved
        text: 一對三時段（有一對三正式學生，或有選一對三的試聽）可排多位試聽；正式與試聽合計滿三位就不能再加任何學生。
      - category: improved
        text: 行事曆人數徽章顯示含試聽的總人數，滑過可看到其中試聽幾位。
    source_refs:
      - "changelog:2026-10-21:inapp-426-one-on-three-trials"
