    title: 學生帳務：帳單放上面，原因在畫面裡寫
    summary: 打開學生帳務，先看到未繳和帳單；作廢、撤銷的原因直接在畫面裡寫。
    items:
      - category: improved
        text: 由上到下是未繳、要先處理、帳單、收款紀錄、合約；帳單一打開就看得到。
      - category: improved
        text: 作廢帳單、撤銷收款時，原因欄出現在學生帳務畫面裡，不再跳出小視窗；字數不夠時按不下去。
