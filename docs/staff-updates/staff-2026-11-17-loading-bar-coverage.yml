    summary: 學習紀錄、點名、老師名單、帳務、通知等畫面在讀資料時，上方會出現細細的進度線，不會看起來像當掉。
    items:
      - category: improved
        text: 原本只有部分畫面有讀取進度線，現在其他讀取超過 0.3 秒的畫面也會出現；背景自動更新不會一直閃。
