    published_at: "2026-08-15"
    audiences:
      - director
    importance: digest
    title: 誤核薪資可退回
    summary: 已核准可退回；全校放假改看課程管理連假。
    items:
      - category: added
        text: 已核准的補登可按退回，該筆不再進入薪資。
