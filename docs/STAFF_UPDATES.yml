  - id: staff-2026-08-06-leave-makeup-count-fix
    published_at: "2026-08-06"
    audiences:
      - director
      - teacher
    importance: major
    title: 請假補堂不再超額
    summary: 請假或取消後自動補的堂次，會正確對齊已購買堂數，不會越補越多。
    items:
      - category: fixed
        text: 請假或取消課程後，系統自動補的堂次會正確對齊已購買堂數，不會超過實際購買的堂數。
    source_refs:
      - "2026-08-06"

  - id: staff-2026-08-06-scheduling-fixes
    published_at: "2026-08-06"
    audiences:
      - director
      - teacher
    importance: major
    title: 課表與繳費頁面修復
    summary: 重複課程審核、請假撤銷、暫停恢復、行事曆換週都修好了。
    items:
      - category: fixed
        text: 重複課程審核頁面選分校後，只會顯示該分校資料。
      - category: fixed
        text: 請假撤銷後可以正常填寫評量，不再跳出錯誤訊息。
      - category: fixed
        text: 行事曆換週不會弄丟已上堂次；課程暫停後恢復，取消的堂次會一併還原。
    source_refs:
      - "2026-08-06"

  - id: staff-2026-07-week-30
    published_at: "2026-07-29"
    effective_at: "2026-07-28"
    audiences:
      - director
      - teacher
    importance: digest
    title: 本週排課與家長留言改善
    summary: 調課後課表更穩定；老師也更容易找到並回覆家長留言。
    items:
      - category: fixed
        text: 單堂調課後，課程不會再被系統自動拉回原本時段。
      - category: added
        text: 老師工作台可看到「待回覆家長留言」，並直接處理。
      - category: improved
        text: 評量列表的家長留言預覽可一鍵開啟回覆。
    source_refs:
      - "2026-07-28"

  - id: staff-2026-07-28-reschedule-stability
    published_at: "2026-07-28"
    audiences:
      - director
      - teacher
    importance: major
    title: 調課後課表不再跳回
    summary: 單堂調到新時段後會固定下來，重整或儲存也不會被拉回原時段。
    items:
      - category: fixed
        text: 單堂調課會當成該堂例外，不再被固定週期排課覆蓋回去。
      - category: improved
        text: 課程管理預設只顯示有效堂次，已取消的內部紀錄改為可展開摘要。
    source_refs:
      - "2026-07-28"
      - "2026-07-24"

