    published_at: "2026-07-24"
    audiences:
      - director
      - teacher
    importance: digest
    title: 課表與調課操作更清楚
    summary: 有效堂次與幽靈取消分開顯示；調課失敗原因會留在對話框內。
    items:
      - category: improved
        text: 調課失敗（含衝堂名單）改顯示在對話框內，送出中會停用按鈕。
      - category: fixed
        text: 已取消或內部調課紀錄不會再像正常課一樣搶版面。
      - category: improved
        text: 暫停課程時可勾選是否取消剩餘排課（預設勾選）。
