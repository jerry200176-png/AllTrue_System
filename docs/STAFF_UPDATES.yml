    published_at: "2026-08-05"
    audiences:
      - director
      - teacher
    importance: digest
    title: 行事曆資料更完整
    summary: 編輯合約後，舊課程堂次仍會正常保留。
    items:
      - category: fixed
        text: 編輯新合約後，已完成的舊堂次不會從行事曆消失。
    source_refs:
