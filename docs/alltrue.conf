# AllTrue 教務管理系統 - Apache VirtualHost
# 純 Apache + PHP + MySQL，無 Node.js、無 Docker
#
# 安裝：
#   1. 複製到 Apache sites-available: sudo cp apache/alltrue.conf /etc/apache2/sites-available/
#   2. 啟用站點: sudo a2ensite alltrue.conf
#   3. 啟用 mod_rewrite: sudo a2enmod rewrite
#   4. 重啟 Apache: sudo systemctl restart apache2
#
# 請將 /path/to/admin 改為實際專案路徑

<VirtualHost *:80>
    ServerName daan.lifenet.com.tw
    ServerAlias localhost
    DocumentRoot /path/to/admin/backend/public

    <Directory /path/to/admin/backend/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # PHP 設定（若使用 mod_php）
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/alltrue_error.log
    CustomLog ${APACHE_LOG_DIR}/alltrue_access.log combined
</VirtualHost>
