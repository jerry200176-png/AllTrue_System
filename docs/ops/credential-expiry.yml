# Credential expiry registry (workflow gap #7). NAMES AND DATES ONLY: never put a secret value here.
# .github/workflows/secret-rotation-reminder.yml reads this weekly and opens one issue per
# credential 14 days before `expires_on`. `expires_on: null` = no known expiry (or not yet recorded):
# fill the date when the credential is created/rotated, and update it again after each rotation.
# Rotating or creating a credential is Founder-only (RULEBOOK F3); this file only reminds.
lead_days: 14
credentials:
  - name: ALLTRUE_TRIAGE_TOKEN
    owner: Founder
    expires_on: null   # created with a 90-day expiry; record the date shown in the UI
    rotate_at: "AllTrue 個人資料 → 安全性 → AI 分診唯讀金鑰 (read-only triage key), then update the secret"
  - name: DUMP_ARTIFACT_KEY
    owner: Founder
    expires_on: null
    rotate_at: "docs/sop/BUG_INTAKE_TO_PRODUCTION.md (Cloud decryption custody)"
  - name: PI_SSH_KEY
    owner: Founder
    expires_on: null
    rotate_at: "docs/OPERATIONS_RUNBOOK.md §O (secret inventory)"
  - name: DB_PASSWORD
    owner: Founder
    expires_on: null
    rotate_at: "docs/OPERATIONS_RUNBOOK.md §O (production auth impact: read docs/DANGEROUS_OPERATIONS.md first)"
