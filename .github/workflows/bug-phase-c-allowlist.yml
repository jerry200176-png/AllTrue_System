name: Bug Phase-C allowlist resolve (Pi)

# Idempotent Phase C for bugs whose code fix is already on production.
# Trigger via request file (cloud agents cannot workflow_dispatch).
# Allowlist only — never invent new bug IDs here without Evidence Contract.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'operations/closeout/bug-phase-c-allowlist.request.md'
      - '.github/workflows/bug-phase-c-allowlist.yml'

concurrency:
  group: bug-phase-c-allowlist
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ssh-keyscan -H "$PI_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "keyscan ok"
          elif [[ -n "${PI_HOST_KEY:-}" ]]; then
            printf '%s\n' "$PI_HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::error::no host key"; exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Phase-C resolve allowlisted bugs
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p out
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_SSH_USER}@${PI_SSH_HOST}" bash <<'REMOTE' | tee out/phase-c.log
          set -euo pipefail
          cd /home/admin/backend
          PROD_HEAD=$(git rev-parse HEAD)
          echo "prod_head=$PROD_HEAD"
          php artisan tinker --execute='
          $prodHead = trim((string)@shell_exec("git rev-parse HEAD"));
          $admin = \Illuminate\Support\Facades\DB::table("UserCampus")->where("Admin",1)->where("Approved",1)->orderBy("UserID")->value("UserID");
          $actor = $admin ? (int)$admin : 1;
          $svc = \App\Services\BugReportService::class;
          // Allowlist: in-app id => [public reply, production_revision, deploy_run_id optional]
