name: Bug Phase-C allowlist resolve (Pi)

# Idempotent Phase C for bugs whose code fix is already on production.
# Trigger via request file (cloud agents cannot workflow_dispatch).
# Allowlist only — never invent new bug IDs here without Evidence Contract.
on:
  workflow_dispatch:
    inputs:
      bug_id:
        description: "One allowlisted in-app bug ID to resolve"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'operations/closeout/bug-phase-c-allowlist.request.md'

concurrency:
  group: bug-phase-c-allowlist
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pinned SSH trust helper and request
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions/production-ssh-trust
            operations/closeout/bug-phase-c-allowlist.request.md
          sparse-checkout-cone-mode: false
      - name: Select one target
        id: target
        env:
          DISPATCH_BUG_ID: ${{ inputs.bug_id || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            ID="$DISPATCH_BUG_ID"
          else
            ID="$(python3 - <<'PY'
          import re
          from pathlib import Path
          request = Path("operations/closeout/bug-phase-c-allowlist.request.md").read_text(encoding="utf-8")
          matches = re.findall(r"(?m)^bug_id:\s*([1-9][0-9]*)\s*$", request)
          if len(matches) != 1:
              raise SystemExit("request must contain exactly one bug_id: <positive integer> line")
          print(matches[0])
          PY
            )"
          fi
          [[ "$ID" =~ ^[1-9][0-9]*$ ]] || { echo "invalid bug_id" >&2; exit 1; }
          echo "bug_id=$ID" >> "$GITHUB_OUTPUT"
      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Phase-C resolve allowlisted bugs
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          TARGET_BUG_ID: ${{ steps.target.outputs.bug_id }}
        run: |
          set -euo pipefail
          [[ "$TARGET_BUG_ID" =~ ^[1-9][0-9]*$ ]] || { echo "invalid target" >&2; exit 1; }
          mkdir -p out
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_SSH_USER}@${PI_SSH_HOST}" "TARGET_BUG_ID='$TARGET_BUG_ID' bash" <<'REMOTE' | tee out/phase-c.log
          set -euo pipefail
          cd /home/admin/backend
          PROD_HEAD=$(git rev-parse HEAD)
          echo "prod_head=$PROD_HEAD"
          php artisan tinker --execute='
          $prodHead = trim((string)@shell_exec("git rev-parse HEAD"));
          $admin = \Illuminate\Support\Facades\DB::table("UserCampus")->where("Admin",1)->where("Approved",1)->orderBy("UserID")->value("UserID");
          $actor = $admin ? (int)$admin : 1;
          $svc = \App\Services\BugReportService::class;
          // Allowlist: in-app id => [public reply, production_revision, deploy_run_id optional]
          $items = [
            242 => [
              "reply" => "已修好並上線：讀取待點名堂次時，遇到歷史重疊資料不會再讓整份列表回傳 HTTP 422；衝突資料會保留供後續處理，其他可點名堂次會正常載入。請重新整理待點名頁確認；若仍無法載入，請回覆這則訊息。追蹤：https://github.com/jerry200176-png/AllTrue_System/issues/2060",
              "rev" => "9e4a815cd9da8bc0aa2764f9ac3e501608c753c1",
