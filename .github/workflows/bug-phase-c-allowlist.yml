name: Bug Phase-C allowlist resolve (Pi)

# RETIRED write path (2026-10-19): runner→SSH→tinker engineering resolves are refused
# (ADR-POP-015 / ADR-POP-008). Historical allowlist reply strings and rev pins live in
# operations/closeout/bug-phase-c-allowlist.LEGACY-SSH.archive.yml for audit only.
# Do not restore the SSH write. Engineering Phase-C: Pi-local inapp-report-resolve-after-deploy
# + pop:execute-approved when catalogued. Wording-only: bug-followup-comment.yml.
on:
  workflow_dispatch:
    inputs:
      bug_id:
        description: "In-app bug ID (audit only; resolve is refused)"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'operations/closeout/bug-phase-c-allowlist.request.md'

concurrency:
  group: bug-phase-c-allowlist
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No production-ssh: this workflow must not open an SSH session for engineering resolve.
    steps:
      - name: Select requested bug id (audit only)
        id: target
        env:
          DISPATCH_BUG_ID: ${{ inputs.bug_id || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ID="${DISPATCH_BUG_ID:-}"
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "::error::request-file trigger for SSH Phase-C resolve is retired"
            exit 1
          fi
          [[ "$ID" =~ ^[1-9][0-9]*$ ]] || { echo "invalid bug_id" >&2; exit 1; }
          echo "bug_id=$ID" >> "$GITHUB_OUTPUT"
      - name: Refuse legacy SSH Phase-C resolve
        env:
          BUG_ID: ${{ steps.target.outputs.bug_id }}
        run: |
          set -euo pipefail
          {
            echo "## Legacy SSH Phase-C resolve refused"
            echo
            echo "bug_id: $BUG_ID"
            echo
            echo "Runner-SSH-tinker engineering resolves are retired (ADR-POP-015 / ADR-POP-008)."
            echo "Do not use this workflow to set in-app status to resolved."
            echo "Use Pi-local inapp-report-resolve-after-deploy + pop:execute-approved when catalogued and standing policy is enabled."
            echo "Public wording-only corrections: bug-followup-comment.yml (no resolve)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Legacy SSH Phase-C resolve retired for in-app #$BUG_ID (ADR-POP-015). Refusing tinker write-back."
          exit 1
