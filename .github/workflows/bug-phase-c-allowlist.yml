          // One authorized target per run. A request for an unknown ID or an
          // unshipped revision fails before any comment/status mutation.
          $targetBugId = filter_var(getenv("TARGET_BUG_ID"), FILTER_VALIDATE_INT);
          if ($targetBugId === false || $targetBugId < 1 || !isset($items[$targetBugId])) {
            throw new \RuntimeException("target is not allowlisted");
          }
          $target = $items[$targetBugId];
          $requiredRevision = (string)($target["rev"] ?? "");
          if (!preg_match("/^[0-9a-f]{40}$/", $requiredRevision) || !preg_match("/^[0-9a-f]{40}$/", $prodHead)) {
            throw new \RuntimeException("invalid revision evidence");
          }
          exec("git merge-base --is-ancestor ".escapeshellarg($requiredRevision)." ".escapeshellarg($prodHead), $unused, $ancestorExit);
          if ($ancestorExit !== 0) {
            throw new \RuntimeException("required revision is not in production");
          }
          $items = [$targetBugId => $target];
          $results = [];
          foreach ($items as $bugId => $cfg) {
            $bug = \App\Models\BugReport::find($bugId);
            if (!$bug) {
              $results[] = ["id" => $bugId, "action" => "missing"];
              continue;
            }
            $status = (string)$bug->status;
            if (in_array($status, ["resolved", "closed"], true)) {
              $results[] = ["id" => $bugId, "action" => "skip_already", "status" => $status];
              continue;
            }
            // Walk legal transitions toward resolved
            $path = [];
            if ($status === "new") $path = ["triaged", "in_progress", "resolved"];
            elseif ($status === "triaged") $path = ["in_progress", "resolved"];
            elseif ($status === "in_progress") $path = ["resolved"];
            else {
              $results[] = ["id" => $bugId, "action" => "unsupported_status", "status" => $status];
              continue;
            }
            $ok = true;
            $last = null;
            foreach ($path as $st) {
              if ($st === "resolved") {
                // Public reply before resolve (Evidence Contract)
                $svc::addComment($bugId, $actor, $cfg["reply"], false);
                $opts = ["production_revision" => $cfg["rev"]];
                if ($cfg["deploy"] !== "") $opts["deploy_run_id"] = $cfg["deploy"];
                $last = $svc::changeStatus($bugId, $actor, "resolved", "phase-c allowlist; prod_head=".$prodHead, $opts);
              } else {
                $last = $svc::changeStatus($bugId, $actor, $st, "phase-c allowlist triage");
              }
              if (!($last["ok"] ?? false)) { $ok = false; break; }
            }
            $fresh = \App\Models\BugReport::find($bugId);
            $results[] = [
              "id" => $bugId,
              "action" => $ok ? "resolved" : "failed",
              "from" => $status,
              "final" => $fresh ? $fresh->status : "missing",
              "last" => $last,
            ];
          }
          echo "---RESULTS---", PHP_EOL;
          echo json_encode(["prod_head" => $prodHead, "actor" => $actor, "results" => $results], JSON_UNESCAPED_UNICODE), PHP_EOL;
          '
