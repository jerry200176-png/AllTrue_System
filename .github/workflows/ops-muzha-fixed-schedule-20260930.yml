name: Founder POP Muzha fixed schedule dry-run
# governance-capability: pop-controlled
# The Pi-local POP scheduler executes only after a separate authenticated DB approval.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Exact case confirmation
        required: true
        type: string
      deployed_backend_sha:
        description: Full deployed backend SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: alltrue-production-side-effects-v2
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate exact case and commit
        env:
          CONFIRM: ${{ inputs.confirm }}
          INPUT_SHA: ${{ inputs.deployed_backend_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == DRY_RUN_MUZHA_FIXED_SCHEDULE_20261001 ]] || exit 1
          [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ && "$INPUT_SHA" == "$WORKFLOW_SHA" ]] || exit 1
  dry-run:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-activation
    steps:
      - name: Checkout pinned SSH trust helper
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions/production-ssh-trust
          sparse-checkout-cone-mode: false
      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Create exact POP request and perform read-only dry-run
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          TARGET_SHA: ${{ inputs.deployed_backend_sha }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/pop-muzha-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s' "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > "$ssh_dir/deploy_key"
          chmod 600 "$ssh_dir/deploy_key"
          trap 'rm -f "$ssh_dir/deploy_key"' EXIT
          ssh -i "$ssh_dir/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=20 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$PI_SSH_USER@$PI_SSH_HOST" "TARGET_SHA='$TARGET_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          umask 077
          BASE_URL=https://daan.lifenet.com.tw
          WORK_DIR="$(mktemp -d /tmp/pop-muzha.XXXXXX)"
          MACHINE_KEY=''
          cleanup() {
            unset MACHINE_KEY
            rm -f "$WORK_DIR"/*
            rmdir "$WORK_DIR" 2>/dev/null || true
          }
          trap cleanup EXIT
          manifest="$WORK_DIR/manifest.json"
          curl -sS --fail --proto '=https' --tlsv1.2 "$BASE_URL/deployment.json" -o "$manifest"
          manifest_sha="$(python3 - "$manifest" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1]))['backend_sha'])
          PY
          )"
          [[ "$manifest_sha" == "$TARGET_SHA" ]] || {
            echo '::error::production SHA differs from reviewed workflow SHA'
            exit 1
          }
          key_file=/home/admin/backend/storage/app/private/pop-machine.key
          [[ -f "$key_file" ]] || { echo '::error::POP machine identity unavailable'; exit 1; }
          MACHINE_KEY="$(<"$key_file")"
          [[ "$MACHINE_KEY" =~ ^pop_machine_[A-Za-z0-9]+$ ]] || exit 1
          post_machine() {
            local path="$1" body="$2" output="$3"
            curl -sS --proto '=https' --tlsv1.2 \
              -H "X-POP-MACHINE-KEY: $MACHINE_KEY" \
              -H 'Accept: application/json' -H 'Content-Type: application/json' \
              --data "$body" -o "$output" -w '%{http_code}' "$BASE_URL$path"
          }
          body='{"parameters":{"campus_id":16,"decision_reference":"rm-muzha-fixed-schedule-20260930"},"idempotency_key":"founder-muzha-fixed-schedule-20261001"}'
          draft="$WORK_DIR/draft.json"
          draft_status="$(post_machine /api/v1/pop/machine/operations/muzha-fixed-schedule-20261001/draft "$body" "$draft")"
          [[ "$draft_status" == 201 || "$draft_status" == 200 ]] || {
            echo "::error::POP draft HTTP $draft_status"; exit 1;
          }
          REQUEST_ID="$(python3 - "$draft" <<'PY'
          import json, re, sys
          data = json.load(open(sys.argv[1])).get('data') or {}
          request_id = str(data.get('id') or data.get('request_id') or '')
          if not re.fullmatch(r'[0-9a-fA-F-]{36}', request_id):
              raise SystemExit('missing POP request id')
          print(request_id)
          PY
          )"
          result="$WORK_DIR/dry-run.json"
          status="$(post_machine "/api/v1/pop/machine/operations/requests/$REQUEST_ID/dry-run" '{}' "$result")"
          [[ "$status" == 200 ]] || { echo "::error::POP dry-run HTTP $status"; exit 1; }
          python3 - "$result" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1])).get('data') or {}
          plan = data.get('plan') or {}
          assert data.get('ok') and plan.get('ok')
          assert plan.get('state') == 'before'
          assert plan.get('class_ids') == [3428, 3429, 2332, 2335]
          assert plan.get('occurrence_count') == 32
          assert plan.get('time_updates') == 20
          assert plan.get('matching_exceptions_adopted') == 4
          assert plan.get('cancelled_rows_preserved') == 8
          print('POP dry-run passed: four classes, 32 occurrences, 20 time changes, four adopted exceptions, eight cancelled preserved')
          PY
          echo "POP request_id=$REQUEST_ID; no production data mutation requested"
          REMOTE
