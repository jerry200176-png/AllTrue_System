name: Credential Fingerprint Audit (read-only)

on:
  workflow_dispatch:

concurrency:
  group: credential-fingerprint-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Test fingerprint scanner
        run: python3 scripts/credential-fingerprint-audit.test.py

      - name: Extract fingerprints from incident commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/credential-audit/metadata /tmp/credential-audit/blobs
          for sha in 471bdb25f7245b8e5b1c946d9535b354860c1471 \
                     19f40b997b833174039085f1725aea7374f70a24 \
                     113a360aa7b19f0674f550fe94814e58cd916f9f; do
            for page in $(seq 1 10); do
              target="/tmp/credential-audit/metadata/${sha}-${page}.json"
              gh api "repos/${REPOSITORY}/commits/${sha}?per_page=100&page=${page}" > "$target"
              [[ "$(jq '.files | length' "$target")" -gt 0 ]] || break
            done
          done

          python3 scripts/credential-fingerprint-audit.py select-blobs \
            /tmp/credential-audit/metadata/*.json \
            --anchor 607fbb4ef204f62a00eebb61882e481851b3c6272fae5ce482f8b5070e5d19fd \
            --anchor a0cdfe53b136b5eff11e70a734334088e3b084c1df7a138ccd1629548454a0ff \
            --anchor dfd183e526892cd8523a117d471d9d1e588d0cfae13a9964cbb65fd758da3850 \
            --path .cursor/projects/home-admin/agent-transcripts/0aafa49c-2753-406c-b576-5851a26f19c5/0aafa49c-2753-406c-b576-5851a26f19c5.jsonl \
            > /tmp/credential-audit/blob-shas.txt

          while read -r blob_sha; do
            gh api "repos/${REPOSITORY}/git/blobs/${blob_sha}" --jq .content \
              | base64 --decode > "/tmp/credential-audit/blobs/${blob_sha}"
          done < /tmp/credential-audit/blob-shas.txt
          python3 scripts/credential-fingerprint-audit.py extract \
            /tmp/credential-audit/blobs > /tmp/credential-audit/leaked.tsv
          test -s /tmp/credential-audit/leaked.tsv

      - name: Setup pinned SSH identity
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$PI_SSH_KEY"
          test -n "$PI_HOST_KEY"
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          printf '%s\n' "$PI_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Read production fingerprints
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_USER}@${PI_HOST}" bash <<'REMOTE' > /tmp/credential-audit/production.tsv
          set -euo pipefail
          cd /home/admin/backend
          php artisan tinker --execute='
          $emit = static function (string $kind, $values): void {
              foreach ($values as $value) {
                  $value = trim((string) $value);
                  if ($value !== "") echo $kind, "\t", hash("sha256", $value), PHP_EOL;
              }
          };
          $emit("APP_KEY", [config("app.key")]);
          $emit("TELEGRAM", \App\Models\Campus::query()->whereNotNull("TelegramToken")->pluck("TelegramToken"));
          $emit("BEARER", \App\Models\AuthToken::query()
              ->whereNotNull("token")
              ->where(function ($query) {
                  $query->whereNull("expires_at")->orWhere("expires_at", ">", now());
              })->pluck("token"));
          '
          if [[ -r /home/admin/.env.monitor ]]; then
            token="$(sed -n 's/^TELEGRAM_BOT_TOKEN=//p' /home/admin/.env.monitor | tail -n 1)"
            if [[ -n "$token" ]]; then
              printf 'TELEGRAM\t%s\n' "$(printf '%s' "$token" | sha256sum | cut -d' ' -f1)"
            fi
          fi
          REMOTE
          test -s /tmp/credential-audit/production.tsv

      - name: Compare fingerprints
        run: |
          python3 scripts/credential-fingerprint-audit.py compare \
            /tmp/credential-audit/leaked.tsv \
            /tmp/credential-audit/production.tsv

      - name: Remove audit material
        if: always()
        run: rm -rf /tmp/credential-audit ~/.ssh/deploy_key
