name: POP execute
on:
  workflow_call:
    inputs:
      request: {required: true, type: string}
      phase: {required: true, type: string}
      commit_sha: {required: true, type: string}
    secrets:
      POP_APPROVAL_TOKEN: {required: false}
permissions: {contents: read}
jobs:
  execute:
    runs-on: [self-hosted, alltrue-production]
    environment: production-operations
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ inputs.commit_sha }}}
      - run: test "$(git rev-parse HEAD)" = "${{ inputs.commit_sha }}"
      - run: php backend/bin/pop execute --request="${{ inputs.request }}" --phase="${{ inputs.phase }}" --commit-sha="${{ inputs.commit_sha }}" --token="${{ secrets.POP_APPROVAL_TOKEN }}"
