name: Secret Scan

# Execution #473：在 PR 上跑 gitleaks 阻擋憑證 / .env / pem 進入 main。
# 規則：
#  - 所有 PR 都跑（含 dependabot）。
#  - 若新增了 .env / .env.* / *.pem / *.key / id_rsa* 等檔案，無論內容立即 fail。
#  - gitleaks 預設規則庫掃描 commit diff；找到 finding 即 fail。

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "land-queue: PR number whose head this run checks (guarded: head must equal github.sha, base main)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  block-secret-files:
    name: Block secret file types
    if: ${{ !github.event.pull_request.draft }}
    # Current topology: GitHub-hosted. See docs/REF_CI_RUNNER_TOPOLOGY.md.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: PR dispatch guard (fail closed)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          read -r head base state < <(gh api "/repos/$REPO/pulls/$PR_NUMBER" --jq '[.head.sha,.base.ref,.state]|join(" ")')
          [ "$head" = "$GITHUB_SHA" ] && [ "$base" = main ] && [ "$state" = open ] \
            || { echo "::error::pr_number $PR_NUMBER is not an open PR to main with head $GITHUB_SHA"; exit 1; }
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect forbidden files in diff
        env:
          # workflow_dispatch has no pull_request context; fall back to diffing
          # this branch against main so a manual run scans the same range.
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ADDED=$(git diff --name-only --diff-filter=AM "$BASE_SHA" "$HEAD_SHA" || true)
          echo "Changed files:"
          echo "$ADDED"
          BAD=$(echo "$ADDED" | grep -E '(^|/)(\.env(\..+)?|\.env\.monitor|.+\.pem|.+\.key|id_rsa.*|secrets?\.ya?ml|.+\.p12|.+\.pfx)$' | grep -vE '\.env\.(example|monitor\.example|docker|production\.example)$' || true)
          if [ -n "$BAD" ]; then
            echo ""
            echo "❌ Forbidden secret-bearing files in PR:"
            echo "$BAD"
            echo ""
            echo "Allowed alternatives: .env.example, .env.monitor.example with placeholder values."
            exit 1
          fi

          # Also fail if PR would leave forbidden paths tracked on HEAD (not just diff).
          TRACKED=$(git ls-files | grep -E '(^|/)(\.env\.monitor|\.env(\..+)?|.+\.pem|.+\.key|id_rsa.*)$' | grep -vE '\.env\.(example|monitor\.example|docker|production\.example)$' || true)
          CURSOR_TRACKED=$(git ls-files '.cursor/projects/' 2>/dev/null || true)
          if [ -n "$TRACKED" ] || [ -n "$CURSOR_TRACKED" ]; then
            echo ""
            echo "❌ Forbidden secret-bearing or session artifact paths still tracked:"
            [ -n "$TRACKED" ] && echo "$TRACKED"
            [ -n "$CURSOR_TRACKED" ] && echo "$CURSOR_TRACKED" | head -20
            [ -n "$CURSOR_TRACKED" ] && echo "... ($(echo "$CURSOR_TRACKED" | wc -l) .cursor/projects files)"
            exit 1
          fi
          echo "✅ No forbidden secret file types added."

  gitleaks:
    name: gitleaks scan
    if: ${{ !github.event.pull_request.draft }}
    # Use the pinned gitleaks binary directly for deterministic PR-diff scanning.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: PR dispatch guard (fail closed)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          read -r head base state < <(gh api "/repos/$REPO/pulls/$PR_NUMBER" --jq '[.head.sha,.base.ref,.state]|join(" ")')
          [ "$head" = "$GITHUB_SHA" ] && [ "$base" = main ] && [ "$state" = open ] \
            || { echo "::error::pr_number $PR_NUMBER is not an open PR to main with head $GITHUB_SHA"; exit 1; }
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure gitleaks binary (pinned, no Docker)
        run: |
          set -euo pipefail
          VER="8.18.4"
          BIN="$HOME/.local/bin/gitleaks"
          mkdir -p "$HOME/.local/bin"
          if [ ! -x "$BIN" ] || ! "$BIN" version 2>/dev/null | grep -q "$VER"; then
            curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
            tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
            install -m 0755 /tmp/gitleaks "$BIN"
            rm -f /tmp/gitleaks.tgz /tmp/gitleaks
          fi
          "$BIN" version

      - name: Run gitleaks (scan PR commit range)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          BIN="$HOME/.local/bin/gitleaks"
          # 掃描本 PR commit 範圍；找到 finding 預設 exit 1 → fail。--redact 避免把密文印進 log。
          # 註：8.18.x 用 `detect`（`git`/`dir` 子指令是 8.19+ 才有）。
          "$BIN" detect --source . --no-banner --redact -v --log-opts="${BASE_SHA}..${HEAD_SHA}"
