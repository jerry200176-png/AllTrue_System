name: Secret Scan

# Execution #473：在 PR 上跑 gitleaks 阻擋憑證 / .env / pem 進入 main。
# 規則：
#  - 所有 PR 都跑（含 dependabot）。
#  - 若新增了 .env / .env.* / *.pem / *.key / id_rsa* 等檔案，無論內容立即 fail。
#  - gitleaks 預設規則庫掃描 commit diff；找到 finding 即 fail。

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  block-secret-files:
    name: Block secret file types
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect forbidden files in diff
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          ADDED=$(git diff --name-only --diff-filter=AM "$BASE_SHA" "$HEAD_SHA" || true)
          echo "Changed files:"
          echo "$ADDED"
          BAD=$(echo "$ADDED" | grep -E '(^|/)(\.env(\..+)?|.+\.pem|.+\.key|id_rsa.*|secrets?\.ya?ml|.+\.p12|.+\.pfx)$' || true)
          if [ -n "$BAD" ]; then
            echo ""
            echo "❌ Forbidden secret-bearing files in PR:"
            echo "$BAD"
            echo ""
            echo "Allowed alternatives: .env.example with placeholder values."
            exit 1
          fi
          echo "✅ No forbidden secret file types added."

  gitleaks:
    name: gitleaks scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
