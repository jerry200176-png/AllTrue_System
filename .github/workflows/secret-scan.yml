name: Secret Scan

# Execution #473：在 PR 上跑 gitleaks 阻擋憑證 / .env / pem 進入 main。
# 規則：
#  - 所有 PR 都跑（含 dependabot）。
#  - 若新增了 .env / .env.* / *.pem / *.key / id_rsa* 等檔案，無論內容立即 fail。
#  - gitleaks 預設規則庫掃描 commit diff；找到 finding 即 fail。

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  block-secret-files:
    name: Block secret file types
    # INC-2026-001：永久移回 GitHub-hosted runner（SPOF 修復）
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect forbidden files in diff
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          ADDED=$(git diff --name-only --diff-filter=AM "$BASE_SHA" "$HEAD_SHA" || true)
          echo "Changed files:"
          echo "$ADDED"
          BAD=$(echo "$ADDED" | grep -E '(^|/)(\.env(\..+)?|\.env\.monitor|.+\.pem|.+\.key|id_rsa.*|secrets?\.ya?ml|.+\.p12|.+\.pfx)$' | grep -vE '\.env\.(example|monitor\.example|docker|production\.example)$' || true)
          if [ -n "$BAD" ]; then
            echo ""
            echo "❌ Forbidden secret-bearing files in PR:"
            echo "$BAD"
            echo ""
            echo "Allowed alternatives: .env.example, .env.monitor.example with placeholder values."
            exit 1
          fi

          # Also fail if PR would leave forbidden paths tracked on HEAD (not just diff).
          TRACKED=$(git ls-files | grep -E '(^|/)(\.env\.monitor|\.env(\..+)?|.+\.pem|.+\.key|id_rsa.*)$' | grep -vE '\.env\.(example|monitor\.example|docker|production\.example)$' || true)
          CURSOR_TRACKED=$(git ls-files '.cursor/projects/' 2>/dev/null || true)
          if [ -n "$TRACKED" ] || [ -n "$CURSOR_TRACKED" ]; then
            echo ""
            echo "❌ Forbidden secret-bearing or session artifact paths still tracked:"
            [ -n "$TRACKED" ] && echo "$TRACKED"
            [ -n "$CURSOR_TRACKED" ] && echo "$CURSOR_TRACKED" | head -20
            [ -n "$CURSOR_TRACKED" ] && echo "... ($(echo "$CURSOR_TRACKED" | wc -l) .cursor/projects files)"
            exit 1
          fi
          echo "✅ No forbidden secret file types added."

  gitleaks:
    name: gitleaks scan
    # INC-2026-001：永久移回 GitHub-hosted runner（SPOF 修復）；gitleaks 二進位由 curl 下載。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure gitleaks binary (pinned, no Docker)
        run: |
          set -euo pipefail
          VER="8.18.4"
          BIN="$HOME/.local/bin/gitleaks"
          mkdir -p "$HOME/.local/bin"
          if [ ! -x "$BIN" ] || ! "$BIN" version 2>/dev/null | grep -q "$VER"; then
            curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
            tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
            install -m 0755 /tmp/gitleaks "$BIN"
            rm -f /tmp/gitleaks.tgz /tmp/gitleaks
          fi
          "$BIN" version

      - name: Run gitleaks (scan PR commit range)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          BIN="$HOME/.local/bin/gitleaks"
          # 掃描本 PR commit 範圍；找到 finding 預設 exit 1 → fail。--redact 避免把密文印進 log。
          # 註：8.18.x 用 `detect`（`git`/`dir` 子指令是 8.19+ 才有）。
          "$BIN" detect --source . --no-banner --redact -v --log-opts="${BASE_SHA}..${HEAD_SHA}"
