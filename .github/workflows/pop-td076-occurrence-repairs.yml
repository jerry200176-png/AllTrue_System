name: Founder POP TD-076 occurrence repairs (R-1 / R-2)
# Case adapter for POP operations td076-r1-collision-keepers-20261006 / td076-r2-history-pins-20261006 (TD-076 Track B, #3590).
# dry-run (expected_digest empty) is read-only: it drafts a POP request and prints counts plus the sha256 manifest digest (ids only).
# dry-run runs on production-ssh with no click (Founder 2026-10-28 A). approve needs that exact digest and waits for the Founder
# (production-activation gate job), except r2 citing a matching dry-run that scripts/governance/pop_auto_approve.py accepts
# (append-only, no click). Execution stays on the Pi scheduler.
on:
  workflow_dispatch:
    inputs:
      repair:
        description: r1 (collision keepers) or r2 (history pins)
        required: true
        type: choice
        options: [r1, r2]
      campus_id:
        description: CampusID (pilot 11)
        required: true
        type: string
      expected_digest:
        description: Empty for the first dry-run; the reviewed 64-hex manifest digest for the pinned dry-run and approve
        required: false
        type: string
        default: ''
      mode:
        description: dry-run or approve (approve waits for Pi-local verify)
        required: true
        type: choice
        options: [dry-run, approve]
        default: dry-run
      confirm:
        description: "DRY_RUN_TD076_OCCURRENCE_REPAIR_20261006 or APPROVE_TD076_OCCURRENCE_REPAIR_20261006"
        required: true
        type: string
      deployed_backend_sha:
        description: Full backend SHA currently in production (deployment.json backend_sha)
        required: true
        type: string
      dry_run_run_id:
        description: r2 approve without a click only - run id of a successful dry-run of this workflow on main within 24 h
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: alltrue-production-side-effects-v2
  cancel-in-progress: false
  queue: max
jobs:
  guard:
    name: Validate exact TD-076 repair gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      auto_approve: ${{ steps.auto.outputs.auto_approve }}
      attempt: ${{ github.run_attempt }}
    steps:
      - name: Reject scope or confirmation drift
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          INPUT_SHA: ${{ inputs.deployed_backend_sha }}
          REPAIR: ${{ inputs.repair }}
          CAMPUS: ${{ inputs.campus_id }}
          DIGEST: ${{ inputs.expected_digest }}
          DRY_RUN_ID: ${{ inputs.dry_run_run_id }}
        run: |
          set -euo pipefail
          [[ "$MODE" == dry-run || "$MODE" == approve ]] || exit 1
          [[ "$DRY_RUN_ID" =~ ^([1-9][0-9]{0,19})?$ ]] || { echo '::error::dry_run_run_id must be empty or a run id'; exit 1; }
          [[ "$REPAIR" == r1 || "$REPAIR" == r2 ]] || exit 1
          [[ "$CAMPUS" =~ ^[0-9]{1,6}$ ]] || { echo '::error::campus_id must be numeric'; exit 1; }
          [[ "$DIGEST" =~ ^([0-9a-f]{64})?$ ]] || { echo '::error::expected_digest must be empty or 64 hex'; exit 1; }
          [[ "$MODE" == dry-run || -n "$DIGEST" ]] || { echo '::error::approve requires the reviewed expected_digest'; exit 1; }
          [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::deployed_backend_sha must be a full commit SHA'; exit 1; }
          if [[ "$MODE" == dry-run ]]; then
            [[ "$CONFIRM" == DRY_RUN_TD076_OCCURRENCE_REPAIR_20261006 ]] || exit 1
          else
            [[ "$CONFIRM" == APPROVE_TD076_OCCURRENCE_REPAIR_20261006 ]] || exit 1
          fi
          echo "Founder gate passed: mode=$MODE backend_sha=$INPUT_SHA repair=$REPAIR campus=$CAMPUS digest_pinned=$([[ -n "$DIGEST" ]] && echo yes || echo no)"
      - name: Checkout append-only evidence check
        if: ${{ inputs.mode == 'approve' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/governance/pop_auto_approve.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check append-only auto-approve evidence (fails closed to the Founder click)
        id: auto
        if: ${{ inputs.mode == 'approve' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: pop-td076-occurrence-repairs.yml
          MODE: ${{ inputs.mode }}
          REF: ${{ github.ref }}
          MAIN_SHA: ${{ github.sha }}
          BACKEND_SHA: ${{ inputs.deployed_backend_sha }}
          SCOPE: ${{ inputs.repair }}:c${{ inputs.campus_id }}
          DIGEST: ${{ inputs.expected_digest }}
          DRY_RUN_ID: ${{ inputs.dry_run_run_id }}
        run: python3 scripts/governance/pop_auto_approve.py
  founder-approval:
    # Founder 2026-10-28 A: approve waits for the Founder click unless the append-only evidence check passed.
    name: Founder approval (approve mode without append-only evidence)
    needs: guard
    if: ${{ needs.guard.result == 'success' && inputs.mode == 'approve' && needs.guard.outputs.auto_approve != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production-activation
    outputs:
      attempt: ${{ github.run_attempt }}
    steps:
      - run: echo "Founder approved approve mode for run attempt ${{ github.run_attempt }}"
  repair:
    name: Pi-local short-lived POP repair (TD-076 occurrence repairs)
    needs: [guard, founder-approval]
    # dry-run: no click. approve: this attempt's Founder approval, or this attempt's append-only evidence on main.
    if: ${{ !cancelled() && needs.guard.result == 'success' && ((inputs.mode == 'dry-run' && needs.founder-approval.result == 'skipped') || (inputs.mode == 'approve' && needs.founder-approval.result == 'success' && needs.founder-approval.outputs.attempt == github.run_attempt) || (inputs.mode == 'approve' && needs.founder-approval.result == 'skipped' && needs.guard.outputs.auto_approve == 'true' && needs.guard.outputs.attempt == github.run_attempt && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-ssh
    steps:
      - name: Checkout pinned SSH trust helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/production-ssh-trust
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Use pinned Pi SSH host identity
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          MODE: ${{ inputs.mode }}
          TARGET_SHA: ${{ inputs.deployed_backend_sha }}
          REPAIR: ${{ inputs.repair }}
          CAMPUS: ${{ inputs.campus_id }}
          DIGEST: ${{ inputs.expected_digest }}
          RUN_ID: ${{ github.run_id }}
          AUTO: ${{ needs.founder-approval.result == 'skipped' && needs.guard.outputs.auto_approve == 'true' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          test -n "$PI_SSH_KEY" && test -n "$PI_HOST_KEY"
          [[ "$AUTO" == true || "$AUTO" == false ]]
          # Both values were allowlisted by the guard job (mode choice, 40-hex SHA) before reaching the remote shell.
          [[ "$MODE" == dry-run || "$MODE" == approve ]] && [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REPAIR" == r1 || "$REPAIR" == r2 ]] && [[ "$CAMPUS" =~ ^[0-9]{1,6}$ ]] && [[ "$DIGEST" =~ ^([0-9a-f]{64})?$ ]] && [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          SSH_DIR="$RUNNER_TEMP/pop-td076-ssh"
          install -d -m 700 "$SSH_DIR"
          printf '%s' "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > "$SSH_DIR/deploy_key"
          chmod 600 "$SSH_DIR/deploy_key"
          trap 'shred -u "$SSH_DIR/deploy_key" 2>/dev/null || true' EXIT
          ssh -i "$SSH_DIR/deploy_key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$PI_SSH_USER@$PI_SSH_HOST" "MODE='$MODE' TARGET_SHA='$TARGET_SHA' REPAIR='$REPAIR' CAMPUS='$CAMPUS' DIGEST='$DIGEST' RUN_ID='$RUN_ID' AUTO='$AUTO' bash -s" <<'REMOTE'
          set -euo pipefail
          umask 077
          cd /home/admin/backend
          BASE_URL=https://daan.lifenet.com.tw
          if [[ "$REPAIR" == r1 ]]; then
            OPERATION=td076-r1-collision-keepers-20261006; REF=repair-td076-r1-collision-keepers-20261006; AUDIT=pop.td076_r1_collision_keepers
          else
            OPERATION=td076-r2-history-pins-20261006; REF=repair-td076-r2-history-pins-20261006; AUDIT=pop.td076_r2_history_pins
          fi
          APPROVAL_REF="founder-go-td076-$REPAIR-c$CAMPUS-${DIGEST:0:12}"
          # Founder 2026-10-28 A, no click (r2 only): POP accepts this prefix only for the reviewed append-only operations.
          if [[ "$AUTO" == true ]]; then [[ "$REPAIR" == r2 ]] || exit 1; APPROVAL_REF="standing-a-auto-pop-td076-occurrence-repairs-${DIGEST:0:12}"; fi
          WORK_DIR="$(mktemp -d /tmp/pop-td076.XXXXXX)"
          TOKEN=''
          cleanup() {
            unset TOKEN
            case "$WORK_DIR" in /tmp/pop-td076.*) find "$WORK_DIR" -mindepth 1 -delete; rmdir "$WORK_DIR" ;; esac
          }
          trap cleanup EXIT
          manifest="$WORK_DIR/manifest.json"
          curl -sS --fail --proto '=https' --tlsv1.2 "$BASE_URL/deployment.json" -o "$manifest"
          manifest_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["backend_sha"])' "$manifest")"
          [[ "$manifest_sha" == "$TARGET_SHA" ]] || { echo "::error::production backend SHA drifted: manifest=$manifest_sha expected=$TARGET_SHA"; exit 1; }
          echo "production deployment gate passed: backend_sha=$manifest_sha"
          auth_file="$WORK_DIR/auth"
          php artisan tinker --no-ansi --execute='
          $row = \Illuminate\Support\Facades\DB::table("auth_tokens as t")
            ->join("User as u", "u.id", "=", "t.user_id")
            ->where("u.type", "S")->where("t.expires_at", ">", now())
            ->where(function ($q) { $q->where("u.MustChangePassword", 0)->orWhereNull("u.MustChangePassword"); })
            ->orderByDesc("t.expires_at")->select("t.token")->first();
          if (!$row) throw new \RuntimeException("no unexpired super_admin session available on Pi");
          echo (string) $row->token;
          ' > "$auth_file"
          TOKEN="$(<"$auth_file")"
          : > "$auth_file"
          [[ "$TOKEN" =~ ^[A-Za-z0-9]+$ ]] || { echo '::error::Pi short-lived super_admin session format check failed'; exit 1; }
          post_human() {
            local path="$1" body="$2" output="$3"
            curl -sS --proto '=https' --tlsv1.2 -H "Authorization: Bearer $TOKEN" \
              -H 'Accept: application/json' -H 'Content-Type: application/json' --data "$body" -o "$output" -w '%{http_code}' "$BASE_URL$path"
          }
          # Exact catalog-bound parameters; campus and digest were allowlisted by the guard job. The run id keeps each dry-run fresh.
          PARAMETERS_JSON="{\"parameters\":{\"campus_id\":$CAMPUS,\"decision_reference\":\"$REF\",\"expected_digest\":\"$DIGEST\"},\"idempotency_key\":\"td076-$REPAIR-c$CAMPUS-${DIGEST:0:12}-$RUN_ID\"}"
          draft="$WORK_DIR/draft.json"
          draft_status="$(post_human "/api/v1/pop/operations/$OPERATION/draft" "$PARAMETERS_JSON" "$draft")"
          [[ "$draft_status" == 201 || "$draft_status" == 200 ]] || { echo "::error::POP draft rejected with HTTP $draft_status"; exit 1; }
          REQUEST_ID="$(python3 - "$draft" <<'PY'
          import json, re, sys
          data = json.load(open(sys.argv[1])).get('data', {})
          request_id = str(data.get('id') or data.get('request_id') or '')
          if not re.fullmatch(r'[0-9a-fA-F-]{36}', request_id):
              raise SystemExit('draft response did not contain a request id')
          print(request_id)
          PY
          )"
          echo "request created/reused: request_id=$REQUEST_ID operation=$OPERATION"
          dry_run="$WORK_DIR/dry-run.json"
          dry_status="$(post_human "/api/v1/pop/operations/requests/$REQUEST_ID/dry-run" '{}' "$dry_run")"
          python3 - "$dry_run" <<'PY' || echo "dry_run response unparsable"
          import json, os, re, sys
          body = json.load(open(sys.argv[1]))
          data = body.get('data', body)
          plan = data.get('plan', data.get('result', data)) if isinstance(data, dict) else {}
          errs = [str(e) for e in (plan.get('errors') or []) if re.fullmatch(r'[A-Za-z0-9_:-]{1,96}', str(e))][:64]
          print('dry_run ok=%s state=%s errors=%s' % (plan.get('ok'), plan.get('state'), ','.join(errs) or '-'))
          # ids only, no names: counts, digest and the manifest rows Jerry reviews (the repo and logs are public).
          print('digest=%s counts=%s' % (plan.get('digest'), json.dumps(plan.get('counts'), sort_keys=True)))
          print('manifest=%s' % json.dumps(plan.get('manifest'), sort_keys=True, separators=(',', ':')))
          if os.environ['MODE'] == 'dry-run':  # read by scripts/governance/pop_auto_approve.py; blocked = quarantined rows
              q = (plan.get('counts') or {}).get('quarantine')
              blocked = 0 if q == [] else sum(q.values()) if isinstance(q, dict) and all(type(v) is int for v in q.values()) else None
              print('POP_DRY_RUN_EVIDENCE ' + json.dumps({'workflow': 'pop-td076-occurrence-repairs.yml', 'mode': 'dry-run',
                  'backend_sha': os.environ['TARGET_SHA'], 'scope': '%s:c%s' % (os.environ['REPAIR'], os.environ['CAMPUS']),
                  'digest': plan.get('digest') if re.fullmatch(r'[0-9a-f]{64}', str(plan.get('digest'))) else None,
                  'blocked': blocked, 'ok': plan.get('ok') is True and not plan.get('errors'), 'run_id': os.environ['RUN_ID']}, sort_keys=True))
          PY
          [[ "$dry_status" == 200 ]] || { echo "::error::POP dry-run rejected with HTTP $dry_status"; exit 1; }
          if [[ "$MODE" == approve ]]; then
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); d=d.get("data", d); p=d.get("plan", d.get("result", d)); sys.exit(0 if p.get("state") == "pinned" else 1)' "$dry_run" \
              || { echo '::error::approve requires the pinned dry-run to report state=pinned (digest must match the live manifest)'; exit 1; }
          fi
          if [[ "$AUTO" == true ]]; then
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); d=d.get("data", d); p=d.get("plan", d.get("result", d)); q=(p.get("counts") or {}).get("quarantine"); sys.exit(0 if p.get("ok") is True and not p.get("errors") and p.get("state") == "pinned" and q in ([], {}) else 1)' "$dry_run" \
              || { echo '::error::append-only auto approve refused: the fresh plan is not pinned or has errors / quarantined rows'; exit 1; }
          fi
          if [[ "$MODE" != approve ]]; then
            echo "dry-run only: no approval issued"
            exit 0
          fi
          approval="$WORK_DIR/approval.json"
          approval_body="{\"approval_reference\":\"$APPROVAL_REF\",\"commit_sha\":\"$TARGET_SHA\",\"ttl_minutes\":15}"
          approval_status="$(post_human "/api/v1/pop/operations/requests/$REQUEST_ID/approvals" "$approval_body" "$approval")"
          [[ "$approval_status" == 200 ]] || { echo "::error::POP approval rejected with HTTP $approval_status"; exit 1; }
          python3 - "$approval" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1])).get('data', {})
          if not data.get('ready') or not data.get('token'):
              raise SystemExit('approval did not become ready')
          print('approval=ready status=%s ttl=15m' % data.get('status', 'unknown'))
          PY
          unset TOKEN
          # Observe only. The Pi scheduler consumes the approved request and records execute+verify.
          status_file="$WORK_DIR/status.json"
          for attempt in $(seq 1 45); do
            REQUEST_ID="$REQUEST_ID" AUDIT="$AUDIT" php artisan tinker --no-ansi --execute='
            $request = \Illuminate\Support\Facades\DB::table("pop_operation_requests")->where("id", getenv("REQUEST_ID"))->first();
            $records = \Illuminate\Support\Facades\DB::table("pop_execution_records")->where("operation_id", getenv("REQUEST_ID"))->orderBy("created_at")->get(["phase", "result", "actor", "commit_sha", "approval_reference", "snapshot"]);
            $repairAudits = \Illuminate\Support\Facades\DB::table("security_audit_events")
              ->where("event_type", getenv("AUDIT"))->where("outcome", "success")
              ->where("occurred_at", ">=", $request->created_at)->count();
            echo json_encode(["request_status" => (string) ($request->status ?? "missing"), "records" => $records->map(fn ($r) => ["phase" => (string) $r->phase, "result" => (string) $r->result, "actor" => (string) $r->actor, "commit_sha" => (string) $r->commit_sha, "approval_reference" => (string) $r->approval_reference, "snapshot_present" => (string) $r->snapshot !== ""])->values()->all(), "repair_audit_count" => $repairAudits], JSON_THROW_ON_ERROR);
            ' > "$status_file"
            if poll_summary="$(TARGET_SHA="$TARGET_SHA" APPROVAL_REF="$APPROVAL_REF" python3 - "$status_file" <<'PY'
          import json, os, sys
          body = json.load(open(sys.argv[1]))
          records = {row['phase']: row for row in body.get('records', [])}
          execute = records.get('execute', {})
          verify = records.get('verify', {})
          ready = (
              body.get('request_status') == 'succeeded' and
              execute.get('result') == 'succeeded' and verify.get('result') == 'succeeded' and
              execute.get('actor') == 'pop-pi-local' and verify.get('actor') == 'pop-pi-local' and
              execute.get('commit_sha') == os.environ['TARGET_SHA'] and verify.get('commit_sha') == os.environ['TARGET_SHA'] and
              execute.get('approval_reference') == os.environ['APPROVAL_REF'] and
              verify.get('approval_reference') == os.environ['APPROVAL_REF'] and
              execute.get('snapshot_present') is True and body.get('repair_audit_count', 0) >= 1
          )
          if ready:
              print('pi_execute=succeeded pi_verify=succeeded audit=verified rollback_snapshot=present')
              raise SystemExit(0)
          if body.get('request_status') in {'failed', 'verification_failed', 'rolled_back'} or verify.get('result') in {'failed', 'verification_failed'}:
              print('::error::Pi-local execute/verify failed (the POP rollback snapshot is kept): request_status=%s execute=%s verify=%s' % (body.get('request_status'), execute.get('result', 'missing'), verify.get('result', 'pending')))
              raise SystemExit(1)
          print('pi_local=pending request_status=%s execute=%s verify=%s' % (body.get('request_status'), execute.get('result', 'pending'), verify.get('result', 'pending')))
          raise SystemExit(2)
          PY
            )"; then
              echo "$poll_summary"
              exit 0
            else
              poll_rc=$?
              echo "$poll_summary"
              [[ "$poll_rc" == 2 ]] || exit "$poll_rc"
            fi
            sleep 15
          done
          echo '::error::Pi-local execute/verify did not complete within the bounded observation window'
          exit 1
          REMOTE
