name: Bug detail dump (read-only)

# Dump one in-app bug (description/comments/attachments meta + related course probe).
# Trigger via request file; no writes.
on:
  workflow_dispatch:
    inputs:
      bug_id:
        description: "In-app bug report ID to dump (read-only)"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'operations/closeout/bug-detail-dump.request.md'
      - '.github/workflows/bug-detail-dump.yml'

concurrency:
  group: bug-detail-dump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout request
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            operations/closeout/bug-detail-dump.request.md
          sparse-checkout-cone-mode: false

      - name: Parse bug id
        id: cfg
        env:
          DISPATCH_BUG_ID: ${{ inputs.bug_id || '' }}
        run: |
          set -euo pipefail
          if [[ -n "${DISPATCH_BUG_ID}" ]]; then
            ID="${DISPATCH_BUG_ID}"
          else
            ID=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("operations/closeout/bug-detail-dump.request.md").read_text(encoding="utf-8")
          m = re.search(r"(?m)^bug_id:\s*(\d+)\s*$", text)
          if not m:
              raise SystemExit("bug_id missing")
          print(m.group(1))
          PY
            )
          fi
          if [[ ! "${ID}" =~ ^[0-9]+$ ]]; then
            echo "bug_id must be numeric" >&2
            exit 1
          fi
          echo "bug_id=$ID" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ssh-keyscan -H "$PI_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "keyscan ok"
          elif [[ -n "${PI_HOST_KEY:-}" ]]; then
            printf '%s\n' "$PI_HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::error::no host key"; exit 1
          fi

      - name: Dump bug + related probe
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          BUG_ID: ${{ steps.cfg.outputs.bug_id }}
        run: |
          set -euo pipefail
          mkdir -p out
          # Build remote PHP with bug id baked in (avoid getenv/heredoc expansion pitfalls)
          python3 - <<'PY' > /tmp/bug207_probe.php
          import os
          bug_id = int(os.environ["BUG_ID"])
          print(f"""<?php
          $bugId = {bug_id};
          $db = \\Illuminate\\Support\\Facades\\DB::class;
          $redact = function ($s) {{
            $s = (string)$s;
            $s = preg_replace("/\\b09\\d{{8}}\\b/", "[phone]", $s);
            $s = preg_replace("/\\b\\d{{8,}}\\b/", "[num]", $s);
            $s = preg_replace("/[A-Z0-9._%+-]+@[A-Z0-9.-]+\\.[A-Z]{{2,}}/i", "[email]", $s);
            return $s;
          }};
          $bug = $db::table("bug_reports")->where("id", $bugId)->first();
          if (!$bug) {{ echo json_encode(["ok"=>false,"error"=>"missing"]); return; }}
          $atts = $db::table("bug_report_attachments")->where("bug_report_id", $bugId)->get(["id","original_name","stored_path","mime_type","size"]);
          $comments = $db::table("bug_report_comments")->where("bug_report_id", $bugId)->orderBy("id")->get(["id","author_user_id","is_internal_note","body","created_at"]);
          $logs = $db::table("bug_report_status_logs")->where("bug_report_id", $bugId)->orderBy("id")->get(["id","from_status","to_status","changed_by","note","created_at"]);
          $reporterBugs = $db::table("bug_reports")
            ->where("reporter_user_id", $bug->reporter_user_id)
            ->orderByDesc("id")
            ->limit(100)
            ->get(["id","status","severity","CampusID","page_key","title","created_at","updated_at"]);
          $reporterBugIds = $reporterBugs->pluck("id")->map(fn ($id) => (int)$id)->all();
          $reporterHistory = [];
          foreach ($reporterBugs as $historyBug) {{
            $historyTitle = $redact($historyBug->title ?? "");
            if (mb_strlen($historyTitle) > 120) $historyTitle = mb_substr($historyTitle, 0, 120)."...";
            $historyAttachments = $db::table("bug_report_attachments")
              ->where("bug_report_id", (int)$historyBug->id)->pluck("id")
              ->map(fn ($id) => (int)$id)->all();
            $reporterHistory[] = [
              "id"=>(int)$historyBug->id, "status"=>$historyBug->status,
              "severity"=>$historyBug->severity, "campus_id"=>$historyBug->CampusID,
              "page_key"=>$historyBug->page_key, "title"=>$historyTitle,
              "created_at"=>$historyBug->created_at, "updated_at"=>$historyBug->updated_at,
              "attachment_ids"=>$historyAttachments,
            ];
          }}
          $reporterComments = [];
          foreach ($db::table("bug_report_comments")->whereIn("bug_report_id", $reporterBugIds)->orderBy("id")->get(["id","bug_report_id","author_user_id","is_internal_note","body","created_at"]) as $c) {{
            $body = $redact($c->body ?? "");
            if (mb_strlen($body) > 1500) $body = mb_substr($body, 0, 1500)."...";
            $reporterComments[] = ["id"=>(int)$c->id, "bug_report_id"=>(int)$c->bug_report_id, "author"=>(int)$c->author_user_id, "internal"=>(bool)$c->is_internal_note, "body"=>$body, "at"=>$c->created_at];
          }}
          $reporterStatusLogs = [];
          foreach ($db::table("bug_report_status_logs")->whereIn("bug_report_id", $reporterBugIds)->orderBy("id")->get(["id","bug_report_id","from_status","to_status","changed_by","note","created_at"]) as $log) {{
            $note = $redact($log->note ?? "");
            if (mb_strlen($note) > 1000) $note = mb_substr($note, 0, 1000)."...";
            $reporterStatusLogs[] = ["id"=>(int)$log->id, "bug_report_id"=>(int)$log->bug_report_id, "from_status"=>$log->from_status, "to_status"=>$log->to_status, "changed_by"=>(int)$log->changed_by, "note"=>$note, "at"=>$log->created_at];
          }}
          $desc = $redact($bug->description ?? "");
          if (mb_strlen($desc) > 4000) $desc = mb_substr($desc, 0, 4000)."…";
          $title = $redact($bug->title ?? "");
          $cmtOut = [];
          foreach ($comments as $c) {{
            $body = $redact($c->body ?? "");
            if (mb_strlen($body) > 1500) $body = mb_substr($body, 0, 1500)."…";
            $cmtOut[] = ["id"=>(int)$c->id,"author"=>(int)$c->author_user_id,"internal"=>(bool)$c->is_internal_note,"body"=>$body,"at"=>$c->created_at];
          }}
          // #208-specific probe: package 124 (student 林立晴) + member course 2825 (English),
          // to confirm whether the one-time POST /course-packages/124/recompute ever ran
          // (i.e. whether course 2825's RemainingSessions is still the stale pre-edit value).
          $pkg = $db::table("course_packages")->where("id", 124)->first([
            "id","student_id","campus_id","total_sessions","remaining_sessions","used_sessions","paid","stop","updated_at",
          ]);
          $pkgMembers = $db::table("StudentClass as sc")
            ->leftJoin("User as u", "u.id", "=", "sc.TeacherID")
            ->leftJoin("Student as s", "s.id", "=", "sc.StudentID")
            ->where("sc.PackageID", 124)
            ->orderBy("sc.id")
            ->get(["sc.id","sc.StudentID","sc.TeacherID","u.Name as teacher_name","sc.SubjectID","sc.SessionCount","sc.RemainingSessions","sc.UsedSessions","sc.PackageTotalSessions","sc.Stop","s.CampusID as campus_id","sc.MDate as updated_at"]);
          $course2825 = $db::table("StudentClass as sc")
            ->leftJoin("Student as s", "s.id", "=", "sc.StudentID")
            ->where("sc.id", 2825)
            ->first(["sc.id","sc.StudentID","sc.TeacherID","sc.SubjectID","sc.PackageID","sc.SessionCount","sc.RemainingSessions","sc.UsedSessions","sc.PackageTotalSessions","sc.Stop","s.CampusID as campus_id","sc.MDate as updated_at"]);
          $recomputeLedger = $db::table("package_session_ledger")
            ->where("package_id", 124)
            ->orderByDesc("id")
            ->limit(10)
            ->get(["id","package_id","student_class_id","class_session_id","delta","reason","recorded_by","created_at"]);
          // #228/#229/#233 probe: campus 3 orphan-scheduled-exception hypothesis
          // (TD-076 / GitHub #1690 backend gap, GitHub #1733). Only runs for these
          // bug ids so it doesn't become permanent overhead on unrelated dumps.
          $scheduleEvidence = null;
          if (in_array($bugId, [228, 229, 233], true)) {{
            $names = ["張維耀", "曾與岑", "詹筑媗"];
            $students = $db::table("Student")
              ->where("CampusID", 3)
              ->where(function ($q) use ($names) {{
                foreach ($names as $n) {{ $q->orWhere("Name", "like", "%" . $n . "%"); }}
              }})
              ->get(["id", "Name", "CampusID"]);
            $studentIds = $students->pluck("id")->map(fn ($id) => (int) $id)->all();
            $courses = empty($studentIds) ? collect() : $db::table("StudentClass")
              ->whereIn("StudentID", $studentIds)
              ->get(["id", "StudentID", "TeacherID", "SubjectID", "Stop", "ClassType", "room_id", "SessionCount", "RemainingSessions", "UsedSessions", "PackageID", "ScheduleMode", "scheduling_policy", "StartDate", "EndDate"]);
            $courseIds = $courses->pluck("id")->map(fn ($id) => (int) $id)->all();
            $scheduleRows = empty($courseIds) ? collect() : $db::table("schedules")
              ->whereIn("student_course_id", $courseIds)
              ->whereBetween("schedule_date", ["2026-08-08", "2026-08-17"])
              ->orderBy("student_course_id")->orderBy("schedule_date")
              ->get(["id", "student_course_id", "student_id", "teacher_id", "branch_id", "status", "schedule_date", "start_time", "end_time", "original_schedule_id", "created_at", "updated_at"]);
            $sessionRows = empty($courseIds) ? collect() : $db::table("ClassSession")
              ->whereIn("StudentClassID", $courseIds)
              ->whereBetween("SessionDate", ["2026-08-08", "2026-08-17"])
              ->orderBy("StudentClassID")->orderBy("SessionDate")
              ->get(["id", "StudentClassID", "SessionDate", "StartTime", "EndTime", "Status"]);
            // Decisive orphan-chain check: a 'scheduled' row that is ITSELF later
            // referenced as another row's original_schedule_id was rescheduled
            // again but never flipped out of 'scheduled' — the TD-076 orphan.
            $orphanChainRows = $db::table("schedules as s1")
              ->where("s1.branch_id", 3)
              ->where("s1.status", "scheduled")
              ->whereExists(function ($q) {{
                $q->selectRaw("1")->from("schedules as s2")
                  ->whereColumn("s2.original_schedule_id", "s1.id");
              }})
              ->whereBetween("s1.schedule_date", ["2026-08-01", "2026-08-17"])
              ->get(["s1.id", "s1.student_course_id", "s1.student_id", "s1.teacher_id", "s1.status", "s1.schedule_date", "s1.start_time", "s1.end_time", "s1.original_schedule_id"]);
            // Saturday 8/15 10-12 destination-slot occupancy at campus 3, broadly
            // (not filtered by student) — tests #233's "shows 2, actually 1" claim.
            $satSlotSchedules = $db::table("schedules")
              ->where("branch_id", 3)
              ->where("schedule_date", "2026-08-15")
              ->where("start_time", "<", "12:00:00")
              ->where("end_time", ">", "10:00:00")
              ->get(["id", "student_course_id", "student_id", "teacher_id", "status", "start_time", "end_time", "original_schedule_id"]);
            $satSlotSessions = $db::table("ClassSession")
              ->where("SessionDate", "2026-08-15")
              ->where("StartTime", "<", "12:00:00")
              ->where("EndTime", ">", "10:00:00")
              ->whereIn("StudentClassID", function ($q) {{
                $q->select("sc2.ID")->from("StudentClass as sc2")
                  ->join("Student as st2", "st2.id", "=", "sc2.StudentID")
                  ->where("st2.CampusID", 3);
              }})
              ->get(["id", "StudentClassID", "SessionDate", "StartTime", "EndTime", "Status"]);
            $scheduleEvidence = [
              "students" => $students,
              "courses" => $courses,
              "schedules" => $scheduleRows,
              "class_sessions" => $sessionRows,
              "orphan_chain_rows_campus3" => $orphanChainRows,
              "sat_0815_10to12_schedules_campus3" => $satSlotSchedules,
              "sat_0815_10to12_class_sessions_campus3" => $satSlotSessions,
            ];
          }}
          // #230/#231/#232 probe: campus 9 billing/course-mgmt cluster (陳姝彣,
          // 張珉恩), same reporter, same day. Only runs for these bug ids.
          $billingEvidence = null;
          if (in_array($bugId, [230, 231, 232], true)) {{
            $names2 = ["陳姝彣", "張珉恩"];
            $students2 = $db::table("Student")
              ->where("CampusID", 9)
              ->where(function ($q) use ($names2) {{
                foreach ($names2 as $n) {{ $q->orWhere("Name", "like", "%" . $n . "%"); }}
              }})
              ->get(["id", "Name", "CampusID"]);
            $studentIds2 = $students2->pluck("id")->map(fn ($id) => (int) $id)->all();
            $courses2 = empty($studentIds2) ? collect() : $db::table("StudentClass")
              ->whereIn("StudentID", $studentIds2)
              ->get([
                "id", "StudentID", "TeacherID", "SubjectID", "Stop", "ClassType",
                "Rate", "rate_unit", "Charge", "Pay", "Paid", "Disconunt",
                "SessionCount", "RemainingSessions", "UsedSessions", "SessionDuration",
                "standard_lesson_minutes", "deduction_basis", "PackageID",
                "settlement_day", "monthly_sessions", "MDate", "StartDate", "EndDate",
              ]);
            $courseIds2 = $courses2->pluck("id")->map(fn ($id) => (int) $id)->all();
            $invoices2 = "skipped";
            try {{
              if (!empty($courseIds2) && \\Illuminate\\Support\\Facades\\Schema::hasTable("invoices")) {{
                $invoices2 = $db::table("invoices")
                  ->whereIn("student_class_id", $courseIds2)
                  ->orderByDesc("id")->limit(30)
                  ->get(["id", "student_class_id", "status", "amount", "period_start", "period_end", "issued_at", "created_at"]);
              }}
            }} catch (\\Throwable $e) {{ $invoices2 = "error: " . $e->getMessage(); }}
            $payments2 = "skipped";
            try {{
              if (!empty($courseIds2) && \\Illuminate\\Support\\Facades\\Schema::hasTable("Payment")) {{
                $payments2 = $db::table("Payment")
                  ->whereIn("student_class_id", $courseIds2)
                  ->orderByDesc("id")->limit(30)
                  ->get();
              }}
            }} catch (\\Throwable $e) {{ $payments2 = "error: " . $e->getMessage(); }}
            $billingEvidence = [
              "students" => $students2,
              "courses" => $courses2,
              "invoices" => $invoices2,
              "payments" => $payments2,
            ];
          }}
          echo json_encode([
            "ok" => true,
            "bug" => [
              "id"=>(int)$bug->id,
              "status"=>$bug->status,
              "severity"=>$bug->severity,
              "campus_id"=>$bug->CampusID,
              "page_key"=>$bug->page_key,
              "reporter_user_id"=>(int)$bug->reporter_user_id,
              "title"=>$title,
              "description"=>$desc,
              "created_at"=>$bug->created_at,
              "updated_at"=>$bug->updated_at,
            ],
            "attachments" => $atts,
            "comments" => $cmtOut,
            "status_logs" => $logs,
            "reporter_history" => $reporterHistory,
            "reporter_history_comments" => $reporterComments,
            "reporter_history_status_logs" => $reporterStatusLogs,
            "probe_228_229_233_schedule_evidence" => $scheduleEvidence,
            "probe_230_231_232_billing_evidence" => $billingEvidence,
            "probe_208_package_recompute" => [
              "package_124" => $pkg,
              "package_124_members" => $pkgMembers,
              "course_2825" => $course2825,
              "package_124_ledger_recent" => $recomputeLedger,
            ],
            "prod_head" => trim((string)@shell_exec("git rev-parse HEAD")),
            "dump_generated_at" => gmdate("c"),
          ], JSON_UNESCAPED_UNICODE), PHP_EOL;
          """)
          PY
          # shellcheck: pass PHP source via stdin to remote tinker is hard; use base64
          B64=$(base64 -w0 /tmp/bug207_probe.php)
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_SSH_USER}@${PI_SSH_HOST}" \
            "B64='${B64}' bash -s" <<'REMOTE' | tee out/bug-detail.log
          set -euo pipefail
          cd /home/admin/backend
          php -r 'file_put_contents("/tmp/bug_detail_probe.php", base64_decode(getenv("B64")));'
          # Use artisan tinker with file include via execute
          php artisan tinker --execute='require "/tmp/bug_detail_probe.php";'
          rm -f /tmp/bug_detail_probe.php
          REMOTE
          python3 - <<'PY'
          from pathlib import Path
          import json
          text = Path("out/bug-detail.log").read_text(encoding="utf-8", errors="replace")
          obj = None
          for line in text.splitlines():
            line=line.strip()
            if line.startswith("{") and '"ok"' in line:
              try:
                obj=json.loads(line)
              except Exception:
                pass
          Path("out/bug-detail.json").write_text(json.dumps(obj or {"ok":False,"raw_tail":text[-2000:]}, ensure_ascii=False, indent=2), encoding="utf-8")
          print("parsed", bool(obj and obj.get("ok")))
          PY

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bug-detail-dump
          path: out/
          retention-days: 14
