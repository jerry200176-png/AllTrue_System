name: Bug detail dump (read-only)

# Dump one in-app bug (description/comments/attachments meta + related course probe).
# Trigger via request file; no writes.
on:
  workflow_dispatch:
    inputs:
      bug_id:
        description: "In-app bug report ID to dump (read-only)"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'operations/closeout/bug-detail-dump.request.md'
      - '.github/workflows/bug-detail-dump.yml'

concurrency:
  group: bug-detail-dump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout request
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            operations/closeout/bug-detail-dump.request.md
          sparse-checkout-cone-mode: false

      - name: Parse bug id
        id: cfg
        env:
          DISPATCH_BUG_ID: ${{ inputs.bug_id || '' }}
        run: |
          set -euo pipefail
          if [[ -n "${DISPATCH_BUG_ID}" ]]; then
            ID="${DISPATCH_BUG_ID}"
          else
            ID=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("operations/closeout/bug-detail-dump.request.md").read_text(encoding="utf-8")
          m = re.search(r"(?m)^bug_id:\s*(\d+)\s*$", text)
          if not m:
              raise SystemExit("bug_id missing")
          print(m.group(1))
          PY
            )
          fi
          if [[ ! "${ID}" =~ ^[0-9]+$ ]]; then
            echo "bug_id must be numeric" >&2
            exit 1
          fi
          echo "bug_id=$ID" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ssh-keyscan -H "$PI_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "keyscan ok"
          elif [[ -n "${PI_HOST_KEY:-}" ]]; then
            printf '%s\n' "$PI_HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::error::no host key"; exit 1
          fi

      - name: Dump bug + related probe
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          BUG_ID: ${{ steps.cfg.outputs.bug_id }}
        run: |
          set -euo pipefail
          mkdir -p out
          # Build remote PHP with bug id baked in (avoid getenv/heredoc expansion pitfalls)
          python3 - <<'PY' > /tmp/bug207_probe.php
          import os
          bug_id = int(os.environ["BUG_ID"])
          print(f"""<?php
          $bugId = {bug_id};
          $db = \\Illuminate\\Support\\Facades\\DB::class;
          $redact = function ($s) {{
            $s = (string)$s;
            $s = preg_replace("/\\b09\\d{{8}}\\b/", "[phone]", $s);
            $s = preg_replace("/\\b\\d{{8,}}\\b/", "[num]", $s);
            $s = preg_replace("/[A-Z0-9._%+-]+@[A-Z0-9.-]+\\.[A-Z]{{2,}}/i", "[email]", $s);
            return $s;
          }};
          $bug = $db::table("bug_reports")->where("id", $bugId)->first();
          if (!$bug) {{ echo json_encode(["ok"=>false,"error"=>"missing"]); return; }}
          $atts = $db::table("bug_report_attachments")->where("bug_report_id", $bugId)->get(["id","original_name","stored_path","mime_type","size"]);
          $comments = $db::table("bug_report_comments")->where("bug_report_id", $bugId)->orderBy("id")->get(["id","author_user_id","is_internal_note","body","created_at"]);
          $logs = $db::table("bug_report_status_logs")->where("bug_report_id", $bugId)->orderBy("id")->get(["id","from_status","to_status","changed_by","note","created_at"]);
          $reporterBugs = $db::table("bug_reports")
            ->where("reporter_user_id", $bug->reporter_user_id)
            ->orderByDesc("id")
            ->limit(100)
            ->get(["id","status","severity","CampusID","page_key","title","created_at","updated_at"]);
          $reporterBugIds = $reporterBugs->pluck("id")->map(fn ($id) => (int)$id)->all();
          $reporterHistory = [];
          foreach ($reporterBugs as $historyBug) {{
            $historyTitle = $redact($historyBug->title ?? "");
            if (mb_strlen($historyTitle) > 120) $historyTitle = mb_substr($historyTitle, 0, 120)."...";
            $historyAttachments = $db::table("bug_report_attachments")
              ->where("bug_report_id", (int)$historyBug->id)->pluck("id")
              ->map(fn ($id) => (int)$id)->all();
            $reporterHistory[] = [
              "id"=>(int)$historyBug->id, "status"=>$historyBug->status,
              "severity"=>$historyBug->severity, "campus_id"=>$historyBug->CampusID,
              "page_key"=>$historyBug->page_key, "title"=>$historyTitle,
              "created_at"=>$historyBug->created_at, "updated_at"=>$historyBug->updated_at,
              "attachment_ids"=>$historyAttachments,
            ];
          }}
          $reporterComments = [];
          foreach ($db::table("bug_report_comments")->whereIn("bug_report_id", $reporterBugIds)->orderBy("id")->get(["id","bug_report_id","author_user_id","is_internal_note","body","created_at"]) as $c) {{
            $body = $redact($c->body ?? "");
            if (mb_strlen($body) > 1500) $body = mb_substr($body, 0, 1500)."...";
            $reporterComments[] = ["id"=>(int)$c->id, "bug_report_id"=>(int)$c->bug_report_id, "author"=>(int)$c->author_user_id, "internal"=>(bool)$c->is_internal_note, "body"=>$body, "at"=>$c->created_at];
          }}
          $reporterStatusLogs = [];
          foreach ($db::table("bug_report_status_logs")->whereIn("bug_report_id", $reporterBugIds)->orderBy("id")->get(["id","bug_report_id","from_status","to_status","changed_by","note","created_at"]) as $log) {{
            $note = $redact($log->note ?? "");
            if (mb_strlen($note) > 1000) $note = mb_substr($note, 0, 1000)."...";
            $reporterStatusLogs[] = ["id"=>(int)$log->id, "bug_report_id"=>(int)$log->bug_report_id, "from_status"=>$log->from_status, "to_status"=>$log->to_status, "changed_by"=>(int)$log->changed_by, "note"=>$note, "at"=>$log->created_at];
          }}
          $desc = $redact($bug->description ?? "");
          if (mb_strlen($desc) > 4000) $desc = mb_substr($desc, 0, 4000)."…";
          $title = $redact($bug->title ?? "");
          $cmtOut = [];
          foreach ($comments as $c) {{
            $body = $redact($c->body ?? "");
            if (mb_strlen($body) > 1500) $body = mb_substr($body, 0, 1500)."…";
            $cmtOut[] = ["id"=>(int)$c->id,"author"=>(int)$c->author_user_id,"internal"=>(bool)$c->is_internal_note,"body"=>$body,"at"=>$c->created_at];
          }}
          // #208-specific probe: package 124 (student 林立晴) + member course 2825 (English),
          // to confirm whether the one-time POST /course-packages/124/recompute ever ran
          // (i.e. whether course 2825's RemainingSessions is still the stale pre-edit value).
          $pkg = $db::table("course_packages")->where("id", 124)->first([
            "id","student_id","campus_id","total_sessions","remaining_sessions","used_sessions","paid","stop","updated_at",
          ]);
          $pkgMembers = $db::table("StudentClass as sc")
            ->leftJoin("User as u", "u.id", "=", "sc.TeacherID")
            ->leftJoin("Student as s", "s.id", "=", "sc.StudentID")
            ->where("sc.PackageID", 124)
            ->orderBy("sc.id")
            ->get(["sc.id","sc.StudentID","sc.TeacherID","u.Name as teacher_name","sc.SubjectID","sc.SessionCount","sc.RemainingSessions","sc.UsedSessions","sc.PackageTotalSessions","sc.Stop","s.CampusID as campus_id","sc.MDate as updated_at"]);
          $course2825 = $db::table("StudentClass as sc")
            ->leftJoin("Student as s", "s.id", "=", "sc.StudentID")
            ->where("sc.id", 2825)
            ->first(["sc.id","sc.StudentID","sc.TeacherID","sc.SubjectID","sc.PackageID","sc.SessionCount","sc.RemainingSessions","sc.UsedSessions","sc.PackageTotalSessions","sc.Stop","s.CampusID as campus_id","sc.MDate as updated_at"]);
          $recomputeLedger = $db::table("package_session_ledger")
            ->where("package_id", 124)
            ->orderByDesc("id")
            ->limit(10)
            ->get(["id","package_id","student_class_id","class_session_id","delta","reason","recorded_by","created_at"]);

          // #241-specific production acceptance probe. This is deliberately
          // read-only: invoke the same projection read methods used by the
          // teacher calendar without entering the public endpoint's
          // auto-materialization boundary. Emit IDs and slot coordinates only;
          // do not export student/teacher names or descriptions.
          $probe241 = ["enabled" => false, "read_only" => true];
          if ($bugId === 241) {{
            $probe241["enabled"] = true;
            $probe241["date_range"] = ["start" => "2026-08-23", "end" => "2026-08-29"];
            $probe241["target_slot"] = ["date" => "2026-08-29", "start" => "13:00", "end" => "15:00"];
            try {{
              $campusId = (int)$bug->CampusID;
              $targetName = "洪睿淵";
              $targetStudentIds = $db::table("Student")
                ->where("CampusID", $campusId)
                ->where("name", "like", "%".$targetName."%")
                ->pluck("id")->map(fn ($id) => (int)$id)->all();
              $targetTeacherIds = $db::table("User")
                ->where("Name", "like", "%".$targetName."%")
                ->pluck("id")->map(fn ($id) => (int)$id)->all();
              $targetIds = array_values(array_unique(array_merge($targetStudentIds, $targetTeacherIds)));
              $probe241["target_student_count"] = count($targetStudentIds);
              $probe241["target_teacher_count"] = count($targetTeacherIds);
              $candidateClasses = collect();
              if ($targetIds !== []) {{
                $candidateClasses = $db::table("StudentClass as sc")
                  ->join("Student as s", "s.id", "=", "sc.StudentID")
                  ->leftJoin("rooms as r", "r.id", "=", "sc.room_id")
                  ->where(function ($q) use ($targetStudentIds, $targetTeacherIds) {{
                    if ($targetStudentIds !== []) $q->whereIn("sc.StudentID", $targetStudentIds);
                    if ($targetTeacherIds !== []) $q->orWhereIn("sc.TeacherID", $targetTeacherIds);
                  }})
                  ->where(function ($q) use ($campusId) {{
                    $q->where(function ($inner) use ($campusId) {{
                      $inner->whereNotNull("sc.room_id")->where("r.campus_id", $campusId);
                    }})->orWhere(function ($inner) use ($campusId) {{
                      $inner->whereNull("sc.room_id")->where("s.CampusID", $campusId);
                    }});
                  }})
                  ->where(function ($q) {{ $q->where("sc.Stop", 0)->orWhereNull("sc.Stop"); }})
                  ->where(function ($q) {{ $q->whereNull("sc.StartDate")->orWhereDate("sc.StartDate", "<=", "2026-08-29"); }})
                  ->where(function ($q) {{ $q->whereNull("sc.EndDate")->orWhereDate("sc.EndDate", ">=", "2026-08-23"); }})
                  ->get(["sc.ID as class_id", "sc.TeacherID as teacher_id", "sc.StudentID as student_id"]);
              }}
              $candidateClassIds = $candidateClasses->pluck("class_id")->map(fn ($id) => (int)$id)->all();
              $probe241["candidate_class_ids"] = $candidateClassIds;
              $probe241["db_class_session_slots"] = $candidateClassIds === [] ? [] : $db::table("ClassSession")
                ->whereIn("StudentClassID", $candidateClassIds)
                ->whereDate("SessionDate", "2026-08-29")
                ->whereRaw("TIME(StartTime) = ?", ["13:00:00"])
                ->get(["id", "StudentClassID as class_id", "SessionDate as session_date", "StartTime as start_time", "EndTime as end_time", "Status as status"])
                ->map(fn ($row) => ["id"=>(int)$row->id, "class_id"=>(int)$row->class_id, "session_date"=>(string)$row->session_date, "start_time"=>substr((string)$row->start_time, 0, 5), "end_time"=>substr((string)$row->end_time, 0, 5), "status"=>(string)$row->status])->all();
              $probe241["db_schedule_slots"] = $candidateClassIds === [] ? [] : $db::table("schedules")
                ->whereIn("student_course_id", $candidateClassIds)
                ->whereDate("schedule_date", "2026-08-29")
                ->whereRaw("TIME(start_time) = ?", ["13:00:00"])
                ->get(["id", "student_course_id as class_id", "schedule_date as session_date", "start_time", "end_time", "status"])
                ->map(fn ($row) => ["id"=>(int)$row->id, "class_id"=>(int)$row->class_id, "session_date"=>(string)$row->session_date, "start_time"=>substr((string)$row->start_time, 0, 5), "end_time"=>substr((string)$row->end_time, 0, 5), "status"=>(string)$row->status])->all();

              $invoke = function ($controller, string $method, array $args = []) {{
                $reflection = new \ReflectionMethod($controller, $method);
                $reflection->setAccessible(true);
                return $reflection->invokeArgs($controller, $args);
              }};
              $teacherIds = $candidateClasses->pluck("teacher_id")->map(fn ($id) => (int)$id)->filter()->unique()->values()->all();
              $teacherResults = [];
              foreach ($teacherIds as $teacherId) {{
                $request = \Illuminate\Http\Request::create(
                  "/api/v1/class-sessions/projection",
                  "GET",
                  ["start" => "2026-08-23", "end" => "2026-08-29", "branch_id" => $campusId]
                );
                $request->attributes->set("auth_role", "teacher");
                $request->attributes->set("auth_teacher_id", $teacherId);
                $request->attributes->set("auth_campus_ids", [$campusId]);
                app()->instance("request", $request);
                $controller = app(\App\Http\Controllers\ClassSessionController::class);
                $query = $invoke($controller, "buildClassSessionIndexQuery", [$request]);
                $items = $invoke($controller, "fetchAllClassSessionIndexRows", [$query]);
                $byClass = $invoke($controller, "buildByClassMapFromItems", [$items]);
                $projected = $invoke($controller, "buildProjectedByClassForIndex", [$byClass, "2026-08-23", "2026-08-29", [], true]);
                $targetForTeacher = $candidateClasses->where("teacher_id", $teacherId)->pluck("class_id")->map(fn ($id) => (int)$id)->all();
                $materializedMatches = collect($items)->filter(function ($row) use ($targetForTeacher) {{
                  return in_array((int)($row->student_class_id ?? 0), $targetForTeacher, true)
                    && substr((string)($row->session_date ?? ""), 0, 10) === "2026-08-29"
                    && substr((string)($row->start_time ?? ""), 0, 5) === "13:00";
                }})->map(fn ($row) => ["id"=>(int)$row->id, "class_id"=>(int)$row->student_class_id, "session_date"=>substr((string)$row->session_date, 0, 10), "start_time"=>substr((string)$row->start_time, 0, 5), "end_time"=>substr((string)$row->end_time, 0, 5)])->values()->all();
                $projectedMatches = [];
                foreach ($projected as $classId => $slots) {{
                  if (!in_array((int)$classId, $targetForTeacher, true)) continue;
                  foreach ($slots as $slot) {{
                    if (($slot["session_date"] ?? "") === "2026-08-29" && ($slot["start_time"] ?? "") === "13:00") {{
                      $projectedMatches[] = ["class_id"=>(int)$classId, "session_date"=>(string)$slot["session_date"], "start_time"=>(string)$slot["start_time"], "end_time"=>(string)($slot["end_time"] ?? ""), "kind"=>(string)($slot["kind"] ?? "projected")];
                    }}
                  }}
                }}
                $teacherResults[] = [
                  "teacher_id" => $teacherId,
                  "target_class_ids" => $targetForTeacher,
                  "materialized_target_slots" => $materializedMatches,
                  "projected_target_slots" => $projectedMatches,
                  "target_slot_visible" => $materializedMatches !== [] || $projectedMatches !== [],
                ];
              }}
              $probe241["teacher_projection_results"] = $teacherResults;
              $probe241["target_slot_visible"] = collect($teacherResults)->contains(fn ($result) => $result["target_slot_visible"] === true);
              $probe241["error"] = null;
            }} catch (\Throwable $e) {{
              $probe241["error"] = get_class($e).": ".substr((string)$e->getMessage(), 0, 300);
            }}
          }}
          echo json_encode([
            "ok" => true,
            "bug" => [
              "id"=>(int)$bug->id,
              "status"=>$bug->status,
              "severity"=>$bug->severity,
              "campus_id"=>$bug->CampusID,
              "page_key"=>$bug->page_key,
              "reporter_user_id"=>(int)$bug->reporter_user_id,
              "title"=>$title,
              "description"=>$desc,
              "created_at"=>$bug->created_at,
              "updated_at"=>$bug->updated_at,
            ],
            "attachments" => $atts,
            "comments" => $cmtOut,
            "status_logs" => $logs,
            "reporter_history" => $reporterHistory,
            "reporter_history_comments" => $reporterComments,
            "reporter_history_status_logs" => $reporterStatusLogs,
            "probe_208_package_recompute" => [
              "package_124" => $pkg,
              "package_124_members" => $pkgMembers,
              "course_2825" => $course2825,
              "package_124_ledger_recent" => $recomputeLedger,
            ],
            "probe_241_teacher_projection" => $probe241,
            "prod_head" => trim((string)@shell_exec("git rev-parse HEAD")),
            "dump_generated_at" => gmdate("c"),
          ], JSON_UNESCAPED_UNICODE), PHP_EOL;
          """)
          PY
          # shellcheck: pass PHP source via stdin to remote tinker is hard; use base64
          B64=$(base64 -w0 /tmp/bug207_probe.php)
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_SSH_USER}@${PI_SSH_HOST}" \
            "B64='${B64}' bash -s" <<'REMOTE' | tee out/bug-detail.log
          set -euo pipefail
          cd /home/admin/backend
          php -r 'file_put_contents("/tmp/bug_detail_probe.php", base64_decode(getenv("B64")));'
          # Use artisan tinker with file include via execute
          php artisan tinker --execute='require "/tmp/bug_detail_probe.php";'
          rm -f /tmp/bug_detail_probe.php
          REMOTE
          python3 - <<'PY'
          from pathlib import Path
          import json
          text = Path("out/bug-detail.log").read_text(encoding="utf-8", errors="replace")
          obj = None
          for line in text.splitlines():
            line=line.strip()
            if line.startswith("{") and '"ok"' in line:
              try:
                obj=json.loads(line)
              except Exception:
                pass
          Path("out/bug-detail.json").write_text(json.dumps(obj or {"ok":False,"raw_tail":text[-2000:]}, ensure_ascii=False, indent=2), encoding="utf-8")
          print("parsed", bool(obj and obj.get("ok")))
          PY

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bug-detail-dump
          path: out/
          retention-days: 14
