          print("parsed", bool(obj.get("ok")), "decision_grade", diagnostics.get("decision_grade"))
          PY

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bug-detail-dump
          path: out/
          retention-days: 14
