name: Agent Session Provenance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: agent-provenance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  provenance:
    name: Agent Session Provenance
    # Dependabot (and other bot-authored) PRs never carry an .agent-session
    # manifest — they're mechanical dependency bumps, not agent work — so the
    # check always fails for them regardless of branch/task naming. Exempt by
    # PR author instead of asking every dependency-bump PR to fake a manifest.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify provenance manifest
        env:
          # GITHUB_HEAD_REF is only set by the pull_request event; a manual
          # workflow_dispatch run needs the fallback or the script sees a
          # detached-HEAD "HEAD" instead of the real branch name.
          GITHUB_HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/check-agent-provenance.sh
