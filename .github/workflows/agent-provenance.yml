name: Agent Session Provenance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "land-queue: PR number whose head this run checks (guarded: head must equal github.sha, base main)"
        required: false
        default: ""

concurrency:
  group: agent-provenance-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  provenance:
    name: Agent Session Provenance
    # Dependabot (and other bot-authored) PRs never carry an .agent-session
    # manifest — they're mechanical dependency bumps, not agent work — so the
    # check always fails for them regardless of branch/task naming. Exempt by
    # PR author instead of asking every dependency-bump PR to fake a manifest.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: PR dispatch guard (fail closed)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          read -r head base state < <(gh api "/repos/$REPO/pulls/$PR_NUMBER" --jq '[.head.sha,.base.ref,.state]|join(" ")')
          [ "$head" = "$GITHUB_SHA" ] && [ "$base" = main ] && [ "$state" = open ] \
            || { echo "::error::pr_number $PR_NUMBER is not an open PR to main with head $GITHUB_SHA"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify provenance manifest
        env:
          # GITHUB_HEAD_REF is only set by the pull_request event; a manual
          # workflow_dispatch run needs the fallback or the script sees a
          # detached-HEAD "HEAD" instead of the real branch name.
          GITHUB_HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/check-agent-provenance.sh
