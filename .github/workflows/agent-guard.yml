name: Agent Bash Guard

# Regression suite for the Claude Code PreToolUse guard (.claude/hooks), in
# both modes: AST (shfmt) and the regex fallback used when shfmt is absent.

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".claude/**"
      - "scripts/install-shfmt.sh"
      - ".github/workflows/agent-guard.yml"
  push:
    branches: ["main"]
    paths:
      - ".claude/**"
      - "scripts/install-shfmt.sh"
      - ".github/workflows/agent-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard-tests:
    name: guard tests
    # Current topology: GitHub-hosted. See docs/REF_CI_RUNNER_TOPOLOGY.md.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shfmt (sha256-verified)
        run: bash scripts/install-shfmt.sh

      - name: AST mode
        run: python3 .claude/hooks/test_guard_bash.py

      - name: Regex fallback mode
        env:
          GUARD_TEST_FALLBACK: "1"
        run: python3 .claude/hooks/test_guard_bash.py
