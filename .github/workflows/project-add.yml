name: Add to project

# New issues and PRs land in user project 1 (AllTrue Engineering Roadmap).
# Needs a PAT secret PROJECT_TOKEN (scope: project); skips when unset.
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_TOKEN: ${{ secrets.PROJECT_TOKEN != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::PROJECT_TOKEN not set; skipping add-to-project"
      - uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        if: env.HAS_TOKEN == 'true'
        with:
          project-url: https://github.com/users/jerry200176-png/projects/1
          github-token: ${{ secrets.PROJECT_TOKEN }}
