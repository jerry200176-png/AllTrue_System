name: Pi Host Hardening

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '輸入 "YES" 確認執行主機強化（會修改防火牆與 SSH 設定）'
        required: true
        type: string
        default: 'NO'

jobs:
  verify-input:
    name: Verify Confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "YES" ]; then
            echo "::error::需要輸入 'YES' 才能執行。這是破壞性操作（會修改防火牆與 SSH 設定）。"
            exit 1
          fi
          echo "✅ 確認已收到，開始執行主機強化..."

  harden:
    name: Harden Pi Host
    needs: verify-input
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Pi secrets
        id: secrets
        env:
          PI_HOST:    ${{ secrets.PI_HOST }}
          PI_USER:    ${{ secrets.PI_USER }}
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          missing=""
          [ -z "$PI_HOST" ]    && missing="$missing PI_HOST"
          [ -z "$PI_USER" ]    && missing="$missing PI_USER"
          [ -z "$PI_SSH_KEY" ] && missing="$missing PI_SSH_KEY"
          [ -z "$PI_HOST_KEY" ] && missing="$missing PI_HOST_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Pi secrets 未設定（$missing）"
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        if: steps.secrets.outputs.configured == 'true'
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/pi_key
          chmod 600 ~/.ssh/pi_key
          printf '%s\n' "$PI_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: SCP hardening script to Pi
        if: steps.secrets.outputs.configured == 'true'
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          scp -i ~/.ssh/pi_key \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            scripts/pi-host-hardening.sh \
            ${PI_USER}@${PI_HOST}:/tmp/pi-host-hardening.sh

      - name: Run hardening script on Pi
        id: harden
        if: steps.secrets.outputs.configured == 'true'
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          ssh -i ~/.ssh/pi_key \
            -o ConnectTimeout=30 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o PasswordAuthentication=no \
            -o PubkeyAuthentication=yes \
            ${PI_USER}@${PI_HOST} bash /tmp/pi-host-hardening.sh

      - name: Cleanup script from Pi
        if: always() && steps.secrets.outputs.configured == 'true'
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          ssh -i ~/.ssh/pi_key \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o BatchMode=yes \
            ${PI_USER}@${PI_HOST} rm -f /tmp/pi-host-hardening.sh 2>/dev/null || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### 🔒 Pi 主機強化執行報告"
            echo ""
            echo "**執行時間**：$(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "**結果**：${{ job.status == 'success' && '✅ 成功' || '❌ 失敗（見上方 log）' }}"
            echo ""
            echo "**執行項目**："
            echo "- UFW 防火牆啟用"
            echo "- SSH 金鑰登入 + 關閉密碼"
            echo "- fail2ban 安裝設定"
            echo "- 停用 Samba / Mosquitto"
            echo "- Ollama 限制 localhost"
            echo "- VNC 殘留清除"
            echo ""
            echo "**Issue**：[#887](https://github.com/jerry200176-png/AllTrue_System/issues/887)"
          } >> "$GITHUB_STEP_SUMMARY"
