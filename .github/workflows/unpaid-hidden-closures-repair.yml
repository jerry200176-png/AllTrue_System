name: Unpaid hidden closures repair (manual, pinned set)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (default) or execute or rollback"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - execute
          - rollback
      confirm:
        description: "For execute/rollback only: type I_APPROVE_UNPAID_HIDDEN_CLOSURES"
        required: false
        type: string
      expect_digest:
        description: "For execute only: DIGEST printed by the reviewed dry-run"
        required: false
        type: string
      actor:
        description: "Audit actor label"
        required: false
        default: "gha:unpaid-hidden-closures"
        type: string

concurrency:
  group: repair-unpaid-hidden-closures
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    name: Run pinned unpaid hidden closures repair
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout pinned SSH trust helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/production-ssh-trust
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Validate inputs and set up SSH
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          EXPECT_DIGEST: ${{ inputs.expect_digest }}
          ACTOR: ${{ inputs.actor }}
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
        run: |
          set -euo pipefail
          case "$MODE" in dry-run|execute|rollback) ;; *) echo "::error::invalid mode"; exit 1 ;; esac
          # ACTOR / EXPECT_DIGEST are interpolated into the remote shell command line: allowlist them.
          if ! [[ "$ACTOR" =~ ^[A-Za-z0-9:._-]{1,64}$ ]]; then echo "::error::invalid actor"; exit 1; fi
          if [ -n "$EXPECT_DIGEST" ] && ! [[ "$EXPECT_DIGEST" =~ ^[0-9a-f]{16}$ ]]; then echo "::error::invalid digest"; exit 1; fi
          if [ "$MODE" = "execute" ] && ! [[ "$EXPECT_DIGEST" =~ ^[0-9a-f]{16}$ ]]; then
            echo "::error::execute requires the 16-hex DIGEST from the reviewed dry-run"; exit 1
          fi
          if [ "$MODE" != "dry-run" ] && [ "$CONFIRM" != "I_APPROVE_UNPAID_HIDDEN_CLOSURES" ]; then
            echo "::error::execute/rollback requires exact confirmation string"; exit 1
          fi
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Run repair on production
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          MODE: ${{ inputs.mode }}
          ACTOR: ${{ inputs.actor }}
          EXPECT_DIGEST: ${{ inputs.expect_digest }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${PI_SSH_USER}@${PI_SSH_HOST}" \
            MODE="$MODE" ACTOR="$ACTOR" EXPECT_DIGEST="$EXPECT_DIGEST" 'bash -s' <<'ENDSSH'
          set -euo pipefail
          cd /home/admin/backend

          echo "=== mode=${MODE} === (pre-state snapshot lives in session_corrections repair-unpaid-hidden-closures)"
          CMD="php artisan repair:unpaid-hidden-closures"

          [ "${MODE}" = "dry-run" ] && { $CMD; exit $?; }
          if [ "${MODE}" = "rollback" ]; then
            ALLOW_PROD_REPAIR=1 $CMD --rollback --execute --force
            exit $?
          fi
          # execute: exact-state preflight first (ALREADY_APPLIED short-circuits, drift aborts)
          PRE=$($CMD 2>&1) || { echo "$PRE"; echo "REPAIR_STATE=NOT_APPLIED"; exit 1; }
          echo "$PRE"
          if echo "$PRE" | grep -q 'ALREADY_APPLIED'; then
            echo "Refusing duplicate execute - correction ledger shows applied."
            exit 0
          fi

          set +e
          ALLOW_PROD_REPAIR=1 $CMD --execute --force --expect-digest="${EXPECT_DIGEST}" --actor="${ACTOR}"
          MUT_EC=$?
          $CMD --verify
          VER_EC=$?
          set -e
          [ "$MUT_EC" -eq 0 ] || { echo "REPAIR_STATE=NOT_APPLIED_OR_FAILED"; exit "$MUT_EC"; }
          [ "$VER_EC" -eq 0 ] || { echo "REPAIR_STATE=APPLIED_POSTVERIFY_FAILED; do NOT re-run execute"; exit 42; }
          echo "REPAIR_STATE=APPLIED_AND_VERIFIED"
          ENDSSH
