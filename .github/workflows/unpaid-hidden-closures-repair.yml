name: Unpaid hidden closures repair (manual, pinned set)

# Founder decision 2026-10-05: put unpaid contracts closed as settled/completed back into 待對帳.
# dry-run is read-only. execute/rollback run only in the production-activation environment (Founder
# approval), serialized with deploys and other production side effects, against the exact deployed
# backend SHA and (execute) the committed, hash-pinned Repair Manifest reviewed in a Founder-approved PR.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (default) or execute or rollback"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - execute
          - rollback
      confirm:
        description: "For execute/rollback only: type I_APPROVE_UNPAID_HIDDEN_CLOSURES"
        required: false
        type: string
      manifest_sha256:
        description: "For execute only: sha256 of the committed operations/repairs/unpaid-hidden-closures.manifest.json"
        required: false
        type: string
      deployed_backend_sha:
        description: "For execute/rollback only: full backend SHA the dry-run ran on (deployment.json backend_sha)"
        required: false
        type: string
      actor:
        description: "Audit actor label"
        required: false
        default: "gha:unpaid-hidden-closures"
        type: string

concurrency:
  # Shared with deploy.yml and the other protected repairs: never overlap production side effects.
  group: alltrue-production-side-effects-v2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dry-run:
    name: Dry-run (read-only)
    if: ${{ inputs.mode == 'dry-run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pinned SSH trust helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/production-ssh-trust
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Run dry-run on production
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/unpaid-hidden-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s' "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > "$ssh_dir/deploy_key"
          chmod 600 "$ssh_dir/deploy_key"
          trap 'rm -f "$ssh_dir/deploy_key"' EXIT
          ssh -i "$ssh_dir/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$PI_SSH_USER@$PI_SSH_HOST" 'bash -s' <<'ENDSSH'
          set -euo pipefail
          cd /home/admin/backend
          echo "BACKEND_SHA=$(curl -fsSL --proto '=https' --tlsv1.2 https://daan.lifenet.com.tw/deployment.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["backend_sha"])')"
          php artisan repair:unpaid-hidden-closures
          ENDSSH

  mutate:
    name: Execute or rollback (Founder-approved)
    if: ${{ inputs.mode != 'dry-run' }}
    environment:
      name: production-activation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate inputs
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          MANIFEST_SHA: ${{ inputs.manifest_sha256 }}
          DEPLOYED_SHA: ${{ inputs.deployed_backend_sha }}
          ACTOR: ${{ inputs.actor }}
        run: |
          set -euo pipefail
          # Every value below is interpolated into the remote shell command line: allowlist all of them.
          case "$MODE" in execute|rollback) ;; *) echo "::error::invalid mode"; exit 1 ;; esac
          [ "$CONFIRM" = "I_APPROVE_UNPAID_HIDDEN_CLOSURES" ] || { echo "::error::exact confirmation string required"; exit 1; }
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::deployed_backend_sha must be a full commit SHA"; exit 1; }
          [[ "$ACTOR" =~ ^[A-Za-z0-9:._-]{1,64}$ ]] || { echo "::error::invalid actor"; exit 1; }
          [[ -z "$MANIFEST_SHA" || "$MANIFEST_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::invalid manifest sha"; exit 1; }
          if [ "$MODE" = "execute" ]; then
            [[ "$MANIFEST_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::execute requires the committed manifest sha256"; exit 1; }
          fi
      - name: Checkout pinned SSH trust helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/production-ssh-trust
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Run repair on production
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          MODE: ${{ inputs.mode }}
          ACTOR: ${{ inputs.actor }}
          MANIFEST_SHA: ${{ inputs.manifest_sha256 }}
          DEPLOYED_SHA: ${{ inputs.deployed_backend_sha }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/unpaid-hidden-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s' "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > "$ssh_dir/deploy_key"
          chmod 600 "$ssh_dir/deploy_key"
          trap 'rm -f "$ssh_dir/deploy_key"' EXIT
          ssh -i "$ssh_dir/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$PI_SSH_USER@$PI_SSH_HOST" \
            "MODE='$MODE' ACTOR='$ACTOR' MANIFEST_SHA='$MANIFEST_SHA' DEPLOYED_SHA='$DEPLOYED_SHA' bash -s" <<'ENDSSH'
          set -euo pipefail
          cd /home/admin/backend
          manifest_sha="$(curl -fsSL --proto '=https' --tlsv1.2 https://daan.lifenet.com.tw/deployment.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["backend_sha"])')"
          CMD="php artisan repair:unpaid-hidden-closures"
          if [ "${MODE}" = "rollback" ]; then
            # Later releases are fine as long as the reviewed repair implementation is byte-identical.
            CMD_FILE=backend/app/Console/Commands/RepairUnpaidHiddenClosures.php
            git -C /home/admin cat-file -e "${DEPLOYED_SHA}^{commit}" || { echo "::error::reviewed SHA not in production history"; exit 1; }
            git -C /home/admin diff --quiet "$DEPLOYED_SHA" "$manifest_sha" -- "$CMD_FILE" \
              || { echo "::error::repair implementation changed since reviewed $DEPLOYED_SHA"; exit 1; }
            ALLOW_PROD_REPAIR=1 $CMD --rollback --execute --force --actor="${ACTOR}"
            exit $?
          fi
          [ "$manifest_sha" = "$DEPLOYED_SHA" ] || { echo "::error::production SHA drift: $manifest_sha (reviewed $DEPLOYED_SHA)"; exit 1; }
          # execute: exact-state preflight first (ALREADY_APPLIED short-circuits)
          PRE=$($CMD 2>&1) || { echo "$PRE"; echo "REPAIR_STATE=NOT_APPLIED"; exit 1; }
          echo "$PRE"
          if echo "$PRE" | grep -q 'ALREADY_APPLIED'; then
            echo "Refusing duplicate execute - correction ledger shows applied."
            exit 0
          fi
          set +e
          MUT_OUT=$(ALLOW_PROD_REPAIR=1 $CMD --execute --force --expect-manifest-sha="${MANIFEST_SHA}" --actor="${ACTOR}" 2>&1)
          MUT_EC=$?
          echo "$MUT_OUT"
          $CMD --verify
          VER_EC=$?
          set -e
          # A committed write whose post-check failed must never look retryable.
          if echo "$MUT_OUT" | grep -q 'REPAIR_STATE=APPLIED_POSTVERIFY_FAILED'; then
            echo "REPAIR_STATE=APPLIED_POSTVERIFY_FAILED; do NOT re-run execute"; exit 42
          fi
          [ "$MUT_EC" -eq 0 ] || { echo "REPAIR_STATE=NOT_APPLIED_OR_FAILED"; exit "$MUT_EC"; }
          [ "$VER_EC" -eq 0 ] || { echo "REPAIR_STATE=APPLIED_POSTVERIFY_FAILED; do NOT re-run execute"; exit 42; }
          echo "REPAIR_STATE=APPLIED_AND_VERIFIED"
          ENDSSH
