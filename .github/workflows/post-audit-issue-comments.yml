name: Post audit conclusions to Issues

on:
  push:
    branches: [main]
    paths:
      - 'operations/closeout/post-audit-comments.request.md'
      - 'operations/closeout/issue-bodies/comment-*.md'
      - '.github/workflows/post-audit-issue-comments.yml'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Post comments from body files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          post() {
            local num="$1" file="$2"
            jq -n --arg body "$(cat "$file")" '{body:$body}' \
              | gh api "repos/${REPO}/issues/${num}/comments" --input -
          }
          post 1343 operations/closeout/issue-bodies/comment-td059-nogo.md
          post 1342 operations/closeout/issue-bodies/comment-leave-hc-pack.md
          post 1262 operations/closeout/issue-bodies/comment-1262-close.md || post 1262 operations/closeout/issue-bodies/comment-1262-triage.md || true
          gh api -X PATCH "repos/${REPO}/issues/1262" -f state=closed -f state_reason=completed || true
          echo "comments posted"
