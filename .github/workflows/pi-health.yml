name: Pi Health Monitor

on:
  schedule:
    - cron: '0 1 * * *'   # 每日 09:00 台灣時間（關鍵告警由 Pi 本機 monitor-alert cron 補位）
  workflow_dispatch:         # 手動觸發

jobs:
  health-check:
    name: Pi System Health
    runs-on: ubuntu-latest

    steps:
      - name: Check Pi secrets
        id: secrets
        env:
          PI_HOST:    ${{ secrets.PI_HOST }}
          PI_USER:    ${{ secrets.PI_USER }}
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          missing=""
          [ -z "$PI_HOST" ]    && missing="$missing PI_HOST"
          [ -z "$PI_USER" ]    && missing="$missing PI_USER"
          [ -z "$PI_SSH_KEY" ] && missing="$missing PI_SSH_KEY"
          [ -z "$PI_HOST_KEY" ] && missing="$missing PI_HOST_KEY"
          if [ -n "$missing" ]; then
            echo "::notice::Pi secrets 未設定（$missing）— 略過本次執行。請至 repo Settings → Secrets → Actions 設定後生效。"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH
        if: steps.secrets.outputs.configured == 'true'
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/pi_key
          chmod 600 ~/.ssh/pi_key
          printf '%s\n' "$PI_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run health checks on Pi
        if: steps.secrets.outputs.configured == 'true'
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          ssh -i ~/.ssh/pi_key -v \
            -o ConnectTimeout=15 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o PasswordAuthentication=no \
            -o PubkeyAuthentication=yes \
            ${PI_USER}@${PI_HOST} bash << 'REMOTE'
          set -e
          WARNINGS=""
          CRITICALS=""

          # ── 1. 磁碟空間 ──────────────────────────────────────────────
          DISK_PCT=$(df / | awk 'NR==2 {gsub(/%/,""); print $5}')
          echo "磁碟使用率：${DISK_PCT}%"
          if [ "$DISK_PCT" -gt 95 ]; then
            CRITICALS="${CRITICALS}🔴 磁碟使用率 ${DISK_PCT}% > 95% — 緊急！\n"
          elif [ "$DISK_PCT" -gt 85 ]; then
            WARNINGS="${WARNINGS}⚠️ 磁碟使用率 ${DISK_PCT}% > 85%\n"
          fi

          # ── 2. CPU 溫度（Pi）────────────────────────────────────────
          if command -v vcgencmd &>/dev/null; then
            TEMP=$(vcgencmd measure_temp | grep -oE '[0-9]+(\.[0-9]+)?' | head -1)
            echo "CPU 溫度：${TEMP}°C"
            TEMP_INT=$(echo "$TEMP" | cut -d. -f1)
            THROTTLED=""
            if vcgencmd get_throttled &>/dev/null; then
              THROTTLED=$(vcgencmd get_throttled)
              echo "CPU throttling：${THROTTLED}"
            fi
            if [ "$TEMP_INT" -gt 85 ]; then
              if echo "$THROTTLED" | grep -Eq '0x[1-9a-fA-F]'; then
                CRITICALS="${CRITICALS}🔴 CPU 溫度 ${TEMP}°C > 85°C 且偵測到 throttling/undervoltage（${THROTTLED}）\n"
              else
                WARNINGS="${WARNINGS}⚠️ CPU 溫度 ${TEMP}°C > 85°C，但未偵測到 throttling；視為 sensor/瞬間尖峰，請人工觀察散熱\n"
              fi
            elif [ "$TEMP_INT" -gt 75 ]; then
              WARNINGS="${WARNINGS}⚠️ CPU 溫度 ${TEMP}°C > 75°C\n"
            fi
          fi

          # ── 3. 備份年齡驗證 ──────────────────────────────────────────
          BACKUP_DIR="/home/admin/backups/sixhour"
          if [ -d "$BACKUP_DIR" ]; then
            LATEST=$(ls "$BACKUP_DIR"/alltrue_6h_*.sql.gz 2>/dev/null | sort | tail -1)
            if [ -z "$LATEST" ]; then
              CRITICALS="${CRITICALS}🔴 備份目錄無任何 .sql.gz 檔案！\n"
            else
              BASENAME=$(basename "$LATEST")
              STAMP=$(echo "$BASENAME" | sed -nE 's/^alltrue_6h_([0-9]{4}-[0-9]{2}-[0-9]{2})_([0-9]{2})([0-9]{2})\.sql\.gz$/\1 \2:\3/p')
              if [ -n "$STAMP" ]; then
                BACKUP_TS=$(date -d "$STAMP" +%s)
                AGE_HOURS=$(( ( $(date +%s) - BACKUP_TS ) / 3600 ))
              else
                AGE_HOURS=$(( ( $(date +%s) - $(stat -c %Y "$LATEST") ) / 3600 ))
                WARNINGS="${WARNINGS}⚠️ 備份檔名無法解析時間，已 fallback 到 mtime：${BASENAME}\n"
              fi
              echo "最新備份年齡：${AGE_HOURS} 小時（${LATEST}）"
              if [ "$AGE_HOURS" -gt 24 ]; then
                CRITICALS="${CRITICALS}🔴 最新備份已 ${AGE_HOURS} 小時！可能備份失敗！\n"
              elif [ "$AGE_HOURS" -gt 8 ]; then
                WARNINGS="${WARNINGS}⚠️ 最新備份已 ${AGE_HOURS} 小時未更新 (> 8hr)\n"
              fi
            fi
          else
            CRITICALS="${CRITICALS}🔴 備份目錄 ${BACKUP_DIR} 不存在\n"
          fi

          # ── 3b. Laravel scheduler 心跳（R68：schedule:list 顯示 Next Due ≠ 有在跑）──
          # schedule:run 由 cron 每分鐘執行並 append schedule.log；超過 10 分鐘未更新
          # = driver 死亡（2026-07-10 事故：Kernel 8 個夜間任務從未執行過，靜默數週）。
          SCHED_LOG="/home/admin/logs/schedule.log"
          if [ -f "$SCHED_LOG" ]; then
            SCHED_AGE_MIN=$(( ( $(date +%s) - $(stat -c %Y "$SCHED_LOG") ) / 60 ))
            echo "scheduler 心跳：${SCHED_AGE_MIN} 分鐘前"
            if [ "$SCHED_AGE_MIN" -gt 10 ]; then
              CRITICALS="${CRITICALS}🔴 Laravel scheduler 心跳停止 ${SCHED_AGE_MIN} 分鐘（schedule:run cron 死亡？）\n"
            fi
          else
            CRITICALS="${CRITICALS}🔴 ${SCHED_LOG} 不存在 — Laravel scheduler 無 driver（見 #1127）\n"
          fi

          # ── 4. 輸出結果 ──────────────────────────────────────────────
          if [ -n "$WARNINGS" ]; then
            echo "=== ⚠️ WARNINGS（不使 workflow 失敗）==="
            printf "$WARNINGS"
          fi
          if [ -n "$CRITICALS" ]; then
            echo "=== 🔴 CRITICALS ==="
            printf "$CRITICALS"
            exit 1   # 只有 critical 才讓 GitHub Actions 判定 failure
          else
            echo "✅ 無 critical 指標"
          fi
          REMOTE

      - name: UptimeRobot status check
        env:
          UPTIMEROBOT_API_KEY: ${{ secrets.UPTIMEROBOT_API_KEY }}
        run: |
          if [ -z "$UPTIMEROBOT_API_KEY" ]; then
            echo "::notice::UPTIMEROBOT_API_KEY 未設定 — 略過 UptimeRobot 檢查"
            exit 0
          fi
          curl -s -X POST "https://api.uptimerobot.com/v2/getMonitors" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "api_key=${UPTIMEROBOT_API_KEY}&format=json&logs=0" \
            -o /tmp/ur_response.json

          python3 - /tmp/ur_response.json << 'PYEOF'
          import json, sys
          path = sys.argv[1]
          with open(path) as f:
              data = json.load(f)
          if data.get("stat") != "ok":
              print(f"::warning::UptimeRobot API error: {data}")
              sys.exit(0)
          monitors = data.get("monitors", [])
          if not monitors:
              print("::warning::UptimeRobot: no monitors found")
              sys.exit(0)
          all_up = True
          for m in monitors:
              status = m.get("status")
              name = m.get("friendly_name", "?")
              # status: 2=up, 8=seems down, 9=down, 0=paused, 1=not checked yet
              if status == 2:
                  print(f"✅ UP   — {name}")
              elif status in (8, 9):
                  print(f"🔴 DOWN — {name} (status={status})")
                  all_up = False
              else:
                  print(f"⚠️  WARN — {name}: status={status}")
          if not all_up:
              print("::error::UptimeRobot reports monitor is DOWN!")
              sys.exit(1)
          PYEOF

      - name: Report to GitHub Step Summary
        if: always()
        run: |
          echo "### 🖥️ Pi Health Check — $(date '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "Checks: 磁碟空間 / CPU 溫度 / 備份年齡 / UptimeRobot" >> "$GITHUB_STEP_SUMMARY"
