name: DORA Metrics Weekly Report

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  dora:
    name: Calculate DORA Metrics
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify DORA receipt contract
        run: python3 -m unittest discover -s .github/scripts -p 'test_dora_metrics.py'

      - name: Report evidenced DORA metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/dora_metrics.py
