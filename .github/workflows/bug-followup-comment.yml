name: Bug follow-up public comment

# Idempotent public follow-up. This workflow deliberately never changes status.
on:
  workflow_dispatch:
    inputs:
      bug_id:
        description: In-app bug ID
        required: true
        type: string
      expected_status:
        description: Current status that must remain unchanged (triaged, in_progress, or resolved)
        required: true
        type: string
      github_issue_url:
        description: GitHub follow-up URL, required in the public reply
        required: true
        type: string
      public_reply:
        description: Public follow-up reply
        required: true
        type: string

permissions:
  contents: read

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout public reply policy
        uses: actions/checkout@v7

      - name: Validate public reply copy
        env:
          PUBLIC_REPLY: ${{ inputs.public_reply }}
        run: node scripts/ci/validate-public-bug-reply.mjs

      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$PI_SSH_KEY"
          test -n "$PI_SSH_HOST"
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ssh-keyscan -H "$PI_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            :
          elif [[ -n "${PI_HOST_KEY:-}" ]]; then
            printf '%s\n' "$PI_HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::error::no host key"; exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Write idempotent follow-up comment
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          BUG_ID: ${{ inputs.bug_id }}
          EXPECTED_STATUS: ${{ inputs.expected_status }}
          GITHUB_ISSUE_URL: ${{ inputs.github_issue_url }}
          PUBLIC_REPLY: ${{ inputs.public_reply }}
        run: |
          set -euo pipefail
          [[ "$BUG_ID" =~ ^[0-9]+$ ]] || { echo "invalid bug_id"; exit 1; }
          [[ "$EXPECTED_STATUS" =~ ^(triaged|in_progress|resolved)$ ]] || { echo "invalid expected_status"; exit 1; }
          [[ "$GITHUB_ISSUE_URL" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/issues/[0-9]+$ ]] || { echo "invalid github_issue_url"; exit 1; }
          [[ "$PUBLIC_REPLY" == *"$GITHUB_ISSUE_URL"* ]] || { echo "public reply must contain github_issue_url"; exit 1; }
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_SSH_USER}@${PI_SSH_HOST}" \
            "BUG_ID='$BUG_ID' EXPECTED_STATUS='$EXPECTED_STATUS' GITHUB_ISSUE_URL='$GITHUB_ISSUE_URL' PUBLIC_REPLY=\$(printf %q \"$PUBLIC_REPLY\") bash -s" <<'REMOTE'
          set -euo pipefail
          cd /home/admin/backend
          export BUG_ID EXPECTED_STATUS GITHUB_ISSUE_URL PUBLIC_REPLY
          php artisan tinker --execute='
          $bugId = (int)getenv("BUG_ID");
          $expected = (string)getenv("EXPECTED_STATUS");
          $issueUrl = (string)getenv("GITHUB_ISSUE_URL");
          $reply = (string)getenv("PUBLIC_REPLY");
          $bug = \App\Models\BugReport::find($bugId);
          if (!$bug) { throw new \RuntimeException("bug not found: ".$bugId); }
          if ((string)$bug->status !== $expected) { throw new \RuntimeException("status changed: ".$bug->status); }
          $admin = \Illuminate\Support\Facades\DB::table("UserCampus")
              ->where("Admin", 1)->where("Approved", 1)->orderBy("UserID")->value("UserID");
          $actor = $admin ? (int)$admin : 1;
          $already = \App\Models\BugReportComment::query()->where("bug_report_id", $bugId)
              ->where("body", "like", "%".$issueUrl."%")->exists();
          $comment = $already ? ["ok" => true, "skipped" => true] : \App\Services\BugReportService::addComment($bugId, $actor, $reply, false);
          $commentSucceeded = ($comment["ok"] ?? false) || isset($comment["id"]) || ($comment["skipped"] ?? false);
          if (!$commentSucceeded) { throw new \RuntimeException(json_encode($comment)); }
          echo json_encode(["bug_id" => $bugId, "status" => (string)$bug->status, "comment" => $comment, "issue" => $issueUrl], JSON_UNESCAPED_UNICODE), PHP_EOL;
          '
          REMOTE
