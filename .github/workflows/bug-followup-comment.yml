name: Bug follow-up public comment

# Idempotent public follow-up, in batches of up to 20 rows. This workflow deliberately never changes status.
# expected_status=closed is only for a logged suggestion that shipped (F12): it records
# production evidence via BugReportService::notifyLoggedSuggestionShipped.
# Founder 2026-10-21 (FOUNDER_STANDING_DECISIONS.md): no per-run Founder approval; main only,
# secrets only on the main-only production-ssh environment, every row validated before any write.
on:
  workflow_dispatch:
    inputs:
      rows_json:
        description: 'JSON array (1-20) of {"bug_id","expected_status"(triaged|in_progress|resolved|closed),"github_issue_url","public_reply"(<=600 chars, contains the URL),"production_revision"+"deploy_run_id"(required for closed)}'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: inapp-production-writeback
  cancel-in-progress: false
  queue: max

jobs:
  preview:
    # Validates every row (all-or-nothing) and records an ID/hash-only table before the write job.
    name: Preview the in-app write batch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shipped: ${{ steps.rows.outputs.shipped }}
    steps:
      - name: Checkout pinned row validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts/inapp-writeback-rows.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Show the requested writes
        id: rows
        # rows_json is read from the event payload (never env); errors name the row and field, never the value.
        run: python3 .github/scripts/inapp-writeback-rows.py followup preview

  comment:
    needs: preview
    runs-on: ubuntu-latest
    environment: production-ssh
    timeout-minutes: 30
    steps:
      - name: Checkout pinned SSH trust helper and row validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/production-ssh-trust
            .github/scripts/inapp-writeback-rows.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$PI_SSH_KEY"
          test -n "$PI_SSH_HOST"
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Write idempotent follow-up comments
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
        # rows_json is deliberately not in env (GitHub prints step env in the public log header). The
        # validator re-reads the event payload and emits one safe line per row: validated tokens plus
        # the base64 reply. Rows run in order in one SSH session; the first failing row stops the batch
        # (earlier rows stay written; a rerun is idempotent per row).
        run: |
          set -euo pipefail
          ROWS="$(python3 .github/scripts/inapp-writeback-rows.py followup write)"
          ROW_COUNT="$(printf '%s\n' "$ROWS" | wc -l | tr -d ' ')"
          ROWS_B64="$(printf '%s' "$ROWS" | base64 | tr -d '\n')"
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_SSH_USER}@${PI_SSH_HOST}" \
            "ROW_COUNT='$ROW_COUNT' ROWS_B64='$ROWS_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /home/admin/backend
          applied=0
          # fd 3 carries the rows; tinker gets /dev/null so it can never eat this script (bash -s stdin).
          while read -r -u 3 BUG_ID EXPECTED_STATUS GITHUB_ISSUE_URL PRODUCTION_REVISION DEPLOY_RUN_ID PUBLIC_REPLY_B64; do
          if [[ "$PRODUCTION_REVISION" == - ]]; then PRODUCTION_REVISION=""; fi
          if [[ "$DEPLOY_RUN_ID" == - ]]; then DEPLOY_RUN_ID=""; fi
          [[ "$BUG_ID" =~ ^[0-9]+$ ]] || { echo "invalid bug_id"; exit 1; }
          [[ "$EXPECTED_STATUS" =~ ^(triaged|in_progress|resolved|closed)$ ]] || { echo "invalid expected_status"; exit 1; }
          [[ "$GITHUB_ISSUE_URL" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/issues/[0-9]+$ ]] || { echo "invalid github_issue_url"; exit 1; }
          if [[ "$EXPECTED_STATUS" == closed ]]; then
            [[ "$PRODUCTION_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "closed follow-up needs the full 40-char production_revision"; exit 1; }
            [[ "$DEPLOY_RUN_ID" =~ ^[0-9]+$ ]] || { echo "closed follow-up needs deploy_run_id"; exit 1; }
          fi
          PUBLIC_REPLY="$(printf '%s' "$PUBLIC_REPLY_B64" | base64 -d)"
          [[ "$PUBLIC_REPLY" == *"$GITHUB_ISSUE_URL"* ]] || { echo "public reply must contain github_issue_url"; exit 1; }
          export BUG_ID EXPECTED_STATUS GITHUB_ISSUE_URL PUBLIC_REPLY PRODUCTION_REVISION DEPLOY_RUN_ID
          if [[ "$EXPECTED_STATUS" == closed ]]; then
            # Same gate as Phase-C: never announce a revision that is not in production.
            PROD_HEAD=$(git rev-parse HEAD)
            echo "prod_head=$PROD_HEAD"
            git merge-base --is-ancestor "$PRODUCTION_REVISION" "$PROD_HEAD" || { echo "production_revision is not in production"; exit 1; }
          fi
          php artisan tinker --execute='
          $bugId = (int)getenv("BUG_ID");
          $expected = (string)getenv("EXPECTED_STATUS");
          $issueUrl = (string)getenv("GITHUB_ISSUE_URL");
          $reply = (string)getenv("PUBLIC_REPLY");
          $bug = \App\Models\BugReport::find($bugId);
          if (!$bug) { throw new \RuntimeException("bug not found: ".$bugId); }
          if ((string)$bug->status !== $expected) { throw new \RuntimeException("status changed: ".$bug->status); }
          $admin = \Illuminate\Support\Facades\DB::table("UserCampus")
              ->where("Admin", 1)->where("Approved", 1)->orderBy("UserID")->value("UserID");
          $actor = $admin ? (int)$admin : 1;
          if ($expected === "closed") {
              $shipped = \App\Services\BugReportService::notifyLoggedSuggestionShipped(
                  $bugId, $actor, $issueUrl, (string)getenv("PRODUCTION_REVISION"), (string)getenv("DEPLOY_RUN_ID"), $reply
              );
              if (!($shipped["ok"] ?? false)) { throw new \RuntimeException(json_encode($shipped)); }
              echo json_encode(["bug_id" => $bugId, "status" => "closed", "logged_ship" => $shipped, "issue" => $issueUrl], JSON_UNESCAPED_UNICODE), PHP_EOL;
          } else {
          // The Phase-A acknowledgement already contains the same GitHub URL.
          // Idempotency must therefore match this exact follow-up payload,
          // not merely the shared issue link, or the requested post-deploy
          // verification message is silently skipped.
          $already = \App\Models\BugReportComment::query()->where("bug_report_id", $bugId)
              ->where("body", $reply)->exists();
          $comment = $already ? ["ok" => true, "skipped" => true] : \App\Services\BugReportService::addComment($bugId, $actor, $reply, false);
          $commentSucceeded = ($comment["ok"] ?? false) || isset($comment["id"]) || ($comment["skipped"] ?? false);
          if (!$commentSucceeded) { throw new \RuntimeException(json_encode($comment)); }
          echo json_encode(["bug_id" => $bugId, "status" => (string)$bug->status, "comment_id" => is_array($comment) ? ($comment["skipped"] ?? false) : $comment->id, "issue" => $issueUrl], JSON_UNESCAPED_UNICODE), PHP_EOL;
          }
          ' \
          </dev/null
          applied=$((applied + 1))
          done 3< <(printf '%s' "$ROWS_B64" | base64 -d; echo)
          [[ "$applied" == "$ROW_COUNT" ]] || { echo "applied $applied of $ROW_COUNT rows"; exit 1; }
          echo "applied $applied of $ROW_COUNT rows"
          REMOTE

  # F14: a logged suggestion that shipped closes its backlog issue (Phase-C never runs for it).
  close-shipped-issue:
    needs: [preview, comment]
    if: needs.preview.outputs.shipped != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Close the shipped backlog issues
        env:
          GH_TOKEN: ${{ github.token }}
          SHIPPED: ${{ needs.preview.outputs.shipped }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r -u 3 BUG_ID GITHUB_ISSUE_URL PRODUCTION_REVISION; do
            [[ "$BUG_ID" =~ ^[0-9]+$ ]] || { echo "invalid bug_id"; exit 1; }
            [[ "$GITHUB_ISSUE_URL" =~ ^https://github\.com/${GITHUB_REPOSITORY}/issues/[0-9]+$ ]] || { echo "github_issue_url must be an issue in this repository"; exit 1; }
            [[ "$PRODUCTION_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid production_revision"; exit 1; }
            state="$(gh issue view "$GITHUB_ISSUE_URL" --json state,labels --jq '[.state] + [.labels[].name] | join(" ")')"
            # Same guards as Phase-C: never close epics, reviewed frozen work, or an issue that also maps other reports.
            case " $state " in *" CLOSED "*|*" type:epic "*|*" lifecycle:frozen "*) echo "skip $BUG_ID: $state"; continue ;; esac
            others="$(gh issue view "$GITHUB_ISSUE_URL" --json title,body,comments | BUG_ID="$BUG_ID" python3 -c '
          import json, os, re, sys
          d = json.load(sys.stdin)
          ids = {int(x) for m in re.finditer(r"in-app\s*#\d+(?:\s*/\s*#\d+)*", d["title"], re.I) for x in re.findall(r"#(\d+)", m.group(0))}
          for t in [d.get("body") or ""] + [c.get("body") or "" for c in d.get("comments") or []]:
              ids |= {int(x) for x in re.findall(r"alltrue:bug_report:(\d+)", t)}
          print(" ".join(str(i) for i in sorted(ids - {int(os.environ["BUG_ID"])})))')"
            if [[ -n "$others" ]]; then
              # Shared backlog: leave it open but drop the exemption so the queue-dump reconcile shows it to a human.
              echo "skip: issue also maps in-app $others"
              gh issue edit "$GITHUB_ISSUE_URL" --remove-label in-app:logged || true
              continue
            fi
            gh issue edit "$GITHUB_ISSUE_URL" --remove-label in-app:logged || true
            gh issue close "$GITHUB_ISSUE_URL" --reason completed
            gh issue comment "$GITHUB_ISSUE_URL" --body "已上線（production ${PRODUCTION_REVISION:0:9}），已在 in-app 通知原回報者。Closed automatically on ship (F14)."
          done 3< <(jq -r '.[] | @tsv' <<< "$SHIPPED")
