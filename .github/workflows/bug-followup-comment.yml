name: Bug follow-up public comment

# Idempotent public follow-up. This workflow deliberately never changes status.
# expected_status=closed is only for a logged suggestion that shipped (F12): it records
# production evidence via BugReportService::notifyLoggedSuggestionShipped.
on:
  workflow_dispatch:
    inputs:
      bug_id:
        description: In-app bug ID
        required: true
        type: string
      expected_status:
        description: Current status that must remain unchanged (triaged, in_progress, resolved, or closed for a logged suggestion that shipped)
        required: true
        type: string
      github_issue_url:
        description: GitHub follow-up URL, required in the public reply
        required: true
        type: string
      public_reply:
        description: Public follow-up reply
        required: true
        type: string
      production_revision:
        description: Deployed full 40-char git SHA (required when expected_status=closed)
        required: false
        default: ""
        type: string
      deploy_run_id:
        description: Deploy run ID (required when expected_status=closed)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: inapp-production-writeback
  cancel-in-progress: false
  queue: max

jobs:
  preview:
    # Runs before the approval so the reviewer sees exactly what will be written.
    name: Preview the in-app write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Show the requested write
        env:
          BUG_ID: ${{ inputs.bug_id }}
          EXPECTED_STATUS: ${{ inputs.expected_status }}
          ISSUE_URL: ${{ inputs.github_issue_url }}
          PROD_REV: ${{ inputs.production_revision }}
          DEPLOY_RUN: ${{ inputs.deploy_run_id }}
        # The reply is read from the event payload, never from env: GitHub prints every step's env
        # values in the public log header, and dispatch inputs are not masked (public repo).
        run: |
          set -euo pipefail
          reply_len="$(jq -er '.inputs.public_reply | strings | length' "$GITHUB_EVENT_PATH")"
          reply_sha="$(jq -je '.inputs.public_reply | strings' "$GITHUB_EVENT_PATH" | sha256sum | cut -d' ' -f1)"
          {
            echo "## In-app write requested (approve only if this matches the reviewed list)"
            echo
            printf -- '- bug_id: %s\n' "$BUG_ID"
            printf -- '- expected_status: %s\n' "$EXPECTED_STATUS"
            printf -- '- github_issue_url: %s\n' "$ISSUE_URL"
            printf -- '- production_revision: %s\n' "$PROD_REV"
            printf -- '- deploy_run_id: %s\n' "$DEPLOY_RUN"
            printf -- '- public_reply length (characters): %s\n' "$reply_len"
            printf -- '- public_reply sha256 (exact UTF-8 input, no trailing newline added): %s\n' "$reply_sha"
            echo
            echo "The reply text is intentionally not shown (public repo). Compare the sha256 with the reviewed private list row."
          } >> "$GITHUB_STEP_SUMMARY"

  approve:
    # Founder approval gate. Secrets stay on production-ssh (main-only); this job holds none.
    name: Founder approval for production write
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-activation
    steps:
      - name: Verify production-activation protection
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          base = f"/repos/{os.environ['REPO']}/environments/production-activation"
          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", path], text=True))
          env = api(base)
          rules = env.get("protection_rules") or []
          if not any(r.get("type") == "required_reviewers" for r in rules):
              raise SystemExit("production-activation has no required reviewer; refusing to write")
          if env.get("can_admins_bypass") is not False:
              raise SystemExit("production-activation allows admin bypass; refusing to write")
          # Same main-only check as deploy.yml production-activation gate.
          policy = env.get("deployment_branch_policy") or {}
          if policy.get("custom_branch_policies") is not True or policy.get("protected_branches") is not False:
              raise SystemExit("production-activation needs a custom main-only branch policy; refusing to write")
          policies = api(f"{base}/deployment-branch-policies").get("branch_policies") or []
          names = sorted(str(p.get("name")) for p in policies)
          if names != ["main"]:
              raise SystemExit(f"production-activation must allow only main, got {names}; refusing to write")
          print("production-activation verified: required reviewer, no admin bypass, main only")
          PY

  comment:
    needs: approve
    runs-on: ubuntu-latest
    environment: production-ssh
    timeout-minutes: 15
    steps:
      - name: Checkout pinned SSH trust helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/production-ssh-trust
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$PI_SSH_KEY"
          test -n "$PI_SSH_HOST"
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Write idempotent follow-up comment
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          BUG_ID: ${{ inputs.bug_id }}
          EXPECTED_STATUS: ${{ inputs.expected_status }}
          GITHUB_ISSUE_URL: ${{ inputs.github_issue_url }}
          PRODUCTION_REVISION: ${{ inputs.production_revision }}
          DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
        # PUBLIC_REPLY is deliberately not in env (GitHub prints step env in the public log header).
        # Read the exact bytes from the event payload; the trailing x keeps trailing newlines.
        run: |
          set -euo pipefail
          PUBLIC_REPLY="$(jq -je '.inputs.public_reply | strings' "$GITHUB_EVENT_PATH" && printf x)"
          PUBLIC_REPLY="${PUBLIC_REPLY%x}"
          [[ "$BUG_ID" =~ ^[0-9]+$ ]] || { echo "invalid bug_id"; exit 1; }
          [[ "$EXPECTED_STATUS" =~ ^(triaged|in_progress|resolved|closed)$ ]] || { echo "invalid expected_status"; exit 1; }
          [[ "$GITHUB_ISSUE_URL" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/issues/[0-9]+$ ]] || { echo "invalid github_issue_url"; exit 1; }
          [[ "$GITHUB_ISSUE_URL" == "https://github.com/${GITHUB_REPOSITORY}/issues/"* ]] || { echo "github_issue_url must be in this repository"; exit 1; }
          [[ "$PUBLIC_REPLY" == *"$GITHUB_ISSUE_URL"* ]] || { echo "public reply must contain github_issue_url"; exit 1; }
          if [[ "$EXPECTED_STATUS" == closed ]]; then
            [[ "$PRODUCTION_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "closed follow-up needs the full 40-char production_revision"; exit 1; }
            [[ "$DEPLOY_RUN_ID" =~ ^[0-9]+$ ]] || { echo "closed follow-up needs deploy_run_id"; exit 1; }
          fi
          PUBLIC_REPLY_B64="$(printf '%s' "$PUBLIC_REPLY" | base64 | tr -d '\n')"
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_SSH_USER}@${PI_SSH_HOST}" \
            "BUG_ID='$BUG_ID' EXPECTED_STATUS='$EXPECTED_STATUS' GITHUB_ISSUE_URL='$GITHUB_ISSUE_URL' PRODUCTION_REVISION='$PRODUCTION_REVISION' DEPLOY_RUN_ID='$DEPLOY_RUN_ID' PUBLIC_REPLY_B64='$PUBLIC_REPLY_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /home/admin/backend
          PUBLIC_REPLY="$(printf '%s' "$PUBLIC_REPLY_B64" | base64 -d)"
          export BUG_ID EXPECTED_STATUS GITHUB_ISSUE_URL PUBLIC_REPLY PRODUCTION_REVISION DEPLOY_RUN_ID
          if [[ "$EXPECTED_STATUS" == closed ]]; then
            # Same gate as Phase-C: never announce a revision that is not in production.
            PROD_HEAD=$(git rev-parse HEAD)
            echo "prod_head=$PROD_HEAD"
            git merge-base --is-ancestor "$PRODUCTION_REVISION" "$PROD_HEAD" || { echo "production_revision is not in production"; exit 1; }
          fi
          php artisan tinker --execute='
          $bugId = (int)getenv("BUG_ID");
          $expected = (string)getenv("EXPECTED_STATUS");
          $issueUrl = (string)getenv("GITHUB_ISSUE_URL");
          $reply = (string)getenv("PUBLIC_REPLY");
          $bug = \App\Models\BugReport::find($bugId);
          if (!$bug) { throw new \RuntimeException("bug not found: ".$bugId); }
          if ((string)$bug->status !== $expected) { throw new \RuntimeException("status changed: ".$bug->status); }
          $admin = \Illuminate\Support\Facades\DB::table("UserCampus")
              ->where("Admin", 1)->where("Approved", 1)->orderBy("UserID")->value("UserID");
          $actor = $admin ? (int)$admin : 1;
          if ($expected === "closed") {
              $shipped = \App\Services\BugReportService::notifyLoggedSuggestionShipped(
                  $bugId, $actor, $issueUrl, (string)getenv("PRODUCTION_REVISION"), (string)getenv("DEPLOY_RUN_ID"), $reply
              );
              if (!($shipped["ok"] ?? false)) { throw new \RuntimeException(json_encode($shipped)); }
              echo json_encode(["bug_id" => $bugId, "status" => "closed", "logged_ship" => $shipped, "issue" => $issueUrl], JSON_UNESCAPED_UNICODE), PHP_EOL;
          } else {
          // The Phase-A acknowledgement already contains the same GitHub URL.
          // Idempotency must therefore match this exact follow-up payload,
          // not merely the shared issue link, or the requested post-deploy
          // verification message is silently skipped.
          $already = \App\Models\BugReportComment::query()->where("bug_report_id", $bugId)
              ->where("body", $reply)->exists();
          $comment = $already ? ["ok" => true, "skipped" => true] : \App\Services\BugReportService::addComment($bugId, $actor, $reply, false);
          $commentSucceeded = ($comment["ok"] ?? false) || isset($comment["id"]) || ($comment["skipped"] ?? false);
          if (!$commentSucceeded) { throw new \RuntimeException(json_encode($comment)); }
          echo json_encode(["bug_id" => $bugId, "status" => (string)$bug->status, "comment_id" => is_array($comment) ? ($comment["skipped"] ?? false) : $comment->id, "issue" => $issueUrl], JSON_UNESCAPED_UNICODE), PHP_EOL;
          }
          '
          REMOTE

  # F14: a logged suggestion that shipped closes its backlog issue (Phase-C never runs for it).
  close-shipped-issue:
    needs: comment
    if: inputs.expected_status == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Close the shipped backlog issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_ISSUE_URL: ${{ inputs.github_issue_url }}
          PRODUCTION_REVISION: ${{ inputs.production_revision }}
          BUG_ID: ${{ inputs.bug_id }}
        run: |
          set -euo pipefail
          [[ "$BUG_ID" =~ ^[0-9]+$ ]] || { echo "invalid bug_id"; exit 1; }
          [[ "$GITHUB_ISSUE_URL" =~ ^https://github\.com/${GITHUB_REPOSITORY}/issues/[0-9]+$ ]] || { echo "github_issue_url must be an issue in this repository"; exit 1; }
          state="$(gh issue view "$GITHUB_ISSUE_URL" --json state,labels --jq '[.state] + [.labels[].name] | join(" ")')"
          # Same guards as Phase-C: never close epics, reviewed frozen work, or an issue that also maps other reports.
          case " $state " in *" CLOSED "*|*" type:epic "*|*" lifecycle:frozen "*) echo "skip: $state"; exit 0 ;; esac
          others="$(gh issue view "$GITHUB_ISSUE_URL" --json title,body,comments | BUG_ID="$BUG_ID" python3 -c '
          import json, os, re, sys
          d = json.load(sys.stdin)
          ids = {int(x) for m in re.finditer(r"in-app\s*#\d+(?:\s*/\s*#\d+)*", d["title"], re.I) for x in re.findall(r"#(\d+)", m.group(0))}
          for t in [d.get("body") or ""] + [c.get("body") or "" for c in d.get("comments") or []]:
              ids |= {int(x) for x in re.findall(r"alltrue:bug_report:(\d+)", t)}
          print(" ".join(str(i) for i in sorted(ids - {int(os.environ["BUG_ID"])})))')"
          if [[ -n "$others" ]]; then
            # Shared backlog: leave it open but drop the exemption so the queue-dump reconcile shows it to a human.
            echo "skip: issue also maps in-app $others"
            gh issue edit "$GITHUB_ISSUE_URL" --remove-label in-app:logged || true
            exit 0
          fi
          gh issue edit "$GITHUB_ISSUE_URL" --remove-label in-app:logged || true
          gh issue close "$GITHUB_ISSUE_URL" --reason completed
          gh issue comment "$GITHUB_ISSUE_URL" --body "已上線（production ${PRODUCTION_REVISION:0:9}），已在 in-app 通知原回報者。Closed automatically on ship (F14)."
