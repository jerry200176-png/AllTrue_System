name: Issue #1734 Charge display repair (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (default), execute, or rollback"
        required: true
        default: dry-run
        type: choice
        options: [dry-run, execute, rollback]
      confirm:
        description: "For execute/rollback only: type I_APPROVE_1734_CHARGE_DISPLAY"
        required: false
        type: string
      actor:
        description: "Immutable audit actor label"
        required: false
        default: "gha:1734-charge-display"
        type: string

concurrency:
  group: repair-1734-charge-display
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    name: Run allowlisted #1734 Charge display repair
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate inputs
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          case "$MODE" in dry-run|execute|rollback) ;; *) exit 1 ;; esac
          if [ "$MODE" != "dry-run" ]; then
            [ "$CONFIRM" = "I_APPROVE_1734_CHARGE_DISPLAY" ] || {
              echo "::error::execute/rollback requires exact confirmation string"; exit 1;
            }
          fi

      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.PI_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run repair and post-verify on production
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          MODE: ${{ inputs.mode }}
          ACTOR: ${{ inputs.actor }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${PI_SSH_USER}@${PI_SSH_HOST}" MODE="$MODE" ACTOR="$ACTOR" 'bash -s' <<'ENDSSH'
          set -euo pipefail
          cd /home/admin/backend
          PRE=$(php artisan repair:charge-display-1734 2>&1) || { echo "$PRE"; exit 1; }
          echo "$PRE"
          if [ "$MODE" = "dry-run" ]; then
            echo "REPAIR_STATE=DRY_RUN_VERIFIED_NO_MUTATION"
            exit 0
          fi

          TS=$(date '+%Y-%m-%d_%H%M%S')
          mkdir -p /home/admin/backups/emergency
          BACKUP_FILE="/home/admin/backups/emergency/db_pre_1734_charge_display_${TS}.sql.gz"
          DB_USER="$(grep '^DB_USERNAME=' .env | cut -d= -f2-)"
          mysqldump -h 127.0.0.1 -u "$DB_USER" -p"$(grep '^DB_PASSWORD=' .env | cut -d= -f2-)" \
            --single-transaction AllTrue StudentClass Invoice Payment \
            | gzip > "$BACKUP_FILE"
          test -s "$BACKUP_FILE"
          echo "Backup created: $BACKUP_FILE"

          export ALLOW_PROD_REPAIR=1
          if [ "$MODE" = "execute" ]; then
            SNAP="storage/app/repair-snapshots/1734-charge-display-${TS}.json"
            php artisan repair:charge-display-1734 --execute --force --actor="$ACTOR" --snapshot="$SNAP"
            echo "SNAPSHOT=$SNAP"
          else
            php artisan repair:charge-display-1734 --rollback --execute --force --actor="$ACTOR"
            echo "REPAIR_STATE=ROLLED_BACK"
            exit 0
          fi
          unset ALLOW_PROD_REPAIR

          php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $DB = Illuminate\Support\Facades\DB::class;
            $sc = $DB::table("StudentClass")->where("ID", 1052)->first(["ID","Charge","Rate","SessionCount"]);
            $inv = $DB::table("Invoice")->where("id", 539)->first(["id","TotalAmount","PaidAmount","Status"]);
            $pay = $DB::table("Payment")->where("id", 514)->first(["id","Amount"]);
            echo json_encode(compact("sc","inv","pay"), JSON_UNESCAPED_UNICODE), PHP_EOL;
            $ok = $sc && (int)$sc->Charge === 13200 && $inv && (int)$inv->TotalAmount === 13200 && (int)$inv->PaidAmount === 13200 && $pay && (int)$pay->Amount === 13200;
            exit($ok ? 0 : 42);
          '
          echo "REPAIR_STATE=APPLIED_AND_VERIFIED"
          ENDSSH
