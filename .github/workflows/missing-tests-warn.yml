name: Missing Tests Warning

# Execution #487：當 PR 改了高風險 production code（backend/app/** 或 frontend/src/**）
# 但沒有任何 tests/** 變更時，加一條 PR comment 提醒。
# 不阻擋 merge — 只是讓 reviewer / CEO 一眼看到「這個 PR 沒寫測試」。

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: missing-tests-warn-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  warn:
    name: Warn if production change lacks tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect missing-tests pattern
        id: detect
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)
          echo "Changed files:"
          echo "$FILES"

          PROD=$(echo "$FILES" | grep -E '^(backend/app/.*\.(php)|frontend/src/.*\.(vue|js|ts))$' \
            | grep -vE '\.(test|spec)\.' || true)
          TESTS=$(echo "$FILES" | grep -E '^(backend/tests/|frontend/.*\.(test|spec)\.)' || true)

          if [ -n "$PROD" ] && [ -z "$TESTS" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "Changed prod files (no tests):"
            echo "$PROD"
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post warning comment
        if: steps.detect.outputs.missing == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- missing-tests-warn -->';
            const body = `${marker}\n⚠️ **Missing tests warning** — 此 PR 改了 \`backend/app/**\` 或 \`frontend/src/**\` 但沒有任何 \`tests/**\` 變更。\n\n依 P0 規則 R1：\`production code\` 必須先有測試 → CI 綠 → 才能改 production。\n\n如果這是 docs / CSS-only / refactor 無行為變更，請在 PR 描述說明；否則請補測試後再 merge。\n\nRefs: \`.cursor/rules/p0-gate.mdc\`、Execution #487。`;
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number: prNumber, per_page: 100 });
            const existing = comments.data.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }

      - name: Clear stale warning when tests added
        if: steps.detect.outputs.missing == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- missing-tests-warn -->';
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number: prNumber, per_page: 100 });
            const existing = comments.data.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              const cleared = `${marker}\n✅ Tests added — earlier missing-tests warning resolved.`;
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: cleared });
            }
