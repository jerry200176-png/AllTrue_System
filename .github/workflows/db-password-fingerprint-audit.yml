name: DB Password Fingerprint Audit — issue #1387 (read-only)

on:
  workflow_dispatch:

concurrency:
  group: db-password-fingerprint-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Test fingerprint scanner
        run: python3 scripts/credential-fingerprint-audit.test.py

      - name: Extract fingerprint from pre-fix blobs (issue #1387 / PR #1395)
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/credential-audit/blobs
          # Blob SHAs of .github/workflows/ci.yml and backend/phpunit.xml as
          # they existed at commit 4479f0f8 (the parent of fix commit
          # 3332d068) — the last commit containing the hard-coded DB
          # password before PR #1395 replaced it with the non-sensitive
          # `ci-ephemeral` fixture. Blob SHAs are content-addressed
          # identifiers, not the content itself.
          for blob_sha in 721fe391faa9b8ed79b1ea07a8930f3c4c974b91 \
                           5f7614ab67d671b44d09967e7f75cc6d82c3912e; do
            gh api "repos/${REPOSITORY}/git/blobs/${blob_sha}" --jq .content \
              | base64 --decode > "/tmp/credential-audit/blobs/${blob_sha}"
          done
          python3 scripts/credential-fingerprint-audit.py extract \
            /tmp/credential-audit/blobs > /tmp/credential-audit/leaked.tsv
          test -s /tmp/credential-audit/leaked.tsv
          grep -q '^DB_PASSWORD' /tmp/credential-audit/leaked.tsv

      - name: Setup pinned SSH identity
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$PI_SSH_KEY"
          test -n "$PI_HOST_KEY"
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          printf '%s\n' "$PI_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Read production DB password fingerprint (read-only)
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_USER}@${PI_HOST}" bash <<'REMOTE' > /tmp/credential-audit/production.tsv
          set -euo pipefail
          cd /home/admin/backend
          php artisan tinker --execute='
          $value = trim((string) config("database.connections.mysql.password"));
          if ($value !== "") echo "DB_PASSWORD", "\t", hash("sha256", $value), PHP_EOL;
          '
          REMOTE
          test -s /tmp/credential-audit/production.tsv

      - name: Compare fingerprints
        run: |
          python3 scripts/credential-fingerprint-audit.py compare \
            /tmp/credential-audit/leaked.tsv \
            /tmp/credential-audit/production.tsv

      - name: Remove audit material
        if: always()
        run: rm -rf /tmp/credential-audit ~/.ssh/deploy_key
