name: Teacher Sign-in Diagnostic (manual)

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Local date to inspect, format YYYY-MM-DD"
        required: true
        type: string
      teacher_name:
        description: "Teacher name keyword"
        required: false
        type: string
      teacher_id:
        description: "Teacher User.id"
        required: false
        type: string
      campus_id:
        description: "Optional campus id filter"
        required: false
        type: string

concurrency:
  group: teacher-signin-diagnostic
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    name: Run read-only teacher sign-in diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate inputs
        env:
          DATE: ${{ inputs.date }}
          TEACHER_ID: ${{ inputs.teacher_id }}
          TEACHER_NAME: ${{ inputs.teacher_name }}
          CAMPUS_ID: ${{ inputs.campus_id }}
        run: |
          set -euo pipefail
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::date must be YYYY-MM-DD"; exit 1; }
          [ -n "$TEACHER_ID" ] || [ -n "$TEACHER_NAME" ] || { echo "::error::teacher_id or teacher_name is required"; exit 1; }
          if [ -n "$TEACHER_ID" ]; then
            [[ "$TEACHER_ID" =~ ^[0-9]+$ ]] || { echo "::error::teacher_id must be numeric"; exit 1; }
          fi
          if [ -n "$CAMPUS_ID" ]; then
            [[ "$CAMPUS_ID" =~ ^[0-9]+$ ]] || { echo "::error::campus_id must be numeric"; exit 1; }
          fi

      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.PI_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run read-only diagnostic on production
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          DATE: ${{ inputs.date }}
          TEACHER_ID: ${{ inputs.teacher_id }}
          TEACHER_NAME: ${{ inputs.teacher_name }}
          CAMPUS_ID: ${{ inputs.campus_id }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "${PI_SSH_USER}@${PI_SSH_HOST}" \
            DATE="$DATE" TEACHER_ID="$TEACHER_ID" TEACHER_NAME="$TEACHER_NAME" CAMPUS_ID="$CAMPUS_ID" 'bash -s' <<'ENDSSH'
          set -euo pipefail
          cd /home/admin/backend

          CMD=(php artisan teacher-signin:diagnose "--date=${DATE}")
          if [ -n "${TEACHER_ID}" ]; then CMD+=("--teacher-id=${TEACHER_ID}"); fi
          if [ -n "${TEACHER_NAME}" ]; then CMD+=("--teacher-name=${TEACHER_NAME}"); fi
          if [ -n "${CAMPUS_ID}" ]; then CMD+=("--campus-id=${CAMPUS_ID}"); fi

          "${CMD[@]}"
          ENDSSH
