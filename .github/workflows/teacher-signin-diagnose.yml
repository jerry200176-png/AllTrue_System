name: Teacher Sign-in Diagnostic (manual)

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Local date to inspect, format YYYY-MM-DD"
        required: true
        type: string
      teacher_id:
        description: "Teacher User.id (numeric; never a name or login)"
        required: true
        type: string
      campus_id:
        description: "Optional campus id filter"
        required: false
        type: string

concurrency:
  group: teacher-signin-diagnostic
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    name: Run read-only teacher sign-in diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout pinned SSH trust helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            .github/actions/production-ssh-trust
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Validate inputs
        env:
          DATE: ${{ inputs.date }}
          TEACHER_ID: ${{ inputs.teacher_id }}
          CAMPUS_ID: ${{ inputs.campus_id }}
        run: |
          set -euo pipefail
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::date must be YYYY-MM-DD"; exit 1; }
          [[ "$TEACHER_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::teacher_id must be a numeric id (public repo: no names or logins)"; exit 1; }
          if [ -n "$CAMPUS_ID" ]; then
            [[ "$CAMPUS_ID" =~ ^[0-9]+$ ]] || { echo "::error::campus_id must be numeric"; exit 1; }
          fi

      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Run read-only diagnostic on production
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          DATE: ${{ inputs.date }}
          TEACHER_ID: ${{ inputs.teacher_id }}
          CAMPUS_ID: ${{ inputs.campus_id }}
          PII_FILTER: |
            import re, sys
            KEEP = {"teacher_id", "user_campus_id", "approved", "admin", "user_status", "uc_rfid", "id", "campus_id",
                    "sign_in_dt", "sign_out_dt", "source", "status", "student_id", "student_campus_id", "enable",
                    "student_signin_id", "signin_campus_id", "voided_at", "created_at", "user_id", "user_type"}
            LINE = re.compile(r"^(Read-only teacher sign-in diagnostic for \d{4}-\d\d-\d\d|RFID fingerprint: [0-9a-f]{0,12}|"
                              r"(Teachers matched|TeacherSingIn rows|Students / StudentSingIn with same RFID|"
                              r"TempRfid rows with same RFID|Login fallback User/UserCampus rows): \d+)$")
            VALUE = re.compile(r"\d{1,12}|\d{4}-\d\d-\d\d( \d\d:\d\d:\d\d)?|[0-9a-f]{12}|rfid|present|leave|absent|"
                               r"source_only|approved|pending|active|inactive|suspended|null|")
            borders, cols, dropped = 0, None, 0
            for raw in sys.stdin:
                line = raw.rstrip("\n")
                if line.startswith("+"):
                    borders += 1
                    continue
                if line.startswith("|"):
                    cells = [c.strip() for c in line.strip().strip("|").split("|")]
                    if borders == 1:
                        cols = [i for i, c in enumerate(cells) if c in KEEP]
                        print(" | ".join(cells[i] for i in cols))
                    elif cols is not None:
                        vals = [cells[i] for i in cols if i < len(cells)]
                        if all(VALUE.fullmatch(v) for v in vals):
                            print(" | ".join(vals))
                        else:
                            dropped += 1
                    continue
                borders, cols = 0, None
                m = re.match(r"^Teacher (\d+)(?: / .*)?$", line)
                if m:
                    print(f"Teacher {m.group(1)}")
                elif LINE.match(line):
                    print(line)
                elif line.strip():
                    dropped += 1
            print(f"filtered_lines_dropped={dropped}")
        run: |
          set -euo pipefail
          # Public repo (#3605): the command prints teacher/student names and memos in its tables. Remote
          # stderr is discarded and stdout is reduced to an allowlist of ids, statuses, dates and counts.
          ssh -i ~/.ssh/deploy_key "${PI_SSH_USER}@${PI_SSH_HOST}" \
            DATE="$DATE" TEACHER_ID="$TEACHER_ID" CAMPUS_ID="$CAMPUS_ID" 'bash -s' 2>/dev/null <<'ENDSSH' | python3 -c "$PII_FILTER"
          set -euo pipefail
          cd /home/admin/backend

          CMD=(php artisan teacher-signin:diagnose "--date=${DATE}")
          CMD+=("--teacher-id=${TEACHER_ID}")
          if [ -n "${CAMPUS_ID}" ]; then CMD+=("--campus-id=${CAMPUS_ID}"); fi

          "${CMD[@]}"
          ENDSSH
