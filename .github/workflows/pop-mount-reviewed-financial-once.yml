name: POP mount reviewed-financial once
# One-shot: install exact Founder tuple to Pi private path. Does not deploy product code.
# Mount never SCP-overwrites the live authorization file before validation.
on:
  workflow_dispatch:
    inputs:
      case_label:
        description: Non-secret label for logs (e.g. course-4064)
        required: true
        type: string
      mode:
        description: mount (default), probe-identity, or separately approved probe-policy (read-only)
        required: false
        type: choice
        options: [mount, probe-identity, probe-policy]
        default: mount
permissions:
  contents: read
concurrency:
  group: alltrue-production-side-effects-v2
  cancel-in-progress: false
  queue: max
jobs:
  mount:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-activation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/production-ssh-trust
            .github/workflows/pop-mount-reviewed-financial-once.yml
            scripts/check-pop-mount-remote-guards.py
            .github/workflows/deploy.yml
            scripts/production-deploy/pi-remote-deploy.sh
            .github/scripts/pop-mount-policy-readonly.sh
            .github/scripts/pop-mount-policy-probe.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Guard pop-mount remote (no 644 / require app-serving bind / atomic stage)
        env:
          MODE: ${{ inputs.mode || 'mount' }}
        run: |
          case "$MODE" in mount|probe-identity|probe-policy) ;; *) exit 64 ;; esac
          python3 scripts/check-pop-mount-remote-guards.py
          # A mount before deploy stops re-widening storage/app/private would be
          # re-exposed by the next deploy (#4332); refuse until main carries it.
          if [ "$MODE" = mount ]; then
            # The deploy-safety check reads this checkout, so it must be main.
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::mode=mount only runs from refs/heads/main"; exit 1; }
            python3 scripts/check-pop-mount-remote-guards.py --require-deploy-safe
          fi
      - uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Read effective mount policy (separate approval, no mount)
        if: inputs.mode == 'probe-policy'
        env:
          MODE: ${{ inputs.mode }}
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          DUMP_ARTIFACT_KEY: ${{ secrets.DUMP_ARTIFACT_KEY }}
        run: bash .github/scripts/pop-mount-policy-probe.sh
      - name: Upload encrypted mount-policy evidence
        if: always() && inputs.mode == 'probe-policy'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pop-mount-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pop-mount-policy-artifact/*.enc*
          if-no-files-found: ignore
          retention-days: 1
      - name: Install or probe reviewed-financial mount (app-serving FPM only)
        if: inputs.mode != 'probe-policy'
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          MOUNT_B64: ${{ secrets.POP_MOUNT_REVIEWED_FINANCIAL_B64 }}
          CASE_LABEL: ${{ inputs.case_label }}
          MODE: ${{ inputs.mode || 'mount' }}
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
        run: |
          set -euo pipefail
          test -n "${PI_SSH_KEY:-}"
          SSH_DIR="$RUNNER_TEMP/pop-mount-ssh"
          install -d -m 700 "$SSH_DIR"
          printf '%s' "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > "$SSH_DIR/deploy_key"
          chmod 600 "$SSH_DIR/deploy_key"

          POP_DIR=/home/admin/backend/storage/app/private/pop
          LIVE="$POP_DIR/reviewed-financial-cases.json"
          # Same-directory staging only (same filesystem → rename is atomic).
          STAGE="$POP_DIR/reviewed-financial-cases.json.staging"

          if [ "$MODE" = "mount" ]; then
            test -n "${MOUNT_B64:-}"
            printf '%s' "$MOUNT_B64" | base64 -d > "$SSH_DIR/reviewed-financial-cases.json"
            chmod 600 "$SSH_DIR/reviewed-financial-cases.json"
            python3 - "$SSH_DIR/reviewed-financial-cases.json" <<'PY'
          import json, sys, os
          d = json.load(open(sys.argv[1]))
          assert d.get("version") == 1
          cases = d.get("eligible_cases") or []
          assert len(cases) == 1, f"expected exactly 1 tuple, got {len(cases)}"
          c = cases[0]
          for k in ("operation_id", "parameters_sha256", "idempotency_sha256", "requester_sha256", "approver_sha256", "approval_reference", "valid_until"):
              assert k in c and c[k], k
          assert c["operation_id"] == "reviewed-unpaid-invoice-charge-alignment"
          print(f"mount_ok label={os.environ.get('CASE_LABEL')} tuples=1 valid_until={c['valid_until']}")
          PY
            ssh -i "$SSH_DIR/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$PI_SSH_USER@$PI_SSH_HOST" \
              "mkdir -p $(printf %q "$POP_DIR")"
            # NEVER scp onto LIVE. Stage beside LIVE on the same filesystem.
            scp -i "$SSH_DIR/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$SSH_DIR/reviewed-financial-cases.json" \
              "$PI_SSH_USER@$PI_SSH_HOST:$STAGE"
          fi

          # App-serving FPM: vhost → listen → pool → worker /proc Uid.
          # Validate stage (identity, content, restricted access) then atomic replace LIVE.
          ssh -i "$SSH_DIR/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$PI_SSH_USER@$PI_SSH_HOST" "MODE=$(printf %q "$MODE") bash -s" <<'REMOTE'
          set -euo pipefail
          POP_DIR=/home/admin/backend/storage/app/private/pop
          LIVE="$POP_DIR/reviewed-financial-cases.json"
          STAGE="$POP_DIR/reviewed-financial-cases.json.staging"
          PREV="$POP_DIR/reviewed-financial-cases.json.prev"
          APP_ROOT=/home/admin/backend
          APP_PUBLIC=/home/admin/backend/public
          SITE_HINT='daan.lifenet.com.tw'

          awk_listen='/^[[:space:]]*listen[[:space:]]*=/{gsub(/;.*/,""); sub(/^[^=]*=/,""); gsub(/[[:space:]"]/,""); print; exit}'
          awk_user='/^[[:space:]]*user[[:space:]]*=/{gsub(/;.*/,""); sub(/^[^=]*=/,""); gsub(/[[:space:]"]/,""); print; exit}'
          awk_pool='/^\[[^][]+\]/{name=$0; gsub(/[\[\][:space:]]/,"",name); if (name!="" && name!="global") {print name; exit}}'

          extract_listen() {
            conf="$1"
            if grep -qE 'proxy:unix:' "$conf" 2>/dev/null; then
              grep -oE 'proxy:unix:[^|\"[:space:]]+' "$conf" | head -1 | sed 's/^proxy:unix://'
            elif grep -qE 'unix:/[^|\"[:space:]]+\.sock' "$conf" 2>/dev/null; then
              grep -oE 'unix:/[^|\"[:space:]]+\.sock' "$conf" | head -1 | sed 's/^unix://'
            elif grep -qE 'fastcgi_pass[[:space:]]+[^;]+' "$conf" 2>/dev/null; then
              raw="$(grep -oE 'fastcgi_pass[[:space:]]+[^;]+' "$conf" | head -1 | awk '{print $2}')"
              echo "${raw#unix:}"
            fi
          }

          resolve_fpm() {
            listen_target=""
            for prefer in hint path; do
              for conf in /etc/apache2/sites-enabled/* /etc/apache2/conf-enabled/* \
                          /etc/nginx/sites-enabled/* /etc/nginx/conf.d/*; do
                [ -r "$conf" ] || continue
                if [ "$prefer" = "hint" ]; then
                  grep -qF "$SITE_HINT" "$conf" 2>/dev/null || continue
                else
                  grep -qE "$APP_PUBLIC|$APP_ROOT" "$conf" 2>/dev/null || continue
                fi
                listen_target="$(extract_listen "$conf" || true)"
                [ -n "${listen_target:-}" ] && break
              done
              [ -n "${listen_target:-}" ] && break
            done
            test -n "${listen_target:-}"

            pool_user=""
            pool_name=""
            for conf in /etc/php/*/fpm/pool.d/*.conf /etc/php-fpm.d/*.conf; do
              [ -f "$conf" ] || continue
              plisten="$(awk "$awk_listen" "$conf" 2>/dev/null || true)"
              [ -n "${plisten:-}" ] || continue
              case "$plisten" in
                "$listen_target"|"/${listen_target#/}"|"unix:$listen_target") ;;
                *) continue ;;
              esac
              u="$(awk "$awk_user" "$conf" 2>/dev/null || true)"
              n="$(awk "$awk_pool" "$conf" 2>/dev/null || true)"
              [ -n "${n:-}" ] || n="$(basename "$conf" .conf)"
              if [ -n "${u:-}" ] && [ "$u" != "root" ]; then
                pool_user="$u"
                pool_name="$n"
                break
              fi
            done
            test -n "${pool_user:-}"
            test -n "${pool_name:-}"

            worker_pid=""
            while read -r pid args; do
              case "$args" in
                *"php-fpm: pool ${pool_name}"*|*"php-fpm: pool ${pool_name} "*)
                  uid="$(awk '/^Uid:/{print $2}' "/proc/$pid/status" 2>/dev/null || true)"
                  uname="$(getent passwd "${uid:-}" | cut -d: -f1 || true)"
                  if [ "$uname" = "$pool_user" ]; then
                    worker_pid="$pid"
                    break
                  fi
                  ;;
              esac
            done < <(ps -eo pid=,args=)
            test -n "${worker_pid:-}"
            test -r "/proc/${worker_pid}/status"
            uid="$(awk '/^Uid:/{print $2}' "/proc/${worker_pid}/status")"
            gid="$(awk '/^Gid:/{print $2}' "/proc/${worker_pid}/status")"
            user="$(getent passwd "$uid" | cut -d: -f1)"
            test -n "${user:-}"
            test "$user" = "$pool_user"
            fpm_gids="$gid $(awk '/^Groups:/{$1=""; print}' "/proc/${worker_pid}/status")"
            echo "fpm_serving pool=${pool_name} user=${pool_user} listen=${listen_target} worker_pid=${worker_pid}"
          }

          # fpm_can <r|x> PATH: POSIX ACL access decision for the serving worker
          # (uid + /proc groups), computed from getfacl without root or sudo.
          fpm_can() {
            want="$1"; p="$2"
            acl="$(getfacl -cpn -- "$p" 2>/dev/null)" || return 1
            owner="$(stat -c '%u' -- "$p")" || return 1
            ogid="$(stat -c '%g' -- "$p")" || return 1
            mask="$(awk -F: '$1=="mask"{print $3}' <<<"$acl")"
            has() { case "$1" in *"$want"*) ;; *) return 1 ;; esac; if [ -n "$mask" ]; then case "$mask" in *"$want"*) ;; *) return 1 ;; esac; fi; }
            if [ "$owner" = "$uid" ]; then
              case "$(awk -F: '$1=="user" && $2==""{print $3}' <<<"$acl")" in *"$want"*) return 0 ;; *) return 1 ;; esac
            fi
            named="$(awk -F: -v u="$uid" '$1=="user" && $2==u{print $3}' <<<"$acl")"
            if [ -n "$named" ]; then has "$named"; return; fi
            matched=0
            for g in $fpm_gids; do
              perms="$(awk -F: -v g="$g" -v og="$ogid" '$1=="group" && ($2==g || ($2=="" && g==og)){print $3}' <<<"$acl")"
              for perm in $perms; do
                matched=1
                if has "$perm"; then return 0; fi
              done
            done
            if [ "$matched" = 1 ]; then return 1; fi
            case "$(awk -F: '$1=="other"{print $3}' <<<"$acl")" in *"$want"*) return 0 ;; *) return 1 ;; esac
          }

          # Expected getfacl -cpn lines for a file the worker reads via a named
          # entry; anything else (extra principals, wider mask) is refused.
          acl_exact() {
            got="$(getfacl -cpn -- "$1" 2>/dev/null | sed '/^$/d' | sort)" || return 1
            [ "$got" = "$(printf '%s\n' "$2" | sed '/^$/d' | sort)" ]
          }

          # Directory traverse grants are recorded so a later failure can put
          # the original ACLs back (setfacl --restore).
          restore_dir_acls() {
            [ -n "${DIR_ACL_BACKUP:-}" ] && [ -s "$DIR_ACL_BACKUP" ] || return 0
            if ! setfacl --restore="$DIR_ACL_BACKUP"; then
              echo "validate_mount_file: directory ACL restore failed" >&2
              return 1
            fi
            : >"$DIR_ACL_BACKUP"
            echo "directory_acls_restored"
          }

          validate_mount_file() {
            # Explicit fail-closed checks (do not rely on set -e for control flow).
            # No sudo: the deploy account owns the file and grants the serving
            # worker read with a named ACL (production sudo needs a password).
            # Non-mutating checks run first; directory grants are rolled back
            # if anything after them fails.
            target="$1"
            if [ ! -f "$target" ]; then
              echo "validate_mount_file: missing file ${target}" >&2
              return 1
            fi
            if ! command -v setfacl >/dev/null 2>&1 || ! command -v getfacl >/dev/null 2>&1; then
              echo "validate_mount_file: setfacl/getfacl missing (acl package); refusing" >&2
              return 1
            fi
            if ! python3 - "$target" <<'PY'
          import json, sys
          path = sys.argv[1]
          d = json.load(open(path))
          assert d.get("version") == 1
          cases = d.get("eligible_cases") or []
          assert len(cases) == 1, len(cases)
          c = cases[0]
          for k in ("operation_id", "parameters_sha256", "idempotency_sha256", "requester_sha256", "approver_sha256", "approval_reference", "valid_until"):
              assert k in c and c[k], k
          assert c["operation_id"] == "reviewed-unpaid-invoice-charge-alignment"
          print("content_ok", c["valid_until"])
          PY
            then
              echo "validate_mount_file: content validation failed on ${target}" >&2
              return 1
            fi
            managed_parent="$(dirname "$POP_DIR")"
            d="$(dirname "$managed_parent")"
            while [ "$d" != "/" ]; do
              if ! fpm_can x "$d"; then
                echo "validate_mount_file: fpm cannot traverse ${d} as ${user}" >&2
                return 1
              fi
              d="$(dirname "$d")"
            done
            # --set replaces the whole ACL, dropping stale or inherited entries.
            if [ "$(stat -c '%u' "$target")" = "$uid" ]; then
              if ! setfacl -b "$target" || ! chmod 600 "$target"; then
                echo "validate_mount_file: setfacl failed on ${target}" >&2
                return 1
              fi
              want_acl="$(printf 'user::rw-\ngroup::---\nother::---')"
            elif ! setfacl --set "u::rw-,g::---,o::---,u:${uid}:r--,m::r--" "$target"; then
              echo "validate_mount_file: setfacl failed on ${target}" >&2
              return 1
            else
              want_acl="$(printf 'user::rw-\nuser:%s:r--\ngroup::---\nmask::r--\nother::---' "$uid")"
            fi
            if ! acl_exact "$target" "$want_acl"; then
              echo "refusing world-accessible or extra ACL entries on ${target}" >&2
              return 1
            fi
            if ! stat -c 'fpm_identity uid=%u gid=%g mode=%a path=%n' "$target"; then
              echo "validate_mount_file: identity stat failed on ${target}" >&2
              return 1
            fi
            # Only the two directories this workflow manages get a traverse
            # entry; every other ancestor was checked above without changes.
            for d in "$managed_parent" "$POP_DIR"; do
              fpm_can x "$d" && continue
              # A recalculated mask could activate masked rights of other named
              # entries (e.g. write on pop); refuse those dirs and set the mask
              # explicitly to group:: plus execute only.
              if getfacl -cpn -- "$d" 2>/dev/null | grep -E '^(user|group):[^:]+:' | grep -qv "^user:${uid}:"; then
                echo "validate_mount_file: unexpected named ACL entries on ${d}; refusing to change its mask" >&2
                restore_dir_acls
                return 1
              fi
              grp="$(getfacl -cpn -- "$d" 2>/dev/null | awk -F: '$1=="group" && $2==""{print $3}')"
              if ! getfacl -p -- "$d" >>"$DIR_ACL_BACKUP" || ! setfacl -m "u:${uid}:--x,m::${grp:0:2}x" "$d"; then
                echo "validate_mount_file: setfacl traverse failed on ${d}" >&2
                restore_dir_acls
                return 1
              fi
            done
            if ! fpm_can x "$managed_parent" || ! fpm_can x "$POP_DIR"; then
              echo "validate_mount_file: fpm cannot traverse ${POP_DIR} as ${user}" >&2
              restore_dir_acls
              return 1
            fi
            if ! fpm_can r "$target"; then
              echo "validate_mount_file: fpm cannot read ${target} as ${user}" >&2
              restore_dir_acls
              return 1
            fi
            return 0
          }

          # Interrupted runs (cancel, timeout, SIGHUP/TERM) must not leave a
          # half-applied mount: restore PREV if the swap happened, then the
          # usual stage/directory cleanup. SIGKILL cannot be trapped.
          abort_mount() {
            [ "${MOUNT_PHASE:-}" = done ] && return 0
            trap - EXIT HUP INT TERM ERR
            if [ "${MOUNT_PHASE:-}" = swapped ]; then
              if [ -f "$PREV" ]; then mv -f "$PREV" "$LIVE" && echo "aborted_after_swap restored_prev"; else rm -f "$LIVE"; fi
            fi
            cleanup_stage_preserve_live || true
            echo "mount_aborted phase=${MOUNT_PHASE:-unknown}" >&2
            exit 1
          }

          cleanup_stage_preserve_live() {
            # Failure path: discard STAGE; restore LIVE from PREV only if LIVE
            # missing; put back any directory ACLs this run changed.
            rm -f "$STAGE" || true
            restore_dir_acls || true
            if [ ! -f "$LIVE" ] && [ -f "$PREV" ]; then
              if ! mv -f "$PREV" "$LIVE"; then
                echo "cleanup: failed to restore LIVE from PREV" >&2
                return 1
              fi
              echo "restored_live_from_prev"
            fi
            echo "stage_discarded live_preserved=$( [ -f "$LIVE" ] && echo yes || echo no )"
            return 0
          }

          resolve_fpm

          # Read-only ACL readiness: metadata only, never file contents, no changes.
          acl_readiness() {
            echo "deploy_uid=$(id -u) worker_uid=${uid} worker_gids=${fpm_gids}"
            for t in getfacl setfacl; do echo "tool_${t}=$(command -v "$t" >/dev/null 2>&1 && echo present || echo MISSING)"; done
            echo "fs_options=$(findmnt -no FSTYPE,OPTIONS -T "$POP_DIR" 2>/dev/null || echo unknown)"
            managed_parent="$(dirname "$POP_DIR")"
            for p in "$managed_parent" "$POP_DIR" "$LIVE"; do
              [ -e "$p" ] || { echo "path_missing ${p}"; continue; }
              owner_ok=no; [ "$(stat -c '%u' "$p")" = "$(id -u)" ] && owner_ok=yes
              extra="$(getfacl -cpn -- "$p" 2>/dev/null | grep -cE '^(user|group):[^:]+:' || true)"
              mask="$(getfacl -cpn -- "$p" 2>/dev/null | awk -F: '$1=="mask"{print $3}')"
              echo "path=${p} uid=$(stat -c '%u' "$p") gid=$(stat -c '%g' "$p") mode=$(stat -c '%a' "$p") deploy_owns=${owner_ok} named_entries=${extra} mask=${mask:-none}"
            done
            d="$(dirname "$managed_parent")"
            while [ "$d" != "/" ]; do
              fpm_can x "$d" && t=ok || t=DENIED
              echo "ancestor_traverse ${d} ${t}"
              d="$(dirname "$d")"
            done
            [ -e "$LIVE" ] && { fpm_can r "$LIVE" && echo "live_readable_by_worker=yes" || echo "live_readable_by_worker=no"; }
          }

          if [ "${MODE:-mount}" = "probe-identity" ]; then
            acl_readiness || true
            echo "probe_identity_ok"
            exit 0
          fi

          # Mount path: STAGE must exist; LIVE must not be the SCP target.
          if [ ! -f "$STAGE" ]; then
            echo "missing staging file $STAGE (refusing to touch LIVE)" >&2
            exit 1
          fi

          # Same filesystem check (required for atomic rename).
          live_fs="$(df -P "$POP_DIR" | awk 'NR==2{print $1}')"
          stage_fs="$(df -P "$STAGE" | awk 'NR==2{print $1}')"
          if [ "$live_fs" != "$stage_fs" ]; then
            echo "stage and LIVE are on different filesystems; refusing non-atomic replace" >&2
            exit 1
          fi

          DIR_ACL_BACKUP="$(mktemp)"
          MOUNT_PHASE=staged
          trap 'abort_mount' EXIT HUP INT TERM
          trap 'cleanup_stage_preserve_live' ERR

          if ! validate_mount_file "$STAGE"; then
            echo "stage validation failed; LIVE unchanged" >&2
            cleanup_stage_preserve_live
            exit 1
          fi

          # Keep LIVE in place, backup to PREV, then ONE atomic STAGE→LIVE replace.
          rm -f "$PREV"
          if [ -f "$LIVE" ]; then
            if ! cp -a "$LIVE" "$PREV"; then
              echo "backup LIVE→PREV failed; LIVE unchanged" >&2
              cleanup_stage_preserve_live
              exit 1
            fi
            if ! cmp -s "$LIVE" "$PREV"; then
              echo "backup PREV does not match LIVE; refusing replace" >&2
              rm -f "$PREV"
              cleanup_stage_preserve_live
              exit 1
            fi
          fi
          if ! mv -f "$STAGE" "$LIVE"; then
            echo "atomic STAGE→LIVE replace failed" >&2
            cleanup_stage_preserve_live
            exit 1
          fi
          MOUNT_PHASE=swapped
          # Drop prev only after successful swap + re-validate LIVE.
          if ! validate_mount_file "$LIVE"; then
            echo "post-swap LIVE validation failed; restoring PREV" >&2
            restore_dir_acls || true
            if [ -f "$PREV" ]; then
              if ! mv -f "$PREV" "$LIVE"; then
                echo "restore PREV→LIVE failed" >&2
                exit 1
              fi
            else
              rm -f "$LIVE"
            fi
            MOUNT_PHASE=restored
            exit 1
          fi
          rm -f "$PREV" "$DIR_ACL_BACKUP"
          MOUNT_PHASE=done
          trap - EXIT HUP INT TERM ERR
          python3 -c 'import json;d=json.load(open("/home/admin/backend/storage/app/private/pop/reviewed-financial-cases.json")); print("pi_mount_verified", d["eligible_cases"][0]["valid_until"])'
          REMOTE
          rm -f "$SSH_DIR/deploy_key" "$SSH_DIR/reviewed-financial-cases.json"
