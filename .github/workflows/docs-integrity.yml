name: Docs Integrity

# #543：本 workflow 在每個 PR 都執行。Docs Integrity Check 是 main 的 required
# status check；若非文件變更仍必須回報 success，不能回報 skipped，否則 strict
# ruleset 會阻擋合併。這裡的檢查是唯讀治理驗證，不會部署或修改 production。
on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: "20 1 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect docs changes
    # Repository contract: entry jobs must skip draft PRs; ready-for-review PRs
    # still run the required integrity check even when docs are unchanged.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    # Current topology: GitHub-hosted. See docs/REF_CI_RUNNER_TOPOLOGY.md.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA pin pilot 2026-07-18)

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'README.md'
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - '.cursorrules'
              - '.cursor/rules/**'
              - 'Makefile'
              - 'scripts/docs-integrity-check.mjs'
              - 'scripts/governance/**'
              - 'scripts/radars/**'
              - 'scripts/agent-preflight.sh'
              - 'scripts/catalog/**'
              - 'docs/catalog/**'
              - '.github/workflows/docs-integrity.yml'

  integrity:
    name: Docs Integrity Check
    needs: changes
    # Required check contract: always run and report success/ failure, never skip.
    # setup-node pins the runtime on the ephemeral GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA pin pilot 2026-07-18)

      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_HOST || secrets.PI_SSH_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Run docs integrity check
        run: node scripts/docs-integrity-check.mjs --strict
      - name: Service catalog validate
        run: make catalog-validate
      - name: Governance health (capability + invariants + overlay pin)
        run: |
          make instruction-invariants
          make validate-capabilities
          make overlay-pin || { echo "overlay pin check failed"; exit 1; }

      # Weekly schedule runs silently otherwise — a red run just sits in the
      # Actions tab until some unrelated PR happens to collide with it (see
      # 2026-08-23 incident). Push it to the same ops channel monitor-alert.sh
      # already uses on the Pi, so it doesn't need a second, third alerting path.
      - name: Notify ops channel on scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          MSG="📄 Docs Integrity Check（每週排程）失敗，需要人工複審或修文件：${RUN_URL}"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_USER}@${PI_HOST}" "bash /home/admin/scripts/monitor-alert.sh notify '${MSG}'"
