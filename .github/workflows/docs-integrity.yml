name: Docs Integrity

# #543：改為 job-level skip（移除 workflow-level paths 過濾），讓本 workflow 在每個 PR
# 都觸發、「Docs Integrity Check」一定會回報 status —— 非文件變更時該 job skip（＝中性，
# 不阻擋），才能安全納入 main branch protection 的 required status checks。
# （workflow-level paths 過濾的 check 在不觸發的 PR 上「永遠 pending」會卡死合併。）
on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: "20 1 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect docs changes
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    # Current topology: GitHub-hosted. See docs/REF_CI_RUNNER_TOPOLOGY.md.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA pin pilot 2026-07-18)

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'README.md'
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - '.cursorrules'
              - '.cursor/rules/**'
              - 'Makefile'
              - 'scripts/docs-integrity-check.mjs'
              - 'scripts/governance/**'
              - 'scripts/radars/**'
              - 'scripts/catalog/**'
              - 'docs/catalog/**'
              - '.github/workflows/docs-integrity.yml'

  integrity:
    name: Docs Integrity Check
    needs: changes
    # schedule / 手動觸發一律跑；PR 僅在有文件相關變更時跑，否則 skip（中性、不阻擋合併）。
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs == 'true'
    # setup-node pins the runtime on the ephemeral GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA pin pilot 2026-07-18)

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Run docs integrity check
        run: node scripts/docs-integrity-check.mjs --strict
      - name: Service catalog validate
        run: make catalog-validate
      - name: Governance health (capability + invariants + overlay pin)
        run: |
          make instruction-invariants
          make validate-capabilities
          make overlay-pin || { echo "overlay pin check failed"; exit 1; }
