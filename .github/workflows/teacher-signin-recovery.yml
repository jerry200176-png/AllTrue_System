name: Teacher Sign-in Recovery (manual)

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Local date to inspect/recover, format YYYY-MM-DD"
        required: true
        type: string
      teacher_id:
        description: "Teacher User.id. Optional for dry-run, required for apply."
        required: false
        type: string
      campus_id:
        description: "Optional campus id filter"
        required: false
        type: string
      apply:
        description: "Write recovered TeacherSingIn rows"
        required: true
        default: false
        type: boolean
      confirm:
        description: "For apply only: type I_HAVE_BACKUP_AND_APPROVE_TEACHER_SIGNIN_RECOVERY"
        required: false
        type: string

concurrency:
  group: teacher-signin-recovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recover:
    name: Run allowlisted teacher sign-in recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout pinned SSH trust helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/production-ssh-trust
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Validate inputs
        env:
          DATE: ${{ inputs.date }}
          TEACHER_ID: ${{ inputs.teacher_id }}
          CAMPUS_ID: ${{ inputs.campus_id }}
          APPLY: ${{ inputs.apply }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::date must be YYYY-MM-DD"; exit 1; }
          if [ -n "$TEACHER_ID" ]; then
            [[ "$TEACHER_ID" =~ ^[0-9]+$ ]] || { echo "::error::teacher_id must be numeric"; exit 1; }
          fi
          if [ -n "$CAMPUS_ID" ]; then
            [[ "$CAMPUS_ID" =~ ^[0-9]+$ ]] || { echo "::error::campus_id must be numeric"; exit 1; }
          fi
          if [ "$APPLY" = "true" ]; then
            [ -n "$TEACHER_ID" ] || { echo "::error::apply requires teacher_id"; exit 1; }
            [ "$CONFIRM" = "I_HAVE_BACKUP_AND_APPROVE_TEACHER_SIGNIN_RECOVERY" ] || {
              echo "::error::apply requires exact confirmation string";
              exit 1;
            }
          fi

      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Run recovery command on production
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          DATE: ${{ inputs.date }}
          TEACHER_ID: ${{ inputs.teacher_id }}
          CAMPUS_ID: ${{ inputs.campus_id }}
          APPLY: ${{ inputs.apply }}
          # Public repo (#3605): the command is run with --json (ids and dates only; names are never requested) and
          # every tagged result line must be exactly one JSON object; only allowlisted keys are re-serialized.
          # On a parse failure a fixed message is printed, never the input. Other lines are dropped and counted.
          PII_FILTER: |
            import json, re, sys
            TAGS = ("DRYRUN_JSON ", "APPLY_JSON ")
            ROW = {"student_signin_id", "teacher_id", "campus_id", "student_id", "sign_in_dt", "sign_out_dt"}
            DT = re.compile(r"\d{4}-\d\d-\d\d( \d\d:\d\d:\d\d)?|")
            def num(v):
                return isinstance(v, int) and not isinstance(v, bool)
            def row(r):
                ok = isinstance(r, dict)
                return {k: v for k, v in r.items() if k in ROW and (num(v) or (isinstance(v, str) and DT.fullmatch(v)))} if ok else None
            def clean(d):
                out = {}
                if d.get("mode") in ("dry-run", "apply"):
                    out["mode"] = d["mode"]
                if isinstance(d.get("date"), str) and re.fullmatch(r"\d{4}-\d\d-\d\d", d["date"]):
                    out["date"] = d["date"]
                for k in ("candidates", "inserted"):
                    if num(d.get(k)):
                        out[k] = d[k]
                if isinstance(d.get("rows"), list):
                    out["rows"] = [x for x in map(row, d["rows"]) if x is not None]
                return out
            seen, dropped = set(), 0
            for raw in sys.stdin:
                line = raw.rstrip("\n")
                tag = next((t for t in TAGS if line.startswith(t)), None)
                if tag is None:
                    if line in ("DRYRUN_COMPLETE", "BACKUP_OK"):
                        print(line)
                    elif line.strip():
                        dropped += 1
                    continue
                try:
                    if tag in seen:
                        raise ValueError("duplicate")
                    seen.add(tag)
                    d = json.loads(line[len(tag):])
                    if not isinstance(d, dict):
                        raise ValueError("not an object")
                    print(tag.strip() + " " + json.dumps(clean(d), separators=(",", ":")))
                except ValueError:
                    print("recovery output could not be parsed; withheld")
                    sys.exit(1)
            print(f"filtered_lines_dropped={dropped}")
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "${PI_SSH_USER}@${PI_SSH_HOST}" \
            DATE="$DATE" TEACHER_ID="$TEACHER_ID" CAMPUS_ID="$CAMPUS_ID" APPLY="$APPLY" 'bash -s' 2>/dev/null <<'ENDSSH' | python3 -c "$PII_FILTER"
          set -euo pipefail
          cd /home/admin/backend

          CMD=(php artisan teacher-signin:recover-rfid-collisions "--date=${DATE}" --json)
          if [ -n "${TEACHER_ID}" ]; then CMD+=("--teacher-id=${TEACHER_ID}"); fi
          if [ -n "${CAMPUS_ID}" ]; then CMD+=("--campus-id=${CAMPUS_ID}"); fi

          echo "DRYRUN_JSON $("${CMD[@]}")"

          if [ "${APPLY}" != "true" ]; then
            echo "DRYRUN_COMPLETE"
            exit 0
          fi

          TS=$(date '+%Y-%m-%d_%H%M%S')
          BACKUP_FILE="/home/admin/backups/emergency/db_pre_teacher_signin_recovery_${TS}.sql.gz"
          mkdir -p /home/admin/backups/emergency
          DB_USER="$(grep '^DB_USERNAME=' /home/admin/backend/.env | cut -d= -f2-)"
          mysqldump -h 127.0.0.1 -u "$DB_USER" -p"$(grep '^DB_PASSWORD=' /home/admin/backend/.env | cut -d= -f2-)" \
            --single-transaction AllTrue | gzip > "$BACKUP_FILE"
          echo "BACKUP_OK"

          echo "APPLY_JSON $("${CMD[@]}" --apply)"
          ENDSSH
