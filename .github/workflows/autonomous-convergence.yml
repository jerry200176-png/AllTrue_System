name: Autonomous main convergence

# Auto-merge performed by a bot can leave no push-triggered CI event. This
# bounded reconciler restores the CI -> deploy handoff; it never opens SSH,
# changes production directly, or bypasses a required check.
on:
  # Auto-merge is performed by GitHub's bot and may not emit a push event
  # that starts main CI. Reconcile immediately after a merged PR; manual
  # dispatch remains the fallback for an intentionally bounded recovery.
  pull_request_target:
    branches: [main]
    types: [closed]
  # GitHub's auto-merge bot can suppress the post-merge pull_request event.
  # The safe-merge workflow completes before the checks finish, so the job
  # below polls only that PR's merge state for a bounded window and then
  # reconciles the exact main SHA.
  workflow_run:
    workflows: ["Autonomous safe merge"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: autonomous-main-convergence
  cancel-in-progress: true

jobs:
  reconcile:
    name: Reconcile exact-main CI event
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Dispatch CI when current main has no downstream evidence
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number }}"
            if [[ -n "$PR_NUMBER" ]]; then
              for _ in {1..24}; do
                PR_STATE="$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}" --jq 'if .merged_at then "merged" else .state end')"
                if [[ "$PR_STATE" == "merged" ]]; then
                  break
                fi
                if [[ "$PR_STATE" == "closed" ]]; then
                  echo "Auto-merge source PR #${PR_NUMBER} closed without merge; no CI dispatch."
                  exit 0
                fi
                sleep 10
              done
              if [[ "$PR_STATE" != "merged" ]]; then
                echo "Auto-merge source PR #${PR_NUMBER} did not merge within the bounded window; manual dispatch remains fallback."
                exit 0
              fi
            fi
          fi

          MAIN_SHA="$(gh api "/repos/${REPO}/git/ref/heads/main" --jq '.object.sha')"
          CI_JSON_FILE="$(mktemp)"
          DEPLOY_JSON_FILE="$(mktemp)"
          trap 'rm -f "$CI_JSON_FILE" "$DEPLOY_JSON_FILE"' EXIT
          # A merge fires this job before GitHub has created the push-triggered CI run. Deciding on that empty list dispatched a
          # second CI run, which cancelled the push run (same concurrency group) and left only no-op deploy runs behind (#5659).
          # Give the push run up to 90 seconds to appear before deciding.
          for _ in {1..6}; do
            gh api "/repos/${REPO}/actions/workflows/ci.yml/runs?branch=main&head_sha=${MAIN_SHA}&per_page=100" > "$CI_JSON_FILE"
            if [[ "$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1])).get("workflow_runs", [])))' "$CI_JSON_FILE")" != "0" ]]; then
              break
            fi
            sleep 15
          done
          gh api "/repos/${REPO}/actions/workflows/deploy.yml/runs?branch=main&head_sha=${MAIN_SHA}&per_page=100" > "$DEPLOY_JSON_FILE"

          DECISION="$(MAIN_SHA="$MAIN_SHA" CI_JSON_FILE="$CI_JSON_FILE" DEPLOY_JSON_FILE="$DEPLOY_JSON_FILE" python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          def read(path):
              with open(path, encoding="utf-8") as handle:
                  return json.load(handle).get("workflow_runs", [])

          now = datetime.now(timezone.utc)
          # Only main's own CI is evidence: a pull_request run that happens to share the SHA is not.
          ci_runs = [run for run in read(os.environ["CI_JSON_FILE"]) if run.get("event") in {"push", "workflow_dispatch"}]
          deploy_runs = read(os.environ["DEPLOY_JSON_FILE"])
          # Anything not completed counts: a push run blocked behind the previous main CI sits in "pending" (#5659).
          active = any(run.get("status") != "completed" for run in ci_runs)
          # The newest finished run decides: an older green run does not outvote a later failure.
          done = sorted((run for run in ci_runs if run.get("status") == "completed"), key=lambda run: run.get("created_at") or "")
          successful = bool(done) and done[-1].get("conclusion") == "success"
          # deploy.yml also leaves a no-op run behind a cancelled CI. Once a CI run is green, only a deploy run created at or
          # after that green run finished is downstream evidence (#5659). Without a green run the old rule stands.
          green_at = (done[-1].get("updated_at") or "") if successful else ""
          # deploy.yml starts 3-4 seconds after the CI run it follows. A later run tagged with this SHA can come from an older
          # commit's failed CI and deploys nothing, so only the first 60 seconds count. A needless hand-off is a no-op there.
          def seconds_after_green(run):
              try:
                  return (datetime.fromisoformat(run["created_at"].replace("Z", "+00:00")) - green_time).total_seconds()
              except (KeyError, TypeError, ValueError):
                  return -1
          try:
              green_time = datetime.fromisoformat(green_at.replace("Z", "+00:00"))
              green_age = (now - green_time).total_seconds()
              deploy_present = any(0 <= seconds_after_green(run) <= 60 for run in deploy_runs)
          except ValueError:
              green_age = 0
              deploy_present = bool(deploy_runs)
          recent_dispatch = False
          for run in ci_runs:
              if run.get("event") != "workflow_dispatch":
                  continue
              try:
                  age = (now - datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))).total_seconds()
              except (KeyError, TypeError, ValueError):
                  continue
              if age < 900:
                  recent_dispatch = True
                  break

          if active or recent_dispatch or deploy_present:
              print("hold")
          elif not successful:
              print("dispatch")
          elif green_age >= 120:
              # Green exact-main CI and nothing downstream (the run that dispatched it died first): hand off, do not rerun CI.
              print("handoff")
          else:
              print("hold")  # deploy.yml's own workflow_run trigger may still be starting
          print(
              f"main_sha={os.environ['MAIN_SHA']} ci_runs={len(ci_runs)} "
              f"successful_ci={successful} deploy_runs={len(deploy_runs)} "
              f"active_ci={active} recent_dispatch={recent_dispatch}",
          )
          PY
          )"

          echo "$DECISION"
          handoff() {
            gh api --method POST "/repos/${REPO}/dispatches" \
              -f event_type=autonomous-production-deploy \
              -f "client_payload[target_sha]=${MAIN_SHA}" \
              -f "client_payload[source]=autonomous-main-convergence"
            echo "Dispatched autonomous production handoff for exact main SHA ${MAIN_SHA}; deploy.yml remains the only production executor."
          }
          DISPATCHED_CI=0
          if [[ "$DECISION" == handoff$'\n'* ]]; then
            handoff
          elif [[ "$DECISION" == dispatch$'\n'* ]]; then
            gh workflow run ci.yml --repo "$REPO" --ref main
            DISPATCHED_CI=1
            echo "Dispatched exact-main CI; deploy.yml remains the only production executor."
          else
            echo "No CI dispatch needed; required checks and deploy evidence remain authoritative."
          fi

          if [[ "$DISPATCHED_CI" == "1" ]]; then
            # Main CI takes 10-21 minutes; wait up to 25.
            for _ in {1..150}; do
              CI_JSON="$(gh api "/repos/${REPO}/actions/workflows/ci.yml/runs?branch=main&head_sha=${MAIN_SHA}&event=workflow_dispatch&per_page=100")"
              CI_STATE="$(CI_JSON="$CI_JSON" python3 - <<'PY'
          import json
          import os

          runs = [
              run for run in json.loads(os.environ["CI_JSON"]).get("workflow_runs", [])
              if run.get("name") == "CI — PHPUnit Tests"
          ]
          runs.sort(key=lambda run: run.get("created_at", ""))
          if not runs:
              print("missing")
          else:
              run = runs[-1]
              print(f"{run.get('status', 'unknown')}:{run.get('conclusion') or ''}")
          PY
              )"
              if [[ "$CI_STATE" == "completed:success" ]]; then
                break
              fi
              if [[ "$CI_STATE" == completed:* && "$CI_STATE" != "completed:success" ]]; then
                echo "Exact-main CI did not pass (${CI_STATE}); production dispatch refused."
                exit 1
              fi
              sleep 10
            done
            if [[ "$CI_STATE" != "completed:success" ]]; then
              echo "Exact-main CI did not complete within the bounded window; production dispatch refused."
              exit 1
            fi
            handoff
          fi
