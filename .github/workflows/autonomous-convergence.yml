name: Autonomous main convergence

# Auto-merge performed by a bot can leave no push-triggered CI event. This
# bounded reconciler restores the CI -> deploy workflow_run chain; it never
# deploys, opens SSH, changes production, or bypasses a required check.
on:
  # Auto-merge is performed by GitHub's bot and may not emit a push event
  # that starts main CI. Reconcile immediately after a merged PR; the bounded
  # scheduler below remains the fallback for any missed event.
  pull_request_target:
    branches: [main]
    types: [closed]
  # GitHub's auto-merge bot can suppress the post-merge pull_request event.
  # The safe-merge workflow completes before the checks finish, so the job
  # below polls only that PR's merge state for a bounded window and then
  # reconciles the exact main SHA.
  workflow_run:
    workflows: ["Autonomous safe merge"]
    types: [completed]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: autonomous-main-convergence
  cancel-in-progress: true

jobs:
  reconcile:
    name: Reconcile exact-main CI event
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Dispatch CI when current main has no downstream evidence
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number }}"
            if [[ -n "$PR_NUMBER" ]]; then
              for _ in {1..24}; do
                PR_STATE="$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}" --jq 'if .merged_at then "merged" else .state end')"
                if [[ "$PR_STATE" == merged:* ]]; then
                  break
                fi
                if [[ "$PR_STATE" == closed:* ]]; then
                  echo "Auto-merge source PR #${PR_NUMBER} closed without merge; no CI dispatch."
                  exit 0
                fi
                sleep 10
              done
              if [[ "$PR_STATE" != merged:* ]]; then
                echo "Auto-merge source PR #${PR_NUMBER} did not merge within the bounded window; scheduler remains fallback."
                exit 0
              fi
            fi
          fi

          MAIN_SHA="$(gh api "/repos/${REPO}/git/ref/heads/main" --jq '.object.sha')"
          CI_JSON_FILE="$(mktemp)"
          DEPLOY_JSON_FILE="$(mktemp)"
          trap 'rm -f "$CI_JSON_FILE" "$DEPLOY_JSON_FILE"' EXIT
          gh api "/repos/${REPO}/actions/workflows/ci.yml/runs?branch=main&head_sha=${MAIN_SHA}&per_page=100" > "$CI_JSON_FILE"
          gh api "/repos/${REPO}/actions/workflows/deploy.yml/runs?branch=main&head_sha=${MAIN_SHA}&per_page=100" > "$DEPLOY_JSON_FILE"

          DECISION="$(MAIN_SHA="$MAIN_SHA" CI_JSON_FILE="$CI_JSON_FILE" DEPLOY_JSON_FILE="$DEPLOY_JSON_FILE" python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          def read(path):
              with open(path, encoding="utf-8") as handle:
                  return json.load(handle).get("workflow_runs", [])

          now = datetime.now(timezone.utc)
          ci_runs = read(os.environ["CI_JSON_FILE"])
          deploy_runs = read(os.environ["DEPLOY_JSON_FILE"])
          active = any(run.get("status") in {"queued", "in_progress", "waiting"} for run in ci_runs)
          successful = any(run.get("conclusion") == "success" for run in ci_runs)
          deploy_present = bool(deploy_runs)
          recent_dispatch = False
          for run in ci_runs:
              if run.get("event") != "workflow_dispatch":
                  continue
              try:
                  age = (now - datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))).total_seconds()
              except (KeyError, TypeError, ValueError):
                  continue
              if age < 900:
                  recent_dispatch = True
                  break

          if active or recent_dispatch or deploy_present:
              print("hold")
          else:
              print("dispatch")
          print(
              f"main_sha={os.environ['MAIN_SHA']} ci_runs={len(ci_runs)} "
              f"successful_ci={successful} deploy_runs={len(deploy_runs)} "
              f"active_ci={active} recent_dispatch={recent_dispatch}",
          )
          PY
          )"

          echo "$DECISION"
          if [[ "$DECISION" == dispatch$'\n'* ]]; then
            gh workflow run ci.yml --repo "$REPO" --ref main
            echo "Dispatched exact-main CI; deploy.yml remains the only production executor."
          else
            echo "No CI dispatch needed; required checks and deploy evidence remain authoritative."
          fi
