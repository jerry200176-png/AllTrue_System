name: CI — PHPUnit Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# ⛔ 此 workflow 只跑測試，絕對不部署任何東西到生產環境
# ⛔ 禁止在此新增任何 ssh、rsync、scp、ftp deploy 步驟

jobs:
  phpunit:
    name: PHPUnit Feature & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: AllTrue_test
          MYSQL_USER: admin
          MYSQL_PASSWORD: fLcLUu3Imi7RuFhT1jfwIH1
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo, pdo_mysql, bcmath, json, tokenizer, xml, ctype
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env for CI
        working-directory: backend
        run: |
          cp .env.example .env 2>/dev/null || touch .env
          # Override DB settings for CI (phpunit.xml already sets these, but ensure APP_KEY)
          php artisan key:generate --force

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -u admin -pfLcLUu3Imi7RuFhT1jfwIH1 --silent && break
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done

      - name: Run migrations on test DB
        working-directory: backend
        run: php artisan migrate --force --database=mysql
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: AllTrue_test
          DB_USERNAME: admin
          DB_PASSWORD: fLcLUu3Imi7RuFhT1jfwIH1

      - name: Run PHPUnit (with JUnit XML report)
        working-directory: backend
        run: |
          mkdir -p storage/test-results
          ./vendor/bin/phpunit --log-junit=storage/test-results/junit.xml
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: AllTrue_test
          DB_USERNAME: admin
          DB_PASSWORD: fLcLUu3Imi7RuFhT1jfwIH1
          APP_ENV: testing

      - name: Skipped test report
        if: always()
        working-directory: backend
        run: |
          XML=storage/test-results/junit.xml
          if [ ! -f "$XML" ]; then
            echo "JUnit XML not found — skipping report." && exit 0
          fi

          SKIPPED=$(python3 - <<'PYEOF'
          import xml.etree.ElementTree as ET, sys
          tree = ET.parse("storage/test-results/junit.xml")
          count = len(tree.findall(".//skipped"))
          print(count)
          PYEOF
          )

          echo "### 🧪 PHPUnit — Skipped Tests: ${SKIPPED}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${SKIPPED}" -gt "0" ]; then
            python3 - <<'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          tree = ET.parse("storage/test-results/junit.xml")
          rows = []
          for tc in tree.findall(".//testcase"):
              if tc.find("skipped") is not None:
                  rows.append(f"| `{tc.get('classname', '')}` | `{tc.get('name', '')}` |")
          if rows:
              print("\n| Class | Test |")
              print("|---|---|")
              for r in rows:
                  print(r)
          PYEOF
            echo "::warning::${SKIPPED} test(s) skipped. Review markTestSkipped() calls listed above."
          else
            echo "All tests passed with no skips. ✅" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: backend/storage/test-results/junit.xml
          if-no-files-found: warn

  vite-build:
    name: Vite Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Vite build
        working-directory: frontend
        run: npm run build

      - name: Verify dist output
        working-directory: frontend
        run: |
          test -f dist_build/index.html || (echo "❌ index.html missing from dist_build" && exit 1)
          echo "✅ dist_build/index.html exists"
          ls -lh dist_build/
