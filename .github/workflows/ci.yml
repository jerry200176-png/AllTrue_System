name: CI — PHPUnit Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# ⛔ 此 workflow 只跑測試，絕對不部署任何東西到生產環境
# ⛔ 禁止在此新增任何 ssh、rsync、scp、ftp deploy 步驟

jobs:
  phpunit:
    name: PHPUnit Feature & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: AllTrue_test
          MYSQL_USER: admin
          MYSQL_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo, pdo_mysql, bcmath, json, tokenizer, xml, ctype
          coverage: pcov

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Composer audit (security)
        working-directory: backend
        run: composer audit --no-dev 2>&1 | tee /tmp/composer-audit.txt; grep -q "No security vulnerability" /tmp/composer-audit.txt || echo "::warning::Composer audit 發現漏洞，請儘快更新依賴"

      - name: Copy .env for CI
        working-directory: backend
        run: |
          cp .env.example .env 2>/dev/null || touch .env
          # Override DB settings for CI (phpunit.xml already sets these, but ensure APP_KEY)
          php artisan key:generate --force

      - name: Wait for MySQL
        env:
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -u admin -p"$DB_PASSWORD" --silent && break
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done

      - name: Migration dry-run (pretend)
        working-directory: backend
        run: php artisan migrate --pretend --database=mysql 2>&1 | tee /tmp/migrate-pretend.txt; echo "✅ migrate --pretend 通過"
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: AllTrue_test
          DB_USERNAME: admin
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}

      - name: Run migrations on test DB
        working-directory: backend
        run: php artisan migrate --force --database=mysql
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: AllTrue_test
          DB_USERNAME: admin
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}

      - name: Run PHPUnit (with JUnit XML report)
        working-directory: backend
        run: |
          mkdir -p storage/test-results
          ./vendor/bin/phpunit \
            --coverage-text \
            --coverage-clover=storage/test-results/coverage.xml \
            --log-junit=storage/test-results/junit.xml
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: AllTrue_test
          DB_USERNAME: admin
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          APP_ENV: testing

      - name: Skipped test report
        if: always()
        working-directory: backend
        run: |
          XML=storage/test-results/junit.xml
          if [ ! -f "$XML" ]; then
            echo "JUnit XML not found — skipping report." && exit 0
          fi

          SKIPPED=$(python3 - <<'PYEOF'
          import xml.etree.ElementTree as ET, sys
          tree = ET.parse("storage/test-results/junit.xml")
          count = len(tree.findall(".//skipped"))
          print(count)
          PYEOF
          )

          echo "### 🧪 PHPUnit — Skipped Tests: ${SKIPPED}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${SKIPPED}" -gt "0" ]; then
            python3 - <<'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          tree = ET.parse("storage/test-results/junit.xml")
          rows = []
          for tc in tree.findall(".//testcase"):
              if tc.find("skipped") is not None:
                  rows.append(f"| `{tc.get('classname', '')}` | `{tc.get('name', '')}` |")
          if rows:
              print("\n| Class | Test |")
              print("|---|---|")
              for r in rows:
                  print(r)
          PYEOF
            echo "::warning::${SKIPPED} test(s) skipped. Review markTestSkipped() calls listed above."
          else
            echo "All tests passed with no skips. ✅" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Coverage summary + threshold gate
        if: always()
        working-directory: backend
        run: |
          XML=storage/test-results/coverage.xml
          if [ ! -f "$XML" ]; then echo "Coverage XML not found." && exit 0; fi
          python3 - <<'PYEOF'
          import xml.etree.ElementTree as ET, os, sys
          BLOCK_THRESHOLD = 60   # 低於此值直接擋 CI（目前 coverage ~64.6%，安全緩衝）
          WARN_THRESHOLD  = 70   # 低於此值警告（目標 80%）
          tree = ET.parse("storage/test-results/coverage.xml")
          metrics = tree.find(".//project/metrics")
          if metrics is None:
              print("No metrics found in coverage.xml.")
              sys.exit(0)
          stmts   = int(metrics.get("statements", 0))
          covered = int(metrics.get("coveredstatements", 0))
          pct     = round(covered / stmts * 100, 1) if stmts else 0.0
          if pct >= WARN_THRESHOLD:
              status = "✅"
          elif pct >= BLOCK_THRESHOLD:
              status = "⚠️"
          else:
              status = "❌"
          summary = f"### 📊 Coverage: {pct}% ({covered}/{stmts} statements) {status}"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary + "\n")
              if pct < WARN_THRESHOLD:
                  f.write(f"> {'❌' if pct < BLOCK_THRESHOLD else '⚠️'} Coverage {pct}% — block:{BLOCK_THRESHOLD}% / target:{WARN_THRESHOLD}%\n")
          with open("storage/test-results/coverage_summary.txt", "w") as f:
              f.write(summary + "\n")
          if pct < BLOCK_THRESHOLD:
              print(f"::error::Coverage {pct}% is below the {BLOCK_THRESHOLD}% minimum — add tests to unblock CI")
              sys.exit(1)
          elif pct < WARN_THRESHOLD:
              print(f"::warning::Coverage {pct}% is below the {WARN_THRESHOLD}% target")
          PYEOF

      - name: Generate API route documentation
        if: always()
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: AllTrue_test
          DB_USERNAME: admin
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: |
          # Laravel 8 用 text 格式（--json 是 L9+），存成 txt 再用 Python 轉 Markdown
          php artisan route:list 2>/dev/null > /tmp/routes.txt || true
          python3 - <<'PYEOF'
          import re, os

          try:
              with open("/tmp/routes.txt") as f:
                  raw = f.read()
          except Exception:
              raw = ""

          lines_out = ["# AllTrue API Route Reference",
                       "> Auto-generated by `php artisan route:list`", ""]
          lines_out += ["| Method | URI | Name |", "|--------|-----|------|"]
          count = 0
          for line in raw.splitlines():
              # artisan table rows look like: | GET|HEAD  | api/v1/me | me |
              m = re.match(r'\|\s*([\w|]+)\s*\|\s*(\S+)\s*\|\s*([\w./-]*)\s*\|', line)
              if m:
                  method = m.group(1).replace("|HEAD", "")
                  uri    = m.group(2)
                  name   = m.group(3) or "-"
                  lines_out.append(f"| `{method}` | `/{uri}` | {name} |")
                  count += 1

          md = "\n".join(lines_out)
          os.makedirs("storage/test-results", exist_ok=True)
          with open("storage/test-results/api-routes.md", "w") as f:
              f.write(md)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n\n" + "\n".join(lines_out[:25]) + "\n> ...see artifact for full list\n")
          print(f"✅ Generated API docs: {count} routes")
          PYEOF

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-test-results
          path: |
            backend/storage/test-results/junit.xml
            backend/storage/test-results/coverage.xml
            backend/storage/test-results/api-routes.md
          if-no-files-found: warn

  vite-build:
    name: Vite Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Vite build
        working-directory: frontend
        run: npm run build

      - name: Verify dist output
        working-directory: frontend
        run: |
          test -f dist_build/index.html || (echo "❌ index.html missing from dist_build" && exit 1)
          echo "✅ dist_build/index.html exists"
          ls -lh dist_build/

      - name: Bundle size budget
        working-directory: frontend
        run: |
          JS_SIZE=$(find dist_build/assets -name "*.js" ! -name "*.map" -exec wc -c {} + 2>/dev/null | tail -1 | awk '{print $1}')
          CSS_SIZE=$(find dist_build/assets -name "*.css" -exec wc -c {} + 2>/dev/null | tail -1 | awk '{print $1}')
          JS_KB=$((JS_SIZE / 1024))
          CSS_KB=$((CSS_SIZE / 1024))
          echo "### 📦 Bundle Size" >> "$GITHUB_STEP_SUMMARY"
          echo "| Asset | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| JS total | ${JS_KB} KB |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CSS total | ${CSS_KB} KB |" >> "$GITHUB_STEP_SUMMARY"
          echo "JS: ${JS_KB} KB, CSS: ${CSS_KB} KB"
          # 預算：JS > 800KB 或 CSS > 150KB 發出警告（不擋 CI）
          [ "$JS_KB" -gt 800 ] && echo "::warning::JS bundle ${JS_KB} KB 超過 800 KB 預算，考慮 code splitting"
          [ "$CSS_KB" -gt 150 ] && echo "::warning::CSS bundle ${CSS_KB} KB 超過 150 KB 預算"
          exit 0

      - name: npm audit (security)
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev || echo "::warning::npm audit 發現 high+ 漏洞，請儘快更新依賴"
