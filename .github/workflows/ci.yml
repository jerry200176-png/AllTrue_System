name: CI — PHPUnit Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "land-queue: PR number whose head this run checks (guarded: head must equal github.sha, base main)"
        required: false
        default: ""

# ⛔ 此 workflow 只跑測試，絕對不部署任何東西到生產環境
# ⛔ 禁止在此新增任何 ssh、rsync、scp、ftp deploy 步驟

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # Contract I1–I5 gate — must pass before any test/build job (deploy triggers on this workflow).
  control_plane:
    name: Control Plane Contract Lint
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: PR dispatch guard (fail closed)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          read -r head base state < <(gh api "/repos/$REPO/pulls/$PR_NUMBER" --jq '[.head.sha,.base.ref,.state]|join(" ")')
          [ "$head" = "$GITHUB_SHA" ] && [ "$base" = main ] && [ "$state" = open ] \
            || { echo "::error::pr_number $PR_NUMBER is not an open PR to main with head $GITHUB_SHA"; exit 1; }
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Record actual runner core rate limit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          timeout --kill-after=5s 15s gh api /rate_limit --jq '.resources.core | {limit, remaining, used, reset}' > "$RUNNER_TEMP/metadata-core-rate.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.governance.gh_conditional_transport import core_rate_evidence
          evidence = core_rate_evidence(json.loads((Path(os.environ["RUNNER_TEMP"]) / "metadata-core-rate.json").read_text()))
          print(f"::notice title=Actual Actions caller quota::core_limit={evidence['limit']} remaining={evidence['remaining']} used={evidence['used']} reset={evidence['reset']}; caller=GITHUB_TOKEN; not a full-history benchmark")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("Actual Actions GITHUB_TOKEN core quota: " + json.dumps(evidence) + "\n")
          PY

      - name: Validate GitHub Actions workflows with pinned actionlint
        run: |
          # Full-repository parser/expression lint is bounded and does not invoke
          # shellcheck; the canonical production workflow gets the complete check below.
          timeout 60s bash scripts/ci/actionlint.sh --parser-only
          timeout 60s bash scripts/ci/actionlint.sh .github/workflows/calendar-course-acceptance.yml

      - name: Run control plane lint
        env:
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
          CONTRACT_CHANGE: ${{ contains(github.event.pull_request.title, '[contract-change]') && '1' || '' }}
        run: |
          node scripts/control-plane-lint.mjs
          node scripts/ci-cost-guard.mjs
          node scripts/ci-cost-guard.mjs --self-test
          node scripts/ci/bug-writeback-workflow.test.mjs
          node scripts/ci/bug-auto-intake-family.test.mjs
          node scripts/ci/bug-reporter-timeout-workflow.test.mjs
          node scripts/ci/bug-sla-weekly-workflow.test.mjs
          node scripts/ci/rootfam-backfill.test.mjs
          node scripts/ci/staff-identity-merge-workflow.test.mjs
          node scripts/ci/inapp-product-loop-entry.test.mjs
          node scripts/ci/staff-multirole-activation-workflow.test.mjs
          node scripts/ci/agreed-fee-allowlist-activation-workflow.test.mjs
          # #4135 / #1387: required CI must enforce workflow secret-echo (gitleaks-style fail-closed).
          # Already in `npm run test:gov`; without this step, main CI never ran the guard.
          node scripts/ci/workflow-secret-echo.test.mjs
          node --test scripts/ci/production-secret-triggers.test.mjs
          node --test scripts/ci/production-ssh-environment.test.mjs
          # #5201 row 26: approval references and pop-* file names use ids, never a person's name (control-plane-lint P3).
          node --test scripts/ci/workflow-id-only-references.test.mjs
          node --test scripts/tests/register-synthetic-director.test.mjs
          node --test scripts/tests/task-reconcile.test.mjs
          node --test scripts/tests/land-queue.test.mjs scripts/tests/pr-overlap.test.mjs scripts/tests/land-queue-dispatch-contract.test.mjs
          node --test scripts/tests/repo-hygiene.test.mjs
          node --test scripts/tests/actions-cost-report.test.mjs
          node --test scripts/tests/autoland.test.mjs scripts/tests/docs-section.test.mjs scripts/tests/mutation-comment.test.mjs scripts/tests/phpunit-random-nightly.test.mjs
          python3 -m venv "$RUNNER_TEMP/credential-expiry-test-venv"
          "$RUNNER_TEMP/credential-expiry-test-venv/bin/python" -m pip install --disable-pip-version-check -r scripts/requirements-credential-expiry.txt
          "$RUNNER_TEMP/credential-expiry-test-venv/bin/python" -m unittest scripts.tests.test_credential_expiry
          node scripts/governance/check-production-workflow-inventory.mjs
          python3 scripts/ci/workflow_expression_size.py
          bash scripts/tests/production-acceptance-stage-contract.test.sh
          bash scripts/tests/verify-db-backup.test.sh
          bash scripts/tests/acceptance-login-contract.test.sh
          bash scripts/tests/synthetic-director-workflow-contract.test.sh
          bash scripts/tests/install-playwright-chromium.test.sh

      - name: Test control plane lint catches violations
        run: |
          set +e
          node scripts/control-plane-lint.mjs --self-test
          status=$?
          set -e
          test "$status" -eq 1

      - name: Test credential fingerprint audit
        run: python3 scripts/credential-fingerprint-audit.test.py

      # #5201: every scripts/tests/test_*.py runs here by discovery, not from a hand-kept list (a file missing
      # from the list was never run and went stale). scripts/tests/test_script_tests_run_in_ci.py fails when a
      # script test is neither collected here nor run by a workflow command. Synthetic data only: no secret, no host.
      - name: Script tests (all of scripts/tests by discovery)
        run: |
          set -euo pipefail
          # Tests that render and execute probe PHP or exercise encryption must not skip for a missing tool.
          for tool in php openssl jq; do command -v "$tool" >/dev/null || { echo "::error::$tool is missing on the runner"; exit 1; }; done
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Test permanent write-back cursor
        run: python3 -m unittest discover -s scripts/bug-writeback -p 'test_writeback_cursor.py'

      - name: In-app ↔ issue reconcile tests (F14)
        run: python3 scripts/tests/test_inapp_issue_reconcile.py

      - name: Test production SSH host trust contract
        run: bash scripts/tests/production-ssh-trust.test.sh

      # #4312: atomic POP mount stage + guard --self-test (fail paths keep LIVE contents/owner/mode)
      - name: Test POP mount atomic stage and remote guards
        run: bash scripts/pop-mount-atomic-stage.test.sh

      - name: Test deploy storage permissions keep storage/app/private restricted
        run: bash scripts/tests/deploy-storage-perms.test.sh

      - name: Test bundle budget chunk classification (#1273)
        run: node --test scripts/bundle-budget.test.mjs

  changes:
    name: Detect changed areas
    needs: control_plane
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ci_config: ${{ steps.filter.outputs.ci_config }}
      ui_foundation: ${{ steps.filter.outputs.ui_foundation }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # paths-filter fetches the previous SHA for push events. Keep the
          # existing contents:read token available for that read-only fetch.
          persist-credentials: true

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            ci_config:
              - '.github/workflows/**'
            # Every frontend change runs the whole UI foundation suite (~5-6 min). The old hand-written page list
            # missed ParttimePayroll*, so #4979 merged with a broken payroll spec and main went red (fixed by #4999).
            ui_foundation:
              - 'frontend/**'
              - 'backend/tests/Fixtures/slip_receipt_states_3894.json'
              - 'scripts/check-no-public-ui-fixtures.sh'

  # Visual regression (#4952). ADVISORY: not in the required-check ruleset (adding it needs a ruleset change by Jerry).
  # Runs scripts/visual-docker.sh, which picks the mcr.microsoft.com/playwright image matching package-lock.
  visual_regression:
    name: Visual regression (advisory)
    needs: changes
    # Advisory: a red job here must not turn the CI workflow red (deploy.yml requires CI success).
    continue-on-error: true
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Visual regression in Playwright image
        run: |
          bash scripts/visual-docker.sh || { echo "::error::Visual diff. If the change is intended, run 'npm run test:visual:update' in frontend/ (Docker) and commit frontend/e2e/__screenshots__; a reviewer must look at the PNG diff."; exit 1; }

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-diffs
          path: frontend/test-results-visual/
          if-no-files-found: warn
          retention-days: 14

  # PR diff → Golden § 對照表（全自動；取代人工勾選 QA_GOLDEN_SCENARIOS）
  golden_scenarios:
    name: Golden scenarios report
    needs: changes
    # land-queue batch branches are dispatched without pr_number (no PR) but must still produce this required context.
    if: github.event_name == 'pull_request' || inputs.pr_number != '' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/chore/land-queue-batch-'))
    # Current topology: GitHub-hosted. See docs/REF_CI_RUNNER_TOPOLOGY.md.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: PR dispatch guard (fail closed)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          read -r head base state < <(gh api "/repos/$REPO/pulls/$PR_NUMBER" --jq '[.head.sha,.base.ref,.state]|join(" ")')
          [ "$head" = "$GITHUB_SHA" ] && [ "$base" = main ] && [ "$state" = open ] \
            || { echo "::error::pr_number $PR_NUMBER is not an open PR to main with head $GITHUB_SHA"; exit 1; }
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch main for diff range
        run: git fetch origin main --depth=128 || true
      - name: Path → § traceability report
        env:
          GOLDEN_BASE_REF: origin/main
          GOLDEN_HEAD_REF: HEAD
        run: |
          chmod +x .github/scripts/golden-ci-report.sh
          ./.github/scripts/golden-ci-report.sh

  # Shard jobs (not required checks themselves): the required `PHPUnit Feature & Unit Tests`
  # check is the `phpunit` aggregator below. Round-robin split of the sorted test files.
  phpunit_shard:
    name: PHPUnit shard
    needs: changes
    # Never path-skipped: the aggregator requires every shard to be green.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Non-sensitive password for the ephemeral CI-only MySQL service.
    env:
      DB_PASSWORD: ci-ephemeral

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: AllTrue_test
          MYSQL_USER: admin
          # Deliberately non-sensitive and CI-only; never reuse outside ephemeral tests.
          MYSQL_PASSWORD: ci-ephemeral
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.2"
          extensions: mbstring, pdo, pdo_mysql, bcmath, json, tokenizer, xml, ctype, pcov
          coverage: pcov

      - name: Verify local PHP runtime
        run: |
          php -v
          php -m | php -r '
            $mods = array_map("strtolower", array_filter(array_map("trim", explode("\n", stream_get_contents(STDIN)))));
            $required = ["mbstring","pdo","pdo_mysql","bcmath","json","tokenizer","xml","ctype","pcov"];
            $missing = array_values(array_diff($required, $mods));
            if ($missing) {
              fwrite(STDERR, "Missing PHP extensions: " . implode(", ", $missing) . PHP_EOL);
              exit(1);
            }
          '

      # DB_PASSWORD is provided by the job-level CI-only environment above.

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Verify generated API route reference
        if: matrix.shard == 1
        run: bash scripts/generate-ref-api-routes.sh --check

      - name: Verify Composer audit parser
        if: matrix.shard == 1
        run: python3 scripts/tests/test_composer_audit_shape.py

      - name: Composer audit (security)
        if: matrix.shard == 1
        working-directory: backend
        run: |
          # 只在 HIGH / CRITICAL 才擋 CI；MEDIUM 印警告
          composer audit --no-dev --format=json 2>/dev/null > /tmp/composer-audit.json || true
          python3 - <<'PYEOF'
          import json, sys, os
          try:
              data = json.load(open("/tmp/composer-audit.json"))
          except Exception:
              print("::warning::composer audit JSON parse failed — skipping")
              sys.exit(0)
          def normalize_advisories(group):
              if isinstance(group, list):
                  return group
              if isinstance(group, dict) and "severity" in group:
                  return [group]
              if isinstance(group, dict):
                  return list(group.values())
              return []

          advisories = data.get("advisories", {})
          # Composer emits [] rather than {} when there are no advisories.
          # Package iteration below is intentionally map-only so that an
          # empty successful audit remains a successful audit.
          if not isinstance(advisories, dict):
              advisories = {}
          ignored_advisories = data.get("ignored-advisories", {})
          if not isinstance(ignored_advisories, dict):
              ignored_advisories = {}
          has_high = False
          for pkg, adv_list in advisories.items():
              for adv in normalize_advisories(adv_list):
                  if not isinstance(adv, dict):
                      continue
                  sev = str(adv.get("severity", "")).lower()
                  title = adv.get("title", "?")
                  if sev in ("high", "critical"):
                      print(f"::error::{pkg}: [{sev.upper()}] {title}")
                      has_high = True
                  else:
                      print(f"::warning::{pkg}: [{sev}] {title}")
          for pkg, adv_list in ignored_advisories.items():
              for adv in normalize_advisories(adv_list):
                  if not isinstance(adv, dict):
                      continue
                  sev = str(adv.get("severity", "unknown")).upper()
                  title = adv.get("title", "?")
                  reason = adv.get("ignoreReason", "No reason recorded")
                  print(f"::notice::{pkg}: [{sev}] accepted risk: {title} — {reason}")
          if has_high:
              print("::error::Composer audit: HIGH/CRITICAL 漏洞必須修復才能 merge")
              sys.exit(1)
          elif advisories:
              print("::warning::Composer audit: 發現 MEDIUM/LOW 漏洞，請儘快更新依賴")
          else:
              print("✅ Composer audit: 無已知漏洞")
          PYEOF

      - name: Copy .env for CI
        working-directory: backend
        run: |
          cp .env.example .env 2>/dev/null || touch .env
          # Override DB settings for CI (phpunit.xml already sets these, but ensure APP_KEY)
          php artisan key:generate --force

      - name: Install MySQL client
        run: |
          # Probe first: runner images already ship mysql / mysqladmin. Running
          # `apt-get install mysql-client` after `apt-get update` upgrades the image's whole
          # MySQL package set, including mysql-server, whose post-install step fails on the
          # runner and reds every PHPUnit shard before a single test runs (2026-11-12, #5201 row 21).
          if command -v mysql >/dev/null 2>&1 && command -v mysqladmin >/dev/null 2>&1; then
            echo "mysql client already on the runner: $(mysql --version)"
            exit 0
          fi
          # Runner images ship a Google Chrome apt source that periodically 502/hash-mismatches
          # and fails unrelated apt-get update (blocks PHPUnit). Drop every dl.google.com chrome
          # entry (.list / .sources / fragments) before installing the client.
          sudo find /etc/apt -type f -exec grep -l 'dl.google.com/linux/chrome' {} + 2>/dev/null | sudo xargs -r rm -f || true
          sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/*chrome* || true
          sudo rm -rf /var/lib/apt/lists/partial /var/lib/apt/lists/*chrome* || true
          sudo apt-get update -y || sudo apt-get update -y --allow-releaseinfo-change || true
          # Client only: never pull or upgrade the server package (the DB is the service container).
          sudo apt-get install -y --no-install-recommends mysql-client
          command -v mysql >/dev/null && command -v mysqladmin >/dev/null

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -u admin -p"$DB_PASSWORD" --silent && break
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done
          mysql -h 127.0.0.1 -u admin -p"$DB_PASSWORD" \
            -e "CREATE DATABASE IF NOT EXISTS AllTrue_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Grant per-worker test DB rights (parallel PHPUnit)
        run: |
          mysql -h 127.0.0.1 -u root -proot \
            -e "GRANT ALL PRIVILEGES ON \`AllTrue\_test%\`.* TO 'admin'@'%'; FLUSH PRIVILEGES;"

      - name: Migration dry-run (pretend)
        working-directory: backend
        run: php artisan migrate --pretend --database=mysql 2>&1 | tee /tmp/migrate-pretend.txt; echo "✅ migrate --pretend 通過"
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: AllTrue_test
          DB_USERNAME: admin

      - name: Run migrations on test DB
        working-directory: backend
        run: php artisan migrate --force --database=mysql
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: AllTrue_test
          DB_USERNAME: admin

      - name: Build this shard's phpunit config (sorted files, round-robin)
        working-directory: backend
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python3 - <<'PYEOF'
          import os, pathlib, re
          files = sorted(str(p) for d in ("tests/Unit", "tests/Feature") for p in pathlib.Path(d).rglob("*Test.php"))
          # ponytail: the three ~4 min concurrency files go first so round-robin puts one per shard; re-measure if shards drift.
          heavy = [f"tests/Feature/{n}Test.php" for n in ("Billing/AgreedFeeConcurrency", "Billing/InvoiceCorrectionReissue", "InvoiceVoidSerialization")]
          assert all(h in files for h in heavy), heavy
          files = heavy + [f for f in files if f not in heavy]
          mine = files[int(os.environ["SHARD"]) - 1::3]
          suite = "<testsuites><testsuite name=\"Shard\">" + "".join(f"<file>./{f}</file>" for f in mine) + "</testsuite></testsuites>"
          xml = re.sub(r"<testsuites>.*?</testsuites>", lambda _: suite, open("phpunit.xml").read(), flags=re.S)
          open("phpunit.shard.xml", "w").write(xml)
          print(f"shard {os.environ['SHARD']}: {len(mine)} of {len(files)} test files")
          PYEOF

      - name: Run PHPUnit shard (JUnit + PHP coverage)
        working-directory: backend
        run: |
          mkdir -p storage/test-results
          # #4945: parallel via paratest + Laravel's ParallelRunner (one DB per worker:
          # AllTrue_test_test_N, created by the GRANT step above). The repo's own
          # `artisan test` wrapper is not parallel-aware, so call paratest directly.
          LARAVEL_PARALLEL_TESTING=1 ./vendor/bin/paratest \
            --configuration=phpunit.shard.xml \
            --runner='\Illuminate\Testing\ParallelRunner' \
            --processes=4 \
            --cache-directory=storage/framework/phpunit-cache \
            --coverage-php=storage/test-results/coverage-${{ matrix.shard }}.cov \
            --log-junit=storage/test-results/junit-${{ matrix.shard }}.xml
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: AllTrue_test
          DB_USERNAME: admin
          APP_ENV: testing

      - name: Generate API route documentation
        if: always() && matrix.shard == 1
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: AllTrue_test
          DB_USERNAME: admin
        run: |
          # Laravel 8 用 text 格式（--json 是 L9+），存成 txt 再用 Python 轉 Markdown
          php artisan route:list 2>/dev/null > /tmp/routes.txt || true
          python3 - <<'PYEOF'
          import re, os

          try:
              with open("/tmp/routes.txt") as f:
                  raw = f.read()
          except Exception:
              raw = ""

          lines_out = ["# AllTrue API Route Reference",
                       "> Auto-generated by `php artisan route:list`", ""]
          lines_out += ["| Method | URI | Name |", "|--------|-----|------|"]
          count = 0
          for line in raw.splitlines():
              # artisan table rows look like: | GET|HEAD  | api/v1/me | me |
              m = re.match(r'\|\s*([\w|]+)\s*\|\s*(\S+)\s*\|\s*([\w./-]*)\s*\|', line)
              if m:
                  method = m.group(1).replace("|HEAD", "")
                  uri    = m.group(2)
                  name   = m.group(3) or "-"
                  lines_out.append(f"| `{method}` | `/{uri}` | {name} |")
                  count += 1

          md = "\n".join(lines_out)
          os.makedirs("storage/test-results", exist_ok=True)
          with open("storage/test-results/api-routes.md", "w") as f:
              f.write(md)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n\n" + "\n".join(lines_out[:25]) + "\n> ...see artifact for full list\n")
          print(f"✅ Generated API docs: {count} routes")
          PYEOF

      - name: Frontend/backend API route contract (advisory)
        if: always() && matrix.shard == 1
        run: node scripts/ci/check-frontend-api-routes.mjs

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phpunit-shard-${{ matrix.shard }}
          path: |
            backend/storage/test-results/junit-${{ matrix.shard }}.xml
            backend/storage/test-results/coverage-${{ matrix.shard }}.cov
            backend/storage/test-results/api-routes.md
          retention-days: 3
          if-no-files-found: warn

  # REQUIRED CHECK `PHPUnit Feature & Unit Tests` (exact name; ruleset-required). Aggregates the shards:
  # merges their coverage, runs the skipped report + coverage gate, and fails unless EVERY shard
  # succeeded (skipped/cancelled/failed all fail). Never synthesize a pass.
  phpunit:
    name: PHPUnit Feature & Unit Tests
    needs: phpunit_shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.2"
          extensions: mbstring, pdo, pdo_mysql, bcmath, json, tokenizer, xml, ctype
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Download shard results
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: phpunit-shard-*
          merge-multiple: true
          path: backend/storage/test-results

      - name: Merge shard coverage into coverage.xml (phpcov)
        if: needs.phpunit_shard.result == 'success'
        working-directory: backend
        run: |
          mkdir -p storage/test-results/cov
          mv storage/test-results/coverage-*.cov storage/test-results/cov/
          php -d memory_limit=-1 ./vendor/bin/phpcov merge --clover storage/test-results/coverage.xml storage/test-results/cov

      - name: Skipped test report
        if: always()
        working-directory: backend
        run: |
          XML=$(ls storage/test-results/junit-*.xml 2>/dev/null | head -1)
          if [ -z "$XML" ]; then
            echo "JUnit XML not found — skipping report." && exit 0
          fi

          SKIPPED=$(python3 - <<'PYEOF'
          import glob, xml.etree.ElementTree as ET
          print(sum(len(ET.parse(f).findall(".//skipped")) for f in glob.glob("storage/test-results/junit-*.xml")))
          PYEOF
          )
          TOTAL=$(python3 - <<'PYEOF'
          import glob, xml.etree.ElementTree as ET
          print(sum(len(ET.parse(f).findall(".//testcase")) for f in glob.glob("storage/test-results/junit-*.xml")))
          PYEOF
          )

          echo "### 🧪 PHPUnit — ${TOTAL} tests, Skipped: ${SKIPPED}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${SKIPPED}" -gt "0" ]; then
            python3 - <<'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          rows = []
          for f in sorted(glob.glob("storage/test-results/junit-*.xml")):
              for tc in ET.parse(f).findall(".//testcase"):
                  if tc.find("skipped") is not None:
                      rows.append(f"| `{tc.get('classname', '')}` | `{tc.get('name', '')}` |")
          if rows:
              print("\n| Class | Test |")
              print("|---|---|")
              for r in rows:
                  print(r)
          PYEOF
            echo "::warning::${SKIPPED} test(s) skipped. Review markTestSkipped() calls listed above."
          else
            echo "All tests passed with no skips. ✅" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Coverage summary + threshold gate
        if: always()
        working-directory: backend
        run: |
          XML=storage/test-results/coverage.xml
          if [ ! -f "$XML" ]; then echo "Coverage XML not found." && exit 0; fi
          python3 - <<'PYEOF'
          import xml.etree.ElementTree as ET, os, sys
          BLOCK_THRESHOLD = 60   # 低於此值直接擋 CI（目前 coverage ~64.6%，安全緩衝）
          WARN_THRESHOLD  = 70   # 低於此值警告（目標 80%）
          tree = ET.parse("storage/test-results/coverage.xml")
          metrics = tree.find(".//project/metrics")
          if metrics is None:
              print("No metrics found in coverage.xml.")
              sys.exit(0)
          stmts   = int(metrics.get("statements", 0))
          covered = int(metrics.get("coveredstatements", 0))
          pct     = round(covered / stmts * 100, 1) if stmts else 0.0
          if pct >= WARN_THRESHOLD:
              status = "✅"
          elif pct >= BLOCK_THRESHOLD:
              status = "⚠️"
          else:
              status = "❌"
          summary = f"### 📊 Coverage: {pct}% ({covered}/{stmts} statements) {status}"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary + "\n")
              if pct < WARN_THRESHOLD:
                  f.write(f"> {'❌' if pct < BLOCK_THRESHOLD else '⚠️'} Coverage {pct}% — block:{BLOCK_THRESHOLD}% / target:{WARN_THRESHOLD}%\n")
          with open("storage/test-results/coverage_summary.txt", "w") as f:
              f.write(summary + "\n")
          if pct < BLOCK_THRESHOLD:
              print(f"::error::Coverage {pct}% is below the {BLOCK_THRESHOLD}% minimum — add tests to unblock CI")
              sys.exit(1)
          elif pct < WARN_THRESHOLD:
              print(f"::warning::Coverage {pct}% is below the {WARN_THRESHOLD}% target")
          PYEOF

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-test-results
          path: |
            backend/storage/test-results/junit-*.xml
            backend/storage/test-results/coverage.xml
            backend/storage/test-results/api-routes.md
          if-no-files-found: warn

      - name: Require every PHPUnit shard to be green
        if: always()
        env:
          SHARDS: ${{ needs.phpunit_shard.result }}
        run: |
          [ "$SHARDS" = "success" ] || { echo "::error::PHPUnit shards result: $SHARDS"; exit 1; }

  # Build, Vitest and the other gates. Page-level Playwright runs in `ui_foundation_e2e` (sharded);
  # the required `Vite Frontend Build` check is the `vite-build` aggregator below.
  vite_core:
    name: Vite core (build, Vitest, gates)
    needs: changes
    # This is a required main-branch check.  Run it for every PR so a
    # backend-only change reports success instead of a skipped required check.
    # The frontend tests remain read-only and do not deploy anything.
    runs-on: ubuntu-latest
    # npm ci can take ~9 minutes on the hosted runner before the blocking
    # audit/build steps begin; keep the security gate intact while allowing
    # the job enough wall-clock time to finish.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned npm CLI for security audit
        run: npm install --global npm@11.19.1 --no-audit --no-fund

      - name: Verify npm CLI
        run: npm --version

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate in-app release notes (git-ignored; legacy files + docs/*-updates fragments)
        working-directory: frontend
        run: npm run sync-release-notes

      - name: Calendar occurrence regression tests
        working-directory: frontend
        run: npm run test:calendar

      - name: Release notes visibility regression
        working-directory: frontend
        run: npm run test:release-notes

      - name: Teacher login streak (pure logic)
        working-directory: frontend
        run: npm run test:teacher-streak

      - name: Engagement rank progress (pure logic)
        working-directory: frontend
        run: npm run test:engagement-progress

      - name: Exception workflow focus reconciliation (pure logic, GitHub #1625)
        working-directory: frontend
        run: npm run test:exception-workflow-focus

      - name: "All plain-node frontend tests (node --test; guard fails on any test file that never runs, W14)"
        working-directory: frontend
        run: npm run test:lib-node

      - name: "Component unit tests + coverage gate (Vitest, #731)"
        working-directory: frontend
        run: npm run test:unit:cov

      - name: "Coverage report → step summary (#731)"
        if: always()
        working-directory: frontend
        shell: bash
        run: |
          SUMMARY="coverage/unit/coverage-summary.json"
          if [ ! -f "$SUMMARY" ]; then
            echo "::warning::Coverage summary not found"
            exit 0
          fi
          python3 ../scripts/coverage-step-summary.py "$SUMMARY"

      - name: Upload coverage report (#731)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-unit-coverage
          path: frontend/coverage/unit/
          retention-days: 14
          if-no-files-found: warn


      - name: "Design hex delta metric (PR annotation)"
        working-directory: frontend
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          COUNT=$(npm run --silent metrics:design-hex 2>/dev/null | node -e "let d='';process.stdin.on("data",c=>d+=c).on("end",()=>{try{const j=JSON.parse(d);console.log(j.pages_total+j.components_total)}catch{console.log(0)}})" 2>/dev/null || echo 0)
          echo "metrics:design-hex total=${COUNT}" >> $GITHUB_STEP_SUMMARY
          echo "::notice title=Design Hex Count::Total raw-hex usages: ${COUNT} (新增任何 raw hex 將被下一個步驟 block)"

      - name: "Design raw-hex guard (blocking, #689/#737)"
        working-directory: frontend
        # SEC: advisory → blocking (#737). Fails if any .vue file has MORE raw hex than baseline.
        # To update baseline after intentional cleanup: bash scripts/design-hex-count.sh > docs/design-hex-baseline.json
        run: npm run lint:design

      - name: Unhandled child-emit guard (silent dead UI, G2)
        run: |
          node --test scripts/ci/check-unhandled-emits.test.mjs
          node scripts/ci/check-unhandled-emits.mjs

      - name: Vite build
        working-directory: frontend
        run: npm run build

      - name: Verify dist output
        working-directory: frontend
        run: |
          test -f dist_build/index.html || (echo "❌ index.html missing from dist_build" && exit 1)
          echo "✅ dist_build/index.html exists"
          ls -lh dist_build/
          # Production bundle must never ship UI foundation fixtures
          npm run lint:ui-fixtures
          ! test -f dist_build/ui-foundation-harness.html
          ! test -f dist_build/ui-foundation-harness-before.html
          ! test -f dist_build/pilot-mount.html

      - name: Bundle size budget
        # #1273: route-aware — reports/budgets initial vs. largest-lazy-route
        # vs. total separately instead of comparing the noisy all-routes CSS
        # aggregate against an initial-load budget. See scripts/bundle-budget.mjs.
        run: node scripts/bundle-budget.mjs frontend/dist_build/assets

      - name: npm audit (security)
        working-directory: frontend
        # Keep the required audit gate intact while bounding registry stalls
        # so one hung request cannot consume the whole build job timeout.
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          # Let the outer loop own retries so each network timeout is visible
          # and bounded instead of multiplying npm's internal retries.
          NPM_CONFIG_FETCH_RETRIES: 0
          NPM_CONFIG_FETCH_RETRY_FACTOR: 2
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 1000
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 30000
          NPM_CONFIG_FETCH_TIMEOUT: 30000
        run: |
          set -o pipefail
          audit_log="${RUNNER_TEMP}/npm-audit.log"
          audit_evidence="${RUNNER_TEMP}/npm-audit-degraded.json"
          : > "$audit_log"

          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            echo "npm audit attempt ${attempt}/${max_attempts}"
            if timeout --signal=TERM --kill-after=15s 120s npm audit --audit-level=high --omit=dev 2>&1 | tee -a "$audit_log"; then
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "npm audit attempt ${attempt} failed; retrying"
              sleep $((attempt * 15))
            fi
          done

          # A registry timeout/5xx is observable infrastructure evidence, not
          # a security pass. Preserve the required gate as failed and publish
          # a machine-readable record so a later rerun can verify recovery.
          if grep -Eiq 'network timeout|ETIMEDOUT|ECONNRESET|ENETUNREACH|EAI_AGAIN|HTTP 5[0-9]{2}' "$audit_log" \
            && ! grep -Eiq 'HTTP 4[0-9]{2}|Invalid package tree|Severity: (high|critical)|[0-9]+ (high|critical) severity|found [1-9][0-9]* vulnerabilities' "$audit_log"; then
            {
              echo '{'
              echo '  "classification": "AUDIT_SERVICE_UNAVAILABLE",'
              echo '  "required_gate": "BLOCKED",'
              echo '  "vulnerability_finding": false,'
              printf '  "workflow_run": "%s",\n' "$GITHUB_RUN_ID"
              printf '  "commit": "%s",\n' "$GITHUB_SHA"
              echo '  "endpoint": "https://registry.npmjs.org/-/npm/v1/security/advisories/bulk",'
              printf '  "attempts": %s\n' "$max_attempts"
              echo '}'
            } > "$audit_evidence"
            {
              echo '### npm audit degraded evidence'
              echo ''
              echo '- Classification: `AUDIT_SERVICE_UNAVAILABLE`'
              echo '- Required gate: `BLOCKED` (this is not a pass)'
              echo '- Vulnerability finding: none observed in the captured output'
              echo '- Recovery action: rerun the required audit after the registry endpoint recovers'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::npm audit service/network unavailable after ${max_attempts} bounded attempts; required security gate remains blocking"
            exit 1
          fi

          echo "npm audit failed after ${max_attempts} attempts"
          exit 1

      - name: Upload npm audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit-evidence
          path: |
            ${{ runner.temp }}/npm-audit.log
            ${{ runner.temp }}/npm-audit-degraded.json
          if-no-files-found: ignore

  # Path-scoped: Chromium + real Vue page evidence only when UI foundation
  # surfaces/fixtures/config change. Still blocking when the filter matches.
  ui_foundation_e2e:
    name: UI foundation Playwright
    needs: changes
    if: needs.changes.outputs.ui_foundation == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    # Browsers + system deps are baked in; the tag must equal @playwright/test in frontend/package-lock.json.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate in-app release notes (git-ignored; legacy files + docs/*-updates fragments)
        working-directory: frontend
        run: npm run sync-release-notes

      - name: UI foundation page-level Playwright (real Vue + mocked API)
        working-directory: frontend
        env:
          UI_FOUNDATION_SHOT_DIR: ${{ github.workspace }}/docs/design/evidence/raw
        run: npm run test:e2e:ui-foundation -- --shard=${{ matrix.shard }}/2

      - name: Upload UI foundation visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-foundation-page-evidence-${{ matrix.shard }}
          path: docs/design/evidence/
          if-no-files-found: warn
          retention-days: 30

  # REQUIRED CHECK `Vite Frontend Build` (exact name; ruleset-required). Fails unless the core job
  # succeeded and the Playwright shards succeeded (they may be skipped ONLY when the ui_foundation
  # path filter is false). Never synthesize a pass.
  vite-build:
    name: Vite Frontend Build
    needs: [changes, vite_core, ui_foundation_e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require core and Playwright shards to be green
        env:
          CORE: ${{ needs.vite_core.result }}
          E2E: ${{ needs.ui_foundation_e2e.result }}
          NEEDS_E2E: ${{ needs.changes.outputs.ui_foundation }}
        run: |
          [ "$CORE" = "success" ] || { echo "::error::vite_core result: $CORE"; exit 1; }
          if [ "$NEEDS_E2E" = "true" ]; then
            [ "$E2E" = "success" ] || { echo "::error::ui_foundation_e2e result: $E2E"; exit 1; }
          else
            [ "$E2E" = "skipped" ] || { echo "::error::ui_foundation_e2e result: $E2E"; exit 1; }
          fi

  # Advisory only (never a required check): UI "AI-feel" regressions + dead code.
  # impeccable fails only on findings absent from scripts/design/impeccable-baseline.json;
  # knip is report-only. Versions pinned (>=14 days old); not added to package.json.
  design-advisory:
    name: Design and dead-code advisory
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Install frontend dependencies (knip needs them to resolve imports)
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: impeccable annotations (pinned 4.6.0)
        continue-on-error: true
        run: npx -y impeccable@4.6.0 detect --github frontend/src

      - name: impeccable new findings vs committed baseline
        run: node scripts/design/impeccable-baseline.mjs check

      # UI/UX #4659 Q6: payment-area status labels of 6 characters or fewer. Warns only (always exit 0).
      - name: status label length (payment area, advisory)
        run: node scripts/design/status-label-length.mjs

      - name: knip report (pinned 6.41.0, report only)
        if: always()
        working-directory: frontend
        run: npx -y knip@6.41.0 --no-exit-code || true
