name: CI — PHPUnit Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# ⛔ 此 workflow 只跑測試，絕對不部署任何東西到生產環境
# ⛔ 禁止在此新增任何 ssh、rsync、scp、ftp deploy 步驟

jobs:
  phpunit:
    name: PHPUnit Feature & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: AllTrue_test
          MYSQL_USER: admin
          MYSQL_PASSWORD: fLcLUu3Imi7RuFhT1jfwIH1
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo, pdo_mysql, bcmath, json, tokenizer, xml, ctype
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env for CI
        working-directory: backend
        run: |
          cp .env.example .env 2>/dev/null || touch .env
          # Override DB settings for CI (phpunit.xml already sets these, but ensure APP_KEY)
          php artisan key:generate --force

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -u admin -pfLcLUu3Imi7RuFhT1jfwIH1 --silent && break
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done

      - name: Run migrations on test DB
        working-directory: backend
        run: php artisan migrate --force --database=mysql
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: AllTrue_test
          DB_USERNAME: admin
          DB_PASSWORD: fLcLUu3Imi7RuFhT1jfwIH1

      - name: Run PHPUnit
        working-directory: backend
        run: php artisan test --parallel --stop-on-failure
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: AllTrue_test
          DB_USERNAME: admin
          DB_PASSWORD: fLcLUu3Imi7RuFhT1jfwIH1
          APP_ENV: testing
