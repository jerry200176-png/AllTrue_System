name: Secret Rotation 90-day Reminder

on:
  # Workflow-file changes currently create push runs. Give those runs an
  # explicit validation job so GitHub does not report a misleading
  # "No jobs were run" failure.
  push:
    paths:
      - .github/workflows/secret-rotation-reminder.yml
  schedule:
    # 1st of every quarter-adjacent month at 16:00 UTC = 00:00 UTC+8, ~every 90 days
    - cron: '0 16 1 */3 *'
    # Weekly Monday 09:00 UTC+8; the check includes a six-day polling buffer.
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: Which reminder to run (expiry does not open a quarterly issue)
        type: choice
        required: true
        default: expiry
        options:
          - expiry
          - quarterly

permissions:
  contents: read

jobs:
  validate:
    name: Validate reminder workflow configuration
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Check reminder workflow contract
        run: |
          set -euo pipefail
          test -s .github/workflows/secret-rotation-reminder.yml
          grep -q '^  schedule:' .github/workflows/secret-rotation-reminder.yml
          grep -q '^  workflow_dispatch:' .github/workflows/secret-rotation-reminder.yml
          grep -q 'issues: write' .github/workflows/secret-rotation-reminder.yml

  remind:
    permissions:
      contents: read
      issues: write
    name: Quarterly secret rotation reminder
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 16 1 */3 *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'quarterly') }}
    runs-on: ubuntu-latest
    steps:
      - name: Open reminder issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE=$(date '+%Y-%m-%d')
          cat > reminder-body.md <<'EOF'
          Per `docs/OPERATIONS_RUNBOOK.md` §O — 90 days since the last rotation cycle.

          ## Checklist (see §O secret inventory for the full list and rotation procedure)
          - [ ] `DB_PASSWORD`
          - [ ] `APP_KEY`
          - [ ] `PI_SSH_KEY`
          - [ ] `LINE_CHANNEL_SECRET`
          - [ ] `LINE_MESSAGING_TOKEN`
          - [ ] `SENTRY_DSN`

          Rotation is high-risk (production auth/session impact) — read `docs/DANGEROUS_OPERATIONS.md` first, confirm backup/rollback, and get explicit owner approval before executing per §O step 2. Not urgent (SEC-04, P2 per `docs/SEVERITY_MATRIX.md`) — schedule for next convenient maintenance window, not same-day.
          EOF
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "[security] Quarterly secret rotation reminder — ${DATE}" \
            --label "area:security,priority:p2" \
            --body-file reminder-body.md

  expiry:
    permissions:
      contents: read
      issues: write
    name: Credential expiry check
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 1 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'expiry') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: credential-expiry-reminders
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned registry parser in an isolated environment
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/credential-expiry-venv"
          "$RUNNER_TEMP/credential-expiry-venv/bin/python" -m pip install --disable-pip-version-check -r scripts/requirements-credential-expiry.txt
      - name: Open one issue per credential within lead_days plus polling buffer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/credential-expiry-venv/bin/python" scripts/credential-expiry.py --poll-interval-days 7 > "$RUNNER_TEMP/expiry.json"
          jq -r '"undated (no expires_on recorded): " + (.undated | join(", "))' "$RUNNER_TEMP/expiry.json" >> "$GITHUB_STEP_SUMMARY"
          if jq -e '.due | length == 0' "$RUNNER_TEMP/expiry.json" > /dev/null; then exit 0; fi
          # All states and pages, without search-index lag or a result limit. A failed lookup must stop writes.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" > "$RUNNER_TEMP/issues.json"
          jq -e 'type == "array" and length > 0 and all(.[]; type == "array" and all(.[]; type == "object" and (.title | type == "string")))' "$RUNNER_TEMP/issues.json" > /dev/null
          jq -c '.due[]' "$RUNNER_TEMP/expiry.json" | while read -r row; do
            title=$(jq -r .title <<<"$row")
            # A closed issue still owns this credential+date; similarly named issues/PRs do not.
            if jq -e --arg title "$title" 'any(.[][]; (has("pull_request") | not) and .title == $title)' "$RUNNER_TEMP/issues.json" > /dev/null; then
              echo "exists: $title"; continue
            fi
            jq -r '"Credential `\(.name)` (owner: \(.owner)) expires on \(.expires_on) (\(.days_left) days left).\n\nRotate at: \(.rotate_at)\n\nRotation is Founder-only (RULEBOOK F3) and high-risk; update `expires_on` in `docs/ops/credential-expiry.yml` after rotating. Names and dates only here, never values."' <<<"$row" > "$RUNNER_TEMP/body.md"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label "area:security,priority:p2" --body-file "$RUNNER_TEMP/body.md"
          done
