name: Autoland

# Kodiak-style `autoland` label (#4953 W1): adds `queue` server-side once the land-queue / review-gate gates are green,
# replacing local polling loops. It only adds a label and then dispatches land-queue.yml, which still does the
# update-branch and merge. The run reads no event payload (every trigger is just a prompt for a full sweep), and
# nothing here approves a deployment or environment. pull_request_target + default-branch checkout only: PR code is
# never checked out or executed (same trust model as land-queue.yml and review-gate.yml).
on:
  pull_request_target:
    branches: [main]
    types: [labeled, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, dismissed]
  check_suite:
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autoland
  cancel-in-progress: false

jobs:
  autoland:
    name: Autoland label to queue
    if: ${{ (github.event_name != 'issue_comment' || github.event.issue.pull_request) && (github.event_name != 'pull_request_target' || github.event.label.name == 'autoland' || github.event.action != 'labeled') }}
    permissions:
      contents: read
      pull-requests: write  # add the `queue` label
      issues: write         # labels are issue labels
      actions: write        # gh workflow run land-queue.yml (a GITHUB_TOKEN label event starts no workflow)
      checks: read
      statuses: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Queue autoland PRs whose gates are green
        env:
          # Only the job's own least-privilege token: no PAT, so comment/review/check_suite triggers never hold one.
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: node .github/scripts/autoland.mjs
