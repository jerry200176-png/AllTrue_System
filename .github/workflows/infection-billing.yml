name: Infection (billing money, advisory)

# Incremental mutation testing (#4659 step 4, widened by W12 of #4953). Pull requests that change an R3 backend path
# (scripts/governance/r3_backend_paths.py, same list as autonomy_gate) or the billing money files mutate only the
# changed lines (--git-diff-lines). Surviving mutants go to ONE sticky PR comment (scripts/ci/mutation-comment.mjs).
# workflow_dispatch: full run of the three billing files (hours; per-mutant RefreshDatabase). Advisory only: never
# required, never fails. No cron: PR events only.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/app/**'
      - 'scripts/governance/r3_backend_paths.py'
      - '.github/workflows/infection-billing.yml'
      - 'backend/infection.json5'

permissions:
  contents: read

concurrency:
  group: infection-billing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infection:
    name: Infection billing MSI (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    outputs:
      run: ${{ steps.scope.outputs.run }}
    env:
      DB_PASSWORD: ci-ephemeral # non-sensitive, ephemeral CI-only MySQL
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: AllTrue_test
          MYSQL_USER: admin
          MYSQL_PASSWORD: ci-ephemeral
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select scope (R3 backend files or billing money files changed?)
        id: scope
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git fetch -q origin main
          money='backend/app/Services/Billing/ContractMoneyVerdict.php|backend/app/Services/Billing/ContractMoneyState.php|backend/app/Services/BillingPayableResolver.php'
          r3="$(python3 scripts/governance/r3_backend_paths.py origin/main)"
          bill="$(git diff --name-only --diff-filter=AM origin/main...HEAD | grep -E "^($money)$" || true)"
          echo "run=$([ -n "$r3$bill" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # Billing-only PRs keep the fast billing test filter; other R3 paths run the suite Infection selects from coverage.
          echo "only_billing=$([ -z "$r3" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: ${{ steps.scope.outputs.run != 'false' }}
        with:
          php-version: "8.2"
          extensions: mbstring, pdo, pdo_mysql, bcmath, json, tokenizer, xml, ctype, pcov
          coverage: pcov
      - name: Install PHP dependencies
        if: ${{ steps.scope.outputs.run != 'false' }}
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Allow the CI DB user to create per-thread test DBs
        if: ${{ steps.scope.outputs.run != 'false' }}
        # Infection sets TEST_TOKEN per worker; Laravel ParallelTesting then uses AllTrue_test_test_<token>.
        run: |
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306","root","root"); $p->exec("GRANT ALL ON `AllTrue\\_test%`.* TO \"admin\"@\"%\"");'
      - name: Run Infection on billing money code
        if: ${{ steps.scope.outputs.run != 'false' }}
        working-directory: backend
        env:
          LARAVEL_PARALLEL_TESTING: "1"
        run: |
          mkdir -p storage/infection
          set +e
          # --filter and --git-diff-* are mutually exclusive in Infection: PRs mutate only changed lines,
          # manual runs mutate the three money files in full.
          SCOPE="--filter=Services/Billing/ContractMoneyVerdict.php,Services/Billing/ContractMoneyState.php,Services/BillingPayableResolver.php"
          if [ "${{ github.event_name }}" = pull_request ]; then
            git fetch -q origin main
            # Infection runs in backend/; make `git diff` print paths relative to it (backend/app/... -> app/...).
            git config diff.relative true
            SCOPE="--git-diff-lines --git-diff-base=origin/main"
          fi
          TESTS=()
          if [ "${{ github.event_name }}" != pull_request ] || [ "${{ steps.scope.outputs.only_billing }}" = true ]; then
            TESTS=(--test-framework-options='--filter=ContractMoney|BillingPayable|BillingCourseStatus|FreeGiftZeroBill|FullDiscountSettled|PaidStatus|TuitionSlipFollows|SharedPackage|CollectionQueueRequestShape')
          fi
          vendor/bin/infection --threads=4 --no-progress --min-msi=0 $SCOPE "${TESTS[@]}" \
            2>&1 | tee storage/infection/run.out
          echo "infection exit: ${PIPESTATUS[0]} (advisory, ignored)"
          exit 0
      - name: Job summary
        if: ${{ always() && steps.scope.outputs.run != 'false' }}
        working-directory: backend
        run: |
          {
            echo '## Infection MSI (billing money code, advisory)'
            echo '```'
            cat storage/infection/summary.log 2>/dev/null || tail -40 storage/infection/run.out 2>/dev/null || echo 'no summary produced'
            grep -E 'Mutation Score Indicator|Covered Code MSI|Mutation Code Coverage' storage/infection/run.out 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && steps.scope.outputs.run != 'false' }}
        with:
          name: infection-billing
          path: backend/storage/infection/
          if-no-files-found: ignore

  comment:
    # Separate job: the one with a write token never executes PR code. It checks out the default branch only and runs
    # scripts/ci/mutation-comment.mjs from there on the downloaded log (data only).
    name: Sticky surviving-mutants comment
    needs: infection
    if: ${{ always() && github.event_name == 'pull_request' && needs.infection.result != 'skipped' && needs.infection.outputs.run != 'false' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: infection-billing
          path: infection-out
      - name: Post sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: node scripts/ci/mutation-comment.mjs --section php --input infection-out/infection.log --pr "$PR" --repo "$REPO"
