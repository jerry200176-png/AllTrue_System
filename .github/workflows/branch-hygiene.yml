name: Branch Hygiene Report (daily dry-run)
# Also hosts the weekly stale-PR sweep and the hourly land-queue alarm
# (.github/scripts/repo-hygiene.mjs). Branch deletion stays out of scope (B5).

on:
  schedule:
    # 每週一 08:00 台灣時間 = 週日 00:00 UTC
    - cron: "0 0 * * 0"
    # Land queue alarm (hourly)
    - cron: "17 * * * *"
  workflow_dispatch: {}

# ⛔ 只讀報告，沒有任何刪除操作
# ⛔ 禁止在此新增任何 git branch -d / git push --delete 步驟

permissions:
  contents: read

concurrency:
  group: repo-hygiene-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  report:
    name: Branch Hygiene Dry-Run
    if: ${{ github.event.schedule != '17 * * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # 需要完整 remote branch 資訊
          persist-credentials: false

      - name: Run dry-run
        id: hygiene
        run: |
          chmod +x scripts/branch-hygiene.sh
          # checkout fetched all refs; no token remains for another private-repo fetch.
          OUTPUT=$(./scripts/branch-hygiene.sh --no-fetch 2>&1)
          echo "$OUTPUT"

          # 把輸出存起來給 summary 用
          echo "output<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          # 判斷是否有待清理的分支
          if echo "$OUTPUT" | grep -q "eligible for deletion"; then
            echo "has_stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write Job Summary
        run: |
          echo "## 🌿 Branch Hygiene Report ($(date +'%Y-%m-%d'))" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ "${STEPS_HYGIENE_OUTPUTS_HAS_STALE}" == "true" ]]; then
            echo "⚠️ **有已合併分支可清理** — 請確認後執行 \`./scripts/branch-hygiene.sh --apply\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ 分支狀態乾淨，無需清理" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<details><summary>詳細輸出</summary>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "${STEPS_HYGIENE_OUTPUTS_OUTPUT}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "</details>" >> "$GITHUB_STEP_SUMMARY"
        env:
          STEPS_HYGIENE_OUTPUTS_HAS_STALE: ${{ steps.hygiene.outputs.has_stale }}
          STEPS_HYGIENE_OUTPUTS_OUTPUT: ${{ steps.hygiene.outputs.output }}

      - name: Save report for the weekly issue
        run: printf '%s\n' "${STEPS_HYGIENE_OUTPUTS_OUTPUT}" > "$RUNNER_TEMP/hygiene-report.txt"
        env:
          STEPS_HYGIENE_OUTPUTS_OUTPUT: ${{ steps.hygiene.outputs.output }}

      # Weekly: label owner PRs idle 14d `stale`; report drafts idle 30d for explicit owner review.
      # Auto-close is deferred: the shared owner identity does not prove work can be discarded.
      - name: Stale PR sweep
        if: ${{ github.event.schedule == '0 0 * * 0' || github.event_name == 'workflow_dispatch' }}
        run: node .github/scripts/repo-hygiene.mjs stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HYGIENE_REPORT_FILE: ${{ runner.temp }}/hygiene-report.txt

  queue-alarm:
    name: Land queue alarm
    if: ${{ github.event.schedule == '17 * * * *' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check queue health
        run: node .github/scripts/repo-hygiene.mjs queue-alarm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
