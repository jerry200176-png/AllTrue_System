name: Bug Queue Dump (read-only)

# Public repo: the log and plaintext artifact carry IDs/statuses/timestamps/counts only.
# Titles and other report text are written to an artifact encrypted with the DUMP_ARTIFACT_KEY
# secret (decrypt locally, see docs/sop/BUG_INTAKE_TO_PRODUCTION.md). No writes to production.
# Cloud agents cannot workflow_dispatch (403) — trigger via request file push.
on:
  workflow_dispatch:
    inputs:
      target_bug_id:
        description: "Optional bug ID; fail if it is not in the fresh open queue"
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - 'operations/closeout/bug-queue-dump.request.md'
      - '.github/workflows/bug-queue-dump.yml'

concurrency:
  group: bug-queue-dump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dump:
    name: Dump open bug_reports (redacted)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require DUMP_ARTIFACT_KEY (fail closed, no plaintext fallback)
        env:
          DUMP_ARTIFACT_KEY: ${{ secrets.DUMP_ARTIFACT_KEY }}
        run: |
          if [ "${#DUMP_ARTIFACT_KEY}" -lt 16 ]; then
            echo "::error::secret DUMP_ARTIFACT_KEY is missing or shorter than 16 chars; refusing to dump (see docs/sop/BUG_INTAKE_TO_PRODUCTION.md)"
            exit 1
          fi
      - name: Checkout pinned SSH trust helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            .github/actions/production-ssh-trust
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Query open bugs (full JSON encrypted, log is IDs only)
        env:
          DUMP_ARTIFACT_KEY: ${{ secrets.DUMP_ARTIFACT_KEY }}
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          TARGET_BUG_ID: ${{ inputs.target_bug_id || '' }}
        run: |
          set -euo pipefail
          mkdir -p out raw
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_SSH_USER}@${PI_SSH_HOST}" bash <<'REMOTE' > raw/bug-queue-dump.log
          set -euo pipefail
          cd /home/admin/backend
          php artisan tinker --execute='
          $columns = ["id","status","severity","CampusID","page_key","title","created_at","updated_at","reporter_user_id","url","client_info"];
          $open = \Illuminate\Support\Facades\DB::table("bug_reports")
            ->whereIn("status", ["new","triaged","in_progress"])
            ->orderByDesc("id")
            ->get($columns);
          $resolved = \Illuminate\Support\Facades\DB::table("bug_reports")
            ->where("status", "resolved")
            ->orderByDesc("id")
            ->get($columns);
          $reporterIds = $open->concat($resolved)->pluck("reporter_user_id")->unique()->all();
          $reporterTypes = \Illuminate\Support\Facades\DB::table("User")
            ->whereIn("id", $reporterIds)
            ->pluck("type", "id");
          foreach ($open->concat($resolved) as $r) {
            $clientInfo = json_decode((string)($r->client_info ?? ""), true);
            $feedbackType = is_array($clientInfo) ? ($clientInfo["feedbackType"] ?? null) : null;
            if (!in_array($feedbackType, ["bug", "ux", "feature"], true)) $feedbackType = null;
            $title = (string)($r->title ?? "");
            if (mb_strlen($title) > 120) $title = mb_substr($title, 0, 120) . "…";
            $title = preg_replace("/\b\d{8,}\b/", "[num]", $title);
            $title = preg_replace("/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i", "[email]", $title);
            $atts = $r->status === "resolved" ? [] : \Illuminate\Support\Facades\DB::table("bug_report_attachments")->where("bug_report_id", $r->id)->pluck("id")->all();
            echo json_encode([
              "id" => (int)$r->id,
              "source_ref" => "alltrue:bug_report:".(int)$r->id,
              "status" => $r->status,
              "severity" => $r->severity,
              "campus_id" => $r->CampusID,
              "page_key" => $r->page_key,
              "title" => $r->status === "resolved" ? null : $title,
              "created_at" => $r->created_at,
              "updated_at" => $r->updated_at,
              "reporter_user_id" => (int)$r->reporter_user_id,
              "reporter_role_code" => $reporterTypes[(int)$r->reporter_user_id] ?? null,
              "reporter_feedback_type" => $feedbackType,
              "attachment_ids" => array_map("intval", $atts),
              "url_path" => is_string($r->url ?? null) ? parse_url($r->url, PHP_URL_PATH) : null,
            ], JSON_UNESCAPED_UNICODE), PHP_EOL;
          }
          $probeIds = [168, 172, 173, 189, 190, 191, 194, 195, 196, 197, 198, 200, 203, 204, 205];
          $probes = [];
          foreach ($probeIds as $pid) {
            $row = \Illuminate\Support\Facades\DB::table("bug_reports")->where("id", $pid)->first(["id","status","severity","CampusID","page_key","updated_at","title"]);
            if (!$row) { $probes[] = ["id" => $pid, "status" => "missing"]; continue; }
            $t = (string)($row->title ?? "");
            $t = preg_replace("/\b\d{8,}\b/", "[num]", $t);
            $probes[] = [
              "id" => (int)$row->id,
              "status" => $row->status,
              "severity" => $row->severity,
              "campus_id" => $row->CampusID,
              "page_key" => $row->page_key,
              "updated_at" => $row->updated_at,
              "title" => mb_substr($t, 0, 80),
            ];
          }
          $newest = \Illuminate\Support\Facades\DB::table("bug_reports")->orderByDesc("id")->first(["id","status","severity","CampusID","page_key","title","created_at"]);
          $nt = (string)($newest->title ?? "");
          $nt = preg_replace("/\b\d{8,}\b/", "[num]", $nt);
          echo "---META---", PHP_EOL;
          echo json_encode([
            "counts" => [
              "new" => (int)\Illuminate\Support\Facades\DB::table("bug_reports")->where("status","new")->count(),
              "triaged" => (int)\Illuminate\Support\Facades\DB::table("bug_reports")->where("status","triaged")->count(),
              "in_progress" => (int)\Illuminate\Support\Facades\DB::table("bug_reports")->where("status","in_progress")->count(),
              "resolved" => (int)\Illuminate\Support\Facades\DB::table("bug_reports")->where("status","resolved")->count(),
              "closed" => (int)\Illuminate\Support\Facades\DB::table("bug_reports")->where("status","closed")->count(),
            ],
            "max_id" => (int)\Illuminate\Support\Facades\DB::table("bug_reports")->max("id"),
            "probes" => $probes,
            "newest_any" => $newest ? [
              "id" => (int)$newest->id,
              "status" => $newest->status,
              "severity" => $newest->severity,
              "campus_id" => $newest->CampusID,
              "page_key" => $newest->page_key,
              "created_at" => $newest->created_at,
              "title" => mb_substr($nt, 0, 120),
            ] : null,
            "dump_generated_at" => gmdate("c"),
            "prod_head" => trim((string)@shell_exec("git rev-parse HEAD")),
          ], JSON_UNESCAPED_UNICODE), PHP_EOL;
          '
          REMOTE
          python3 <<'PY'
          from pathlib import Path
          import json, os, re
          text = Path("raw/bug-queue-dump.log").read_text(encoding="utf-8", errors="replace")
          open_rows = []
          resolved_rows = []
          meta = None
          for line in text.splitlines():
              line = line.strip()
              if line == "---META---":
                  continue
              if line.startswith("{"):
                  try:
                      obj = json.loads(line)
                  except Exception:
                      continue
                  if "counts" in obj:
                      meta = obj
                  elif "id" in obj and obj.get("status") == "resolved":
                      resolved_rows.append(obj)
                  elif "id" in obj and obj.get("status") in {"new", "triaged", "in_progress"}:
                      open_rows.append(obj)
          Path("raw/open-bugs.json").write_text(json.dumps(open_rows, ensure_ascii=False, indent=2), encoding="utf-8")
          Path("raw/resolved-bugs.json").write_text(json.dumps(resolved_rows, ensure_ascii=False, indent=2), encoding="utf-8")
          target_id = os.environ.get("TARGET_BUG_ID", "").strip()
          if target_id:
              if not target_id.isdigit():
                  raise SystemExit("target_bug_id must be numeric")
              target_rows = [r for r in open_rows if int(r.get("id", -1)) == int(target_id)]
              if len(target_rows) != 1 or target_rows[0].get("status") not in {"new", "triaged", "in_progress"}:
                  raise SystemExit(f"target bug #{target_id} is not uniquely present in the fresh open queue")
          if meta:
              expected_open = sum(int(meta.get("counts", {}).get(status, 0)) for status in ("new", "triaged", "in_progress"))
              expected_resolved = int(meta.get("counts", {}).get("resolved", 0))
              if len(open_rows) != expected_open or len(resolved_rows) != expected_resolved:
                  raise SystemExit(f"queue row/count mismatch: open={len(open_rows)}/{expected_open}, resolved={len(resolved_rows)}/{expected_resolved}")
              meta["queue_dump_run_id"] = os.environ.get("GITHUB_RUN_ID")
              meta["queue_dump_attempt"] = os.environ.get("GITHUB_RUN_ATTEMPT")
              meta["target_bug_id"] = int(target_id) if target_id else None
              print("counts=", json.dumps(meta.get("counts"), ensure_ascii=False))
              print("max_id=", meta.get("max_id"))
              print("prod_head=", meta.get("prod_head"))
          Path("raw/meta.json").write_text(json.dumps(meta or {}, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"open_rows={len(open_rows)}")
          print(f"resolved_rows={len(resolved_rows)}")
          if meta:
              print("counts=", json.dumps(meta.get("counts"), ensure_ascii=False))
              print("max_id=", meta.get("max_id"))
              print("prod_head=", meta.get("prod_head"))
          # Public (plaintext) artifact: no titles / free text / paths.
          SAFE = ("id", "source_ref", "status", "severity", "campus_id", "page_key", "created_at", "updated_at", "reporter_user_id", "reporter_role_code", "reporter_feedback_type")
          for name, rows in (("open-bugs", open_rows), ("resolved-bugs", resolved_rows)):
              Path(f"out/{name}.json").write_text(json.dumps([{k: r.get(k) for k in SAFE} for r in rows], indent=2), encoding="utf-8")
          pub = {k: v for k, v in (meta or {}).items() if k not in ("probes", "newest_any")}
          pub["probes"] = [{k: p.get(k) for k in ("id", "status", "severity", "updated_at")} for p in (meta or {}).get("probes", [])]
          Path("out/meta.json").write_text(json.dumps(pub, indent=2), encoding="utf-8")
          PY
          tar -C raw -czf - . | openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:DUMP_ARTIFACT_KEY -out out/bug-queue-dump.full.tar.gz.enc

      - name: Upload dump artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bug-queue-dump
          path: out/
          retention-days: 14

  # F14: show where in-app reports and GitHub issues disagree (read-only).
  reconcile:
    name: In-app ↔ GitHub issue reconcile
    needs: dump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout reconcile script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            scripts/inapp-issue-reconcile.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bug-queue-dump
          path: out
      - name: Reconcile
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh issue list --state all --limit 20000 --json number,title,body,comments,state,labels,author > issues.json
          # Never reconcile a truncated inventory silently.
          python3 -c 'import json,sys; n=len(json.load(open("issues.json"))); sys.exit(f"issue inventory truncated at {n}; raise --limit" if n >= 20000 else 0)'
          python3 scripts/inapp-issue-reconcile.py --dump out --issues issues.json | tee -a "$GITHUB_STEP_SUMMARY"
