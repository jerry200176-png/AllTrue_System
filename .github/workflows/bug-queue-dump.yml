name: Bug Queue Dump (read-only)

# PII-safe dump of newest open in-app bugs for triage. No writes.
on:
  workflow_dispatch:
    inputs:
      bug_id:
        description: "Optional bug_reports.id for detail dump"
        required: false
        type: string
      resolve_205:
        description: "If true, resolve in-app bug 205 with deploy evidence (write)"
        required: false
        type: boolean
        default: false

concurrency:
  group: bug-queue-dump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dump:
    name: Dump open bug_reports (redacted)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ssh-keyscan -H "$PI_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "keyscan ok"
          elif [[ -n "${PI_HOST_KEY:-}" ]]; then
            printf '%s\n' "$PI_HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::error::no host key"
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts
          if nc -z -w3 "$PI_SSH_HOST" 22 2>/dev/null; then
            echo "SSH_PORT=22" >> "$GITHUB_ENV"
          elif nc -z -w3 "$PI_SSH_HOST" 2222 2>/dev/null; then
            echo "SSH_PORT=2222" >> "$GITHUB_ENV"
            ssh-keyscan -p 2222 -H "$PI_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          else
            echo "SSH_PORT=22" >> "$GITHUB_ENV"
          fi

      - name: Query open bugs (no PII fields)
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          BUG_ID: ${{ inputs.bug_id }}
          RESOLVE_205: ${{ inputs.resolve_205 }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          # Embed bug id in remote script safely (digits only)
          BID=""
          RESOLVE="${RESOLVE_205:-false}"
          if [[ -n "${BUG_ID:-}" ]]; then
            [[ "$BUG_ID" =~ ^[0-9]+$ ]] || { echo "::error::bug_id must be numeric"; exit 1; }
            BID="$BUG_ID"
          fi
          ssh -i ~/.ssh/deploy_key \
            -p "$PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_SSH_USER}@${PI_SSH_HOST}" bash -s -- "$BID" "$RESOLVE" <<'REMOTE'
          set -euo pipefail
          BID="${1:-}"
          RESOLVE="${2:-false}"
          cd /home/admin/backend
          php artisan tinker --execute='
          $open = \Illuminate\Support\Facades\DB::table("bug_reports")
            ->whereIn("status", ["new","triaged","in_progress"])
            ->orderByDesc("id")
            ->limit(25)
            ->get(["id","status","severity","CampusID","page_key","title","created_at","updated_at","reporter_user_id","url"]);
          foreach ($open as $r) {
            $title = (string)($r->title ?? "");
            if (mb_strlen($title) > 120) $title = mb_substr($title, 0, 120) . "…";
            $title = preg_replace("/\b\d{8,}\b/", "[num]", $title);
            $title = preg_replace("/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i", "[email]", $title);
            $atts = \Illuminate\Support\Facades\DB::table("bug_report_attachments")->where("bug_report_id", $r->id)->pluck("id")->all();
            echo json_encode([
              "id" => (int)$r->id,
              "status" => $r->status,
              "severity" => $r->severity,
              "campus_id" => $r->CampusID,
              "page_key" => $r->page_key,
              "title" => $title,
              "created_at" => $r->created_at,
              "updated_at" => $r->updated_at,
              "reporter_user_id" => (int)$r->reporter_user_id,
              "attachment_ids" => array_map("intval", $atts),
              "url_path" => is_string($r->url ?? null) ? parse_url($r->url, PHP_URL_PATH) : null,
            ], JSON_UNESCAPED_UNICODE), PHP_EOL;
          }
          $newest = \Illuminate\Support\Facades\DB::table("bug_reports")->orderByDesc("id")->first(["id","status","severity","CampusID","page_key","title","created_at"]);
          $nt = (string)($newest->title ?? "");
          $nt = preg_replace("/\b\d{8,}\b/", "[num]", $nt);
          echo "---META---", PHP_EOL;
          echo json_encode([
            "counts" => [
              "new" => (int)\Illuminate\Support\Facades\DB::table("bug_reports")->where("status","new")->count(),
              "triaged" => (int)\Illuminate\Support\Facades\DB::table("bug_reports")->where("status","triaged")->count(),
              "in_progress" => (int)\Illuminate\Support\Facades\DB::table("bug_reports")->where("status","in_progress")->count(),
              "resolved" => (int)\Illuminate\Support\Facades\DB::table("bug_reports")->where("status","resolved")->count(),
            ],
            "max_id" => (int)\Illuminate\Support\Facades\DB::table("bug_reports")->max("id"),
            "newest_any" => $newest ? [
              "id" => (int)$newest->id,
              "status" => $newest->status,
              "severity" => $newest->severity,
              "campus_id" => $newest->CampusID,
              "page_key" => $newest->page_key,
              "created_at" => $newest->created_at,
              "title" => mb_substr($nt, 0, 120),
            ] : null,
          ], JSON_UNESCAPED_UNICODE), PHP_EOL;
          '
          if [[ -n "$BID" ]]; then
            php artisan tinker --execute="
            \$id = (int) ${BID};
            \$b = \Illuminate\Support\Facades\DB::table('bug_reports')->where('id', \$id)->first();
            if (!\$b) { echo 'BUG_NOT_FOUND '.\$id, PHP_EOL; return; }
            \$desc = (string)(\$b->description ?? '');
            \$desc = preg_replace('/\b\d{8,}\b/', '[num]', \$desc);
            echo \"DETAIL_START\\n\";
            echo json_encode([
              'id' => (int)\$b->id,
              'status' => \$b->status,
              'severity' => \$b->severity,
              'campus_id' => \$b->CampusID,
              'page_key' => \$b->page_key,
              'reporter_user_id' => (int)\$b->reporter_user_id,
              'created_at' => \$b->created_at,
              'client_info' => \$b->client_info ?? null,
              'url_path' => is_string(\$b->url ?? null) ? parse_url(\$b->url, PHP_URL_PATH) : null,
              'description' => \$desc,
            ], JSON_UNESCAPED_UNICODE), PHP_EOL;
            \$atts = \Illuminate\Support\Facades\DB::table('bug_report_attachments')->where('bug_report_id', \$id)->get(['id','stored_path','original_name','mime_type','size']);
            echo json_encode(['attachments' => \$atts], JSON_UNESCAPED_UNICODE), PHP_EOL;
            echo \"DETAIL_END\\n\";
            "
            echo "ATT_CANDIDATES"
            ATT_PATH="bug-reports/205/gTFW77ueBjxXhi4RV7DeDWhQGWW9YqmALzdEiYR8.png"
            if [[ "$BID" != "205" ]]; then
              ATT_PATH=$(php artisan tinker --execute="\$p=\\Illuminate\\Support\\Facades\\DB::table('bug_report_attachments')->where('bug_report_id',(int)${BID})->value('stored_path'); echo \$p ?: '';" 2>/dev/null | tail -1 | tr -d '\r')
            fi
            if [[ -n "$ATT_PATH" && -f "storage/app/public/$ATT_PATH" ]]; then
              echo "ATT_FILE storage/app/public/$ATT_PATH"
              mkdir -p /tmp/bug-att
              cp "storage/app/public/$ATT_PATH" /tmp/bug-att/attachment.bin
              # copy to runner via stdout size only; use scp reverse — instead write under /tmp on runner with ssh cat
            fi
            if [[ "$BID" == "205" ]]; then
              php artisan tinker --execute='
              $date="2026-07-14"; $campus=17;
              $rows=\Illuminate\Support\Facades\DB::table("ClassSession as cs")
                ->join("StudentClass as sc","sc.ID","=","cs.StudentClassID")
                ->leftJoin("User as t","t.id","=","sc.TeacherID")
                ->leftJoin("Student as st","st.id","=","sc.StudentID")
                ->leftJoin("Subject as sj","sj.id","=","sc.SubjectID")
                ->where("st.CampusID",$campus)
                ->whereDate("cs.SessionDate",$date)
                ->where("cs.StartTime",">=","17:00:00")
                ->where("cs.StartTime","<=","20:30:00")
                ->orderBy("cs.StartTime")
                ->get(["cs.id","cs.StudentClassID","cs.Status","cs.StartTime","cs.EndTime","sc.ClassType","sc.StudentID","sc.TeacherID","sc.SubjectID","sj.Subject_Name as subject_name","t.Name as teacher_name"]);
              echo "SESSIONS_START", PHP_EOL;
              foreach($rows as $r){
                echo json_encode([
                  "sid"=>(int)$r->id,
                  "scid"=>(int)$r->StudentClassID,
                  "student_id"=>(int)$r->StudentID,
                  "contract_teacher_id"=>(int)$r->TeacherID,
                  "teacher"=>$r->teacher_name,
                  "status"=>$r->Status,
                  "start"=>$r->StartTime,
                  "end"=>$r->EndTime,
                  "subject_id"=>(int)$r->SubjectID,
                  "subject"=>$r->subject_name,
                  "class_type"=>$r->ClassType,
                ], JSON_UNESCAPED_UNICODE), PHP_EOL;
              }
              echo "SESSIONS_END", PHP_EOL;
              $huang=\Illuminate\Support\Facades\DB::table("User")->where("Name","like","%黃芝琳%")->first(["id","Name"]);
              echo "HUANG_ID=", $huang ? (int)$huang->id : 0, PHP_EOL;
              $stu=\Illuminate\Support\Facades\DB::table("Student")->where("Name","like","%兆尹%")->where("CampusID",$campus)->first(["id","CampusID"]);
              echo "STU_ID=", $stu ? (int)$stu->id : 0, PHP_EOL;
              if ($huang) {
                $tid=(int)$huang->id;
                $svc=app(\App\Services\SubstituteService::class);
                $ex=$stu ? (int)$stu->id : null;
                $busy=$svc->collectTeacherBusySlotsWithCapacity($tid, $date, [], $ex);
                echo "BUSY_EXCL=", json_encode($busy, JSON_UNESCAPED_UNICODE), PHP_EOL;
                $busy2=$svc->collectTeacherBusySlotsWithCapacity($tid, $date, [], null);
                echo "BUSY_ALL=", json_encode($busy2, JSON_UNESCAPED_UNICODE), PHP_EOL;
                $overlap=array_values(array_filter($busy2, function($s){
                  $a=strtotime("2000-01-01 ".$s["start_time"]); $b=strtotime("2000-01-01 ".$s["end_time"]);
                  $c=strtotime("2000-01-01 17:30"); $d=strtotime("2000-01-01 19:30");
                  return $a < $d && $b > $c;
                }));
                echo "OVERLAP_ALL=", json_encode($overlap, JSON_UNESCAPED_UNICODE), PHP_EOL;
              }
              $sched=\Illuminate\Support\Facades\DB::table("schedules as s")
                ->leftJoin("Student as st","st.id","=","s.student_id")
                ->whereDate("s.schedule_date",$date)
                ->where("s.start_time",">=","17:00:00")
                ->where(function($q) use ($campus){ $q->where("s.branch_id",$campus)->orWhere("st.CampusID",$campus); })
                ->orderBy("s.start_time")
                ->limit(80)
                ->get(["s.id","s.teacher_id","s.student_course_id","s.student_id","s.status","s.start_time","s.end_time","s.branch_id","s.original_schedule_id"]);
              echo "SCHED_START", PHP_EOL;
              foreach($sched as $s){ echo json_encode($s, JSON_UNESCAPED_UNICODE), PHP_EOL; }
              echo "SCHED_END", PHP_EOL;
              $huangId=67; $date="2026-07-14";
              $hs=\Illuminate\Support\Facades\DB::table("schedules")
                ->where("teacher_id",$huangId)
                ->whereDate("schedule_date",$date)
                ->orderBy("start_time")
                ->get(["id","teacher_id","student_course_id","student_id","status","start_time","end_time","branch_id","original_schedule_id","type"]);
              echo "HUANG_SCHED_START", PHP_EOL;
              foreach($hs as $s){ echo json_encode($s, JSON_UNESCAPED_UNICODE), PHP_EOL; }
              echo "HUANG_SCHED_END", PHP_EOL;
              echo "ATTRIB_START", PHP_EOL;
              $tid=67; $sid=7; $date="2026-07-14";
              $cs=\Illuminate\Support\Facades\DB::table("ClassSession as cs")
                ->join("StudentClass as sc","sc.ID","=","cs.StudentClassID")
                ->where("sc.TeacherID",$tid)
                ->whereDate("cs.SessionDate",$date)
                ->get(["cs.id","cs.StudentClassID","cs.Status","cs.StartTime","cs.EndTime","sc.StudentID","sc.ClassType","sc.TeacherID"]);
              echo "CS_TEACHER67=", json_encode($cs, JSON_UNESCAPED_UNICODE), PHP_EOL;
              $sc=\Illuminate\Support\Facades\DB::table("StudentClass")->where("StudentID",$sid)->get(["ID","TeacherID","ClassType","SubjectID","Stop"]);
              echo "SC_STU7=", json_encode($sc, JSON_UNESCAPED_UNICODE), PHP_EOL;
              $sch=\Illuminate\Support\Facades\DB::table("schedules")->where("student_id",$sid)->whereDate("schedule_date",$date)->get(["id","teacher_id","student_course_id","status","start_time","end_time","original_schedule_id","branch_id"]);
              echo "SCH_STU7=", json_encode($sch, JSON_UNESCAPED_UNICODE), PHP_EOL;
              $schT=\Illuminate\Support\Facades\DB::table("schedules")->where("teacher_id",$tid)->whereDate("schedule_date",$date)->count();
              echo "SCH_T67_COUNT=", $schT, PHP_EOL;
              $allT=\Illuminate\Support\Facades\DB::table("schedules")->where("teacher_id",$tid)->where("schedule_date","like","2026-07-14%")->get(["id","teacher_id","student_id","status","start_time","schedule_date"]);
              echo "SCH_T67_LIKE=", json_encode($allT, JSON_UNESCAPED_UNICODE), PHP_EOL;
              echo "ATTRIB_END", PHP_EOL;


              '
            fi
          if [[ "$RESOLVE" == "true" ]]; then
              php artisan tinker --execute='
              $bugId=205;
              $admin=\Illuminate\Support\Facades\DB::table("UserCampus")->where("Admin",1)->where("Approved",1)->orderBy("UserID")->value("UserID");
              $actor=$admin ? (int)$admin : 1;
              $svc=\App\Services\BugReportService::class;
              $pub="已修好：換代課老師時，系統會正確排除「這位學生自己」的既有時段，不再把還有名額的 1 對 2 老師誤標成已滿／衝堂。請在課程管理再開一次「換代課老師」確認；若仍有問題請回覆此單。";
              $bug=\App\Models\BugReport::find($bugId);
              echo "before=", $bug?$bug->status:"missing", PHP_EOL;
              foreach (["triaged","in_progress"] as $st) {
                if ($bug && $bug->status === $st) { continue; }
                if ($bug && in_array($bug->status, ["resolved","closed"], true)) { break; }
                $r=$svc::changeStatus($bugId,$actor,$st,"ops: in-app #205");
                echo "to_$st=", json_encode($r, JSON_UNESCAPED_UNICODE), PHP_EOL;
                $bug=\App\Models\BugReport::find($bugId);
              }
              if ($bug && $bug->status !== "resolved") {
                $hasPub=\App\Models\BugReportComment::query()->where("bug_report_id",$bugId)->where("is_internal_note",false)->exists();
                if (!$hasPub) {
                  $c=$svc::addComment($bugId,$actor,$pub,false);
                  echo "comment_id=", isset($c->id)?$c->id:"?", PHP_EOL;
                }
                $r=$svc::changeStatus($bugId,$actor,"resolved","production fix verified; reporter verification requested",[
                  "production_revision"=>"8d08ca72da42a1455f7d4502bb97b309778adf20",
                  "deploy_run_id"=>"29669924825",
                ]);
                echo "resolve=", json_encode($r, JSON_UNESCAPED_UNICODE), PHP_EOL;
              }
              $bug=\App\Models\BugReport::find($bugId);
              echo "final_status=", $bug?$bug->status:"missing", PHP_EOL;
              '
            fi
          fi
          REMOTE