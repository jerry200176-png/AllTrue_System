name: Bug Queue Dump (read-only)

# PII-safe dump of newest open in-app bugs for triage. No writes.
on:
  workflow_dispatch:
    inputs:
      bug_id:
        description: "Optional bug_reports.id for detail dump"
        required: false
        type: string

concurrency:
  group: bug-queue-dump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dump:
    name: Dump open bug_reports (redacted)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ssh-keyscan -H "$PI_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "keyscan ok"
          elif [[ -n "${PI_HOST_KEY:-}" ]]; then
            printf '%s\n' "$PI_HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::error::no host key"
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts
          if nc -z -w3 "$PI_SSH_HOST" 22 2>/dev/null; then
            echo "SSH_PORT=22" >> "$GITHUB_ENV"
          elif nc -z -w3 "$PI_SSH_HOST" 2222 2>/dev/null; then
            echo "SSH_PORT=2222" >> "$GITHUB_ENV"
            ssh-keyscan -p 2222 -H "$PI_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          else
            echo "SSH_PORT=22" >> "$GITHUB_ENV"
          fi

      - name: Query open bugs (no PII fields)
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          BUG_ID: ${{ inputs.bug_id }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          # Embed bug id in remote script safely (digits only)
          BID=""
          if [[ -n "${BUG_ID:-}" ]]; then
            [[ "$BUG_ID" =~ ^[0-9]+$ ]] || { echo "::error::bug_id must be numeric"; exit 1; }
            BID="$BUG_ID"
          fi
          ssh -i ~/.ssh/deploy_key \
            -p "$PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_SSH_USER}@${PI_SSH_HOST}" bash -s -- "$BID" <<'REMOTE'
          set -euo pipefail
          BID="${1:-}"
          cd /home/admin/backend
          php artisan tinker --execute='
          $open = \Illuminate\Support\Facades\DB::table("bug_reports")
            ->whereIn("status", ["new","triaged","in_progress"])
            ->orderByDesc("id")
            ->limit(25)
            ->get(["id","status","severity","CampusID","page_key","title","created_at","updated_at","reporter_user_id","url"]);
          foreach ($open as $r) {
            $title = (string)($r->title ?? "");
            if (mb_strlen($title) > 120) $title = mb_substr($title, 0, 120) . "…";
            $title = preg_replace("/\b\d{8,}\b/", "[num]", $title);
            $title = preg_replace("/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i", "[email]", $title);
            $atts = \Illuminate\Support\Facades\DB::table("bug_report_attachments")->where("bug_report_id", $r->id)->pluck("id")->all();
            echo json_encode([
              "id" => (int)$r->id,
              "status" => $r->status,
              "severity" => $r->severity,
              "campus_id" => $r->CampusID,
              "page_key" => $r->page_key,
              "title" => $title,
              "created_at" => $r->created_at,
              "updated_at" => $r->updated_at,
              "reporter_user_id" => (int)$r->reporter_user_id,
              "attachment_ids" => array_map("intval", $atts),
              "url_path" => is_string($r->url ?? null) ? parse_url($r->url, PHP_URL_PATH) : null,
            ], JSON_UNESCAPED_UNICODE), PHP_EOL;
          }
          $newest = \Illuminate\Support\Facades\DB::table("bug_reports")->orderByDesc("id")->first(["id","status","severity","CampusID","page_key","title","created_at"]);
          $nt = (string)($newest->title ?? "");
          $nt = preg_replace("/\b\d{8,}\b/", "[num]", $nt);
          echo "---META---", PHP_EOL;
          echo json_encode([
            "counts" => [
              "new" => (int)\Illuminate\Support\Facades\DB::table("bug_reports")->where("status","new")->count(),
              "triaged" => (int)\Illuminate\Support\Facades\DB::table("bug_reports")->where("status","triaged")->count(),
              "in_progress" => (int)\Illuminate\Support\Facades\DB::table("bug_reports")->where("status","in_progress")->count(),
              "resolved" => (int)\Illuminate\Support\Facades\DB::table("bug_reports")->where("status","resolved")->count(),
            ],
            "max_id" => (int)\Illuminate\Support\Facades\DB::table("bug_reports")->max("id"),
            "newest_any" => $newest ? [
              "id" => (int)$newest->id,
              "status" => $newest->status,
              "severity" => $newest->severity,
              "campus_id" => $newest->CampusID,
              "page_key" => $newest->page_key,
              "created_at" => $newest->created_at,
              "title" => mb_substr($nt, 0, 120),
            ] : null,
          ], JSON_UNESCAPED_UNICODE), PHP_EOL;
          '
          if [[ -n "$BID" ]]; then
            php artisan tinker --execute="
            \$id = (int) ${BID};
            \$b = \Illuminate\Support\Facades\DB::table('bug_reports')->where('id', \$id)->first();
            if (!\$b) { echo 'BUG_NOT_FOUND '.\$id, PHP_EOL; return; }
            \$desc = (string)(\$b->description ?? '');
            \$desc = preg_replace('/\b\d{8,}\b/', '[num]', \$desc);
            echo \"DETAIL_START\\n\";
            echo json_encode([
              'id' => (int)\$b->id,
              'status' => \$b->status,
              'severity' => \$b->severity,
              'campus_id' => \$b->CampusID,
              'page_key' => \$b->page_key,
              'reporter_user_id' => (int)\$b->reporter_user_id,
              'created_at' => \$b->created_at,
              'client_info' => \$b->client_info ?? null,
              'url_path' => is_string(\$b->url ?? null) ? parse_url(\$b->url, PHP_URL_PATH) : null,
              'description' => \$desc,
            ], JSON_UNESCAPED_UNICODE), PHP_EOL;
            \$atts = \Illuminate\Support\Facades\DB::table('bug_report_attachments')->where('bug_report_id', \$id)->get(['id','stored_path','original_name','mime_type','size']);
            echo json_encode(['attachments' => \$atts], JSON_UNESCAPED_UNICODE), PHP_EOL;
            echo \"DETAIL_END\\n\";
            "
            echo "ATT_CANDIDATES"
            find /home/admin/backend/storage/app/public -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -30 || true
          fi
          REMOTE
