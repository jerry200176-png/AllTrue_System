name: 1401 Privacy Impact Audit (read-only)

on:
  workflow_dispatch:

concurrency:
  group: 1401-impact-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup pinned SSH identity
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$PI_SSH_KEY"
          test -n "$PI_HOST_KEY"
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          printf '%s\n' "$PI_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Run read-only impact audit on production (issue #1401)
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_USER}@${PI_HOST}" bash <<'REMOTE'
          set -euo pipefail
          cd /home/admin/backend
          php artisan audit:1401-impact
          REMOTE

      - name: Remove audit material
        if: always()
        run: rm -f ~/.ssh/deploy_key
