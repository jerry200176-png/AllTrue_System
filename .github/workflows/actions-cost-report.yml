name: Actions usage report (weekly)

# Workflow gap #11. Read-only on code; writes one comment on one active tracker.
# Completed attempts in a run-creation cohort (no billing scope needed).
on:
  schedule:
    - cron: '23 1 * * 1' # Monday 09:23 UTC+8
  workflow_dispatch: {}

# Schedule and dispatch share one active tracker across refs. Finish the current write.
concurrency:
  group: actions-cost-report
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  report:
    name: Weekly Actions usage report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Count agent-authored commits (aggregate only)
        id: ai
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          since="$(date -u -d '7 days ago' +%F)"
          n="$(gh api -X GET search/commits -f q="repo:${GITHUB_REPOSITORY} Claude-Session committer-date:>=${since}" -q .total_count)"
          echo "n=${n}" >> "$GITHUB_OUTPUT"
      - name: Build and post report
        run: node .github/scripts/actions-cost-report.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_COMMITS: ${{ steps.ai.outputs.n }}
