name: Actions usage report (weekly)

# Workflow gap #11. Read-only on code; writes one comment on one tracking issue.
# Completed attempts in a run-creation cohort (no billing scope needed).
on:
  schedule:
    - cron: '23 1 * * 1' # Monday 09:23 UTC+8
  workflow_dispatch: {}

# Schedule and dispatch share one tracker, across refs. Finish the current write.
concurrency:
  group: actions-cost-report
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  report:
    name: Weekly Actions usage report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Build and post report
        run: node .github/scripts/actions-cost-report.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
