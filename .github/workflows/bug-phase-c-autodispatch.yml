name: Bug Phase-C auto-dispatch (newly allowlisted IDs)

# RETIRED (ADR-POP-015 / ADR-POP-008, 2026-10-19): runner→SSH→tinker engineering resolves
# are no longer auto-dispatched. Adding a new allowlist ID fails closed so merges cannot
# silently re-enable the legacy write path. Wording-only allowlist edits (no new IDs) pass.
# Engineering Phase-C must use Pi-local `inapp-report-resolve-after-deploy` + `pop:execute-approved`
# once that operation is catalogued and standing policy is enabled. Public wording-only
# corrections use `bug-followup-comment.yml` (no status resolve via SSH allowlist).
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bug-phase-c-allowlist.yml'

permissions:
  contents: read

concurrency:
  group: bug-phase-c-autodispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout (with the previous main commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse newly allowlisted IDs (legacy SSH path retired)
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          BEFORE="${PUSH_BEFORE:-}"
          [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] || BEFORE="$(git rev-parse HEAD^)"
          git merge-base --is-ancestor "$BEFORE" HEAD || { echo "::error::diff base $BEFORE is not an ancestor of HEAD"; exit 1; }
          f=.github/workflows/bug-phase-c-allowlist.yml
          git show "$BEFORE:$f" > /tmp/before.yml || { echo "::error::cannot read the previous allowlist"; exit 1; }
          ids="$(python3 - /tmp/before.yml "$f" <<'PY'
          import re, sys
          key = re.compile(r'^\s*"?(\d+)"?\s*=>\s*\[', re.M)
          before = set(map(int, key.findall(open(sys.argv[1], encoding="utf-8").read())))
          after = set(map(int, key.findall(open(sys.argv[2], encoding="utf-8").read())))
          print(" ".join(str(i) for i in sorted(after - before)))
          PY
          )"
          echo "newly allowlisted: ${ids:-none}"
          if [ -n "$ids" ]; then
            echo "::error::Legacy SSH Phase-C autodispatch is retired (ADR-POP-015). Refusing new allowlist IDs: $ids. Do not resolve in-app reports via bug-phase-c-allowlist.yml; use Pi-local inapp-report-resolve-after-deploy / pop:execute-approved, or bug-followup-comment.yml for wording-only."
            exit 1
          fi
          echo "OK: no new allowlist IDs; wording-only allowlist edits do not dispatch SSH resolve."
