name: Bug Phase-A triage write-back

# Narrow, auditable write-back for freshly verified in-app bugs, in batches of up to 20 rows.
# This workflow never resolves a bug. With close_as_logged a row closes a
# suggestion/ux/not-planned/duplicate report via BugReportService::closeAsLogged (F12).
# Founder 2026-10-21 (FOUNDER_STANDING_DECISIONS.md): no per-run Founder approval; main only,
# secrets only on the main-only production-ssh environment, every row validated before any write.
on:
  workflow_dispatch:
    inputs:
      rows_json:
        description: 'JSON array (1-20) of {"bug_id","github_issue_url","public_reply"(<=600 chars, contains the URL),"disposition"(default bug),"close_as_logged"(default false)}'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: inapp-production-writeback
  cancel-in-progress: false
  queue: max

jobs:
  preview:
    # Validates every row (all-or-nothing) and records an ID/hash-only table before the write job.
    name: Preview the in-app write batch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      logged_issues: ${{ steps.rows.outputs.logged_issues }}
    steps:
      - name: Checkout pinned row validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts/inapp-writeback-rows.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Show the requested writes
        id: rows
        # rows_json is read from the event payload (never env); errors name the row and field, never the value.
        run: python3 .github/scripts/inapp-writeback-rows.py phase-a preview

  triage:
    needs: preview
    runs-on: ubuntu-latest
    environment: production-ssh
    timeout-minutes: 30
    outputs:
      applied: ${{ steps.write.outputs.applied }}
    steps:
      - name: Checkout pinned SSH trust helper and row validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/production-ssh-trust
            .github/scripts/inapp-writeback-rows.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$PI_SSH_KEY"
          test -n "$PI_SSH_HOST"
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Write triage and public replies
        id: write
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
        # rows_json is deliberately not in env (GitHub prints step env in the public log header). The
        # validator re-reads the event payload and emits one safe line per row: validated tokens plus
        # the base64 reply. Rows run in order in one SSH session; the first failing row stops the batch
        # (earlier rows stay written; a rerun is idempotent per row). The bug_ids the remote confirms
        # are published as `applied`, so the follow-on job still handles rows written before a failure.
        run: |
          set -euo pipefail
          ROWS="$(python3 .github/scripts/inapp-writeback-rows.py phase-a write)"
          ROW_COUNT="$(printf '%s\n' "$ROWS" | wc -l | tr -d ' ')"
          ROWS_B64="$(printf '%s' "$ROWS" | base64 | tr -d '\n')"
          set +e
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_SSH_USER}@${PI_SSH_HOST}" \
            "ROW_COUNT='$ROW_COUNT' ROWS_B64='$ROWS_B64' bash -s" <<'REMOTE' | tee "$RUNNER_TEMP/write.log"
          set -euo pipefail
          cd /home/admin/backend
          applied=0
          # fd 3 carries the rows; tinker gets /dev/null so it can never eat this script (bash -s stdin).
          while read -r -u 3 BUG_ID GITHUB_ISSUE_URL DISPOSITION CLOSE_AS_LOGGED PUBLIC_REPLY_B64; do
          [[ "$BUG_ID" =~ ^[0-9]+$ ]] || { echo "invalid bug_id"; exit 1; }
          [[ "$GITHUB_ISSUE_URL" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/issues/[0-9]+$ ]] || { echo "invalid github_issue_url"; exit 1; }
          [[ "$DISPOSITION" =~ ^[a-z_]+$ ]] || { echo "invalid disposition syntax"; exit 1; }
          [[ "$CLOSE_AS_LOGGED" =~ ^(true|false)$ ]] || { echo "invalid close_as_logged"; exit 1; }
          PUBLIC_REPLY="$(printf '%s' "$PUBLIC_REPLY_B64" | base64 -d)"
          [[ "$PUBLIC_REPLY" == *"$GITHUB_ISSUE_URL"* ]] || { echo "public reply must contain github_issue_url"; exit 1; }
          export BUG_ID GITHUB_ISSUE_URL DISPOSITION PUBLIC_REPLY CLOSE_AS_LOGGED
          php artisan tinker --execute='
          $bugId = (int)getenv("BUG_ID");
          $issueUrl = (string)getenv("GITHUB_ISSUE_URL");
          $disposition = (string)getenv("DISPOSITION");
          $reply = (string)getenv("PUBLIC_REPLY");
          $bug = \App\Models\BugReport::find($bugId);
          if (!$bug) { throw new \RuntimeException("bug not found: ".$bugId); }
          $status = (string)$bug->status;
          // close_as_logged reruns may find the report already closed; closeAsLogged decides idempotently.
          $allowedStatuses = getenv("CLOSE_AS_LOGGED") === "true" ? ["new", "triaged", "closed"] : ["new", "triaged"];
          if (!in_array($status, $allowedStatuses, true)) {
              throw new \RuntimeException("refusing status: ".$status);
          }
          $admin = \Illuminate\Support\Facades\DB::table("UserCampus")
              ->where("Admin", 1)->where("Approved", 1)->orderBy("UserID")->value("UserID");
          $actor = $admin ? (int)$admin : 1;
          $svc = \App\Services\BugReportService::class;
          if (getenv("CLOSE_AS_LOGGED") === "true") {
              $closed = $svc::closeAsLogged($bugId, $actor, $disposition, $issueUrl, $reply);
              if (!($closed["ok"] ?? false)) { throw new \RuntimeException(json_encode($closed)); }
              echo json_encode(["bug_id" => $bugId, "from" => $status, "close_as_logged" => $closed, "issue" => $issueUrl], JSON_UNESCAPED_UNICODE), PHP_EOL;
          } else {
          // Same row lock as bugs:auto-intake --ack: whoever runs second re-reads the status after the
          // first commits, so a report is never moved new->triaged twice or answered twice concurrently.
          \Illuminate\Support\Facades\DB::transaction(function () use ($bugId, $issueUrl, $disposition, $reply, $actor, $svc) {
          $locked = \App\Models\BugReport::query()->whereKey($bugId)->lockForUpdate()->first();
          $status = (string)$locked->status;
          if (!in_array($status, ["new", "triaged"], true)) { throw new \RuntimeException("refusing status: ".$status); }
          $validatedDisposition = $svc::normalizeDispositionOptions([
              "disposition" => $disposition,
              "github_issue_url" => $issueUrl,
          ]);
          if (!($validatedDisposition["ok"] ?? false)) { throw new \RuntimeException(json_encode($validatedDisposition)); }
          $transition = null;
          if ($status === "new") {
              $transition = $svc::changeStatus($bugId, $actor, "triaged", "phase-a verified intake; GitHub issue=".$issueUrl, [
                  "disposition" => $disposition,
                  "github_issue_url" => $issueUrl,
              ]);
              if (!($transition["ok"] ?? false)) { throw new \RuntimeException(json_encode($transition)); }
          } else {
              // Already triaged (e.g. hourly auto-intake): record the verified disposition without a transition.
              $transition = $svc::restateDisposition($bugId, $actor, [
                  "disposition" => $disposition,
                  "github_issue_url" => $issueUrl,
              ], "phase-a verified intake; GitHub issue=".$issueUrl);
              if (!($transition["ok"] ?? false)) { throw new \RuntimeException(json_encode($transition)); }
          }
          $already = \App\Models\BugReportComment::query()->where("bug_report_id", $bugId)
              ->where("body", "like", "%".$issueUrl."%")->exists();
          $comment = $already ? ["ok" => true, "skipped" => true] : $svc::addComment($bugId, $actor, $reply, false);
          // addComment() returns the persisted BugReportComment model, while
          // an idempotent skip returns the small {ok, skipped} shape.
          $commentSucceeded = ($comment["ok"] ?? false) || isset($comment["id"]) || ($comment["skipped"] ?? false);
          if (!$commentSucceeded) { throw new \RuntimeException(json_encode($comment)); }
          $fresh = \App\Models\BugReport::find($bugId);
          echo json_encode([
              "bug_id" => $bugId,
              "from" => $status,
              "final" => $fresh ? (string)$fresh->status : "missing",
              "transition" => $transition,
              "comment_id" => is_array($comment) ? ($comment["skipped"] ?? false) : $comment->id,
              "issue" => $issueUrl,
          ], JSON_UNESCAPED_UNICODE), PHP_EOL;
          });
          }
          ' \
          </dev/null
          applied=$((applied + 1))
          echo "applied_row=$BUG_ID"
          done 3< <(printf '%s' "$ROWS_B64" | base64 -d; echo)
          [[ "$applied" == "$ROW_COUNT" ]] || { echo "applied $applied of $ROW_COUNT rows"; exit 1; }
          echo "applied $applied of $ROW_COUNT rows"
          REMOTE
          rc=${PIPESTATUS[0]}
          set -e
          APPLIED="$({ grep -E '^applied_row=[0-9]+$' "$RUNNER_TEMP/write.log" || true; } | cut -d= -f2 | jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "applied=$APPLIED" >> "$GITHUB_OUTPUT"
          echo "Write result: $(jq length <<< "$APPLIED") of $ROW_COUNT row(s) applied (exit $rc)." >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  # F12/F14: a logged suggestion's issue is the backlog; label it so reconcile keeps it open.
  label-logged:
    needs: [preview, triage]
    # always(): label the rows that were written even if a later row failed.
    if: always() && needs.preview.outputs.logged_issues != '[]' && needs.triage.outputs.applied != '' && needs.triage.outputs.applied != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Label the backlog issues in-app:logged
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LOGGED_ISSUES: ${{ needs.preview.outputs.logged_issues }}
          APPLIED: ${{ needs.triage.outputs.applied }}
        run: |
          set -euo pipefail
          gh label create in-app:logged --force --color C2E0C6 --description "F12: in-app suggestion closed as logged; this issue is the backlog"
          for GITHUB_ISSUE_URL in $(jq -r --argjson a "$APPLIED" '.[] | select(.[0] as $id | $a | index($id)) | .[1]' <<< "$LOGGED_ISSUES"); do
            [[ "$GITHUB_ISSUE_URL" =~ ^https://github\.com/${GITHUB_REPOSITORY}/issues/[0-9]+$ ]] || { echo "github_issue_url must be an issue in this repository"; exit 1; }
            gh issue edit "$GITHUB_ISSUE_URL" --add-label in-app:logged
          done
