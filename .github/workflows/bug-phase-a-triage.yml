name: Bug Phase-A triage write-back

# Narrow, auditable write-back for a freshly verified in-app bug.
# This workflow never resolves a bug. With close_as_logged it closes a
# suggestion/ux/not-planned/duplicate report via BugReportService::closeAsLogged (F12).
on:
  workflow_dispatch:
    inputs:
      bug_id:
        description: In-app bug ID
        required: true
        type: string
      github_issue_url:
        description: GitHub issue URL, required in the public reply
        required: true
        type: string
      disposition:
        description: Product disposition kind validated by BugReportService
        required: true
        default: bug
        type: string
      public_reply:
        description: Public reply to post on the in-app bug
        required: true
        type: string
      close_as_logged:
        description: Close as logged (suggestion, ux_friction, not_planned, duplicate); reporter reply reopens
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pinned SSH trust helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            .github/actions/production-ssh-trust
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$PI_SSH_KEY"
          test -n "$PI_SSH_HOST"
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Write triage and public reply
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          BUG_ID: ${{ inputs.bug_id }}
          GITHUB_ISSUE_URL: ${{ inputs.github_issue_url }}
          DISPOSITION: ${{ inputs.disposition }}
          PUBLIC_REPLY: ${{ inputs.public_reply }}
          CLOSE_AS_LOGGED: ${{ inputs.close_as_logged }}
        run: |
          set -euo pipefail
          [[ "$BUG_ID" =~ ^[0-9]+$ ]] || { echo "invalid bug_id"; exit 1; }
          [[ "$GITHUB_ISSUE_URL" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/issues/[0-9]+$ ]] || { echo "invalid github_issue_url"; exit 1; }
          [[ "$GITHUB_ISSUE_URL" == "https://github.com/${GITHUB_REPOSITORY}/issues/"* ]] || { echo "github_issue_url must be in this repository"; exit 1; }
          [[ "$DISPOSITION" =~ ^[a-z_]+$ ]] || { echo "invalid disposition syntax"; exit 1; }
          [[ "$PUBLIC_REPLY" == *"$GITHUB_ISSUE_URL"* ]] || { echo "public reply must contain github_issue_url"; exit 1; }
          [[ "$CLOSE_AS_LOGGED" =~ ^(true|false)$ ]] || { echo "invalid close_as_logged"; exit 1; }
          PUBLIC_REPLY_B64="$(printf '%s' "$PUBLIC_REPLY" | base64 | tr -d '\n')"
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_SSH_USER}@${PI_SSH_HOST}" \
            "BUG_ID='$BUG_ID' GITHUB_ISSUE_URL='$GITHUB_ISSUE_URL' DISPOSITION='$DISPOSITION' CLOSE_AS_LOGGED='$CLOSE_AS_LOGGED' PUBLIC_REPLY_B64='$PUBLIC_REPLY_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /home/admin/backend
          PUBLIC_REPLY="$(printf '%s' "$PUBLIC_REPLY_B64" | base64 -d)"
          export BUG_ID GITHUB_ISSUE_URL DISPOSITION PUBLIC_REPLY CLOSE_AS_LOGGED
          php artisan tinker --execute='
          $bugId = (int)getenv("BUG_ID");
          $issueUrl = (string)getenv("GITHUB_ISSUE_URL");
          $disposition = (string)getenv("DISPOSITION");
          $reply = (string)getenv("PUBLIC_REPLY");
          $bug = \App\Models\BugReport::find($bugId);
          if (!$bug) { throw new \RuntimeException("bug not found: ".$bugId); }
          $status = (string)$bug->status;
          // close_as_logged reruns may find the report already closed; closeAsLogged decides idempotently.
          $allowedStatuses = getenv("CLOSE_AS_LOGGED") === "true" ? ["new", "triaged", "closed"] : ["new", "triaged"];
          if (!in_array($status, $allowedStatuses, true)) {
              throw new \RuntimeException("refusing status: ".$status);
          }
          $admin = \Illuminate\Support\Facades\DB::table("UserCampus")
              ->where("Admin", 1)->where("Approved", 1)->orderBy("UserID")->value("UserID");
          $actor = $admin ? (int)$admin : 1;
          $svc = \App\Services\BugReportService::class;
          if (getenv("CLOSE_AS_LOGGED") === "true") {
              $closed = $svc::closeAsLogged($bugId, $actor, $disposition, $issueUrl, $reply);
              if (!($closed["ok"] ?? false)) { throw new \RuntimeException(json_encode($closed)); }
              echo json_encode(["bug_id" => $bugId, "from" => $status, "close_as_logged" => $closed, "issue" => $issueUrl], JSON_UNESCAPED_UNICODE), PHP_EOL;
          } else {
          $validatedDisposition = $svc::normalizeDispositionOptions([
              "disposition" => $disposition,
              "github_issue_url" => $issueUrl,
          ]);
          if (!($validatedDisposition["ok"] ?? false)) { throw new \RuntimeException(json_encode($validatedDisposition)); }
          $transition = null;
          if ($status === "new") {
              $transition = $svc::changeStatus($bugId, $actor, "triaged", "phase-a verified intake; GitHub issue=".$issueUrl, [
                  "disposition" => $disposition,
                  "github_issue_url" => $issueUrl,
              ]);
              if (!($transition["ok"] ?? false)) { throw new \RuntimeException(json_encode($transition)); }
          }
          $already = \App\Models\BugReportComment::query()->where("bug_report_id", $bugId)
              ->where("body", "like", "%".$issueUrl."%")->exists();
          $comment = $already ? ["ok" => true, "skipped" => true] : $svc::addComment($bugId, $actor, $reply, false);
          // addComment() returns the persisted BugReportComment model, while
          // an idempotent skip returns the small {ok, skipped} shape.
          $commentSucceeded = ($comment["ok"] ?? false) || isset($comment["id"]) || ($comment["skipped"] ?? false);
          if (!$commentSucceeded) { throw new \RuntimeException(json_encode($comment)); }
          $fresh = \App\Models\BugReport::find($bugId);
          echo json_encode([
              "bug_id" => $bugId,
              "from" => $status,
              "final" => $fresh ? (string)$fresh->status : "missing",
              "transition" => $transition,
              "comment_id" => is_array($comment) ? ($comment["skipped"] ?? false) : $comment->id,
              "issue" => $issueUrl,
          ], JSON_UNESCAPED_UNICODE), PHP_EOL;
          }
          '
          REMOTE

  # F12/F14: a logged suggestion's issue is the backlog; label it so reconcile keeps it open.
  label-logged:
    needs: triage
    if: inputs.close_as_logged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Label the backlog issue in-app:logged
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_ISSUE_URL: ${{ inputs.github_issue_url }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_ISSUE_URL" =~ ^https://github\.com/${GITHUB_REPOSITORY}/issues/[0-9]+$ ]] || { echo "github_issue_url must be an issue in this repository"; exit 1; }
          gh label create in-app:logged --force --color C2E0C6 --description "F12: in-app suggestion closed as logged; this issue is the backlog"
          gh issue edit "$GITHUB_ISSUE_URL" --add-label in-app:logged
