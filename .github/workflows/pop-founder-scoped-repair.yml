name: Founder POP Huang contract repair
# One-case control-plane adapter. Execution stays on the Pi scheduler and the
# human Bearer session never leaves the Pi.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run or approve (approve waits for Pi-local verify)
        required: true
        type: choice
        options: [dry-run, approve]
        default: dry-run
      confirm:
        description: Exact Founder confirmation for the selected mode
        required: true
        type: string
      deployed_backend_sha:
        description: Exact backend SHA already present in production
        required: true
        type: string
        default: 1e186d7a26bea4d29e330f895a080691cb001187
permissions:
  contents: read
concurrency:
  group: alltrue-production-side-effects-v2
  cancel-in-progress: false
jobs:
  guard:
    name: Validate exact Huang repair gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject scope or confirmation drift
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          INPUT_SHA: ${{ inputs.deployed_backend_sha }}
          EXPECTED_SHA: 1e186d7a26bea4d29e330f895a080691cb001187
        run: |
          set -euo pipefail
          [[ "$MODE" == dry-run || "$MODE" == approve ]] || exit 1
          [[ "$INPUT_SHA" == "$EXPECTED_SHA" ]] || {
            echo '::error::The approved production backend SHA is not the exact known deployment.'
            exit 1
          }
          if [[ "$MODE" == dry-run ]]; then
            [[ "$CONFIRM" == DRY_RUN_HUANG_YIKUI_MATH_20260902 ]] || exit 1
          else
            [[ "$CONFIRM" == APPROVE_HUANG_YIKUI_MATH_20260902 ]] || exit 1
          fi
          echo "Founder gate passed: mode=$MODE backend_sha=$EXPECTED_SHA scope=single_student_contract"
  repair:
    name: Pi-local short-lived POP repair
    needs: guard
    if: ${{ needs.guard.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-activation
    steps:
      - name: Use pinned Pi SSH host identity
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$PI_SSH_KEY" && test -n "$PI_HOST_KEY"
          SSH_DIR="$RUNNER_TEMP/pop-founder-repair-ssh"
          install -d -m 700 "$SSH_DIR"
          printf '%s' "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > "$SSH_DIR/deploy_key"
          printf '%s\n' "$PI_HOST_KEY" > "$SSH_DIR/known_hosts"
          chmod 600 "$SSH_DIR/deploy_key" "$SSH_DIR/known_hosts"
          trap 'rm -f "$SSH_DIR/deploy_key" "$SSH_DIR/known_hosts"' EXIT
          ssh -i "$SSH_DIR/deploy_key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            "${{ secrets.PI_SSH_USER }}@${{ secrets.PI_SSH_HOST }}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          umask 077
          cd /home/admin/backend
          BASE_URL=https://daan.lifenet.com.tw
          TARGET_SHA=1e186d7a26bea4d29e330f895a080691cb001187
          MODE='${{ inputs.mode }}'
          WORK_DIR="$(mktemp -d /tmp/pop-founder-huang.XXXXXX)"
          TOKEN='' MACHINE_KEY=''
          cleanup() {
            unset TOKEN MACHINE_KEY PARAMETERS_JSON
            rm -f "$WORK_DIR"/*
            rmdir "$WORK_DIR" 2>/dev/null || true
          }
          trap cleanup EXIT
          manifest="$WORK_DIR/manifest.json"
          curl -sS --fail --proto '=https' --tlsv1.2 "$BASE_URL/deployment.json" -o "$manifest"
          manifest_sha="$(python3 - "$manifest" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1]))['backend_sha'])
          PY
          )"
          [[ "$manifest_sha" == "$TARGET_SHA" ]] || {
            echo "::error::production backend SHA drifted: manifest=$manifest_sha expected=$TARGET_SHA"
            exit 1
          }
          echo "production deployment gate passed: backend_sha=$manifest_sha"
          # Exact catalog-bound parameters; no caller-provided scope.
          PARAMETERS_JSON='{"parameters":{"student_id":30,"campus_id":9,"subject_id":66,"source_student_class_id":2531,"target_student_class_id":3379,"preserve_session_ids":[24712,21907],"transfer_session_ids":[26552,21910,24805,26006,29478],"session_expectations":[{"id":24712,"date":"2026-06-13","start_time":"10:00","end_time":"12:00","status":"completed"},{"id":21907,"date":"2026-07-04","start_time":"10:00","end_time":"12:00","status":"attended"},{"id":26552,"date":"2026-08-01","start_time":"10:00","end_time":"12:00","status":"attended"},{"id":21910,"date":"2026-08-08","start_time":"10:00","end_time":"12:00","status":"attended"},{"id":24805,"date":"2026-08-15","start_time":"10:00","end_time":"12:00","status":"attended"},{"id":26006,"date":"2026-08-22","start_time":"10:00","end_time":"12:00","status":"attended"},{"id":29478,"date":"2026-08-29","start_time":"10:00","end_time":"12:00","status":"attended"}],"expected_source_charge":4400,"expected_target_charge":5200,"source_charge":2200,"target_charge":6500,"source_invoice_id":null,"target_invoice_id":1601,"expected_source_invoice_total":0,"expected_target_invoice_total":4400,"reason":"huang-yikui-contract-repair","decision_reference":"issue-2318"},"idempotency_key":"founder-huang-yikui-math-20260902"}'
          MACHINE_KEY_FILE=/home/admin/backend/storage/app/private/pop-machine.key
          [[ -f "$MACHINE_KEY_FILE" ]] || {
            echo '::error::host-local POP machine identity is missing; no identity bootstrap is allowed here'
            exit 1
          }
          MACHINE_KEY="$(<"$MACHINE_KEY_FILE")"
          [[ "$MACHINE_KEY" =~ ^pop_machine_[A-Za-z0-9]+$ ]] || { echo '::error::POP machine key format check failed'; exit 1; }
          post_machine() {
            local path="$1" body="$2" output="$3"
            curl -sS --proto '=https' --tlsv1.2 \
              -H "X-POP-MACHINE-KEY: $MACHINE_KEY" \
              -H 'Accept: application/json' -H 'Content-Type: application/json' \
              --data "$body" -o "$output" -w '%{http_code}' "$BASE_URL$path"
          }
          draft="$WORK_DIR/draft.json"
          draft_status="$(post_machine /api/v1/pop/machine/operations/course-contract-repair/draft "$PARAMETERS_JSON" "$draft")"
          [[ "$draft_status" == 201 || "$draft_status" == 200 ]] || {
            echo "::error::POP draft rejected with HTTP $draft_status"
            exit 1
          }
          REQUEST_ID="$(python3 - "$draft" <<'PY'
          import json, re, sys
          data = json.load(open(sys.argv[1])).get('data', {})
          request_id = str(data.get('id') or data.get('request_id') or '')
          if not re.fullmatch(r'[0-9a-fA-F-]{36}', request_id):
              raise SystemExit('draft response did not contain a request id')
          print(request_id)
          PY
          )"
          echo "request created/reused: request_id=$REQUEST_ID operation=course-contract-repair"
          dry_run="$WORK_DIR/dry-run.json"
          dry_status="$(post_machine "/api/v1/pop/machine/operations/requests/$REQUEST_ID/dry-run" '{}' "$dry_run")"
          [[ "$dry_status" == 200 ]] || {
            echo "::error::POP dry-run rejected with HTTP $dry_status"
            exit 1
          }
          dry_summary="$(python3 - "$dry_run" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1])).get('data', {})
          plan = data.get('plan') or {}
          errors = plan.get('errors') or data.get('errors') or []
          if not data.get('ok') or not plan.get('ok'):
              print(f'dry_run=failed plan_ok={bool(plan.get("ok"))} error_count={len(errors)}')
              raise SystemExit(1)
          print('dry_run=succeeded plan_ok=true transfer_count=%d preserve_count=%d' %
                (len(plan.get('transfer_session_ids') or []), len(plan.get('preserve_session_ids') or [])))
          PY
          )"
          echo "$dry_summary"
          if [[ "$MODE" == dry-run ]]; then
            unset MACHINE_KEY
            echo "Founder POP dry-run complete: no approval or production write requested"
            exit 0
          fi
          unset MACHINE_KEY
          # Read one existing, unexpired S session locally for approval only.
          auth_file="$WORK_DIR/auth"
          php artisan tinker --no-ansi --execute='
          $row = \Illuminate\Support\Facades\DB::table("auth_tokens as t")
            ->join("User as u", "u.id", "=", "t.user_id")
            ->where("u.type", "S")->where("t.expires_at", ">", now())
            ->where(function ($q) { $q->where("u.MustChangePassword", 0)->orWhereNull("u.MustChangePassword"); })
            ->orderByDesc("t.expires_at")->select("t.token")->first();
          if (!$row) throw new \RuntimeException("no unexpired super_admin session available on Pi");
          echo (string) $row->token;
          ' > "$auth_file"
          TOKEN="$(<"$auth_file")"; rm -f "$auth_file"
          [[ "$TOKEN" =~ ^[A-Za-z0-9]+$ ]] || { echo '::error::Pi short-lived super_admin session format check failed'; exit 1; }
          post_human() {
            local path="$1" body="$2" output="$3"
            curl -sS --proto '=https' --tlsv1.2 -H "Authorization: Bearer $TOKEN" \
              -H 'Accept: application/json' -H 'Content-Type: application/json' --data "$body" -o "$output" -w '%{http_code}' "$BASE_URL$path"
          }
          approval="$WORK_DIR/approval.json"
          approval_body='{"approval_reference":"founder-go-huang-yikui-math-20260902","commit_sha":"1e186d7a26bea4d29e330f895a080691cb001187","ttl_minutes":15}'
          approval_status="$(post_human "/api/v1/pop/operations/requests/$REQUEST_ID/approvals" "$approval_body" "$approval")"
          [[ "$approval_status" == 200 ]] || {
            echo "::error::POP approval rejected with HTTP $approval_status"
            exit 1
          }
          approval_summary="$(python3 - "$approval" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1])).get('data', {})
          if not data.get('ready') or not data.get('token'):
              raise SystemExit('approval did not become ready')
          print('approval=ready status=%s ttl=15m' % data.get('status', 'unknown'))
          PY
          )"
          echo "$approval_summary"
          unset TOKEN
          # Observe only. The workflow never invokes the executor; the Pi
          # scheduler consumes the approved request and records execute+verify.
          status_file="$WORK_DIR/status.json"
          for attempt in $(seq 1 45); do
            REQUEST_ID="$REQUEST_ID" php artisan tinker --no-ansi --execute='
            $request = \Illuminate\Support\Facades\DB::table("pop_operation_requests")->where("id", getenv("REQUEST_ID"))->first();
            $records = \Illuminate\Support\Facades\DB::table("pop_execution_records")->where("operation_id", getenv("REQUEST_ID"))->orderBy("created_at")->get(["phase", "result", "actor", "commit_sha", "approval_reference", "snapshot", "correlation_id"]);
            $correlations = $records->pluck("correlation_id")->filter()->values()->all();
            $audits = $correlations === [] ? collect() : \Illuminate\Support\Facades\DB::table("security_audit_events")->whereIn("correlation_id", $correlations)->get(["event_type", "outcome"]);
            $repairAudits = \Illuminate\Support\Facades\DB::table("security_audit_events")
              ->where("event_type", "pop.course_contract_repair")
              ->where("outcome", "success")
              ->where("campus_id", 9)
              ->where("occurred_at", ">=", $request->created_at)
              ->get(["metadata"])
              ->filter(function ($row) {
                $metadata = json_decode((string) $row->metadata, true) ?: [];
                return ($metadata["old_charge"] ?? null) === 2200 && ($metadata["new_charge"] ?? null) === 6500 && ($metadata["transferred_session_count"] ?? null) === 5;
              })->count();
            echo json_encode(["request_status" => (string) ($request->status ?? "missing"), "records" => $records->map(fn ($r) => ["phase" => (string) $r->phase, "result" => (string) $r->result, "actor" => (string) $r->actor, "commit_sha" => (string) $r->commit_sha, "approval_reference" => (string) $r->approval_reference, "snapshot_present" => (string) $r->snapshot !== "", "correlation_id" => (string) $r->correlation_id])->values()->all(), "audit_success_count" => $audits->where("outcome", "success")->count(), "repair_audit_count" => $repairAudits], JSON_THROW_ON_ERROR);
            ' > "$status_file"
            if poll_summary="$(TARGET_SHA="$TARGET_SHA" python3 - "$status_file" <<'PY'
          import json, os, sys
          body = json.load(open(sys.argv[1]))
          records = {row['phase']: row for row in body.get('records', [])}
          execute = records.get('execute', {})
          verify = records.get('verify', {})
          ready = (
              body.get('request_status') == 'succeeded' and
              execute.get('result') == 'succeeded' and verify.get('result') == 'succeeded' and
              execute.get('actor') == 'pop-pi-local' and verify.get('actor') == 'pop-pi-local' and
              execute.get('commit_sha') == os.environ['TARGET_SHA'] and verify.get('commit_sha') == os.environ['TARGET_SHA'] and
              execute.get('approval_reference') == 'founder-go-huang-yikui-math-20260902' and
              verify.get('approval_reference') == 'founder-go-huang-yikui-math-20260902' and
              execute.get('snapshot_present') is True and body.get('audit_success_count', 0) >= 2 and
              body.get('repair_audit_count', 0) >= 1
          )
          if ready:
              print('pi_execute=succeeded pi_verify=succeeded audit=verified rollback_snapshot=present')
              raise SystemExit(0)
          if body.get('request_status') in {'failed', 'verification_failed', 'rolled_back'} or verify.get('result') in {'failed', 'verification_failed'}:
              print('pi_local=failed request_status=%s execute=%s verify=%s' % (body.get('request_status'), execute.get('result', 'missing'), verify.get('result', 'pending')))
              raise SystemExit(1)
          print('pi_local=pending request_status=%s execute=%s verify=%s' % (body.get('request_status'), execute.get('result', 'pending'), verify.get('result', 'pending')))
          raise SystemExit(2)
          PY
            )"; then
              echo "$poll_summary"
              exit 0
            else
              poll_rc=$?
              echo "$poll_summary"
              [[ "$poll_rc" == 2 ]] || exit "$poll_rc"
            fi
            sleep 15
          done
          echo '::error::Pi-local execute/verify did not complete within the bounded observation window'
          exit 1
          REMOTE
