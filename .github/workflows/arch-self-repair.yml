name: Architecture Self-Repair

# The diagnostic+repair half of the self-evolving system. Unlike arch-fitness.yml (fail-closed
# enforcement), this is NON-BLOCKING: it scans for structural tension and PROPOSES evolution
# (auto-generated ADR drafts + patch designs + simulated impact). See scripts/arch-evolve.mjs.
on:
  pull_request:

jobs:
  evolve:
    name: Generate evolution proposals
    runs-on: [self-hosted, Linux, X64, wsl-ci, alltrue-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Detect tension & generate ADR drafts
        run: node scripts/arch-evolve.mjs
      - name: Upload evolution proposals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-evolution-proposals
          path: docs/adr/drafts/
          if-no-files-found: ignore
