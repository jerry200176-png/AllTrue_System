# Read-only Pi diagnose: who (user id) scheduled a given student's ClassSession and who marked attendance.
# Manual dispatch only. No writes — SELECT-only queries via scripts/diagnose-student-session.sh.
# Public repo (#3605): inputs take a student_id (never a name); the log, artifact and summary carry
# ids, statuses, dates, amounts and counts only (free text is reported as a length).
name: Student Session Diagnose (read-only)

on:
  workflow_dispatch:
    inputs:
      student_id:
        description: "Student id (numeric; never a name)"
        required: true
        type: string
      date:
        description: "Target session date YYYY-MM-DD"
        required: true
        type: string
      campus_id:
        description: "Campus id"
        required: true
        type: string
        default: "9"

concurrency:
  group: student-session-diagnose
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    name: Production read-only student session scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Run diagnose on Pi
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          STUDENT_ID: ${{ inputs.student_id }}
          DATE: ${{ inputs.date }}
          CAMPUS_ID: ${{ inputs.campus_id || '9' }}
        run: |
          set -euo pipefail
          [[ "$STUDENT_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'student_id must be a numeric id'; exit 1; }
          SCRIPT_B64=$(base64 -w0 scripts/diagnose-student-session.sh)
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${PI_SSH_USER}@${PI_SSH_HOST}" \
            SCRIPT_B64="$SCRIPT_B64" STUDENT_ID="$STUDENT_ID" DATE="$DATE" CAMPUS_ID="$CAMPUS_ID" \
            'bash -s' <<'ENDSSH'
          set -euo pipefail
          echo "$SCRIPT_B64" | base64 -d > /tmp/diagnose-student-session.sh
          chmod +x /tmp/diagnose-student-session.sh
          STUDENT_ID="$STUDENT_ID" DATE="$DATE" CAMPUS_ID="$CAMPUS_ID" \
            bash /tmp/diagnose-student-session.sh | tee /tmp/student-session-diagnose.txt
          rm -f /tmp/diagnose-student-session.sh
          ENDSSH

      - name: Capture remote output to artifact
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/diag-out
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${PI_SSH_USER}@${PI_SSH_HOST}" \
            'cat /tmp/student-session-diagnose.txt' > /tmp/diag-out/diagnose.txt
          cat /tmp/diag-out/diagnose.txt

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: student-session-diagnose
          path: /tmp/diag-out/diagnose.txt
          retention-days: 14

      - name: Job summary
        run: |
          {
            echo '### Student session diagnose'
            echo '```'
            cat /tmp/diag-out/diagnose.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
