name: In-app #173 Supersede Repair (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (default) or execute or rollback"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - execute
          - rollback
      confirm:
        description: "For execute/rollback only: type I_APPROVE_173_SUPERSEDE_B"
        required: false
        type: string
      actor:
        description: "Audit actor label"
        required: false
        default: "gha:173-supersede"
        type: string

concurrency:
  group: repair-173-supersede
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    name: Run allowlisted #173 supersede repair
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout pinned SSH trust helper
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions/production-ssh-trust
          sparse-checkout-cone-mode: false
      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Validate inputs
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          case "$MODE" in
            dry-run|execute|rollback) ;;
            *) echo "::error::invalid mode"; exit 1 ;;
          esac
          if [ "$MODE" != "dry-run" ]; then
            [ "$CONFIRM" = "I_APPROVE_173_SUPERSEDE_B" ] || {
              echo "::error::execute/rollback requires exact confirmation string"
              exit 1
            }
          fi

      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Run repair on production
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          MODE: ${{ inputs.mode }}
          ACTOR: ${{ inputs.actor }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${PI_SSH_USER}@${PI_SSH_HOST}" \
            MODE="$MODE" ACTOR="$ACTOR" 'bash -s' <<'ENDSSH'
          set -euo pipefail
          cd /home/admin/backend

          echo "=== mode=${MODE} ==="
          echo "TIP: session_corrections is authoritative. Red X after mutation ≠ NOT_APPLIED."
          echo "States: NOT_APPLIED | APPLIED_AND_VERIFIED | APPLIED_POSTVERIFY_FAILED | ROLLED_BACK | ALREADY_APPLIED"

          set +e
          PRE=$(php artisan repair:supersede-renewal-session --case=173 2>&1)
          PRE_EC=$?
          set -e
          echo "$PRE"
          if echo "$PRE" | grep -qiE 'ALREADY APPLIED|Already applied'; then
            echo "REPAIR_STATE=ALREADY_APPLIED"
            if [ "${MODE}" = "dry-run" ]; then exit 0; fi
            if [ "${MODE}" = "execute" ]; then
              echo "Refusing duplicate execute — correction ledger shows applied."
              exit 0
            fi
          fi

          if [ "${MODE}" = "dry-run" ]; then
            echo "Dry-run complete; no production data was changed."
            exit 0
          fi

          TS=$(date '+%Y-%m-%d_%H%M%S')
          mkdir -p /home/admin/backups/emergency
          BACKUP_FILE="/home/admin/backups/emergency/db_pre_173_supersede_${TS}.sql.gz"
          DB_USER="$(grep '^DB_USERNAME=' /home/admin/backend/.env | cut -d= -f2-)"
          mysqldump -h 127.0.0.1 -u "$DB_USER" -p"$(grep '^DB_PASSWORD=' /home/admin/backend/.env | cut -d= -f2-)" \
            --single-transaction AllTrue \
            ClassSession StudentClass LearningRecord Invoice Payment session_corrections \
            | gzip > "$BACKUP_FILE"
          echo "Backup: $BACKUP_FILE"
          test -s "$BACKUP_FILE"

          export ALLOW_PROD_REPAIR=1
          set +e
          if [ "${MODE}" = "execute" ]; then
            SNAP="storage/app/repair-snapshots/173-supersede-${TS}.json"
            php artisan repair:supersede-renewal-session --case=173 --execute --force \
              --actor="${ACTOR}" --snapshot="$SNAP"
            MUT_EC=$?
            echo "SNAPSHOT=$SNAP MUT_EC=$MUT_EC"
          else
            php artisan repair:supersede-renewal-session --case=173 --rollback --execute --force
            MUT_EC=$?
            echo "REPAIR_STATE=ROLLED_BACK_OR_FAILED exit=$MUT_EC"
            unset ALLOW_PROD_REPAIR
            exit "$MUT_EC"
          fi
          unset ALLOW_PROD_REPAIR

          # Post-verify: full facade FQCN (avoid Class "DB" not found). Correction ledger is authoritative.
          set +e
          php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $DB = Illuminate\Support\Facades\DB::class;
            $out = [
              "s11292" => $DB::table("ClassSession")->where("id", 11292)->first(["id","Status","StudentClassID"]),
              "s16951" => $DB::table("ClassSession")->where("id", 16951)->first(["id","Status","StudentClassID"]),
              "correction" => $DB::table("session_corrections")->where("session_id", 11292)->whereNull("rolled_back_at")->orderByDesc("id")->first(),
            ];
            echo json_encode($out, JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT), PHP_EOL;
            $ok = $out["correction"] && strtolower((string)($out["s11292"]->Status ?? "")) === "cancelled";
            exit($ok ? 0 : 1);
          '
          VER_EC=$?
          set -e
          if [ "$MUT_EC" -ne 0 ]; then
            echo "REPAIR_STATE=NOT_APPLIED_OR_FAILED mut=$MUT_EC"
            exit "$MUT_EC"
          fi
          if [ "$VER_EC" -ne 0 ]; then
            echo "REPAIR_STATE=APPLIED_POSTVERIFY_FAILED"
            echo "::warning::Mutation committed (session_corrections). Do NOT re-run execute blindly."
            exit 42
          fi
          echo "REPAIR_STATE=APPLIED_AND_VERIFIED"
          ENDSSH
