name: Production Case Dump (read-only)

on:
  workflow_dispatch:
    inputs:
      case_key:
        description: 'Bounded case to inspect'
        required: true
        type: choice
        options:
          - schedule_241
          - billing_huang
          - fixed_slot_huang
          - billing_linlai
          - parent_lou
          - contract_session_chen
      student_name:
        description: 'Student name for bounded case probe (PII is not written to the artifact)'
        required: false
        default: ''
        type: string
      student_class_id:
        description: 'Optional StudentClass ID for billing probe (scopes the read-only case without exporting PII)'
        required: false
        default: ''
        type: string
      subject_name:
        description: 'Subject name for billing probe (PII is not written to the artifact)'
        required: false
        default: '數學'
        type: string

permissions:
  contents: read

concurrency:
  group: production-case-dump-${{ inputs.case_key }}
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ssh-keyscan -H "$PI_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            :
          elif [[ -n "${PI_HOST_KEY:-}" ]]; then
            printf '%s\n' "$PI_HOST_KEY" > ~/.ssh/known_hosts
          else
            echo '::error::no host key available'; exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Run bounded read-only production probe
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          CASE_KEY: ${{ inputs.case_key }}
          TARGET_STUDENT_NAME: ${{ inputs.student_name }}
          TARGET_STUDENT_CLASS_ID: ${{ inputs.student_class_id }}
          TARGET_SUBJECT_NAME: ${{ inputs.subject_name }}
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY' > /tmp/production_case_probe.php
          import os
          import json
          case = os.environ['CASE_KEY']
          if case not in {'schedule_241', 'billing_huang', 'fixed_slot_huang', 'billing_linlai', 'parent_lou', 'contract_session_chen'}:
              raise SystemExit('unsupported case')
          target_student_name = os.environ.get('TARGET_STUDENT_NAME') or ('黃品皓' if case in {'billing_huang', 'fixed_slot_huang'} else ('陳嘉軒' if case == 'contract_session_chen' else '林奕安'))
          target_student_class_id = os.environ.get('TARGET_STUDENT_CLASS_ID') or ''
          if target_student_class_id and (case not in {'billing_huang', 'fixed_slot_huang', 'contract_session_chen'} or not target_student_class_id.isdigit()):
              raise SystemExit('student_class_id is only supported as a numeric scoped case')
          target_subject_name = os.environ.get('TARGET_SUBJECT_NAME', '數學') or '數學'
          print(f'''<?php
          $case = {case!r};
          $targetStudentName = {json.dumps(target_student_name, ensure_ascii=False)};
          $targetStudentClassId = {int(target_student_class_id) if target_student_class_id else 'null'};
          $targetSubjectName = {json.dumps(target_subject_name, ensure_ascii=False)};
          $db = \\Illuminate\\Support\\Facades\\DB::class;
          $out = ['ok' => true, 'case' => $case, 'read_only' => true,
            'prod_head' => trim((string)@shell_exec('git rev-parse HEAD'))];
          if ($case === 'schedule_241') {{
            $campusId = 9;
            $targetDate = '2026-08-29';
            $targetStudentIds = $db::table('Student')->where('CampusID', $campusId)
              ->where('name', 'like', '%洪睿淵%')->pluck('id')->map(fn ($id) => (int)$id)->all();
            $classes = $db::table('StudentClass as sc')
              ->leftJoin('Subject as sub', 'sub.id', '=', 'sc.SubjectID')
              ->whereIn('sc.StudentID', $targetStudentIds)
              ->where(function ($q) {{ $q->where('sc.Stop', 0)->orWhereNull('sc.Stop'); }})
              ->where(function ($q) use ($targetDate) {{
                $q->whereNull('sc.StartDate')->orWhereDate('sc.StartDate', '<=', $targetDate);
              }})
              ->where(function ($q) use ($targetDate) {{
                $q->whereNull('sc.EndDate')->orWhereDate('sc.EndDate', '>=', $targetDate);
              }})
              ->get(['sc.ID as class_id', 'sc.StudentID as student_id', 'sc.TeacherID as teacher_id',
                'sc.SubjectID as subject_id', 'sub.Subject_Name as subject_name', 'sc.ScheduleMode as schedule_mode',
                'sc.StartDate as start_date', 'sc.EndDate as end_date', 'sc.Stop as stop',
                'sc.scheduling_policy as scheduling_policy']);
            $classIds = $classes->pluck('class_id')->map(fn ($id) => (int)$id)->all();
            $out['target_student_ids'] = $targetStudentIds;
            $out['target_student_classes'] = $classes->map(fn ($r) => [
              'class_id'=>(int)$r->class_id, 'student_id'=>(int)$r->student_id,
              'teacher_id'=>(int)$r->teacher_id, 'subject_id'=>(int)$r->subject_id,
              'subject_name'=>(string)($r->subject_name ?? ''), 'schedule_mode'=>(string)($r->schedule_mode ?? ''),
              'start_date'=>$r->start_date, 'end_date'=>$r->end_date,
              'stop'=>(int)($r->stop ?? 0), 'scheduling_policy'=>$r->scheduling_policy,
            ])->values()->all();
            $out['class_session_slots'] = $classIds === [] ? [] : $db::table('ClassSession')
              ->whereIn('StudentClassID', $classIds)->whereDate('SessionDate', $targetDate)
              ->whereRaw('TIME(StartTime) = ?', ['13:00:00'])
              ->get(['id', 'StudentClassID as class_id', 'SessionDate as session_date', 'StartTime as start_time', 'EndTime as end_time', 'Status as status'])
              ->map(fn ($r) => ['id'=>(int)$r->id, 'class_id'=>(int)$r->class_id,
                'session_date'=>(string)$r->session_date, 'start_time'=>substr((string)$r->start_time, 0, 5),
                'end_time'=>substr((string)$r->end_time, 0, 5), 'status'=>(string)$r->status])->values()->all();
            $out['schedule_slots'] = $classIds === [] ? [] : $db::table('schedules')
              ->whereIn('student_course_id', $classIds)->whereDate('schedule_date', $targetDate)
              ->whereRaw('TIME(start_time) = ?', ['13:00:00'])
              ->get(['id', 'student_course_id as class_id', 'schedule_date as session_date', 'start_time', 'end_time', 'status', 'teacher_id'])
              ->map(fn ($r) => ['id'=>(int)$r->id, 'class_id'=>(int)$r->class_id,
                'session_date'=>(string)$r->session_date, 'start_time'=>substr((string)$r->start_time, 0, 5),
                'end_time'=>substr((string)$r->end_time, 0, 5), 'status'=>(string)$r->status,
                'teacher_id'=>$r->teacher_id === null ? null : (int)$r->teacher_id])->values()->all();
            $invoke = function ($controller, string $method, array $args = []) {{
              $reflection = new \\ReflectionMethod($controller, $method);
              $reflection->setAccessible(true);
              return $reflection->invokeArgs($controller, $args);
            }};
            $teacherIds = $classes->pluck('teacher_id')->map(fn ($id) => (int)$id)->filter()->unique()->values()->all();
            $teacherResults = [];
            foreach ($teacherIds as $teacherId) {{
              $request = \\Illuminate\\Http\\Request::create('/api/v1/class-sessions/projection', 'GET', [
                'start'=>'2026-08-23', 'end'=>$targetDate, 'branch_id'=>$campusId,
              ]);
              $request->attributes->set('auth_role', 'teacher');
              $request->attributes->set('auth_teacher_id', $teacherId);
              $request->attributes->set('auth_campus_ids', [$campusId]);
              app()->instance('request', $request);
              $controller = app(\\App\\Http\\Controllers\\ClassSessionController::class);
              $query = $invoke($controller, 'buildClassSessionIndexQuery', [$request]);
              $items = $invoke($controller, 'fetchAllClassSessionIndexRows', [$query]);
              $byClass = $invoke($controller, 'buildByClassMapFromItems', [$items]);
              $projected = $invoke($controller, 'buildProjectedByClassForIndex', [$byClass, '2026-08-23', $targetDate, [], true]);
              $ownedIds = $classes->where('teacher_id', $teacherId)->pluck('class_id')->map(fn ($id) => (int)$id)->all();
              $materialized = collect($items)->filter(fn ($r) => in_array((int)($r->student_class_id ?? 0), $ownedIds, true)
                && ($r->session_date ?? '') === $targetDate && ($r->start_time ?? '') === '13:00')
                ->map(fn ($r) => ['id'=>(int)$r->id, 'class_id'=>(int)$r->student_class_id, 'status'=>(string)$r->status])->values()->all();
              $projectedMatches = [];
              foreach ($projected as $classId => $slots) {{
                if (!in_array((int)$classId, $ownedIds, true)) continue;
                foreach ($slots as $slot) if (($slot['session_date'] ?? '') === $targetDate && ($slot['start_time'] ?? '') === '13:00')
                  $projectedMatches[] = ['class_id'=>(int)$classId, 'kind'=>(string)($slot['kind'] ?? 'projected')];
              }}
              $teacherResults[] = ['teacher_id'=>$teacherId, 'owned_target_class_ids'=>$ownedIds,
                'materialized_target_slots'=>$materialized, 'projected_target_slots'=>$projectedMatches,
                'target_slot_visible'=>($materialized !== [] || $projectedMatches !== [])];
            }}
            $out['teacher_results'] = $teacherResults;
          }} elseif ($case === 'fixed_slot_huang') {{
            $campusId = 9;
            $studentQuery = $db::table('Student')->where('CampusID', $campusId);
            $studentIds = $targetStudentClassId !== null
              ? $db::table('StudentClass as sc')->join('Student as st', 'st.id', '=', 'sc.StudentID')
                ->where('sc.ID', $targetStudentClassId)->where('st.CampusID', $campusId)->pluck('sc.StudentID')
                ->map(fn ($id) => (int)$id)->all()
              : $studentQuery->whereRaw('TRIM(name) = ?', [$targetStudentName])->pluck('id')
                ->map(fn ($id) => (int)$id)->all();
            if ($studentIds === [] && $targetStudentClassId === null) {{
              $studentIds = $db::table('Student')
                ->where('name', 'like', '%' . $targetStudentName . '%')->pluck('id')
                ->map(fn ($id) => (int)$id)->all();
            }}
            $classes = $db::table('StudentClass as sc')->whereIn('sc.StudentID', $studentIds)
              ->when($targetStudentClassId !== null, fn ($query) => $query->where('sc.ID', $targetStudentClassId))
              ->orderBy('sc.ID')->get(['sc.ID as class_id', 'sc.StudentID as student_id', 'sc.SubjectID as subject_id',
                'sc.TeacherID as teacher_id', 'sc.ScheduleMode as schedule_mode', 'sc.StartDate as start_date',
                'sc.EndDate as end_date', 'sc.Stop as stop', 'sc.week', 'sc.time', 'sc.week1', 'sc.time1',
                'sc.week2', 'sc.time2', 'sc.week3', 'sc.time3', 'sc.week4', 'sc.time4', 'sc.week5', 'sc.time5',
                'sc.week6', 'sc.time6']);
            $classIds = $classes->pluck('class_id')->map(fn ($id) => (int)$id)->all();
            $slotFields = ['week', 'week1', 'week2', 'week3', 'week4', 'week5', 'week6'];
            $slotsFor = function ($row) use ($slotFields) {{
              $slots = [];
              foreach ($slotFields as $field) {{
                $day = (int)($row->{{$field}} ?? 0);
                $timeField = $field === 'week' ? 'time' : str_replace('week', 'time', $field);
                $time = substr((string)($row->{{$timeField}} ?? ''), 0, 5);
                if ($day > 0 && $time !== '') $slots[] = ['weekday' => $day, 'time' => $time];
              }}
              return $slots;
            }};
            $approvedIds = $classIds === [] ? [] : $db::table('LearningRecords')
              ->whereIn('StudentClassID', $classIds)->where('Status', 'approved')->whereNotNull('ClassSessionID')
              ->pluck('ClassSessionID')->map(fn ($id) => (int)$id)->flip()->all();
            $signedInIds = $classIds === [] ? [] : $db::table('StudentSingIn')
              ->whereIn('StudentClassID', $classIds)->whereNotNull('ClassSessionID')
              ->pluck('ClassSessionID')->map(fn ($id) => (int)$id)->flip()->all();
            $lockedIds = $approvedIds + $signedInIds;
            $today = now()->toDateString();
            $sessions = $classIds === [] ? collect() : $db::table('ClassSession')
              ->whereIn('StudentClassID', $classIds)->where('Status', 'scheduled')->whereDate('SessionDate', '>=', $today)
              ->orderBy('SessionDate')->orderBy('StartTime')->get(['id', 'StudentClassID as class_id', 'SessionDate as session_date',
                'StartTime as start_time', 'EndTime as end_time', 'Status as status']);
            $out['campus_id'] = $campusId;
            $out['lookup_mode'] = $targetStudentClassId !== null ? 'student_class_id' : 'student_name';
            $out['student_count'] = count($studentIds);
            $out['target_classes'] = $classes->map(fn ($r) => [
              'class_id'=>(int)$r->class_id, 'student_id'=>(int)$r->student_id,
              'teacher_id'=>$r->teacher_id === null ? null : (int)$r->teacher_id,
              'schedule_mode'=>(string)($r->schedule_mode ?? ''), 'start_date'=>$r->start_date, 'end_date'=>$r->end_date,
              'stop'=>(int)($r->stop ?? 0), 'fixed_slots'=>$slotsFor($r),
            ])->values()->all();
            $out['future_scheduled_sessions'] = $sessions->map(fn ($r) => [
              'id'=>(int)$r->id, 'class_id'=>(int)$r->class_id, 'session_date'=>(string)$r->session_date,
              'weekday'=>(int)\\Carbon\\Carbon::parse($r->session_date)->dayOfWeekIso,
              'start_time'=>substr((string)$r->start_time, 0, 5), 'end_time'=>substr((string)$r->end_time, 0, 5),
              'locked'=>isset($lockedIds[(int)$r->id]),
            ])->values()->all();
            $slots = $classes->flatMap($slotsFor)->values();
            $weekdayKeys = $slots->pluck('weekday')->map(fn ($day) => (int)$day)->unique()->values()->all();
            $out['verification'] = [
              'student_found'=>count($studentIds) > 0,
              'has_wednesday'=>$slots->contains(fn ($slot) => (int)$slot['weekday'] === 3),
              'has_thursday'=>$slots->contains(fn ($slot) => (int)$slot['weekday'] === 4),
              'target_class_has_wednesday_and_thursday'=>$classes->contains(function ($row) use ($slotsFor) {{
                $days = collect($slotsFor($row))->pluck('weekday')->map(fn ($day) => (int)$day)->unique();
                return $days->contains(3) && $days->contains(4);
              }}),
              'future_session_count'=>$sessions->count(),
              'locked_future_session_count'=>$sessions->filter(fn ($r) => isset($lockedIds[(int)$r->id]))->count(),
              'expected_remove_thursday_workflow'=>'pure removal must not conflict with retained locked Wednesday',
              'read_only'=>true,
            ];
            $out['weekday_keys'] = $weekdayKeys;
          }} elseif ($case === 'contract_session_chen') {{
            $campusId = 9;
            $probeDates = ['2026-06-07', '2026-06-21'];
            $studentQuery = $db::table('Student');
            $studentIds = $targetStudentClassId !== null
              ? $db::table('StudentClass as sc')->join('Student as st', 'st.id', '=', 'sc.StudentID')
                ->where('sc.ID', $targetStudentClassId)->where('st.CampusID', $campusId)->pluck('sc.StudentID')
                ->map(fn ($id) => (int)$id)->all()
              : $studentQuery->whereRaw('TRIM(name) = ?', [$targetStudentName])->pluck('id')
                ->map(fn ($id) => (int)$id)->all();
            if ($studentIds === [] && $targetStudentClassId === null) {{
              $studentIds = $db::table('Student')
                ->where('name', 'like', '%' . $targetStudentName . '%')->pluck('id')
                ->map(fn ($id) => (int)$id)->all();
            }}
            $classes = $db::table('StudentClass as sc')->whereIn('sc.StudentID', $studentIds)
              ->when($targetStudentClassId !== null, fn ($query) => $query->where('sc.ID', $targetStudentClassId))
              ->orderBy('sc.ID')->get(['sc.ID as class_id', 'sc.StudentID as student_id', 'sc.SubjectID as subject_id',
                'sc.TeacherID as teacher_id', 'sc.PackageID as package_id', 'sc.ClassType as class_type',
                'sc.ScheduleMode as schedule_mode', 'sc.StartDate as start_date', 'sc.EndDate as end_date', 'sc.Stop as stop']);
            $classIds = $classes->pluck('class_id')->map(fn ($id) => (int)$id)->all();
            $sessionRows = $classIds === [] ? collect() : $db::table('ClassSession as cs')
              ->join('StudentClass as sc', 'sc.ID', '=', 'cs.StudentClassID')
              ->whereIn('cs.StudentClassID', $classIds)->whereIn('cs.SessionDate', $probeDates)
              ->orderBy('cs.SessionDate')->orderBy('cs.StartTime')->orderBy('cs.id')
              ->get(['cs.id', 'cs.StudentClassID as class_id', 'cs.SessionDate as session_date', 'cs.StartTime as start_time',
                'cs.EndTime as end_time', 'cs.Status as status', 'sc.StartDate as class_start_date', 'sc.EndDate as class_end_date',
                'sc.Stop as class_stop', 'sc.ClassType as class_type', 'sc.PackageID as package_id']);
            $scheduleRows = $classIds === [] ? collect() : $db::table('schedules as s')
              ->leftJoin('StudentClass as sc', 'sc.ID', '=', 's.student_course_id')
              ->where('s.student_id', $studentIds[0] ?? 0)->whereIn('s.schedule_date', $probeDates)
              ->orderBy('s.schedule_date')->orderBy('s.start_time')->orderBy('s.id')
              ->get(['s.id', 's.student_course_id as class_id', 's.schedule_date as session_date', 's.start_time', 's.end_time',
                's.status', 's.original_schedule_id', 'sc.StartDate as class_start_date', 'sc.Stop as class_stop',
                'sc.ClassType as class_type', 'sc.PackageID as package_id']);
            $excludedStatuses = ['cancelled', 'voided', 'leave', 'leave_adjusted', 'excused'];
            $overlaps = [];
            foreach ($sessionRows as $left) {{
              foreach ($sessionRows as $right) {{
                if ((int)$left->id >= (int)$right->id || (int)$left->class_id === (int)$right->class_id
                  || in_array(strtolower((string)$left->status), $excludedStatuses, true)
                  || in_array(strtolower((string)$right->status), $excludedStatuses, true)
                  || (int)($left->class_stop ?? 0) === 1 || (int)($right->class_stop ?? 0) === 1
                  || strtolower(trim((string)($left->class_type ?? ''))) === 'trial'
                  || strtolower(trim((string)($right->class_type ?? ''))) === 'trial'
                  || ((int)($left->package_id ?? 0) > 0 && (int)$left->package_id === (int)($right->package_id ?? 0))) continue;
                if ((string)$left->start_time < (string)$right->end_time && (string)$left->end_time > (string)$right->start_time) {{
                  $overlaps[] = ['left_session_id'=>(int)$left->id, 'left_class_id'=>(int)$left->class_id,
                    'right_session_id'=>(int)$right->id, 'right_class_id'=>(int)$right->class_id,
                    'session_date'=>(string)$left->session_date, 'left_start'=>(string)$left->start_time,
                    'left_end'=>(string)$left->end_time, 'right_start'=>(string)$right->start_time,
                    'right_end'=>(string)$right->end_time, 'reason'=>'class_session_student_overlap_guard'];
                }}
              }}
            }}
            $out['campus_id'] = $campusId;
            $out['lookup_mode'] = $targetStudentClassId !== null ? 'student_class_id' : 'student_name';
            $out['probe_dates'] = $probeDates;
            $out['student_ids'] = $studentIds;
            $out['student_count'] = count($studentIds);
            $out['target_classes'] = $classes->map(fn ($r) => ['class_id'=>(int)$r->class_id, 'student_id'=>(int)$r->student_id,
              'subject_id'=>(int)$r->subject_id, 'teacher_id'=>$r->teacher_id === null ? null : (int)$r->teacher_id,
              'package_id'=>$r->package_id === null ? null : (int)$r->package_id, 'class_type'=>(string)($r->class_type ?? ''),
              'schedule_mode'=>(string)($r->schedule_mode ?? ''), 'start_date'=>$r->start_date, 'end_date'=>$r->end_date,
              'stop'=>(int)($r->stop ?? 0)])->values()->all();
            $out['class_sessions'] = $sessionRows->map(fn ($r) => ['id'=>(int)$r->id, 'class_id'=>(int)$r->class_id,
              'session_date'=>(string)$r->session_date, 'start_time'=>substr((string)$r->start_time, 0, 8),
              'end_time'=>substr((string)$r->end_time, 0, 8), 'status'=>(string)$r->status,
              'class_start_date'=>$r->class_start_date, 'class_end_date'=>$r->class_end_date,
              'class_stop'=>(int)($r->class_stop ?? 0), 'class_type'=>(string)($r->class_type ?? ''),
              'package_id'=>$r->package_id === null ? null : (int)$r->package_id])->values()->all();
            $out['schedules'] = $scheduleRows->map(fn ($r) => ['id'=>(int)$r->id, 'class_id'=>$r->class_id === null ? null : (int)$r->class_id,
              'session_date'=>(string)$r->session_date, 'start_time'=>substr((string)$r->start_time, 0, 8),
              'end_time'=>substr((string)$r->end_time, 0, 8), 'status'=>(string)$r->status,
              'original_schedule_id'=>$r->original_schedule_id === null ? null : (int)$r->original_schedule_id,
              'class_start_date'=>$r->class_start_date, 'class_stop'=>$r->class_stop === null ? null : (int)$r->class_stop,
              'class_type'=>(string)($r->class_type ?? ''), 'package_id'=>$r->package_id === null ? null : (int)$r->package_id])->values()->all();
            $out['student_overlap_candidates'] = $overlaps;
            $out['verification'] = ['student_found'=>count($studentIds) > 0, 'read_only'=>true,
              'reported_dates_present'=>$sessionRows->pluck('session_date')->unique()->values()->all(),
              'actual_class_session_overlap_count'=>count($overlaps),
              'target_start_date_source'=>'StudentClass.StartDate (not inferred from first moved session)'];
          }} elseif ($case === 'billing_huang') {{
            $campusId = 9;
            $studentQuery = $db::table('Student')->where('CampusID', $campusId);
            $lookupMode = 'student_name_exact';
            if ($targetStudentClassId !== null) {{
              $studentIds = $db::table('StudentClass as sc')->join('Student as st', 'st.id', '=', 'sc.StudentID')
                ->where('sc.ID', $targetStudentClassId)->where('st.CampusID', $campusId)->pluck('sc.StudentID')
                ->map(fn ($id) => (int)$id)->all();
              $lookupMode = 'student_class_id';
            }} else {{
              $studentIds = $studentQuery->whereRaw('TRIM(name) = ?', [$targetStudentName])->pluck('id')
                ->map(fn ($id) => (int)$id)->all();
              if ($studentIds === []) {{
                $studentIds = $db::table('Student')->where('CampusID', $campusId)
                  ->where('name', 'like', '%' . $targetStudentName . '%')->pluck('id')
                  ->map(fn ($id) => (int)$id)->all();
                $lookupMode = 'student_name_contains';
              }}
            }}
            $classes = $db::table('StudentClass as sc')->whereIn('sc.StudentID', $studentIds)
              ->when($targetStudentClassId !== null, fn ($query) => $query->where('sc.ID', $targetStudentClassId))
              ->orderBy('sc.ID')->get(['sc.ID as class_id', 'sc.StudentID as student_id', 'sc.SubjectID as subject_id',
                'sc.Rate as rate', 'sc.rate_unit as rate_unit', 'sc.SessionCount as session_count',
                'sc.TotalHours as total_hours', 'sc.SessionDuration as session_duration', 'sc.Charge as charge',
                'sc.Paid as paid', 'sc.Stop as stop', 'sc.ScheduleMode as schedule_mode']);
            $studentIds = $classes->pluck('student_id')->unique()->map(fn ($id) => (int)$id)->values()->all();
            $classIds = $classes->pluck('class_id')->map(fn ($id) => (int)$id)->all();
            $sessionHours = $classIds === [] ? collect() : $db::table('ClassSession')
              ->whereIn('StudentClassID', $classIds)->whereIn('Status', ['scheduled', 'attended', 'completed'])
              ->selectRaw('StudentClassID as class_id, ROUND(SUM(TIMESTAMPDIFF(MINUTE, StartTime, EndTime)) / 60, 2) as actual_hours')
              ->groupBy('StudentClassID')->pluck('actual_hours', 'class_id');
            $out['campus_id'] = $campusId;
            $out['lookup_mode'] = $lookupMode;
            $out['student_count'] = count($studentIds);
            $out['target_class_count'] = count($classIds);
            $out['target_classes'] = $classes->map(fn ($r) => [
              'class_id'=>(int)$r->class_id, 'student_id'=>(int)$r->student_id, 'subject_id'=>(int)$r->subject_id,
              'rate'=>(float)$r->rate, 'rate_unit'=>(string)($r->rate_unit ?: 'session'),
              'session_count'=>(int)($r->session_count ?? 0), 'total_hours'=>(float)($r->total_hours ?? 0),
              'session_duration'=>(int)($r->session_duration ?? 0), 'charge'=>(float)$r->charge,
              'expected_charge'=>(string)($r->rate_unit ?: 'session') === 'hour'
                ? (float)round((float)$r->rate * (float)($r->total_hours ?? 0))
                : (float)round((float)$r->rate * (int)($r->session_count ?? 0)),
              'actual_session_hours'=>(float)($sessionHours->get($r->class_id) ?? 0),
              'paid'=>(int)$r->paid, 'stop'=>(int)$r->stop, 'schedule_mode'=>(string)$r->schedule_mode,
            ])->values()->all();
          }} elseif ($case === 'billing_linlai') {{
            $students = $db::table('Student')->where('CampusID', 9)->where('name', 'like', '%' . $targetStudentName . '%')
              ->get(['id', 'CampusID as campus_id']);
            $studentIds = $students->pluck('id')->map(fn ($id) => (int)$id)->all();
            $subjectIds = $db::table('Subject')->where('Subject_Name', 'like', '%' . $targetSubjectName . '%')
              ->pluck('id')->map(fn ($id) => (int)$id)->all();
            $classes = $db::table('StudentClass as sc')->whereIn('sc.StudentID', $studentIds)
              ->whereIn('sc.SubjectID', $subjectIds)->get(['sc.ID as class_id', 'sc.StudentID as student_id',
                'sc.SubjectID as subject_id', 'sc.Charge as charge', 'sc.Paid as paid', 'sc.PayDate as pay_date',
                'sc.Stop as stop', 'sc.ScheduleMode as schedule_mode']);
            $classIds = $classes->pluck('class_id')->map(fn ($id) => (int)$id)->all();
            $out['student_ids'] = $studentIds;
            $out['student_count'] = count($studentIds);
            $out['subject_ids'] = $subjectIds;
            $out['target_classes'] = $classes->map(fn ($r) => ['class_id'=>(int)$r->class_id,
              'student_id'=>(int)$r->student_id, 'subject_id'=>(int)$r->subject_id,
              'charge'=>(float)$r->charge, 'paid'=>(int)$r->paid, 'pay_date'=>$r->pay_date,
              'stop'=>(int)$r->stop, 'schedule_mode'=>(string)$r->schedule_mode])->values()->all();
            $groupsAvailable = \Illuminate\Support\Facades\Schema::hasTable('course_contract_groups')
              && \Illuminate\Support\Facades\Schema::hasTable('course_contract_group_members');
            $groups = $groupsAvailable && $studentIds !== []
              ? $db::table('course_contract_groups')
                ->whereIn('student_id', $studentIds)->where('campus_id', 9)
                ->orderBy('id')->get(['id', 'student_id', 'campus_id', 'subject_id', 'label', 'created_by', 'created_at', 'updated_at'])
              : collect();
            $groupIds = $groups->pluck('id')->map(fn ($id) => (int)$id)->all();
            $members = $groupsAvailable && $groupIds !== []
              ? $db::table('course_contract_group_members')->whereIn('group_id', $groupIds)
                ->whereNull('unlinked_at')->orderBy('group_id')->orderBy('sequence')->orderBy('id')
                ->get(['id', 'group_id', 'student_class_id', 'relation_type', 'effective_from', 'sequence', 'decision_reason', 'created_by', 'created_at', 'updated_at'])
              : collect();
            $membersByGroup = $members->groupBy('group_id');
            $out['course_contract_groups_available'] = $groupsAvailable;
            $out['course_contract_groups'] = $groups->map(fn ($g) => [
              'id'=>(int)$g->id, 'student_id'=>(int)$g->student_id, 'campus_id'=>(int)$g->campus_id,
              'subject_id'=>$g->subject_id === null ? null : (int)$g->subject_id,
              'label'=>$g->label, 'created_by'=>$g->created_by === null ? null : (int)$g->created_by,
              'created_at'=>$g->created_at, 'updated_at'=>$g->updated_at,
              'active_members'=>($membersByGroup->get($g->id, collect()))->map(fn ($m) => [
                'id'=>(int)$m->id, 'group_id'=>(int)$m->group_id,
                'student_class_id'=>(int)$m->student_class_id, 'relation_type'=>(string)$m->relation_type,
                'effective_from'=>$m->effective_from, 'sequence'=>(int)$m->sequence,
                'decision_reason'=>$m->decision_reason, 'created_by'=>$m->created_by === null ? null : (int)$m->created_by,
                'created_at'=>$m->created_at, 'updated_at'=>$m->updated_at,
              ])->values()->all(),
            ])->values()->all();
            $out['payment_reports'] = $classIds === [] ? [] : $db::table('payment_reports')
              ->whereIn('StudentClassID', $classIds)->orderBy('id')
              ->get(['id', 'StudentID as student_id', 'StudentClassID as class_id', 'InvoiceID as invoice_id',
                'payment_date', 'reported_amount', 'status', 'payment_id', 'created_at', 'updated_at'])
              ->map(fn ($r) => ['id'=>(int)$r->id, 'student_id'=>(int)$r->student_id, 'class_id'=>(int)$r->class_id,
                'invoice_id'=>$r->invoice_id === null ? null : (int)$r->invoice_id, 'payment_date'=>$r->payment_date,
                'reported_amount'=>(float)$r->reported_amount, 'status'=>(string)$r->status,
                'payment_id'=>$r->payment_id === null ? null : (int)$r->payment_id,
                'created_at'=>$r->created_at, 'updated_at'=>$r->updated_at])->values()->all();
            $out['invoices'] = $classIds === [] ? [] : $db::table('Invoice')->whereIn('StudentClassID', $classIds)
              ->get(['id', 'StudentClassID as class_id', 'Status as status', 'TotalAmount as total_amount', 'PaidAmount as paid_amount'])
              ->map(fn ($r) => ['id'=>(int)$r->id, 'class_id'=>(int)$r->class_id, 'status'=>(string)$r->status,
                'total_amount'=>(float)$r->total_amount, 'paid_amount'=>(float)$r->paid_amount])->values()->all();
            $out['payments'] = $classIds === [] ? [] : $db::table('Payment as p')
              ->join('Invoice as i', 'i.id', '=', 'p.InvoiceID')->whereIn('i.StudentClassID', $classIds)
              ->get(['p.id', 'i.StudentClassID as class_id', 'p.Amount as amount', 'p.payment_report_id'])
              ->map(fn ($r) => ['id'=>(int)$r->id, 'class_id'=>(int)$r->class_id, 'amount'=>(float)$r->amount,
                'payment_report_id'=>$r->payment_report_id === null ? null : (int)$r->payment_report_id])->values()->all();
          }} else {{
            $parentCampus = $db::table('Campus')->where('name', 'like', '%興隆%')->first(['id', 'name']);
            $parentCampusId = $parentCampus ? (int)$parentCampus->id : null;
            $parentStudentName = '樓兆尹';
            $parentStudents = $parentCampusId === null ? collect() : $db::table('Student')
              ->where('CampusID', $parentCampusId)->whereRaw('TRIM(name) = ?', [$parentStudentName])
              ->get(['id', 'CampusID as campus_id', 'Phone as legacy_phone', 'parent_phone', 'enable']);
            $parentStudentIds = $parentStudents->pluck('id')->map(fn ($id) => (int)$id)->all();
            $out['campus'] = ['found'=>$parentCampus !== null, 'campus_id'=>$parentCampusId];
            $out['student_count'] = count($parentStudentIds);
            $out['students'] = $parentStudents->map(fn ($r) => [
              'student_id'=>(int)$r->id, 'campus_id'=>(int)$r->campus_id,
              'enabled'=>(bool)$r->enable,
              'parent_phone_present'=>trim((string)($r->parent_phone ?? '')) !== '',
              'legacy_phone_present'=>trim((string)($r->legacy_phone ?? '')) !== '',
              'contact_phone_source'=>trim((string)($r->parent_phone ?? '')) !== '' ? 'parent_phone'
                : (trim((string)($r->legacy_phone ?? '')) !== '' ? 'Phone' : 'none'),
            ])->values()->all();
            $out['verified_bindings'] = $parentStudentIds === [] ? [] : $db::table('student_line_bindings')
              ->whereIn('student_id', $parentStudentIds)->where('campus_id', $parentCampusId)
              ->orderByDesc('bound_at')->get(['id', 'student_id', 'campus_id', 'bound_at', 'verified_at', 'verification_method'])
              ->map(fn ($r) => ['binding_id'=>(int)$r->id, 'student_id'=>(int)$r->student_id,
                'campus_id'=>(int)$r->campus_id, 'bound_at'=>$r->bound_at,
                'verified_at_present'=>$r->verified_at !== null, 'verification_method'=>$r->verification_method])->values()->all();
            $out['recent_attempts'] = $parentStudentIds === [] ? [] : $db::table('parent_binding_attempts')
              ->whereIn('student_id', $parentStudentIds)->where('campus_id', $parentCampusId)
              ->orderByDesc('occurred_at')->limit(20)
              ->get(['occurred_at', 'channel', 'method', 'outcome', 'reason_code', 'candidate_count', 'phone_match_count'])
              ->map(fn ($r) => ['occurred_at'=>$r->occurred_at, 'channel'=>$r->channel, 'method'=>$r->method,
                'outcome'=>$r->outcome, 'reason_code'=>$r->reason_code,
                'candidate_count'=>$r->candidate_count === null ? null : (int)$r->candidate_count,
                'phone_match_count'=>$r->phone_match_count === null ? null : (int)$r->phone_match_count])->values()->all();
          }}
          echo json_encode($out, JSON_UNESCAPED_UNICODE), PHP_EOL;
          ?>''')
          PY
          B64=$(base64 -w0 /tmp/production_case_probe.php)
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts "$PI_SSH_USER@$PI_SSH_HOST" \
            "B64='$B64' CASE_KEY='$CASE_KEY' bash -s" <<'REMOTE' | tee out/production-case.log
          set -euo pipefail
          cd /home/admin/backend
          probe_file="/tmp/production_case_probe_${CASE_KEY}.php"
          export PROBE_FILE="$probe_file"
          php -r 'file_put_contents(getenv("PROBE_FILE"), base64_decode(getenv("B64")));'
          php artisan tinker --execute="require '${probe_file}';"
          rm -f "${probe_file}"
          REMOTE
          python3 - <<'PY'
          import json
          from pathlib import Path
          text = Path('out/production-case.log').read_text(encoding='utf-8', errors='replace')
          obj = next((json.loads(line) for line in text.splitlines() if line.lstrip().startswith('{')), None)
          Path('out/production-case.json').write_text(json.dumps(obj or {'ok': False, 'raw_tail': text[-2000:]}, ensure_ascii=False, indent=2), encoding='utf-8')
          if not obj or not obj.get('ok'):
              raise SystemExit('probe did not return ok JSON')
          if obj.get('case') == 'fixed_slot_huang':
              verification = obj.get('verification') or {}
              if not verification.get('student_found'):
                  raise SystemExit('黃品皓 production target was not found')
              if not verification.get('target_class_has_wednesday_and_thursday'):
                  raise SystemExit('黃品皓 production target has no single fixed course with both Wednesday and Thursday')
          print('parsed read-only production case', obj.get('case'))
          PY

