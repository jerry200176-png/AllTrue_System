name: Deploy to Staging

# Deploys every green main to a DEDICATED staging host — deliberately NOT
# the production Pi. CONTROL_PLANE_CONTRACT.md I1 says only deploy.yml (or
# POP Executor) may execute changes on production; a second SSH path onto
# that same box would need a formal [contract-change] PR first. Targeting a
# separate host sidesteps that boundary entirely instead of reopening it.
#
# One-time manual setup required before this workflow can succeed:
# scripts/infra/setup-staging-env.sh (run once by a human on the staging
# host), plus these repo secrets:
#   STAGING_SSH_HOST, STAGING_SSH_USER, STAGING_SSH_KEY (base64, like PI_SSH_KEY)
#   STAGING_DB_USERNAME, STAGING_DB_PASSWORD

on:
  workflow_run:
    workflows: ["CI — PHPUnit Tests"]
    types: [completed]
    branches: [main]

  workflow_dispatch: {}

concurrency:
  group: staging-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$STAGING_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.STAGING_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to staging
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" << 'ENDSSH'
          set -uo pipefail
          cd /home/staging/AllTrue_System

          echo "=== [1/5] git fetch + reset ==="
          if ! git fetch origin main; then
            echo "❌ git fetch failed — aborting staging deploy"
            exit 1
          fi
          git reset --hard origin/main

          echo "=== [2/5] Composer dependencies ==="
          cd backend && composer install --no-interaction --prefer-dist --optimize-autoloader

          echo "=== [3/5] Migration (staging DB only) ==="
          php artisan migrate --force

          echo "=== [4/5] Frontend build ==="
          cd ../frontend && npm install --prefer-offline && npm run build

          echo "=== [5/5] Cache + reload ==="
          cd ../backend
          rm -f bootstrap/cache/packages.php bootstrap/cache/services.php
          php artisan optimize
          php artisan opcache:reset 2>/dev/null || true

          HEALTH=$(curl -s http://127.0.0.1/api/v1/health \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','?'))" \
            2>/dev/null || echo "error")
          if [ "$HEALTH" != "ok" ]; then
            echo "❌ Staging health check failed: $HEALTH"
            exit 1
          fi
          echo "✅ Staging deploy verified healthy"
          ENDSSH

      - name: Remove local key material
        if: always()
        run: rm -f ~/.ssh/deploy_key
