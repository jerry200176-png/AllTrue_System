name: Revert unintended in-app bug 235 resolution

# One-time, fail-closed correction for the unintended Phase-C status write.
# There are no inputs: this workflow can only ever operate on in-app bug #235.
on:
  push:
    branches: [main]
    paths:
      - 'operations/closeout/bug-235-status-revert.request.md'
      - '.github/workflows/bug-235-status-revert.yml'

concurrency:
  group: bug-235-status-revert
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Snapshot exact #235 state (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh out
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ssh-keyscan -H "$PI_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            :
          elif [[ -n "${PI_HOST_KEY:-}" ]]; then
            printf '%s\n' "$PI_HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::error::no host key"; exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Verify exact reversible state
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_SSH_USER}@${PI_SSH_HOST}" bash <<'REMOTE' | tee out/preflight.json
          set -euo pipefail
          cd /home/admin/backend
          php artisan tinker --execute='
          $bug = \App\Models\BugReport::find(235);
          $latest = \Illuminate\Support\Facades\DB::table("bug_report_status_logs")
              ->where("bug_report_id", 235)->orderByDesc("id")
              ->first(["id", "from_status", "to_status", "note", "created_at"]);
          if (!$bug || !$latest) { throw new \RuntimeException("missing bug or history"); }
          $note = (string)$latest->note;
          $expected = (int)$latest->id === 713
              && (string)$bug->status === "resolved"
              && (string)$latest->from_status === "in_progress"
              && (string)$latest->to_status === "resolved"
              && str_contains($note, "phase-c allowlist; prod_head=1852913e67445b8aa502664558b409520f00b07e");
          echo json_encode([
              "bug_id" => 235,
              "current_status" => (string)$bug->status,
              "latest_status_log" => [
                  "id" => (int)$latest->id,
                  "from" => (string)$latest->from_status,
                  "to" => (string)$latest->to_status,
                  "created_at" => (string)$latest->created_at,
              ],
              "expected" => $expected,
              "prod_head" => trim((string)@shell_exec("git rev-parse HEAD")),
          ], JSON_UNESCAPED_UNICODE), PHP_EOL;
          if (!$expected) { throw new \RuntimeException("refusing unexpected state"); }
          '
          REMOTE

      - name: Upload read-only snapshot
        uses: actions/upload-artifact@v4
        with:
          name: bug-235-status-revert-preflight
          path: out/preflight.json
          retention-days: 30

  revert:
    name: Restore #235 to in_progress
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh out
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ssh-keyscan -H "$PI_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            :
          elif [[ -n "${PI_HOST_KEY:-}" ]]; then
            printf '%s\n' "$PI_HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::error::no host key"; exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Restore only the proven state
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_SSH_USER}@${PI_SSH_HOST}" bash <<'REMOTE' | tee out/revert.json
          set -euo pipefail
          cd /home/admin/backend
          php artisan tinker --execute='
          $db = \Illuminate\Support\Facades\DB::class;
          $result = $db::transaction(function () use ($db) {
              $bug = \App\Models\BugReport::query()->lockForUpdate()->find(235);
              $latest = $db::table("bug_report_status_logs")
                  ->where("bug_report_id", 235)->orderByDesc("id")
                  ->first(["id", "from_status", "to_status", "note"]);
              if (!$bug || !$latest) { throw new \RuntimeException("missing bug or history"); }
              $expected = (int)$latest->id === 713
                  && (string)$bug->status === "resolved"
                  && (string)$latest->from_status === "in_progress"
                  && (string)$latest->to_status === "resolved"
                  && str_contains((string)$latest->note, "phase-c allowlist; prod_head=1852913e67445b8aa502664558b409520f00b07e");
              if (!$expected) { throw new \RuntimeException("refusing unexpected state"); }
              $actor = (int)$db::table("UserCampus")
                  ->where("Admin", 1)->where("Approved", 1)->orderBy("UserID")->value("UserID");
              if ($actor <= 0) { throw new \RuntimeException("no approved admin actor"); }
              $change = \App\Services\BugReportService::changeStatus(
                  235,
                  $actor,
                  "in_progress",
                  "controlled revert of unintended Phase-C run 31705615016; prior state verified as in_progress"
              );
              if (!($change["ok"] ?? false)) { throw new \RuntimeException(json_encode($change)); }
              $fresh = \App\Models\BugReport::find(235);
              $after = $db::table("bug_report_status_logs")
                  ->where("bug_report_id", 235)->orderByDesc("id")
                  ->first(["id", "from_status", "to_status", "created_at"]);
              if (!$fresh || (string)$fresh->status !== "in_progress"
                  || !$after || (string)$after->from_status !== "resolved"
                  || (string)$after->to_status !== "in_progress") {
                  throw new \RuntimeException("post-verify failed");
              }
              return [
                  "bug_id" => 235,
                  "before" => "resolved",
                  "after" => (string)$fresh->status,
                  "new_status_log" => [
                      "id" => (int)$after->id,
                      "from" => (string)$after->from_status,
                      "to" => (string)$after->to_status,
                      "created_at" => (string)$after->created_at,
                  ],
              ];
          });
          $result["prod_head"] = trim((string)@shell_exec("git rev-parse HEAD"));
          echo json_encode($result, JSON_UNESCAPED_UNICODE), PHP_EOL;
          '
          REMOTE

      - name: Upload revert evidence
        uses: actions/upload-artifact@v4
        with:
          name: bug-235-status-revert-result
          path: out/revert.json
          retention-days: 30
