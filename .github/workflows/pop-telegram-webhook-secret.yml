name: Founder Telegram webhook secret rotation (#1139)
# Founder decision 2026-10-11: add a Telegram webhook secret for the 大安 campus and re-register the webhook.
# Runs the reviewed, tested `telegram:rotate-webhook-secret` command on the Pi. The secret is generated on the Pi
# (random_bytes), sent to Telegram setWebhook and stored in Campus.TelegramWebhookSecret there; it never reaches
# GitHub, logs or artifacts. Only campus 15 is accepted (guard job, rotate job, and the command itself). Output is
# passed through a bot-token redaction filter. If setWebhook succeeds but the DB save fails the command restores the
# previous Telegram registration; if that also fails it prints a recovery message (re-run for campus 15).
# Do NOT add --dry-run: that mode prints the generated secret.
# Activation gate (Founder 2026-10-13): the command refuses, before any Telegram or DB change, unless the webhook bind
# flow trusts only a verified guardian binding for the same student and campus. Today it binds by student name, so a
# dispatch fails closed. Run logs follow the normal 6h PII purge; record the outcome on issue #1139 (ids only).
on:
  workflow_dispatch:
    inputs:
      campus:
        description: Campus id. Only 15 (大安) is accepted
        required: true
        type: string
        default: "15"
      deployed_backend_sha:
        description: Full backend SHA approved for this run; must equal production deployment.json backend_sha
        required: true
        type: string
      confirm:
        description: "Type APPROVE_TELEGRAM_WEBHOOK_SECRET_1139"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: alltrue-production-side-effects-v2
  cancel-in-progress: false
  queue: max
jobs:
  guard:
    name: Validate exact Founder gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject scope or confirmation drift
        env:
          CAMPUS: ${{ inputs.campus }}
          CONFIRM: ${{ inputs.confirm }}
          INPUT_SHA: ${{ inputs.deployed_backend_sha }}
        run: |
          set -euo pipefail
          [[ "$CAMPUS" == 15 ]] || { echo '::error::only campus 15 is approved for #1139'; exit 1; }
          [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::deployed_backend_sha must be a full commit SHA'; exit 1; }
          [[ "$CONFIRM" == APPROVE_TELEGRAM_WEBHOOK_SECRET_1139 ]] || { echo '::error::confirmation mismatch'; exit 1; }
          echo "Founder gate passed: campus=$CAMPUS backend_sha=$INPUT_SHA"
  rotate:
    name: Pi-local webhook secret rotation
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-activation
    steps:
      - name: Checkout pinned SSH trust helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/production-ssh-trust
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Rotate on production
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          CAMPUS: ${{ inputs.campus }}
          TARGET_SHA: ${{ inputs.deployed_backend_sha }}
        run: |
          set -euo pipefail
          test -n "$PI_SSH_KEY"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::deployed_backend_sha must be a full commit SHA'; exit 1; }
          [[ "$CAMPUS" == 15 ]] || { echo '::error::only campus 15 is approved for #1139'; exit 1; }  # re-checked in the mutation job; the artisan command also hard-rejects non-15
          SSH_DIR="$RUNNER_TEMP/pop-telegram-ssh"
          install -d -m 700 "$SSH_DIR"
          printf '%s' "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > "$SSH_DIR/deploy_key"
          chmod 600 "$SSH_DIR/deploy_key"
          trap 'shred -u "$SSH_DIR/deploy_key" 2>/dev/null || true' EXIT
          ssh -i "$SSH_DIR/deploy_key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$PI_SSH_USER@$PI_SSH_HOST" "CAMPUS='$CAMPUS' TARGET_SHA='$TARGET_SHA' bash -s" 2>&1 <<'REMOTE' | sed -E 's#bot[0-9]+:[A-Za-z0-9_-]+#bot[REDACTED]#g'
          set -euo pipefail
          cd /home/admin/backend
          # SHA gate (same pattern as the other pop-* workflows): run only the exact reviewed backend build.
          manifest_sha="$(curl -sS --fail --proto '=https' --tlsv1.2 https://daan.lifenet.com.tw/deployment.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["backend_sha"])')"
          [[ "$manifest_sha" == "$TARGET_SHA" ]] || { echo "::error::production backend SHA drifted: manifest=$manifest_sha expected=$TARGET_SHA"; exit 1; }
          # The manifest and the checkout can diverge after a failed deploy/rollback: also pin the code artisan runs from.
          checkout_sha="$(git -C /home/admin rev-parse HEAD)"
          [[ "$checkout_sha" == "$TARGET_SHA" ]] || { echo "::error::production checkout HEAD=$checkout_sha expected=$TARGET_SHA"; exit 1; }
          # Version gate: the deployed command must have the #1139 safeguards, incl. the verified-guardian activation gate
          # (--rollback shipped in the same change); abort before any mutation.
          php artisan telegram:rotate-webhook-secret --help | grep -q -- '--rollback' || { echo '::error::deployed backend lacks the reviewed rotate command; wait for deploy'; exit 1; }
          php artisan telegram:rotate-webhook-secret "$CAMPUS"
          # Presence only (boolean); never print the secret.
          php artisan tinker --execute='
          $c = \App\Models\Campus::find((int) getenv("CAMPUS"));
          echo json_encode(["campus" => $c ? $c->id : null, "webhook_secret_present" => $c ? trim((string) $c->TelegramWebhookSecret) !== "" : null]), PHP_EOL;
          '
          REMOTE
