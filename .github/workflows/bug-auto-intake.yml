name: Bug auto-intake (hourly)

# Founder GO "6A" (Jerry, 2026-10-07): every `new` in-app report gets an IDs-only
# GitHub issue, an acknowledgement reply and status `triaged`, without waiting
# for a human dispatch. Idempotent: an existing issue (matched by SourceRef) is
# reused, and `bugs:auto-intake --ack` skips any report that is no longer `new`.
# Each issue also gets an area:<family> label and an advisory cross-link (config/bug_families.php).
# Logs carry IDs only (public repo); report text never leaves production.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: List candidates and plan issues only; no issue creation, no production write
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: bug-auto-intake
  cancel-in-progress: false

jobs:
  candidates:
    # Secret-bearing: only the reviewed workflow on main may touch production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-ssh
    timeout-minutes: 10
    outputs:
      json: ${{ steps.list.outputs.json }}
      count: ${{ steps.list.outputs.count }}
      reopened: ${{ steps.list.outputs.reopened }}
      reopened_count: ${{ steps.list.outputs.reopened_count }}
    steps:
      - name: Checkout pinned SSH trust helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/production-ssh-trust
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$PI_SSH_KEY"
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: List new reports (read-only, IDs only)
        id: list
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
        run: |
          set -euo pipefail
          raw="$(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "${PI_SSH_USER}@${PI_SSH_HOST}" \
            'cd /home/admin/backend && php artisan bugs:auto-intake --candidates --limit=50')"
          json="$(printf '%s\n' "$raw" | grep -m1 '^{"candidates"' || true)"
          [ -n "$json" ] || { echo "::error::bugs:auto-intake --candidates returned no JSON (command not deployed yet?)"; exit 1; }
          # Keep only the whitelisted ID fields before anything is printed or passed on.
          json="$(printf '%s' "$json" | jq -c '[.candidates[] | {bug_id: (.bug_id|tonumber), campus_id: (.campus_id|tonumber), severity: (.severity|tostring|ascii_downcase|gsub("[^a-z]";"")), family: ((.family // "")|tostring|ascii_downcase|gsub("[^a-z-]";""))}]')"
          echo "json=$json" >> "$GITHUB_OUTPUT"
          echo "count=$(printf '%s' "$json" | jq 'length')" >> "$GITHUB_OUTPUT"
          echo "candidates: $(printf '%s' "$json" | jq -c '[.[].bug_id]')"
          # #4721: reports whose latest change is the reporter's 「問題仍存在」 (IDs and time only; absent on older backends).
          reopened="$(printf '%s\n' "$raw" | grep -m1 '^{"candidates"' | jq -c '[.reopened[]? | {bug_id: (.bug_id|tonumber), log_id: (.log_id|tonumber), at: (.at|tostring|gsub("[^0-9T:+-]";""))}]')"
          echo "reopened=$reopened" >> "$GITHUB_OUTPUT"
          echo "reopened_count=$(printf '%s' "$reopened" | jq 'length')" >> "$GITHUB_OUTPUT"
          echo "reopened: $(printf '%s' "$reopened" | jq -c '[.[].bug_id]')"
          [ "$(printf '%s' "$reopened" | jq 'length')" -lt 200 ] || echo "::warning::200 reopened reports (BugAutoIntakeCommand::REOPEN_CAP); later ones wait for the next run"

  issues:
    needs: candidates
    if: github.ref == 'refs/heads/main' && (needs.candidates.outputs.count != '0' || (needs.candidates.outputs.reopened_count != '0' && needs.candidates.outputs.reopened_count != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    outputs:
      pairs: ${{ steps.issue.outputs.pairs }}
    steps:
      - name: Find or create one issue per report (SourceRef dedupe)
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATES: ${{ needs.candidates.outputs.json }}
          REOPENED: ${{ needs.candidates.outputs.reopened }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          # Same-kind clustering (Founder 2A): label the issue area:<family> and leave ONE advisory comment on the newest
          # open issue of the same family, linking to this one so they can be fixed together. Never closes anything.
          # Numbers and fixed text only; only owner/bot-authored issues are considered (public repo).
          cluster() {
            local id="$1" fam="$2" url="$3" label="area:$2" num="${3##*/}" other="" n labels comments
            labels="$(gh label list --limit 200 --json name -q '.[].name')" || return 1
            grep -qxF "$label" <<<"$labels" || gh label create "$label" --description "In-app report family (auto-intake)" || return 1
            gh issue edit "$url" --add-label "$label" || return 1
            for who in "${GITHUB_REPOSITORY_OWNER}" app/github-actions; do
              n="$(gh issue list --state open --label "$label" --author "$who" --search "in-app in:title" --limit 30 --json number -q "[.[].number | select(. != ${num})] | max // empty")" || return 1
              if [ -n "$n" ] && { [ -z "$other" ] || [ "$n" -gt "$other" ]; }; then other="$n"; fi
            done
            [ -n "$other" ] || return 0
            comments="$(gh issue view "$other" --json comments -q '.comments[].body')" || return 1
            grep -qF "<!-- family-link:${num} -->" <<<"$comments" && return 0
            gh issue comment "$other" --body "<!-- family-link:${num} -->同類型提醒：新回報 #${num}（in-app #${id}）與這張同屬 ${label}，建議一起修。僅提醒，不會自動關單。"
          }
          # Lookup helpers read the current report id from $id (set per row below; reopened rows use them too, #4721).
          # Reuse only an issue whose SourceRef was written by the repository owner or this workflow's bot,
          # in the body or in a comment (shared issues carry one SourceRef comment per report). Anyone can
          # open a public issue quoting the SourceRef; its URL must never be linked or sent to the reporter.
          trusted_refs() {
            # Same label-first ownership rule as inapp-issue-reconcile.py; cross-references do not own a report.
            jq -c --arg id "$id" --arg owner "${GITHUB_REPOSITORY_OWNER}" '
              def trusted: .login == $owner or .login == "app/github-actions" or .login == "github-actions";
              ([select(.author | trusted) | .body] + [.comments[]? | select(.author | trusted) | .body]) |
              map(select((. // "") | test("(?m)^[ \\t>*_#.)0-9`-]*SourceRef\\b[^\\r\\n]*alltrue:bug_report:" + $id + "([^0-9]|$)")))'
          }
          canonical_targets() {
            # Explicit same-repository issue numbers only; never follow prose URLs or external redirects.
            # The first spelling supports the existing owner consolidation of #4182 into #4195.
            jq -r --arg id "$id" '[.[] | scan("(?m)^Canonical tracking: #([1-9][0-9]*)\\.(?:[ \\t].*)?$") | .[0]] +
              [.[] | scan("(?m)^<!-- intake-canonical:alltrue:bug_report:" + $id + ":([1-9][0-9]*) -->$") | .[0]] | unique | .[]'
          }
          read_issue() {
            local raw
            raw="$(gh issue view "$1" --repo "$GITHUB_REPOSITORY" --json url,state,body,author,comments)" || return 2
            # Check before any reopen/close/link. The target is a same-repo issue, not a PR or URL redirect.
            jq -e --arg url "https://github.com/${GITHUB_REPOSITORY}/issues/$1" \
              '.url == $url and (.state == "OPEN" or .state == "CLOSED")' <<<"$raw" >/dev/null || return 2
            printf '%s' "$raw"
          }
          find_trusted() {
            local n raw docs target targets="" chosen="" fallback="" hit nums="${1:-}" part
            # Fail closed: a search or view error must stop the run, never look like "no issue yet".
            for who in "${GITHUB_REPOSITORY_OWNER}" app/github-actions; do
              part="$(gh issue list --state all --limit 20 --search "\"alltrue:bug_report:${id}\" author:${who}" --json number -q '.[].number')" || return 2
              nums="$nums $part"
              part="$(gh issue list --state all --limit 20 --search "\"alltrue:bug_report:${id}\" commenter:${who}" --json number -q '.[].number')" || return 2
              nums="$nums $part"
            done
            for n in $(printf '%s\n' $nums | sort -n | uniq); do
              [[ "$n" =~ ^[1-9][0-9]*$ ]] || return 2
              raw="$(read_issue "$n")" || return 2
              docs="$(trusted_refs <<<"$raw")" || return 2
              [ "$docs" != '[]' ] || continue
              hit="$(jq -r '.state + " " + .url' <<<"$raw")" || return 2
              [ -n "$fallback" ] || fallback="$hit"
              targets="$(canonical_targets <<<"$docs")" || return 2
              for target in $targets; do
                [ "$target" != "$n" ] || return 2
                [ -z "$chosen" ] || [ "$chosen" = "$target" ] || return 2
                chosen="$target"
              done
            done
            if [ -n "$chosen" ]; then
              raw="$(read_issue "$chosen")" || return 2
              docs="$(trusted_refs <<<"$raw")" || return 2
              [ "$docs" != '[]' ] || return 2
              # One hop only. Chained/cyclic/contradictory consolidations need explicit owner repair.
              targets="$(canonical_targets <<<"$docs")" || return 2
              [ -z "$targets" ] || return 2
              jq -r '.state + " " + .url' <<<"$raw"
            elif [ -n "$fallback" ]; then
              echo "$fallback"
            fi
          }
          pairs='[]'
          while read -r row; do
            id="$(jq -r '.bug_id' <<<"$row")"; [[ "$id" =~ ^[0-9]+$ ]] || exit 1
            ref="SourceRef: alltrue:bug_report:${id}"
            url=""
            rc=0; hit="$(find_trusted)" || rc=$?
            [ "$rc" -le 1 ] || { echo "::error::canonical issue lookup failed for in-app #$id"; exit 1; }
            if [ -n "$hit" ]; then
              url="${hit#* }"
              # A still-new report belongs on the open backlog: reopen a closed canonical issue before linking it.
              if [ "${hit%% *}" = "CLOSED" ] && [ "$DRY_RUN" != "true" ]; then gh issue reopen "$url" --comment "Reopened by bug-auto-intake: in-app #${id} is still new."; fi
            fi
            if [ -z "$url" ]; then
              if [ "$DRY_RUN" = "true" ]; then echo "would create issue for in-app #$id"; continue; fi
              body="$(printf '%s\n\n%s\n%s\n%s\n\n%s' "$ref" \
                "- In-app ID: ${id}" "- Campus ID: $(jq -r '.campus_id' <<<"$row") (opaque) · severity $(jq -r '.severity' <<<"$row")" \
                "- Opened by bug-auto-intake.yml. The ack job then posts the reporter acknowledgement (status stays new until Phase-A triages it)." \
                "Auto-intake only: no root cause yet. Report text stays in production (read it via bug-detail-dump). Next: investigate, fix the cause, reply in plain language (see docs/CHAT_BUG_SYSTEM.md §3.6–3.7).")"
              url="$(gh issue create --title "[in-app #${id}][auto-intake] report" --body "$body")"
              [[ "$url" =~ ^https://github\.com/${GITHUB_REPOSITORY}/issues/[0-9]+$ ]] || { echo "bad issue url"; exit 1; }
              # Race with Phase-A/consolidation: resolve trusted canonical ownership again before
              # closing ours. An explicit canonical target may be newer than the duplicate.
              sleep 5
              rc=0; oldest="$(find_trusted "${url##*/}")" || rc=$?
              [ "$rc" -le 1 ] || { echo "::error::post-create lookup failed for in-app #$id"; exit 1; }
              canonical_state="${oldest%% *}"
              oldest="${oldest#* }"
              if [ -n "$oldest" ] && [ "$oldest" != "$url" ]; then
                if [ "$canonical_state" = "CLOSED" ]; then
                  gh issue reopen "$oldest" --comment "Reopened by bug-auto-intake: in-app #${id} is still new."
                fi
                gh issue close "$url" --reason "not planned" --comment "Duplicate of ${oldest} (created concurrently for in-app #${id})."
                url="$oldest"
              fi
            fi
            [[ "$url" =~ ^https://github\.com/${GITHUB_REPOSITORY}/issues/[0-9]+$ ]] || { echo "bad issue url"; exit 1; }
            fam="$(jq -r '.family // ""' <<<"$row")"
            if [ "$DRY_RUN" != "true" ] && [[ "$fam" =~ ^[a-z]+(-[a-z]+)*$ ]]; then
              cluster "$id" "$fam" "$url" || echo "::warning::family clustering failed for in-app #$id (advisory, intake continues)"
            fi
            echo "in-app #$id -> $url"
            pairs="$(jq -c --argjson id "$id" --arg url "$url" '. + [{bug_id: $id, url: $url}]' <<<"$pairs")"
          done < <(jq -c '.[]' <<<"$CANDIDATES")
          # #4721: the reporter pressed 「問題仍存在」 (resolved → in_progress). Reopen its closed canonical issue once per
          # reopen (marker = report + status-log id, trusted authors only). IDs and time only; no ack, no production write.
          while read -r row; do
            id="$(jq -r '.bug_id' <<<"$row")"; log="$(jq -r '.log_id' <<<"$row")"; at="$(jq -r '.at' <<<"$row")"
            [[ "$id" =~ ^[0-9]+$ && "$log" =~ ^[0-9]+$ && "$at" =~ ^[0-9T:+-]+$ ]] || exit 1
            rc=0; hit="$(find_trusted)" || rc=$?
            [ "$rc" -le 1 ] || { echo "::error::canonical issue lookup failed for reopened in-app #$id"; exit 1; }
            [ -n "$hit" ] || { echo "::warning::reopened in-app #$id has no trusted issue"; continue; }
            url="${hit#* }"; mark="<!-- inapp-reopen:${id}:${log} -->"
            raw="$(read_issue "${url##*/}")" || { echo "::error::issue read failed for reopened in-app #$id"; exit 1; }
            seen="$(jq --arg m "$mark" --arg owner "${GITHUB_REPOSITORY_OWNER}" '[.comments[]? | select(.author.login == $owner or .author.login == "app/github-actions" or .author.login == "github-actions") | select((.body // "") | contains($m))] | length' <<<"$raw")"
            if [ "${hit%% *}" = CLOSED ] && [ "$seen" = 0 ]; then
              if [ "$DRY_RUN" = "true" ]; then echo "would reopen $url for in-app #$id"; continue; fi
              # Reopen first: `gh issue reopen --comment` posts the comment before the reopen, so a failed reopen would
              # leave the marker and never be retried.
              gh issue reopen "$url"
              gh issue comment "$url" --body "${mark}Reopened by bug-auto-intake: the reporter of in-app #${id} pressed 「問題仍存在」 at ${at} (resolved → in_progress)."
              echo "reopened in-app #$id -> $url"
            fi
          done < <(jq -c '.[]' <<<"${REOPENED:-[]}")
          echo "pairs=$pairs" >> "$GITHUB_OUTPUT"

  ack:
    needs: issues
    if: github.ref == 'refs/heads/main' && needs.issues.outputs.pairs != '[]' && needs.issues.outputs.pairs != '' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    environment: production-ssh
    timeout-minutes: 15
    steps:
      - name: Checkout pinned SSH trust helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/production-ssh-trust
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$PI_SSH_KEY"
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Triage and acknowledge (idempotent)
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          PAIRS: ${{ needs.issues.outputs.pairs }}
        run: |
          set -euo pipefail
          while read -r row; do
            id="$(jq -r '.bug_id' <<<"$row")"; url="$(jq -r '.url' <<<"$row")"
            [[ "$id" =~ ^[0-9]+$ ]] || exit 1
            [[ "$url" =~ ^https://github\.com/${GITHUB_REPOSITORY}/issues/[0-9]+$ ]] || exit 1
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "${PI_SSH_USER}@${PI_SSH_HOST}" \
              "cd /home/admin/backend && php artisan bugs:auto-intake --ack --bug-id=${id} --issue-url=${url}"
          done < <(jq -c '.[]' <<<"$PAIRS")
