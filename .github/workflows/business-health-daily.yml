name: Business health daily (read-only)
# Gap 3 of #5070. No SSH, no production environment: logs in with the existing synthetic smoke
# director (same helper as post-merge smoke) and reads aggregate counts from GET /api/v1/health/detailed.
# Numbers only (no ids, names or PII). Red -> one GitHub issue.
on:
  schedule:
    - cron: '0 14 * * *'   # 22:00 Asia/Taipei, after the teaching day
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: business-health-daily
  cancel-in-progress: false
jobs:
  probe:
    name: Read aggregate business counts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      red: ${{ steps.read.outputs.red }}
      summary: ${{ steps.read.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/smoke-auth-lib.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Read counts
        id: read
        env:
          SMOKE_DIRECTOR_USER: ${{ secrets.SMOKE_DIRECTOR_USER }}
          SMOKE_DIRECTOR_PASS: ${{ secrets.SMOKE_DIRECTOR_PASS }}
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$SMOKE_DIRECTOR_USER" ] || [ -z "$SMOKE_DIRECTOR_PASS" ] || [ -z "$SMOKE_BASE_URL" ]; then
            echo "::notice::SMOKE_* secrets not set - skipping"; echo "red=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          source scripts/smoke-auth-lib.sh
          api="${SMOKE_BASE_URL%/}/api/v1"
          token="$(smoke_login_and_token "$api" "$SMOKE_DIRECTOR_USER" "$SMOKE_DIRECTOR_PASS" director business-health)"
          echo "::add-mask::$token"
          curl -fsS --max-time 20 -H "Authorization: Bearer $token" -H 'Accept: application/json' "$api/health/detailed" > "$RUNNER_TEMP/health.json"
          red_summary="$(python3 - "$RUNNER_TEMP/health.json" <<'PY'
          import datetime, json, sys
          b = json.load(open(sys.argv[1]))["business_today"]
          weekday = (datetime.datetime.utcnow() + datetime.timedelta(hours=8)).weekday() < 5
          bad = []
          if weekday and b["lessons_written_today"] == 0:
              bad.append("no lessons written today (weekday)")
          nums = "lessons=%s, bills=%s, sign_ins=%s" % (b["lessons_written_today"], b["bills_created_today"], b["sign_ins_today"])
          print("%s|%s (%s)" % ("1" if bad else "0", "; ".join(bad) or "ok", nums))
          PY
          )"
          echo "red=${red_summary%%|*}" >> "$GITHUB_OUTPUT"
          echo "summary=${red_summary#*|}" >> "$GITHUB_OUTPUT"
          echo "### Business health: ${red_summary#*|}" >> "$GITHUB_STEP_SUMMARY"

  alert-issue:
    name: Open or update alert issue
    needs: probe
    if: ${{ always() && (needs.probe.result == 'failure' || needs.probe.outputs.red == '1') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or comment on the single alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ needs.probe.outputs.summary || 'probe itself failed' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="[ops-alert] Business health check red"
          n="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label area:ops --search "\"$title\" in:title" --json number -q '.[0].number // empty')"
          msg="${SUMMARY} - ${RUN_URL} (aggregate counts only)"
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$msg"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label "area:ops,priority:p1" --body "$msg"
          fi
