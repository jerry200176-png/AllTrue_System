# Read-only Pi diagnose for ClassSession cross-SC / Stop=1 orphans.
# Public repo (#3605): ids, statuses, dates and counts only. No names, no free-text notes (length only).
# Trigger: push to cursor/diag-classsession-* (same-repo → secrets available).
name: ClassSession Duplicate Diagnose (push)

on:
  push:
    branches:
      - 'cursor/diag-classsession-**'
  workflow_dispatch:
    inputs:
      student_id:
        description: "Optional numeric student id (never a name)"
        required: false
        type: string
        default: ""
      date:
        description: "Anchor date YYYY-MM-DD"
        required: true
        type: string
        default: "2026-07-18"
      campus_id:
        description: "Campus id"
        required: true
        type: string
        default: "9"

concurrency:
  group: classsession-duplicate-diagnose
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    name: Production read-only ClassSession scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pinned SSH trust helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/production-ssh-trust
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Run diagnose on Pi
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          DATE: ${{ inputs.date || '2026-05-30' }}
          CAMPUS_ID: ${{ inputs.campus_id || '9' }}
          STUDENT_ID: ${{ inputs.student_id || '' }}
        run: |
          set -euo pipefail
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo 'date must be YYYY-MM-DD'; exit 1; }
          [[ "$CAMPUS_ID" =~ ^[0-9]+$ ]] || { echo 'campus_id must be numeric'; exit 1; }
          [[ -z "$STUDENT_ID" || "$STUDENT_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'student_id must be numeric'; exit 1; }
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${PI_SSH_USER}@${PI_SSH_HOST}" \
            DATE="$DATE" CAMPUS_ID="$CAMPUS_ID" STUDENT_ID="$STUDENT_ID" \
            'bash -s' <<'ENDSSH'
          set -euo pipefail
          DATE="${DATE:-2026-05-30}"
          CAMPUS_ID="${CAMPUS_ID:-9}"
          SID="${STUDENT_ID:-0}"
          ENV_FILE=/home/admin/backend/.env
          DB_USER=$(grep '^DB_USERNAME=' "$ENV_FILE" | cut -d= -f2-)
          DB_PASS=$(grep '^DB_PASSWORD=' "$ENV_FILE" | cut -d= -f2-)
          DB_NAME=$(grep '^DB_DATABASE=' "$ENV_FILE" | cut -d= -f2-)
          M=(mysql -h 127.0.0.1 -u "$DB_USER" -p"${DB_PASS}" "$DB_NAME" -N -B)
          {
            echo "=== diagnose DATE=$DATE CAMPUS=$CAMPUS_ID STUDENT_ID=$SID generated=$(date -Iseconds) ==="
            echo "--- case sessions +-14d ALL statuses (any campus, student id; note = length only) ---"
            "${M[@]}" -e "SELECT CONCAT_WS('|',s.id,s.CampusID,cs.id,cs.StudentClassID,sc.Stop,sc.SessionCount,IFNULL(sc.RemainingSessions,'null'),sc.TeacherID,cs.SessionDate,SUBSTRING(cs.StartTime,1,5),SUBSTRING(cs.EndTime,1,5),cs.Status,CHAR_LENGTH(IFNULL(cs.Note,'')),IFNULL(cs.created_at,''))
          FROM ClassSession cs JOIN StudentClass sc ON sc.ID=cs.StudentClassID JOIN Student s ON s.id=sc.StudentID
          WHERE s.id=$SID
           AND cs.SessionDate BETWEEN DATE_SUB('$DATE', INTERVAL 14 DAY) AND DATE_ADD('$DATE', INTERVAL 14 DAY)
          ORDER BY cs.SessionDate,cs.StartTime,cs.StudentClassID,cs.id;"
            echo "--- StudentClass rows (any campus, student id) ---"
            "${M[@]}" -e "SELECT CONCAT_WS('|',sc.ID,s.id,s.CampusID,sc.TeacherID,sc.SubjectID,sc.Stop,sc.ScheduleMode,sc.SessionCount,IFNULL(sc.RemainingSessions,'null'),sc.UsedSessions,sc.StartDate)
          FROM StudentClass sc JOIN Student s ON s.id=sc.StudentID
          WHERE s.id=$SID
          ORDER BY sc.ID;"
            echo "--- campus scheduled cross-SC from date ---"
            "${M[@]}" -e "SELECT CONCAT_WS('|',st.id,sc.TeacherID,cs.SessionDate,SUBSTRING(cs.StartTime,1,5),GROUP_CONCAT(DISTINCT cs.StudentClassID ORDER BY cs.StudentClassID),GROUP_CONCAT(cs.id ORDER BY cs.id),GROUP_CONCAT(CONCAT(sc.Stop,':',cs.Status) ORDER BY cs.id),COUNT(DISTINCT cs.StudentClassID))
          FROM ClassSession cs JOIN StudentClass sc ON sc.ID=cs.StudentClassID JOIN Student st ON st.id=sc.StudentID
          WHERE st.CampusID=$CAMPUS_ID AND cs.SessionDate>='$DATE' AND LOWER(cs.Status)='scheduled'
          GROUP BY st.id,sc.TeacherID,cs.SessionDate,SUBSTRING(cs.StartTime,1,5)
          HAVING COUNT(DISTINCT cs.StudentClassID)>1
          ORDER BY cs.SessionDate,st.id LIMIT 100;"
            echo "--- campus orphan Stop=1 scheduled ---"
            "${M[@]}" -e "SELECT CONCAT_WS('|',cs.id,cs.StudentClassID,st.id,sc.TeacherID,cs.SessionDate,SUBSTRING(cs.StartTime,1,5),cs.Status)
          FROM ClassSession cs JOIN StudentClass sc ON sc.ID=cs.StudentClassID JOIN Student st ON st.id=sc.StudentID
          WHERE sc.Stop=1 AND LOWER(cs.Status)='scheduled' AND cs.SessionDate>='$DATE' AND st.CampusID=$CAMPUS_ID
          ORDER BY cs.SessionDate,st.id LIMIT 100;"
            echo "--- system orphan Stop=1 scheduled count ---"
            "${M[@]}" -e "SELECT COUNT(*) FROM ClassSession cs JOIN StudentClass sc ON sc.ID=cs.StudentClassID
          WHERE sc.Stop=1 AND LOWER(cs.Status)='scheduled' AND cs.SessionDate>='$DATE';"
            echo "--- artisan audit ---"
            cd /home/admin/backend
            php artisan classsession:audit-duplicates --branch_id="$CAMPUS_ID" 2>&1 | tail -60 || true
            echo "--- orphan dry-run ---"
            php artisan fix:orphan-scheduled-sessions --dry-run 2>&1 | tail -80 || true
            echo "--- scheduled-cross-sc dry-run ---"
            php artisan repair:duplicate-sessions --case=scheduled-cross-sc 2>&1 | tail -120 || true
            echo "=== END ==="
          } | tee /tmp/classsession-dup-diagnose.txt
          ENDSSH

      - name: PHP tinker lookup (charset-safe, ids only)
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          DATE: ${{ inputs.date || '2026-05-30' }}
          STUDENT_ID: ${{ inputs.student_id || '' }}
        run: |
          set -euo pipefail
          [[ -z "$STUDENT_ID" || "$STUDENT_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'student_id must be numeric'; exit 1; }
          if [ -z "$STUDENT_ID" ]; then
            echo '{"ok":true,"skipped":"no student_id"}' | tee /tmp/student-probe.log
            exit 0
          fi
          cat > /tmp/student_probe.php <<'PHP'
          <?php
          $db = \Illuminate\Support\Facades\DB::class;
          $studentId = (int) getenv('STUDENT_ID');
          $scAll = $db::table('StudentClass as sc')
            ->where('sc.StudentID', $studentId)
            ->orderBy('sc.ID')
            ->get(['sc.ID','sc.TeacherID','sc.SubjectID','sc.Stop','sc.ScheduleMode','sc.SessionCount','sc.RemainingSessions','sc.UsedSessions','sc.StartDate']);
          $scIds = $scAll->pluck('ID')->map(fn ($v) => (int)$v)->all();
          $sessions = $db::table('ClassSession as cs')
            ->whereIn('cs.StudentClassID', $scIds)
            ->whereBetween('cs.SessionDate', [date('Y-m-d', strtotime(getenv('DATE') . ' -14 days')), date('Y-m-d', strtotime(getenv('DATE') . ' +14 days'))])
            ->orderBy('cs.StudentClassID')->orderBy('cs.SessionDate')
            ->selectRaw("cs.id, cs.StudentClassID, cs.SessionDate, cs.StartTime, cs.Status, CHAR_LENGTH(COALESCE(cs.Note, '')) as note_length, cs.updated_at")
            ->get();
          echo json_encode([
            'ok' => true,
            'student_id' => $studentId,
            'contracts' => $scAll,
            'sessions_around_date' => $sessions,
          ], JSON_UNESCAPED_UNICODE), PHP_EOL;
          PHP
          B64=$(base64 -w0 /tmp/student_probe.php)
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${PI_SSH_USER}@${PI_SSH_HOST}" \
            "B64='${B64}' STUDENT_ID='${STUDENT_ID}' DATE='${DATE}' bash -s" <<'REMOTE' | tee /tmp/student-probe.log
          set -euo pipefail
          cd /home/admin/backend
          php -r 'file_put_contents("/tmp/student_probe.php", base64_decode(getenv("B64")));'
          php artisan tinker --execute='require "/tmp/student_probe.php";'
          rm -f /tmp/student_probe.php
          REMOTE

      - name: Capture remote output to artifact
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/diag-out
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${PI_SSH_USER}@${PI_SSH_HOST}" \
            'cat /tmp/classsession-dup-diagnose.txt' > /tmp/diag-out/diagnose.txt
          cp /tmp/student-probe.log /tmp/diag-out/student-probe.log
          wc -l /tmp/diag-out/diagnose.txt

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: classsession-dup-diagnose
          path: /tmp/diag-out/
          retention-days: 14

      - name: Job summary
        run: |
          {
            echo '### ClassSession duplicate diagnose'
            echo '```'
            cat /tmp/diag-out/diagnose.txt
            echo '```'
            echo '### Student tinker probe (charset-safe)'
            echo '```'
            cat /tmp/diag-out/student-probe.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
