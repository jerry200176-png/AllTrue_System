# Read-only Pi diagnose for ClassSession cross-SC / Stop=1 orphans.
# Trigger: push to cursor/diag-classsession-* (same-repo → secrets available).
name: ClassSession Duplicate Diagnose (push)

on:
  push:
    branches:
      - 'cursor/diag-classsession-**'
  workflow_dispatch:
    inputs:
      date:
        description: "Anchor date YYYY-MM-DD"
        required: true
        type: string
        default: "2026-07-18"
      campus_id:
        description: "Campus id"
        required: true
        type: string
        default: "9"

concurrency:
  group: classsession-duplicate-diagnose
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    name: Production read-only ClassSession scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pinned SSH trust helper
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions/production-ssh-trust
          sparse-checkout-cone-mode: false
      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Run diagnose on Pi
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          DATE: ${{ inputs.date || '2026-05-30' }}
          CAMPUS_ID: ${{ inputs.campus_id || '9' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${PI_SSH_USER}@${PI_SSH_HOST}" \
            DATE="$DATE" CAMPUS_ID="$CAMPUS_ID" \
            'bash -s' <<'ENDSSH'
          set -euo pipefail
          DATE="${DATE:-2026-05-30}"
          CAMPUS_ID="${CAMPUS_ID:-9}"
          TEACHER_NAME="_none_"
          STUDENT_NAME_LIKE="沈柏宇"
          ENV_FILE=/home/admin/backend/.env
          DB_USER=$(grep '^DB_USERNAME=' "$ENV_FILE" | cut -d= -f2-)
          DB_PASS=$(grep '^DB_PASSWORD=' "$ENV_FILE" | cut -d= -f2-)
          DB_NAME=$(grep '^DB_DATABASE=' "$ENV_FILE" | cut -d= -f2-)
          M=(mysql -h 127.0.0.1 -u "$DB_USER" -p"${DB_PASS}" "$DB_NAME" -N -B)
          NAME_ESC=$(printf "%s" "$STUDENT_NAME_LIKE" | sed "s/'/\\\\'/g")
          IN=$("${M[@]}" -e "SELECT GROUP_CONCAT(CONCAT(\"'\",id,\"'\") SEPARATOR ',') FROM Student WHERE name LIKE CONCAT('%','$NAME_ESC','%');")
          IN="${IN:-'-1'}"
          {
            echo "=== diagnose DATE=$DATE CAMPUS=$CAMPUS_ID generated=$(date -Iseconds) ==="
            echo "--- teacher ---"
            "${M[@]}" -e "SELECT id,Name,LoginName FROM User WHERE Name LIKE CONCAT('%','$TEACHER_NAME','%') LIMIT 5;"
            echo "--- students (all campuses, LIKE match on name) ---"
            "${M[@]}" -e "SELECT id,name,CampusID FROM Student WHERE name LIKE CONCAT('%','$NAME_ESC','%');"
            echo "--- students matched ids: $IN ---"
            echo "--- case sessions ±14d ALL statuses (any campus, matched student ids) ---"
            "${M[@]}" -e "SELECT CONCAT_WS('|',s.name,s.CampusID,cs.id,cs.StudentClassID,sc.Stop,sc.SessionCount,IFNULL(sc.RemainingSessions,'null'),sc.TeacherID,cs.SessionDate,SUBSTRING(cs.StartTime,1,5),SUBSTRING(cs.EndTime,1,5),cs.Status,LEFT(IFNULL(cs.Note,''),80),IFNULL(cs.created_at,''),IFNULL(cs.updated_at,''))
          FROM ClassSession cs JOIN StudentClass sc ON sc.ID=cs.StudentClassID JOIN Student s ON s.id=sc.StudentID
          WHERE s.id IN ($IN)
           AND cs.SessionDate BETWEEN DATE_SUB('$DATE', INTERVAL 14 DAY) AND DATE_ADD('$DATE', INTERVAL 14 DAY)
          ORDER BY s.name,cs.SessionDate,cs.StartTime,cs.StudentClassID,cs.id;"
            echo "--- her StudentClass rows (any campus, matched student ids) ---"
            "${M[@]}" -e "SELECT CONCAT_WS('|',sc.ID,s.name,s.CampusID,sc.TeacherID,sc.SubjectID,sc.Stop,sc.ScheduleMode,sc.SessionCount,IFNULL(sc.RemainingSessions,'null'),sc.UsedSessions,sc.StartDate)
          FROM StudentClass sc JOIN Student s ON s.id=sc.StudentID
          WHERE s.id IN ($IN)
          ORDER BY sc.ID;"
            echo "--- campus9 scheduled cross-SC from date ---"
            "${M[@]}" -e "SELECT CONCAT_WS('|',st.name,sc.TeacherID,cs.SessionDate,SUBSTRING(cs.StartTime,1,5),GROUP_CONCAT(DISTINCT cs.StudentClassID ORDER BY cs.StudentClassID),GROUP_CONCAT(cs.id ORDER BY cs.id),GROUP_CONCAT(CONCAT(sc.Stop,':',cs.Status) ORDER BY cs.id),COUNT(DISTINCT cs.StudentClassID))
          FROM ClassSession cs JOIN StudentClass sc ON sc.ID=cs.StudentClassID JOIN Student st ON st.id=sc.StudentID
          WHERE st.CampusID=$CAMPUS_ID AND cs.SessionDate>='$DATE' AND LOWER(cs.Status)='scheduled'
          GROUP BY st.id,st.name,sc.TeacherID,cs.SessionDate,SUBSTRING(cs.StartTime,1,5)
          HAVING COUNT(DISTINCT cs.StudentClassID)>1
          ORDER BY cs.SessionDate,st.name LIMIT 100;"
            echo "--- campus9 orphan Stop=1 scheduled ---"
            "${M[@]}" -e "SELECT CONCAT_WS('|',cs.id,cs.StudentClassID,st.name,sc.TeacherID,cs.SessionDate,SUBSTRING(cs.StartTime,1,5),cs.Status)
          FROM ClassSession cs JOIN StudentClass sc ON sc.ID=cs.StudentClassID JOIN Student st ON st.id=sc.StudentID
          WHERE sc.Stop=1 AND LOWER(cs.Status)='scheduled' AND cs.SessionDate>='$DATE' AND st.CampusID=$CAMPUS_ID
          ORDER BY cs.SessionDate,st.name LIMIT 100;"
            echo "--- system scheduled cross-SC top50 ---"
            "${M[@]}" -e "SELECT CONCAT_WS('|',st.CampusID,st.name,sc.TeacherID,cs.SessionDate,SUBSTRING(cs.StartTime,1,5),GROUP_CONCAT(DISTINCT cs.StudentClassID ORDER BY cs.StudentClassID),GROUP_CONCAT(cs.id ORDER BY cs.id),GROUP_CONCAT(sc.Stop ORDER BY cs.id),COUNT(DISTINCT cs.StudentClassID))
          FROM ClassSession cs JOIN StudentClass sc ON sc.ID=cs.StudentClassID JOIN Student st ON st.id=sc.StudentID
          WHERE cs.SessionDate>='$DATE' AND LOWER(cs.Status)='scheduled'
          GROUP BY st.CampusID,st.id,st.name,sc.TeacherID,cs.SessionDate,SUBSTRING(cs.StartTime,1,5)
          HAVING COUNT(DISTINCT cs.StudentClassID)>1
          ORDER BY cs.SessionDate,st.CampusID,st.name LIMIT 50;"
            echo "--- system orphan Stop=1 scheduled count ---"
            "${M[@]}" -e "SELECT COUNT(*) FROM ClassSession cs JOIN StudentClass sc ON sc.ID=cs.StudentClassID
          WHERE sc.Stop=1 AND LOWER(cs.Status)='scheduled' AND cs.SessionDate>='$DATE';"
            echo "--- artisan audit ---"
            cd /home/admin/backend
            php artisan classsession:audit-duplicates --branch_id="$CAMPUS_ID" 2>&1 | tail -60 || true
            echo "--- orphan dry-run ---"
            php artisan fix:orphan-scheduled-sessions --dry-run 2>&1 | tail -80 || true
            echo "--- scheduled-cross-sc dry-run ---"
            php artisan repair:duplicate-sessions --case=scheduled-cross-sc 2>&1 | tail -120 || true
            echo "=== END ==="
          } | tee /tmp/classsession-dup-diagnose.txt
          ENDSSH

      - name: PHP tinker lookup (charset-safe, bypasses mysql-CLI raw string pitfalls)
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          DATE: ${{ inputs.date || '2026-05-30' }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/student_probe.php
          print("""<?php
          $db = \\Illuminate\\Support\\Facades\\DB::class;
          // in-app #308: restore probe for 沈柏宇 wrongly closed contract_amended course
          $students = $db::table('Student')->where('name', '沈柏宇')->orderBy('id')->get(['id','name','CampusID']);
          $studentIds = $students->pluck('id')->map(fn ($v) => (int)$v)->all();
          $scAll = $db::table('StudentClass as sc')
            ->leftJoin('Subject as sub', 'sub.id', '=', 'sc.SubjectID')
            ->whereIn('sc.StudentID', $studentIds ?: [-1])
            ->orderBy('sc.ID')
            ->get(['sc.ID','sc.StudentID','sc.TeacherID','sc.SubjectID','sub.Subject_Name as subject_name','sc.Stop','sc.closed_reason','sc.ScheduleMode','sc.SessionCount','sc.RemainingSessions','sc.UsedSessions','sc.StartDate','sc.EndDate','sc.settlement_snapshot','sc.MDate']);
          $scIds = $scAll->pluck('ID')->map(fn ($v) => (int)$v)->all();
          $sessions = $db::table('ClassSession as cs')
            ->whereIn('cs.StudentClassID', $scIds ?: [-1])
            ->orderBy('cs.StudentClassID')->orderBy('cs.SessionDate')->orderBy('cs.StartTime')
            ->get(['cs.id','cs.StudentClassID','cs.SessionDate','cs.StartTime','cs.EndTime','cs.Status','cs.Note','cs.updated_at']);
          $audits = $db::table('security_audit_events')
            ->where('event_type', 'student_class.contract_amendment')
            ->whereIn('subject_id', $scIds ?: [-1])
            ->orderByDesc('id')->limit(20)
            ->get(['id','subject_id','campus_id','created_at','payload']);
          echo json_encode([
            'ok' => true,
            'students' => $students,
            'contracts' => $scAll,
            'sessions' => $sessions,
            'amendment_audits' => $audits,
          ], JSON_UNESCAPED_UNICODE), PHP_EOL;
          """)
          PY
          B64=$(base64 -w0 /tmp/student_probe.php)
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${PI_SSH_USER}@${PI_SSH_HOST}" \
            "B64='${B64}' bash -s" <<'REMOTE' | tee /tmp/student-probe.log
          set -euo pipefail
          cd /home/admin/backend
          php -r 'file_put_contents("/tmp/student_probe.php", base64_decode(getenv("B64")));'
          php artisan tinker --execute='require "/tmp/student_probe.php";'
          rm -f /tmp/student_probe.php
          REMOTE

      - name: Capture remote output to artifact
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/diag-out
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${PI_SSH_USER}@${PI_SSH_HOST}" \
            'cat /tmp/classsession-dup-diagnose.txt' > /tmp/diag-out/diagnose.txt
          cp /tmp/student-probe.log /tmp/diag-out/student-probe.log
          wc -l /tmp/diag-out/diagnose.txt
          head -80 /tmp/diag-out/diagnose.txt
          echo '...'
          tail -80 /tmp/diag-out/diagnose.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: classsession-dup-diagnose
          path: /tmp/diag-out/
          retention-days: 14

      - name: Job summary
        run: |
          {
            echo '### ClassSession duplicate diagnose'
            echo '```'
            cat /tmp/diag-out/diagnose.txt
            echo '```'
            echo '### Student tinker probe (charset-safe)'
            echo '```'
            cat /tmp/diag-out/student-probe.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
