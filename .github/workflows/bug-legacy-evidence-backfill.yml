name: Bug legacy evidence backfill (approved)

# Founder-approved, explicit-manifest operational path. The command is
# append-only and never changes a bug status or rewrites status logs.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Dry-run first; apply only after reviewing the dry-run output"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      confirmation:
        description: "For apply only, enter BACKFILL_BUG_RESOLUTION_EVIDENCE"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: bug-legacy-evidence-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}

      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
        run: |
          set -euo pipefail
          test -n "$PI_SSH_KEY"
          test -n "$PI_SSH_HOST"
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Validate and execute immutable manifest
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$MODE" == "dry-run" || "$MODE" == "apply" ]] || { echo "invalid mode" >&2; exit 1; }
          if [[ "$MODE" == "apply" && "$CONFIRMATION" != "BACKFILL_BUG_RESOLUTION_EVIDENCE" ]]; then
            echo "apply requires confirmation=BACKFILL_BUG_RESOLUTION_EVIDENCE" >&2
            exit 1
          fi
          mkdir -p out
          scp -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            operations/closeout/bug-legacy-evidence-backfill.json \
            "${PI_SSH_USER}@${PI_SSH_HOST}:/tmp/bug-legacy-evidence-backfill.json"
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_SSH_USER}@${PI_SSH_HOST}" "MODE='$MODE' bash -s" <<'REMOTE' | tee out/backfill.log
          set -euo pipefail
          cd /home/admin/backend
          PROD_SHA="$(git rev-parse HEAD)"
          echo "prod_head=$PROD_SHA"
          php artisan list --format=txt | grep -q 'bugs:backfill-resolution-evidence'
          php artisan tinker --no-ansi --execute='
          $table = \Illuminate\Support\Facades\Schema::hasTable("bug_report_evidence");
          if (!$table) { throw new \RuntimeException("bug_report_evidence table is missing"); }
          echo "evidence_table=present";
          echo "status_log_count_before=".\App\Models\BugReportStatusLog::query()->where("bug_report_id", 114)->count();
          '
          echo "=== DRY-RUN ==="
          php artisan bugs:backfill-resolution-evidence \
            /tmp/bug-legacy-evidence-backfill.json \
            --dry-run --production-head="$PROD_SHA" --json
          if [[ "$MODE" == "dry-run" ]]; then
            echo "result=DRY_RUN_ONLY"
            exit 0
          fi
          echo "=== APPLY ==="
          php artisan bugs:backfill-resolution-evidence \
            /tmp/bug-legacy-evidence-backfill.json \
            --apply --confirmation=BACKFILL_BUG_RESOLUTION_EVIDENCE \
            --production-head="$PROD_SHA" --json
          echo "=== POST-APPLY READ-ONLY CHECK ==="
          php artisan tinker --no-ansi --execute='
          $evidence = \App\Models\BugReportEvidence::query()->where("bug_report_id", 114)->get(["id", "evidence_type", "production_revision", "source_ref"]);
          echo "evidence_rows=".json_encode($evidence, JSON_UNESCAPED_UNICODE);
          echo "status_log_count_after=".\App\Models\BugReportStatusLog::query()->where("bug_report_id", 114)->count();
          '
          echo "result=APPLIED_AND_RECHECKED"
          REMOTE

      - name: Upload backfill evidence
        uses: actions/upload-artifact@v4
        with:
          name: bug-legacy-evidence-backfill-${{ github.run_id }}
          path: out/backfill.log
          if-no-files-found: error
