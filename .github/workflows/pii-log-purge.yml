name: PII log purge (public repo)

# The repo is public and production-data workflows (bug dumps, case probes, ops repairs, diagnoses)
# can print student/teacher names into run logs, inputs and artifacts. Founder decision 2026-10-06:
# keep the repo public, delete those runs. This deletes completed runs of every workflow listed in
# .github/pii-log-workflows.txt once they are older than RETAIN_HOURS (time to read the result).
# Add any new workflow that reads production data to that list in the same PR.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/pii-log-workflows*.txt'

permissions:
  contents: read

concurrency:
  group: pii-log-purge
  cancel-in-progress: false

jobs:
  # Independent of the registry check below, so a registry gap can never stop the purge.
  purge:
    if: github.event_name != 'pull_request'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RETAIN_HOURS: '6'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Delete old runs of listed workflows (fail closed)
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "${RETAIN_HOURS} hours ago" +%Y-%m-%dT%H:%M:%SZ)
          deleted=0; failed=0
          # Resolve workflow IDs once: files deleted from main are only reachable by ID.
          gh api --paginate "repos/$REPO/actions/workflows?per_page=100" \
            -q '.workflows[] | "\(.path | split("/") | last) \(.id)"' > "$RUNNER_TEMP/wf-ids.txt"
          while read -r wf; do
            [ -z "$wf" ] && continue
            wid=$(awk -v f="$wf" '$1 == f {print $2; exit}' "$RUNNER_TEMP/wf-ids.txt")
            if [ -z "$wid" ]; then
              # Only a file that left main may lack an entry (GitHub drops it once its last
              # run is deleted). A file still on main without an id is a real error.
              if [ -f ".github/workflows/$wf" ]; then
                echo "::error::$wf exists on main but has no workflow id"; failed=$((failed+1))
              else
                echo "::notice::$wf left main and has no runs left"
              fi
              continue
            fi
            # Page until nothing older than the cutoff remains (a backlog can exceed one page).
            for _ in $(seq 1 50); do
              if ! ids=$(gh api "repos/$REPO/actions/workflows/$wid/runs?per_page=100&created=<$cutoff" \
                -q '.workflow_runs[]|select(.status=="completed")|.id'); then
                echo "::error::could not list runs for $wf"; failed=$((failed+1)); break
              fi
              [ -z "$ids" ] && break
              before=$failed
              for id in $ids; do
                if out=$(gh api -X DELETE "repos/$REPO/actions/runs/$id" 2>&1); then deleted=$((deleted+1))
                elif grep -q "HTTP 404" <<<"$out"; then deleted=$((deleted+1))  # already gone
                else echo "::error::could not delete run $id ($wf): $out"; failed=$((failed+1)); fi
              done
              [ "$failed" -gt "$before" ] && break
            done
          done < .github/pii-log-workflows.txt
          echo "deleted=$deleted failed=$failed"
          [ "$failed" -eq 0 ]

  # Every production workflow (single source: docs/governance/PRODUCTION_WORKFLOW_INVENTORY.json)
  # must be either purged or reviewed as exempt.
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Every production workflow is classified
        run: |
          python3 - <<'PY'
          import json, sys
          inv = json.load(open("docs/governance/PRODUCTION_WORKFLOW_INVENTORY.json"))["workflows"]
          def listed(path):
              return {l.split()[0] for l in open(path) if l.strip() and not l.startswith("#")}
          purged, exempt = listed(".github/pii-log-workflows.txt"), listed(".github/pii-log-workflows.exempt.txt")
          missing = sorted(w for w in inv if w not in purged and w not in exempt)
          for w in missing:
              print(f"::error::{w} is a production workflow but is in neither .github/pii-log-workflows.txt nor .github/pii-log-workflows.exempt.txt")
          sys.exit(1 if missing else 0)
          PY
