name: PII log purge (public repo)

# The repo is public and production-data workflows (bug dumps, case probes, ops repairs, diagnoses)
# can print student/teacher names into run logs, inputs and artifacts. Founder decision 2026-10-06:
# keep the repo public, delete those runs. This deletes completed runs of every workflow listed in
# .github/pii-log-workflows.txt once they are older than RETAIN_HOURS (time to read the result).
# Add any new workflow that reads production data to that list in the same PR.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/pii-log-workflows*.txt'

permissions:
  actions: write
  contents: read

concurrency:
  group: pii-log-purge
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RETAIN_HOURS: '6'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Every production workflow is classified (registry cannot drift)
        run: |
          set -euo pipefail
          listed() { grep -v '^#' "$1" | awk '{print $1}' | grep -v '^$'; }
          missing=0
          for f in $(grep -lE 'production-ssh-trust|PI_SSH_KEY|PI_SSH_HOST|PI_HOST' .github/workflows/*.yml); do
            b=$(basename "$f")
            if ! listed .github/pii-log-workflows.txt | grep -qx "$b" && ! listed .github/pii-log-workflows.exempt.txt | grep -qx "$b"; then
              echo "::error file=$f::$b reaches production but is in neither .github/pii-log-workflows.txt nor .github/pii-log-workflows.exempt.txt"
              missing=1
            fi
          done
          exit "$missing"

      - name: Delete old runs of listed workflows (fail closed)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "${RETAIN_HOURS} hours ago" +%Y-%m-%dT%H:%M:%SZ)
          deleted=0; failed=0
          while read -r wf; do
            [ -z "$wf" ] && continue
            if ! ids=$(gh api "repos/$REPO/actions/workflows/$wf/runs?per_page=100&created=<$cutoff" \
              -q '.workflow_runs[]|select(.status=="completed")|.id'); then
              echo "::error::could not list runs for $wf"; failed=$((failed+1)); continue
            fi
            for id in $ids; do
              if gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null; then deleted=$((deleted+1)); else
                echo "::error::could not delete run $id ($wf)"; failed=$((failed+1)); fi
            done
          done < .github/pii-log-workflows.txt
          echo "deleted=$deleted failed=$failed"
          [ "$failed" -eq 0 ]
