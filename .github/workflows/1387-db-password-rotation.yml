name: 1387 DB Password Rotation (Founder-triggered, generates own credential)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose the normal rotation or the incident repair phase"
        required: false
        default: rotate
        type: choice
        options:
          - rotate
          - repair-localhost
      confirm:
        description: "Type the confirmation phrase for the selected mode"
        required: true

concurrency:
  # Share the deploy gate so in-place rotation cannot race automatic deploys
  # or the staged phases embedded in deploy.yml.
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rotate:
    if: github.event.inputs.mode == '' || github.event.inputs.mode == 'rotate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRM_INPUT: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM_INPUT" != "ROTATE" ]; then
            echo "::error::Confirmation input must be exactly ROTATE. Aborting, nothing touched."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Setup pinned SSH identity
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$PI_SSH_KEY"
          test -n "$PI_HOST_KEY"
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          printf '%s\n' "$PI_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Take a fresh pre-rotation backup (belt-and-suspenders on top of the 6h cron)
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_USER}@${PI_HOST}" bash <<'REMOTE'
          set -euo pipefail
          cd /home/admin/backend
          if [[ -f /home/admin/backups/pre-rotation/1387-staged/rotation-state.env ]]; then
            echo "::error::A staged principal rotation is active. Do not mix the in-place and staged paths."
            exit 1
          fi
          DB_USER=$(grep '^DB_USERNAME=' .env | cut -d= -f2-)
          DB_PASS=$(grep '^DB_PASSWORD=' .env | cut -d= -f2-)
          STAMP=$(date '+%Y-%m-%d_%H%M%S')
          OUT="/home/admin/backups/pre-rotation/alltrue_pre_rotation_${STAMP}.sql.gz"
          mkdir -p /home/admin/backups/pre-rotation
          mysqldump -h 127.0.0.1 -u "$DB_USER" -p"$DB_PASS" --single-transaction --routines --triggers AllTrue \
            | gzip > "$OUT"
          test -s "$OUT"
          echo "pre-rotation backup: $(basename "$OUT") ($(du -h "$OUT" | cut -f1))"
          REMOTE

      - name: Generate and apply new credential entirely on the remote host (never leaves the Pi)
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_USER}@${PI_HOST}" bash <<'REMOTE' > /tmp/rotation-result.txt
          set -euo pipefail
          cd /home/admin/backend
          DB_USER=$(grep '^DB_USERNAME=' .env | cut -d= -f2-)
          OLD_ENV_BACKUP="/home/admin/backups/pre-rotation/env_pre_rotation_$(date '+%Y-%m-%d_%H%M%S').bak"
          mkdir -p /home/admin/backups/pre-rotation
          cp .env "$OLD_ENV_BACKUP"
          chmod 600 "$OLD_ENV_BACKUP"

          # Generated, used, and discarded entirely within this remote shell.
          # Never echoed, never written outside this process's memory + the
          # two places it must legitimately end up (MySQL, .env).
          NEW_PASS="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9')"

          # ALTER USER '<name>'@'localhost' hardcodes a host part that doesn't match
          # how this script actually connects (-h 127.0.0.1 authenticates against the
          # grant table row for @'127.0.0.1' or @'%', not @'localhost' -- those are
          # distinct accounts to MySQL). That mismatch is what failed the 2026-08-07
          # rotation attempt with "ERROR 1396 (HY000): Operation ALTER USER failed".
          # CURRENT_USER() always resolves to the exact account that authenticated
          # this connection, regardless of which host pattern its grant row uses.
          mysql -h 127.0.0.1 -u "$DB_USER" -p"$(grep '^DB_PASSWORD=' .env | cut -d= -f2-)" \
            -e "ALTER USER CURRENT_USER() IDENTIFIED BY '${NEW_PASS}'; FLUSH PRIVILEGES;"

          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=${NEW_PASS}|" .env

          # Verify the NEW credential (and only the new one) now authenticates,
          # without ever printing it -- a nonzero mysqladmin exit fails this step.
          mysqladmin -h 127.0.0.1 -u "$DB_USER" -p"$(grep '^DB_PASSWORD=' .env | cut -d= -f2-)" ping --silent

          unset NEW_PASS
          php artisan config:cache
          echo "rotation-applied"
          echo "old-env-backup=$(basename "$OLD_ENV_BACKUP")"
          REMOTE
          cat /tmp/rotation-result.txt
          grep -q '^rotation-applied$' /tmp/rotation-result.txt
          rm -f /tmp/rotation-result.txt

      - name: Reload PHP-FPM so no worker keeps an already-open persistent DB connection
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          set -euo pipefail
          # config:cache alone does not evict an existing PDO::ATTR_PERSISTENT
          # connection already held by a running PHP-FPM worker -- that
          # connection stays authenticated under the OLD password until the
          # worker process itself is recycled. This repo's DB_PERSISTENT
          # option (docs/DB_PERF.md) may or may not be enabled in the current
          # production .env; reload unconditionally rather than branch on it,
          # since a reload is safe either way and this is the same command
          # scripts/deploy-to-pi.sh already documents as the sanctioned
          # manual fallback for exactly this class of staleness.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_USER}@${PI_HOST}" bash <<'REMOTE'
          set -euo pipefail
          cd /home/admin/backend
          if grep -q '^DB_PERSISTENT=true' .env 2>/dev/null; then
            echo "DB_PERSISTENT=true detected -- FPM reload is required, not just defense-in-depth."
          else
            echo "DB_PERSISTENT not set to true -- reloading anyway as defense-in-depth."
          fi
          if sudo -n service php8.2-fpm reload 2>/tmp/fpm_reload_err; then
            echo "php8.2-fpm reload: OK"
          else
            echo "::warning::php8.2-fpm reload via sudo -n failed (no passwordless sudo, or service name differs)."
            cat /tmp/fpm_reload_err 2>/dev/null || true
            DEPLOY_SECRET="$(grep '^DEPLOY_SECRET=' .env | cut -d= -f2-)"
            if [[ -z "$DEPLOY_SECRET" ]]; then
              echo "::error::FPM reload failed and DEPLOY_SECRET is unavailable; refusing to declare rotation safe."
              exit 1
            fi
            for attempt in $(seq 1 16); do
              OPCACHE_RESPONSE=$(curl -skf -X POST \
                https://daan.lifenet.com.tw/api/internal/opcache-reset \
                -H "X-Deploy-Secret: ${DEPLOY_SECRET}" \
                -H "Connection: close" \
                -H "Content-Type: application/json")
              if ! echo "$OPCACHE_RESPONSE" | grep -q '"ok":true' || \
                 ! echo "$OPCACHE_RESPONSE" | grep -q '"db_connection_refreshed":true'; then
                echo "::error::FPM reload failed and protected web-process refresh did not confirm DB connection reset on attempt ${attempt}."
                exit 1
              fi
            done
            unset DEPLOY_SECRET OPCACHE_RESPONSE
            echo "FPM OPcache/config and DB connection refresh endpoint: OK across 16 worker requests"
          fi
          rm -f /tmp/fpm_reload_err
          REMOTE

      - name: Verify application health and a real DB-dependent read on the new credential
        env:
          PRODUCTION_URL: https://daan.lifenet.com.tw
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            HEALTH=$(curl -sf "$PRODUCTION_URL/api/v1/health" || true)
            echo "attempt $i: $HEALTH"
            echo "$HEALTH" | grep -q '"status":"ok"' && break
            sleep 3
          done
          echo "$HEALTH" | grep -q '"status":"ok"' || { echo "::error::Health check did not return ok after rotation"; exit 1; }
          VERSION=$(curl -sf "$PRODUCTION_URL/version.json")
          echo "version endpoint (DB-independent, confirms app process is up): $VERSION"
          BRANCHES=$(curl -sf -H 'Accept: application/json' "$PRODUCTION_URL/api/v1/branches")
          echo "$BRANCHES" | grep -q '^\[' || { echo "::error::DB-dependent branches read did not return a JSON array after rotation"; exit 1; }

  repair_localhost_principal:
    name: Repair DB localhost principal from app credential
    if: github.event.inputs.mode == 'repair-localhost'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require explicit repair confirmation
        env:
          CONFIRM_INPUT: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_INPUT" != "REPAIR_LOCALHOST_PRINCIPAL" ]; then
            echo "::error::Confirmation input must be exactly REPAIR_LOCALHOST_PRINCIPAL. Aborting, nothing touched."
            exit 1
          fi

      - name: Setup pinned SSH identity
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$PI_SSH_KEY"
          test -n "$PI_HOST_KEY"
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          printf '%s\n' "$PI_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Align the confirmed localhost account and verify TCP DB access
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_USER}@${PI_HOST}" bash <<'REMOTE'
          set -euo pipefail
          umask 077
          cd /home/admin/backend

          read_env() {
            local key="$1"
            grep -m1 "^${key}=" .env | cut -d= -f2-
          }
          DB_USER="$(read_env DB_USERNAME)"
          DB_PASS="$(read_env DB_PASSWORD)"
          DB_DATABASE="$(read_env DB_DATABASE)"
          DB_HOST="$(read_env DB_HOST)"
          DB_PORT="$(read_env DB_PORT)"
          DB_HOST="${DB_HOST:-127.0.0.1}"
          DB_PORT="${DB_PORT:-3306}"
          [[ "$DB_USER" =~ ^[A-Za-z0-9_]+$ ]] || { echo "::error::Unexpected DB username shape; nothing touched."; exit 1; }
          [[ "$DB_PASS" =~ ^[A-Za-z0-9]+$ ]] || { echo "::error::DB password contains unsupported characters for this guarded repair; nothing touched."; exit 1; }
          [[ -n "$DB_DATABASE" ]] || { echo "::error::DB_DATABASE is missing; nothing touched."; exit 1; }

          STAMP="$(date '+%Y-%m-%d_%H%M%S')"
          BACKUP="/home/admin/backups/pre-rotation/localhost-principal-repair-${STAMP}.env.bak"
          mkdir -p /home/admin/backups/pre-rotation
          cp .env "$BACKUP"
          chmod 600 "$BACKUP"

          REPAIRED=0
          # Prefer an existing protected pre-rotation .env credential. This
          # can repair the account without root because MySQL permits an
          # account to change its own password. Accept it only when the
          # authenticated principal is exactly DB_USER@localhost.
          shopt -s nullglob
          for CANDIDATE_FILE in \
            /home/admin/backups/pre-rotation/env_pre_rotation_*.bak \
            /home/admin/backups/pre-rotation/env_pre_staged_cutover_*.bak; do
            CANDIDATE_PASS="$(grep -m1 '^DB_PASSWORD=' "$CANDIDATE_FILE" | cut -d= -f2-)"
            [[ "$CANDIDATE_PASS" =~ ^[A-Za-z0-9]+$ ]] || continue
            AUTHENTICATED_PRINCIPAL="$(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" \
              -u "$DB_USER" -p"$CANDIDATE_PASS" --batch --skip-column-names \
              -e "SELECT CURRENT_USER()" 2>/dev/null || true)"
            if [[ "$AUTHENTICATED_PRINCIPAL" == "${DB_USER}@localhost" ]]; then
              mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" \
                -u "$DB_USER" -p"$CANDIDATE_PASS" \
                -e "ALTER USER CURRENT_USER() IDENTIFIED BY '${DB_PASS}'; FLUSH PRIVILEGES;"
              REPAIRED=1
              break
            fi
          done
          shopt -u nullglob

          # Try the local socket with the SSH account's existing MySQL auth
          # before requiring sudo. This is useful on hosts where the deploy
          # account is mapped to a local administrative MySQL principal.
          if [[ "$REPAIRED" -ne 1 ]] && mysql --protocol=socket --batch --skip-column-names \
            -e "SELECT 1" >/dev/null 2>&1; then
            mysql --protocol=socket \
              -e "ALTER USER '${DB_USER}'@'localhost' IDENTIFIED BY '${DB_PASS}'; FLUSH PRIVILEGES;"
            REPAIRED=1
          fi

          # Root fallback is retained for the case where no protected old
          # credential or deploy-account socket auth can authenticate. sudo -n
          # fails closed if root access is not configured on the Pi.
          # Root fallback is retained for the case where no protected old
          # credential or deploy-account socket auth can authenticate. sudo -n
          # fails closed if root access is not configured on the Pi.
          if [[ "$REPAIRED" -ne 1 ]]; then
            sudo -n mysql --protocol=socket \
              -e "ALTER USER '${DB_USER}'@'localhost' IDENTIFIED BY '${DB_PASS}'; FLUSH PRIVILEGES;"
          fi

          mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" \
            -u "$DB_USER" -p"$DB_PASS" "$DB_DATABASE" \
            --batch --skip-column-names -e "SELECT 1" >/dev/null
          php artisan config:cache >/dev/null
          echo "localhost-principal-repair=OK backup=$(basename "$BACKUP")"
          unset DB_PASS
          REMOTE

      - name: Remove local key material
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Remove local key material
        if: always()
        run: rm -f ~/.ssh/deploy_key /tmp/rotation-result.txt
