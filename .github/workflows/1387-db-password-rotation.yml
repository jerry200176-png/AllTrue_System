name: 1387 DB Password Rotation (Founder-triggered, generates own credential)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Legacy rotation is retired; choose the guarded principal repair only when directed"
        required: false
        default: rotate
        type: choice
        options:
          - rotate
          - repair-principal
      confirm:
        description: "Type the confirmation phrase for the selected mode"
        required: true

concurrency:
  # Share the deploy gate so the guarded repair cannot race automatic deploys
  # or the staged phases embedded in deploy.yml.
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rotate:
    if: github.event.inputs.mode == '' || github.event.inputs.mode == 'rotate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRM_INPUT: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_INPUT" != "ROTATE" ]; then
            echo "::error::Confirmation input must be exactly ROTATE. Aborting, nothing touched."
            exit 1
          fi
          echo "::error::In-place rotation is retired after the 2026-08-22 production outage. Use deploy.yml phase1-create/phase2-cutover/phase3-lock instead; no production state was touched."
          exit 1

  repair_db_principal:
    name: Repair DB principal from app credential
    if: github.event.inputs.mode == 'repair-principal'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require explicit repair confirmation
        env:
          CONFIRM_INPUT: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_INPUT" != "REPAIR_DB_PRINCIPAL" ]; then
            echo "::error::Confirmation input must be exactly REPAIR_DB_PRINCIPAL. Aborting, nothing touched."
            exit 1
          fi

      - name: Setup pinned SSH identity
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$PI_SSH_KEY"
          test -n "$PI_HOST_KEY"
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          printf '%s\n' "$PI_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Align the confirmed account and verify TCP DB access
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_USER}@${PI_HOST}" bash <<'REMOTE'
          set -euo pipefail
          umask 077
          cd /home/admin/backend

          read_env() {
            local key="$1"
            grep -m1 "^${key}=" .env | cut -d= -f2-
          }
          DB_USER="$(read_env DB_USERNAME)"
          DB_PASS="$(read_env DB_PASSWORD)"
          DB_DATABASE="$(read_env DB_DATABASE)"
          DB_HOST="$(read_env DB_HOST)"
          DB_PORT="$(read_env DB_PORT)"
          DB_HOST="${DB_HOST:-127.0.0.1}"
          DB_PORT="${DB_PORT:-3306}"
          [[ "$DB_USER" =~ ^[A-Za-z0-9_]+$ ]] || { echo "::error::Unexpected DB username shape; nothing touched."; exit 1; }
          [[ "$DB_PASS" =~ ^[A-Za-z0-9]+$ ]] || { echo "::error::DB password contains unsupported characters for this guarded repair; nothing touched."; exit 1; }
          [[ -n "$DB_DATABASE" ]] || { echo "::error::DB_DATABASE is missing; nothing touched."; exit 1; }

          STAMP="$(date '+%Y-%m-%d_%H%M%S')"
          BACKUP="/home/admin/backups/pre-rotation/principal-repair-${STAMP}.env.bak"
          mkdir -p /home/admin/backups/pre-rotation
          cp .env "$BACKUP"
          chmod 600 "$BACKUP"

          REPAIRED=0
          # Prefer an existing protected pre-rotation .env credential. This
          # can repair the account without root because MySQL permits an
          # account to change its own password. Keep this narrow fallback
          # limited to the historical localhost repair case.
          shopt -s nullglob
          for CANDIDATE_FILE in \
            /home/admin/backups/pre-rotation/env_pre_rotation_*.bak \
            /home/admin/backups/pre-rotation/env_pre_staged_cutover_*.bak; do
            CANDIDATE_PASS="$(grep -m1 '^DB_PASSWORD=' "$CANDIDATE_FILE" | cut -d= -f2-)"
            [[ "$CANDIDATE_PASS" =~ ^[A-Za-z0-9]+$ ]] || continue
            AUTHENTICATED_PRINCIPAL="$(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" \
              -u "$DB_USER" -p"$CANDIDATE_PASS" --batch --skip-column-names \
              -e "SELECT CURRENT_USER()" 2>/dev/null || true)"
            if [[ "$AUTHENTICATED_PRINCIPAL" == "${DB_USER}@localhost" ]]; then
              mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" \
                -u "$DB_USER" -p"$CANDIDATE_PASS" \
                -e "ALTER USER CURRENT_USER() IDENTIFIED BY '${DB_PASS}'; FLUSH PRIVILEGES;"
              REPAIRED=1
              break
            fi
          done
          shopt -u nullglob

          # Resolve the actual grant row before changing it. Never assume
          # localhost: this incident's production account was DB_USER@'%'.
          resolve_account_host() {
            local MYSQL_COMMAND=("$@")
            local HOSTS
            HOSTS="$("${MYSQL_COMMAND[@]}" --batch --skip-column-names \
              -e "SELECT Host FROM mysql.user WHERE User='${DB_USER}' ORDER BY Host;")" || return 1
            mapfile -t ACCOUNT_HOSTS <<< "$HOSTS"
            [[ "${#ACCOUNT_HOSTS[@]}" -eq 1 ]] || {
              echo "::error::Expected exactly one MySQL grant row for ${DB_USER}; found ${#ACCOUNT_HOSTS[@]}. Nothing touched."
              return 1
            }
            ACCOUNT_HOST="${ACCOUNT_HOSTS[0]}"
            [[ "$ACCOUNT_HOST" =~ ^[A-Za-z0-9_.%:-]+$ ]] || {
              echo "::error::Unexpected MySQL host pattern. Nothing touched."
              return 1
            }
          }

          # Try the local socket with the SSH account's existing MySQL auth
          # before requiring sudo. This is useful on hosts where the deploy
          # account is mapped to a local administrative MySQL principal.
          if [[ "$REPAIRED" -ne 1 ]] && mysql --protocol=socket --batch --skip-column-names \
            -e "SELECT 1" >/dev/null 2>&1; then
            SOCKET_MYSQL=(mysql --protocol=socket)
            if resolve_account_host "${SOCKET_MYSQL[@]}"; then
              "${SOCKET_MYSQL[@]}" \
                -e "ALTER USER '${DB_USER}'@'${ACCOUNT_HOST}' IDENTIFIED BY '${DB_PASS}'; FLUSH PRIVILEGES;"
              REPAIRED=1
            fi
          fi

          # Root fallback is retained for the case where no protected old
          # credential or deploy-account socket auth can authenticate. sudo -n
          # fails closed if root access is not configured on the Pi.
          if [[ "$REPAIRED" -ne 1 ]]; then
            ROOT_MYSQL=(sudo -n mysql --protocol=socket)
            resolve_account_host "${ROOT_MYSQL[@]}" || {
              echo "::error::Could not resolve one exact MySQL grant row for ${DB_USER}; nothing touched."
              exit 1
            }
            "${ROOT_MYSQL[@]}" \
              -e "ALTER USER '${DB_USER}'@'${ACCOUNT_HOST}' IDENTIFIED BY '${DB_PASS}'; FLUSH PRIVILEGES;"
            REPAIRED=1
          fi

          mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" \
            -u "$DB_USER" -p"$DB_PASS" "$DB_DATABASE" \
            --batch --skip-column-names -e "SELECT 1" >/dev/null
          php artisan config:cache >/dev/null
          EXPECTED_DB_ACCOUNT="$(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" \
            -u "$DB_USER" -p"$DB_PASS" --batch --skip-column-names \
            -e "SELECT CURRENT_USER()")"
          APP_DB_ACCOUNT="$(EXPECTED_DB_ACCOUNT="$EXPECTED_DB_ACCOUNT" \
            php artisan tinker --execute='
            \Illuminate\Support\Facades\DB::purge("mysql");
            echo \Illuminate\Support\Facades\DB::selectOne("SELECT CURRENT_USER() AS account")->account;
            ' 2>/dev/null)"
          [[ "$APP_DB_ACCOUNT" == "$EXPECTED_DB_ACCOUNT" ]] || {
            echo "::error::Laravel principal does not match the verified MySQL principal; nothing further declared safe."
            exit 1
          }
          echo "laravel-db-principal=OK account=${APP_DB_ACCOUNT}"
          echo "principal-repair=OK account_host=${ACCOUNT_HOST:-historical-localhost-fallback} backup=$(basename "$BACKUP")"
          unset DB_PASS
          REMOTE

      - name: Verify a real DB-dependent production read
        env:
          PRODUCTION_URL: https://daan.lifenet.com.tw
        run: |
          set -euo pipefail
          BRANCHES=$(curl -sf -H 'Accept: application/json' "$PRODUCTION_URL/api/v1/branches")
          echo "$BRANCHES" | grep -q '^\[' || {
            echo "::error::DB-dependent branches read did not return a JSON array."
            exit 1
          }

      - name: Remove local key material and temporary result
        if: always()
        run: rm -f ~/.ssh/deploy_key /tmp/rotation-result.txt
