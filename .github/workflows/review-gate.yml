name: Review gate

# Publishes check run `review/final-head` on each open PR head: success only when
# Codex completed a clean review of that exact SHA (or the independent-review
# fallback marker names it), in_progress otherwise. Same rule as the land queue
# (.github/scripts/review-gate.mjs). Native auto-merge waits on it once the
# main ruleset requires it; until then the script switches auto-merge off on
# unreviewed heads. Runs the script from the default branch only and never
# checks out or executes PR code.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, dismissed]
  schedule:
    - cron: "*/10 * * * *"   # sweep: heads moved by GITHUB_TOKEN pushes fire no PR events
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A sweep and an event may publish to the same head. Serialize every publisher
  # across triggers/refs so an older read cannot overtake a newer pending verdict.
  group: review-gate
  cancel-in-progress: false
  queue: max

jobs:
  gate:
    name: Final-head review gate
    if: ${{ github.event_name != 'issue_comment' || github.event.issue.pull_request }}
    permissions:
      contents: write       # disable auto-merge on unreviewed heads (until the ruleset requires the check)
      pull-requests: write
      checks: write         # create the review/final-head check run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check default-branch publisher installation
        id: installation
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -f .github/scripts/review-gate.mjs ]; then
            echo 'installed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rules_file="$(mktemp "$RUNNER_TEMP/review-gate-rules.XXXXXX")"
          trap 'rm -f "$rules_file"' EXIT
          gh api "repos/${REPO}/rules/branches/main" > "$rules_file"
          python3 - "$rules_file" <<'PY'
          import json
          import sys
          rules = json.load(open(sys.argv[1], encoding="utf-8"))
          if not isinstance(rules, list):
              raise SystemExit("Default-branch rules unknown; publisher installation fails closed")
          for rule in rules:
              if not isinstance(rule, dict) or not isinstance(rule.get("type"), str) or not rule["type"]:
                  raise SystemExit("Default-branch rule schema unknown; publisher installation fails closed")
              if rule["type"] != "required_status_checks":
                  continue
              params = rule.get("parameters")
              checks = params.get("required_status_checks") if isinstance(params, dict) else None
              if not isinstance(checks, list) or any(not isinstance(c, dict) or not isinstance(c.get("context"), str) or not c["context"] for c in checks):
                  raise SystemExit("Required-check schema unknown; publisher installation fails closed")
              if any(c["context"] == "review/final-head" for c in checks):
                  raise SystemExit("Required publisher missing from default branch; no review verdict published")
          print("::notice::Review publisher not installed on default branch; no review verdict published. Existing merge gates remain required.")
          PY
          echo 'installed=false' >> "$GITHUB_OUTPUT"

      - name: Evaluate final-head review
        if: ${{ steps.installation.outputs.installed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: node .github/scripts/review-gate.mjs
