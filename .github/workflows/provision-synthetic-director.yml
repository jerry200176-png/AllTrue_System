name: Verify synthetic director acceptance identity

# The identity is created through the normal public registration route by
# scripts/acceptance/register-synthetic-director.mjs. A Founder then approves
# the pending row in AllTrue. This workflow is intentionally post-approval:
# it only verifies the supplied dedicated credentials and never obtains or
# borrows an administrator session.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'post-approval-verify checks the approved campus-16 identity'
        required: true
        type: choice
        options:
          - post-approval-verify
      confirm:
        description: 'Type VERIFY_SYNTHETIC_DIRECTOR:POST_APPROVAL:CAMPUS:16'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: alltrue-production-identity-verification-v1
  cancel-in-progress: false

env:
  CANONICAL_REF: alltrue-smoke-director-campus16-v1
  CANONICAL_ACCOUNT: alltrue-smoke-director-campus16-v1
  CAMPUS_ID: '16'

jobs:
  contract:
    name: Validate post-approval verification contract
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Validate fixed scope and secret consumers
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$MODE" = post-approval-verify
          test "$CONFIRM" = 'VERIFY_SYNTHETIC_DIRECTOR:POST_APPROVAL:CAMPUS:16'
          test "$CANONICAL_ACCOUNT" = "$CANONICAL_REF"
          test "$CAMPUS_ID" = 16
          grep -Fq "Route::post('directors/register'" backend/routes/api.php
          grep -Fq "Route::post('directors/{id}/approve'" backend/routes/api.php
          grep -Fq 'secrets.SMOKE_DIRECTOR_USER' .github/workflows/calendar-course-acceptance.yml
          grep -Fq 'secrets.SMOKE_DIRECTOR_PASS' .github/workflows/calendar-course-acceptance.yml
          grep -Fq 'secrets.SMOKE_DIRECTOR_USER' .github/workflows/ui-smoke.yml
          grep -Fq 'secrets.SMOKE_DIRECTOR_PASS' .github/workflows/ui-smoke.yml
          forbidden_token_table='auth_'"tokens"
          forbidden_role='super_'"admin"
          ! grep -Fq "$forbidden_token_table" .github/workflows/provision-synthetic-director.yml
          ! grep -Fq "$forbidden_role" .github/workflows/provision-synthetic-director.yml

  verify:
    name: Verify approved campus 16 identity
    needs: contract
    if: ${{ needs.contract.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Login without printing credentials
        env:
          BASE_URL: ${{ secrets.SMOKE_BASE_URL || 'https://daan.lifenet.com.tw' }}
          SMOKE_DIRECTOR_LOGIN: ${{ secrets.SMOKE_DIRECTOR_USER }}
          SMOKE_DIRECTOR_PASSWORD: ${{ secrets.SMOKE_DIRECTOR_PASS }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$MODE" = post-approval-verify
          test "$CONFIRM" = 'VERIFY_SYNTHETIC_DIRECTOR:POST_APPROVAL:CAMPUS:16'
          test -n "$SMOKE_DIRECTOR_LOGIN" && test "$SMOKE_DIRECTOR_LOGIN" = "$CANONICAL_ACCOUNT"
          test -n "$SMOKE_DIRECTOR_PASSWORD"
          umask 077
          request_file="$RUNNER_TEMP/synthetic-director-login.json"
          response_file="$RUNNER_TEMP/synthetic-director-login-response.json"
          trap 'rm -f "$request_file" "$response_file"' EXIT
          exec 9<<<"$SMOKE_DIRECTOR_LOGIN"
          exec 10<<<"$SMOKE_DIRECTOR_PASSWORD"
          unset SMOKE_DIRECTOR_LOGIN SMOKE_DIRECTOR_PASSWORD
          jq -n --rawfile account /dev/fd/9 --rawfile password /dev/fd/10 \
            '{account:($account|rtrimstr("\n")|sub("^\\s+";"")|sub("\\s+$";"")),password:($password|rtrimstr("\n")),role:"director"}' \
            > "$request_file"
          exec 9<&- 10<&-
          chmod 600 "$request_file"
          login_status="$(curl -sS --proto '=https' --tlsv1.2 -o "$response_file" -w '%{http_code}' \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            --data-binary "@$request_file" "$BASE_URL/api/v1/auth/login")"
          test "$login_status" = 200
          jq -e '
            .data.user.role == "director" and
            (.data.user.campuses | type == "array" and length == 1 and .[0] == 16) and
            .data.user.must_change_password == false
          ' "$response_file" >/dev/null
          echo "identity=verified canonical_ref=$CANONICAL_REF campus=16"
