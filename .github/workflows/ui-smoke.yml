name: UI Smoke (Playwright)

# #547 / Epic #535 Phase 4.3 起 — 前端 UI smoke（對 production 只讀導航）。
#
# 觸發策略（#730，FinOps 節流；目前不是 required check，#3506 實站 smoke 仍失敗）：
#   - pull_request：job 一律啟動（check 名稱穩定，可加入 branch protection required），
#     但「Detect frontend diff」判斷本 PR 是否動到產品前端、smoke 定義、
#     Playwright 設定、依賴或本 workflow；
#     沒動 → 秒過、不下載瀏覽器、不跑 Playwright（省 Actions minutes）；
#     有動 → 才真正跑 E2E。
#     ⚠️ 刻意「不用 workflow 層 paths:」過濾——path-filtered 的 required check 在不符路徑時
#     會永遠 pending、卡住 merge（GitHub 已知陷阱）。改用「always-run + 內部偵測」。
#   - schedule / workflow_dispatch：一律完整跑（對 production 週檢 / 手動）。
#
# Secrets：完整 production smoke 需 SMOKE_BASE_URL、SMOKE_DIRECTOR_*、SMOKE_TEACHER_*；
# 缺少任一項時在安裝依賴前明確失敗，不能以 spec skip 產生綠燈。
# 家長入口 smoke（SMOKE_PARENT_*）尚無 repo secrets，不在本 gate 宣稱的驗證範圍；補上 secrets 後再納入必要項。
# 見 OPERATIONS_RUNBOOK §B2 節流原則。

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
  schedule:
    # 每週一 02:30 UTC（台灣 10:30）對 production 跑一次煙霧測試
    - cron: '30 2 * * 1'

permissions:
  contents: read

# A newer head for the same PR supersedes its older production smoke run.
# Scheduled and manually dispatched checks get unique groups and keep running.
concurrency:
  group: ui-smoke-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui-smoke:
    name: UI Smoke (Playwright)
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect frontend diff (PR only)
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "Event=$EVENT → 完整跑 E2E"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA"); then
            echo "::error title=UI Smoke changed-path detection failed::Cannot compare PR base and head; refusing to skip Playwright."
            exit 1
          fi
          echo "Changed files:"; echo "$CHANGED"
          if grep -qE '^frontend/(src/|e2e/|playwright\.config\.js$|package(-lock)?\.json$)|^\.github/workflows/ui-smoke\.yml$' <<< "$CHANGED"; then
            echo "→ UI smoke 相關路徑有變動，跑 E2E"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "→ 本 PR 未動 UI smoke 相關路徑，略過 E2E（FinOps 節流）"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No smoke-relevant diff — skipping E2E
        if: steps.detect.outputs.run != 'true'
        run: echo "✅ 無 UI smoke 相關 diff，Playwright 略過；本 job 未驗證正式站。"

      - name: Require production smoke secrets (TD-070)
        if: steps.detect.outputs.run == 'true'
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          SMOKE_DIRECTOR_USER: ${{ secrets.SMOKE_DIRECTOR_USER }}
          SMOKE_DIRECTOR_PASS: ${{ secrets.SMOKE_DIRECTOR_PASS }}
          SMOKE_TEACHER_USER: ${{ secrets.SMOKE_TEACHER_USER }}
          SMOKE_TEACHER_PASS: ${{ secrets.SMOKE_TEACHER_PASS }}
        run: |
          set -euo pipefail
          missing=()
          for name in SMOKE_BASE_URL SMOKE_DIRECTOR_USER SMOKE_DIRECTOR_PASS SMOKE_TEACHER_USER SMOKE_TEACHER_PASS; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=UI Smoke credentials unavailable::Missing required smoke inputs: ${missing[*]}"
            exit 1
          fi
          echo "Required smoke inputs are present; Playwright must execute."

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.detect.outputs.run == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        if: steps.detect.outputs.run == 'true'
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser (chromium)
        if: steps.detect.outputs.run == 'true'
        working-directory: frontend
        run: |
          # Avoid Google Chrome apt hash-mismatch flakes on apt-get update inside --with-deps.
          sudo find /etc/apt -type f -exec grep -l 'dl.google.com/linux/chrome' {} + 2>/dev/null | sudo xargs -r rm -f || true
          sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/*chrome* || true
          sudo rm -rf /var/lib/apt/lists/partial /var/lib/apt/lists/*chrome* || true
          sudo apt-get update -y || true
          npx playwright install --with-deps chromium

      - name: Run UI smoke
        if: steps.detect.outputs.run == 'true'
        working-directory: frontend
        env:
          CI: 'true'
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          SMOKE_DIRECTOR_USER: ${{ secrets.SMOKE_DIRECTOR_USER }}
          SMOKE_DIRECTOR_PASS: ${{ secrets.SMOKE_DIRECTOR_PASS }}
          SMOKE_TEACHER_USER: ${{ secrets.SMOKE_TEACHER_USER }}
          SMOKE_TEACHER_PASS: ${{ secrets.SMOKE_TEACHER_PASS }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ steps.detect.outputs.run == 'true' && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
