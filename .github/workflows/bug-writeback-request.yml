# governance-capability: in-app-lifecycle-writeback
name: Bug write-back request (Phase-A triage / follow-up)

# Governed cloud path for the in-app write-backs that otherwise need workflow_dispatch
# (Founder 2026-10-13). A merged PR appends entries to the request file; the request_ids added
# since the durable attempted prefix use the shared Phase-A/followup script in file order.
# Never resolved/closed (Phase-C keeps those). Public repo: the log
# carries request IDs, bug IDs, actions and counts only; remote output is discarded.
on:
  push:
    branches: [main]
    paths:
      - 'operations/closeout/bug-writeback.request.yml'
  workflow_dispatch:
    inputs:
      request_sha:
        description: Frozen reviewed main request snapshot (internal bounded drain)
        required: true
        type: string
      expected_prefix:
        description: Minimum visible checkpoint for internal continuation
        required: false
        default: '0'
        type: string
      push_before:
        description: Original push parent for per-push validation
        required: true
        type: string

# One run at a time; queue:max retains pending runs. Queue order is not push order.
# Each run attempts at most five IDs, recording an absolute prefix in its checkpoint step.
# History takes the maximum prefix so out-of-order runs cannot move it backwards. An internal
# main-only continuation drains the same frozen reviewed request SHA; failed IDs count as
# attempted (retry requires a new ID), so failures never create an infinite write loop.
concurrency:
  group: bug-writeback-request
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  actions: write # only to continue the same frozen main request snapshot

jobs:
  writeback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout request file, shared write-back scripts and SSH trust helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # ancestry against the last successful run
          filter: blob:none
          sparse-checkout: |
            .github/actions/production-ssh-trust
            operations/closeout/bug-writeback.request.yml
            backend/app/Services/BugReportService.php
            scripts/bug_writeback_request.py
            scripts/bug-writeback/run-remote.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Validate new requests (before any production access)
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_SHA: ${{ inputs.request_sha || github.sha }}
          PUSH_BEFORE: ${{ inputs.push_before || github.event.before }}
          EXPECTED_PREFIX: ${{ inputs.expected_prefix || '0' }}
          REQUEST: operations/closeout/bug-writeback.request.yml
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet 'pyyaml==6.0.2'
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "main only; refusing"; exit 1; }
          for sha in "$REQUEST_SHA" "$PUSH_BEFORE"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ && "$sha" != 0000000000000000000000000000000000000000 ]] || { echo "invalid snapshot; refusing"; exit 1; }
            git merge-base --is-ancestor "$sha" "$GITHUB_SHA" || { echo "snapshot outside main; refusing"; exit 1; }
          done
          git merge-base --is-ancestor "$PUSH_BEFORE" "$REQUEST_SHA" || { echo "invalid push parent; refusing"; exit 1; }
          git show "${REQUEST_SHA}:${REQUEST}" > "$RUNNER_TEMP/after.yml"
          if git cat-file -e "${PUSH_BEFORE}:${REQUEST}" 2>/dev/null; then
            git show "${PUSH_BEFORE}:${REQUEST}" > "$RUNNER_TEMP/push-before.yml"
          else
            : > "$RUNNER_TEMP/push-before.yml"
          fi
          prefix=0
          runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/bug-writeback-request.yml/runs?branch=main&status=completed&per_page=100" --jq '.workflow_runs[] | select(.conclusion != "cancelled") | .id')
          for rid in $runs; do
            attempted=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$rid/jobs" --jq '[.jobs[].steps[] | select(.conclusion == "success" and (.name | startswith("Checkpoint attempted prefix "))) | .name | capture("^Checkpoint attempted prefix (?<count>[0-9]+) (?<rid>[a-z0-9][a-z0-9-]{2,63})$") | .count | tonumber] | max // 0')
            [[ "$attempted" =~ ^[0-9]+$ ]] || { echo "invalid checkpoint; refusing"; exit 1; }
            if (( attempted > prefix )); then prefix="$attempted"; fi
          done
          [[ "$EXPECTED_PREFIX" =~ ^[0-9]+$ ]] && (( prefix >= EXPECTED_PREFIX )) || { echo "checkpoint not visible yet; retry"; exit 1; }
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          python3 scripts/bug_writeback_request.py --checkpoint-count "$prefix" --push-before "$RUNNER_TEMP/push-before.yml" --after "$RUNNER_TEMP/after.yml"
      - name: Configure pinned production SSH trust
        if: steps.plan.outputs.count != '0'
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Setup SSH
        if: steps.plan.outputs.count != '0'
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
        run: |
          set -euo pipefail
          test -n "$PI_SSH_KEY"
          test -n "$PI_SSH_HOST"
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Apply new requests (IDs-only log)
        id: apply
        if: steps.plan.outputs.count != '0'
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          PREFIX: ${{ steps.plan.outputs.prefix }}
        run: python3 scripts/bug_writeback_request.py --checkpoint-count "$PREFIX" --push-before "$RUNNER_TEMP/push-before.yml" --after "$RUNNER_TEMP/after.yml" --apply
      - name: Checkpoint attempted prefix ${{ steps.apply.outputs.checkpoint_count }} ${{ steps.apply.outputs.last_attempted_id }}
        id: checkpoint
        if: ${{ always() && steps.apply.outputs.last_attempted_id != '' }}
        run: echo "Attempted prefix recorded; failed IDs require a new request_id."
      - name: Continue remaining frozen requests
        if: ${{ always() && steps.checkpoint.outcome == 'success' && steps.apply.outputs.remaining != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_SHA: ${{ inputs.request_sha || github.sha }}
          PUSH_BEFORE: ${{ inputs.push_before || github.event.before }}
          EXPECTED_PREFIX: ${{ steps.apply.outputs.checkpoint_count }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
          gh workflow run bug-writeback-request.yml --ref main -f "request_sha=$REQUEST_SHA" -f "push_before=$PUSH_BEFORE" -f "expected_prefix=$EXPECTED_PREFIX"
