# Read-only production diagnostic for duplicate attendance slots.
# Manual only — never writes to DB.
name: ClassSession Duplicate Diagnostic (manual)

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Anchor date YYYY-MM-DD (scans ±7 days)"
        required: true
        type: string
      teacher_name:
        description: "Teacher name keyword (default 黃芝琳)"
        required: false
        type: string
        default: "黃芝琳"
      campus_id:
        description: "Campus id (default 9 = 新店)"
        required: false
        type: string
        default: "9"
      student_names:
        description: "Comma-separated student names"
        required: false
        type: string
        default: "王品方,陳品承"

concurrency:
  group: classsession-duplicate-diagnostic
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    name: Read-only ClassSession duplicate scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate inputs
        env:
          DATE: ${{ inputs.date }}
          CAMPUS_ID: ${{ inputs.campus_id }}
        run: |
          set -euo pipefail
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::date must be YYYY-MM-DD"; exit 1; }
          [[ "$CAMPUS_ID" =~ ^[0-9]+$ ]] || { echo "::error::campus_id must be numeric"; exit 1; }

      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.PI_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run read-only SQL on production
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          DATE: ${{ inputs.date }}
          TEACHER_NAME: ${{ inputs.teacher_name }}
          CAMPUS_ID: ${{ inputs.campus_id }}
          STUDENT_NAMES: ${{ inputs.student_names }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${PI_SSH_USER}@${PI_SSH_HOST}" \
            DATE="$DATE" TEACHER_NAME="$TEACHER_NAME" CAMPUS_ID="$CAMPUS_ID" STUDENT_NAMES="$STUDENT_NAMES" \
            'bash -s' <<'ENDSSH'
          set -euo pipefail
          DB_PASS=$(grep '^DB_PASSWORD=' /home/admin/backend/.env | cut -d= -f2-)
          DB_NAME=$(grep '^DB_DATABASE=' /home/admin/backend/.env | cut -d= -f2-)
          MYSQL=(mysql -h 127.0.0.1 -u admin -p"${DB_PASS}" "$DB_NAME" -N -B)

          echo "=== ClassSession Duplicate Diagnostic $(date '+%Y-%m-%d %H:%M:%S %Z') ==="
          echo "DATE=$DATE CAMPUS_ID=$CAMPUS_ID TEACHER_NAME=$TEACHER_NAME STUDENT_NAMES=$STUDENT_NAMES"
          echo ""

          echo "--- Teacher ---"
          "${MYSQL[@]}" -e "SELECT id, Name, LoginName FROM User WHERE Name LIKE CONCAT('%', '${TEACHER_NAME}', '%') LIMIT 10;"
          echo ""

          # Build IN list for students
          IFS=',' read -r -a NAMES <<< "$STUDENT_NAMES"
          IN_LIST=""
          for n in "${NAMES[@]}"; do
            n=$(echo "$n" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            [ -z "$n" ] && continue
            esc=$(printf "%s" "$n" | sed "s/'/\\\\'/g")
            if [ -z "$IN_LIST" ]; then IN_LIST="'$esc'"; else IN_LIST="$IN_LIST,'$esc'"; fi
          done

          echo "--- Students (campus $CAMPUS_ID) ---"
          "${MYSQL[@]}" -e "SELECT id, name, CampusID FROM Student WHERE name IN ($IN_LIST) AND CampusID=${CAMPUS_ID};"
          echo ""

          echo "--- Case sessions ±7d (non-cancelled) ---"
          "${MYSQL[@]}" -e "
          SELECT CONCAT_WS('|',
            s.name, cs.id, cs.StudentClassID, sc.Stop, sc.SessionCount, sc.ScheduleMode,
            IFNULL(sc.RemainingSessions,'null'), sc.TeacherID, cs.SessionDate,
            SUBSTRING(cs.StartTime,1,5), SUBSTRING(cs.EndTime,1,5), cs.Status,
            LEFT(IFNULL(cs.Note,''),80), IFNULL(cs.created_at,''), IFNULL(cs.updated_at,'')
          )
          FROM ClassSession cs
          JOIN StudentClass sc ON sc.ID = cs.StudentClassID
          JOIN Student s ON s.id = sc.StudentID
          WHERE s.name IN ($IN_LIST) AND s.CampusID=${CAMPUS_ID}
            AND cs.SessionDate BETWEEN DATE_SUB('${DATE}', INTERVAL 7 DAY)
                                  AND DATE_ADD('${DATE}', INTERVAL 7 DAY)
            AND LOWER(cs.Status) <> 'cancelled'
          ORDER BY s.name, cs.SessionDate, SUBSTRING(cs.StartTime,1,5), cs.StudentClassID, cs.id;
          "
          echo ""

          echo "--- Cross-SC scheduled overlaps (same student+date+start, campus ${CAMPUS_ID}, from today) ---"
          "${MYSQL[@]}" -e "
          SELECT CONCAT_WS('|',
            st.name, sc.TeacherID, cs.SessionDate, SUBSTRING(cs.StartTime,1,5),
            GROUP_CONCAT(DISTINCT cs.StudentClassID ORDER BY cs.StudentClassID),
            GROUP_CONCAT(cs.id ORDER BY cs.id),
            GROUP_CONCAT(CONCAT(sc.Stop,':',cs.Status) ORDER BY cs.id),
            COUNT(DISTINCT cs.StudentClassID)
          )
          FROM ClassSession cs
          JOIN StudentClass sc ON sc.ID = cs.StudentClassID
          JOIN Student st ON st.id = sc.StudentID
          WHERE st.CampusID=${CAMPUS_ID}
            AND cs.SessionDate >= '${DATE}'
            AND LOWER(cs.Status) = 'scheduled'
          GROUP BY st.id, st.name, sc.TeacherID, cs.SessionDate, SUBSTRING(cs.StartTime,1,5)
          HAVING COUNT(DISTINCT cs.StudentClassID) > 1
          ORDER BY cs.SessionDate, st.name
          LIMIT 100;
          "
          echo ""

          echo "--- Orphan Stop=1 future/today scheduled (campus ${CAMPUS_ID}) ---"
          "${MYSQL[@]}" -e "
          SELECT CONCAT_WS('|', cs.id, cs.StudentClassID, st.name, sc.TeacherID, cs.SessionDate,
            SUBSTRING(cs.StartTime,1,5), cs.Status)
          FROM ClassSession cs
          JOIN StudentClass sc ON sc.ID = cs.StudentClassID
          JOIN Student st ON st.id = sc.StudentID
          WHERE sc.Stop = 1
            AND LOWER(cs.Status) = 'scheduled'
            AND cs.SessionDate >= '${DATE}'
            AND st.CampusID=${CAMPUS_ID}
          ORDER BY cs.SessionDate, st.name
          LIMIT 100;
          "
          echo ""

          echo "--- System-wide scheduled cross-SC overlaps (all campuses, from today, top 50) ---"
          "${MYSQL[@]}" -e "
          SELECT CONCAT_WS('|',
            st.CampusID, st.name, sc.TeacherID, cs.SessionDate, SUBSTRING(cs.StartTime,1,5),
            GROUP_CONCAT(DISTINCT cs.StudentClassID ORDER BY cs.StudentClassID),
            GROUP_CONCAT(cs.id ORDER BY cs.id),
            GROUP_CONCAT(sc.Stop ORDER BY cs.id),
            COUNT(DISTINCT cs.StudentClassID)
          )
          FROM ClassSession cs
          JOIN StudentClass sc ON sc.ID = cs.StudentClassID
          JOIN Student st ON st.id = sc.StudentID
          WHERE cs.SessionDate >= '${DATE}'
            AND LOWER(cs.Status) = 'scheduled'
          GROUP BY st.CampusID, st.id, st.name, sc.TeacherID, cs.SessionDate, SUBSTRING(cs.StartTime,1,5)
          HAVING COUNT(DISTINCT cs.StudentClassID) > 1
          ORDER BY cs.SessionDate, st.CampusID, st.name
          LIMIT 50;
          "
          echo ""

          echo "--- System-wide orphan Stop=1 scheduled count from today ---"
          "${MYSQL[@]}" -e "
          SELECT COUNT(*) FROM ClassSession cs
          JOIN StudentClass sc ON sc.ID = cs.StudentClassID
          WHERE sc.Stop = 1 AND LOWER(cs.Status)='scheduled' AND cs.SessionDate >= '${DATE}';
          "
          echo ""

          echo "--- Artisan audit (branch 9) ---"
          cd /home/admin/backend
          php artisan classsession:audit-duplicates --branch_id=${CAMPUS_ID} 2>&1 | tail -80 || true
          echo ""
          echo "--- Orphan dry-run ---"
          php artisan fix:orphan-scheduled-sessions --dry-run 2>&1 | tail -80 || true
          echo "=== END ==="
          ENDSSH
