name: Yu Shengrui 3499 subject transfer repair (manual, one case)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (default) or execute or rollback"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - execute
          - rollback
      confirm:
        description: "For execute/rollback only: type I_APPROVE_YU_3499_TRANSFER"
        required: false
        type: string
      actor:
        description: "Audit actor label"
        required: false
        default: "gha:yu-3499"
        type: string

concurrency:
  group: repair-yu-shengrui-3499
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    name: Run allowlisted Yu Shengrui 3499 repair
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout pinned SSH trust helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            .github/actions/production-ssh-trust
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Validate inputs and set up SSH
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
        run: |
          set -euo pipefail
          case "$MODE" in dry-run|execute|rollback) ;; *) echo "::error::invalid mode"; exit 1 ;; esac
          if [ "$MODE" != "dry-run" ] && [ "$CONFIRM" != "I_APPROVE_YU_3499_TRANSFER" ]; then
            echo "::error::execute/rollback requires exact confirmation string"; exit 1
          fi
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Run repair on production
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          MODE: ${{ inputs.mode }}
          ACTOR: ${{ inputs.actor }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${PI_SSH_USER}@${PI_SSH_HOST}" \
            MODE="$MODE" ACTOR="$ACTOR" 'bash -s' <<'ENDSSH'
          set -euo pipefail
          cd /home/admin/backend

          echo "=== mode=${MODE} === (pre-state snapshot lives in session_corrections repair-yu-shengrui-3499)"
          CMD="php artisan repair:yu-shengrui-3499-transfer"

          [ "${MODE}" = "dry-run" ] && { $CMD; exit $?; }
          if [ "${MODE}" = "rollback" ]; then
            ALLOW_PROD_REPAIR=1 $CMD --rollback --execute --force
            exit $?
          fi
          # execute: exact-state preflight first (ALREADY_APPLIED short-circuits, drift aborts)
          PRE=$($CMD 2>&1) || { echo "$PRE"; echo "REPAIR_STATE=NOT_APPLIED"; exit 1; }
          echo "$PRE"
          if echo "$PRE" | grep -q 'ALREADY APPLIED'; then
            echo "Refusing duplicate execute - correction ledger shows applied."
            exit 0
          fi

          set +e
          ALLOW_PROD_REPAIR=1 $CMD --execute --force --actor="${ACTOR}"
          MUT_EC=$?
          $CMD --verify
          VER_EC=$?
          set -e
          [ "$MUT_EC" -eq 0 ] || { echo "REPAIR_STATE=NOT_APPLIED_OR_FAILED"; exit "$MUT_EC"; }
          [ "$VER_EC" -eq 0 ] || { echo "REPAIR_STATE=APPLIED_POSTVERIFY_FAILED; do NOT re-run execute"; exit 42; }
          echo "REPAIR_STATE=APPLIED_AND_VERIFIED"
          ENDSSH
