# Read-only Pi diagnose: 新店 游喨鈞 → COCO Tuesday transfer claim.
# Trigger: push to cursor/diag-coco-transfer-* (same-repo → secrets available).
# No writes. Temporary ops probe — do not merge to main as permanent workflow.
name: Coco Transfer Diagnose (push)

on:
  push:
    branches:
      - 'cursor/diag-coco-transfer-**'
  workflow_dispatch:

concurrency:
  group: coco-transfer-diagnose
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    name: Production read-only coco transfer probe
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.PI_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Probe student / COCO / Tuesday sessions
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p out
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${PI_SSH_USER}@${PI_SSH_HOST}" \
            'bash -s' <<'ENDSSH' | tee out/coco-transfer.log
          set -uo pipefail
          ENV_FILE=/home/admin/backend/.env
          DB_PASS=$(grep '^DB_PASSWORD=' "$ENV_FILE" | cut -d= -f2-)
          DB_NAME=$(grep '^DB_DATABASE=' "$ENV_FILE" | cut -d= -f2-)
          M=(mysql -h 127.0.0.1 -u admin -p"${DB_PASS}" "$DB_NAME" -N -B)
          cd /home/admin/backend
          echo "=== HEAD $(git rev-parse HEAD) generated=$(date -Iseconds) ==="
          echo "--- campuses (新店) ---"
          "${M[@]}" -e "SELECT CONCAT_WS('|',id,Name) FROM Campus WHERE Name LIKE '%新店%' OR id=9 LIMIT 10;" || true
          echo "--- students 游喨鈞 variants ---"
          "${M[@]}" -e "SELECT CONCAT_WS('|',id,Name,CampusID) FROM Student WHERE Name LIKE '%游%鈞%' OR Name LIKE '%游喨%' OR Name LIKE '%游亮%' LIMIT 20;" || true
          echo "--- teachers COCO / Coco ---"
          "${M[@]}" -e "SELECT CONCAT_WS('|',id,Name,IFNULL(LoginName,''),IFNULL(type,''),IFNULL(status,'')) FROM User WHERE Name LIKE '%Coco%' OR Name LIKE '%COCO%' OR LoginName LIKE '%coco%' OR LoginName LIKE '%COCO%' LIMIT 30;" || true
          echo "--- open/recent bugs matching keywords ---"
          "${M[@]}" -e "SELECT CONCAT_WS('|',id,status,severity,CampusID,page_key,created_at,REPLACE(REPLACE(IFNULL(title,''),'\\n',' '),'\\r','')) FROM bug_reports WHERE title LIKE '%游%' OR title LIKE '%COCO%' OR title LIKE '%Coco%' OR title LIKE '%轉%' OR description LIKE '%游喨%' OR description LIKE '%游亮%' ORDER BY id DESC LIMIT 30;" || true
          echo "--- bug queue counts ---"
          "${M[@]}" -e "SELECT CONCAT_WS('|',status,COUNT(*)) FROM bug_reports GROUP BY status;" || true
          echo "--- newest bugs ---"
          "${M[@]}" -e "SELECT CONCAT_WS('|',id,status,CampusID,page_key,created_at,LEFT(REPLACE(REPLACE(IFNULL(title,''),'\\n',' '),'\\r',''),120)) FROM bug_reports ORDER BY id DESC LIMIT 15;" || true
          echo "--- StudentClass for 游*鈞 (campus 9 preferred) ---"
          "${M[@]}" -e "SELECT CONCAT_WS('|',sc.ID,sc.StudentID,s.Name,s.CampusID,sc.TeacherID,IFNULL(u.Name,''),IFNULL(sc.SubjectID,''),IFNULL(sc.ClassType,''),sc.StartDate,IFNULL(sc.EndDate,''),sc.Stop,IFNULL(sc.week,''),IFNULL(sc.time,''),IFNULL(sc.week1,''),IFNULL(sc.time1,''),IFNULL(sc.week2,''),IFNULL(sc.time2,''),IFNULL(sc.SessionCount,''),IFNULL(sc.RemainingSessions,''))
            FROM StudentClass sc
            JOIN Student s ON s.id=sc.StudentID
            LEFT JOIN User u ON u.id=sc.TeacherID
            WHERE s.Name LIKE '%游%鈞%' OR s.Name LIKE '%游喨%' OR s.Name LIKE '%游亮%'
            ORDER BY s.CampusID, sc.Stop, sc.ID DESC LIMIT 40;" || true
          echo "--- upcoming Tue ClassSessions for student (next 8 weeks from today) ---"
          "${M[@]}" -e "SELECT CONCAT_WS('|',cs.id,cs.StudentClassID,s.Name,s.CampusID,sc.TeacherID,IFNULL(ut.Name,''),cs.SessionDate,DAYNAME(cs.SessionDate),SUBSTRING(cs.StartTime,1,5),SUBSTRING(cs.EndTime,1,5),cs.Status,
            (SELECT sch.teacher_id FROM schedules sch WHERE sch.student_course_id=sc.ID AND sch.schedule_date=cs.SessionDate AND SUBSTRING(sch.start_time,1,5)=SUBSTRING(cs.StartTime,1,5) AND sch.status='scheduled' ORDER BY (sch.teacher_id<>sc.TeacherID) DESC, sch.id DESC LIMIT 1),
            (SELECT u2.Name FROM schedules sch JOIN User u2 ON u2.id=sch.teacher_id WHERE sch.student_course_id=sc.ID AND sch.schedule_date=cs.SessionDate AND SUBSTRING(sch.start_time,1,5)=SUBSTRING(cs.StartTime,1,5) AND sch.status='scheduled' ORDER BY (sch.teacher_id<>sc.TeacherID) DESC, sch.id DESC LIMIT 1))
            FROM ClassSession cs
            JOIN StudentClass sc ON sc.ID=cs.StudentClassID
            JOIN Student s ON s.id=sc.StudentID
            LEFT JOIN User ut ON ut.id=sc.TeacherID
            WHERE (s.Name LIKE '%游%鈞%' OR s.Name LIKE '%游喨%' OR s.Name LIKE '%游亮%')
              AND cs.SessionDate BETWEEN CURDATE() AND DATE_ADD(CURDATE(), INTERVAL 56 DAY)
              AND DAYOFWEEK(cs.SessionDate)=3
            ORDER BY cs.SessionDate, cs.StartTime LIMIT 80;" || true
          echo "--- all upcoming ClassSessions (any weekday, 56d) ---"
          "${M[@]}" -e "SELECT CONCAT_WS('|',cs.id,cs.StudentClassID,s.Name,s.CampusID,sc.TeacherID,IFNULL(ut.Name,''),cs.SessionDate,DAYNAME(cs.SessionDate),SUBSTRING(cs.StartTime,1,5),cs.Status)
            FROM ClassSession cs
            JOIN StudentClass sc ON sc.ID=cs.StudentClassID
            JOIN Student s ON s.id=sc.StudentID
            LEFT JOIN User ut ON ut.id=sc.TeacherID
            WHERE (s.Name LIKE '%游%鈞%' OR s.Name LIKE '%游喨%' OR s.Name LIKE '%游亮%')
              AND cs.SessionDate BETWEEN CURDATE() AND DATE_ADD(CURDATE(), INTERVAL 56 DAY)
            ORDER BY cs.SessionDate, cs.StartTime LIMIT 120;" || true
          echo "--- recent schedules exceptions for student ---"
          "${M[@]}" -e "SELECT CONCAT_WS('|',sch.id,sch.student_course_id,sch.schedule_date,DAYNAME(sch.schedule_date),SUBSTRING(sch.start_time,1,5),IFNULL(SUBSTRING(sch.end_time,1,5),''),sch.status,IFNULL(sch.teacher_id,''),IFNULL(u.Name,''),IFNULL(sch.original_schedule_id,''),IFNULL(sch.branch_id,''))
            FROM schedules sch
            JOIN StudentClass sc ON sc.ID=sch.student_course_id
            JOIN Student s ON s.id=sc.StudentID
            LEFT JOIN User u ON u.id=sch.teacher_id
            WHERE (s.Name LIKE '%游%鈞%' OR s.Name LIKE '%游喨%' OR s.Name LIKE '%游亮%')
              AND sch.schedule_date BETWEEN DATE_SUB(CURDATE(), INTERVAL 14 DAY) AND DATE_ADD(CURDATE(), INTERVAL 56 DAY)
            ORDER BY sch.schedule_date, sch.start_time, sch.id LIMIT 100;" || true
          echo "--- COCO Tue busy: schedules.scheduled next 8 Tue ---"
          "${M[@]}" -e "SELECT CONCAT_WS('|',sch.id,sch.student_course_id,s.Name,s.CampusID,sch.schedule_date,SUBSTRING(sch.start_time,1,5),SUBSTRING(IFNULL(sch.end_time,''),1,5),sch.status,sch.teacher_id,IFNULL(u.Name,''),IFNULL(sch.original_schedule_id,''))
            FROM schedules sch
            JOIN User u ON u.id=sch.teacher_id
            LEFT JOIN StudentClass sc ON sc.ID=sch.student_course_id
            LEFT JOIN Student s ON s.id=sc.StudentID
            WHERE (u.Name LIKE '%Coco%' OR u.Name LIKE '%COCO%')
              AND sch.status='scheduled'
              AND sch.schedule_date BETWEEN CURDATE() AND DATE_ADD(CURDATE(), INTERVAL 56 DAY)
              AND DAYOFWEEK(sch.schedule_date)=3
            ORDER BY sch.schedule_date, sch.start_time LIMIT 80;" || true
          echo "--- COCO Tue busy: ClassSession via contract teacher next 8 Tue ---"
          "${M[@]}" -e "SELECT CONCAT_WS('|',cs.id,cs.StudentClassID,s.Name,s.CampusID,sc.TeacherID,IFNULL(ut.Name,''),cs.SessionDate,SUBSTRING(cs.StartTime,1,5),SUBSTRING(cs.EndTime,1,5),cs.Status)
            FROM ClassSession cs
            JOIN StudentClass sc ON sc.ID=cs.StudentClassID
            JOIN Student s ON s.id=sc.StudentID
            JOIN User ut ON ut.id=sc.TeacherID
            WHERE (ut.Name LIKE '%Coco%' OR ut.Name LIKE '%COCO%')
              AND cs.SessionDate BETWEEN CURDATE() AND DATE_ADD(CURDATE(), INTERVAL 56 DAY)
              AND DAYOFWEEK(cs.SessionDate)=3
              AND LOWER(cs.Status) NOT IN ('cancelled')
            ORDER BY cs.SessionDate, cs.StartTime LIMIT 120;" || true
          echo "=== DONE ==="
          ENDSSH

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: coco-transfer-diagnose
          path: out/
          retention-days: 14
