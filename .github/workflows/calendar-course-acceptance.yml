name: Calendar/Course Production Acceptance (read-only)

# Authenticated acceptance for the calendar/course-management parity contract.
# The director session is fetched from the existing short-lived Pi smoke-token
# path. No password is stored in GitHub or the repository; this job performs
# only GET requests against production.

on:
  workflow_dispatch:
    inputs:
      branch_id:
        description: 'Campus ID to inspect'
        required: false
        default: ''
      start_date:
        description: 'Inclusive date window start (YYYY-MM-DD)'
        required: false
        default: '2026-08-05'
      end_date:
        description: 'Inclusive date window end (YYYY-MM-DD)'
        required: false
        default: '2026-08-07'
  workflow_run:
    workflows: ['Deploy to Pi']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: calendar-course-production-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    name: Authenticated calendar/course parity (read-only)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Setup SSH for read-only smoke token lookup
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$PI_SSH_KEY" && test -n "$PI_SSH_USER" && test -n "$PI_SSH_HOST" && test -n "$PI_HOST_KEY"
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Fetch short-lived director session (read-only)
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          BRANCH_ID: ${{ github.event.inputs.branch_id || '' }}
        run: |
          set -euo pipefail
          node .github/scripts/normalize-smoke-session.mjs --self-test
          if [ -n "$BRANCH_ID" ]; then
            [[ "$BRANCH_ID" =~ ^[1-9][0-9]{0,6}$ ]] || { echo 'branch_id must be canonical positive decimal digits' >&2; exit 1; }
            (( 10#$BRANCH_ID <= 1000000 )) || { echo 'branch_id is outside the supported range' >&2; exit 1; }
          fi
          test -n "$PI_SSH_USER" && test -n "$PI_SSH_HOST" && test -s ~/.ssh/deploy_key
          session_output="$({
            ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              "$PI_SSH_USER@$PI_SSH_HOST" "bash -s -- '$BRANCH_ID'" <<'REMOTE'
          set -euo pipefail
          export BRANCH_ID="${1:-}"
          cd /home/admin/backend
          php -d display_errors=0 -d log_errors=0 <<'PHP'
          <?php
          try {
              require '/home/admin/backend/vendor/autoload.php';
              $app = require_once '/home/admin/backend/bootstrap/app.php';
              $kernel = $app->make(Illuminate\Contracts\Console\Kernel::class);
              $kernel->bootstrap();
              $branchRaw = getenv('BRANCH_ID') ?: '';
              if ($branchRaw !== '' && !preg_match('/^[1-9][0-9]{0,6}$/', $branchRaw)) {
                  throw new RuntimeException('branch is not canonical');
              }
              $branch = $branchRaw === '' ? 0 : (int) $branchRaw;
              $row = Illuminate\Support\Facades\DB::table('auth_tokens as t')
                  ->join('User as u', 'u.id', '=', 't.user_id')
                  ->join('UserCampus as uc', 'uc.UserID', '=', 'u.id')
                  ->where('u.type', 'D')
                  ->where(function ($q) { $q->where('uc.Approved', 1)->orWhereNull('uc.Approved'); })
                  ->where('t.expires_at', '>', now())
                  ->where('t.expires_at', '<=', now()->addMinutes(30))
                  ->when($branch > 0, fn ($q) => $q->where('uc.CampusID', $branch))
                  ->orderByDesc('t.expires_at')
                  ->select('t.token', 't.expires_at', 'u.id', 'u.MustChangePassword')
                  ->first();
              if (!$row || (bool) $row->MustChangePassword) {
                  throw new RuntimeException('no valid director smoke session');
              }
              $campuses = Illuminate\Support\Facades\DB::table('UserCampus')
                  ->where('UserID', $row->id)
                  ->where(function ($q) { $q->where('Approved', 1)->orWhereNull('Approved'); })
                  ->pluck('CampusID')->map(fn ($id) => (int) $id)->values()->all();
              if (!$campuses) throw new RuntimeException('director has no authorized campus');
              $payload = json_encode([
                  'access_token' => $row->token,
                  'token_type' => 'Bearer',
                  'expires_at' => Carbon\Carbon::parse((string) $row->expires_at, config('app.timezone', 'Asia/Taipei'))->toIso8601String(),
                  'user' => ['id' => (int) $row->id, 'role' => 'director', 'campuses' => $campuses, 'must_change_password' => false],
              ], JSON_THROW_ON_ERROR);
              echo 'ALLTRUE_SESSION_PAYLOAD_V1:' . base64_encode($payload) . PHP_EOL;
          } catch (Throwable $error) {
              fwrite(STDERR, "director session lookup failed\n");
              exit(1);
          }
          PHP
          REMOTE
          })"
          test -n "$session_output"
          printf '%s' "$session_output" > "$RUNNER_TEMP/alltrue-session.output"
          SESSION_OUTPUT_PATH="$RUNNER_TEMP/alltrue-session.output" \
          SESSION_NORMALIZED_PATH="$RUNNER_TEMP/alltrue-session.normalized.json" \
          REQUESTED_BRANCH_ID="$BRANCH_ID" \
          node .github/scripts/normalize-smoke-session.mjs
          session_token="$(SESSION_NORMALIZED_PATH="$RUNNER_TEMP/alltrue-session.normalized.json" node -e 'const fs=require("fs"); const s=JSON.parse(fs.readFileSync(process.env.SESSION_NORMALIZED_PATH,"utf8")); process.stdout.write(s.access_token)' )"
          test -n "$session_token"
          printf '::add-mask::%s\n' "$session_token"
          session_b64="$(base64 -w0 "$RUNNER_TEMP/alltrue-session.normalized.json")"
          test -n "$session_b64"
          echo "::add-mask::$session_b64"
          printf 'SMOKE_DIRECTOR_SESSION_B64=%s\n' "$session_b64" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run authenticated production acceptance
        working-directory: frontend
        env:
          CI: 'true'
          SMOKE_BASE_URL: https://daan.lifenet.com.tw
          SMOKE_START_DATE: ${{ github.event.inputs.start_date || '2026-08-05' }}
          SMOKE_END_DATE: ${{ github.event.inputs.end_date || '2026-08-07' }}
        run: |
          set -euo pipefail
          mkdir -p playwright-report
          test -n "${EFFECTIVE_BRANCH_ID:-}"
          acceptance_args=(e2e/calendar-course-consistency.spec.js e2e/calendar-print-production.spec.js e2e/tutoring-free-production.spec.js --project=chromium --reporter=json)
          if [ "$EFFECTIVE_BRANCH_ID" != "9" ]; then
            acceptance_args+=(--grep-invert 'contracted four-session detail explains two unarranged sessions')
          fi
          raw_report="$RUNNER_TEMP/acceptance-results.json"
          trap 'rm -f "$raw_report"' EXIT
          set +e
          npx playwright test "${acceptance_args[@]}" > "$raw_report"
          test_status=$?
          set -e
          node ../.github/scripts/acceptance-report-gate.mjs --self-test
          RESULTS_PATH="$raw_report" EFFECTIVE_BRANCH_ID="$EFFECTIVE_BRANCH_ID" SUMMARY_PATH="playwright-report/acceptance-summary.json" node ../.github/scripts/acceptance-report-gate.mjs
          gate_status=$?
          test "$test_status" -eq 0
          test "$gate_status" -eq 0

      - name: Upload acceptance report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: calendar-course-acceptance-report
          path: frontend/playwright-report/
          retention-days: 14
          if-no-files-found: error
