name: Calendar/Course Production Acceptance (bounded auth setup + read-only)

# Authenticated acceptance for the calendar/course-management parity contract.
# Auth setup uses the dedicated acceptance credentials and only mutates the
# newly-issued auth_tokens row; product acceptance remains read-only.

on:
  workflow_dispatch:
    inputs:
      branch_id:
        description: 'Campus ID to inspect'
        required: false
        default: ''
      start_date:
        description: 'Inclusive date window start (YYYY-MM-DD)'
        required: false
        default: '2026-08-05'
      end_date:
        description: 'Inclusive date window end (YYYY-MM-DD)'
        required: false
        default: '2026-08-07'
  workflow_run:
    workflows: ['Deploy to Pi']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: calendar-course-production-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    name: Authenticated calendar/course parity (bounded auth setup + read-only)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Setup SSH for bounded auth setup and read-only acceptance
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$PI_SSH_KEY" && test -n "$PI_SSH_USER" && test -n "$PI_SSH_HOST" && test -n "$PI_HOST_KEY"
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Prepare bounded acceptance login request (secret boundary)
        env:
          SMOKE_DIRECTOR_LOGIN: ${{ secrets.SMOKE_DIRECTOR_USER }}
          SMOKE_DIRECTOR_PASSWORD: ${{ secrets.SMOKE_DIRECTOR_PASS }}
        run: |
          set -euo pipefail
          umask 077
          # Keep each check before request-file creation and before any curl.
          # shellcheck source=/dev/null
          source scripts/acceptance/login-contract.sh
          acceptance_require_login_secrets
          login_request="$RUNNER_TEMP/alltrue-acceptance-login.json"
          trap 'rm -f "$login_request"' EXIT
          exec 9<<<"$SMOKE_DIRECTOR_LOGIN"
          exec 10<<<"$SMOKE_DIRECTOR_PASSWORD"
          unset SMOKE_DIRECTOR_LOGIN SMOKE_DIRECTOR_PASSWORD
          jq -n --rawfile account /dev/fd/9 --rawfile password /dev/fd/10 \
            '{account:($account|rtrimstr("\n")|sub("^\\s+";"")|sub("\\s+$";"")),password:($password|rtrimstr("\n")),role:"director"}' > "$login_request"
          exec 9<&- 10<&-
          chmod 600 "$login_request"
          trap - EXIT

      - name: Issue bounded acceptance session (controlled auth setup)
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          BRANCH_ID: ${{ github.event.inputs.branch_id || '' }}
        run: |
          set -euo pipefail
          node .github/scripts/normalize-smoke-session.mjs --self-test
          # Diagnostic markers go to stderr; captured stdout remains session data.
          # shellcheck source=/dev/null
          source scripts/acceptance/stage-contract.sh
          # shellcheck source=/dev/null
          source scripts/acceptance/login-contract.sh
          grep -Fq 'secrets.SMOKE_DIRECTOR_USER' .github/workflows/calendar-course-acceptance.yml
          grep -Fq 'secrets.SMOKE_DIRECTOR_PASS' .github/workflows/calendar-course-acceptance.yml
          grep -Fq 'acceptance_stage=login_secret_missing' scripts/acceptance/login-contract.sh
          grep -Fq "acceptance_login_http_status_allows_acceptance \"\$login_status\"" .github/workflows/calendar-course-acceptance.yml
          grep -Fq 'acceptance_login_401_diagnosis_result_valid' .github/workflows/calendar-course-acceptance.yml
          grep -Fq "jq -e '.data.user.must_change_password == false'" scripts/acceptance/login-contract.sh
          grep -Fq 'unset SMOKE_DIRECTOR_LOGIN SMOKE_DIRECTOR_PASSWORD' .github/workflows/calendar-course-acceptance.yml
          grep -Fq "auth/login" .github/workflows/calendar-course-acceptance.yml
          grep -Fq -- "--rawfile account /dev/fd/9" .github/workflows/calendar-course-acceptance.yml
          grep -Fq -- "--rawfile password /dev/fd/10" .github/workflows/calendar-course-acceptance.yml
          grep -Fq 'user_id:null' .github/workflows/calendar-course-acceptance.yml
          grep -Fq "printf '%s\\n' \"\$session_token\"" .github/workflows/calendar-course-acceptance.yml
          grep -Fq "auth_tokens" .github/workflows/calendar-course-acceptance.yml
          grep -Fq -- "->update(['expires_at'" .github/workflows/calendar-course-acceptance.yml
          grep -Fq -- "->delete()" .github/workflows/calendar-course-acceptance.yml
          guard_prefix='if: '
          guard_dollar='$'
          guard_open='{{ '
          guard_word='always'
          guard_close='() }}'
          cleanup_guard="${guard_prefix}${guard_dollar}${guard_open}${guard_word}${guard_close}"
          test "$(grep -F -c "$cleanup_guard" .github/workflows/calendar-course-acceptance.yml)" -eq 1
          grep -Fq "php /dev/fd/3" .github/workflows/calendar-course-acceptance.yml
          grep -Fq 'read -r SESSION_TOKEN' .github/workflows/calendar-course-acceptance.yml
          grep -Fq 'exec 4<<<' .github/workflows/calendar-course-acceptance.yml
          grep -Fq 'trap revoke_step_token EXIT' .github/workflows/calendar-course-acceptance.yml
          grep -Fq 'bound=1' .github/workflows/calendar-course-acceptance.yml
          grep -Fq 'trap - EXIT ERR' .github/workflows/calendar-course-acceptance.yml
          grep -Fq "trap 'rc=\$?; trap - ERR; exit \"\$rc\"' ERR" .github/workflows/calendar-course-acceptance.yml
          forbidden_export_prefix='export '
          forbidden_export_name='SESSION_TOKEN'
          forbidden_export="${forbidden_export_prefix}${forbidden_export_name}"
          forbidden_php_prefix='php artisan '
          forbidden_php_command='tinker'
          forbidden_php="${forbidden_php_prefix}${forbidden_php_command}"
          assert_no_forbidden_patterns() {
            local candidate="$1"
            ! grep -Fq "$forbidden_export" "$candidate" &&
              ! grep -Fq "$forbidden_php" "$candidate"
          }
          assert_no_forbidden_patterns .github/workflows/calendar-course-acceptance.yml
          forbidden_fixture="$(mktemp)"
          printf '%s\n' "$forbidden_export" > "$forbidden_fixture"
          if assert_no_forbidden_patterns "$forbidden_fixture"; then
            echo 'forbidden export self-check fixture unexpectedly passed' >&2
            exit 1
          fi
          printf '%s\n' "$forbidden_php" > "$forbidden_fixture"
          if assert_no_forbidden_patterns "$forbidden_fixture"; then
            echo 'forbidden PHP command self-check fixture unexpectedly passed' >&2
            exit 1
          fi
          rm -f "$forbidden_fixture"
          if [ -n "$BRANCH_ID" ]; then
            [[ "$BRANCH_ID" =~ ^[1-9][0-9]{0,6}$ ]] || { echo 'branch_id must be canonical positive decimal digits' >&2; exit 1; }
            (( 10#$BRANCH_ID <= 1000000 )) || { echo 'branch_id is outside the supported range' >&2; exit 1; }
          fi
          test -n "$PI_SSH_USER" && test -n "$PI_SSH_HOST" && test -s ~/.ssh/deploy_key
          umask 077
          cleanup_file="$RUNNER_TEMP/alltrue-acceptance-auth-cleanup.json"
          login_request="$RUNNER_TEMP/alltrue-acceptance-login.json"
          login_response="$RUNNER_TEMP/alltrue-acceptance-login.response"
          test -s "$login_request" && test "$(stat -c '%a' "$login_request")" = 600
          if ! acceptance_login_request_valid "$login_request"; then
            acceptance_stage login_request_invalid
            exit 1
          fi
          acceptance_stage login_request_valid
          acceptance_stage login_request_ready
          trap 'rm -f "$login_request" "$login_response"' EXIT
          if ! acceptance_capture login_http curl --silent --output "$login_response" --write-out '%{http_code}' \
            --request POST --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --header 'User-Agent: AllTrue-Calendar-Course-Acceptance/20260920' \
            --data-binary "@$login_request" \
            https://daan.lifenet.com.tw/api/v1/auth/login; then
            rm -f "$login_response"
            exit 1
          fi
          login_status="$STAGE_OUTPUT"
          acceptance_stage "login_http_status=${login_status}"
          if ! acceptance_login_http_status_allows_acceptance "$login_status"; then
            response_taxonomy="$(acceptance_login_response_taxonomy "$login_response")"
            acceptance_stage "login_http_rejected status=${login_status} ${response_taxonomy}"
            if [ "$login_status" = 401 ]; then
              acceptance_stage login_401_diagnosis_start
              diagnosis_account_b64="$(jq -er '.account' "$login_request" | base64 -w0)"
              diagnosis_raw="$RUNNER_TEMP/alltrue-401-diagnosis.raw"
              {
                printf '%s\n' "$diagnosis_account_b64"
                cat <<'REMOTE'
          set -euo pipefail
          cd /home/admin/backend
          php /dev/fd/3 0<&4 3<<'PHP'
          <?php
          define('LARAVEL_START', microtime(true));
          $base = getcwd(); require $base . '/vendor/autoload.php';
          $app = require_once $base . '/bootstrap/app.php';
          $kernel = $app->make(Illuminate\Contracts\Console\Kernel::class); $kernel->bootstrap();
          $account = trim((string) fgets(STDIN));
          if ($account === '' || strlen($account) > 128 || preg_match('/[\\r\\n]/', $account)) { throw new \RuntimeException('invalid diagnosis input'); }
          $matching = \Illuminate\Support\Facades\DB::table('User')->where(function ($q) use ($account) { $q->where('LoginName', $account)->orWhere('Name', $account); });
          $active = (clone $matching)->where(function ($q) { $q->whereNull('status')->orWhereNotIn('status', ['inactive', 'suspended']); });
          $approved = \Illuminate\Support\Facades\DB::table('User as u')->join('UserCampus as uc', 'uc.UserID', '=', 'u.id')->where(function ($q) use ($account) { $q->where('u.LoginName', $account)->orWhere('u.Name', $account); })->where(function ($q) { $q->whereNull('u.status')->orWhereNotIn('u.status', ['inactive', 'suspended']); })->where('u.type', 'D')->where('uc.CampusID', 16)->where(function ($q) { $q->where('uc.Approved', 1)->orWhereNull('uc.Approved'); })->count();
          $mustChangeRows = \Illuminate\Support\Facades\Schema::hasColumn('User', 'MustChangePassword') ? (clone $active)->where('type', 'D')->where('MustChangePassword', true)->count() : 0;
          echo json_encode(['matching_rows' => (int) $matching->count(), 'active_director_rows' => (int) (clone $active)->where('type', 'D')->count(), 'must_change_password_required_rows' => (int) $mustChangeRows, 'approved_branch_16_rows' => (int) $approved], JSON_THROW_ON_ERROR) . PHP_EOL;
          PHP
          REMOTE
              } | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$PI_SSH_USER@$PI_SSH_HOST" "bash -c 'read -r LOGIN_ACCOUNT_B64; [[ \"\$LOGIN_ACCOUNT_B64\" =~ ^[A-Za-z0-9+/]+={0,2}\$ ]]; exec 4< <(printf \"%s\" \"\$LOGIN_ACCOUNT_B64\" | base64 --decode --strict); exec bash -s'" > "$diagnosis_raw" 2>/dev/null
              printf '%s' "$(cat "$diagnosis_raw")" | jq -e . > "$RUNNER_TEMP/alltrue-401-diagnosis.json"
              rm -f "$diagnosis_raw"
              if ! acceptance_login_401_diagnosis_result_valid "$RUNNER_TEMP/alltrue-401-diagnosis.json"; then rm -f "$RUNNER_TEMP/alltrue-401-diagnosis.json" "$login_response"; exit 1; fi
              diagnosis_summary="$(jq -r 'to_entries | map(\"\(.key)=\(.value)\") | join(\" \")' "$RUNNER_TEMP/alltrue-401-diagnosis.json")"
              acceptance_stage "login_401_diagnosis ${diagnosis_summary}"
              rm -f "$RUNNER_TEMP/alltrue-401-diagnosis.json"
            fi
            rm -f "$login_response"
            exit 1
          fi
          if ! session_token="$(jq -er '.data.session.access_token | select(type == "string" and test("^[A-Za-z0-9]{64}$"))' "$login_response")"; then
            acceptance_stage login_schema_token_invalid
            exit 1
          fi
          session_user_id=''
          user_id_valid=1
          if ! session_user_id="$(jq -er '.data.user.id | select(type == "number" and floor == . and . > 0)' "$login_response")"; then
            user_id_valid=0
          fi
          echo "::add-mask::$session_token"
          if [ "$user_id_valid" -eq 1 ]; then
            printf '%s\n' "$session_token" | jq -R --argjson user_id "$session_user_id" \
              'select(length > 0) | {token:.,user_id:$user_id}' > "$cleanup_file"
          else
            printf '%s\n' "$session_token" | jq -R \
              'select(length > 0) | {token:.,user_id:null}' > "$cleanup_file"
          fi
          chmod 600 "$cleanup_file"
          if [ "$user_id_valid" -ne 1 ]; then
            acceptance_stage login_schema_user_id_invalid
            exit 1
          fi
          acceptance_stage login_schema_valid
          bound=0
          revoke_step_token() {
            local original_status="$?"
            local revoke_token revoke_user_id
            if [ "$bound" -eq 1 ] || [ ! -s "$cleanup_file" ]; then
              rm -f "$login_request" "$login_response"
              return "$original_status"
            fi
            set +e
            revoke_status=0
            revoke_token="$(jq -er '.token | select(type=="string" and test("^[A-Za-z0-9]{64}$"))' "$cleanup_file")" || revoke_status=1
            revoke_user_id="$(jq -er '.user_id | if . == null then empty else select(type=="number" and floor==. and .>0) end' "$cleanup_file" 2>/dev/null || true)"
            if [ "$revoke_status" -eq 0 ] && [ -n "$revoke_token" ]; then
              {
                printf '%s\n' "$revoke_token"
                cat <<'REMOTE'
          set -euo pipefail
          export EXPECTED_USER_ID="${1:-}"
          cd /home/admin/backend
          php /dev/fd/3 0<&4 3<<'PHP'
          <?php
          define('LARAVEL_START', microtime(true));
          $base = getcwd();
          require $base . '/vendor/autoload.php';
          $app = require_once $base . '/bootstrap/app.php';
          $kernel = $app->make(Illuminate\Contracts\Console\Kernel::class);
          $kernel->bootstrap();
          $token = trim((string) fgets(STDIN));
          $userId = (int) getenv('EXPECTED_USER_ID');
          $query = \Illuminate\Support\Facades\DB::table('auth_tokens')->where('token', $token);
          if ($userId > 0) { $query->where('user_id', $userId); }
          $rows = $query->select('id')->get();
          if ($rows->count() !== 1) { exit(1); }
          $deleteQuery = \Illuminate\Support\Facades\DB::table('auth_tokens')->where('id', $rows->first()->id)
            ->where('token', $token);
          if ($userId > 0) { $deleteQuery->where('user_id', $userId); }
          $deleted = $deleteQuery->delete();
          if ($deleted !== 1) { exit(1); }
          PHP
          REMOTE
              } | ssh -i ~/.ssh/deploy_key \
                -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
                -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
                "$PI_SSH_USER@$PI_SSH_HOST" "bash -c 'read -r SESSION_TOKEN; test -n \"\$SESSION_TOKEN\"; exec 4<<<\"\$SESSION_TOKEN\"; exec bash -s -- \"$revoke_user_id\"'" >/dev/null 2>/dev/null || revoke_status=$?
            fi
            if [ "$revoke_status" -ne 0 ]; then
              rm -f "$login_request" "$login_response"
              if [ "$original_status" -eq 0 ]; then return 1; else return "$original_status"; fi
            fi
            rm -f "$cleanup_file"
            rm -f "$login_request" "$login_response"
            return "$original_status"
          }
          trap revoke_step_token EXIT
          trap 'rc=$?; trap - ERR; exit "$rc"' ERR
          acceptance_login_response_authorized "$login_response" "$BRANCH_ID"
          acceptance_stage login_authorization_valid
          rm -f "$login_request" "$login_response"
          acceptance_stage session_ssh_start
          session_output="$({
            {
              printf '%s\n' "$session_token"
          cat <<'REMOTE'
          set -euo pipefail
          export BRANCH_ID="${1:-}" EXPECTED_USER_ID="${2:-}"
          cd /home/admin/backend
          printf '%s\n' 'ALLTRUE_SESSION_PAYLOAD_BEGIN_V1'
          php /dev/fd/3 0<&4 3<<'PHP'
          <?php
          define('LARAVEL_START', microtime(true));
          $base = getcwd();
          require $base . '/vendor/autoload.php';
          $app = require_once $base . '/bootstrap/app.php';
          $kernel = $app->make(Illuminate\Contracts\Console\Kernel::class);
          $kernel->bootstrap();
          $token = trim((string) fgets(STDIN));
          $expectedUserId = (int) getenv('EXPECTED_USER_ID');
          $branch = (int) getenv('BRANCH_ID');
          if ($token === '' || !preg_match('/^[A-Za-z0-9]{64}$/', $token) || $expectedUserId < 1) {
              throw new \RuntimeException('invalid acceptance session material');
          }
          $rows = \Illuminate\Support\Facades\DB::table('auth_tokens as t')
            ->join("User as u", "u.id", "=", "t.user_id")
            ->where('t.token', $token)
            ->where('t.user_id', $expectedUserId)
            ->select('t.id as auth_token_id', 't.user_id', 't.token', 'u.type', 'u.MustChangePassword')
            ->get();
          if ($rows->count() !== 1) { throw new \RuntimeException('acceptance token row is not unique'); }
          $row = $rows->first();
          if (!in_array($row->type, ['D', 'S'], true)) { throw new \RuntimeException('acceptance user role is not authorized'); }
          if ((bool) $row->MustChangePassword) { throw new \RuntimeException('acceptance user requires password change'); }
          $campuses = $row->type === 'S'
            ? \Illuminate\Support\Facades\DB::table('Campus')->pluck('id')
            : \Illuminate\Support\Facades\DB::table('UserCampus')->where('UserID', $row->user_id)
                ->where(function ($q) { $q->where('Approved', 1)->orWhereNull('Approved'); })->pluck('CampusID');
          $campuses = $campuses->map(fn ($id) => (int) $id)->values()->all();
          if (!$campuses || ($branch > 0 && !in_array($branch, $campuses, true))) {
              throw new \RuntimeException('acceptance campus is not authorized');
          }
          $expiresAt = now()->addMinutes(30);
          $updated = \Illuminate\Support\Facades\DB::table('auth_tokens')
            ->where('id', $row->auth_token_id)->where('user_id', $row->user_id)->where('token', $token)
            ->update(['expires_at' => $expiresAt]);
          if ($updated !== 1) { throw new \RuntimeException('bounded auth token expiry update failed'); }
          $fresh = \Illuminate\Support\Facades\DB::table('auth_tokens')->where('id', $row->auth_token_id)
            ->where('user_id', $row->user_id)->where('token', $token)->first();
          $freshExpiresAt = $fresh ? \Illuminate\Support\Carbon::parse($fresh->expires_at) : null;
          if (!$freshExpiresAt || now()->gte($freshExpiresAt) || now()->addMinutes(30)->lt($freshExpiresAt)) {
              throw new \RuntimeException('bounded auth token expiry verification failed');
          }
          $payload = json_encode([
            'access_token' => $token,
            'token_type' => 'Bearer',
            'expires_at' => $freshExpiresAt->utc()->toISOString(),
            "user" => [
              "id" => (int) $row->user_id,
              "role" => $row->type === "S" ? "super_admin" : "director",
              "campuses" => $campuses,
              "must_change_password" => false,
            ],
          ]);
          if ($payload === false) { throw new \RuntimeException("session payload encoding failed"); }
          echo base64_encode($payload);
          PHP
          printf '%s\n' 'ALLTRUE_SESSION_PAYLOAD_END_V1'
          REMOTE
            } | ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
              "$PI_SSH_USER@$PI_SSH_HOST" "bash -c 'read -r SESSION_TOKEN; test -n \"\$SESSION_TOKEN\"; exec 4<<<\"\$SESSION_TOKEN\"; exec bash -s -- \"$BRANCH_ID\" \"$session_user_id\"'"
          })"
          acceptance_stage session_ssh_ok
          test -n "$session_output"
          acceptance_stage session_payload_received
          bound=1
          trap - EXIT ERR
          printf '%s' "$session_output" > "$RUNNER_TEMP/alltrue-session.output"
          SESSION_OUTPUT_PATH="$RUNNER_TEMP/alltrue-session.output" \
          SESSION_NORMALIZED_PATH="$RUNNER_TEMP/alltrue-session.normalized.json" \
          REQUESTED_BRANCH_ID="$BRANCH_ID" \
          node .github/scripts/normalize-smoke-session.mjs
          acceptance_stage session_normalized
          session_b64="$(base64 -w0 "$RUNNER_TEMP/alltrue-session.normalized.json")"
          test -n "$session_b64"
          echo "::add-mask::$session_b64"
          printf 'SMOKE_DIRECTOR_SESSION_B64=%s\n' "$session_b64" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run authenticated production acceptance
        working-directory: frontend
        env:
          CI: 'true'
          SMOKE_BASE_URL: https://daan.lifenet.com.tw
          SMOKE_START_DATE: ${{ github.event.inputs.start_date || '2026-08-05' }}
          SMOKE_END_DATE: ${{ github.event.inputs.end_date || '2026-08-07' }}
        run: |
          set -euo pipefail
          mkdir -p playwright-report
          test -n "${EFFECTIVE_BRANCH_ID:-}"
          acceptance_args=(e2e/calendar-course-consistency.spec.js e2e/calendar-print-production.spec.js e2e/tutoring-free-production.spec.js --project=chromium --reporter=json)
          if [ "$EFFECTIVE_BRANCH_ID" != "9" ]; then
            acceptance_args+=(--grep-invert 'contracted four-session detail explains two unarranged sessions')
          fi
          npx playwright test "${acceptance_args[@]}" > playwright-report/acceptance-results.json
          node ../.github/scripts/acceptance-report-gate.mjs --self-test
          RESULTS_PATH="playwright-report/acceptance-results.json" EFFECTIVE_BRANCH_ID="$EFFECTIVE_BRANCH_ID" node ../.github/scripts/acceptance-report-gate.mjs

      - name: Upload acceptance report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: calendar-course-acceptance-report
          path: frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Cleanup bounded acceptance auth token
        if: ${{ always() }}
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
        run: |
          set -euo pipefail
          cleanup_file="$RUNNER_TEMP/alltrue-acceptance-auth-cleanup.json"
          if [ ! -s "$cleanup_file" ]; then exit 0; fi
          cleanup_token="$(jq -er '.token | select(type=="string" and test("^[A-Za-z0-9]{64}$"))' "$cleanup_file")"
          cleanup_user_id="$(jq -er '.user_id | if . == null then empty else select(type=="number" and floor==. and .>0) end' "$cleanup_file" 2>/dev/null || true)"
          echo "::add-mask::$cleanup_token"
          cleanup_output="$({
            {
              printf '%s\n' "$cleanup_token"
              cat <<'REMOTE'
          set -euo pipefail
          export EXPECTED_USER_ID="${1:-}"
          cd /home/admin/backend
          php /dev/fd/3 0<&4 3<<'PHP'
          <?php
          define('LARAVEL_START', microtime(true));
