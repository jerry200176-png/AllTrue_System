name: Architecture Fitness

# L5 automation for the Engineering Constitution: converts architecture rules into a
# fail-closed admission check. See docs/CONSTITUTION.md §Automation, scripts/arch-fitness-check.mjs.
on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  fitness:
    name: Architecture fitness functions
    runs-on: [self-hosted, Linux, X64, wsl-ci, alltrue-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run architecture fitness checks
        run: node scripts/arch-fitness-check.mjs
