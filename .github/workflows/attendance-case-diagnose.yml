name: Attendance Case Diagnose (read-only)

# Public repo (#3605): inputs take a student_id (never a name). The raw probe output stays in an
# unpublished raw/ dir (never tee'd to the log); the artifact, job log and summary carry ids, statuses,
# dates and counts only.

on:
  push:
    branches:
      - 'chore/task-attendance-root-fix-**'
  workflow_dispatch:
    inputs:
      campus_id:
        description: 'CampusID'
        required: true
        type: string
      date_from:
        description: 'Date from YYYY-MM-DD'
        required: true
        type: string
      date_to:
        description: 'Date to YYYY-MM-DD'
        required: true
        type: string
      student_id:
        description: 'Optional numeric student id; blank scans the campus window'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: attendance-case-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Validate inputs
        env:
          CAMPUS_ID: ${{ inputs.campus_id || '9' }}
          DATE_FROM: ${{ inputs.date_from || '2026-08-08' }}
          DATE_TO: ${{ inputs.date_to || '2026-08-26' }}
          STUDENT_ID: ${{ inputs.student_id || '' }}
        run: |
          set -euo pipefail
          [[ -z "$STUDENT_ID" || "$STUDENT_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'student_id must be a numeric id'; exit 1; }
          [[ "$CAMPUS_ID" =~ ^[0-9]+$ ]] || { echo 'campus_id must be numeric'; exit 1; }
          [[ "$DATE_FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo 'date_from must be YYYY-MM-DD'; exit 1; }
          [[ "$DATE_TO" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo 'date_to must be YYYY-MM-DD'; exit 1; }
          python3 - "$DATE_FROM" "$DATE_TO" <<'PY'
          import datetime, sys
          start, end = (datetime.date.fromisoformat(value) for value in sys.argv[1:])
          if end < start or (end - start).days > 31:
              raise SystemExit('date range must be ordered and no longer than 31 days')
          PY

      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Run bounded read-only production probe
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          CAMPUS_ID: ${{ inputs.campus_id || '9' }}
          DATE_FROM: ${{ inputs.date_from || '2026-08-08' }}
          DATE_TO: ${{ inputs.date_to || '2026-08-26' }}
          STUDENT_ID: ${{ inputs.student_id || '' }}
        run: |
          set -euo pipefail
          mkdir -p out raw
          SCRIPT_B64=$(base64 -w0 scripts/diagnose-attendance-case.php)
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            "$PI_SSH_USER@$PI_SSH_HOST" \
            SCRIPT_B64="$SCRIPT_B64" CAMPUS_ID="$CAMPUS_ID" DATE_FROM="$DATE_FROM" DATE_TO="$DATE_TO" STUDENT_ID="$STUDENT_ID" \
            'bash -s' <<'REMOTE' > raw/attendance-case.log
          set -euo pipefail
          cd /home/admin/backend
          echo "$SCRIPT_B64" | base64 -d > /tmp/diagnose-attendance-case.php
          CAMPUS_ID="$CAMPUS_ID" DATE_FROM="$DATE_FROM" DATE_TO="$DATE_TO" STUDENT_ID="$STUDENT_ID" \
            php artisan tinker --execute='require "/tmp/diagnose-attendance-case.php";'
          rm -f /tmp/diagnose-attendance-case.php
          REMOTE
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          text = Path('raw/attendance-case.log').read_text(encoding='utf-8', errors='replace')
          obj = next((json.loads(line) for line in text.splitlines() if line.lstrip().startswith('{')), None)
          if not obj or not obj.get('ok') or not obj.get('read_only'):
              raise SystemExit('probe did not return read-only JSON')
          # Defense in depth: drop any person/free-text key even if the probe script ever selects one.
          PII_KEY = re.compile(r'(name|note|memo|phone|email|line|description|reason|old_data|new_data)', re.I)
          def strip(value):
              if isinstance(value, dict):
                  return {k: strip(v) for k, v in value.items()
                          if k.endswith('_length') or not PII_KEY.search(k)}
              if isinstance(value, list):
                  return [strip(v) for v in value]
              return value
          obj = strip(obj)
          Path('out/attendance-case.json').write_text(json.dumps(obj, ensure_ascii=False, indent=2), encoding='utf-8')
          print('parsed bounded read-only attendance case: ' + ' '.join(
              f'{k}={len(v)}' for k, v in obj.items() if isinstance(v, list)))
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: attendance-case-diagnose
          path: out/attendance-case.json
          retention-days: 14

      - name: Job summary
        run: |
          {
            echo '### Attendance case diagnose (read-only)'
            echo '```json'
            cat out/attendance-case.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
