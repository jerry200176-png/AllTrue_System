name: Presubmit Gate

# Google-style presubmit — all independent fast checks run; aggregator fails closed.
# Policy: docs/governance/CI_GOVERNANCE.md

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Presubmit Checks
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout（含完整歷史，用於 diff）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "[CHECK 0] Agent preflight (CI mode)"
        id: c0
        continue-on-error: true
        run: AGENT_PREFLIGHT_MODE=ci bash scripts/agent-preflight.sh

      - name: "[CHECK 1] Branch naming convention"
        id: c1
        continue-on-error: true
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          node --input-type=module <<'EOF'
          import { validateBranchName } from './scripts/ci/branch-policy.mjs';
          const branch = process.env.BRANCH || '';
          console.log('Branch:', branch);
          const v = validateBranchName(branch);
          if (!v.ok) {
            console.error('❌ GOV-BRANCH-001:', v.message);
            console.error('actual:', branch);
            console.error('fix:', v.fix);
            process.exit(1);
          }
          console.log('✅', v.message);
          EOF

      - name: "[CHECK 2] Risk-based reviewability (base-aware)"
        id: c2
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node scripts/ci/check-reviewability.mjs

      - name: "[CHECK 3] alwaysApply rule size (≤ 500 lines)"
        id: c3
        continue-on-error: true
        run: |
          TOTAL=0
          echo "=== alwaysApply rules ==="
          for f in .cursor/rules/*.mdc; do
            if grep -q "alwaysApply: true" "$f" 2>/dev/null; then
              LINES=$(wc -l < "$f")
              TOTAL=$((TOTAL + LINES))
              echo "  🔴 $LINES lines — $(basename $f)"
            fi
          done
          echo "Total alwaysApply lines: $TOTAL / 500"
          if [ "$TOTAL" -gt 500 ]; then
            echo "❌ alwaysApply rules too large: $TOTAL lines (max 500)"
            exit 1
          elif [ "$TOTAL" -gt 400 ]; then
            echo "::warning title=alwaysApply nearing hard limit::alwaysApply is $TOTAL lines"
          else
            echo "✅ alwaysApply size OK: $TOTAL lines"
          fi

      - name: "[CHECK 4] CHANGELOG updated check"
        id: c4
        continue-on-error: true
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE="${GITHUB_BASE_SHA:-origin/main}"
          CHANGED_PROD=$(git diff --name-only "$BASE"...HEAD | grep -cE '^(backend/app/|backend/routes/|frontend/src/)' || true)
          CHANGED_LOG=$(git diff --name-only "$BASE"...HEAD | grep -cE '^docs/CHANGELOG\.md$' || true)
          echo "Production files changed: $CHANGED_PROD"
          echo "CHANGELOG.md updated: $CHANGED_LOG"
          if [ "$CHANGED_PROD" -gt 0 ] && [ "$CHANGED_LOG" -eq 0 ]; then
            echo "::warning title=Missing CHANGELOG::Production code changed but docs/CHANGELOG.md not updated."
          else
            echo "✅ CHANGELOG check OK"
          fi

      - name: "[CHECK 5] No deploy steps in CI workflows"
        id: c5
        continue-on-error: true
        run: |
          VIOLATIONS=$(grep -rn \
            -e 'ssh.*daan' -e 'rsync.*daan' -e 'scp.*daan' \
            -e 'ssh.*lifenet' -e 'npm run deploy' \
            -e 'appleboy/ssh-action' \
            -e 'StrictHostKeyChecking[[:space:]]+no' \
            -e 'UserKnownHostsFile=/dev/null' \
            --exclude=presubmit.yml --exclude=deploy.yml \
            .github/workflows/ 2>/dev/null | grep -v "^Binary" || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ Deploy steps detected in CI workflow!"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✅ No deploy steps in CI workflows"

      - name: "[CHECK 6] Golden scenarios report (automated)"
        id: c6
        continue-on-error: true
        run: |
          chmod +x .github/scripts/golden-ci-report.sh
          ./.github/scripts/golden-ci-report.sh

      - name: "[CHECK 7] Architecture fitness (invariants / ownership / dependency)"
        id: c7
        continue-on-error: true
        run: node scripts/arch-fitness-check.mjs

      - name: "[CHECK 8] CI runner topology contract"
        id: c8
        continue-on-error: true
        run: node scripts/runner-topology-check.mjs

      - name: "[CHECK 9] Production smoke auth contract"
        id: c9
        continue-on-error: true
        run: bash scripts/smoke-auth-lib.test.sh

      - name: "[CHECK 10] Local PHPUnit isolation contract"
        id: c10
        continue-on-error: true
        run: bash scripts/phpunit-isolated.sh --self-test

      - name: Aggregate governance results (fail-closed)
        if: always()
        env:
          O0: ${{ steps.c0.outcome }}
          O1: ${{ steps.c1.outcome }}
          O2: ${{ steps.c2.outcome }}
          O3: ${{ steps.c3.outcome }}
          O5: ${{ steps.c5.outcome }}
          O6: ${{ steps.c6.outcome }}
          O7: ${{ steps.c7.outcome }}
          O8: ${{ steps.c8.outcome }}
          O9: ${{ steps.c9.outcome }}
          O10: ${{ steps.c10.outcome }}
          # CHECK 4 is warning-only (matches prior behavior)
        run: |
          echo "### Presubmit Gate Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Outcome |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 0 Agent preflight | $O0 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 1 Branch naming | $O1 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 2 Reviewability | $O2 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 3 alwaysApply | $O3 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 4 CHANGELOG | warning-only |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 5 No deploy in CI | $O5 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 6 Golden | $O6 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 7 Arch fitness | $O7 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 8 Runner topology | $O8 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 9 Smoke auth | $O9 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 10 PHPUnit isolation | $O10 |" >> "$GITHUB_STEP_SUMMARY"
          FAIL=0
          for o in "$O0" "$O1" "$O2" "$O3" "$O5" "$O6" "$O7" "$O8" "$O9" "$O10"; do
            if [ "$o" = "failure" ]; then FAIL=1; fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "❌ One or more blocking governance checks failed (see table). Fix all before re-push."
            exit 1
          fi
          echo "✅ All blocking Presubmit checks passed"
