name: Presubmit Gate

# Google-style presubmit checks — 任何 PR 合進 main 前必須全過
# 規則來源：.cursor/rules/module-industry-standards.mdc
# 違反任何一項 = PR 被擋，必須修正才能 merge

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Presubmit Checks
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout（含完整歷史，用於 diff）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ─────────────────────────────────────────────
      # CHECK 1：Branch 命名規範
      # 合法格式：Conventional-Commits 前綴 + td-batchN-* + dependabot/*
      # feat|fix|hotfix|chore|exp|perf|test|refactor|docs|build|ci
      # ─────────────────────────────────────────────
      - name: "[CHECK 0] Agent preflight (CI mode)"
        run: AGENT_PREFLIGHT_MODE=ci bash scripts/agent-preflight.sh

      - name: "[CHECK 0A] Autonomy scope and review gate"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" || "${{ github.event_name }}" == "pull_request_review" ]]; then
            python3 scripts/governance/autonomy_gate.py \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --event "$GITHUB_EVENT_PATH" \
              --token "$GH_TOKEN"
          else
            python3 scripts/governance/autonomy_gate.py --check-instructions
          fi

      - name: "[CHECK 1] Branch naming convention"
        env:
          # workflow_dispatch has no head_ref (pull_request-only); fall back
          # to the ref actually being run so a manual run checks its own name.
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # Canonical policy: scripts/ci/branch-policy.mjs (shared with npm run ci:preflight)
          node --input-type=module <<'EOF'
          import { validateBranchName } from './scripts/ci/branch-policy.mjs';
          const branch = process.env.BRANCH || '';
          console.log('Branch:', branch);
          const v = validateBranchName(branch);
          if (!v.ok) {
            console.error('❌ GOV-BRANCH-001:', v.message);
            console.error('actual:', branch);
            console.error('fix:', v.fix);
            console.error('policy: scripts/ci/branch-policy.mjs + docs/governance/CI_GOVERNANCE.md');
            process.exit(1);
          }
          console.log('✅', v.message);
          if (v.alias) console.log('note: alias', v.alias, '→', v.canonicalPrefix);
          EOF

      # ─────────────────────────────────────────────
      # CHECK 2：PR 大小（推薦 ≤ 400 行，強制 ≤ 700 行；
      # 純刪除為主的死碼清償另有較高上限，見下方）
      # 排除：lock files, migration seed 純資料
      # ─────────────────────────────────────────────
      - name: "[CHECK 2] PR size check (≤ 700 lines hard limit)"
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          BRANCH="${GITHUB_HEAD_REF}"
          # docs 整併分支（chore/docs-*）：CHANGELOG 滾動歸檔與 archive 屬「機械搬移」，
          # 非邏輯複雜度，不計入 size（對齊大公司 size gate 排除 generated/vendored/歷史）
          # Vendored agent skills are reviewed as reference artifacts, not production logic.
          # Keep their files in the PR for content/security review, but do not let a long
          # Markdown skill document fail the logical-change size gate.
          EXTRA_EXCLUDE=(':!.cursor/skills/**')
          if echo "$BRANCH" | grep -qE '^chore/docs-'; then
            EXTRA_EXCLUDE+=(':!docs/CHANGELOG.md' ':!docs/archive/**')
          fi
          # 計算加減行數（分開算），排除 lock 檔和純資料檔
          read -r ADD DEL <<< "$(git diff --numstat origin/main...HEAD \
            -- ':!*.lock' ':!**/package-lock.json' ':!package-lock.json' \
               ':!**/composer.lock' ':!composer.lock' \
               ':!*.sql' ':!*.sql.gz' ':!*.min.js' ':!*.min.css' \
               ':!*.log' ':!**/*.log' \
               ':!*phpstan-baseline.neon' ':!**/*.generated.js' \
               "${EXTRA_EXCLUDE[@]}" \
            | awk 'NF==3 {add+=$1; del+=$2} END {print add+0, del+0}')"
          TOTAL=$((ADD + DEL))

          echo "PR size: $TOTAL lines changed (+$ADD/-$DEL, excluding lock/data files)"
          echo "PR_SIZE=$TOTAL" >> "$GITHUB_ENV"

          # Non-production-path exception: the 700-line ceiling exists to bound the
          # review burden of new *production logic*. A PR that touches zero
          # production paths (docs, governance/config scaffolding, CI, templates,
          # generated reference docs, ...) carries a different, much lower risk
          # profile per line — it can be verified by lint/build/CI, not line-by-line
          # logic review. Previously this only applied to chore/docs-* branches
          # (see git blame); widened here to any branch, since the risk signal is
          # "does the diff touch production code," not what the branch is named —
          # a chore/task-* governance-bootstrap PR that's 100% new config files
          # deserves the same treatment as a docs-consolidation PR. The production
          # path check itself is unchanged and still catches any PR that mixes in
          # real backend/frontend logic, so this cannot be used to smuggle in new
          # business logic under a large diff.
          HARD_LIMIT=700
          PROD=$(git diff --name-only origin/main...HEAD \
            | sed 's/^"//;s/"$//' \
            | grep -cE '^(backend/app/|backend/routes/|backend/database/|frontend/src/)' || true)
          if [ "$PROD" -eq 0 ]; then
            HARD_LIMIT=1300
            echo "No production paths touched: hard limit raised to $HARD_LIMIT"
          fi

          # 死碼／技術債刪除例外：這個 gate 本意是限制「新邏輯的審查負擔」，但用同一把尺
          # 量純刪除並不合理——刪掉 1,000 行已經證明打不到的死碼，風險跟新增 1,000 行邏輯完
          # 全不同（前者的正確性由 build/lint/e2e 就能驗證完，不需要人工逐行審查）。
          # 觸發條件很窄：insertions 必須很小（≤30，只容許順手改 import/註解），且 deletions
          # 遠大於一般上限——才會套用較高的刪除上限；insertions 本身永遠受 HARD_LIMIT 約束，
          # 無法用這條路徑夾帶真正的新邏輯。
          DELETION_INSERT_CAP=30
          DELETION_HARD_LIMIT=3000
          if [ "$ADD" -le "$DELETION_INSERT_CAP" ] && [ "$DEL" -gt "$HARD_LIMIT" ]; then
            if [ "$DEL" -gt "$DELETION_HARD_LIMIT" ]; then
              echo "❌ PR too large even as deletion-dominant cleanup: -$DEL lines (limit: $DELETION_HARD_LIMIT)"
              echo ""
              echo "Please split into smaller PRs. Each PR should cover one independent feature."
              echo "Reference: .cursor/rules/module-industry-standards.mdc"
              exit 1
            fi
            echo "✅ Deletion-dominant cleanup (+$ADD/-$DEL) — exempt from the $HARD_LIMIT insertion-oriented limit (≤ $DELETION_HARD_LIMIT deletions)."
            exit 0
          fi

          if [ "$TOTAL" -gt "$HARD_LIMIT" ]; then
            echo "❌ PR too large: $TOTAL lines (hard limit: $HARD_LIMIT)"
            echo ""
            echo "Please split into smaller PRs. Each PR should cover one independent feature."
            echo "Reference: .cursor/rules/module-industry-standards.mdc"
            exit 1
          elif [ "$TOTAL" -gt 400 ]; then
            echo "::warning title=Large PR::PR is $TOTAL lines (recommended ≤ 400). Consider splitting if possible."
          else
            echo "✅ PR size OK: $TOTAL lines"
          fi

      # ─────────────────────────────────────────────
      # CHECK 3：alwaysApply 規則總行數（≤ 500 行）
      # 防止 AI context 膨脹導致「失憶」
      # ─────────────────────────────────────────────
      - name: "[CHECK 3] alwaysApply rule size (≤ 500 lines)"
        run: |
          TOTAL=0
          echo "=== alwaysApply rules ==="
          for f in .cursor/rules/*.mdc; do
            if grep -q "alwaysApply: true" "$f" 2>/dev/null; then
              LINES=$(wc -l < "$f")
              TOTAL=$((TOTAL + LINES))
              echo "  🔴 $LINES lines — $(basename $f)"
            fi
          done
          echo ""
          echo "Total alwaysApply lines: $TOTAL / 500"

          if [ "$TOTAL" -gt 500 ]; then
            echo "❌ alwaysApply rules too large: $TOTAL lines (max 500)"
            echo ""
            echo "AI context bloat detected. Move non-critical rules to glob-based triggers."
            echo "Reference: .cursor/rules/p0-gate.mdc"
            exit 1
          elif [ "$TOTAL" -gt 400 ]; then
            echo "::warning title=alwaysApply nearing hard limit::alwaysApply is $TOTAL lines (recommended ≤ 400, hard limit 500). Move non-critical guidance to on-demand docs/rules."
          else
            echo "✅ alwaysApply size OK: $TOTAL lines"
          fi

      # ─────────────────────────────────────────────
      # CHECK 4：CHANGELOG 更新（有改 production code 時）
      # 若改了 backend/app/ backend/routes/ frontend/src/ 但沒更新 CHANGELOG → 警告
      # ─────────────────────────────────────────────
      - name: "[CHECK 4] CHANGELOG updated check"
        run: |
          CHANGED_PROD=$(git diff --name-only origin/main...HEAD \
            | grep -cE '^(backend/app/|backend/routes/|frontend/src/)' || true)
          CHANGED_LOG=$(git diff --name-only origin/main...HEAD \
            | grep -cE '^docs/CHANGELOG\.md$' || true)

          echo "Production files changed: $CHANGED_PROD"
          echo "CHANGELOG.md updated: $CHANGED_LOG"

          if [ "$CHANGED_PROD" -gt 0 ] && [ "$CHANGED_LOG" -eq 0 ]; then
            echo "::warning title=Missing CHANGELOG::Production code changed ($CHANGED_PROD files) but docs/CHANGELOG.md not updated."
            echo "::warning::Please add an entry per SOP Phase 6 [DOCS]: ## YYYY-MM-DD — feat/fix: title"
          else
            echo "✅ CHANGELOG check OK"
          fi

      # ─────────────────────────────────────────────
      # CHECK 4A：版本更新覆蓋閘門
      # CHANGELOG 每一筆近期產品變更都必須標記 STAFF_UPDATE 或 SILENT_SHIP。
      # ─────────────────────────────────────────────
      - name: "[CHECK 4A] Release-notes coverage"
        run: |
          node scripts/check-release-notes-coverage.mjs --self-test
          node scripts/check-release-notes-coverage.mjs --base origin/main --head HEAD

      # ─────────────────────────────────────────────
      # CHECK 5：禁止 CI workflow 內含 ssh/rsync/deploy 指令
      # 防止意外新增自動部署到生產環境的步驟
      # ─────────────────────────────────────────────
      - name: "[CHECK 5] No deploy steps in CI workflows"
        run: |
          VIOLATIONS=$(grep -rn \
            -e 'ssh.*daan' -e 'rsync.*daan' -e 'scp.*daan' \
            -e 'ssh.*lifenet' -e 'npm run deploy' \
            -e 'appleboy/ssh-action' \
            -e 'StrictHostKeyChecking[[:space:]]+no' \
            -e 'UserKnownHostsFile=/dev/null' \
            --exclude=presubmit.yml --exclude=deploy.yml \
            .github/workflows/ 2>/dev/null | grep -v "^Binary" || true)

          if [ -n "$VIOLATIONS" ]; then
            echo "❌ Deploy steps detected in CI workflow!"
            echo ""
            echo "$VIOLATIONS"
            echo ""
            echo "CI workflows must not deploy to production. Only deploy.yml may run production deploy after protected main is green."
            echo "Reference: .cursor/rules/auto-frontend-deploy.mdc"
            exit 1
          else
            echo "✅ No deploy steps in CI workflows"
          fi

      # ─────────────────────────────────────────────
      # CHECK 6：Golden scenarios — path → §（全自動，取代人工勾選）
      # ─────────────────────────────────────────────
      - name: "[CHECK 6] Golden scenarios report (automated)"
        run: |
          chmod +x .github/scripts/golden-ci-report.sh
          ./.github/scripts/golden-ci-report.sh

      # ─────────────────────────────────────────────
      # CHECK 7：Architecture fitness — fail-closed enforcement of architecture rules
      # 15 checks: occurrence-writer ratchet (DI-1), service-graph acyclic (DEP-3),
      # status-literal/unit/paid/instructor ratchets (DI-2/3/4/6), context-map + cross-context
      # write guards (DEP-1/FIT-14), read-path-write guard (DI-7/ADR-0007), ownership/invariant/
      # SOP doc checks (activate as governance docs land). Any violation = this required check fails.
      # ─────────────────────────────────────────────
      - name: "[CHECK 7] Architecture fitness (invariants / ownership / dependency)"
        run: node scripts/arch-fitness-check.mjs

      - name: "[CHECK 8] CI runner topology contract"
        run: node scripts/runner-topology-check.mjs

      - name: "[CHECK 9] Production smoke auth contract"
        run: bash scripts/smoke-auth-lib.test.sh

      - name: "[CHECK 10] Local PHPUnit isolation contract"
        run: bash scripts/phpunit-isolated.sh --self-test

      # ─────────────────────────────────────────────
      # Summary
      # ─────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          echo "### Presubmit Gate Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch naming | See step log |" >> "$GITHUB_STEP_SUMMARY"
          echo "| PR size | ${PR_SIZE:-?} lines |" >> "$GITHUB_STEP_SUMMARY"
          echo "| alwaysApply rules | See step log |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CHANGELOG | See step log |" >> "$GITHUB_STEP_SUMMARY"
          echo "| No deploy in CI | See step log |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Golden § report | CHECK 6 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runner topology | CHECK 8 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Smoke auth contract | CHECK 9 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Local PHPUnit isolation | CHECK 10 |" >> "$GITHUB_STEP_SUMMARY"
