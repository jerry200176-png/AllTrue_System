name: In-app #289 schema-complete preflight (read-only)

# governance-capability: non-production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions/production-ssh-trust
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Install SSH key
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Server-side schema mapping and canonical hashes
        env:
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts "${PI_SSH_USER}@${PI_SSH_HOST}" bash <<'REMOTE'
          set -euo pipefail
          db_value() { sed -n "s/^$1=//p" /home/admin/backend/.env | head -n 1; }
          db_user=$(db_value DB_USERNAME); db_pass=$(db_value DB_PASSWORD); prod_db=$(db_value DB_DATABASE)
          test -n "$db_user"; test -n "$db_pass"; test -n "$prod_db"
          backup_dir=/home/admin/backups/sixhour
          cutoff=1789280220
          selected=''
          while IFS=$'\t' read -r epoch name; do
            [ "${epoch%%.*}" -le "$cutoff" ] && selected="$name"
          done < <(find "$backup_dir" -maxdepth 1 -type f -name 'alltrue_6h_*.sql.gz' -printf '%T@\t%f\n' | sort -n)
          test -n "$selected"; snapshot="$backup_dir/$selected"; gzip -t "$snapshot"
          tmp="alltrue_inapp289_schema_$(date +%s)_$$"
          cleanup() { mysql -h 127.0.0.1 -u "$db_user" -p"$db_pass" -e "DROP DATABASE IF EXISTS \`$tmp\`;" >/dev/null; }
          trap cleanup EXIT
          mysql -h 127.0.0.1 -u "$db_user" -p"$db_pass" -e "CREATE DATABASE \`$tmp\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          zcat "$snapshot" | mysql -h 127.0.0.1 -u "$db_user" -p"$db_pass" "$tmp"
          echo "backup_snapshot_sha256=$(sha256sum "$snapshot" | awk '{print $1}')"
          echo 'table=StudentClass'
          echo 'schema_mapping_begin'
          mysql -h 127.0.0.1 -u "$db_user" -p"$db_pass" "$prod_db" --batch --skip-column-names -e "
            SELECT c.COLUMN_NAME,c.COLUMN_TYPE,c.IS_NULLABLE,IFNULL(c.COLUMN_DEFAULT,'<NULL>'),c.EXTRA,
              IF(b.COLUMN_NAME IS NULL,'no','yes'),IF(p.COLUMN_NAME IS NULL,'no','yes')
            FROM information_schema.COLUMNS c
            LEFT JOIN information_schema.COLUMNS b ON b.TABLE_SCHEMA='$tmp' AND b.TABLE_NAME='StudentClass' AND b.COLUMN_NAME=c.COLUMN_NAME
            LEFT JOIN information_schema.COLUMNS p ON p.TABLE_SCHEMA='$prod_db' AND p.TABLE_NAME='StudentClass' AND p.COLUMN_NAME=c.COLUMN_NAME
            WHERE c.TABLE_SCHEMA='$prod_db' AND c.TABLE_NAME='StudentClass'
            ORDER BY c.ORDINAL_POSITION;" | sed 's/^/column_metadata=/';
          backup_only=$(mysql -h 127.0.0.1 -u "$db_user" -p"$db_pass" "$tmp" --batch --skip-column-names -e "SELECT COLUMN_NAME,COLUMN_TYPE,IS_NULLABLE,IFNULL(COLUMN_DEFAULT,'<NULL>'),EXTRA FROM information_schema.COLUMNS b WHERE b.TABLE_SCHEMA='$tmp' AND b.TABLE_NAME='StudentClass' AND NOT EXISTS (SELECT 1 FROM information_schema.COLUMNS p WHERE p.TABLE_SCHEMA='$prod_db' AND p.TABLE_NAME='StudentClass' AND p.COLUMN_NAME=b.COLUMN_NAME) ORDER BY ORDINAL_POSITION;" | tr '\n' ';')
          echo "backup_only_columns_StudentClass=$backup_only"
          echo 'table=ClassSession'
          mysql -h 127.0.0.1 -u "$db_user" -p"$db_pass" "$prod_db" --batch --skip-column-names -e "
            SELECT c.COLUMN_NAME,c.COLUMN_TYPE,c.IS_NULLABLE,IFNULL(c.COLUMN_DEFAULT,'<NULL>'),c.EXTRA,
              IF(b.COLUMN_NAME IS NULL,'no','yes'),IF(p.COLUMN_NAME IS NULL,'no','yes')
            FROM information_schema.COLUMNS c
            LEFT JOIN information_schema.COLUMNS b ON b.TABLE_SCHEMA='$tmp' AND b.TABLE_NAME='ClassSession' AND b.COLUMN_NAME=c.COLUMN_NAME
            LEFT JOIN information_schema.COLUMNS p ON p.TABLE_SCHEMA='$prod_db' AND p.TABLE_NAME='ClassSession' AND p.COLUMN_NAME=c.COLUMN_NAME
            WHERE c.TABLE_SCHEMA='$prod_db' AND c.TABLE_NAME='ClassSession'
            ORDER BY c.ORDINAL_POSITION;" | sed 's/^/column_metadata=/';
          backup_only=$(mysql -h 127.0.0.1 -u "$db_user" -p"$db_pass" "$tmp" --batch --skip-column-names -e "SELECT COLUMN_NAME,COLUMN_TYPE,IS_NULLABLE,IFNULL(COLUMN_DEFAULT,'<NULL>'),EXTRA FROM information_schema.COLUMNS b WHERE b.TABLE_SCHEMA='$tmp' AND b.TABLE_NAME='ClassSession' AND NOT EXISTS (SELECT 1 FROM information_schema.COLUMNS p WHERE p.TABLE_SCHEMA='$prod_db' AND p.TABLE_NAME='ClassSession' AND p.COLUMN_NAME=b.COLUMN_NAME) ORDER BY ORDINAL_POSITION;" | tr '\n' ';')
          echo "backup_only_columns_ClassSession=$backup_only"
          for table in StudentClass ClassSession; do
            echo "source_row_count_$table=$(mysql -h 127.0.0.1 -u "$db_user" -p"$db_pass" "$tmp" --batch --skip-column-names -e "SELECT COUNT(*) FROM \`$table\` WHERE ID=2817 OR ( '$table'='ClassSession' AND id IN (25919,25920,25921,25922,27641,25923,25926,25924,25925,30444));")"
          done
          # Hashes are calculated entirely server-side over common columns; raw values never leave the host.
          for table in StudentClass ClassSession; do
            key='ID'; [ "$table" = ClassSession ] && key='id'
            ids="2817"; [ "$table" = ClassSession ] && ids="25919,25920,25921,25922,27641,25923,25926,25924,25925,30444"
            expr=$(mysql -h 127.0.0.1 -u "$db_user" -p"$db_pass" "$prod_db" --batch --skip-column-names -e "
              SELECT GROUP_CONCAT(CONCAT('COALESCE(CAST(\`',c.COLUMN_NAME,'\` AS CHAR),''<NULL>'')') ORDER BY c.ORDINAL_POSITION SEPARATOR ',CHAR(31),')
              FROM information_schema.COLUMNS c JOIN information_schema.COLUMNS b ON b.TABLE_SCHEMA='$tmp' AND b.TABLE_NAME='$table' AND b.COLUMN_NAME=c.COLUMN_NAME
              WHERE c.TABLE_SCHEMA='$prod_db' AND c.TABLE_NAME='$table';")
            query="SELECT \`$key\`,SHA2(CONCAT($expr),256) FROM \`$table\` WHERE \`$key\` IN ($ids) ORDER BY \`$key\`;"
            echo "canonical_hashes_$table=$(mysql -h 127.0.0.1 -u "$db_user" -p"$db_pass" "$tmp" --batch --skip-column-names -e "$query" | tr '\n' ';')"
          done
          echo "excluded_30444_count=$(mysql -h 127.0.0.1 -u "$db_user" -p"$db_pass" "$tmp" --batch --skip-column-names -e 'SELECT COUNT(*) FROM ClassSession WHERE id=30444 AND StudentClassID=2817;')"
          echo 'read_only=true'
          REMOTE
