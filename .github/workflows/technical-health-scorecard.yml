name: Technical Health Scorecard

on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  actions: read

jobs:
  scorecard:
    name: Calculate monthly scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build read-only scorecard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: |
          python3 scripts/radars/technical-health-scorecard.py --output-dir scorecard-output | tee /tmp/technical-health-scorecard.md
          cat /tmp/technical-health-scorecard.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scorecard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: technical-health-scorecard
          path: scorecard-output/
          if-no-files-found: error
