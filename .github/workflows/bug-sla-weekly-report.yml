name: Weekly Bug SLA Report

on:
  schedule:
    # Monday 09:00 Asia/Taipei; GitHub cron is UTC.
    - cron: "0 1 * * 1"
  workflow_dispatch:

concurrency:
  group: bug-sla-weekly-report
  cancel-in-progress: false

permissions:
  contents: read

# Monday one-pager (Founder "2A", 2026-10-08): the `issue` job turns the IDs-only snapshot into
# one plain-Chinese GitHub issue per ISO week, "in-app 週報 YYYY-Www" (Taipei time). Re-runs update it.
jobs:
  report:
    name: Export redacted bug SLA snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned SSH trust helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/production-ssh-trust
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Query production (read-only, PII-redacted)
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p out
          REPORT="$(ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_SSH_USER}@${PI_SSH_HOST}" bash <<'REMOTE'
          set -euo pipefail
          cd /home/admin/backend
          php artisan tinker --execute='
          $statuses = ["new", "triaged", "in_progress", "resolved", "closed"];
          $statusCounts = array_fill_keys($statuses, 0);
          foreach (\Illuminate\Support\Facades\DB::table("bug_reports")
              ->select("status", \Illuminate\Support\Facades\DB::raw("COUNT(*) as aggregate"))
              ->groupBy("status")
              ->get() as $row) {
              $status = (string) $row->status;
              if (array_key_exists($status, $statusCounts)) $statusCounts[$status] = (int) $row->aggregate;
          }
          $openStatuses = ["new", "triaged", "in_progress"];
          $openByStatus = array_fill_keys($openStatuses, 0);
          $oldestAgeHours = array_fill_keys($openStatuses, null);
          $missingTriagedAt = 0;
          $openBreaches = ["p0" => 0, "p1" => 0, "p2" => 0, "p3" => 0];
          $bugs = \Illuminate\Support\Facades\DB::table("bug_reports")
              ->whereIn("status", $openStatuses)
              ->get(["id", "status", "severity", "created_at"]);
          $bugIds = $bugs->pluck("id")->map(fn ($id) => (int) $id)->all();
          $triagedAt = [];
          if ($bugIds) {
              foreach (\Illuminate\Support\Facades\DB::table("bug_report_status_logs")
                  ->whereIn("bug_report_id", $bugIds)
                  ->where("to_status", "triaged")
                  ->orderBy("created_at")
                  ->orderBy("id")
                  ->get(["bug_report_id", "created_at"]) as $log) {
                  $id = (int) $log->bug_report_id;
                  if (!array_key_exists($id, $triagedAt)) $triagedAt[$id] = (string) $log->created_at;
              }
          }
          $now = \Carbon\Carbon::now();
          $openByAge = ["lt7" => [], "d7_30" => [], "gt30" => []];
          $slaOverdue = [];
          foreach ($bugs as $bug) {
              $status = (string) $bug->status;
              $openByStatus[$status]++;
              $createdDays = $now->diffInDays(\Carbon\Carbon::parse((string) $bug->created_at), true);
              $openByAge[$createdDays < 7 ? "lt7" : ($createdDays <= 30 ? "d7_30" : "gt30")][] = (int) $bug->id;
              $triagedTimestamp = $triagedAt[(int) $bug->id] ?? null;
              $ageAnchor = $status === "new" ? (string) $bug->created_at : $triagedTimestamp;
              $ageHours = $ageAnchor ? round($now->diffInSeconds(\Carbon\Carbon::parse($ageAnchor), true) / 3600, 2) : null;
              if ($ageHours !== null) {
                  $oldestAgeHours[$status] = $oldestAgeHours[$status] === null ? $ageHours : max($oldestAgeHours[$status], $ageHours);
              } elseif ($status !== "new") {
                  $missingTriagedAt++;
              }
              if ($status !== "new" || $ageHours === null) continue;
              $tier = match ((string) $bug->severity) {
                  "critical" => "p0",
                  "high" => "p1",
                  "medium" => "p2",
                  default => "p3",
              };
              $targetHours = ["critical" => 4, "high" => 24, "medium" => 168][(string) $bug->severity] ?? null;
              if ($targetHours !== null && $ageHours > $targetHours) { $openBreaches[$tier]++; $slaOverdue[] = (int) $bug->id; }
          }
          $since = $now->copy()->subDays(7);
          $logIds = fn (array $to, ?array $from = null) => \Illuminate\Support\Facades\DB::table("bug_report_status_logs")
              ->whereIn("to_status", $to)->when($from, fn ($q) => $q->whereIn("from_status", $from))
              ->where("created_at", ">=", $since)->pluck("bug_report_id")->map(fn ($id) => (int) $id)->unique()->sort()->values()->all();
          $weekly = [
              "new" => \Illuminate\Support\Facades\DB::table("bug_reports")->where("created_at", ">=", $since)->orderBy("id")->pluck("id")->map(fn ($id) => (int) $id)->all(),
              "resolved" => $logIds(["resolved"]),
              "closed" => $logIds(["closed"]),
              "reopened" => $logIds(["in_progress", "triaged"], ["resolved", "closed"]),
              "sla_overdue" => $slaOverdue,
              "open_by_age" => $openByAge,
          ];
          echo json_encode([
              "schema_version" => "bug-sla-weekly-v1",
              "generated_at" => \Carbon\Carbon::now()->toIso8601String(),
              "timezone" => config("app.timezone"),
              "read_only" => true,
              "pii_redacted" => true,
              "source" => "production:bug_reports+bug_report_status_logs",
              "status_counts" => $statusCounts,
              "weekly" => $weekly,
              "open_backlog" => [
                  "total" => array_sum($openByStatus),
                  "by_status" => $openByStatus,
                  "oldest_age_hours" => $oldestAgeHours,
                  "age_basis" => [
                      "new" => "created_at_until_triaged",
                      "triaged" => "first_status_log_to_triaged",
                      "in_progress" => "first_status_log_to_triaged",
                  ],
                  "missing_triaged_at" => $missingTriagedAt,
              ],
              "triage_sla" => [
                  "targets_hours" => ["p0" => 4, "p1" => 24, "p2" => 168],
                  "severity_to_tier" => ["critical" => "p0", "high" => "p1", "medium" => "p2", "low" => "p3"],
                  "open_breaches" => $openBreaches,
                  "open_breach_total" => array_sum($openBreaches),
              ],
          ], JSON_UNESCAPED_UNICODE), PHP_EOL;
          '
          REMOTE
          )"
          printf '%s\n' "$REPORT" | python3 -c '
          import json
          import sys

          candidates = []
          for line in sys.stdin:
              line = line.strip()
              if not line.startswith("{"):
                  continue
              try:
                  value = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if value.get("schema_version") == "bug-sla-weekly-v1":
                  candidates.append(value)
          if len(candidates) != 1:
              raise SystemExit("expected exactly one redacted SLA snapshot")
          snapshot = candidates[0]
          if snapshot.get("read_only") is not True or snapshot.get("pii_redacted") is not True:
              raise SystemExit("snapshot safety markers are invalid")
          with open("out/bug-sla-weekly.json", "w", encoding="utf-8") as handle:
              json.dump(snapshot, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          '

      - name: Validate artifact shape
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          snapshot = json.loads(Path("out/bug-sla-weekly.json").read_text(encoding="utf-8"))
          required = {
              "schema_version", "generated_at", "timezone", "read_only",
              "pii_redacted", "source", "status_counts", "open_backlog", "triage_sla",
          }
          required.add("weekly")
          if not required.issubset(snapshot):
              raise SystemExit("weekly SLA artifact is missing required fields")
          if snapshot["read_only"] is not True or snapshot["pii_redacted"] is not True:
              raise SystemExit("weekly SLA artifact safety markers are invalid")
          print("weekly_bug_sla_artifact=validated")
          PY

      - name: Upload weekly report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bug-sla-weekly
          path: out/bug-sla-weekly.json
          retention-days: 90

  issue:
    name: Open or update the weekly one-pager issue
    needs: report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/inapp-weekly-onepager.py
            scripts/inapp-issue-reconcile.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bug-sla-weekly
          path: out
      - name: Render and publish (IDs only, idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh issue list --state all --limit 1000 --json number,title,body,comments,state,labels,author > out/issues.json
          python3 scripts/inapp-weekly-onepager.py --snapshot out/bug-sla-weekly.json --issues out/issues.json --out-dir out --owner "$GITHUB_REPOSITORY_OWNER"
          title="$(cat out/title.txt)"
          [[ "$title" =~ ^in-app\ 週報\ [0-9]{4}-W[0-9]{2}$ ]] || { echo "::error::unexpected title"; exit 1; }
          # Only an issue this workflow's bot created counts as the weekly issue (anyone can open a lookalike).
          existing="$(gh issue list --state all --author app/github-actions --search "\"$title\" in:title" --json number,title -q "[.[] | select(.title == \"$title\")] | sort_by(.number) | .[0].number // empty")"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file out/body.md
            echo "updated #$existing"
          else
            gh issue create --title "$title" --body-file out/body.md
          fi
