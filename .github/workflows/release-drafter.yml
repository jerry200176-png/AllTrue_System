name: Release drafter

# Drafts release notes from merged PRs (categories from type: labels).
# Publishing happens in release-publish.yml, only after a production deploy succeeds.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ github.token }}
