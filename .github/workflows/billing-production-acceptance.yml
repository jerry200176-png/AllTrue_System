name: Billing Production Browser Acceptance (Founder-approved)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: Read-only billing and receipt browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run authenticated production acceptance
        working-directory: frontend
        env:
          CI: 'true'
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          SMOKE_DIRECTOR_USER: ${{ secrets.SMOKE_DIRECTOR_USER }}
          SMOKE_DIRECTOR_PASS: ${{ secrets.SMOKE_DIRECTOR_PASS }}
        run: |
          set -euo pipefail
          test -n "$SMOKE_BASE_URL"
          test -n "$SMOKE_DIRECTOR_USER"
          test -n "$SMOKE_DIRECTOR_PASS"
          npx playwright test e2e/billing-production-acceptance.spec.js \
            --config=playwright.production-acceptance.config.js \
            --reporter=line
