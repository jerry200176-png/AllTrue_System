name: Security Scan

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'   # 每週一 02:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect backend/security changes
    # #545(A)：原移至 GitHub-hosted runner。
    # #867：GitHub-hosted 受帳單/額度卡住時整條 required gate 失效，改回 self-hosted（runner 在線）。
    runs-on: [self-hosted, Linux, X64, wsl-ci, alltrue-ci]
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      security_config: ${{ steps.filter.outputs.security_config }}
    steps:
      - uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        with:
          filters: |
            backend:
              - 'backend/**'
            security_config:
              - '.github/workflows/**'

  # PHP 靜態分析（PHPStan level 5）
  # CodeQL 需要 GitHub Advanced Security（私有 repo 需付費），改用 PHPStan。
  # #545(A)：改用 hosted runner + 專案內 phpstan/phpstan dev 依賴 + baseline。
  # 既有 1952 個問題已 baseline（backend/phpstan-baseline.neon），故本 gate 只對
  # 「新增」問題報錯。移除舊的 `|| true`：現在會真正失敗於新問題（仍非 required，
  # 等連續綠燈穩定後再於 #545 升為 backend PR required gate）。
  phpstan:
    name: PHPStan Advisory (php)
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.security_config == 'true'
    # #867：移至 self-hosted。runner 已內建 PHP 8.2（與 PHPUnit job 同），故不需 setup-php / hosted cache。
    runs-on: [self-hosted, Linux, X64, wsl-ci, alltrue-ci]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Verify local PHP runtime
        run: php -v

      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run PHPStan (baseline-gated; fails only on NEW issues)
        working-directory: backend
        run: |
          ./vendor/bin/phpstan analyse \
            --memory-limit=1G \
            --no-progress \
            --error-format=github
