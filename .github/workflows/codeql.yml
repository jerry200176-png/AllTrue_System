name: Security Scan

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'   # 每週一 02:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect backend/security changes
    # #545(A)：移至 GitHub-hosted runner，移除「self-hosted wsl-ci 單點」
    # ——將來把本 gate 升為 required 時不會因本機 runner 離線而卡死 backend 合併。
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      security_config: ${{ steps.filter.outputs.security_config }}
    steps:
      - uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        with:
          filters: |
            backend:
              - 'backend/**'
            security_config:
              - '.github/workflows/**'

  # PHP 靜態分析（PHPStan level 5）
  # CodeQL 需要 GitHub Advanced Security（私有 repo 需付費），改用 PHPStan。
  # #545(A)：改用 hosted runner + 專案內 phpstan/phpstan dev 依賴 + baseline。
  # 既有 1952 個問題已 baseline（backend/phpstan-baseline.neon），故本 gate 只對
  # 「新增」問題報錯。移除舊的 `|| true`：現在會真正失敗於新問題（仍非 required，
  # 等連續綠燈穩定後再於 #545 升為 backend PR required gate）。
  phpstan:
    name: PHPStan Advisory (php)
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.security_config == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: backend/vendor
          key: phpstan-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: phpstan-composer-

      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run PHPStan (baseline-gated; fails only on NEW issues)
        working-directory: backend
        run: |
          ./vendor/bin/phpstan analyse \
            --memory-limit=1G \
            --no-progress \
            --error-format=github
