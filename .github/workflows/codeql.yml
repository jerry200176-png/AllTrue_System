name: Security Scan

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: '0 2 * * 1'   # 每週一 02:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect backend/security changes
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    # Current topology: GitHub-hosted. See docs/REF_CI_RUNNER_TOPOLOGY.md.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      security_config: ${{ steps.filter.outputs.security_config }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            backend:
              - 'backend/**'
            security_config:
              - '.github/workflows/**'

  # PHP 靜態分析（PHPStan level 5）
  # CodeQL 需要 GitHub Advanced Security（私有 repo 需付費），改用 PHPStan。
  # #545(A)：改用 hosted runner + 專案內 phpstan/phpstan dev 依賴 + baseline。
  # 既有 1952 個問題已 baseline（backend/phpstan-baseline.neon），故本 gate 只對
  # 「新增」問題報錯。移除舊的 `|| true`：現在會真正失敗於新問題（仍非 required，
  # 等連續綠燈穩定後再於 #545 升為 backend PR required gate）。
  phpstan:
    name: PHPStan Advisory (php)
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.security_config == 'true'
    # CodeQL builds with the toolchain available on the GitHub-hosted image.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo, pdo_mysql, bcmath, json, tokenizer, xml, ctype

      - name: Verify local PHP runtime
        run: php -v

      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run PHPStan (baseline-gated; fails only on NEW issues)
        working-directory: backend
        run: |
          ./vendor/bin/phpstan analyse \
            --memory-limit=1G \
            --no-progress \
            --error-format=github
