name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'   # 每週一 02:00 UTC

jobs:
  # PHP 靜態分析（PHPStan level 5）
  # CodeQL 需要 GitHub Advanced Security（私有 repo 需付費），改用 PHPStan
  phpstan:
    name: PHPStan (php)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP + PHPStan
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: phpstan

      - name: Run PHPStan
        working-directory: backend
        run: |
          phpstan analyse app \
            --level=5 \
            --memory-limit=512M \
            --no-progress \
            --error-format=github \
            2>&1 || true   # 警告不擋 CI，逐步提升 level
