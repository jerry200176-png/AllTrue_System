name: Security Scan

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'   # 每週一 02:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect backend/security changes
    runs-on: [self-hosted, Linux, X64, wsl-ci, alltrue-ci]
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      security_config: ${{ steps.filter.outputs.security_config }}
    steps:
      - uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
            security_config:
              - '.github/workflows/**'

  # PHP 靜態分析（PHPStan level 5）
  # CodeQL 需要 GitHub Advanced Security（私有 repo 需付費），改用 PHPStan
  phpstan:
    name: PHPStan Advisory (php)
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.security_config == 'true'
    runs-on: [self-hosted, Linux, X64, wsl-ci, alltrue-ci]

    steps:
      - uses: actions/checkout@v6

      - name: Verify local PHP runtime
        run: php -v

      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run PHPStan
        working-directory: backend
        run: |
          ./vendor/bin/phpstan analyse app \
            --level=5 \
            --memory-limit=512M \
            --no-progress \
            --error-format=github \
            2>&1 || true   # Advisory mode: emit findings, do not block merge
