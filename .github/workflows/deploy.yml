name: Deploy to Pi

on:
  workflow_run:
    workflows: ["CI — PHPUnit Tests"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      phase:
        description: "Choose exactly one phase; phases never auto-chain"
        required: true
        type: choice
        options:
          - phase1-create
          - phase2-cutover
          - phase3-lock
      confirm:
        description: "Type the phase-specific confirmation phrase from the runbook"
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  detect-deployable:
    name: Detect deployable changes
    # Current topology: GitHub-hosted. See docs/REF_CI_RUNNER_TOPOLOGY.md.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      deployable: ${{ steps.detect.outputs.deployable }}
    steps:
      - name: Check changed files
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import subprocess

          repo = os.environ["REPO"]
          head = os.environ["HEAD_SHA"]

          commit = json.loads(subprocess.check_output(
              ["gh", "api", f"/repos/{repo}/commits/{head}"],
              text=True,
          ))
          parents = commit.get("parents", [])
          if not parents:
              print("deployable=true")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("deployable=true\n")
              raise SystemExit(0)

          base = parents[0]["sha"]
          comparison = json.loads(subprocess.check_output(
              ["gh", "api", f"/repos/{repo}/compare/{base}...{head}"],
              text=True,
          ))
          files = [item.get("filename", "") for item in comparison.get("files", [])]
          deployable_prefixes = ("backend/", "frontend/", "scripts/")
          deployable_exact = {
              "composer.json",
              "composer.lock",
              ".github/workflows/deploy.yml",
          }
          deployable = any(
              path.startswith(deployable_prefixes) or path in deployable_exact
              for path in files
          )
          print("Changed files:")
          for path in files:
              print(f"- {path}")
          print(f"deployable={str(deployable).lower()}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"deployable={str(deployable).lower()}\n")
          PYEOF

  deploy:
    name: Deploy to Production
    needs: detect-deployable
    # Production credentials remain on the ephemeral GitHub-hosted runner.
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && needs.detect-deployable.outputs.deployable == 'true'

    steps:
      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -l -f ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.PI_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.PI_SSH_USER }}@${{ secrets.PI_SSH_HOST }}" << 'ENDSSH'
          set -uo pipefail
          cd /home/admin

          PREV_COMMIT=$(git rev-parse HEAD)
          MIGRATION_RAN=0
          MIGRATION_FAILED=0
          TARGET_SHA="${{ github.event.workflow_run.head_sha }}"

          echo "=== [0b/7] Backup storage/app/public（#1124 防呆） ==="
          # backend/storage/app/public 正在從 git-tracked 轉為 untracked
          # （#1124）。轉換那次 reset 會把 git 裡已刪除的 tracked 檔案從
          # working tree 清掉——這一步永久保留，每次 deploy 前都先備份，
          # 之後若 reset 把檔案清空，下面的還原步驟才有東西可還原。
          UPLOADS_BACKUP_DIR="/home/admin/backups/uploads"
          UPLOADS_TS=$(date '+%Y-%m-%d_%H%M%S')
          UPLOADS_BACKUP_FILE="${UPLOADS_BACKUP_DIR}/storage-app-public-predeploy-${UPLOADS_TS}.tar.gz"
          if [ -d /home/admin/backend/storage/app/public ] && [ -n "$(find /home/admin/backend/storage/app/public -type f -print -quit)" ]; then
            mkdir -p "$UPLOADS_BACKUP_DIR"
            tar -czf "$UPLOADS_BACKUP_FILE" -C /home/admin/backend storage/app/public
            echo "✅ Backup: $UPLOADS_BACKUP_FILE"
          else
            echo "storage/app/public 空或不存在，略過備份"
          fi

          echo "=== [1/7] git fetch + reset ==="
          # R62 自癒：Windows 專用 SSL backend 誤入 repo config 會讓 fetch fatal，
          # 過去因無 -e 被吞掉 → reset 落在 stale tracking ref → 靜默部署舊版
          git config --local --unset-all http.sslbackend 2>/dev/null || true
          if ! git fetch origin main; then
            echo "❌ git fetch 失敗 — 中止部署（不得以舊 code 假裝成功）"
            exit 1
          fi
          git reset --hard "$TARGET_SHA"
          if [ "$(git rev-parse HEAD)" != "$TARGET_SHA" ]; then
            echo "❌ 部署目標不符：HEAD=$(git rev-parse HEAD) ≠ CI head=$TARGET_SHA — 中止"
            exit 1
          fi
          echo "✅ production HEAD == CI 驗證版本（$TARGET_SHA）"

          # The DB credential rotation authenticated over TCP and updated the
          # TCP-matched principal, while Laravel was still allowed to connect
          # through the Unix socket. MySQL treats that as a separate
          # User@Host match (the incident presented as user@localhost).
          # Normalize both settings so the effective connection is the same
          # TCP tuple that rotation verified. Handle quoted/CRLF env values and
          # an existing DB_SOCKET entry; changing only DB_HOST is insufficient
          # when the socket setting is populated.
          env_value() {
            sed -n "s/^$1=//p" /home/admin/backend/.env | head -n 1 \
              | sed -e 's/\r$//' -e 's/^"//' -e 's/"$//' \
                    -e "s/^'//" -e "s/'$//"
          }
          APP_DB_HOST="$(env_value DB_HOST)"
          APP_DB_SOCKET="$(env_value DB_SOCKET)"
          if [ "$APP_DB_HOST" = "localhost" ] || [ -n "$APP_DB_SOCKET" ]; then
            if grep -q '^DB_HOST=' /home/admin/backend/.env; then
              sed -i -E 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' /home/admin/backend/.env
            else
              printf '\nDB_HOST=127.0.0.1\n' >> /home/admin/backend/.env
            fi
            if grep -q '^DB_SOCKET=' /home/admin/backend/.env; then
              sed -i -E 's/^DB_SOCKET=.*/DB_SOCKET=/' /home/admin/backend/.env
            fi
            echo "✅ normalized production DB connection to TCP 127.0.0.1 (socket disabled)"
          fi

          echo "=== [1b/7] Restore storage/app/public（若 reset 清空，#1124） ==="
          if [ -f "$UPLOADS_BACKUP_FILE" ]; then
            if [ ! -d /home/admin/backend/storage/app/public ] || [ -z "$(find /home/admin/backend/storage/app/public -type f -print -quit)" ]; then
              echo "storage/app/public 已被 reset 清空，從剛才的備份還原..."
              mkdir -p /home/admin/backend/storage/app/public
              tar -xzf "$UPLOADS_BACKUP_FILE" -C /home/admin/backend
              echo "✅ 已從 $UPLOADS_BACKUP_FILE 還原"
            else
              echo "storage/app/public 仍有檔案，無需還原"
            fi
          fi

          echo "=== [2/7] Composer dependencies ==="
          cd /home/admin/backend && composer install --no-interaction --prefer-dist --optimize-autoloader
          echo "✅ Composer 完成"

          echo "=== [2b/7] Storage symlink + 權限 ==="
          cd /home/admin/backend
          php artisan storage:link --force 2>/dev/null || true
          chmod -R 775 storage bootstrap/cache 2>/dev/null || true
          echo "✅ storage:link + chmod 完成"

          echo "=== [3/7] Migration 備份 + 執行 ==="
          # Laravel 8 用 "| No" (Ran? 欄)；Laravel 9+ 用 "Pending"。兩者都偵測。
          PENDING=$(cd /home/admin/backend && php artisan migrate:status 2>/dev/null | grep -cE "\| No|Pending" || true)
          if [ "$PENDING" -gt 0 ]; then
            echo "有 $PENDING 筆 pending migration，先備份再執行..."
            TS=$(date '+%Y-%m-%d_%H%M%S')
            BACKUP_FILE="/home/admin/backups/emergency/db_pre_migration_${TS}.sql.gz"
            mkdir -p /home/admin/backups/emergency
            DB_USER="$(grep '^DB_USERNAME=' /home/admin/backend/.env | cut -d= -f2-)"
            mysqldump -h 127.0.0.1 -u "$DB_USER" -p"$(grep '^DB_PASSWORD=' /home/admin/backend/.env | cut -d= -f2-)" \
              --single-transaction AllTrue | gzip > "$BACKUP_FILE"
            echo "✅ 備份完成：$BACKUP_FILE"
            # R67：migration 失敗絕不可被吞（無 -e 的 SSH script 會照走並印成功）
            # 失敗時繼續部署已驗證 code（migration 皆須 expand/contract 前向相容），
            # 但 run 於結尾標紅，禁止綠燈掩蓋 pending migration。
            if (cd /home/admin/backend && php artisan migrate --force); then
              MIGRATION_RAN=1
              echo "✅ Migration 完成"
            else
              MIGRATION_FAILED=1
              echo "❌ Migration 失敗（exit != 0）— code 部署繼續，run 將於結尾標紅"
            fi
          else
            echo "✅ 無 pending migration，略過"
          fi

          echo "=== [3b/7] 注入 Sentry DSN ==="
          # 後端 .env：寫入或更新 SENTRY_LARAVEL_DSN
          if ! grep -q "^SENTRY_LARAVEL_DSN=" /home/admin/backend/.env; then
            echo "SENTRY_LARAVEL_DSN=${{ secrets.SENTRY_DSN }}" >> /home/admin/backend/.env
            echo "✅ SENTRY_LARAVEL_DSN 已寫入 .env"
          else
            sed -i "s|^SENTRY_LARAVEL_DSN=.*|SENTRY_LARAVEL_DSN=${{ secrets.SENTRY_DSN }}|" /home/admin/backend/.env
            echo "✅ SENTRY_LARAVEL_DSN 已更新"
          fi

          echo "=== [3c/7] 一次性 APP_KEY containment（issue #1007） ==="
          if ! bash /home/admin/scripts/production-operations/rotate-app-key-2026-07-19.sh; then
            echo "❌ APP_KEY containment 失敗 — 中止部署，不得進入快取重建"
            exit 1
          fi

          # 前端：Vite 只從 .env 檔讀取，寫入暫時的 .env.production.local 再 build
          echo "VITE_SENTRY_DSN=${{ secrets.SENTRY_DSN }}" > /home/admin/frontend/.env.production.local
          echo "✅ frontend .env.production.local 已寫入"

          echo "=== [4/7] 前端變動偵測 ==="
          cd /home/admin
          FRONTEND_CHANGED=$(git diff --name-only "$PREV_COMMIT" HEAD -- frontend/ | wc -l)
          # 若 index.html 不存在（git rm --cached 後首次 deploy），強制 build
          ASSETS_MISSING=0
          [ ! -f /home/admin/backend/public/index.html ] && ASSETS_MISSING=1
          if [ "$FRONTEND_CHANGED" -gt 0 ] || [ "$ASSETS_MISSING" -eq 1 ]; then
            echo "前端有 $FRONTEND_CHANGED 個檔案變動 / assets 不存在（${ASSETS_MISSING}），執行 build + deploy..."
            cd /home/admin/frontend && npm install --prefer-offline && npm run deploy
            # build 完後刪除含 DSN 的暫時 env 檔
            rm -f /home/admin/frontend/.env.production.local
            # version.json 由 Vite build 產生（vite.config.js），只在前端有重 build 時更新
            # → backend-only deploy 不更新時間戳，使用者不會看到多餘的「請重新整理」通知
            echo "✅ version.json 已由 Vite build 更新"
          else
            echo "✅ 前端無變動且 assets 存在，跳過 build（version.json 不更新）"
            rm -f /home/admin/frontend/.env.production.local
          fi

          # Keep runtime identity separate from the frontend build artifact.
          # version.json may intentionally remain old during backend-only deploys;
          # deployment.json always records the backend commit actually activated.
          write_deployment_manifest() {
            python3 /home/admin/scripts/write-deployment-manifest.py \
              --target-sha "$1" \
              --version-file /home/admin/backend/public/version.json \
              --output /home/admin/backend/public/deployment.json
          }
          write_deployment_manifest "$TARGET_SHA"

          echo "=== [5/7] 重建 Laravel 快取 + 重載 PHP-FPM ==="
          # ⛔ 禁止用 optimize:clear / config:clear（事故 B 教訓：清除會造成短暫 auth 錯亂）
          # ✅ 只清 composer package discovery 快取（--no-dev 後必須，否則找不到已移除的 dev 套件）
          # ✅ optimize 直接重建快取（config:cache + route:cache + event:cache），不留空窗期
          cd /home/admin/backend
          rm -f bootstrap/cache/packages.php bootstrap/cache/services.php
          php artisan optimize
          # ✅ 清除 OPcache（mod_php 架構，用自製 artisan 指令，不需 sudo）
          cd /home/admin/backend && php artisan opcache:reset 2>/dev/null \
            && echo "✅ OPcache 清除完成" \
            || echo "⚠️ OPcache reset 失敗（非致命，TTL 到期後自動清除）"

          # php artisan opcache:reset runs in CLI and cannot refresh Laravel's
          # cached config inside PHP-FPM workers. This endpoint performs the
          # same reset in the web process, which is required after a DB
          # credential rotation when sudo cannot reload php-fpm interactively.
          DEPLOY_SECRET="$(grep '^DEPLOY_SECRET=' /home/admin/backend/.env | cut -d= -f2-)"
          if [ -z "$DEPLOY_SECRET" ]; then
            echo "❌ DEPLOY_SECRET missing; refusing to continue with stale FPM config"
            exit 1
          fi
          for attempt in $(seq 1 16); do
            OPCACHE_RESPONSE=$(curl -skf -X POST \
              https://daan.lifenet.com.tw/api/internal/opcache-reset \
              -H "X-Deploy-Secret: ${DEPLOY_SECRET}" \
              -H "Connection: close" \
              -H "Content-Type: application/json")
            if ! echo "$OPCACHE_RESPONSE" | grep -q '"ok":true' || \
               ! echo "$OPCACHE_RESPONSE" | grep -q '"db_connection_refreshed":true'; then
              echo "❌ FPM web-process refresh failed on attempt ${attempt}"
              exit 1
            fi
          done
          unset DEPLOY_SECRET OPCACHE_RESPONSE
          echo "✅ FPM OPcache/config and DB connection refresh completed across 16 worker requests"

          echo "=== [6/7] Health check + Smoke test ==="
          HEALTH=$(curl -sk https://daan.lifenet.com.tw/api/v1/health \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','?'))" \
            2>/dev/null || echo "error")
          if [ "$HEALTH" != "ok" ]; then
            echo "❌ Health check 失敗：$HEALTH"
          else
            echo "✅ Health check passed"

            # Smoke test（唯讀）：post-merge 完整驗收（bundle + auth API）
            export SMOKE_BASE_URL="https://daan.lifenet.com.tw"
            export SMOKE_ON_PI=1
            export SMOKE_TEACHER_LOGIN="${{ secrets.SMOKE_TEACHER_LOGIN }}"
            export SMOKE_TEACHER_PASSWORD="${{ secrets.SMOKE_TEACHER_PASSWORD }}"
            export SMOKE_BRANCH_ID="${{ secrets.SMOKE_BRANCH_ID }}"
            export SMOKE_EXPECTED_BACKEND_SHA="$TARGET_SHA"
            export SMOKE_REQUIRE_DEPLOYMENT_MANIFEST=1
            if [ "$FRONTEND_CHANGED" -gt 0 ]; then
              export SMOKE_STRICT_VERSION=1
            fi
            if bash /home/admin/scripts/post-merge-smoke.sh; then
              echo ""
              if [ "$MIGRATION_FAILED" -eq 1 ]; then
                echo "❌ Code 部署成功（Health + Smoke 通過），但 migration 失敗 — 不得綠燈掩蓋（R67）"
                echo "   處理：查 Sentry / 對應 GitHub issue；資料閘門滿足後 migration 於下次 deploy 自動重試"
                exit 1
              fi
              echo "🚀 部署完成 — Health + Smoke test 全通過"
              exit 0
            else
              echo "❌ Smoke test 失敗，啟動 Rollback"
            fi
          fi
          # ⬇ health check 或 smoke test 失敗才往下走
          true

          echo "=== [7/7] ❌ Health check 失敗，啟動自動 Rollback ==="
          echo "回滾到 $PREV_COMMIT ..."

          cd /home/admin
          git reset --hard "$PREV_COMMIT" || echo "⚠️ git reset 失敗"

          if [ "$FRONTEND_CHANGED" -gt 0 ]; then
            cd /home/admin/frontend && npm run deploy || echo "⚠️ 前端 rollback build 失敗"
          fi

          write_deployment_manifest "$PREV_COMMIT"

          cd /home/admin/backend
          php artisan optimize || echo "⚠️ optimize 失敗"

          if [ "$MIGRATION_RAN" -eq 1 ]; then
            echo "回滾 migration..."
            php artisan migrate:rollback --step=1 --force || echo "⚠️ migrate:rollback 失敗"
          fi

          echo "Rollback health check..."
          HEALTH2=$(curl -sk https://daan.lifenet.com.tw/api/v1/health \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','?'))" \
            2>/dev/null || echo "error")
          if [ "$HEALTH2" = "ok" ]; then
            echo "✅ Rollback 成功，系統已恢復到 $PREV_COMMIT"
          else
            echo "❌ Rollback 後 health check 仍失敗：$HEALTH2 — 需要人工介入"
          fi

          exit 1
          ENDSSH
  staged_principal_rotation:
    name: Staged DB principal rotation (one phase)
    if: github.event_name == 'workflow_dispatch' && (inputs.phase == 'phase1-create' || inputs.phase == 'phase2-cutover' || inputs.phase == 'phase3-lock')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require phase-specific typed confirmation
        env:
          PHASE: ${{ inputs.phase }}
          CONFIRM_INPUT: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          case "$PHASE" in
            phase1-create) EXPECTED="CREATE_NEW_PRINCIPAL" ;;
            phase2-cutover) EXPECTED="CUTOVER_NEW_PRINCIPAL" ;;
            phase3-lock) EXPECTED="LOCK_OLD_PRINCIPAL" ;;
            *) echo "::error::Unknown phase. Nothing touched."; exit 1 ;;
          esac
          if [[ "$CONFIRM_INPUT" != "$EXPECTED" ]]; then
            echo "::error::Confirmation phrase does not match the selected phase. Nothing touched."
            exit 1
          fi

      - name: Setup pinned SSH identity
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$PI_SSH_KEY"
          test -n "$PI_HOST_KEY"
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          printf '%s\n' "$PI_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Create principal by replaying the old principal's exact SHOW GRANTS output
        if: inputs.phase == 'phase1-create'
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_USER}@${PI_HOST}" bash <<'REMOTE'
          set -euo pipefail
          umask 077
          cd /home/admin/backend

          STATE_DIR=/home/admin/backups/pre-rotation/1387-staged
          STATE_FILE="$STATE_DIR/rotation-state.env"
          mkdir -p "$STATE_DIR"
          chmod 700 "$STATE_DIR"

          read_env() {
            local key="$1"
            grep -m1 "^${key}=" .env | cut -d= -f2-
          }
          validate_account_part() {
            [[ "$1" =~ ^[A-Za-z0-9_.%:-]+$ ]]
          }

          if [[ -f "$STATE_FILE" ]]; then
            # shellcheck disable=SC1090
            source "$STATE_FILE"
            [[ "${STATUS:-}" == "principal_created" ]] || {
              echo "::error::A staged rotation is already past Phase 1; refusing to create another principal."
              exit 1
            }
            mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" \
              -u "$STAGED_DB_USERNAME" -p"$STAGED_DB_PASSWORD" "$DB_DATABASE" \
              --batch --skip-column-names -e "SELECT 1" >/dev/null 2>&1
            [[ "$(read_env DB_USERNAME)" == "$OLD_DB_USERNAME" ]] || {
              echo "::error::State says Phase 1, but the application username has changed. Refusing."
              exit 1
            }
            echo "Phase 1 already complete: the staged principal still authenticates; old app configuration is untouched."
            exit 0
          fi

          OLD_DB_USERNAME="$(read_env DB_USERNAME)"
          OLD_DB_PASSWORD="$(read_env DB_PASSWORD)"
          DB_HOST="$(read_env DB_HOST)"
          DB_PORT="$(read_env DB_PORT)"
          DB_DATABASE="$(read_env DB_DATABASE)"
          [[ -n "$OLD_DB_USERNAME" && -n "$OLD_DB_PASSWORD" && -n "$DB_DATABASE" ]]
          DB_HOST="${DB_HOST:-127.0.0.1}"
          DB_PORT="${DB_PORT:-3306}"
          validate_account_part "$OLD_DB_USERNAME" || {
            echo "::error::Unexpected DB username shape; no account was changed."
            exit 1
          }

          OLD_MYSQL=(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" \
            -u "$OLD_DB_USERNAME" -p"$OLD_DB_PASSWORD" --batch --skip-column-names)
          CURRENT_ACCOUNT="$("${OLD_MYSQL[@]}" -e "SELECT CURRENT_USER()")"
          [[ "$CURRENT_ACCOUNT" == "$OLD_DB_USERNAME@"* ]] || {
            echo "::error::DB_USERNAME does not match CURRENT_USER(); no account was changed."
            exit 1
          }
          OLD_ACCOUNT_HOST="${CURRENT_ACCOUNT#"$OLD_DB_USERNAME"@}"
          validate_account_part "$OLD_ACCOUNT_HOST" || {
            echo "::error::Unexpected authenticated host pattern; no account was changed."
            exit 1
          }

          STAGED_DB_USERNAME="atr_$(date -u '+%y%m%d%H%M%S')_$(openssl rand -hex 3)"
          STAGED_DB_PASSWORD="$(openssl rand -hex 32)"
          export OLD_DB_USERNAME OLD_ACCOUNT_HOST STAGED_DB_USERNAME STAGED_DB_PASSWORD

          TRANSFORMER="$(mktemp /tmp/1387-grant-transform.XXXXXX.py)"
          cat > "$TRANSFORMER" <<'PY'
          import os
          import re
          import sys

          old_user = os.environ["OLD_DB_USERNAME"]
          old_host = os.environ["OLD_ACCOUNT_HOST"]
          new_user = os.environ["STAGED_DB_USERNAME"]
          new_pass = os.environ["STAGED_DB_PASSWORD"]

          ident = r"(?:'(?:''|\\\\.|[^'])*'|`(?:``|[^`])*`)"
          target = re.compile(rf"(?i)(\b(?:TO|FROM)\s+)({ident})@({ident})")

          def decode(token):
              if token.startswith("`"):
                  return token[1:-1].replace("``", "`")
              value = token[1:-1].replace("''", "'")
              return re.sub(r"\\\\(.)", r"\1", value)

          def quote(value):
              return "'" + value.replace("\\", "\\\\").replace("'", "\\'") + "'"

          print(f"CREATE USER {quote(new_user)}@{quote(old_host)} IDENTIFIED BY {quote(new_pass)};")
          count = 0
          for raw in sys.stdin:
              grant = raw.strip()
              if not grant:
                  continue
              if " IDENTIFIED " in grant.upper():
                  raise SystemExit("SHOW GRANTS contains authentication material; refusing unsafe replay")
              matches = list(target.finditer(grant))
              if len(matches) != 1:
                  raise SystemExit("unexpected SHOW GRANTS target shape")
              match = matches[0]
              if decode(match.group(2)) != old_user or decode(match.group(3)) != old_host:
                  raise SystemExit("SHOW GRANTS target does not match CURRENT_USER()")
              replacement = match.group(1) + quote(new_user) + "@" + quote(old_host)
              statement = grant[:match.start()] + replacement + grant[match.end():]
              print(statement.rstrip(";") + ";")
              count += 1
          if count == 0:
              raise SystemExit("SHOW GRANTS returned no statements")
          PY

          created_attempted=0
          completed=0
          cleanup() {
            rc=$?
            rm -f "$TRANSFORMER"
            if [[ "$completed" != 1 && "$created_attempted" == 1 ]]; then
              "${OLD_MYSQL[@]}" -e \
                "DROP USER IF EXISTS '${STAGED_DB_USERNAME}'@'${OLD_ACCOUNT_HOST}'" \
                >/dev/null 2>&1 || echo "::error::Automatic DROP USER rollback failed; Founder follow-up required."
              rm -f "$STATE_FILE"
            fi
            unset OLD_DB_PASSWORD STAGED_DB_PASSWORD
            exit "$rc"
          }
          trap cleanup EXIT

          created_attempted=1
          "${OLD_MYSQL[@]}" -e "SHOW GRANTS FOR CURRENT_USER()" \
            | python3 "$TRANSFORMER" \
            | "${OLD_MYSQL[@]}" >/dev/null

          mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" \
            -u "$STAGED_DB_USERNAME" -p"$STAGED_DB_PASSWORD" "$DB_DATABASE" \
            --batch --skip-column-names -e "SELECT 1" >/dev/null 2>&1

          {
            printf 'STATUS=%q\n' principal_created
            printf 'OLD_DB_USERNAME=%q\n' "$OLD_DB_USERNAME"
            printf 'OLD_ACCOUNT_HOST=%q\n' "$OLD_ACCOUNT_HOST"
            printf 'STAGED_DB_USERNAME=%q\n' "$STAGED_DB_USERNAME"
            printf 'STAGED_DB_PASSWORD=%q\n' "$STAGED_DB_PASSWORD"
            printf 'DB_HOST=%q\n' "$DB_HOST"
            printf 'DB_PORT=%q\n' "$DB_PORT"
            printf 'DB_DATABASE=%q\n' "$DB_DATABASE"
            printf 'OLD_ENV_BACKUP=%q\n' ''
            printf 'ATTEMPT_ENV_BACKUP=%q\n' ''
            printf 'PREVIOUS_STATUS=%q\n' ''
            printf 'LOCK_METHOD=%q\n' ''
            printf 'QUARANTINE_PASSWORD=%q\n' ''
          } > "$STATE_FILE"
          chmod 600 "$STATE_FILE"
          completed=1
          echo "Phase 1 complete: exact SHOW GRANTS statements replayed and the new principal passed a fresh SELECT 1 connection."
          echo "The old principal and application .env were not changed."
          REMOTE

      - name: Backup, cut over .env, rebuild config, reload PHP-FPM, and verify new DB identity
        if: inputs.phase == 'phase2-cutover'
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_USER}@${PI_HOST}" bash <<'REMOTE'
          set -euo pipefail
          umask 077
          cd /home/admin/backend
          STATE_FILE=/home/admin/backups/pre-rotation/1387-staged/rotation-state.env
          [[ -f "$STATE_FILE" ]] || { echo "::error::Phase 1 state is missing."; exit 1; }
          # shellcheck disable=SC1090
          source "$STATE_FILE"
          [[ "$STATUS" == "principal_created" || "$STATUS" == "cutover_verified" ]] || {
            echo "::error::Phase 2 cannot run from the recorded state: $STATUS"
            exit 1
          }
          for consumer in /home/admin/scripts/{diagnose-classsession-duplicates.sh,diagnose-student-session.sh,post-merge-smoke.sh}; do
            grep -q 'DB_USERNAME' "$consumer" || { echo "::error::Production checkout predates the username-consumer fixes."; exit 1; }
          done

          state_set() { sed -i "s|^${1}=.*|${1}=${2}|" "$STATE_FILE"; }

          mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" \
            -u "$STAGED_DB_USERNAME" -p"$STAGED_DB_PASSWORD" "$DB_DATABASE" \
            --batch --skip-column-names -e "SELECT 1" >/dev/null 2>&1

          STAMP="$(date '+%Y-%m-%d_%H%M%S')"
          BACKUP_FILE="/home/admin/backups/pre-rotation/alltrue_pre_staged_cutover_${STAMP}.sql.gz"
          CURRENT_USER="$(grep -m1 '^DB_USERNAME=' .env | cut -d= -f2-)"
          CURRENT_PASS="$(grep -m1 '^DB_PASSWORD=' .env | cut -d= -f2-)"
          mysqldump --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$CURRENT_USER" -p"$CURRENT_PASS" \
            --single-transaction --routines --triggers "$DB_DATABASE" | gzip > "$BACKUP_FILE"
          test -s "$BACKUP_FILE"
          echo "pre-cutover backup: $(basename "$BACKUP_FILE") ($(du -h "$BACKUP_FILE" | cut -f1))"

          PREVIOUS_STATUS="$STATUS"
          ATTEMPT_ENV_BACKUP="/home/admin/backups/pre-rotation/env_pre_staged_cutover_${STAMP}.bak"
          cp .env "$ATTEMPT_ENV_BACKUP"
          chmod 600 "$ATTEMPT_ENV_BACKUP"
          if [[ -z "$OLD_ENV_BACKUP" ]]; then
            OLD_ENV_BACKUP="$ATTEMPT_ENV_BACKUP"
          fi
          state_set PREVIOUS_STATUS "$STATUS"
          state_set ATTEMPT_ENV_BACKUP "$ATTEMPT_ENV_BACKUP"
          state_set OLD_ENV_BACKUP "$OLD_ENV_BACKUP"
          state_set STATUS cutover_pending

          ENV_TMP="$(mktemp .env.1387-staged.XXXXXX)"
          awk -v user="$STAGED_DB_USERNAME" -v pass="$STAGED_DB_PASSWORD" '
            BEGIN { users=0; passwords=0 }
            /^DB_USERNAME=/ { print "DB_USERNAME=" user; users++; next }
            /^DB_PASSWORD=/ { print "DB_PASSWORD=" pass; passwords++; next }
            { print }
            END { if (users != 1 || passwords != 1) exit 42 }
          ' .env > "$ENV_TMP"
          chmod --reference=.env "$ENV_TMP"
          mv "$ENV_TMP" .env

          php artisan config:cache

          export EXPECTED_DB_USERNAME="$STAGED_DB_USERNAME"
          php artisan tinker --execute='
          \Illuminate\Support\Facades\DB::purge("mysql");
          $row = \Illuminate\Support\Facades\DB::selectOne("SELECT CURRENT_USER() AS principal, 1 AS probe");
          $expected = (string) getenv("EXPECTED_DB_USERNAME");
          if (!$row || (int) $row->probe !== 1 || !str_starts_with((string) $row->principal, $expected . "@")) {
              throw new RuntimeException("staged principal verification failed");
          }
          echo "db-read-new-principal=OK", PHP_EOL;
          '
          php artisan schedule:list >/dev/null
          echo "scheduler-bootstrap=OK"

          if grep -q '^DB_PERSISTENT=true' .env 2>/dev/null; then
            echo "DB_PERSISTENT=true detected -- FPM reload is required."
          else
            echo "DB_PERSISTENT not set to true -- reloading as defense-in-depth."
          fi
          if sudo -n service php8.2-fpm reload 2>/tmp/fpm_reload_err; then
            echo "php8.2-fpm reload: OK"
          else
            cat /tmp/fpm_reload_err 2>/dev/null || true
            rm -f /tmp/fpm_reload_err
            echo "::error::PHP-FPM reload failed; automatic .env rollback will run."
            exit 1
          fi
          rm -f /tmp/fpm_reload_err
          state_set STATUS cutover_local_verified
          unset CURRENT_PASS STAGED_DB_PASSWORD
          REMOTE

      - name: Verify application health and version after the new-principal read passed
        if: inputs.phase == 'phase2-cutover'
        env:
          PRODUCTION_URL: https://daan.lifenet.com.tw
        run: |
          set -euo pipefail
          HEALTH=""
          for i in $(seq 1 10); do
            HEALTH=$(curl -sf "$PRODUCTION_URL/api/v1/health" || true)
            echo "attempt $i: $HEALTH"
            echo "$HEALTH" | grep -q '"status":"ok"' && break
            sleep 3
          done
          echo "$HEALTH" | grep -q '"status":"ok"' || {
            echo "::error::Health check did not return ok after staged cutover"
            exit 1
          }
          VERSION=$(curl -sf "$PRODUCTION_URL/version.json")
          test -n "$VERSION"
          echo "version endpoint: $VERSION"

      - name: Mark the observation window open
        if: inputs.phase == 'phase2-cutover'
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_USER}@${PI_HOST}" bash <<'REMOTE'
          set -euo pipefail
          STATE_FILE=/home/admin/backups/pre-rotation/1387-staged/rotation-state.env
          # shellcheck disable=SC1090
          source "$STATE_FILE"
          [[ "$STATUS" == "cutover_local_verified" ]]
          sed -i 's/^STATUS=.*/STATUS=cutover_verified/' "$STATE_FILE"
          chmod 600 "$STATE_FILE"
          echo "Phase 2 complete: observation window is open; the old account remains valid and untouched."
          REMOTE

      - name: Automatically restore the attempt's .env if Phase 2 fails
        if: failure() && inputs.phase == 'phase2-cutover'
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          set -euo pipefail
          [[ -f ~/.ssh/deploy_key ]] || exit 0
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_USER}@${PI_HOST}" bash <<'REMOTE'
          set -euo pipefail
          cd /home/admin/backend
          STATE_FILE=/home/admin/backups/pre-rotation/1387-staged/rotation-state.env
          [[ -f "$STATE_FILE" ]] || exit 0
          # shellcheck disable=SC1090
          source "$STATE_FILE"
          [[ "$STATUS" == "cutover_pending" || "$STATUS" == "cutover_local_verified" ]] || exit 0
          [[ -n "$ATTEMPT_ENV_BACKUP" && -f "$ATTEMPT_ENV_BACKUP" ]]
          cp "$ATTEMPT_ENV_BACKUP" .env
          php artisan config:cache
          sudo -n service php8.2-fpm reload
          sed -i "s/^STATUS=.*/STATUS=${PREVIOUS_STATUS}/" "$STATE_FILE"
          chmod 600 "$STATE_FILE"
          echo "Failed Phase 2 attempt rolled back to its entry .env and config cache."
          REMOTE

      - name: Lock the old principal, with password quarantine only for unsupported lock syntax
        if: inputs.phase == 'phase3-lock'
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_USER}@${PI_HOST}" bash <<'REMOTE'
          set -euo pipefail
          umask 077
          cd /home/admin/backend
          STATE_FILE=/home/admin/backups/pre-rotation/1387-staged/rotation-state.env
          [[ -f "$STATE_FILE" ]] || { echo "::error::Staged rotation state is missing."; exit 1; }
          # shellcheck disable=SC1090
          source "$STATE_FILE"
          [[ "$STATUS" == "cutover_verified" ]] || {
            echo "::error::Phase 3 requires a completed Phase 2 observation window."
            exit 1
          }
          [[ "$(grep -m1 '^DB_USERNAME=' .env | cut -d= -f2-)" == "$STAGED_DB_USERNAME" ]] || {
            echo "::error::Application .env is not on the staged principal."
            exit 1
          }
          [[ -n "$OLD_ENV_BACKUP" && -f "$OLD_ENV_BACKUP" ]]
          OLD_DB_PASSWORD="$(grep -m1 '^DB_PASSWORD=' "$OLD_ENV_BACKUP" | cut -d= -f2-)"
          state_set() { sed -i "s|^${1}=.*|${1}=${2}|" "$STATE_FILE"; }
          state_secret_set() {
            local tmp="${STATE_FILE}.tmp"
            while IFS= read -r line; do
              if [[ "$line" == QUARANTINE_PASSWORD=* ]]; then
                printf 'QUARANTINE_PASSWORD=%q\n' "$1"
              else
                printf '%s\n' "$line"
              fi
            done < "$STATE_FILE" > "$tmp"
            chmod 600 "$tmp"
            mv "$tmp" "$STATE_FILE"
          }
          NEW_MYSQL=(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" \
            -u "$STAGED_DB_USERNAME" -p"$STAGED_DB_PASSWORD" --batch --skip-column-names)
          OLD_ACCOUNT_SQL="'${OLD_DB_USERNAME}'@'${OLD_ACCOUNT_HOST}'"

          "${NEW_MYSQL[@]}" "$DB_DATABASE" -e "SELECT 1" >/dev/null 2>&1
          LOCK_ERROR="$(mktemp /tmp/1387-account-lock.XXXXXX.err)"
          if "${NEW_MYSQL[@]}" -e "ALTER USER ${OLD_ACCOUNT_SQL} ACCOUNT LOCK" \
              >/dev/null 2>"$LOCK_ERROR"; then
            LOCK_METHOD=account_lock
            QUARANTINE_PASSWORD=''
          elif grep -qE 'ERROR 1064|syntax' "$LOCK_ERROR"; then
            # Compatibility fallback for a pre-account-lock server. The random
            # replacement remains only in the protected Pi state file.
            QUARANTINE_PASSWORD="$(openssl rand -hex 32)"
            printf "ALTER USER %s IDENTIFIED BY '%s';\n" "$OLD_ACCOUNT_SQL" "$QUARANTINE_PASSWORD" \
              | "${NEW_MYSQL[@]}" >/dev/null
            LOCK_METHOD=password_quarantine
          else
            cat "$LOCK_ERROR" >&2
            rm -f "$LOCK_ERROR"
            echo "::error::ACCOUNT LOCK failed for a reason other than unsupported syntax; no fallback attempted."
            exit 1
          fi
          rm -f "$LOCK_ERROR"
          state_set LOCK_METHOD "$LOCK_METHOD"
          state_secret_set "$QUARANTINE_PASSWORD"
          state_set STATUS containment_pending

          OLD_PROBE_ERROR="$(mktemp /tmp/1387-old-credential-probe.XXXXXX.err)"
          if mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" \
              -u "$OLD_DB_USERNAME" -p"$OLD_DB_PASSWORD" "$DB_DATABASE" \
              --batch --skip-column-names -e "SELECT 1" >/dev/null 2>"$OLD_PROBE_ERROR"; then
            if [[ "$LOCK_METHOD" == account_lock ]]; then
              "${NEW_MYSQL[@]}" -e "ALTER USER ${OLD_ACCOUNT_SQL} ACCOUNT UNLOCK" >/dev/null
              state_set LOCK_METHOD ''
              state_secret_set ''
              state_set STATUS cutover_verified
            fi
            rm -f "$OLD_PROBE_ERROR"
            echo "::error::The old credential still authenticated; containment was not accepted."
            exit 1
          fi

          OLD_PROBE_CODE="$(sed -n 's/.*ERROR \([0-9][0-9]*\).*/\1/p' "$OLD_PROBE_ERROR" | head -n 1)"
          if [[ "$OLD_PROBE_CODE" != 1045 && "$OLD_PROBE_CODE" != 3118 ]]; then
            cat "$OLD_PROBE_ERROR" >&2
            if [[ "$LOCK_METHOD" == account_lock ]]; then
              "${NEW_MYSQL[@]}" -e "ALTER USER ${OLD_ACCOUNT_SQL} ACCOUNT UNLOCK" >/dev/null
              state_set LOCK_METHOD ''
              state_secret_set ''
              state_set STATUS cutover_verified
            fi
            rm -f "$OLD_PROBE_ERROR"
            echo "::error::Old-credential probe did not return a known authentication rejection; containment was not accepted."
            exit 1
          fi
          rm -f "$OLD_PROBE_ERROR"
          echo "old-credential-probe=AUTH_REJECTED code=$OLD_PROBE_CODE"
          "${NEW_MYSQL[@]}" "$DB_DATABASE" -e "SELECT 1" >/dev/null 2>&1

          export EXPECTED_DB_USERNAME="$STAGED_DB_USERNAME"
          php artisan tinker --execute='
          \Illuminate\Support\Facades\DB::purge("mysql");
          $row = \Illuminate\Support\Facades\DB::selectOne("SELECT CURRENT_USER() AS principal, 1 AS probe");
          $expected = (string) getenv("EXPECTED_DB_USERNAME");
          if (!$row || (int) $row->probe !== 1 || !str_starts_with((string) $row->principal, $expected . "@")) {
              throw new RuntimeException("post-lock staged principal verification failed");
          }
          echo "post-lock-db-read-new-principal=OK", PHP_EOL;
          '

          state_set STATUS old_principal_contained
          chmod 600 "$STATE_FILE"
          unset OLD_DB_PASSWORD STAGED_DB_PASSWORD QUARANTINE_PASSWORD
          echo "Phase 3 complete: the old credential cannot open a new connection; the new principal still passes an app-level DB read."
          REMOTE

      - name: Remove local key material
        if: always()
        run: rm -f ~/.ssh/deploy_key
