name: Deploy to Pi
# Train runs are named so release-train-kick can find the last one.
run-name: ${{ inputs.phase == 'release-train' && 'Release train' || 'Deploy to Pi' }}

on:
  workflow_run:
    workflows: ["CI — PHPUnit Tests"]
    types: [completed]
    branches: [main]

  repository_dispatch:
    types: [autonomous-production-deploy]

  # Release train: one Founder approval per train instead of one per R3 merge. Founder 1A
  # (2026-10-07): any run whose range is all R0-R2 or Founder-GO'd PRs deploys through
  # production-auto with no approval, so the train only carries Founder-gated ranges.
  # Two windows a day, 12:17 and 18:17 Asia/Taipei (04:17 and 10:17 UTC), so the Founder
  # approves at most once per window (Founder 2026-10-14「好，照你建議做 go」approving
  # 「批次核准：一天集中 1–2 班」; replaces the hourly 3A schedule). A schedule run does not
  # deploy by itself: release-train-kick dispatches `phase=release-train`. GitHub drops or
  # delays many scheduled runs, so the same kick also runs at the end of every merge's own
  # run whose range waits for a train: it dispatches only when a window has passed, no train
  # has asked for approval or deployed since that window, and no train or approval is pending.
  # A train still stands down if a deploy run is already waiting for approval.
  schedule:
    - cron: '17 4 * * *'
    - cron: '17 10 * * *'

  workflow_dispatch:
    inputs:
      phase:
        description: "Choose exactly one phase; phases never auto-chain"
        required: true
        type: choice
        options:
          - application-deploy
          - release-train
          - parent-portal-smoke
          - pop-bootstrap
          - phase1-create
          - phase2-cutover
          - phase3-lock
      target_sha:
        description: "Exact current main SHA for Founder-approved application or POP bootstrap activation"
        required: false
        type: string
      campus_id:
        description: "Campus ID for the host-local POP machine identity (bootstrap only)"
        required: false
        default: "9"
        type: string
      confirm:
        description: "Type the phase-specific confirmation phrase; release train uses RELEASE_TRAIN (target is resolved automatically); application deploy uses ACTIVATE_PRODUCTION:<target_sha>, parent smoke uses VERIFY_PARENT_PORTAL:<target_sha>, POP bootstrap uses BOOTSTRAP_POP_MACHINE:<target_sha>:CAMPUS:<campus_id>"
        required: true
        type: string
      admissions_funnel_v1:
        description: "Application deploy only: explicitly set the admissions funnel flag, or preserve its current production value"
        required: false
        default: unchanged
        type: choice
        options:
          - unchanged
          - "on"
          - "off"
      course_session_calendar_v1:
        description: "Application deploy only: explicitly set Course Management calendar flag (Phase 0+1a staff surface), or preserve its current production value. Does not authorize Phase 1b/2/3."
        required: false
        default: unchanged
        type: choice
        options:
          - unchanged
          - "on"
          - "off"
      course_manager_v1:
        description: "Application deploy only: explicitly set Course Manager IA flag (管理課程 workspace), or preserve its current production value. Does not authorize Phase 1b/2/3."
        required: false
        default: unchanged
        type: choice
        options:
          - unchanged
          - "on"
          - "off"
      pop_inapp_standing_policy:
        description: "Application deploy only (default unchanged = preserve the current production value): explicitly set the backend POP in-app standing policy flag POP_INAPP_STANDING_POLICY. ADR-POP-015: the Founder turns it on only after the dry-run phase."
        required: false
        default: unchanged
        type: choice
        options:
          - unchanged
          - "on"
          - "off"

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  contract-test:
    name: Merge/activation contract
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.client_payload.target_sha || github.sha }}

      - name: Verify deploy state-machine contract
        run: |
          python3 scripts/tests/test_deploy_activation_state.py
          python3 scripts/tests/test_principal_rotation_grant_replay.py
          python3 scripts/tests/test_post_deploy_watch.py

  resolve-target:
    name: Resolve exact activation target
    needs: contract-test
    if: ${{ needs.contract-test.result == 'success' && ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && (inputs.phase == 'application-deploy' || inputs.phase == 'release-train' || inputs.phase == 'parent-portal-smoke' || inputs.phase == 'pop-bootstrap')) || (github.event_name == 'repository_dispatch' && github.event.action == 'autonomous-production-deploy')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45 # #3643 bounded wait for the tip CI
    outputs:
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      superseded: ${{ steps.resolve.outputs.superseded }}
      release_train: ${{ steps.resolve.outputs.release_train }}
      flag_changes: ${{ steps.resolve.outputs.flag_changes }}
    steps:
      - name: Validate target SHA and CI evidence
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          PHASE: ${{ inputs.phase }}
          FLAG_ADMISSIONS: ${{ inputs.admissions_funnel_v1 }}
          FLAG_CALENDAR: ${{ inputs.course_session_calendar_v1 }}
          FLAG_MANAGER: ${{ inputs.course_manager_v1 }}
          FLAG_POP_INAPP: ${{ inputs.pop_inapp_standing_policy }}
          RUN_HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_REF: ${{ github.ref }}
          TARGET_SHA_INPUT: ${{ github.event.workflow_run.head_sha || github.event.client_payload.target_sha || inputs.target_sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only unchanged/on/off (empty on automatic runs) may reach the Pi script; the requested
          # changes are shown to the Founder as an annotation and in the Release state summary.
          FLAG_CHANGES=""
          for pair in "admissions_funnel_v1=$FLAG_ADMISSIONS" "course_session_calendar_v1=$FLAG_CALENDAR" \
                      "course_manager_v1=$FLAG_MANAGER" "pop_inapp_standing_policy=$FLAG_POP_INAPP"; do
            case "${pair#*=}" in
              ""|unchanged) ;;
              on|off) FLAG_CHANGES="${FLAG_CHANGES:+$FLAG_CHANGES, }$pair" ;;
              *) echo "::error::${pair%%=*} accepts only unchanged, on or off; nothing was deployed."; exit 1 ;;
            esac
          done
          echo "flag_changes=${FLAG_CHANGES:-none}" >> "$GITHUB_OUTPUT"
          [[ -z "$FLAG_CHANGES" ]] || echo "::warning title=Feature-flag change requested::${FLAG_CHANGES}"
          RELEASE_TRAIN=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$PHASE" == "release-train" ]]; then
            RELEASE_TRAIN=true
            for flag in "$FLAG_ADMISSIONS" "$FLAG_CALENDAR" "$FLAG_MANAGER" "$FLAG_POP_INAPP"; do
              if [[ -n "$flag" && "$flag" != "unchanged" ]]; then
                echo "::error::A release train never changes feature flags; use phase=application-deploy for a flag change."
                exit 1
              fi
            done
            # A retry stands down while another deploy run already waits for approval,
            # so the Founder never sees the waiting train cancelled under them.
            WAITING="$(gh api "/repos/${REPO}/actions/workflows/deploy.yml/runs?status=waiting&per_page=5" \
              --jq "[.workflow_runs[] | select(.id != ${RUN_ID})] | length")"
            if [[ "$WAITING" -ge 1 ]]; then
              echo "::notice::Release train: another deploy run is already waiting for approval; standing down."
              echo "superseded=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # The train offers only the run's own head_sha (main at trigger time): deploy
            # provenance is keyed on it. If its main CI is not green yet, wait for the next
            # train instead of offering any other commit.
            TIP="$RUN_HEAD_SHA"
            # #3643: the land queue merges often, so the tip's CI may still be running. Wait (bounded,
            # ~40 min) while a main CI run for TIP is unfinished; never switch to another commit.
            for _ in $(seq 1 40); do
              OK="$(gh api "/repos/${REPO}/actions/workflows/ci.yml/runs?branch=main&head_sha=${TIP}&status=completed&per_page=100" \
                --jq '[.workflow_runs[] | select(.name == "CI — PHPUnit Tests" and .conclusion == "success" and (.event == "push" or .event == "workflow_dispatch"))] | length')"
              [[ "$OK" -ge 1 ]] && break
              PENDING="$(gh api "/repos/${REPO}/actions/workflows/ci.yml/runs?branch=main&head_sha=${TIP}&per_page=100" \
                --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
              [[ "$PENDING" -ge 1 ]] || break
              sleep 60
            done
            if [[ "$OK" -lt 1 ]]; then
              echo "::notice::Release train: main tip ${TIP} has no successful main CI yet; nothing to offer this time."
              echo "superseded=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TARGET_SHA_INPUT="$TIP"
          fi
          echo "release_train=${RELEASE_TRAIN}" >> "$GITHUB_OUTPUT"
          TARGET_SHA="${TARGET_SHA_INPUT,,}"
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Activation requires a full 40-character commit SHA."
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "::error::Manual application activation must be dispatched from refs/heads/main; got ${WORKFLOW_REF}."
            exit 1
          fi

          gh api "/repos/${REPO}/commits/${TARGET_SHA}" >/dev/null

          # A late CI run for an older commit must not ask for Founder approval that the
          # exact-main gate will refuse anyway; the newer main commit's own CI deploys it.
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            MAIN_SHA="$(gh api "/repos/${REPO}/git/ref/heads/main" --jq '.object.sha')"
            if [[ "$TARGET_SHA" != "$MAIN_SHA" ]]; then
              echo "::notice::Superseded: CI finished for ${TARGET_SHA} but main is ${MAIN_SHA}; skipping without an approval request."
              echo "superseded=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [[ "$RELEASE_TRAIN" != "true" && ( "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "repository_dispatch" ) ]]; then
            MAIN_SHA="$(gh api "/repos/${REPO}/git/ref/heads/main" --jq '.object.sha')"
            if [[ "$TARGET_SHA" != "$MAIN_SHA" ]]; then
              echo "::error::Manual activation must target the current main SHA; requested ${TARGET_SHA}, current ${MAIN_SHA}."
              exit 1
            fi

            CI_RUNS="$(gh api "/repos/${REPO}/actions/workflows/ci.yml/runs?branch=main&head_sha=${TARGET_SHA}&status=completed&per_page=100")"
            CI_OK="$(CI_RUNS="$CI_RUNS" python3 - <<'PY'
          import json
          import os

          runs = json.loads(os.environ["CI_RUNS"]).get("workflow_runs", [])
          print(sum(1 for run in runs if run.get("name") == "CI — PHPUnit Tests" and run.get("conclusion") == "success"))
          PY
          )"
            if [[ "$CI_OK" -lt 1 ]]; then
              echo "::error::The exact target SHA has no successful main CI run; activation refused."
              exit 1
            fi
          fi

          echo "target_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved activation target: ${TARGET_SHA}"

  detect-deployable:
    name: Detect deployable changes
    needs: resolve-target
    if: ${{ needs.resolve-target.result == 'success' && needs.resolve-target.outputs.superseded != 'true' }}
    # Current topology: GitHub-hosted. See docs/REF_CI_RUNNER_TOPOLOGY.md.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      deployable: ${{ steps.detect.outputs.deployable }}
      runtime_base_sha: ${{ steps.detect.outputs.runtime_base_sha }}
      expected_deployed_application_sha: ${{ steps.detect.outputs.expected_deployed_application_sha }}
      detection_reason: ${{ steps.detect.outputs.detection_reason }}
      runtime_state: ${{ steps.detect.outputs.runtime_state }}
    steps:
      - name: Checkout target revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-target.outputs.target_sha }}

      - name: Check changed files
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.resolve-target.outputs.target_sha }}
          PHASE: ${{ inputs.phase }}
          ADMISSIONS_FUNNEL_V1: ${{ inputs.admissions_funnel_v1 }}
          COURSE_SESSION_CALENDAR_V1: ${{ inputs.course_session_calendar_v1 }}
          COURSE_MANAGER_V1: ${{ inputs.course_manager_v1 }}
          POP_INAPP_STANDING_POLICY: ${{ inputs.pop_inapp_standing_policy }}
          PRODUCTION_URL: https://daan.lifenet.com.tw
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import subprocess

          from scripts.governance.autonomy_gate import (
              classify_production_runtime,
              is_application_runtime_path,
              is_control_plane_only_paths,
              wait_for_exact_successful_provenance,
          )

          repo = os.environ["REPO"]
          head = os.environ["HEAD_SHA"]
          output = os.environ["GITHUB_OUTPUT"]
          manifest_source = None
          explicit_flag_activation = (
              os.environ.get("PHASE") == "application-deploy"
              and any(
                  (os.environ.get(key) or "unchanged").strip().lower() in {"on", "off"}
                  for key in ("ADMISSIONS_FUNNEL_V1", "COURSE_SESSION_CALENDAR_V1", "COURSE_MANAGER_V1", "POP_INAPP_STANDING_POLICY")
              )
          )

          def emit(
              deployable,
              base_sha,
              reason,
              runtime_state="invalid-evidence",
              expected_deployed_application_sha="unknown",
          ):
              with open(output, "a", encoding="utf-8") as stream:
                  stream.write(f"deployable={str(deployable).lower()}\n")
                  stream.write(f"runtime_base_sha={base_sha}\n")
                  stream.write(f"expected_deployed_application_sha={expected_deployed_application_sha}\n")
                  stream.write(f"detection_reason={reason}\n")
                  stream.write(f"runtime_state={runtime_state}\n")

          def successful_deploy_provenance(sha):
              candidates = []
              try:
                  runs = json.loads(subprocess.check_output(
                      [
                          "gh", "api",
                          f"/repos/{repo}/actions/workflows/deploy.yml/runs?branch=main&head_sha={sha}&status=completed&per_page=100",
                      ],
                      text=True,
                  )).get("workflow_runs", [])
              except (OSError, ValueError, subprocess.CalledProcessError):
                  return None
              for run in runs:
                  if run.get("conclusion") != "success" or not run.get("id"):
                      continue
                  try:
                      jobs = json.loads(subprocess.check_output(
                          [
                              "gh", "api",
                              f"/repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100",
                          ],
                          text=True,
                      )).get("jobs", [])
                  except (OSError, ValueError, subprocess.CalledProcessError):
                      continue
                  if any(
                      job.get("name") == "Deploy to Production"
                      and job.get("conclusion") == "success"
                      for job in jobs
                  ):
                      provenance_sha = str(run.get("head_sha") or "").strip().lower()
                      if provenance_sha == sha:
                          candidates.append((str(run.get("created_at") or ""), provenance_sha))
              return max(candidates, key=lambda item: item[0])[1] if candidates else None

          try:
              manifest_process = subprocess.run(
                  [
                      "curl", "-fsSL", "--max-time", "20",
                      f"{os.environ['PRODUCTION_URL'].rstrip('/')}/deployment.json",
                  ],
                  text=True,
                  capture_output=True,
                  check=True,
              )
              manifest = json.loads(manifest_process.stdout)
              deployed = str(manifest.get("backend_sha") or "").strip().lower()
              manifest_source = str(manifest.get("source") or "").strip()
          except (OSError, ValueError, subprocess.CalledProcessError):
              deployed = ""

          if len(deployed) != 40 or any(char not in "0123456789abcdef" for char in deployed):
              # Unknown runtime identity must enter the classifier and hold; it
              # must never become a false no-op that hides an undeployed range.
              emit(
                  True,
                  "unknown",
                  "production deployment identity unavailable; classifier must fail closed",
                  "invalid-evidence",
              )
              raise SystemExit(0)

          if os.environ.get("PHASE") == "pop-bootstrap":
              # Bootstrap is a protected host-local identity action. It must
              # reach the existing executor even when the application
              # manifest already matches the requested workflow revision.
              emit(
                  True,
                  deployed,
                  "explicit POP machine bootstrap requested; protected host-local executor required",
                  "pop-bootstrap",
              )
              raise SystemExit(0)

          if os.environ.get("PHASE") == "parent-portal-smoke":
              # The smoke workflow revision may be newer than the deployed
              # application revision. Reuse canonical deployment provenance
              # and the existing path classifier before any fixture/session
              # call. Only control-plane-only deltas are safe to smoke.
              comparison_process = subprocess.run(
                  ["gh", "api", f"/repos/{repo}/compare/{deployed}...{head}"],
                  text=True,
                  capture_output=True,
              )
              if comparison_process.returncode != 0:
                  emit(True, deployed, "parent smoke runtime comparison unavailable; fail closed", "invalid-evidence")
                  raise SystemExit(0)
              try:
                  comparison = json.loads(comparison_process.stdout)
              except ValueError:
                  emit(True, deployed, "parent smoke runtime comparison was invalid; fail closed", "invalid-evidence")
                  raise SystemExit(0)
              expected_application_sha = successful_deploy_provenance(deployed) or "unknown"
              runtime = classify_production_runtime(
                  production_sha=deployed,
                  target_sha=head,
                  comparison_status=comparison.get("status"),
                  provenance_sha=expected_application_sha,
                  manifest_source=manifest_source,
              )
              runtime_state = str(runtime["state"])
              if runtime_state not in {"current", "normal-version-lag"}:
                  emit(True, deployed, str(runtime["reason"]), runtime_state, expected_application_sha)
                  raise SystemExit(0)
              files = [item.get("filename", "") for item in comparison.get("files", [])]
              application_files = [path for path in files if is_application_runtime_path(path)]
              if application_files:
                  print("Application/runtime paths changed after the deployed application revision:")
                  for path in application_files:
                      print(f"- {path}")
                  emit(
                      True,
                      deployed,
                      "parent smoke blocked: application/runtime changes require deployment",
                      "application-runtime-delta",
                      expected_application_sha,
                  )
                  raise SystemExit(0)
              emit(
                  True,
                  deployed,
                  "parent smoke provenance verified; workflow/governance-only delta",
                  "parent-portal-safe",
                  expected_application_sha,
              )
              raise SystemExit(0)

          comparison_process = subprocess.run(
              ["gh", "api", f"/repos/{repo}/compare/{deployed}...{head}"],
              text=True,
              capture_output=True,
          )
          if comparison_process.returncode != 0:
              emit(
                  True,
                  deployed,
                  "production-to-main comparison unavailable; classifier must fail closed",
                  "invalid-evidence",
              )
              raise SystemExit(0)
          try:
              comparison = json.loads(comparison_process.stdout)
          except ValueError:
              emit(True, deployed, "production-to-main comparison was invalid; classifier must fail closed", "invalid-evidence")
              raise SystemExit(0)
          files = [item.get("filename", "") for item in comparison.get("files", [])]
          application_files = [path for path in files if is_application_runtime_path(path)]
          control_plane_only = is_control_plane_only_paths(files)
          provenance_sha = successful_deploy_provenance(deployed)
          # A deployment manifest is identity evidence, never success proof.
          # Only when it already names this exact target may a bounded 60-second
          # recheck wait for the authoritative completed-success deployment run.
          if deployed == head and manifest_source == "github-actions:deploy.yml" and provenance_sha is None:
              provenance_sha = wait_for_exact_successful_provenance(
                  lookup=successful_deploy_provenance,
                  expected_sha=deployed,
                  attempts=7,
                  interval_seconds=10,
              )
          runtime = classify_production_runtime(
              production_sha=deployed,
              target_sha=head,
              comparison_status=comparison.get("status"),
              provenance_sha=provenance_sha,
              manifest_source=manifest_source,
          )
          runtime_state = str(runtime["state"])
          print(f"Production runtime state: {runtime_state} ({runtime['reason']})")
          if runtime_state == "current":
              if explicit_flag_activation:
                  # Flag on/off must rebuild the Vite bundle even when the tip SHA
                  # already matches production (admissions / calendar activation),
                  # or rewrite .env before the config cache rebuild (POP standing policy).
                  emit(
                      True,
                      deployed,
                      "explicit Founder feature-flag activation on current tip; frontend rebuild required",
                      "current",
                      provenance_sha or deployed,
                  )
                  raise SystemExit(0)
              if control_plane_only:
                  emit(
                      False,
                      deployed,
                      "control-plane-only change is effective on main; application runtime already current",
                      "control-plane-only",
                  )
                  raise SystemExit(0)
              emit(False, deployed, str(runtime["reason"]), runtime_state)
              raise SystemExit(0)
          if runtime_state != "normal-version-lag":
              emit(True, deployed, str(runtime["reason"]), runtime_state)
              raise SystemExit(0)

          if explicit_flag_activation:
              # A flag on/off reaches .env only in the Deploy step, so a lag with no
              # application files (control-plane or docs only) must deploy too, never
              # end as a green no-op (an `off` kill switch would fail open).
              emit(True, deployed, "explicit Founder feature-flag activation on a lagging runtime; Deploy step required", runtime_state)
              raise SystemExit(0)

          if control_plane_only:
              emit(
                  False,
                  deployed,
                  "control-plane-only change is effective on main; no application runtime deployment required",
                  "control-plane-only",
              )
              raise SystemExit(0)

          deployable = bool(application_files)
          print(f"Production runtime base: {deployed}")
          print("Changed files since the deployed runtime:")
          for path in files:
              print(f"- {path}")
          print(f"deployable={str(deployable).lower()}")
          emit(deployable, deployed, "normal version lag: compared target against verified production deployment", runtime_state)
          PYEOF

  classify-activation:
    name: Classify merge/activation state
    needs: [resolve-target, detect-deployable]
    if: ${{ needs.resolve-target.result == 'success' && needs.detect-deployable.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10 # R3 evidence pages GitHub APIs (review, freeze); a timeout holds every deploy
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      approval_eligible: ${{ steps.classify.outputs.approval_eligible }}
      tier: ${{ steps.classify.outputs.tier }}
      pr_number: ${{ steps.classify.outputs.pr_number }}
      reason: ${{ steps.classify.outputs.reason }}
      go_evidence: ${{ steps.classify.outputs.go_evidence }}
      go_reason: ${{ steps.classify.outputs.go_reason }}
      r3_evidence: ${{ steps.classify.outputs.r3_evidence }}
      r3_review_prs: ${{ steps.classify.outputs.r3_review_prs }}
    steps:
      - name: Checkout target revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-target.outputs.target_sha }}

      # Founder 1A evidence runs the policy code production already runs, never the
      # target's own (a range must not judge itself). Missing checkout fails closed.
      - name: Checkout deployed revision for trusted Founder GO policy
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect-deployable.outputs.runtime_base_sha }}
          path: trusted-policy
          sparse-checkout: scripts/governance

      - name: Classify activation policy
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PHASE: ${{ inputs.phase }}
          DEPLOYABLE: ${{ needs.detect-deployable.outputs.deployable }}
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
          RUNTIME_BASE_SHA: ${{ needs.detect-deployable.outputs.runtime_base_sha }}
          RUNTIME_STATE: ${{ needs.detect-deployable.outputs.runtime_state }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          hold() {
            {
              echo "mode=awaiting-activation"
              echo "approval_eligible=${4:-false}"
              echo "tier=${1:-unknown}"
              echo "pr_number=${2:-none}"
              echo "reason=${3}"
            } >> "$GITHUB_OUTPUT"
          }

          if [[ "$DEPLOYABLE" != "true" ]]; then
            if [[ "$RUNTIME_STATE" == "control-plane-only" ]]; then
              {
                echo "mode=control-plane-verified"
                echo "approval_eligible=false"
                echo "tier=none"
                echo "pr_number=none"
                echo "reason=control-plane change is effective on main; no application runtime deployment required"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            {
              echo "mode=no-op"
              echo "approval_eligible=false"
              echo "tier=none"
              echo "pr_number=none"
              echo "reason=non-deployable change"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # POP bootstrap is a separate host-local identity action. Preserve
          # its protected path even when the application runtime manifest is
          # unavailable; the bootstrap executor performs its own identity
          # checks before any host-local side effect.
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$PHASE" == "pop-bootstrap" ]]; then
            {
              echo "mode=manual"
              echo "approval_eligible=true"
              echo "tier=protected"
              echo "pr_number=manual"
              echo "reason=Founder exact-SHA activation requested"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$PHASE" == "parent-portal-smoke" ]]; then
            if [[ "$RUNTIME_STATE" != "parent-portal-safe" ]]; then
              hold "protected" "manual" "parent smoke provenance is not safe: ${RUNTIME_STATE}; no fixture/session action"
              exit 0
            fi
            {
              echo "mode=manual"
              echo "approval_eligible=true"
              echo "tier=protected"
              echo "pr_number=manual"
              echo "reason=explicit authenticated Parent Portal fixture and smoke verification"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$RUNTIME_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            hold "unknown" "none" "production deployment identity unavailable; fail closed"
            exit 0
          fi

          # A verified deployed ancestor is normal version lag while a
          # deployment is pending. It still reaches the existing protected
          # activation gate, but it must not require a second Founder
          # authorization merely because production has not caught up yet.
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$PHASE" != "release-train" ]]; then
            if [[ "$RUNTIME_STATE" != "normal-version-lag" && "$RUNTIME_STATE" != "current" ]]; then
              hold "unknown" "none" "read-only manifest evidence must be valid before manual activation: ${RUNTIME_STATE}"
              exit 0
            fi
            {
              echo "mode=manual"
              echo "approval_eligible=true"
              echo "tier=protected"
              echo "pr_number=manual"
              echo "reason=Founder exact-SHA activation requested; runtime_state=${RUNTIME_STATE}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! -f scripts/governance/autonomy_gate.py ]]; then
            hold "unknown" "none" "authoritative classifier unavailable; fail closed"
            exit 0
          fi

          REPO="$REPO" TARGET_SHA="$TARGET_SHA" GH_TOKEN="$GH_TOKEN" python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          def gh_api(path, *extra):
              # Fail closed on empty/truncated bodies. The Go `gh` client can
              # print "unexpected end of JSON input" on stderr while stdout is
              # empty (run 38610137074). gh_api_json retries only an empty body
              # or HTTP 5xx, at most 3 attempts with backoff, then raises
              # RuntimeError so the except handler below still fails closed.
              from scripts.governance.gh_api_retry import gh_api_json
              return gh_api_json(path, *extra)

          def pages(value):
              if isinstance(value, list):
                  result = []
                  for page in value:
                      result.extend(page if isinstance(page, list) else [page])
                  return result
              return value if isinstance(value, list) else []

          def active_main_required_status_checks(repo):
              ruleset_pages = gh_api(
                  f"/repos/{repo}/rulesets?per_page=100",
                  "--paginate", "--slurp",
              )
              rulesets = pages(ruleset_pages)
              candidates = [ruleset for ruleset in rulesets if (
                  ruleset.get("name") == "main-protection"
                  and ruleset.get("target") == "branch"
                  and ruleset.get("enforcement") == "active"
                  and ruleset.get("id")
              )]
              if len(candidates) != 1 or not candidates[0].get("id"):
                  raise ValueError("active main-protection ruleset evidence is unavailable or ambiguous")
              detail = gh_api(f"/repos/{repo}/rulesets/{candidates[0]['id']}")
              if (
                  detail.get("name") != "main-protection"
                  or detail.get("target") != "branch"
                  or detail.get("enforcement") != "active"
                  or "~DEFAULT_BRANCH" not in (
                      detail.get("conditions", {}).get("ref_name", {}).get("include", [])
                  )
              ):
                  raise ValueError("active main-protection default-branch evidence is unavailable or invalid")
              required_rules = [rule for rule in detail.get("rules", []) if (
                  rule.get("type") == "required_status_checks"
              )]
              if len(required_rules) != 1:
                  raise ValueError("main-protection required_status_checks evidence is unavailable or ambiguous")
              required = required_rules[0].get("parameters", {}).get("required_status_checks")
              if not isinstance(required, list) or not required:
                  raise ValueError("main-protection required_status_checks is missing")
              return required

          def emit(mode, tier, pr_number, reason, approval_eligible=False):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"mode={mode}\n")
                  output.write(f"approval_eligible={str(approval_eligible).lower()}\n")
                  output.write(f"tier={tier}\n")
                  output.write(f"pr_number={pr_number}\n")
                  output.write(f"reason={reason}\n")

          repo = os.environ["REPO"]
          target = os.environ["TARGET_SHA"]
          try:
              from scripts.governance.autonomy_gate import (
                  classify_activation_provenance,
                  aggregate_landed_pr_effects,
                  decide_activation,
                  has_rollback_evidence,
                  is_founder_approval_eligible,
                  is_deployable_path,
                  is_production_activation_sensitive_path,
                  parse_declaration,
                  reconcile_preexisting_pr_provenance,
                  codex_confirms_head,
                  declares_additive_migration,
              )

              def additive_confirmed(pr, paths):
                  # Founder 2026-10-14（三）補充 #1: declared, and Codex's 👍 on the final head.
                  if not declares_additive_migration(pr.get("body") or "") or not any(
                      p.startswith("backend/database/migrations/") for p in paths
                  ):
                      return False
                  n, flags = pr.get("number"), ("--paginate", "--slurp")
                  try:
                      return codex_confirms_head(
                          (pr.get("head") or {}).get("sha"),
                          pages(gh_api(f"/repos/{repo}/issues/{n}/comments?per_page=100", *flags)),
                          pages(gh_api(f"/repos/{repo}/pulls/{n}/reviews?per_page=100", *flags)),
                          pages(gh_api(f"/repos/{repo}/issues/{n}/reactions?per_page=100", *flags)),
                      )
                  except (RuntimeError, ValueError):
                      return False

              base = os.environ["RUNTIME_BASE_SHA"]
              required_status_checks = active_main_required_status_checks(repo)
              comparison = gh_api(f"/repos/{repo}/compare/{base}...{target}")
              files = comparison.get("files") or []
              if not files:
                  emit("awaiting-activation", "unknown", "none", "runtime range has no inspectable file evidence; fail closed")
                  sys.exit(0)
              # The unpaginated compare caps `commits` (250): an omitted commit is never classified (#4359 review).
              if comparison.get("total_commits") != len(comparison.get("commits") or []):
                  emit("awaiting-activation", "unknown", "none",
                       f"runtime range lists {len(comparison.get('commits') or [])} of {comparison.get('total_commits')} commits; fail closed")
                  sys.exit(0)

              # Attribute the undeployed range to each merged PR before
              # classifying it. A control-plane-only PR is already effective
              # at merge; it must not raise a later application release. Do
              # not classify one aggregate diff with the newest declaration.
              # All provenance evidence is read-only GitHub API metadata.
              # Each application record still uses classify_activation_scope
              # so its complete effect remains subject to the existing boundary.
              attributed = []
              landed_effects = []
              seen_reconciled_prs = set()
              attributed_commits = set()
              provenance_complete = True
              # Every path the range touches (Founder 2026-10-21 R3 auto); None once a commit is capped.
              range_paths = set()
              range_renamed = False
              # Every merged PR in the range, including ones with no deployable path (R3 review covers them all).
              range_prs = set()
              for commit in comparison.get("commits") or []:
                  commit_sha = commit.get("sha")
                  if not commit_sha:
                      provenance_complete = False
                      continue
                  commit_detail = gh_api(f"/repos/{repo}/commits/{commit_sha}")
                  actual_files = commit_detail.get("files")
                  if not isinstance(actual_files, list):
                      provenance_complete = False
                      continue
                  # A rename's source path is classified too: moving a file out of a protected path is a protected change.
                  actual_paths = [p for item in actual_files for p in (item.get("filename", ""), item.get("previous_filename")) if p]
                  range_renamed = range_renamed or any(item.get("previous_filename") for item in actual_files)
                  if range_paths is not None and len(actual_files) < 300:
                      range_paths.update(p for item in actual_files for p in (item.get("filename"), item.get("previous_filename")) if p)
                  else:
                      range_paths = None
                  actual_patch_parts = []
                  actual_patch_complete = True
                  for item in actual_files:
                      path = item.get("filename", "")
                      item_patch = item.get("patch")
                      if item_patch is None:
                          actual_patch_complete = False
                      actual_patch_parts.append(
                          f"diff --git a/{path} b/{path}\n+++ b/{path}\n{item_patch or ''}"
                      )
                  actual_effect = {
                      "commit_sha": commit_sha,
                      "paths": actual_paths,
                      "patch": "\n".join(actual_patch_parts),
                      "patch_complete": actual_patch_complete,
                  }
                  candidates = gh_api(
                      f"/repos/{repo}/commits/{commit_sha}/pulls",
                      "--header", "Accept: application/vnd.github+json",
                  )
                  if not candidates:
                      referenced_prs = sorted(set(re.findall(
                          r"(?<![A-Za-z0-9])#([1-9][0-9]*)\b",
                          str((commit.get("commit") or {}).get("message") or ""),
                      )))
                      recovered = []
                      merged_matches = []
                      for pr_number in referenced_prs:
                          try:
                              try:
                                  candidate_pr = gh_api(f"/repos/{repo}/pulls/{pr_number}")
                              except RuntimeError as error:
                                  # A message may cite an issue, e.g. "(#3908) (#3939)": that 404 is not
                                  # provenance. Other API failures still abort the classifier (fail closed).
                                  if "HTTP 404" in str(error):
                                      print(f"#{pr_number} in commit message is not a pull request; skipped")
                                      continue
                                  raise
                              if candidate_pr.get("base", {}).get("ref") != "main":
                                  continue
                              if candidate_pr.get("merged_at") and candidate_pr.get("merge_commit_sha") == commit_sha:
                                  # GitHub returned no /commits/{sha}/pulls for this squash commit (dfcde48 / #3939),
                                  # but the PR's own merge_commit_sha is exactly this commit. It joins the normal
                                  # candidate path below, which re-reads the PR and its declaration.
                                  merged_matches.append({"number": int(pr_number), "base": {"ref": "main"}, "merged_at": candidate_pr.get("merged_at")})
                                  continue
                              pr_files = pages(gh_api(
                                  f"/repos/{repo}/pulls/{pr_number}/files?per_page=100",
                                  "--paginate", "--slurp",
                              ))
                              target_files = commit_detail.get("files") or []
                              head_sha = candidate_pr.get("head", {}).get("sha")
                              head_commit = gh_api(f"/repos/{repo}/commits/{head_sha}")
                              check_runs = gh_api(
                                  f"/repos/{repo}/commits/{head_sha}/check-runs?per_page=100",
                                  "--header", "Accept: application/vnd.github+json",
                              )
                              statuses = gh_api(f"/repos/{repo}/commits/{head_sha}/status")
                              closeout_comments = pages(gh_api(
                                  f"/repos/{repo}/issues/{pr_number}/comments?per_page=100",
                                  "--paginate", "--slurp",
                              ))
                              reconciliation = reconcile_preexisting_pr_provenance(
                                  target_commit={
                                      "sha": commit_sha,
                                      "committer_date": (commit_detail.get("commit") or {}).get("committer", {}).get("date"),
                                      "parents": commit_detail.get("parents"),
                                      "tree": (commit_detail.get("commit") or {}).get("tree"),
                                  },
                                  pr=candidate_pr,
                                  pr_files=pr_files,
                                  target_files=target_files,
                                  pr_head_commit={
                                      "committer_date": (head_commit.get("commit") or {}).get("committer", {}).get("date"),
                                      "parents": head_commit.get("parents"),
                                      "tree": (head_commit.get("commit") or {}).get("tree"),
                                  },
                                  check_evidence={
                                      "check_runs": check_runs.get("check_runs") or [],
                                      "check_runs_total": check_runs.get("total_count"),
                                      "statuses": statuses.get("statuses") or [],
                                      "statuses_total": statuses.get("total_count", 0),
                                      "required_status_checks": required_status_checks,
                                  },
                                  closeout_comments=closeout_comments,
                              )
                              if reconciliation.get("accepted"):
                                  recovered.append(reconciliation["record"])
                              else:
                                  print(f"PR #{pr_number} reconciliation rejected: {reconciliation.get('reason')}")
                          except (OSError, ValueError, subprocess.CalledProcessError) as error:
                              print(f"PR #{pr_number} reconciliation evidence unavailable: {error}")
                      if len(recovered) == 1 and not merged_matches:
                          attributed.append(recovered[0])
                          range_prs.add(str(recovered[0]["number"]))
                          seen_reconciled_prs.add(recovered[0]["number"])
                          attributed_commits.add(commit_sha)
                          continue
                      if not recovered and len(merged_matches) == 1:
                          candidates = merged_matches
                      else:
                          provenance_complete = False
                  for candidate in candidates:
                      pr_number = candidate.get("number")
                      if (
                          not pr_number
                          or candidate.get("base", {}).get("ref") != "main"
                          or not candidate.get("merged_at")
                      ):
                          continue
                      range_prs.add(str(pr_number))
                      if pr_number in seen_reconciled_prs:
                          attributed_commits.add(commit_sha)
                          continue
                      pr = gh_api(f"/repos/{repo}/pulls/{pr_number}")
                      if not any(
                          is_deployable_path(path)
                          or is_production_activation_sensitive_path(path)
                          for path in actual_paths
                      ):
                          attributed_commits.add(commit_sha)
                          continue
                      declared_risk, declared_tier = parse_declaration(pr.get("body") or "")
                      landed_effects.append({
                          "number": pr_number,
                          "merged_at": pr.get("merged_at"),
                          **actual_effect,
                          "declared_risk": declared_risk,
                          "declared_tier": declared_tier,
                          "additive_confirmed": additive_confirmed(pr, actual_paths),
                      })
                      attributed_commits.add(commit_sha)
              attributed.extend(aggregate_landed_pr_effects(landed_effects))
              if not provenance_complete or not attributed:
                  emit("awaiting-activation", "unknown", "none", "incomplete merged PR provenance; fail closed")
                  sys.exit(0)
              if len(attributed_commits) != len(comparison.get("commits") or []):
                  emit("awaiting-activation", "unknown", "none", "incomplete commit-to-PR provenance; fail closed")
                  sys.exit(0)
              attributed.sort(
                  key=lambda pr: pr.get("merged_at")
                  or (pr.get("reconciliation_evidence") or {}).get("target_commit_at")
                  or "",
                  reverse=True,
              )
              provenance = classify_activation_provenance(attributed)
              if provenance.get("blocked"):
                  # Declaration understatement / attribution holds are protected
                  # activations: keep fail-closed (no auto), but open the same-run
                  # Founder Environment so exact-SHA activation can proceed.
                  approval_eligible = is_founder_approval_eligible(
                      {
                          "decision": "awaiting-activation",
                          "effective_tier": provenance.get("tier_name", "unknown"),
                          "reason": provenance["reason"],
                      },
                      protected_activation=bool(provenance.get("protected_activation")),
                  )
                  emit(
                      "awaiting-activation",
                      provenance.get("tier_name", "unknown"),
                      "multiple",
                      provenance["reason"],
                      approval_eligible,
                  )
                  sys.exit(0)
              if provenance.get("activation_class") == "control-plane-only":
                  emit("control-plane-verified", "none", "multiple", provenance["reason"])
                  sys.exit(0)
              machine_tier = provenance["tier_name"]
              pr_number = ",".join(str(pr["number"]) for pr in provenance["application_prs"])
              rollback_evidence = all(
                  has_rollback_evidence(
                      gh_api(f"/repos/{repo}/pulls/{pr['number']}").get("body") or ""
                  )
                  for pr in provenance["application_prs"]
              )
              print(
                  "T2 evidence: "
                  "ci_success=true "
                  f"rollback_evidence={str(rollback_evidence).lower()}"
              )
              declaration_risk = f"R{provenance['declared_risk']}"
              declaration_tier = f"T{provenance['declared_tier']}"

              # A dispatched release train is classified exactly like a scheduled one.
              classify_event = "schedule" if os.environ.get("PHASE") == "release-train" else os.environ["EVENT_NAME"]
              decision = decide_activation(
                  event_name=classify_event, deployable=True,
                  classifier_available=True, machine_validated=True,
                  machine_tier=machine_tier, declared_risk=declaration_risk,
                  declared_tier=declaration_tier,
                  protected_activation=bool(provenance.get("protected_activation")),
                  ci_success=True,
                  rollback_evidence=rollback_evidence,
              )
              approval_eligible = is_founder_approval_eligible(
                  decision,
                  protected_activation=bool(provenance.get("protected_activation")),
              )
              mode = decision["decision"]
              reason = decision["reason"]
              # Founder 1A (2026-10-07): a reviewer-gated range activates with no
              # human approval only when every merged PR is R0-R2 or carries a
              # Founder GO line. Any API error keeps the reviewer gate.
              go = {"ok": False, "missing": [], "reason": "not evaluated"}
              if mode == "auto" or (mode == "awaiting-activation" and approval_eligible):
                  try:
                      import importlib.util
                      import scripts.governance.autonomy_gate as target_gate
                      spec = importlib.util.spec_from_file_location(
                          "trusted_autonomy_gate", "trusted-policy/scripts/governance/autonomy_gate.py"
                      )
                      trusted = importlib.util.module_from_spec(spec)
                      spec.loader.exec_module(trusted)
                      # Both the deployed policy (a range never judges itself) and the target's
                      # (a merged policy fix takes effect at once) must accept the range.
                      results = [
                          gate.evaluate_founder_go_range(
                              repo=repo, base_sha=base, target_sha=target, api=gh_api,
                              graphql=lambda query: gh_api("graphql", "-f", f"query={query}"),
                          )
                          for gate in (trusted, target_gate)
                      ]
                      go = next((result for result in results if not result["ok"]), results[0])
                  except Exception as exc:
                      go = {"ok": False, "missing": [], "reason": f"Founder GO evidence unavailable ({type(exc).__name__})"}
                  print(f"Founder GO evidence: ok={go['ok']} {go['reason']}")
                  # Founder Q1 A (2026-10-08): a GO line is plain text any agent on the owner
                  # token can write, so it never replaces the reviewer for an awaiting-activation
                  # (R3) range; only R0-R2 ranges activate without a human (#3797).
              # Stop the line (#4363 review): after a failed, rolled-back, held or interrupted production
              # deploy, no range activates on its own until a reviewed deploy succeeds. Unknown = frozen.
              freeze_now = None
              if mode == "auto":
                  try:
                      import functools
                      import importlib.util
                      import scripts.governance.autonomy_gate as target_freeze_gate
                      spec = importlib.util.spec_from_file_location(
                          "trusted_freeze_gate", "trusted-policy/scripts/governance/autonomy_gate.py"
                      )
                      trusted_freeze_gate = importlib.util.module_from_spec(spec)
                      spec.loader.exec_module(trusted_freeze_gate)
                      # Deployed and target copies both judge, so a range cannot drop its own freeze (#4560 review);
                      # a deployed policy that predates the freeze has none to apply. One cached API view for both.
                      cached_api = functools.lru_cache(maxsize=None)(gh_api)
                      freeze_now = next((reason for reason in (
                          gate.deploy_freeze_reason(repo=repo, api=cached_api)
                          for gate in (trusted_freeze_gate, target_freeze_gate) if hasattr(gate, "deploy_freeze_reason")
                      ) if reason is not None), None)
                  except Exception as exc:
                      freeze_now = f"freeze state unavailable ({type(exc).__name__})"
                  if freeze_now is not None:
                      mode, reason, approval_eligible = "awaiting-activation", f"deploy freeze: {freeze_now}", True
                  print(f"Deploy freeze: {freeze_now or 'none'}")
              # Founder 2026-10-21（二）之二: a range held only because it is R3 activates through
              # production-auto. Both the deployed and the target policy must accept it; an old
              # deployed policy without the rule, or any error, keeps the Founder reviewer.
              r3 = {"ok": False, "reason": "not evaluated"}
              r3_review_prs = []
              # A range frozen above stays with the Founder reviewer; skip the second scan (#4560 review N5).
              if mode == "awaiting-activation" and approval_eligible and freeze_now is None:
                  try:
                      import importlib.util
                      import scripts.governance.autonomy_gate as target_r3_gate
                      spec = importlib.util.spec_from_file_location(
                          "trusted_r3_gate", "trusted-policy/scripts/governance/autonomy_gate.py"
                      )
                      trusted_r3_gate = importlib.util.module_from_spec(spec)
                      spec.loader.exec_module(trusted_r3_gate)
                      # Compensating controls for the removed click: final-head review and stop-the-line.
                      graphql = lambda query: gh_api("graphql", "-f", f"query={query}")
                      # Every PR in the range, control-plane ones too: an unreviewed workflow change rides
                      # the same range (adversarial review on #4359). Unattributed commits already hold.
                      r3_review_prs = sorted(range_prs | {str(pr["number"]) for pr in provenance["application_prs"]}, key=int)
                      review = target_r3_gate.final_head_review_evidence(
                          repo=repo, pr_numbers=r3_review_prs, api=gh_api, graphql=graphql,
                      )
                      freeze = target_r3_gate.deploy_freeze_reason(repo=repo, api=gh_api)
                      # auto-r3 needs a reversal the Rollback line actually names (#4359 review).
                      r3_rollback = all(
                          target_r3_gate.has_actionable_rollback(
                              gh_api(f"/repos/{repo}/pulls/{pr['number']}").get("body") or ""
                          )
                          for pr in provenance["application_prs"]
                      )
                      r3_results = [
                          gate.decide_r3_auto_activation(
                              attributed, event_name=classify_event,
                              rollback_evidence=r3_rollback, range_paths=range_paths,
                              review=review, freeze_reason=freeze, renamed=range_renamed,
                          )
                          for gate in (trusted_r3_gate, target_r3_gate)
                      ]
                      r3 = next((result for result in r3_results if not result["ok"]), r3_results[0])
                  except Exception as exc:
                      r3 = {"ok": False, "reason": f"R3 auto evidence unavailable ({type(exc).__name__})"}
                  print(f"R3 auto-activation evidence: ok={r3['ok']} {r3['reason']}")
                  if r3["ok"] is True:
                      mode, reason, approval_eligible = "auto-r3", r3["reason"], False
              emit(mode, decision["effective_tier"], pr_number, reason, approval_eligible)
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"go_evidence={'verified' if go['ok'] else 'missing'}\n")
                  output.write(f"go_reason={go['reason']}\n")
                  output.write(f"r3_evidence={'verified' if r3['ok'] is True else 'missing'}\n")
                  output.write(f"r3_review_prs={','.join(r3_review_prs) if r3['ok'] is True else ''}\n")
          except Exception as exc:
              # Keep fail-closed. Surface exception class so empty/truncated GitHub
              # JSON bodies are diagnosable without weakening approval eligibility.
              print(
                  f"activation classifier failed closed: {type(exc).__name__}: {exc}",
                  file=sys.stderr,
              )
              detail = f"{type(exc).__name__}"
              emit(
                  "awaiting-activation",
                  "unknown",
                  "none",
                  f"activation policy evaluation failed; fail closed ({detail})",
              )
          PY

  release-state:
    name: Release state
    needs: [resolve-target, detect-deployable, classify-activation]
    if: ${{ always() && needs.classify-activation.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Record explicit pre-deploy state
        env:
          MODE: ${{ needs.classify-activation.outputs.mode }}
          APPROVAL_ELIGIBLE: ${{ needs.classify-activation.outputs.approval_eligible }}
          REASON: ${{ needs.classify-activation.outputs.reason }}
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
          RELEASE_TRAIN: ${{ needs.resolve-target.outputs.release_train }}
          GO_EVIDENCE: ${{ needs.classify-activation.outputs.go_evidence }}
          GO_REASON: ${{ needs.classify-activation.outputs.go_reason }}
          R3_EVIDENCE: ${{ needs.classify-activation.outputs.r3_evidence }}
          PR_NUMBER: ${{ needs.classify-activation.outputs.pr_number }}
          TIER: ${{ needs.classify-activation.outputs.tier }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUNTIME_BASE_SHA: ${{ needs.detect-deployable.outputs.runtime_base_sha }}
          FLAG_CHANGES: ${{ needs.resolve-target.outputs.flag_changes }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Strip CR so empty/corrupt classifier outputs cannot fall through to
          # a misleading "Unknown release mode" when mode was actually set.
          MODE="${MODE//$'\r'/}"
          APPROVAL_ELIGIBLE="${APPROVAL_ELIGIBLE//$'\r'/}"
          REASON="${REASON//$'\r'/}"
          # Founder 1A: a release train without verified GO evidence keeps the Founder gate.
          if [[ "$RELEASE_TRAIN" == "true" && "$MODE" == "auto" && "$GO_EVIDENCE" != "verified" ]]; then
            MODE="awaiting-activation"; APPROVAL_ELIGIBLE="true"
          fi
          case "$MODE" in
            control-plane-verified)
              {
                echo "## state=control-plane-verified"
                echo "The merged control-plane revision is effective on main. No application runtime deployment is required or reported."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            no-op)
              echo "## state=merged (no-op)" >> "$GITHUB_STEP_SUMMARY"
              echo "No deployable runtime change was found." >> "$GITHUB_STEP_SUMMARY"
              ;;
            auto)
              {
                echo "## state=ready"
                echo "This state is not deployed. The validated reversible release may proceed to the executor."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            auto-founder-go)
              {
                echo "## state=ready (Founder GO verified)"
                echo "This state is not deployed. ${GO_REASON}; it activates through production-auto with no manual approval (Founder 1A)."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            auto-r3)
              if [[ "$R3_EVIDENCE" != "verified" ]]; then
                echo "## state=blocked" >> "$GITHUB_STEP_SUMMARY"
                echo "::error::auto-r3 without verified R3 evidence; fail closed." >&2
                exit 1
              fi
              # Audit trail (SLSA-style provenance): range, PRs, tier, evidence; the deploy job records the outcome.
              {
                echo "## state=ready (R3, no Founder click)"
                echo "This state is not deployed. It activates through production-auto with no manual approval (Founder 2026-10-21)."
                echo "- Range: \`${RUNTIME_BASE_SHA:-unknown}\`...\`${TARGET_SHA}\`"
                echo "- PRs: ${PR_NUMBER:-unknown}; tier: ${TIER:-unknown}; event: ${EVENT_NAME}; run: ${RUN_URL}"
                echo "- Evidence: ${REASON}"
                echo "- CI on the exact target SHA is re-checked by the deploy job before the executor; outcome is recorded in its summary (state=production-verified or the rollback summary)."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            awaiting-activation)
              if [[ "$APPROVAL_ELIGIBLE" != "true" ]]; then
                {
                  echo "## state=blocked"
                  echo "Production activation evidence is incomplete or invalid. No production SSH, migration, frontend build, or data mutation was executed."
                  echo "Reason: ${REASON}"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              if [[ "$RELEASE_TRAIN" != "true" ]]; then
                {
                  echo "## state=queued-for-release-train"
                  echo "Not deployed. Founder-gated changes (migration, data repair, identity/credential, control plane, or incomplete evidence) ride the next release train (12:17 and 18:17 Asia/Taipei; if GitHub drops the scheduled run, the next merge after the window starts it). While one is pending, later R0-R2 merges wait for that train too."
                  echo "Reason: ${REASON}"
                  echo "Founder GO evidence: ${GO_REASON:-unavailable}"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              {
                echo "## state=awaiting-approval"
                echo "This state is not deployed. The same workflow run is held by the production-activation Environment; no second dispatch is required."
                echo "Reason: ${REASON}"
                echo "Founder GO evidence: ${GO_REASON:-unavailable}"
                echo ""
                echo "### Release train: approving exactly \`${TARGET_SHA}\`"
                echo "Production now: \`${RUNTIME_BASE_SHA:-unknown}\`. Merged changes in this train (newest first):"
              } >> "$GITHUB_STEP_SUMMARY"
              if [[ "$RUNTIME_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && COMMITS="$(gh api "/repos/${REPO}/compare/${RUNTIME_BASE_SHA}...${TARGET_SHA}" \
                  --jq '(if .total_commits > (.commits | length) then "- (list truncated: \(.total_commits) commits, compare API returns the oldest \(.commits | length))" else empty end), ([.commits[] | (.commit.message | split("\n")[0] | gsub("`"; "\u0027"))] | reverse | .[:100] | .[] | "- `" + . + "`")')"; then
                printf '%s\n' "$COMMITS" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "- (commit list unavailable)" >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
            manual)
              {
                echo "## state=awaiting-approval"
                echo "This explicit exceptional operation remains Founder-controlled and is not deployed until its gate succeeds."
                echo "Requested feature-flag changes: ${FLAG_CHANGES:-none}"
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            ""|*)
              {
                echo "## state=blocked"
                echo "Classify produced empty or unknown mode; fail closed. No production SSH, migration, frontend build, or data mutation was executed."
                echo "mode=${MODE:-<empty>}"
                echo "Reason: ${REASON:-<empty>}"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Classify produced empty or unknown release mode; fail closed." >&2
              exit 1
              ;;
          esac

  # Starts the release train for a window (see the schedule comment). It runs in the schedule
  # run itself and, as the fallback for dropped or late cron runs, at the end of every merge's
  # own run whose range waits for a train. It only replaces the manual "Run workflow" click:
  # the dispatched run is an ordinary phase=release-train run, classified like a scheduled
  # one, and still stops at "Founder production approval".
  release-train-kick:
    name: Start release train
    needs: [resolve-target, classify-activation, release-state]
    if: ${{ always() && (github.event_name == 'schedule' || ((github.event_name == 'workflow_run' || github.event_name == 'repository_dispatch') && needs.resolve-target.result == 'success' && needs.resolve-target.outputs.release_train != 'true' && needs.release-state.result == 'success' && needs.classify-activation.outputs.mode == 'awaiting-activation')) }}
    permissions:
      actions: write # dispatch deploy.yml phase=release-train; no other write
      contents: read # compare tip vs window-serving train head_sha (supplemental kick)
    concurrency:
      group: alltrue-release-train-kick
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the window's release train unless one already ran
        env:
          TRAIN_WINDOWS_UTC: "04:17 10:17" # must match the schedule crons
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The latest window that has passed (before today's first, yesterday's last).
          NOW="$(date -u +%s)"; TODAY="$(date -u +%F)"; WINDOW=""
          for hm in $TRAIN_WINDOWS_UTC; do
            t="$(date -u -d "${TODAY} ${hm}" +%s)"
            if (( t <= NOW )); then WINDOW="$t"; fi
          done
          if [[ -z "$WINDOW" ]]; then
            WINDOW="$(date -u -d "$(date -u -d yesterday +%F) ${TRAIN_WINDOWS_UTC##* }" +%s)"
          fi
          SINCE="$(date -u -d "@${WINDOW}" +%Y-%m-%dT%H:%M:%SZ)"
          # Debounce: no train while one is queued or running, or any deploy run waits for approval.
          # Merge runs (workflow_run) are not counted: two finishing together would each skip.
          # Other dispatches (smoke, manual deploy) are not counted either: nothing kicks again when
          # they finish, so the window would be lost. A waiting run counts whatever started it.
          # Filter by status on the server: an old waiting run can sit beyond the newest 100 runs.
          PENDING=0
          for q in "status=waiting" "event=workflow_dispatch&status=queued" "event=workflow_dispatch&status=in_progress" \
            "event=workflow_dispatch&status=requested" "event=workflow_dispatch&status=pending"; do
            n="$(gh api "/repos/${REPO}/actions/workflows/deploy.yml/runs?${q}&per_page=100" \
              --jq "[.workflow_runs[] | select(.id != ${RUN_ID} and (.status == \"waiting\" or .display_title == \"Release train\"))] | length")"
            PENDING=$((PENDING + n))
          done
          if [[ "$PENDING" -ge 1 ]]; then
            echo "::notice::Release train: a train or approval is already pending; not dispatching another."
            exit 0
          fi
          # One train per window: a train since the window that asked for approval or deployed
          # used it. A train that stood down or found nothing to deploy does not count.
          # Supplemental exception: if main tip is ahead of every used train head_sha (tip
          # advanced after an earlier window deploy), allow another dispatch. Founder
          # production-activation still gates every train. Compare via API (no checkout).
          TIP="$(gh api "/repos/${REPO}/commits/main" --jq '.sha')"
          TRAINS="$(gh api "/repos/${REPO}/actions/workflows/deploy.yml/runs?event=workflow_dispatch&created=%3E%3D${SINCE}&per_page=100" \
            --jq '.workflow_runs[] | select(.display_title == "Release train") | .id')"
          for run in $TRAINS; do
            USED="$(gh api "/repos/${REPO}/actions/runs/${run}/jobs?per_page=100" \
              --jq '[.jobs[] | select((.name == "Founder production approval (same run)" or .name == "Deploy to Production") and .conclusion != "skipped")] | length')"
            if [[ "$USED" -ge 1 ]]; then
              head="$(gh api "/repos/${REPO}/actions/runs/${run}" --jq '.head_sha')"
              CMP="$(gh api "/repos/${REPO}/compare/${head}...${TIP}" --jq '.status')"
              if [[ "$CMP" == "identical" || "$CMP" == "behind" ]]; then
                echo "::notice::Release train: run ${run} already served the ${SINCE} window; the next window takes later merges."
                exit 0
              fi
              echo "::notice::Release train: run ${run} served ${SINCE} at ${head:0:8}, but tip ${TIP:0:8} is ${CMP}; checking supplemental dispatch."
            fi
          done
          gh api -X POST "/repos/${REPO}/actions/workflows/deploy.yml/dispatches" \
            -f ref=main -f 'inputs[phase]=release-train' -f 'inputs[confirm]=RELEASE_TRAIN' >/dev/null
          # Wait until the new run is listed so a queued kick behind this one sees it and stands down.
          for _ in $(seq 1 12); do
            SEEN="$(gh api "/repos/${REPO}/actions/workflows/deploy.yml/runs?event=workflow_dispatch&per_page=5" \
              --jq '[.workflow_runs[] | select(.status != "completed" and .display_title == "Release train")] | length')"
            if [[ "$SEEN" -ge 1 ]]; then break; fi
            sleep 5
          done
          echo "## Release train dispatched for the ${SINCE} window; it waits for Founder production approval like any train." >> "$GITHUB_STEP_SUMMARY"

  production-activation:
    name: Founder production approval (same run)
    needs: [resolve-target, detect-deployable, classify-activation]
    if: ${{ always() && needs.classify-activation.result == 'success' && ((needs.resolve-target.outputs.release_train == 'true' && ((needs.classify-activation.outputs.mode == 'auto' && needs.classify-activation.outputs.go_evidence != 'verified') || (needs.classify-activation.outputs.mode == 'awaiting-activation' && needs.classify-activation.outputs.approval_eligible == 'true'))) || (github.event_name == 'workflow_dispatch' && inputs.phase != 'release-train' && needs.classify-activation.outputs.mode == 'manual')) }}
    # Release train: a merge's own CI (github.event_name == 'workflow_run') and the
    # bot-merge follow-up (github.event_name == 'repository_dispatch') never open an
    # approval; R3 changes wait for the next train, which a schedule run (github.event_name == 'schedule')
    # or a merge run dispatches through release-train-kick,
    # or dispatched train, classified by the same PR classifier.
    # A newer exact-main target supersedes an older approval request. The
    # protected environment still requires the Founder reviewer; this only
    # prevents stale waiting runs from accumulating behind the live target.
    concurrency:
      group: alltrue-production-activation-gate
      cancel-in-progress: true
    environment:
      name: production-activation
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout target revision for gate policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-target.outputs.target_sha }}

      - name: Verify production environment protection
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PHASE: ${{ inputs.phase || 'application-deploy' }}
        run: |
          set -euo pipefail
          REPO="$REPO" GH_TOKEN="$GH_TOKEN" EVENT_NAME="$EVENT_NAME" PHASE="$PHASE" PYTHONPATH=. python3 - <<'PY'
          import json
          import os
          import subprocess

          from scripts.governance.autonomy_gate import environment_protection_is_valid

          repo = os.environ["REPO"]
          base = f"/repos/{repo}/environments/production-activation"

          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", path], text=True))

          environment = api(base)
          rules = environment.get("protection_rules") or []
          reviewers = [rule for rule in rules if rule.get("type") == "required_reviewers"]
          required_reviewers_configured = bool(reviewers)
          prevent_self_review = all(rule.get("prevent_self_review") is True for rule in reviewers) if reviewers else False
          event_name = os.environ["EVENT_NAME"]
          phase = os.environ.get("PHASE", "")
          if not environment_protection_is_valid(
              event_name=event_name,
              phase=phase,
              required_reviewers_configured=required_reviewers_configured,
              prevent_self_review=prevent_self_review,
          ):
              raise SystemExit(
                  "production environment protection is not configured: "
                  "protected activation events require the Founder required-reviewer gate, "
                  "self-review allowed, no admin bypass, and main-only deployment policy"
              )
          if environment.get("can_admins_bypass") is not False:
              raise SystemExit("production environment protection is not configured: administrator bypass must be disabled")

          branch_policy = environment.get("deployment_branch_policy") or {}
          if branch_policy.get("custom_branch_policies") is not True or branch_policy.get("protected_branches") is not False:
              raise SystemExit("production environment protection is not configured: custom main-only deployment policy required")
          policies = api(f"{base}/deployment-branch-policies").get("branch_policies") or []
          names = sorted(str(policy.get("name")) for policy in policies)
          if names != ["main"]:
              raise SystemExit(f"production environment protection is not configured: expected only main branch, got {names}")
          if event_name in {"workflow_run", "repository_dispatch"}:
              print("production-activation review boundary verified: required reviewer, self-review allowed, no admin bypass, main only")
          else:
              print("production-activation static Founder boundary verified: required reviewer, self-review allowed, no admin bypass, main only")
          PY

      - name: Require exact typed activation confirmation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PHASE: ${{ inputs.phase }}
          CAMPUS_ID: ${{ inputs.campus_id }}
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
          CONFIRM_INPUT: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "$PHASE" == "pop-bootstrap" && ! "$CAMPUS_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::POP bootstrap requires a positive numeric campus_id; no production action was executed."
            exit 1
          fi
          case "$PHASE" in
            application-deploy) EXPECTED="ACTIVATE_PRODUCTION:${TARGET_SHA}" ;;
            release-train) EXPECTED="RELEASE_TRAIN" ;;
            parent-portal-smoke) EXPECTED="VERIFY_PARENT_PORTAL:${TARGET_SHA}" ;;
            pop-bootstrap) EXPECTED="BOOTSTRAP_POP_MACHINE:${TARGET_SHA}:CAMPUS:${CAMPUS_ID}" ;;
            *) echo "::error::Unsupported activation phase; no production action was executed."; exit 1 ;;
          esac
          if [[ "$CONFIRM_INPUT" != "$EXPECTED" ]]; then
            echo "::error::Activation confirmation does not exactly match the selected phase; no production action was executed."
            exit 1
          fi
          echo "Founder activation confirmation accepted for ${PHASE} at exact SHA ${TARGET_SHA}."

      - name: Revalidate exact-main activation gate
        env:
          WORKFLOW_REF: ${{ github.ref }}
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
          RELEASE_TRAIN: ${{ needs.resolve-target.outputs.release_train }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "/repos/${REPO}/git/ref/heads/main" --jq '.object.sha')"
          # Release train: main may move while the approval waits; the approved target
          # stays valid while main still contains it (compare TARGET...main is ahead/identical).
          IN_MAIN=""
          if [[ "$RELEASE_TRAIN" == "true" ]]; then
            IN_MAIN="$(gh api "/repos/${REPO}/compare/${TARGET_SHA}...${MAIN_SHA}" --jq '.status')"
          fi
          CI_RUNS="$(gh api "/repos/${REPO}/actions/workflows/ci.yml/runs?branch=main&head_sha=${TARGET_SHA}&status=completed&per_page=100")"
          CI_OK="$(CI_RUNS="$CI_RUNS" python3 - <<'PY'
          import json
          import os

          runs = json.loads(os.environ["CI_RUNS"]).get("workflow_runs", [])
          print(any(run.get("name") == "CI — PHPUnit Tests" and run.get("conclusion") == "success" for run in runs))
          PY
          )"
          POLICY_RESULT="$(PYTHONPATH=. WORKFLOW_REF="$WORKFLOW_REF" TARGET_SHA="$TARGET_SHA" MAIN_SHA="$MAIN_SHA" CI_OK="$CI_OK" IN_MAIN="$IN_MAIN" RELEASE_TRAIN="$RELEASE_TRAIN" python3 - <<'PY'
          import os
          from scripts.governance.autonomy_gate import decide_manual_activation

          result = decide_manual_activation(
              workflow_ref=os.environ["WORKFLOW_REF"],
              target_sha=os.environ["TARGET_SHA"],
              current_main_sha=os.environ["MAIN_SHA"],
              ci_success=os.environ["CI_OK"] == "True",
              founder_gate_reached=True,
              release_train=os.environ.get("RELEASE_TRAIN") == "true",
              target_in_main=os.environ.get("IN_MAIN") in {"ahead", "identical"},
          )
          print(result["decision"])
          if result["decision"] != "activation-gate-reached":
              raise SystemExit(result["reason"])
          PY
          )"
          echo "Manual activation policy result: ${POLICY_RESULT}"

      - name: Record approved activation state
        run: |
          {
            echo "## state=approved"
            echo "Founder/environment approval completed for this exact target; production side effects have not yet been reported as deployed."
          } >> "$GITHUB_STEP_SUMMARY"

  production-auto:
    name: Evidence-gated production activation (no reviewer)
    needs: [resolve-target, detect-deployable, classify-activation]
    # Founder 1A (2026-10-07): replaces the manual approve only when classify verified that
    # every merged PR in the production...target range is R0-R2 or carries a Founder GO line, or
    # (Founder 2026-10-21) for an R3 range with complete classifier evidence (auto-r3). Else: reviewer.
    if: ${{ always() && needs.classify-activation.result == 'success' && ((needs.classify-activation.outputs.go_evidence == 'verified' && (needs.classify-activation.outputs.mode == 'auto-founder-go' || (needs.classify-activation.outputs.mode == 'auto' && needs.resolve-target.outputs.release_train == 'true'))) || (needs.classify-activation.outputs.mode == 'auto-r3' && needs.classify-activation.outputs.r3_evidence == 'verified')) }}
    environment:
      name: production-auto
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout deployed revision for trusted gate policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect-deployable.outputs.runtime_base_sha }}
          path: trusted-policy
          sparse-checkout: scripts/governance

      - name: Verify production-auto environment and Founder GO evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PHASE: ${{ inputs.phase || '' }}
          MODE: ${{ needs.classify-activation.outputs.mode }}
          GO_EVIDENCE: ${{ needs.classify-activation.outputs.mode == 'auto-r3' && needs.classify-activation.outputs.r3_evidence || needs.classify-activation.outputs.go_evidence }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          import subprocess

          spec = importlib.util.spec_from_file_location("trusted_autonomy_gate", "trusted-policy/scripts/governance/autonomy_gate.py")
          trusted = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(trusted)
          auto_environment_is_valid = trusted.auto_environment_is_valid

          base = f"/repos/{os.environ['REPO']}/environments/production-auto"

          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", path], text=True))

          policy = api(base).get("deployment_branch_policy") or {}
          names = sorted(str(p.get("name")) for p in api(f"{base}/deployment-branch-policies").get("branch_policies") or [])
          if policy.get("custom_branch_policies") is not True or policy.get("protected_branches") is not False or not auto_environment_is_valid(
              event_name=os.environ["EVENT_NAME"], phase=os.environ["PHASE"],
              mode=os.environ["MODE"], go_evidence=os.environ["GO_EVIDENCE"], branch_names=names,
          ):
              raise SystemExit(f"production-auto refused: main-only policy and verified GO/R3 evidence required (branches={names})")
          print(f"production-auto verified: main-only environment, {os.environ['MODE']} evidence verified")
          PY

  deploy:
    name: Deploy to Production
    needs: [resolve-target, detect-deployable, classify-activation, production-activation, production-auto]
    if: ${{ always() && inputs.phase != 'pop-bootstrap' && inputs.phase != 'parent-portal-smoke' && needs.resolve-target.result == 'success' && needs.detect-deployable.result == 'success' && needs.classify-activation.result == 'success' && needs.detect-deployable.outputs.deployable == 'true' && ((needs.classify-activation.outputs.mode == 'auto' && needs.resolve-target.outputs.release_train != 'true') || ((needs.classify-activation.outputs.mode == 'auto-founder-go' || (needs.classify-activation.outputs.mode == 'auto' && needs.resolve-target.outputs.release_train == 'true')) && needs.classify-activation.outputs.go_evidence == 'verified' && needs.production-auto.result == 'success') || (needs.classify-activation.outputs.mode == 'auto-r3' && needs.classify-activation.outputs.r3_evidence == 'verified' && needs.production-auto.result == 'success') || ((needs.classify-activation.outputs.mode == 'manual' || (needs.classify-activation.outputs.mode == 'auto' && needs.resolve-target.outputs.release_train == 'true') || (needs.classify-activation.outputs.mode == 'awaiting-activation' && needs.classify-activation.outputs.approval_eligible == 'true')) && needs.production-activation.result == 'success')) }}
    # Production credentials remain on the ephemeral GitHub-hosted runner.
    runs-on: ubuntu-latest
    environment: production-ssh
    # Bound the sole production executor so a lost SSH session cannot leave a
    # run waiting indefinitely. The remote script retains its existing
    # rollback-on-error behavior before this runner-level deadline. The 20-minute
    # post-deploy watch (gap #3) runs inside the same executor, so the bound is
    # deploy (~3-15 min) + verify/smoke (~3 min) + watch (20 min) + a full rollback (~15 min) + margin.
    timeout-minutes: 80
    outputs:
      rc: ${{ steps.deploy.outputs.rc }}
    # Serialize only the side-effecting executor. Read-only preflight and
    # activation classification must remain schedulable when an old deploy is
    # pending in GitHub's queue.
    concurrency:
      # This namespace was rotated after a stale GitHub Actions pending lock
      # stranded the bootstrap activation. Keep it shared with every guarded
      # production side-effect workflow and non-cancelling.
      group: alltrue-production-side-effects-v2
      cancel-in-progress: false
      queue: max

    steps:
      # Founder 1A: without a reviewer, re-verify the GO evidence right before any
      # production side effect, under both the deployed and the target policy.
      # auto-r3 carries no GO text; its freeze and final-head review are re-checked instead (after the
      # executor slot is held, #4359 review), plus the exact-main CI gate below.
      - name: Checkout target gate policy for Founder GO recheck
        if: ${{ needs.production-auto.result == 'success' || needs.classify-activation.outputs.mode == 'auto' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-target.outputs.target_sha }}
          path: gate-target
          sparse-checkout: scripts/governance
      - name: Checkout deployed gate policy for Founder GO recheck
        if: ${{ needs.production-auto.result == 'success' || needs.classify-activation.outputs.mode == 'auto' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect-deployable.outputs.runtime_base_sha }}
          path: gate-trusted
          sparse-checkout: scripts/governance
      - name: Recheck Founder GO evidence before production side effects
        if: ${{ needs.production-auto.result == 'success' && needs.classify-activation.outputs.mode != 'auto-r3' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ needs.detect-deployable.outputs.runtime_base_sha }}
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          import subprocess

          def api(path, *extra):
              return json.loads(subprocess.check_output(["gh", "api", path, *extra], text=True))

          for root in ("gate-trusted", "gate-target"):
              spec = importlib.util.spec_from_file_location(f"{root}_gate", f"{root}/scripts/governance/autonomy_gate.py")
              gate = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(gate)
              go = gate.evaluate_founder_go_range(
                  repo=os.environ["REPO"], base_sha=os.environ["BASE_SHA"], target_sha=os.environ["TARGET_SHA"],
                  api=api, graphql=lambda query: api("graphql", "-f", f"query={query}"),
              )
              if not go["ok"]:
                  raise SystemExit(f"Founder GO evidence no longer holds ({root}): {go['reason']}; nothing deployed")
          print("Founder GO evidence re-verified under the deployed and target policy")
          PY
      - name: Recheck R3 auto controls before production side effects
        if: ${{ needs.production-auto.result == 'success' && needs.classify-activation.outputs.mode == 'auto-r3' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBERS: ${{ needs.classify-activation.outputs.r3_review_prs }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          import subprocess

          def api(path, *extra):
              return json.loads(subprocess.check_output(["gh", "api", path, *extra], text=True))

          # An older executor run may have failed while this one waited in the queue.
          numbers = [n for n in os.environ["PR_NUMBERS"].split(",") if n.strip()]
          if not numbers:
              raise SystemExit("auto-r3 without PR numbers; nothing deployed")
          for root in ("gate-trusted", "gate-target"):
              spec = importlib.util.spec_from_file_location(f"{root}_gate", f"{root}/scripts/governance/autonomy_gate.py")
              gate = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(gate)
              freeze = gate.deploy_freeze_reason(repo=os.environ["REPO"], api=api)
              if freeze is not None:
                  raise SystemExit(f"deploy freeze since classification ({root}): {freeze}; nothing deployed")
              review = gate.final_head_review_evidence(
                  repo=os.environ["REPO"], pr_numbers=numbers, api=api,
                  graphql=lambda query: api("graphql", "-f", f"query={query}"),
              )
              if review.get("ok") is not True:
                  raise SystemExit(f"final-head review no longer holds ({root}): {review.get('reason')}; nothing deployed")
          print("R3 freeze and final-head review re-verified under the deployed and target policy")
          PY
      - name: Recheck the deploy freeze before an unattended deploy
        # #4560 review: a run classified while an earlier deploy was still in its 20-minute watch saw no
        # freeze; that deploy may have failed or rolled back while this one waited for the executor slot.
        if: ${{ needs.classify-activation.outputs.mode == 'auto' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          import subprocess

          def api(path, *extra):
              return json.loads(subprocess.check_output(["gh", "api", path, *extra], text=True))

          for root in ("gate-trusted", "gate-target"):
              spec = importlib.util.spec_from_file_location(f"{root}_freeze", f"{root}/scripts/governance/autonomy_gate.py")
              gate = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(gate)
              if not hasattr(gate, "deploy_freeze_reason"):
                  continue  # a deployed policy older than the freeze has none to apply
              freeze = gate.deploy_freeze_reason(repo=os.environ["REPO"], api=api)
              if freeze is not None:
                  raise SystemExit(f"deploy freeze since classification ({root}): {freeze}; nothing deployed")
          print("Deploy freeze re-checked under the deployed and target policy: none")
          PY
      - name: Checkout pinned SSH trust helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/production-ssh-trust
            scripts/production-deploy/pi-remote-deploy.sh
            scripts/production-deploy/render_pi_remote_deploy.py
          sparse-checkout-cone-mode: false
      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Final exact-main gate before production executor
        env:
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
          RELEASE_TRAIN: ${{ needs.resolve-target.outputs.release_train }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "/repos/${REPO}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$RELEASE_TRAIN" == "true" ]]; then
            IN_MAIN="$(gh api "/repos/${REPO}/compare/${TARGET_SHA}...${MAIN_SHA}" --jq '.status')"
            if [[ "$IN_MAIN" != "ahead" && "$IN_MAIN" != "identical" ]]; then
              echo "::error::Release train refused target ${TARGET_SHA}: main ${MAIN_SHA} no longer contains it (${IN_MAIN})."
              exit 1
            fi
          elif [[ "$TARGET_SHA" != "$MAIN_SHA" ]]; then
            echo "::error::Production executor refused stale target ${TARGET_SHA}; current main is ${MAIN_SHA}."
            exit 1
          fi
          CI_RUNS="$(gh api "/repos/${REPO}/actions/workflows/ci.yml/runs?branch=main&head_sha=${TARGET_SHA}&status=completed&per_page=100")"
          CI_OK="$(CI_RUNS="$CI_RUNS" python3 - <<'PY'
          import json
          import os

          runs = json.loads(os.environ["CI_RUNS"]).get("workflow_runs", [])
          print(any(run.get("name") == "CI — PHPUnit Tests" and run.get("conclusion") == "success" for run in runs))
          PY
          )"
          [[ "$CI_OK" == "True" ]] || {
            echo "::error::Production executor refused target without successful exact-main CI."
            exit 1
          }
          echo "Final exact-main gate passed for ${TARGET_SHA}."

      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -l -f ~/.ssh/deploy_key

      # Post-deploy watch (gap #3): after verify + smoke pass, the [6/7] gate keeps watching for
      # 20 min (health + deployment.json identity every 30 s, 4 consecutive failures = breach; a
      # Sentry error-count spike vs the pre-deploy hour when the secret SENTRY_WATCH is set to
      # "<org>/<project> <read-only token>"). A breach takes the same rollback-or-hold
      # decision as a failed verify, so the rollback stays this executor's rollback_deploy.
      - name: Deploy
        id: deploy
        # The remote script is scripts/production-deploy/pi-remote-deploy.sh from the same commit as this
        # workflow file (the checkout above). Its former ${{ }} values come in through env: and are
        # substituted as plain text, so the Pi receives the same bytes as the old inline heredoc,
        # and this block stays far below GitHub's 21,000-byte expression limit (#4051).
        env:
          DEPLOY_PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          DEPLOY_PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          DEPLOY_TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
          DEPLOY_RELEASE_TRAIN: ${{ needs.resolve-target.outputs.release_train }}
          DEPLOY_ADMISSIONS_FUNNEL_V1: ${{ inputs.admissions_funnel_v1 }}
          DEPLOY_COURSE_SESSION_CALENDAR_V1: ${{ inputs.course_session_calendar_v1 }}
          DEPLOY_COURSE_MANAGER_V1: ${{ inputs.course_manager_v1 }}
          DEPLOY_POP_INAPP_STANDING_POLICY: ${{ inputs.pop_inapp_standing_policy }}
          DEPLOY_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          DEPLOY_SMOKE_TEACHER_LOGIN: ${{ secrets.SMOKE_TEACHER_LOGIN }}
          DEPLOY_SMOKE_TEACHER_PASSWORD: ${{ secrets.SMOKE_TEACHER_PASSWORD }}
          DEPLOY_SMOKE_BRANCH_ID: ${{ secrets.SMOKE_BRANCH_ID }}
          DEPLOY_SENTRY_WATCH: ${{ secrets.SENTRY_WATCH }}
        run: |
          rc=0
          remote_script="$(umask 077 && mktemp "${RUNNER_TEMP}/pi-remote-deploy.XXXXXX")"
          trap 'rm -f "$remote_script"' EXIT
          # Fails the step (bash -e) before ssh when the template is missing or malformed.
          python3 -I scripts/production-deploy/render_pi_remote_deploy.py scripts/production-deploy/pi-remote-deploy.sh > "$remote_script"
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o IdentitiesOnly=yes \
            "${DEPLOY_PI_SSH_USER}@${DEPLOY_PI_SSH_HOST}" < "$remote_script" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # Post-deploy safety net (Founder 2026-10-14). The executor above already
      # verified health + deployment.json identity with bounded retries and, on
      # failure, rolled back through its reviewed rollback_deploy (exit 10/11) or,
      # when the range has a migration that is not additive-only, held without
      # any rollback (exit 12/13).
      # These steps add an independent read-only check from outside the Pi and a
      # loud summary; they open no new path into production.
      - name: Checkout post-deploy verifier
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-target.outputs.target_sha }}
          path: post-deploy-verify
          persist-credentials: false
          sparse-checkout: |
            scripts/post-deploy-verify.py
          sparse-checkout-cone-mode: false

      - name: Verify production independently from the runner
        id: runner_verify
        env:
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
        run: |
          python3 post-deploy-verify/scripts/post-deploy-verify.py verify \
            --health-path /api/health --health-path /api/v1/health \
            --expect-backend-sha "$TARGET_SHA" --attempts 12 --interval 5

      - name: Record deployed and production-verified state
        run: |
          {
            echo "## state=deployed"
            echo "Exact target SHA was activated by the sole production executor."
            echo ""
            echo "## state=production-verified"
            echo "The executor returned success only after deployment identity, health, and post-merge smoke verification passed,"
            echo "and the runner re-checked /api/health, /api/v1/health and the deployment.json manifest (backend_sha) from outside the Pi."
            echo ""
            echo "## post-deploy watch"
            echo "20-minute watch passed: health + deployment.json identity every 30 s, no 4 consecutive failures."
            # The runner cannot see whether the Sentry query actually ran (#4363 review): point at the executor's own lines.
            echo "Sentry error-count check: result is in the Deploy log (\`post-deploy watch:\` lines); not evaluated here."
          } >> "$GITHUB_STEP_SUMMARY"

      # Read-only GitHub token for the in-app resolve evidence (#4565), from the production-ssh secret
      # POP_INAPP_GITHUB_TOKEN: sent over stdin (never argv, never printed) to storage/app/private, which
      # deploy-storage-perms.sh never widens; mode 640 with the storage group, so the web worker can read it
      # where it can write storage. No secret removes the file (back to anonymous reads, 60 calls an hour).
      # Runs only after production is verified, and never fails the deploy job: the resolve evidence
      # itself requires that job to succeed.
      - name: Install the POP GitHub read token
        continue-on-error: true
        env:
          DEPLOY_PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          DEPLOY_PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          POP_GITHUB_READ_TOKEN: ${{ secrets.POP_INAPP_GITHUB_TOKEN }}
        run: |
          pi() { ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            "${DEPLOY_PI_SSH_USER}@${DEPLOY_PI_SSH_HOST}" "set -eu; d=/home/admin/backend/storage/app/private; f=\"\$d/pop-github-read-token\"; $1"; }
          if [ -z "$POP_GITHUB_READ_TOKEN" ]; then
            pi 'rm -f "$f"'
            echo "no POP_INAPP_GITHUB_TOKEN: token file removed"
            exit 0
          fi
          if ! [[ "$POP_GITHUB_READ_TOKEN" =~ ^[A-Za-z0-9_]{20,255}$ ]]; then
            echo "::warning::POP_INAPP_GITHUB_TOKEN is not a GitHub token; not installed"
            exit 1
          fi
          printf '%s' "$POP_GITHUB_READ_TOKEN" | pi '
            test ! -L "$d"; test ! -L "$f"
            t="$(umask 077 && mktemp "$d/.pop-github-read-token.XXXXXX")"; cat > "$t"
            chgrp "$(stat -c %g /home/admin/backend/storage)" "$t" 2>/dev/null && chmod 640 "$t"
            mv -f "$t" "$f"'
          echo "POP GitHub read token installed"

      - name: Summarize production verification failure
        if: ${{ failure() && steps.deploy.outcome != 'skipped' }}
        env:
          RC: ${{ steps.deploy.outputs.rc }}
          RUNNER_VERIFY: ${{ steps.runner_verify.outcome }}
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
          PREVIOUS_SHA: ${{ needs.detect-deployable.outputs.runtime_base_sha }}
        run: |
          set -euo pipefail
          if [ ! -f post-deploy-verify/scripts/post-deploy-verify.py ]; then
            echo "::error title=Production deploy not verified::executor rc=${RC:-unknown}, runner verify=${RUNNER_VERIFY}; verifier checkout failed. Check /api/health and deployment.json now."
            exit 1
          fi
          summary="$(python3 post-deploy-verify/scripts/post-deploy-verify.py summarize \
            --rc "${RC:-1}" --target-sha "$TARGET_SHA" --previous-sha "$PREVIOUS_SHA" --runner-verify "$RUNNER_VERIFY")"
          printf '%s\n' "$summary" >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Production deploy not verified::$(printf '%s' "$summary" | tail -n 1)"

  # Gap #3: a failed production executor (rollback, rollback failure, hold, lost SSH, or the
  # runner re-check failing) opens or appends ONE incident issue. IDs and SHAs only, no PII.
  # The freeze needs no extra marker: the failed "Deploy to Production" job is what the
  # deploy-freeze check (autonomy_gate.deploy_freeze_reason, #4359) reads.
  deploy-incident:
    name: Record production deploy incident
    needs: [resolve-target, detect-deployable, deploy]
    # A timeout or cancel ends the job as 'cancelled', possibly before rc is written (#4363 review).
    if: ${{ always() && (needs.deploy.result == 'failure' || needs.deploy.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      # The default branch's summarizer, never the failing release's copy, runs next to an issues:write token.
      - name: Checkout incident summarizer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/post-deploy-verify.py
          sparse-checkout-cone-mode: false

      - name: Open or append the deploy incident issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RC: ${{ needs.deploy.outputs.rc }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
          PREVIOUS_SHA: ${{ needs.detect-deployable.outputs.runtime_base_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Production deploy incident (deploy.yml)"
          # Failed before the executor step (stale target, GO/R3 recheck, SSH setup): nothing reached the Pi.
          # Only positive proof (the Deploy step concluded skipped) suppresses the incident; unknown reports it.
          skipped="$(gh api "repos/${REPO}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "Deploy to Production") | .steps[]? | select(.name == "Deploy" and .conclusion == "skipped")] | length')" \
            || skipped="unknown"
          if [ "$skipped" = "1" ] && ! [[ "$RC" =~ ^[0-9]+$ ]]; then
            echo "Deploy step never ran; production untouched, no incident."
            exit 0
          fi
          if [[ "$RC" =~ ^[0-9]+$ ]]; then
            body="$(python3 -I scripts/post-deploy-verify.py summarize --rc "$RC" --target-sha "$TARGET_SHA" \
              --previous-sha "$PREVIOUS_SHA" --runner-verify failure)"
          else
            RC="unknown"
            body="Executor result UNKNOWN: the Deploy job ended ${DEPLOY_RESULT} before reporting an exit code (timeout or cancel). Production may be on ${TARGET_SHA} or ${PREVIOUS_SHA}; check deployment.json before any further deploy."
          fi
          body="$(printf '%s\n\nRun: %s\nExecutor rc: %s\nRelease auto-activation is frozen until a reviewed deploy succeeds (RULEBOOK D8).\n' \
            "$body" "$RUN_URL" "$RC")"
          existing="$(gh api -X GET search/issues -f q="repo:${REPO} is:issue is:open in:title \"${title}\"" \
            --jq "[.items[] | select(.title == \"${title}\")][0].number // empty")"
          if [ -n "$existing" ]; then
            gh api "repos/${REPO}/issues/${existing}/comments" -f body="$body" --jq .html_url
          else
            gh api "repos/${REPO}/issues" -f title="$title" -f body="$body" --jq .html_url
          fi

  parent-portal-smoke:
    name: Authenticated Parent Portal production smoke
    needs: [resolve-target, detect-deployable, classify-activation, production-activation]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.phase == 'parent-portal-smoke' && needs.resolve-target.result == 'success' && needs.detect-deployable.result == 'success' && needs.classify-activation.result == 'success' && needs.classify-activation.outputs.mode == 'manual' && needs.production-activation.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production-ssh
    timeout-minutes: 30
    concurrency:
      group: alltrue-production-side-effects-v2
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout exact smoke revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-target.outputs.target_sha }}

      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}

      - name: Provision/reuse synthetic fixture through canonical QA path
        id: fixture
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          BASE_URL: https://daan.lifenet.com.tw
          WORKFLOW_REVISION: ${{ needs.resolve-target.outputs.target_sha }}
          PRODUCTION_RUNTIME_SHA: ${{ needs.detect-deployable.outputs.runtime_base_sha }}
          EXPECTED_DEPLOYED_APPLICATION_SHA: ${{ needs.detect-deployable.outputs.expected_deployed_application_sha }}
          PROVENANCE_STATE: ${{ needs.detect-deployable.outputs.runtime_state }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/parent-portal-smoke-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s' "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > "$ssh_dir/deploy_key"
          chmod 600 "$ssh_dir/deploy_key"
          trap 'rm -f "$ssh_dir/deploy_key"' EXIT

          manifest="$(curl -fsSL --proto '=https' --tlsv1.2 "$BASE_URL/deployment.json")"
          manifest_sha="$(printf '%s' "$manifest" | python3 -c 'import json,sys; print(json.load(sys.stdin)["backend_sha"])')"
          test "$PROVENANCE_STATE" = "parent-portal-safe"
          test "$manifest_sha" = "$PRODUCTION_RUNTIME_SHA" || {
            echo "::error::production runtime SHA drifted: manifest=$manifest_sha expected_runtime=$PRODUCTION_RUNTIME_SHA"
            exit 1
          }
          test "$EXPECTED_DEPLOYED_APPLICATION_SHA" = "$PRODUCTION_RUNTIME_SHA" || {
            echo "::error::canonical application deployment provenance does not match production runtime"
            exit 1
          }
          {
            echo "## Parent Portal smoke provenance"
            echo ""
            echo "- workflow revision: \`$WORKFLOW_REVISION\`"
            echo "- production runtime SHA: \`$PRODUCTION_RUNTIME_SHA\`"
            echo "- expected deployed application SHA: \`$EXPECTED_DEPLOYED_APPLICATION_SHA\`"
            echo "- provenance decision: \`$PROVENANCE_STATE\`"
          } >> "$GITHUB_STEP_SUMMARY"

          fetch_admin_token() {
            ssh -i "$ssh_dir/deploy_key" \
              -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$PI_SSH_USER@$PI_SSH_HOST" 'cd /home/admin/backend && php artisan tinker --no-ansi --execute='\''$row = \Illuminate\Support\Facades\DB::table("auth_tokens as t")->join("User as u","u.id","=","t.user_id")->where("u.type","S")->where("t.expires_at",">",now())->orderByDesc("t.expires_at")->select("t.token")->first(); if (!$row) { throw new \RuntimeException("no valid super admin session"); } echo $row->token;'\'''
          }

          admin_token="$(fetch_admin_token)"
          test -n "$admin_token"
          echo "::add-mask::$admin_token"
          qa_session() {
            local attempt="$1"
            local response_file="$RUNNER_TEMP/parent-fixture-${attempt}.json"
            local status
            local curl_status

            set +e
            status="$(curl -sS --proto '=https' --tlsv1.2 \
              -o "$response_file" -w '%{http_code}' \
              -H "Authorization: Bearer $admin_token" \
              -H 'Accept: application/json' \
              -X POST "$BASE_URL/api/v1/admin/qa/parent-fixture/session")"
            curl_status=$?
            set -e

            if [[ "$curl_status" -ne 0 || "$status" != 2?? ]]; then
              local body
              body="$(sed -e 's/[[:space:]]\+$//' "$response_file" 2>/dev/null || true)"
              {
                echo "## Parent Portal fixture response ($attempt)"
                echo ""
                echo "- HTTP status: \`$status\`"
                echo "- curl exit: \`$curl_status\`"
                echo "- response body: \`$body\`"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::canonical parent fixture attempt=$attempt HTTP=$status curl_exit=$curl_status body=$body" >&2
              return 1
            fi

            cat "$response_file"
          }

          first="$(qa_session first)"
          second="$(qa_session second)"
          summary="$(FIRST="$first" SECOND="$second" python3 - <<'PY'
          import base64, json, os, re

          first = json.loads(os.environ["FIRST"])
          second = json.loads(os.environ["SECOND"])
          f = first["fixture"]
          s = second["fixture"]
          required = ("campus_id", "student_id", "guardian_id", "student_guardian_id")
          if any(key not in f for key in required):
              raise SystemExit("fixture response missing required IDs")
          if any(f[key] != s[key] for key in required):
              raise SystemExit("repeated fixture run changed canonical IDs")
          if f.get("is_test") is not True:
              raise SystemExit("fixture campus is not marked is_test")
          token = str(second["session"]["token"])
          if not re.fullmatch(r"[A-Za-z0-9]{48}", token):
              raise SystemExit("fixture session token shape was unexpected")
          print(json.dumps({
              "campus_id": int(f["campus_id"]),
              "student_id": int(f["student_id"]),
              "guardian_id": int(f["guardian_id"]),
              "student_guardian_id": int(f["student_guardian_id"]),
              "parent_session_id": int(second["session"]["parent_session_id"]),
              "session_b64": base64.b64encode(token.encode()).decode(),
          }))
          PY
          )"
          campus_id="$(printf '%s' "$summary" | python3 -c 'import json,sys; print(json.load(sys.stdin)["campus_id"])')"
          student_id="$(printf '%s' "$summary" | python3 -c 'import json,sys; print(json.load(sys.stdin)["student_id"])')"
          guardian_id="$(printf '%s' "$summary" | python3 -c 'import json,sys; print(json.load(sys.stdin)["guardian_id"])')"
          student_guardian_id="$(printf '%s' "$summary" | python3 -c 'import json,sys; print(json.load(sys.stdin)["student_guardian_id"])')"
          parent_session_id="$(printf '%s' "$summary" | python3 -c 'import json,sys; print(json.load(sys.stdin)["parent_session_id"])')"
          session_b64="$(printf '%s' "$summary" | python3 -c 'import json,sys; print(json.load(sys.stdin)["session_b64"])')"
          parent_token="$(printf '%s' "$session_b64" | base64 -d)"
          echo "::add-mask::$parent_token"
          printf 'SMOKE_PARENT_SESSION_B64=%s\n' "$session_b64" >> "$GITHUB_ENV"
          {
            echo "## Synthetic Parent Portal fixture"
            echo ""
            echo "- runtime SHA: \`$manifest_sha\`"
            echo "- campus_id: \`$campus_id\`"
            echo "- student_id: \`$student_id\`"
            echo "- guardian_id: \`$guardian_id\`"
            echo "- student_guardian_id: \`$student_guardian_id\`"
            echo "- parent_session_id: \`$parent_session_id\` (previous fixture session revoked by canonical service)"
            echo "- repeated run: same campus/student/guardian/link IDs"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Synthetic Parent Portal fixture IDs: campus_id=$campus_id student_id=$student_id guardian_id=$guardian_id student_guardian_id=$student_guardian_id parent_session_id=$parent_session_id"

          branches="$(curl -fsSL --proto '=https' --tlsv1.2 "$BASE_URL/api/v1/branches")"
          students_status="$(curl -sS --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/parent-students.json" -w '%{http_code}' -H "Authorization: Bearer $admin_token" "$BASE_URL/api/v1/students?per_page=all")"
          test "$students_status" = 200 || { echo "::error::staff student selector returned HTTP $students_status"; exit 1; }
          parent_binding_status="$(curl -sS --proto '=https' --tlsv1.2 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $parent_token" "$BASE_URL/api/v1/bindings")"
          test "$parent_binding_status" = 401 || { echo "::error::parent token reached binding management with HTTP $parent_binding_status"; exit 1; }
          admin_binding_status="$(curl -sS --proto '=https' --tlsv1.2 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $admin_token" "$BASE_URL/api/v1/bindings")"
          test "$admin_binding_status" = 200 || { echo "::error::super_admin binding read returned HTTP $admin_binding_status"; exit 1; }
          qa_parent_status="$(curl -sS --proto '=https' --tlsv1.2 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $parent_token" -X POST "$BASE_URL/api/v1/admin/qa/parent-fixture/session")"
          test "$qa_parent_status" = 401 || { echo "::error::parent token reached QA fixture path with HTTP $qa_parent_status"; exit 1; }
          CAMPUS_ID="$campus_id" STUDENT_ID="$student_id" BRANCHES="$branches" STUDENTS_FILE="$RUNNER_TEMP/parent-students.json" python3 - <<'PY'
          import json, os
          campus_id = int(os.environ["CAMPUS_ID"])
          student_id = int(os.environ["STUDENT_ID"])
          branches = json.loads(os.environ["BRANCHES"])
          with open(os.environ["STUDENTS_FILE"], encoding="utf-8") as handle:
              students = json.load(handle)
          rows = students.get("data", students) if isinstance(students, dict) else students
          if campus_id in [int(row.get("id", 0)) for row in branches]:
              raise SystemExit("synthetic campus leaked into public campus selector")
          if student_id in [int(row.get("id", 0)) for row in rows]:
              raise SystemExit("synthetic student leaked into staff student selector")
          print("normal campus/student selectors exclude synthetic fixture")
          PY
          {
            echo "- parent session → /api/v1/bindings: HTTP $parent_binding_status (expected 401)"
            echo "- super_admin → /api/v1/bindings: HTTP $admin_binding_status (expected 200)"
            echo "- parent session → QA fixture path: HTTP $qa_parent_status (expected 401)"
            echo "- normal campus/student selectors: synthetic IDs absent"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run authenticated desktop/mobile Parent Portal smoke
        working-directory: frontend
        env:
          CI: 'true'
          SMOKE_BASE_URL: https://daan.lifenet.com.tw
        run: npx playwright test e2e/parent-portal-production.spec.js --project=chromium

      - name: Upload Parent Portal smoke report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parent-portal-production-smoke-${{ github.run_id }}
          path: frontend/playwright-report/
          retention-days: 30
          if-no-files-found: ignore

  pop-bootstrap:
    name: Bootstrap POP machine on Pi
    needs: [resolve-target, detect-deployable, classify-activation, production-activation]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.phase == 'pop-bootstrap' && needs.resolve-target.result == 'success' && needs.detect-deployable.result == 'success' && needs.classify-activation.result == 'success' && needs.classify-activation.outputs.mode == 'manual' && needs.production-activation.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production-ssh
    timeout-minutes: 10
    # Bootstrap is a production identity side effect. Keep it mutually
    # exclusive with deployment and staged principal rotation.
    concurrency:
      group: alltrue-production-side-effects-v2
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout pinned SSH trust helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/production-ssh-trust
          sparse-checkout-cone-mode: false
      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_HOST || secrets.PI_SSH_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Final exact-main gate before POP bootstrap
        env:
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "/repos/${REPO}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$TARGET_SHA" == "$MAIN_SHA" ]] || {
            echo "::error::POP bootstrap refused stale target ${TARGET_SHA}; current main is ${MAIN_SHA}."
            exit 1
          }
          CI_RUNS="$(gh api "/repos/${REPO}/actions/workflows/ci.yml/runs?branch=main&head_sha=${TARGET_SHA}&status=completed&per_page=100")"
          CI_OK="$(CI_RUNS="$CI_RUNS" python3 - <<'PY'
          import json
          import os

          runs = json.loads(os.environ["CI_RUNS"]).get("workflow_runs", [])
          print(any(run.get("name") == "CI — PHPUnit Tests" and run.get("conclusion") == "success" for run in runs))
          PY
          )"
          [[ "$CI_OK" == "True" ]] || {
            echo "::error::POP bootstrap refused target without successful exact-main CI."
            exit 1
          }
          echo "Final exact-main gate passed for POP bootstrap ${TARGET_SHA}."

      - name: Setup pinned SSH identity
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$PI_SSH_KEY"
          test -n "$PI_HOST_KEY"
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Generate host-local POP identity and verify authenticated submit boundary
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
          CAMPUS_ID: ${{ inputs.campus_id }}
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$CAMPUS_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::POP bootstrap requires a positive numeric campus_id."
            exit 1
          }
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_USER}@${PI_HOST}" "CAMPUS_ID=${CAMPUS_ID} TARGET_SHA=${TARGET_SHA} bash -s" <<'REMOTE'
          set -euo pipefail
          umask 077
          cd /home/admin/backend
          command -v php >/dev/null
          KEY_FILE=/home/admin/backend/storage/app/private/pop-machine.key
          if [[ -f "$KEY_FILE" ]]; then
            # A prior run may have persisted the identity before a later
            # validation-only probe failed. Verify metadata and reuse the
            # existing host-local key; never regenerate or overwrite it.
            CAMPUS_ID="$CAMPUS_ID" php artisan tinker --execute='
            $client = \App\Models\ApiClient::query()
                ->where("Name", "POP Pi executor")
                ->where("CampusID", (int) getenv("CAMPUS_ID"))
                ->where("Purpose", "pop_control_plane")
                ->where("Active", 1)
                ->first();
            $scopes = $client && is_array($client->Scopes) ? array_map("strval", $client->Scopes) : [];
            if (!$client || !in_array("pop:draft", $scopes, true) || !in_array("pop:dry-run", $scopes, true)) {
                throw new RuntimeException("existing POP identity metadata is not the expected scoped identity");
            }
            echo "existing POP machine identity verified: client_id=" . (int) $client->id . ", campus_id=" . (int) $client->CampusID . PHP_EOL;
            '
          else
            php artisan list | grep -q 'pop:bootstrap-machine' || {
              echo "::error::Deployed backend does not expose pop:bootstrap-machine; refusing bootstrap."
              exit 1
            }
            php artisan pop:bootstrap-machine \
              --campus-id="$CAMPUS_ID" \
              --name='POP Pi executor' \
              --key-file=storage/app/private/pop-machine.key \
              --confirm=POP_BOOTSTRAP_MACHINE
          fi

          test -f "$KEY_FILE"
          [[ "$(stat -c '%a' "$KEY_FILE")" == "600" ]] || {
            echo "::error::POP key file is not mode 600; refusing submit verification."
            exit 1
          }
          KEY="$(<"$KEY_FILE")"
          [[ "$KEY" =~ ^pop_machine_[A-Za-z0-9]+$ ]] || {
            echo "::error::POP key file format check failed; refusing submit verification."
            exit 1
          }

          # Invalid parameters force request validation after machine auth and
          # before draft creation. The key is read and used only on the Pi;
          # neither its content nor the request body is emitted to the runner.
          STATUS="$(curl -skS -o /dev/null -w '%{http_code}' \
            --connect-timeout 10 --max-time 20 \
            -H "X-POP-MACHINE-KEY: ${KEY}" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data '{"parameters":null,"idempotency_key":"bootstrap-auth-probe"}' \
            https://daan.lifenet.com.tw/api/v1/pop/machine/operations/course-contract-repair/draft)"
          unset KEY
          [[ "$STATUS" == "422" ]] || {
            echo "::error::Authenticated POP submit boundary expected HTTP 422 validation response, got ${STATUS}."
            exit 1
          }
          echo "POP bootstrap verified: host-local key mode=600; authenticated submit boundary returned HTTP 422 before draft creation."
          echo "POP bootstrap target SHA: ${TARGET_SHA}"
          REMOTE

  staged_principal_rotation:
    name: Staged DB principal rotation (one phase)
    # The transformer and preflight contract tests must pass before any phase
    # can touch production credentials.
    needs: contract-test
    if: needs.contract-test.result == 'success' && github.event_name == 'workflow_dispatch' && (inputs.phase == 'phase1-create' || inputs.phase == 'phase2-cutover' || inputs.phase == 'phase3-lock')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Principal rotation is a production side effect and must remain mutually
    # exclusive with application deployment.
    concurrency:
      group: alltrue-production-side-effects-v2
      cancel-in-progress: false
      queue: max
    environment:
      name: production-activation
    steps:
      - name: Checkout pinned SSH trust helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/production-ssh-trust
          sparse-checkout-cone-mode: false
      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_HOST || secrets.PI_SSH_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Require phase-specific typed confirmation
        env:
          PHASE: ${{ inputs.phase }}
          CONFIRM_INPUT: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          case "$PHASE" in
            phase1-create) EXPECTED="CREATE_NEW_PRINCIPAL" ;;
            phase2-cutover) EXPECTED="CUTOVER_NEW_PRINCIPAL" ;;
            phase3-lock) EXPECTED="LOCK_OLD_PRINCIPAL" ;;
            *) echo "::error::Unknown phase. Nothing touched."; exit 1 ;;
          esac
          if [[ "$CONFIRM_INPUT" != "$EXPECTED" ]]; then
            echo "::error::Confirmation phrase does not match the selected phase. Nothing touched."
            exit 1
          fi

      - name: Setup pinned SSH identity
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$PI_SSH_KEY"
          test -n "$PI_HOST_KEY"
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Create principal by replaying the old principal's exact SHOW GRANTS output
        if: inputs.phase == 'phase1-create'
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_USER}@${PI_HOST}" bash <<'REMOTE'
          set -euo pipefail
          umask 077
          cd /home/admin/backend

          STATE_DIR=/home/admin/backups/pre-rotation/1387-staged
          STATE_FILE="$STATE_DIR/rotation-state.env"
          mkdir -p "$STATE_DIR"
          chmod 700 "$STATE_DIR"

          read_env() {
            local key="$1"
            grep -m1 "^${key}=" .env | cut -d= -f2-
          }
          validate_account_part() {
            [[ "$1" =~ ^[A-Za-z0-9_.%:-]+$ ]]
          }

          if [[ -f "$STATE_FILE" ]]; then
            # shellcheck disable=SC1090
            source "$STATE_FILE"
            [[ "${STATUS:-}" == "principal_created" ]] || {
              echo "::error::A staged rotation is already past Phase 1; refusing to create another principal."
              exit 1
            }
            mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" \
              -u "$STAGED_DB_USERNAME" -p"$STAGED_DB_PASSWORD" "$DB_DATABASE" \
              --batch --skip-column-names -e "SELECT 1" >/dev/null 2>&1
            [[ "$(read_env DB_USERNAME)" == "$OLD_DB_USERNAME" ]] || {
              echo "::error::State says Phase 1, but the application username has changed. Refusing."
              exit 1
            }
            echo "Phase 1 already complete: the staged principal still authenticates; old app configuration is untouched."
            exit 0
          fi

          OLD_DB_USERNAME="$(read_env DB_USERNAME)"
          OLD_DB_PASSWORD="$(read_env DB_PASSWORD)"
          DB_HOST="$(read_env DB_HOST)"
          DB_PORT="$(read_env DB_PORT)"
          DB_DATABASE="$(read_env DB_DATABASE)"
          [[ -n "$OLD_DB_USERNAME" && -n "$OLD_DB_PASSWORD" && -n "$DB_DATABASE" ]]
          DB_HOST="${DB_HOST:-127.0.0.1}"
          DB_PORT="${DB_PORT:-3306}"
          validate_account_part "$OLD_DB_USERNAME" || {
            echo "::error::Unexpected DB username shape; no account was changed."
            exit 1
          }

          OLD_MYSQL=(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" \
            -u "$OLD_DB_USERNAME" -p"$OLD_DB_PASSWORD" --batch --skip-column-names)
          CURRENT_ACCOUNT="$("${OLD_MYSQL[@]}" -e "SELECT CURRENT_USER()")"
          [[ "$CURRENT_ACCOUNT" == "$OLD_DB_USERNAME@"* ]] || {
            echo "::error::DB_USERNAME does not match CURRENT_USER(); no account was changed."
            exit 1
          }
          OLD_ACCOUNT_HOST="${CURRENT_ACCOUNT#"$OLD_DB_USERNAME"@}"
          validate_account_part "$OLD_ACCOUNT_HOST" || {
            echo "::error::Unexpected authenticated host pattern; no account was changed."
            exit 1
          }

          # BEGIN leftover-staged-principal preflight (read-only; counts only)
          # A staged principal with no state file means an earlier attempt left an
          # account behind. Refuse before creating another one. Only the server's
          # account tables are exhaustive; information_schema views list just the
          # grantees this principal may see, so they are never used. Excluded:
          # the exact authenticated user@host (already atr_* after a completed
          # rotation) and atr_* predecessors that Phase 3 locked with ACCOUNT LOCK.
          # An orphan from a failed Phase 1 is unlocked and usable, so it counts.
          # A password-quarantined predecessor is also unlocked and cannot be told
          # apart from an orphan, so it counts too (fail closed).
          STAGED_PRINCIPAL_REGEXP='^atr_[0-9]{12}_[0-9a-f]{6}$'
          STAGED_FILTER="User REGEXP '${STAGED_PRINCIPAL_REGEXP}' AND NOT (User = '${OLD_DB_USERNAME}' AND Host = '${OLD_ACCOUNT_HOST}')"
          count_leftovers() { "${OLD_MYSQL[@]}" -e "$1" 2>/dev/null; }
          if LEFTOVER_COUNT="$(count_leftovers \
            "SELECT COUNT(*) FROM mysql.global_priv WHERE ${STAGED_FILTER} AND COALESCE(JSON_VALUE(Priv, '\$.account_locked'), 'false') <> 'true'")"; then
            # MariaDB 10.4+: the lock flag lives in the global_priv JSON.
            LEFTOVER_SOURCE=mysql.global_priv
          elif LEFTOVER_COUNT="$(count_leftovers \
            "SELECT COUNT(*) FROM mysql.user WHERE ${STAGED_FILTER} AND account_locked <> 'Y'")"; then
            # MySQL 5.7+/8: mysql.user.account_locked.
            LEFTOVER_SOURCE=mysql.user.account_locked
          elif LEFTOVER_COUNT="$(count_leftovers \
            "SELECT COUNT(*) FROM mysql.user WHERE ${STAGED_FILTER}")"; then
            # Lock status unreadable: still exhaustive, but locked predecessors count.
            LEFTOVER_SOURCE=mysql.user-lock-status-unavailable
          else
            echo "::error::The old principal cannot read mysql.user, so it cannot list all accounts and leftover staged principals cannot be ruled out; no account was changed. Founder review required."
            exit 1
          fi
          [[ "$LEFTOVER_COUNT" =~ ^[0-9]+$ ]] || {
            echo "::error::Unexpected staged-principal count shape; no account was changed."
            exit 1
          }
          echo "Leftover staged-principal preflight: count=${LEFTOVER_COUNT} source=${LEFTOVER_SOURCE} (current principal and locked predecessors excluded)"
          if (( LEFTOVER_COUNT > 0 )); then
            echo "::error::An unlocked staged principal other than the current one exists without a state file; no account was changed. Founder review required before any rerun: confirm read-only whether each such account is an orphan or a password-quarantined predecessor, then lock or drop it manually."
            exit 1
          fi
          # END leftover-staged-principal preflight

          STAGED_DB_USERNAME="atr_$(date -u '+%y%m%d%H%M%S')_$(openssl rand -hex 3)"
          STAGED_DB_PASSWORD="$(openssl rand -hex 32)"
          export OLD_DB_USERNAME OLD_ACCOUNT_HOST STAGED_DB_USERNAME STAGED_DB_PASSWORD

          TRANSFORMER="$(mktemp /tmp/1387-grant-transform.XXXXXX.py)"
          cat > "$TRANSFORMER" <<'PY'
          import os
          import re
          import sys

          old_user = os.environ["OLD_DB_USERNAME"]
          old_host = os.environ["OLD_ACCOUNT_HOST"]
          new_user = os.environ["STAGED_DB_USERNAME"]
          new_pass = os.environ["STAGED_DB_PASSWORD"]

          ident = r"(?:'(?:''|\\\\.|[^'])*'|`(?:``|[^`])*`)"
          target = re.compile(rf"(?i)(\b(?:TO|FROM)\s+)({ident})@({ident})")
          # MariaDB SHOW GRANTS embeds the account's authentication clause right
          # after the grantee. It belongs to the old principal, so strip only that
          # clause; the new principal gets its own password via CREATE USER above.
          literal = r"'(?:''|\\\\.|[^'\\\\])*'"
          auth_clause = re.compile(
              rf"(?i)^\s+IDENTIFIED\s+(?:"
              rf"BY\s+PASSWORD\s+{literal}"
              rf"|VIA\s+\w+(?:\s+(?:USING|AS)\s+{literal})?"
              rf"(?:\s+OR\s+\w+(?:\s+(?:USING|AS)\s+{literal})?)*"
              rf")(?=\s|;|$)"
          )
          residual = re.compile(
              r"(?i)IDENTIFIED|PASSWORD\s*\(|\*[0-9A-F]{40}|\$[A-Z0-9]\$|[0-9A-F]{32,}|[A-Za-z0-9+/]{40,}={0,2}"
          )

          def decode(token):
              if token.startswith("`"):
                  return token[1:-1].replace("``", "`")
              value = token[1:-1].replace("''", "'")
              return re.sub(r"\\\\(.)", r"\1", value)

          def quote(value):
              return "'" + value.replace("\\", "\\\\").replace("'", "\\'") + "'"

          # Validate every line before emitting anything: a refusal must send zero
          # bytes to the piped mysql, so CREATE USER can never run on its own.
          statements = [f"CREATE USER {quote(new_user)}@{quote(old_host)} IDENTIFIED BY {quote(new_pass)};"]
          count = 0
          stripped = 0
          for raw in sys.stdin:
              grant = raw.strip()
              if not grant:
                  continue
              matches = list(target.finditer(grant))
              if len(matches) != 1:
                  raise SystemExit("unexpected SHOW GRANTS target shape")
              match = matches[0]
              if decode(match.group(2)) != old_user or decode(match.group(3)) != old_host:
                  raise SystemExit("SHOW GRANTS target does not match CURRENT_USER()")
              head = grant[:match.start()]
              tail = grant[match.end():]
              auth = auth_clause.match(tail)
              if auth:
                  tail = tail[auth.end():]
                  stripped += 1
              if residual.search(head) or residual.search(tail):
                  raise SystemExit("SHOW GRANTS contains authentication material; refusing unsafe replay")
              replacement = match.group(1) + quote(new_user) + "@" + quote(old_host)
              statement = head + replacement + tail
              statements.append(statement.rstrip(";") + ";")
              count += 1
          if count == 0:
              raise SystemExit("SHOW GRANTS returned no statements")
          sys.stdout.write("\n".join(statements) + "\n")
          # Counts only: never the grant text, a hash or a password.
          print(f"grant replay: {count} statement(s), {stripped} authentication clause(s) stripped", file=sys.stderr)
          PY

          created_attempted=0
          completed=0
          cleanup() {
            rc=$?
            rm -f "$TRANSFORMER"
            if [[ "$completed" != 1 && "$created_attempted" == 1 ]]; then
              "${OLD_MYSQL[@]}" -e \
                "DROP USER IF EXISTS '${STAGED_DB_USERNAME}'@'${OLD_ACCOUNT_HOST}'" \
                >/dev/null 2>&1 || echo "::error::Automatic DROP USER rollback failed; Founder follow-up required."
              rm -f "$STATE_FILE"
            fi
            unset OLD_DB_PASSWORD STAGED_DB_PASSWORD
            exit "$rc"
          }
          trap cleanup EXIT

          created_attempted=1
          "${OLD_MYSQL[@]}" -e "SHOW GRANTS FOR CURRENT_USER()" \
            | python3 "$TRANSFORMER" \
            | "${OLD_MYSQL[@]}" >/dev/null

          mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" \
            -u "$STAGED_DB_USERNAME" -p"$STAGED_DB_PASSWORD" "$DB_DATABASE" \
            --batch --skip-column-names -e "SELECT 1" >/dev/null 2>&1

          {
            printf 'STATUS=%q\n' principal_created
            printf 'OLD_DB_USERNAME=%q\n' "$OLD_DB_USERNAME"
            printf 'OLD_ACCOUNT_HOST=%q\n' "$OLD_ACCOUNT_HOST"
            printf 'STAGED_DB_USERNAME=%q\n' "$STAGED_DB_USERNAME"
            printf 'STAGED_DB_PASSWORD=%q\n' "$STAGED_DB_PASSWORD"
            printf 'DB_HOST=%q\n' "$DB_HOST"
            printf 'DB_PORT=%q\n' "$DB_PORT"
            printf 'DB_DATABASE=%q\n' "$DB_DATABASE"
            printf 'OLD_ENV_BACKUP=%q\n' ''
            printf 'ATTEMPT_ENV_BACKUP=%q\n' ''
            printf 'PREVIOUS_STATUS=%q\n' ''
            printf 'LOCK_METHOD=%q\n' ''
            printf 'QUARANTINE_PASSWORD=%q\n' ''
          } > "$STATE_FILE"
          chmod 600 "$STATE_FILE"
          completed=1
          echo "Phase 1 complete: SHOW GRANTS statements replayed (old authentication clause stripped) and the new principal passed a fresh SELECT 1 connection."
          echo "The old principal and application .env were not changed."
          REMOTE

      - name: Backup, cut over .env, rebuild config, reload PHP-FPM, and verify new DB identity
        if: inputs.phase == 'phase2-cutover'
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_USER}@${PI_HOST}" bash <<'REMOTE'
          set -euo pipefail
          umask 077
          cd /home/admin/backend
          STATE_FILE=/home/admin/backups/pre-rotation/1387-staged/rotation-state.env
          [[ -f "$STATE_FILE" ]] || { echo "::error::Phase 1 state is missing."; exit 1; }
          # shellcheck disable=SC1090
          source "$STATE_FILE"
          [[ "$STATUS" == "principal_created" || "$STATUS" == "cutover_verified" ]] || {
            echo "::error::Phase 2 cannot run from the recorded state: $STATUS"
            exit 1
          }
          for consumer in /home/admin/scripts/{diagnose-classsession-duplicates.sh,diagnose-student-session.sh,post-merge-smoke.sh}; do
            grep -q 'DB_USERNAME' "$consumer" || { echo "::error::Production checkout predates the username-consumer fixes."; exit 1; }
          done

          state_set() { sed -i "s|^${1}=.*|${1}=${2}|" "$STATE_FILE"; }

          mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" \
            -u "$STAGED_DB_USERNAME" -p"$STAGED_DB_PASSWORD" "$DB_DATABASE" \
            --batch --skip-column-names -e "SELECT 1" >/dev/null 2>&1

          STAMP="$(date '+%Y-%m-%d_%H%M%S')"
          BACKUP_FILE="/home/admin/backups/pre-rotation/alltrue_pre_staged_cutover_${STAMP}.sql.gz"
          CURRENT_USER="$(grep -m1 '^DB_USERNAME=' .env | cut -d= -f2-)"
          CURRENT_PASS="$(grep -m1 '^DB_PASSWORD=' .env | cut -d= -f2-)"
          mysqldump --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$CURRENT_USER" -p"$CURRENT_PASS" \
            --single-transaction --routines --triggers "$DB_DATABASE" | gzip > "$BACKUP_FILE"
          test -s "$BACKUP_FILE"
          echo "pre-cutover backup: $(basename "$BACKUP_FILE") ($(du -h "$BACKUP_FILE" | cut -f1))"

          PREVIOUS_STATUS="$STATUS"
          ATTEMPT_ENV_BACKUP="/home/admin/backups/pre-rotation/env_pre_staged_cutover_${STAMP}.bak"
          cp .env "$ATTEMPT_ENV_BACKUP"
          chmod 600 "$ATTEMPT_ENV_BACKUP"
          if [[ -z "$OLD_ENV_BACKUP" ]]; then
            OLD_ENV_BACKUP="$ATTEMPT_ENV_BACKUP"
          fi
          state_set PREVIOUS_STATUS "$STATUS"
          state_set ATTEMPT_ENV_BACKUP "$ATTEMPT_ENV_BACKUP"
          state_set OLD_ENV_BACKUP "$OLD_ENV_BACKUP"
          state_set STATUS cutover_pending

          ENV_TMP="$(mktemp .env.1387-staged.XXXXXX)"
          awk -v user="$STAGED_DB_USERNAME" -v pass="$STAGED_DB_PASSWORD" '
            BEGIN { users=0; passwords=0 }
            /^DB_USERNAME=/ { print "DB_USERNAME=" user; users++; next }
            /^DB_PASSWORD=/ { print "DB_PASSWORD=" pass; passwords++; next }
            { print }
            END { if (users != 1 || passwords != 1) exit 42 }
          ' .env > "$ENV_TMP"
          chmod --reference=.env "$ENV_TMP"
          mv "$ENV_TMP" .env

          php artisan config:cache

          export EXPECTED_DB_USERNAME="$STAGED_DB_USERNAME"
          php artisan tinker --execute='
          \Illuminate\Support\Facades\DB::purge("mysql");
          $row = \Illuminate\Support\Facades\DB::selectOne("SELECT CURRENT_USER() AS principal, 1 AS probe");
          $expected = (string) getenv("EXPECTED_DB_USERNAME");
          if (!$row || (int) $row->probe !== 1 || !str_starts_with((string) $row->principal, $expected . "@")) {
              throw new RuntimeException("staged principal verification failed");
          }
          echo "db-read-new-principal=OK", PHP_EOL;
          '
          php artisan schedule:list >/dev/null
          echo "scheduler-bootstrap=OK"

          if grep -q '^DB_PERSISTENT=true' .env 2>/dev/null; then
            echo "DB_PERSISTENT=true detected -- FPM reload is required."
          else
            echo "DB_PERSISTENT not set to true -- reloading as defense-in-depth."
          fi
          if sudo -n service php8.2-fpm reload 2>/tmp/fpm_reload_err; then
            echo "php8.2-fpm reload: OK"
          else
            cat /tmp/fpm_reload_err 2>/dev/null || true
            rm -f /tmp/fpm_reload_err
            echo "::error::PHP-FPM reload failed; automatic .env rollback will run."
            exit 1
          fi
          rm -f /tmp/fpm_reload_err
          state_set STATUS cutover_local_verified
          unset CURRENT_PASS STAGED_DB_PASSWORD
          REMOTE

      - name: Verify application health and version after the new-principal read passed
        if: inputs.phase == 'phase2-cutover'
        env:
          PRODUCTION_URL: https://daan.lifenet.com.tw
        run: |
          set -euo pipefail
          HEALTH=""
          for i in $(seq 1 10); do
            HEALTH=$(curl -sf "$PRODUCTION_URL/api/v1/health" || true)
            echo "attempt $i: $HEALTH"
            echo "$HEALTH" | grep -q '"status":"ok"' && break
            sleep 3
          done
          echo "$HEALTH" | grep -q '"status":"ok"' || {
            echo "::error::Health check did not return ok after staged cutover"
            exit 1
          }
          VERSION=$(curl -sf "$PRODUCTION_URL/version.json")
          test -n "$VERSION"
          echo "version endpoint: $VERSION"

      - name: Mark the observation window open
        if: inputs.phase == 'phase2-cutover'
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_USER}@${PI_HOST}" bash <<'REMOTE'
          set -euo pipefail
          STATE_FILE=/home/admin/backups/pre-rotation/1387-staged/rotation-state.env
          # shellcheck disable=SC1090
          source "$STATE_FILE"
          [[ "$STATUS" == "cutover_local_verified" ]]
          sed -i 's/^STATUS=.*/STATUS=cutover_verified/' "$STATE_FILE"
          chmod 600 "$STATE_FILE"
          echo "Phase 2 complete: observation window is open; the old account remains valid and untouched."
          REMOTE

      - name: Automatically restore the attempt's .env if Phase 2 fails
        if: failure() && inputs.phase == 'phase2-cutover'
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          set -euo pipefail
          [[ -f ~/.ssh/deploy_key ]] || exit 0
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_USER}@${PI_HOST}" bash <<'REMOTE'
          set -euo pipefail
          cd /home/admin/backend
          STATE_FILE=/home/admin/backups/pre-rotation/1387-staged/rotation-state.env
          [[ -f "$STATE_FILE" ]] || exit 0
          # shellcheck disable=SC1090
          source "$STATE_FILE"
          [[ "$STATUS" == "cutover_pending" || "$STATUS" == "cutover_local_verified" ]] || exit 0
          [[ -n "$ATTEMPT_ENV_BACKUP" && -f "$ATTEMPT_ENV_BACKUP" ]]
          cp "$ATTEMPT_ENV_BACKUP" .env
          php artisan config:cache
          sudo -n service php8.2-fpm reload
          sed -i "s/^STATUS=.*/STATUS=${PREVIOUS_STATUS}/" "$STATE_FILE"
          chmod 600 "$STATE_FILE"
          echo "Failed Phase 2 attempt rolled back to its entry .env and config cache."
          REMOTE

      - name: Lock the old principal, with password quarantine only for unsupported lock syntax
        if: inputs.phase == 'phase3-lock'
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_USER}@${PI_HOST}" bash <<'REMOTE'
          set -euo pipefail
          umask 077
          cd /home/admin/backend
          STATE_FILE=/home/admin/backups/pre-rotation/1387-staged/rotation-state.env
          [[ -f "$STATE_FILE" ]] || { echo "::error::Staged rotation state is missing."; exit 1; }
          # shellcheck disable=SC1090
          source "$STATE_FILE"
          [[ "$STATUS" == "cutover_verified" ]] || {
            echo "::error::Phase 3 requires a completed Phase 2 observation window."
            exit 1
          }
          [[ "$(grep -m1 '^DB_USERNAME=' .env | cut -d= -f2-)" == "$STAGED_DB_USERNAME" ]] || {
            echo "::error::Application .env is not on the staged principal."
            exit 1
          }
          [[ -n "$OLD_ENV_BACKUP" && -f "$OLD_ENV_BACKUP" ]]
          OLD_DB_PASSWORD="$(grep -m1 '^DB_PASSWORD=' "$OLD_ENV_BACKUP" | cut -d= -f2-)"
          state_set() { sed -i "s|^${1}=.*|${1}=${2}|" "$STATE_FILE"; }
          state_secret_set() {
            local tmp="${STATE_FILE}.tmp"
            while IFS= read -r line; do
              if [[ "$line" == QUARANTINE_PASSWORD=* ]]; then
                printf 'QUARANTINE_PASSWORD=%q\n' "$1"
              else
                printf '%s\n' "$line"
              fi
            done < "$STATE_FILE" > "$tmp"
            chmod 600 "$tmp"
            mv "$tmp" "$STATE_FILE"
          }
          NEW_MYSQL=(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" \
            -u "$STAGED_DB_USERNAME" -p"$STAGED_DB_PASSWORD" --batch --skip-column-names)
          OLD_ACCOUNT_SQL="'${OLD_DB_USERNAME}'@'${OLD_ACCOUNT_HOST}'"

          "${NEW_MYSQL[@]}" "$DB_DATABASE" -e "SELECT 1" >/dev/null 2>&1
          LOCK_ERROR="$(mktemp /tmp/1387-account-lock.XXXXXX.err)"
          if "${NEW_MYSQL[@]}" -e "ALTER USER ${OLD_ACCOUNT_SQL} ACCOUNT LOCK" \
              >/dev/null 2>"$LOCK_ERROR"; then
            LOCK_METHOD=account_lock
            QUARANTINE_PASSWORD=''
          elif grep -qE 'ERROR 1064|syntax' "$LOCK_ERROR"; then
            # Compatibility fallback for a pre-account-lock server. The random
            # replacement remains only in the protected Pi state file.
            QUARANTINE_PASSWORD="$(openssl rand -hex 32)"
            printf "ALTER USER %s IDENTIFIED BY '%s';\n" "$OLD_ACCOUNT_SQL" "$QUARANTINE_PASSWORD" \
              | "${NEW_MYSQL[@]}" >/dev/null
            LOCK_METHOD=password_quarantine
          else
            cat "$LOCK_ERROR" >&2
            rm -f "$LOCK_ERROR"
            echo "::error::ACCOUNT LOCK failed for a reason other than unsupported syntax; no fallback attempted."
            exit 1
          fi
          rm -f "$LOCK_ERROR"
          state_set LOCK_METHOD "$LOCK_METHOD"
          state_secret_set "$QUARANTINE_PASSWORD"
          state_set STATUS containment_pending

          OLD_PROBE_ERROR="$(mktemp /tmp/1387-old-credential-probe.XXXXXX.err)"
          if mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" \
              -u "$OLD_DB_USERNAME" -p"$OLD_DB_PASSWORD" "$DB_DATABASE" \
              --batch --skip-column-names -e "SELECT 1" >/dev/null 2>"$OLD_PROBE_ERROR"; then
            if [[ "$LOCK_METHOD" == account_lock ]]; then
              "${NEW_MYSQL[@]}" -e "ALTER USER ${OLD_ACCOUNT_SQL} ACCOUNT UNLOCK" >/dev/null
              state_set LOCK_METHOD ''
              state_secret_set ''
              state_set STATUS cutover_verified
            fi
            rm -f "$OLD_PROBE_ERROR"
            echo "::error::The old credential still authenticated; containment was not accepted."
            exit 1
          fi

          OLD_PROBE_CODE="$(sed -n 's/.*ERROR \([0-9][0-9]*\).*/\1/p' "$OLD_PROBE_ERROR" | head -n 1)"
          if [[ "$OLD_PROBE_CODE" != 1045 && "$OLD_PROBE_CODE" != 3118 ]]; then
            cat "$OLD_PROBE_ERROR" >&2
            if [[ "$LOCK_METHOD" == account_lock ]]; then
              "${NEW_MYSQL[@]}" -e "ALTER USER ${OLD_ACCOUNT_SQL} ACCOUNT UNLOCK" >/dev/null
              state_set LOCK_METHOD ''
              state_secret_set ''
              state_set STATUS cutover_verified
            fi
            rm -f "$OLD_PROBE_ERROR"
            echo "::error::Old-credential probe did not return a known authentication rejection; containment was not accepted."
            exit 1
          fi
          rm -f "$OLD_PROBE_ERROR"
          echo "old-credential-probe=AUTH_REJECTED code=$OLD_PROBE_CODE"
          "${NEW_MYSQL[@]}" "$DB_DATABASE" -e "SELECT 1" >/dev/null 2>&1

          export EXPECTED_DB_USERNAME="$STAGED_DB_USERNAME"
          php artisan tinker --execute='
          \Illuminate\Support\Facades\DB::purge("mysql");
          $row = \Illuminate\Support\Facades\DB::selectOne("SELECT CURRENT_USER() AS principal, 1 AS probe");
          $expected = (string) getenv("EXPECTED_DB_USERNAME");
          if (!$row || (int) $row->probe !== 1 || !str_starts_with((string) $row->principal, $expected . "@")) {
              throw new RuntimeException("post-lock staged principal verification failed");
          }
          echo "post-lock-db-read-new-principal=OK", PHP_EOL;
          '

          state_set STATUS old_principal_contained
          chmod 600 "$STATE_FILE"
          unset OLD_DB_PASSWORD STAGED_DB_PASSWORD QUARANTINE_PASSWORD
          echo "Phase 3 complete: the old credential cannot open a new connection; the new principal still passes an app-level DB read."
          REMOTE

      - name: Remove local key material
        if: always()
        run: rm -f ~/.ssh/deploy_key
