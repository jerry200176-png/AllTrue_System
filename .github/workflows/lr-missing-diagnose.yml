name: LR Missing Diagnose (read-only)

# Read-only probe used to root-cause the 2026-08-03..08-07 Pi Health Monitor
# regression on bugs:verify-reproductions' enforced conditions
# (attended_session_without_learning_record #1078/#188 and
# leave_session_with_live_learning_record #170 — fixed in this same PR).
# Kept for reuse if either condition (or a sibling one) regresses again.
# SELECT-only via artisan tinker. No writes.
on:
  workflow_dispatch: {}

concurrency:
  group: lr-missing-diagnose
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    name: Production read-only missing-LearningRecord scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.PI_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run diagnose on Pi
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
        run: |
          set -euo pipefail
          cat > /tmp/lr_missing_probe.php <<'PHP'
          <?php
          // 1) Live check of the exact enforced condition (may be empty if it self-cleared).
          $rows = \Illuminate\Support\Facades\DB::select("
            SELECT cs.id AS session_id, cs.StudentClassID, cs.SessionDate, cs.StartTime, cs.Status,
                   sc.StudentID, sc.TeacherID, sc.Stop AS course_stop, sc.ScheduleMode,
                   s.CampusID AS student_campus_id,
                   (SELECT COUNT(*) FROM Campus c WHERE c.id = s.CampusID) AS campus_row_exists,
                   (SELECT lr.id FROM LearningRecord lr WHERE lr.ClassSessionID = cs.id ORDER BY lr.id DESC LIMIT 1) AS any_lr_id,
                   (SELECT lr.VoidedAt FROM LearningRecord lr WHERE lr.ClassSessionID = cs.id ORDER BY lr.id DESC LIMIT 1) AS any_lr_voided_at,
                   (SELECT lr.Status FROM LearningRecord lr WHERE lr.ClassSessionID = cs.id ORDER BY lr.id DESC LIMIT 1) AS any_lr_status
            FROM ClassSession cs
            JOIN StudentClass sc ON sc.ID = cs.StudentClassID
            JOIN Student s ON s.id = sc.StudentID
            WHERE LOWER(cs.Status) IN ('attended','late','trial','tutoring_attend','completed')
              AND CONCAT(cs.SessionDate, ' ', COALESCE(cs.StartTime, '00:00:00')) <= NOW()
              AND NOT EXISTS (SELECT 1 FROM LearningRecord lr WHERE lr.ClassSessionID = cs.id AND lr.VoidedAt IS NULL)
          ");

          // 2) Same condition but WITHOUT the Student join, to catch rows whose StudentID
          //    doesn't resolve to any Student row at all (invisible to backfillAllBranches(),
          //    which enumerates branches strictly via Student::CampusID).
          $orphaned = \Illuminate\Support\Facades\DB::select("
            SELECT cs.id AS session_id, cs.StudentClassID, cs.SessionDate, cs.StartTime, cs.Status,
                   sc.StudentID, sc.Stop AS course_stop
            FROM ClassSession cs
            JOIN StudentClass sc ON sc.ID = cs.StudentClassID
            WHERE LOWER(cs.Status) IN ('attended','late','trial','tutoring_attend','completed')
              AND CONCAT(cs.SessionDate, ' ', COALESCE(cs.StartTime, '00:00:00')) <= NOW()
              AND NOT EXISTS (SELECT 1 FROM LearningRecord lr WHERE lr.ClassSessionID = cs.id AND lr.VoidedAt IS NULL)
              AND NOT EXISTS (SELECT 1 FROM Student s WHERE s.id = sc.StudentID)
          ");

          // 3) Any LearningRecord that is currently voided but whose session is fillable —
          //    these should have been restored by the last backfillBranch() run.
          $stillVoided = \Illuminate\Support\Facades\DB::select("
            SELECT cs.id AS session_id, cs.StudentClassID, cs.SessionDate, cs.StartTime, cs.Status AS session_status,
                   sc.Stop AS course_stop, lr.id AS lr_id, lr.Status AS lr_status, lr.VoidedAt AS voided_at, lr.VoidReason AS void_reason
            FROM ClassSession cs
            JOIN StudentClass sc ON sc.ID = cs.StudentClassID
            JOIN LearningRecord lr ON lr.ClassSessionID = cs.id
            WHERE LOWER(cs.Status) IN ('attended','completed','late','trial','tutoring_attend')
              AND lr.VoidedAt IS NOT NULL
              AND CONCAT(cs.SessionDate, ' ', COALESCE(cs.StartTime, '00:00:00')) <= NOW()
            ORDER BY lr.VoidedAt DESC
            LIMIT 20
          ");

          // 4) Scheduler evidence ledger tail for the last 5 days, if still on disk, so we can
          //    see whether the same session_id recurred across nights (the JSON payload for
          //    bugs-verify-reproductions only has counts, not row ids, but worth confirming).
          $ledgerFiles = glob(storage_path("logs/scheduler-evidence/*.jsonl"));
          sort($ledgerFiles);
          $ledgerTail = array_slice($ledgerFiles, -5);

          // 5) Pull the raw bugs-verify-reproductions ledger lines for the last 5 nights to
          //    see the exact stdout the nightly command produced (may include more than the
          //    aggregated Pi Health Monitor JSON keeps).
          $verifyLedgerLines = [];
          foreach ($ledgerTail as $f) {
            $lines = @file($f, FILE_IGNORE_NEW_LINES | FILE_SKIP_EMPTY_LINES) ?: [];
            foreach ($lines as $line) {
              if (strpos($line, 'bugs-verify-reproductions') !== false || strpos($line, 'bugs:verify-reproductions') !== false) {
                $verifyLedgerLines[basename($f)][] = $line;
              }
            }
          }

          // 6) Re-run the actual command live (read-only) to see current condition counts.
          $verifyNowRc = null;
          $verifyNowOut = null;
          exec('php artisan bugs:verify-reproductions --json 2>&1', $verifyNowOutLines, $verifyNowRc);
          $verifyNowOut = implode("\n", $verifyNowOutLines);

          // 7) Today's regressed condition is #170 (leave_session_with_live_learning_record),
          //    not the attended-without-LR one. Dump the actual offending row(s).
          $leaveWithLiveLr = \Illuminate\Support\Facades\DB::select("
            SELECT cs.id AS session_id, cs.StudentClassID, cs.SessionDate, cs.StartTime, cs.Status AS session_status,
                   sc.StudentID, sc.TeacherID, sc.Stop AS course_stop,
                   lr.id AS lr_id, lr.Status AS lr_status, lr.VoidedAt AS voided_at, lr.VoidReason AS void_reason
            FROM ClassSession cs
            JOIN StudentClass sc ON sc.ID = cs.StudentClassID
            JOIN LearningRecord lr ON lr.ClassSessionID = cs.id
            WHERE LOWER(cs.Status) IN ('leave','leave_adjusted')
              AND lr.VoidedAt IS NULL
              AND LOWER(lr.Status) <> 'approved'
          ");

          echo json_encode([
            "ok" => true,
            "live_condition_rows" => $rows,
            "orphaned_student_rows" => $orphaned,
            "still_voided_fillable" => $stillVoided,
            "ledger_files_tail" => $ledgerTail,
            "verify_ledger_lines" => $verifyLedgerLines,
            "verify_now_rc" => $verifyNowRc,
            "verify_now_out" => $verifyNowOut,
            "leave_with_live_lr_rows" => $leaveWithLiveLr,
            "generated_at" => gmdate("c"),
          ], JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE), PHP_EOL;
          PHP
          B64=$(base64 -w0 /tmp/lr_missing_probe.php)
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${PI_SSH_USER}@${PI_SSH_HOST}" \
            "B64='${B64}' bash -s" <<'REMOTE' | tee /tmp/lr-missing-diagnose.txt
          set -euo pipefail
          cd /home/admin/backend
          php -r 'file_put_contents("/tmp/lr_missing_probe.php", base64_decode(getenv("B64")));'
          php artisan tinker --execute='require "/tmp/lr_missing_probe.php";'
          rm -f /tmp/lr_missing_probe.php
          REMOTE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lr-missing-diagnose
          path: /tmp/lr-missing-diagnose.txt
          retention-days: 14

      - name: Job summary
        run: |
          {
            echo '### LR missing diagnose'
            echo '```'
            cat /tmp/lr-missing-diagnose.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
