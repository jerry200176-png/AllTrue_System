name: Release Tag

# #535 Phase 3.1/3.3 — 在「有 CHANGELOG 變更合併進 main」時，自動建立 CalVer tag + GitHub Release。
# 設計取捨（對齊業界、見 OPERATIONS_RUNBOOK §T）：
#  - 採 CalVer `vYYYY.MM.DD[.N]`（非 SemVer）：本系統是「持續部署的內部應用」而非對外版本化的
#    library/API，無 major/minor/patch 的相容性語意；日期制與既有 dated CHANGELOG 1:1 對應，
#    多次同日合併以 .2/.3 遞增。SemVer 適用於被他人依賴的 API/套件，這裡刻意不採。
#  - 觸發條件用「docs/CHANGELOG.md 變更」當 notable-release proxy（repo 慣例要求 production
#    變更必更新 CHANGELOG，presubmit CHECK 4 會提醒），避免對瑣碎 merge 都打 tag。
#  - 不碰 deploy.yml（事故 A 教訓：部署路徑高風險）；本工作流獨立、唯一副作用是建立 tag/release。
on:
  push:
    branches: ["main"]
    paths:
      - "docs/CHANGELOG.md"
  workflow_dispatch:

concurrency:
  group: release-tag
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Create CalVer tag + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build release notes + compute CalVer tag
        id: meta
        run: |
          set -euo pipefail
          chmod +x .github/scripts/changelog-latest.sh
          ./.github/scripts/changelog-latest.sh docs/CHANGELOG.md > release-notes.md

          HEADING=$(head -1 release-notes.md)
          DATE=$(printf '%s' "$HEADING" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1 || true)
          if [[ -z "$DATE" ]]; then
            echo "最新 CHANGELOG 節無日期標題，略過 release。heading=$HEADING"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE="v${DATE//-/.}"   # 2026-05-31 -> v2026.05.31
          git fetch --tags --force --quiet

          TAG="$BASE"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            n=2
            while git rev-parse -q --verify "refs/tags/${BASE}.${n}" >/dev/null; do
              n=$((n + 1))
            done
            TAG="${BASE}.${n}"
          fi

          # 清掉標題的 '## ' 與前綴 'YYYY-MM-DD — '，讓 Release 標題乾淨：vTAG — <type: title>
          CLEAN=$(printf '%s' "$HEADING" | sed 's/^## //' | sed 's/^[0-9-]\{10\} — //')

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG | title: $CLEAN"

      - name: Create annotated tag
        if: steps.meta.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.meta.outputs.tag }}" -m "${{ steps.meta.outputs.title }}"
          git push origin "${{ steps.meta.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "${{ steps.meta.outputs.tag }} — ${{ steps.meta.outputs.title }}" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}"
