name: Autonomous safe merge

# This workflow runs in the base-repository context and never checks out or
# executes pull-request code. It only reads the PR diff, classifies it using
# the classifier already on main, and asks GitHub to enable server-side
# auto-merge for T0/T1 work. GitHub still enforces the required status checks
# and branch rules before the merge is actually performed.
# Merge freeze: operations/merge-freeze.yaml on the base branch via the API, never
# the PR head; frozen, unreadable or malformed = hold. Every hold (freeze, higher
# tier after an `edited` body, failed classification) disarms an armed auto-merge.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: autonomous-safe-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Autonomous safe merge gate
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # Auto only when the freeze file positively says frozen: false; anything else holds.
      decision: ${{ steps.freeze.outputs.frozen == 'false' && steps.classify.outputs.decision || 'hold' }}
      tier: ${{ steps.classify.outputs.tier }}
      freeze_reason: ${{ steps.freeze.outputs.reason }}
    steps:
      - name: Checkout base revision only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Classify pull request without executing its code
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          PR_JSON_FILE="$(mktemp)"
          FILES_JSON_FILE="$(mktemp)"
          trap 'rm -f "$PR_JSON_FILE" "$FILES_JSON_FILE"' EXIT
          gh api "/repos/${REPO}/pulls/${PR_NUMBER}" > "$PR_JSON_FILE"
          gh api "/repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" --paginate --slurp > "$FILES_JSON_FILE"
          PR_JSON_FILE="$PR_JSON_FILE" FILES_JSON_FILE="$FILES_JSON_FILE" EVENT_HEAD_SHA="$EVENT_HEAD_SHA" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          from scripts.governance.autonomy_gate import (
              classify_scope,
              effective_tier,
              parse_declaration,
          )

          pr = json.loads(Path(os.environ["PR_JSON_FILE"]).read_text(encoding="utf-8"))
          pages = json.loads(Path(os.environ["FILES_JSON_FILE"]).read_text(encoding="utf-8"))
          files = []
          for page in pages if isinstance(pages, list) else []:
              files.extend(page if isinstance(page, list) else [page])

          if pr.get("head", {}).get("sha") != os.environ["EVENT_HEAD_SHA"]:
              raise SystemExit("PR head changed during evaluation; fail closed")

          paths = [item.get("filename", "") for item in files]
          patch = "\n".join(
              f"diff --git a/{item.get('filename', '')} b/{item.get('filename', '')}\n"
              f"{item.get('patch') or ''}"
              for item in files
          )
          scope = classify_scope(paths, patch)
          declared_risk, declared_tier = parse_declaration(pr.get("body") or "")
          tier, error = effective_tier(
              int(scope["machine_minimum_tier"]), declared_risk, declared_tier
          )

          output = Path(os.environ["GITHUB_OUTPUT"])
          if error:
              output.write_text(
                  f"decision=hold\ntier={scope['tier_name']}\n",
                  encoding="utf-8",
              )
              print(f"Autonomous merge held: {error}; machine tier={scope['tier_name']}")
          elif tier in (0, 1):
              output.write_text(f"decision=auto\ntier=T{tier}\n", encoding="utf-8")
              print(f"Autonomous merge eligible: T{tier}; required checks remain authoritative")
          else:
              output.write_text(f"decision=hold\ntier=T{tier}\n", encoding="utf-8")
              print(f"Autonomous merge held: T{tier} requires risk-appropriate review/protected handling")
          PY

      - name: Read merge freeze from the base branch (fail closed)
        id: freeze
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          node .github/scripts/merge-freeze.mjs "$REPO" "$BASE_REF" | tee -a "$GITHUB_OUTPUT"

  enable-auto-merge:
    permissions:
      contents: write
      pull-requests: write
      checks: read
    name: Enable GitHub auto-merge for safe PR
    needs: classify
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.decision == 'auto' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout base revision only (freeze reader)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Enable server-side squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          CURRENT_HEAD_SHA="$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [[ "$CURRENT_HEAD_SHA" != "$EVENT_HEAD_SHA" ]]; then
            echo "PR head changed before auto-merge; fail closed" >&2
            exit 1
          fi
          FREEZE="$(node .github/scripts/merge-freeze.mjs "$REPO" "$BASE_REF")"
          if [[ "$(sed -n 's/^frozen=//p' <<<"$FREEZE")" != "false" ]]; then
            echo "Merge freeze active right before arming; not arming ($FREEZE)"
            ARMED="$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}" --jq '.auto_merge != null')"
            if [[ "$ARMED" == "true" ]]; then
              gh pr merge "$PR_NUMBER" --repo "$REPO" --disable-auto
            fi
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --repo "$REPO" --auto --squash --delete-branch
          echo "GitHub will merge only after required checks and branch rules pass."

  disable-auto-merge:
    permissions:
      contents: write
      pull-requests: write
    name: Disarm auto-merge on hold
    needs: classify
    # Any hold, including a failed classification (fail closed). Not on cancel: a newer run owns the PR.
    if: ${{ !cancelled() && needs.classify.result != 'skipped' && (needs.classify.result != 'success' || needs.classify.outputs.decision != 'auto') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disable server-side auto-merge if armed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TIER: ${{ needs.classify.outputs.tier }}
          FREEZE_REASON: ${{ needs.classify.outputs.freeze_reason }}
        run: |
          set -euo pipefail
          armed() { gh api "/repos/${REPO}/pulls/${PR_NUMBER}" --jq '.auto_merge != null'; }
          echo "Hold: tier=${TIER:-unknown}; freeze=${FREEZE_REASON:-none}"
          state="$(armed)" # assignment so a failed read aborts (fail closed) instead of reading as "not armed"
          if [[ "$state" != "true" ]]; then
            echo "Auto-merge not enabled; nothing to disarm."
            exit 0
          fi
          # Tolerate a race where it was disarmed between the read and the call; fail if it stays armed.
          gh pr merge "$PR_NUMBER" --repo "$REPO" --disable-auto || true
          state="$(armed)"
          if [[ "$state" == "true" ]]; then
            echo "Auto-merge is still armed on a held PR; fail closed" >&2
            exit 1
          fi
          echo "Auto-merge disarmed."
