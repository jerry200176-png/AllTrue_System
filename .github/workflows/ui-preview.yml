# Per-PR preview of the whole app on Cloudflare Pages. Data: staging via the Pages Function
# (frontend/functions/api) when PREVIEW_API_ORIGIN is set on the Pages project, else in-browser mocks.
# Informational only: not a required check, no relation to the land queue.
name: ui-preview
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "frontend/**"
      - ".github/workflows/ui-preview.yml"
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: ui-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  parent-text-size:
    # Advisory only: isolated local built preview, no credentials, staging, deploy or PR comments.
    name: Parent text-size fake-data Playwright (advisory)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Verify smoke isolation and run built fake-data preview tests
        working-directory: frontend
        run: |
          node --test src/lib/parentTextSizeRouting.test.js
          npx playwright test -c e2e/parent-text-size-playwright.config.js
      - name: Upload fake-data test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parent-text-size-fake-data-evidence
          path: |
            frontend/test-results/
            frontend/work/parent-text-size-results.json
          if-no-files-found: warn
          retention-days: 14
  preview:
    # Forks get no secrets.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Build preview
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build:preview
      - name: Create Pages project (ignore if it exists)
        continue-on-error: true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.154.0"
          command: pages project create alltrue-preview --production-branch=main
      - name: Configure staging proxy (optional; mocks are the fallback)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_API_ORIGIN: ${{ vars.PREVIEW_API_ORIGIN }}
          PREVIEW_API_GATE_COOKIE: ${{ secrets.STAGING_GATE_COOKIE }}
          PREVIEW_DEMO_DIRECTOR_PASSWORD: ${{ secrets.PREVIEW_DEMO_DIRECTOR_PASSWORD }}
          PREVIEW_DEMO_TEACHER_PASSWORD: ${{ secrets.PREVIEW_DEMO_TEACHER_PASSWORD }}
          PREVIEW_DEMO_PARENT_STUDENT_ID: ${{ secrets.PREVIEW_DEMO_PARENT_STUDENT_ID }}
          PREVIEW_DEMO_PARENT_PHONE: ${{ secrets.PREVIEW_DEMO_PARENT_PHONE }}
        run: |
          set -euo pipefail
          # Branch deploys use the Pages preview env, which `pages secret put` cannot target: write it via the API (values from env, masked, never echoed).
          # Unset values go as null (deletes them), so removing a GitHub secret/variable restores mocks.
          [ -n "$PREVIEW_API_ORIGIN" ] && [ -n "$PREVIEW_API_GATE_COOKIE" ] || { PREVIEW_API_ORIGIN=; PREVIEW_API_GATE_COOKIE=; PREVIEW_DEMO_DIRECTOR_PASSWORD=; PREVIEW_DEMO_TEACHER_PASSWORD=; PREVIEW_DEMO_PARENT_STUDENT_ID=; PREVIEW_DEMO_PARENT_PHONE=; }
          export PREVIEW_API_ORIGIN PREVIEW_API_GATE_COOKIE PREVIEW_DEMO_DIRECTOR_PASSWORD PREVIEW_DEMO_TEACHER_PASSWORD PREVIEW_DEMO_PARENT_STUDENT_ID PREVIEW_DEMO_PARENT_PHONE
          for k in PREVIEW_API_ORIGIN PREVIEW_API_GATE_COOKIE PREVIEW_DEMO_DIRECTOR_PASSWORD PREVIEW_DEMO_TEACHER_PASSWORD PREVIEW_DEMO_PARENT_STUDENT_ID PREVIEW_DEMO_PARENT_PHONE; do
            v="${!k}"; [ -n "$v" ] && echo "::add-mask::$v"
          done
          python3 - > "$RUNNER_TEMP/pages-env.json" <<'PY'
          import json, os
          keys = ["PREVIEW_API_ORIGIN", "PREVIEW_API_GATE_COOKIE", "PREVIEW_DEMO_DIRECTOR_PASSWORD", "PREVIEW_DEMO_TEACHER_PASSWORD", "PREVIEW_DEMO_PARENT_STUDENT_ID", "PREVIEW_DEMO_PARENT_PHONE"]
          env_vars = {k: ({"type": "secret_text", "value": os.environ[k]} if os.environ.get(k) else None) for k in keys}
          print(json.dumps({"deployment_configs": {"preview": {"env_vars": env_vars}}}))
          PY
          code=$(curl -sS -o "$RUNNER_TEMP/pages-env.out" -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/pages-env.json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/alltrue-preview")
          rm -f "$RUNNER_TEMP/pages-env.json"
          [ "$code" = 200 ] || { echo "::warning::Pages env update failed (HTTP $code); preview may fall back to mocks"; }
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.154.0"
          workingDirectory: frontend
          command: pages deploy dist-preview --project-name=alltrue-preview --branch=pr-${{ github.event.pull_request.number }} --commit-dirty=true
      - name: Sticky PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          {
            echo "<!-- ui-preview -->"
            echo "**UI preview** for \`${SHA:0:7}\` (whole app, fake data)"
            echo
            echo "- [Open the app]($URL/)"
            echo "- Demo logins: [主任]($URL/?demo=director) · [老師]($URL/?demo=teacher) · [家長]($URL/?demo=parent)"
          } > body.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- ui-preview -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@body.md >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@body.md >/dev/null
          fi
