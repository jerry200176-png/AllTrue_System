name: In-app 319 class-sessions EXPLAIN probe (read-only)

# Read-only: EXPLAIN plus timed runs of the /class-sessions index query
# (ClassSessionIndexReadService::buildQuery + paginate, i.e. the count query and
# the page query) for the real Teacher Home request shapes and one campus-week.
# No writes, no row data in the output (plans, timings, table-size estimates).
# Decides between additive indexes and date-bounded subqueries for in-app #319 (#3069).
on:
  workflow_dispatch:
    inputs:
      branch_id:
        description: Campus ID for the campus-week shape (a busy campus)
        required: true
        default: "9"
        type: string
      teacher_id:
        description: Teacher User ID for the Teacher Home shapes (blank = busiest teacher this week)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: inapp-319-explain
  cancel-in-progress: false

jobs:
  probe:
    # Production SSH + inline Tinker: only the reviewed workflow on main may run.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned SSH trust helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/production-ssh-trust
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: EXPLAIN and time the index query
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          BRANCH_ID: ${{ inputs.branch_id }}
          TEACHER_ID: ${{ inputs.teacher_id }}
          # #3449 (same-day repair batching) must be live, or we would measure the old code.
          REQUIRED_REV: 15480e9de336f620647dd1b0d409c2f670f8dd7a
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "main only"; exit 1; }
          [[ "$BRANCH_ID" =~ ^[1-9][0-9]*$ ]] || { echo "invalid branch_id"; exit 1; }
          [[ -z "$TEACHER_ID" || "$TEACHER_ID" =~ ^[1-9][0-9]*$ ]] || { echo "invalid teacher_id"; exit 1; }
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${PI_SSH_USER}@${PI_SSH_HOST}" "BRANCH_ID='$BRANCH_ID' TEACHER_ID='$TEACHER_ID' REQUIRED_REV='$REQUIRED_REV' bash -s" <<'REMOTE' | tee explain.log
          set -euo pipefail
          cd /home/admin/backend
          PROD_HEAD=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$REQUIRED_REV" "$PROD_HEAD" || { echo "required revision not deployed (prod $PROD_HEAD)"; exit 1; }
          export BRANCH_ID TEACHER_ID PROD_HEAD
          php artisan tinker --execute='
          $db = \Illuminate\Support\Facades\DB::class;
          $today = \Carbon\Carbon::today();
          $teacher = (int)getenv("TEACHER_ID");
          if ($teacher < 1) {
              // Busiest effective teacher this week, using the endpoint own predicate (substitute wins over base teacher).
              $weekReq = \Illuminate\Http\Request::create("/api/v1/class-sessions", "GET", ["start" => $today->copy()->startOfWeek()->toDateString(), "end" => $today->copy()->endOfWeek()->toDateString()]);
              $weekReq->attributes->set("auth_role", "super_admin");
              $teacher = (int)(new \App\Services\ClassSessionIndexReadService())->buildQuery($weekReq)->reorder()
                  ->select($db::raw("COALESCE(sub_sched.teacher_id, sc.TeacherID) AS effective_teacher"))
                  ->groupBy("effective_teacher")->orderByRaw("COUNT(*) DESC")->value("effective_teacher");
          }
          $teacherCampuses = $db::table("UserCampus")->where("UserID", $teacher)->where("Approved", 1)->orderBy("CampusID")->pluck("CampusID")->map(fn ($c) => (int)$c)->all();
          $shapes = [
              "teacher_today" => ["role" => "teacher", "params" => ["start" => $today->toDateString(), "end" => $today->toDateString(), "per_page" => 500]],
          ];
          // Teacher Home sends one overdue request per campus.
          foreach ($teacherCampuses ?: [(int)getenv("BRANCH_ID")] as $campus) {
              $shapes["teacher_overdue_7d_campus_".$campus] = ["role" => "teacher", "params" => ["branch_id" => $campus, "start" => $today->copy()->subDays(7)->toDateString(), "end" => $today->copy()->subDay()->toDateString(), "per_page" => 200]];
          }
          $shapes["campus_week"] = ["role" => "super_admin", "params" => ["branch_id" => (int)getenv("BRANCH_ID"), "start" => $today->copy()->startOfWeek()->toDateString(), "end" => $today->copy()->endOfWeek()->toDateString(), "per_page" => 1000]];
          $out = [];
          foreach ($shapes as $name => $shape) {
              $runs = [];
              $logged = [];
              for ($i = 0; $i < 3; $i++) {
                  $req = \Illuminate\Http\Request::create("/api/v1/class-sessions", "GET", $shape["params"]);
                  $req->attributes->set("auth_role", $shape["role"]);
                  if ($shape["role"] === "teacher") {
                      $req->attributes->set("auth_teacher_id", $teacher);
                      $req->attributes->set("auth_campus_ids", $teacherCampuses);
                  }
                  $db::flushQueryLog();
                  $db::enableQueryLog();
                  $t = microtime(true);
                  $page = (new \App\Services\ClassSessionIndexReadService())->buildQuery($req)
                      ->orderBy("cs.SessionDate")->orderBy("cs.StartTime")->orderBy("cs.id")
                      ->paginate($shape["params"]["per_page"]);
                  $total = round((microtime(true) - $t) * 1000, 1);
                  $logged = $db::getQueryLog();
                  $db::disableQueryLog();
                  $runs[] = ["total_ms" => $total, "query_ms" => array_map(fn ($q) => $q["time"], $logged), "rows" => count($page->items()), "count" => $page->total()];
              }
              $plans = [];
              foreach ($logged as $k => $q) {
                  $plans["query_".$k] = array_map(fn ($r) => array_intersect_key((array)$r, array_flip(["id","select_type","table","type","possible_keys","key","rows","filtered","Extra"])),
                      $db::select("EXPLAIN ".$q["query"], $q["bindings"]));
              }
              $out[$name] = ["params" => $shape["params"], "runs" => $runs, "plans" => $plans];
          }
          $sizes = $db::table("information_schema.TABLES")->where("TABLE_SCHEMA", $db::getDatabaseName())
              ->whereIn("TABLE_NAME", ["ClassSession","schedules","LearningRecord","StudentSingIn","StudentClass"])
              ->pluck("TABLE_ROWS", "TABLE_NAME");
          echo "---EXPLAIN---", PHP_EOL;
          echo json_encode([
              "prod_head" => getenv("PROD_HEAD"),
              "db_version" => $db::selectOne("SELECT VERSION() AS v")->v,
              "teacher_id" => $teacher, "teacher_campus_count" => count($teacherCampuses),
              "table_rows_estimate" => $sizes, "shapes" => $out,
          ], JSON_UNESCAPED_UNICODE | JSON_PRETTY_PRINT), PHP_EOL;
          '
          REMOTE
      - name: Summary
        run: |
          { echo '### in-app 319 EXPLAIN'; echo '```json'; sed -n '/---EXPLAIN---/,$p' explain.log | tail -n +2; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
