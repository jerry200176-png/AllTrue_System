name: Yang 1445 contract move repair (manual, one case)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (default) or execute or rollback"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - execute
          - rollback
      confirm:
        description: "For execute/rollback only: type I_APPROVE_YANG_1445_MOVE_36285"
        required: false
        type: string
      actor:
        description: "Audit actor label"
        required: false
        default: "gha:yang-1445"
        type: string

concurrency:
  group: repair-yang-1445
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    name: Run allowlisted Yang 1445 repair
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout pinned SSH trust helper
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions/production-ssh-trust
          sparse-checkout-cone-mode: false
      - name: Configure pinned production SSH trust
        uses: ./.github/actions/production-ssh-trust
        with:
          host: ${{ secrets.PI_SSH_HOST || secrets.PI_HOST }}
          host-key: ${{ secrets.PI_HOST_KEY }}
      - name: Validate inputs
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          case "$MODE" in
            dry-run|execute|rollback) ;;
            *) echo "::error::invalid mode"; exit 1 ;;
          esac
          if [ "$MODE" != "dry-run" ]; then
            [ "$CONFIRM" = "I_APPROVE_YANG_1445_MOVE_36285" ] || {
              echo "::error::execute/rollback requires exact confirmation string"
              exit 1
            }
          fi

      - name: Setup SSH
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Run repair on production
        env:
          PI_SSH_USER: ${{ secrets.PI_SSH_USER }}
          PI_SSH_HOST: ${{ secrets.PI_SSH_HOST }}
          MODE: ${{ inputs.mode }}
          ACTOR: ${{ inputs.actor }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${PI_SSH_USER}@${PI_SSH_HOST}" \
            MODE="$MODE" ACTOR="$ACTOR" 'bash -s' <<'ENDSSH'
          set -euo pipefail
          cd /home/admin/backend

          echo "=== mode=${MODE} ==="
          echo "TIP: session_corrections (decision_reference repair-yang-1445) is authoritative. Red X after mutation != NOT_APPLIED."
          CMD="php artisan repair:yang-1445-contract-move"

          if [ "${MODE}" = "dry-run" ]; then
            $CMD
            echo "Dry-run complete; no production data was changed."
            exit 0
          fi

          if [ "${MODE}" = "rollback" ]; then
            export ALLOW_PROD_REPAIR=1
            $CMD --rollback --execute --force
            exit $?
          fi

          # execute: exact-state preflight first (ALREADY_APPLIED short-circuits, drift aborts)
          PRE=$($CMD 2>&1) || { echo "$PRE"; echo "REPAIR_STATE=NOT_APPLIED"; exit 1; }
          echo "$PRE"
          if echo "$PRE" | grep -q 'ALREADY APPLIED'; then
            echo "Refusing duplicate execute - correction ledger shows applied."
            exit 0
          fi

          TS=$(date '+%Y-%m-%d_%H%M%S')
          mkdir -p /home/admin/backups/emergency
          BACKUP_FILE="/home/admin/backups/emergency/db_pre_yang_1445_${TS}.sql.gz"
          DB_USER="$(grep '^DB_USERNAME=' /home/admin/backend/.env | cut -d= -f2-)"
          mysqldump -h 127.0.0.1 -u "$DB_USER" -p"$(grep '^DB_PASSWORD=' /home/admin/backend/.env | cut -d= -f2-)" \
            --single-transaction AllTrue \
            ClassSession StudentClass StudentSingIn LearningRecord session_deduction_ledger \
            class_session_reassignments session_corrections \
            | gzip > "$BACKUP_FILE"
          test -s "$BACKUP_FILE"
          echo "Backup: $BACKUP_FILE"

          export ALLOW_PROD_REPAIR=1
          set +e
          $CMD --execute --force --actor="${ACTOR}" --snapshot="storage/app/repair-snapshots/yang-1445-${TS}.json"
          MUT_EC=$?
          unset ALLOW_PROD_REPAIR
          # Independent post-verify (the command already verifies inside its transaction).
          $CMD --verify
          VER_EC=$?
          set -e
          if [ "$MUT_EC" -ne 0 ]; then
            echo "REPAIR_STATE=NOT_APPLIED_OR_FAILED mut=$MUT_EC"
            exit "$MUT_EC"
          fi
          if [ "$VER_EC" -ne 0 ]; then
            echo "REPAIR_STATE=APPLIED_POSTVERIFY_FAILED"
            echo "::warning::Mutation committed. Do NOT re-run execute; inspect session_corrections."
            exit 42
          fi
          echo "REPAIR_STATE=APPLIED_AND_VERIFIED"
          ENDSSH
