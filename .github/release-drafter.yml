name-template: "Draft release"
tag-template: "draft"
change-template: "- $TITLE (#$NUMBER)"
categories:
  - {title: "Features", labels: ["type:feature"]}
  - {title: "Fixes", labels: ["type:bug"]}
  - {title: "Security", labels: ["type:security", "area:security"]}
  - {title: "Design", labels: ["type:design"]}
  - {title: "Maintenance", labels: ["type:chore", "type:tech-debt", "type:docs"]}
template: |
  ## Changes

  $CHANGES
