# Labels as code (L2 of #4953). Synced to GitHub by .github/workflows/labels-sync.yml
# (EndBug/label-sync) on push to main. delete-other-labels is false: legacy labels stay.
#
# Legacy -> new mapping (legacy labels are NOT deleted or renamed here; no `aliases`):
#   kind:usability, kind:old-habit -> type:feature / type:bug (by triage), source:inapp
#   bug                            -> type:bug          enhancement -> type:feature
#   documentation                  -> type:docs         security    -> type:security
#   needs-triage                   -> status:triage     ready-for-agent -> status:ready
#   needs-founder                  -> status:needs-decision (+ source:founder)
#   hold                           -> status:blocked    high-priority -> priority:p1
#   platform, ops, ci-enforcement  -> area:ops / area:ci
#   in-app:logged, lifecycle:frozen, stale, ops-hygiene -> kept (bot/process state)
# Labels read by workflows or scripts (never remove): queue, release-note-none,
# intentional-revert, review-pending, batch-failed, phpstan-baseline-growth,
# htaccess-reviewed, risk-ack-no-test, in-app:logged, lifecycle:frozen, stale,
# and area:<family> created by bug-auto-intake.yml.

# --- type ---

- name: "type:bug"
  color: "7057ff"
  description: "Something is broken"

- name: "type:feature"
  color: "7057ff"
  description: "New capability"

- name: "type:chore"
  color: "7057ff"
  description: "Maintenance, no behavior change"

- name: "type:docs"
  color: "7057ff"
  description: "Documentation only"

- name: "type:security"
  color: "7057ff"
  description: "Security-relevant change or report"

- name: "type:epic"
  color: "7057ff"
  description: "Epic or umbrella issue"

- name: "type:tech-debt"
  color: "bfdadc"
  description: "Technical debt or maturity gap"

- name: "type:design"
  color: "c2e0c6"
  description: "設計品質與互動細節"

