services:
  # ── PHP-FPM (Laravel Application) ──────────────────────────────────
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alltrue-app
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - ./backend:/var/www
      - app-storage:/var/www/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - alltrue

  # ── Nginx (Web Server) ────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: alltrue-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - alltrue

  # ── MySQL (Database) ────────────────────────────────────────────────
  # Matches production (Pi runs MySQL, not Postgres) so `docker compose up`
  # actually catches what CI/production will see. See issue #868.
  mysql:
    image: mysql:8.0
    container_name: alltrue-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-alltrue}
      MYSQL_USER: ${DB_USERNAME:-alltrue}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - ./data/mysql:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME:-alltrue}", "-p${DB_PASSWORD:-secret}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - alltrue

networks:
  alltrue:
    driver: bridge

volumes:
  app-code:
    driver: local
  app-storage:
    driver: local
