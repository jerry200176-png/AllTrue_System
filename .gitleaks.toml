# Publication audit allowlist — CI placeholders and archived test keys only.
# Live secrets must never be added here; use scripts/security-filter-repo.sh instead.

title = "AllTrue publication gitleaks allowlist"

# Without [extend] a repo config replaces the default rules; with it the
# pinned defaults stay on and the rules below are added (#4022).
[extend]
useDefault = true

# Issued AI triage tokens: "<id>|alltrue_triage_<40 alnum>" (config/triage_tokens.php).
# The id is optional so a pasted bare secret is caught too; the bare prefix is not.
[[rules]]
id = "alltrue-triage-token"
description = "AllTrue read-only AI triage token"
regex = '''(?:\d+\|)?alltrue_triage_[A-Za-z0-9]{40}(?:[^A-Za-z0-9]|$)'''
keywords = ["alltrue_triage_"]

[allowlist]
description = "Known false positives after filter-repo + credential rotation"
paths = [
  '''\.github/workflows/ci\.yml''',
  '''backend/\.env\.testing''',
  '''docs/archive/control-plane-shadow-v1/''',
]
# generic-api-key false positives from the full-history scan of main (8 hits,
# 2026-10-15): domain identifiers next to a "key" word, not credentials. Each
# regex is anchored to the whole captured secret and admits only lowercase /
# dotted / UPPER_SNAKE identifier shapes, never a random-looking value.
regexes = [
  '''^syn\.[a-z]+(?:\.[a-z0-9-]+)+\.v[0-9]+$''',   # TrueFit material keys: syn.eng.phonics.short-vowels.v1
  '''^weekly_[0-9]+_segments$''',                    # TeacherEligibility pay component key
  '''^perfFlags\.[A-Z][A-Z0-9_]*$''',                # frontend feature-flag reference
  '''^promo-[a-z]+-[0-9]+$''',                       # GradePromotion test idempotency keys
]
