# W3 (#4953): local pre-push runs the fast presubmit checks, scoped to changed paths.
# Install: `npm ci` at the repo root (prepare script) or `npm run hooks:install`. Skip once: LEFTHOOK=0 git push.
# The list lives in scripts/agent-prepush.sh; agents get the same list on every `git push` through
# .claude/hooks/guard_bash.py, with no install. Heavy suites (PHPUnit, vitest, vite build) stay in CI.
pre-push:
  commands:
    agent-prepush:
      run: bash scripts/agent-prepush.sh
